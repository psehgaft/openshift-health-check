          'evidence': ((tc68_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc68_cmd.stderr | default(''))) if (tc68_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc68_cmd.rc | string) if tc68_cmd.rc is defined else ''))
