---
- name: Build workload probe coverage findings
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_workload_probe_findings.py"
    stdin: >-
      {{
        {
          'analysis_graph': (analysis_graph | default({})),
          'user_namespaces_exclude_regex': (user_namespaces_exclude_regex | default('')),
          'operator_managed_namespace_names': (operator_managed_namespace_names | default([])),
          'workload_probe_findings': (workload_probe_findings | default([]))
        } | to_json
      }}
  register: workload_probe_findings_cmd
  changed_when: false

- name: Normalize workload probe coverage findings
  vars:
    workload_probe_findings_result: "{{ (workload_probe_findings_cmd.stdout | from_json) if (workload_probe_findings_cmd.stdout | default('') | length > 0) else {} }}"
  ansible.builtin.set_fact:
    workload_probe_findings: "{{ workload_probe_findings_result.workload_probe_findings | default(workload_probe_findings | default([])) }}"
