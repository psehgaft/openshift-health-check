    managed_gates_source:
      name: managed-gates
      type: report-file
      mode: offline
      path: "{{ managed_gates_path }}"
      parser: parse_managed_gates.py
  ansible.builtin.set_fact:
    managed_gates_data: "{{ managed_gates_payload }}"
    evidence_sources: "{{ evidence_sources + ([managed_gates_source] if (managed_gates_parse_cmd.rc == 0 and (managed_gates_parse_cmd.stdout | default('') | trim | length > 0)) else []) }}"
    evidence_summary: "{{ evidence_summary | combine({'source_count': ((evidence_summary.source_count | default(0) | int) + (1 if (managed_gates_parse_cmd.rc == 0 and (managed_gates_parse_cmd.stdout | default('') | trim | length > 0)) else 0)), 'source_labels': ((evidence_summary.source_labels | default([])) + (['managed-gates'] if (managed_gates_parse_cmd.rc == 0 and (managed_gates_parse_cmd.stdout | default('') | trim | length > 0)) else [])), 'managed_gates_path': managed_gates_path}, recursive=True) }}"
    evidence_limitations: "{{ evidence_limitations | default([]) }}"
  when:
    - managed_gates_path | default('') | trim | length > 0
    - report_scope_requires_managed_gates_evidence | default(true) | bool

- name: Parse optional sosreport evidence
  ansible.builtin.command:
    argv: >-
      {{
        ['python3', playbook_dir ~ '/../scripts/parse_sosreport.py']
        + (sosreport_paths | default([]))
      }}
  register: sosreport_parse_cmd
  changed_when: false
  when:
    - (sosreport_paths | default([]) | length) > 0
    - report_scope_requires_sosreport_evidence | default(true) | bool

- name: Merge optional sosreport evidence
  vars:
    parsed_sosreport_data: "{{ (sosreport_parse_cmd.stdout | from_json) if (sosreport_parse_cmd.stdout | default('') | trim | length > 0) else {} }}"
    sosreport_sources: >-
      {{
        (parsed_sosreport_data.reports | default([]))
        | map('combine', {'name': 'sosreport', 'type': 'node-archive', 'mode': 'offline', 'parser': 'parse_sosreport.py'})
        | list
      }}
  ansible.builtin.set_fact:
    sosreport_data: "{{ parsed_sosreport_data }}"
    evidence_sources: "{{ evidence_sources + (sosreport_sources if (sosreport_parse_cmd.rc == 0 and (sosreport_parse_cmd.stdout | default('') | trim | length > 0)) else []) }}"
    evidence_summary: "{{ evidence_summary | combine({'source_count': ((evidence_summary.source_count | default(0) | int) + ((sosreport_sources | length) if (sosreport_parse_cmd.rc == 0 and (sosreport_parse_cmd.stdout | default('') | trim | length > 0)) else 0)), 'source_labels': ((evidence_summary.source_labels | default([])) + (['sosreport'] if ((sosreport_parse_cmd.rc == 0 and (sosreport_parse_cmd.stdout | default('') | trim | length > 0)) and ((sosreport_sources | length) > 0)) else [])), 'sosreport_count': (parsed_sosreport_data.summary.count | default(0))}, recursive=True) }}"
    evidence_limitations: "{{ evidence_limitations | default([]) }}"
  when:
    - (sosreport_paths | default([]) | length) > 0
    - report_scope_requires_sosreport_evidence | default(true) | bool

