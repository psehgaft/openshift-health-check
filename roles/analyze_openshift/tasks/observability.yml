            'reason': final_status,
            'capability_profile_related_capabilities': (spec.related_capabilities | default([])),
            'capability_profile_expected_live': expected_live
          } -%}
        {%- endif -%}
        {%- set _ = resolved.update({name: entry}) -%}
      {%- endfor -%}
