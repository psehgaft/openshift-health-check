---
- name: Read persisted OpenShift report payload artifact
  ansible.builtin.slurp:
    src: "{{ report_run_workspace_report_dir }}/payload.json"
  register: openshift_report_payload_artifact_slurp

- name: Restore persisted OpenShift report payload artifact facts
  vars:
    restored_payload: "{{ (openshift_report_payload_artifact_slurp.content | b64decode | from_json) if (openshift_report_payload_artifact_slurp.content is defined) else {} }}"
    restored_domains: "{{ restored_payload.domains | default({}) }}"
    restored_supportability: "{{ restored_payload.supportability | default({}) }}"
    restored_audit: "{{ restored_payload.audit | default({}) }}"
    restored_execution_stats: "{{ restored_payload.execution_stats | default({}) }}"
  ansible.builtin.set_fact:
    openshift_report_payload_artifact: "{{ restored_payload }}"
    openshift_report_payload_common: "{{ restored_payload }}"
    supportability_report_payload: "{{ restored_payload }}"
    audit_report: "{{ restored_payload }}"
    execution_stats: "{{ restored_execution_stats | default(execution_stats | default({})) }}"
    health_summary: "{{ restored_payload.health_summary | default(health_summary | default({})) }}"
    cluster_profile: "{{ restored_payload.cluster_profile | default(cluster_profile | default({})) }}"
    cluster_current_state: "{{ restored_payload.cluster_current_state | default(cluster_current_state | default({})) }}"
    openshift_report_domain_payload: "{{ restored_payload.domains | default(openshift_report_domain_payload | default({})) }}"
    suggested_next_steps: "{{ restored_payload.suggested_next_steps | default(suggested_next_steps | default([])) }}"
    audit_checks: "{{ restored_audit.checks | default(audit_checks | default([])) }}"
    audit_critical_checks: "{{ restored_audit.critical_checks | default(audit_critical_checks | default([])) }}"
    audit_warning_checks: "{{ restored_audit.warning_checks | default(audit_warning_checks | default([])) }}"
    audit_score_total: "{{ restored_audit.score_total | default(audit_score_total | default(0)) }}"
    audit_score_max: "{{ restored_audit.score_max | default(audit_score_max | default(0)) }}"
    cluster_health_score: "{{ restored_audit.cluster_health_score | default(cluster_health_score | default(0)) }}"
    cluster_health_score_label: "{{ restored_audit.cluster_health_score_label | default(cluster_health_score_label | default('unknown')) }}"
    cluster_health_score_legend: "{{ restored_audit.cluster_health_score_legend | default(cluster_health_score_legend | default([])) }}"
    supportability_summary: "{{ restored_supportability.summary | default(supportability_summary | default({})) }}"
    auth_posture_summary: "{{ restored_domains.security_and_governance.auth_posture_summary | default(auth_posture_summary | default({})) }}"
    day2_posture_summary: "{{ restored_domains.production_day2_readiness.day2_posture_summary | default(day2_posture_summary | default({})) }}"
    declarative_operations_summary: "{{ restored_domains.declarative_operations.declarative_operations_summary | default(restored_domains.production_day2_readiness.declarative_operations_summary | default(declarative_operations_summary | default({}))) }}"
    backup_recovery_summary: "{{ restored_domains.storage_and_resilience.summary | default(backup_recovery_summary | default({})) }}"
    observability_summary: "{{ restored_domains.observability.summary | default(observability_summary | default({})) }}"
    observability_forwarding_summary: "{{ restored_domains.observability.forwarding_summary | default(observability_forwarding_summary | default({})) }}"
    security_governance_summary: "{{ restored_domains.security_and_governance.summary | default(security_governance_summary | default({})) }}"
    workload_summary: "{{ restored_domains.workload_health.summary | default(workload_summary | default({})) }}"
    architecture_lifecycle_summary: "{{ restored_domains.upgrade_and_lifecycle_risk.architecture_lifecycle_summary | default(architecture_lifecycle_summary | default({})) }}"
    upgrade_readiness_summary: "{{ restored_domains.upgrade_and_lifecycle_risk.upgrade_readiness_summary | default(upgrade_readiness_summary | default({})) }}"
    day2_readiness_summary: "{{ restored_domains.production_day2_readiness.day2_production_readiness_summary | default(day2_readiness_summary | default({})) }}"
    supportability_node_diagnostics_summary: "{{ restored_domains.evidence_and_supportability.node_diagnostics_summary | default(supportability_node_diagnostics_summary | default({})) }}"
    node_diagnostics_summary: "{{ restored_domains.evidence_and_supportability.node_diagnostics_summary | default(node_diagnostics_summary | default({})) }}"
    managed_gate_summary: "{{ restored_domains.upgrade_and_lifecycle_risk.managed_gate_summary | default(managed_gate_summary | default({})) }}"
    reference_compliance_summary: "{{ restored_domains.upgrade_and_lifecycle_risk.reference_compliance_summary | default(reference_compliance_summary | default({})) }}"
    advisor_summary: "{{ restored_domains.evidence_and_supportability.advisor_summary | default(advisor_summary | default({})) }}"
    insights_archive_summary: "{{ restored_domains.evidence_and_supportability.insights_archive_summary | default(insights_archive_summary | default({})) }}"
    omc_summary: "{{ restored_domains.platform_health.omc_summary | default(omc_summary | default({})) }}"
    etcd_ocp_diag_summary: "{{ restored_domains.platform_health.etcd_ocp_diag_summary | default(etcd_ocp_diag_summary | default({})) }}"
