---
# ==============================================================================
# Section 2: OpenShift Administration (TC 23 to TC 31)
# ==============================================================================

# TC 23: Create Namespace (Project)
- name: "TC-23: Create Namespace (Project)"
  when: run_tc23_create_namespace | default(true) | bool
  block:
    - name: "TC-23: Create test project testproject"
      ansible.builtin.command: oc new-project testproject --description="ATP Test Project"
      register: tc23_cmd
      changed_when: false
      failed_when: false

    - name: "TC-23: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-23',
          'name': 'Create Namespace (Project)',
          'category': 'OpenShift Administration',
          'expected': 'Project testproject created successfully',
          'status': ('Pass' if (tc23_cmd.rc == 0 or 'AlreadyExists' in tc23_cmd.stderr) else 'Fail'),
          'procedure': (tc23_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc23_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc23_cmd.stderr | default(''))) if (tc23_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc23_cmd.rc | string) if tc23_cmd.rc is defined else '')),
          'details': tc23_cmd.stdout | default(tc23_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc23', 'administration']

# TC 24: Create Limit Range in OCP Default Project
- name: "TC-24: Create Limit Range in OCP Default Project"
  when: run_tc24_create_limitrange | default(true) | bool
  block:
    - name: "TC-24: Apply LimitRange manifest"
      ansible.builtin.shell: |
        cat <<EOF | oc apply -n default -f -
        apiVersion: "v1"
        kind: "LimitRange"
        metadata:
          name: "test-resource-limits"
          namespace: default
        spec:
          limits:
            - type: "Container"
              max:
                cpu: "2"
                memory: "1Gi"
              min:
                cpu: "100m"
                memory: "4Mi"
              default:
                cpu: "300m"
                memory: "200Mi"
              defaultRequest:
                cpu: "200m"
                memory: "100Mi"
              maxLimitRequestRatio:
                cpu: "10"
        EOF
      register: tc24_cmd
      changed_when: false
      failed_when: false

    - name: "TC-24: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-24',
          'name': 'Create Limit Range in OCP Default Project',
          'category': 'OpenShift Administration',
          'expected': 'LimitRange test-resource-limits created in default namespace',
          'status': ('Pass' if tc24_cmd.rc == 0 else 'Fail'),
          'procedure': (tc24_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc24_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc24_cmd.stderr | default(''))) if (tc24_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc24_cmd.rc | string) if tc24_cmd.rc is defined else '')),
          'details': tc24_cmd.stdout | default(tc24_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc24', 'administration']

# TC 25: Create Resource Quota in OCP Default Project
- name: "TC-25: Create Resource Quota in OCP Default Project"
  when: run_tc25_create_resourcequota | default(true) | bool
  block:
    - name: "TC-25: Apply ResourceQuota manifest"
      ansible.builtin.shell: |
        cat <<EOF | oc apply -n default -f -
        apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: compute-resources
        spec:
          hard:
            pods: "4"
            requests.cpu: "1"
            requests.memory: 1Gi
            requests.ephemeral-storage: 2Gi
            limits.cpu: "2"
            limits.memory: 2Gi
            limits.ephemeral-storage: 4Gi
        EOF
      register: tc25_cmd
      changed_when: false
      failed_when: false

    - name: "TC-25: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-25',
          'name': 'Create Resource Quota in OCP Default Project',
          'category': 'OpenShift Administration',
          'expected': 'ResourceQuota compute-resources applied to default namespace',
          'status': ('Pass' if tc25_cmd.rc == 0 else 'Fail'),
          'procedure': (tc25_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc25_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc25_cmd.stderr | default(''))) if (tc25_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc25_cmd.rc | string) if tc25_cmd.rc is defined else '')),
          'details': tc25_cmd.stdout | default(tc25_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc25', 'administration']

# TC 26: Sanity Reboot (Disruptive)
- name: "TC-26: Sanity Reboot"
  block:
    - name: "TC-26: Check if Sanity Reboot should run"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-26',
          'name': 'Sanity Reboot',
          'category': 'OpenShift Administration',
          'expected': 'Cluster nodes reboot and return to Ready state',
          'status': 'Skipped',
          'procedure': 'Manual only: follow the approved cluster reboot runbook and record operator-run evidence.',
          'evidence': 'No command executed by this playbook. Attach evidence from the approved manual procedure if performed.',
          'details': 'Manual and disruptive; the ATP does not automate cluster-wide reboot.'
        }] }}"
  tags: ['general', 'telco', 'tc26', 'administration']

