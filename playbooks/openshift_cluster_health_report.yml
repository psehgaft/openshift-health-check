---
- name: Generate an OpenShift cluster health report
  hosts: local
  gather_facts: true
  vars:
    platform_family: openshift
    provider_family: generic
    cluster_profile_mode: auto
    kube_cli: oc
    report_mode: auto
    report_output_dir: "{{ playbook_dir }}/../reports"
    report_basename: "cluster-report"
    report_generate_html: true
    report_generate_pdf: true
    report_run_mode: fresh
    report_artifact_schema_version: "1"
    report_repo_contract_version: "openshift-artifact-workspace-v1"
    collect_live_support_artifacts: true
    live_support_collection_profile: all
    allow_mutating_live_collectors: true
    collect_live_must_gather: true
    collect_live_inspect: true
    collect_live_cluster_compare: true
    collect_live_insights_archive: true
    collect_live_sosreport: true
    collect_live_managed_gates: false
    collect_live_advisor_export: false
    collection_parallelism: 4
    rbac_check_service_account_namespace: openshift-health-check
    rbac_check_service_account_name: health-check-runner
    rbac_check_fail_on_gap: false
    local_resource_budget_cpu_pct: 50
    local_resource_budget_mem_pct: 50
    collection_command_timeout_seconds: 300
    keep_collection_artifacts: false
    warning_event_limit: 20
    top_restart_pod_limit: 15
    top_alert_group_limit: 15
    top_event_reason_limit: 15
    top_namespace_issue_limit: 15
    top_pvc_issue_limit: 25
    top_workload_issue_limit: 25
    top_security_issue_limit: 25
    top_certificate_issue_limit: 20
    require_cluster_log_forwarder: false
    require_external_metrics_remote_write: false
    warn_on_ingress_without_class: false
    cluster_health_profile_source_path: "{{ playbook_dir }}/../inputs/openshift-cluster-health-profile.yml"
    cluster_health_profile_override_source_path: ""
    selected_postures: ""
    selected_capabilities: ""
    case_bundle_path: ""
    must_gather_path: ""
    cluster_compare_path: ""
    managed_gates_path: ""
    inspect_path: ""
    control_plane_backup_search_paths:
      - "/home/core/assets/backup"
      - "/var/lib/etcd-backup"
      - "/var/backups/etcd"
      - "/opt/backups/etcd"
    sosreport_paths: []
    advisor_export_path: ""
    insights_archive_path: ""
    write_redaction_manifest: false
    redaction_manifest_path: ""
    write_redacted_bundle: false
    redacted_bundle_output_dir: ""
    platform_namespaces_regex: "^(default|openshift|openshift-.*|kube-system|kube-public|kube-node-lease|kube-.*|kubernetes-.*)$"
    user_namespaces_exclude_regex: "^(default|openshift|openshift-.*|kube-system|kube-public|kube-node-lease|kube-.*|kubernetes-.*)$"
    etcd_wal_fsync_p99_warn_ms: 10
    etcd_peer_rtt_p99_warn_ms: 50
    controlplane_to_worker_latency_warn_ms: 20
    worker_to_worker_latency_warn_ms: 20
    apiserver_latency_p99_warn_seconds: 1
    pod_density_warn_pct: 80
    pod_density_critical_pct: 90
    certificate_expiry_warn_days: 30
    certificate_expiry_critical_days: 7
    prom_queries:
      firing_alerts: 'ALERTS{alertstate="firing"}'
      etcd_wal_fsync_p99_ms: 'histogram_quantile(0.99, sum by (le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))) * 1000'
      etcd_backend_commit_p99_ms: 'histogram_quantile(0.99, sum by (le) (rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))) * 1000'
      etcd_leader_changes_5m: 'sum(increase(etcd_server_leader_changes_seen_total[5m]))'
      etcd_members_reporting_leader: 'sum(etcd_server_has_leader)'
      etcd_leader_count: 'sum(etcd_server_is_leader)'
      etcd_peer_rtt_p99_ms: 'histogram_quantile(0.99, sum by (le) (rate(etcd_network_peer_round_trip_time_seconds_bucket[5m]))) * 1000'
      controlplane_to_worker_network_latency_ms: ''
      worker_to_worker_network_latency_ms: ''
      apiserver_request_p99_seconds: 'histogram_quantile(0.99, sum by (le) (rate(apiserver_request_duration_seconds_bucket{verb!~"WATCH|LIST"}[5m])))'
      apiserver_request_5xx_rate: 'sum(rate(apiserver_request_total{code=~"5.."}[5m]))'
      apiserver_request_read_rate: 'sum(rate(apiserver_request_total{verb=~"GET|LIST|WATCH"}[5m]))'
      apiserver_request_write_rate: 'sum(rate(apiserver_request_total{verb!~"GET|LIST|WATCH"}[5m]))'
      apiserver_current_read_inflight: 'sum(apiserver_current_inflight_requests{request_kind="read"})'
      apiserver_current_write_inflight: 'sum(apiserver_current_inflight_requests{request_kind="mutating"})'
      apiserver_storage_objects_total: 'sum(apiserver_storage_objects)'
      node_cpu_utilization: '100 * (1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m]) * on(instance) group_left(node) label_replace(node_uname_info, "node", "$1", "nodename", "(.*)")))'
      node_memory_utilization: '100 * (1 - (sum by (node) (node_memory_MemAvailable_bytes * on(instance) group_left(node) label_replace(node_uname_info, "node", "$1", "nodename", "(.*)")) / sum by (node) (node_memory_MemTotal_bytes * on(instance) group_left(node) label_replace(node_uname_info, "node", "$1", "nodename", "(.*)"))))'
      node_disk_utilization: 'max by (node) (100 * (1 - ((node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|nsfs|squashfs"} * on(instance) group_left(node) label_replace(node_uname_info, "node", "$1", "nodename", "(.*)")) / (node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|nsfs|squashfs"} * on(instance) group_left(node) label_replace(node_uname_info, "node", "$1", "nodename", "(.*)")))))'
      kubelet_pod_density: '100 * (sum by (node) (kubelet_running_pods) / sum by (node) (kube_node_status_allocatable{resource="pods"}))'
      top_pod_cpu_usage: 'topk(20, sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!="",pod!="",namespace!~"openshift-.*"}[5m])))'
      top_pod_memory_usage: 'topk(20, sum by (namespace,pod) (container_memory_working_set_bytes{container!="",pod!="",namespace!~"openshift-.*"}))'
      pod_cpu_usage_all: 'sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!="",pod!="",namespace!~"openshift-.*"}[5m]))'
      pod_memory_usage_all: 'sum by (namespace,pod) (container_memory_working_set_bytes{container!="",pod!="",namespace!~"openshift-.*"})'
  tasks:
    - name: Load OpenShift cluster health profile
      ansible.builtin.include_vars:
        file: "{{ cluster_health_profile_source_path }}"
        name: built_in_cluster_health_profile

    - name: Resolve optional cluster health profile override path
      ansible.builtin.set_fact:
        cluster_health_profile_override_source_path_resolved: >-
          {{
            ''
            if (cluster_health_profile_override_source_path | default('') | trim | length) == 0
            else (
              cluster_health_profile_override_source_path
              if (cluster_health_profile_override_source_path | regex_search('^/'))
              else (playbook_dir ~ '/../' ~ cluster_health_profile_override_source_path)
            )
          }}

    - name: Load optional cluster health profile override
      ansible.builtin.include_vars:
        file: "{{ cluster_health_profile_override_source_path_resolved }}"
        name: cluster_health_profile_override_payload
      when: cluster_health_profile_override_source_path_resolved | default('') | trim | length > 0

    - name: Resolve OpenShift cluster health profile
      ansible.builtin.set_fact:
        cluster_health_profile: >-
          {{
            (built_in_cluster_health_profile.cluster_health_profile | default({}))
            | combine(
                ((cluster_health_profile_override_payload | default({})).get('cluster_health_profile', {})),
                recursive=True
              )
          }}

    - name: Resolve unified OpenShift report mode
      ansible.builtin.set_fact:
        report_mode_resolved: >-
          {{
            ('collected' if report_mode == 'offline' else report_mode)
            if (report_mode | default('auto')) != 'auto'
            else (
              'collected'
              if (
                (case_bundle_path | default('') | trim | length > 0)
                or (must_gather_path | default('') | trim | length > 0)
                or (inspect_path | default('') | trim | length > 0)
                or (cluster_compare_path | default('') | trim | length > 0)
                or (managed_gates_path | default('') | trim | length > 0)
                or (advisor_export_path | default('') | trim | length > 0)
                or ((sosreport_paths | default([])) | length > 0)
              )
              else 'live'
            )
          }}

    - name: Validate unified OpenShift report mode
      ansible.builtin.assert:
        that:
          - report_mode_resolved in ['live', 'collected']
        fail_msg: "Set report_mode to auto, live, collected, or offline."

    - name: Validate OpenShift API surface
      ansible.builtin.command:
        argv:
          - "{{ kube_cli }}"
          - get
          - clusterversion
          - version
          - -o
          - name
      register: openshift_api_probe
      changed_when: false
      failed_when: false
      when: report_mode_resolved == 'live'

    - name: Fail when the OpenShift playbook is pointed at a non-OpenShift live cluster
      ansible.builtin.fail:
        msg: >-
          This playbook requires OpenShift cluster APIs and the OpenShift report contract.
          The current live cluster did not expose `clusterversion/version`, so use the matching Kubernetes or provider playbook under `playbooks/` instead.
      when:
        - report_mode_resolved == 'live'
        - (openshift_api_probe.rc | default(1) | int) != 0

    - name: Define run checkpoint paths
      ansible.builtin.set_fact:
        report_resume_state_dir: "{{ report_output_dir }}/.run-state/{{ platform_family }}"
        report_resume_manifest_path: "{{ report_output_dir }}/.run-state/{{ platform_family }}/{{ report_mode_resolved }}-latest.json"
        report_run_workspace_root: "{{ report_output_dir }}/.run-state/{{ platform_family }}"
        report_run_workspace_dir: "{{ report_output_dir }}/.run-state/{{ platform_family }}/{{ report_mode_resolved }}-artifacts"
        report_run_workspace_manifest_path: "{{ report_output_dir }}/.run-state/{{ platform_family }}/{{ report_mode_resolved }}-artifacts/manifest.json"
        report_run_workspace_shared_dir: "{{ report_output_dir }}/.run-state/{{ platform_family }}/{{ report_mode_resolved }}-artifacts/shared"
        report_run_workspace_postures_dir: "{{ report_output_dir }}/.run-state/{{ platform_family }}/{{ report_mode_resolved }}-artifacts/postures"
        report_run_workspace_capabilities_dir: "{{ report_output_dir }}/.run-state/{{ platform_family }}/{{ report_mode_resolved }}-artifacts/capabilities"
        report_run_workspace_report_dir: "{{ report_output_dir }}/.run-state/{{ platform_family }}/{{ report_mode_resolved }}-artifacts/report"
        report_run_id: "{{ platform_family }}-{{ report_mode_resolved }}-{{ ansible_date_time.iso8601_basic_short }}"

    - name: Reset prior run checkpoint state for fresh run
      ansible.builtin.file:
        path: "{{ report_resume_state_dir }}"
        state: absent
      when: report_run_mode | default('fresh') == 'fresh'

    - name: Validate supported run mode
      ansible.builtin.assert:
        that:
          - (report_run_mode | default('fresh')) in ['fresh', 'resume_last_failure']
        fail_msg: "Set report_run_mode to fresh or resume_last_failure."

    - name: Check for resumable manifest
      ansible.builtin.stat:
        path: "{{ report_resume_manifest_path }}"
      register: report_resume_manifest_stat
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Fail when resume manifest is missing
      ansible.builtin.assert:
        that:
          - report_resume_manifest_stat.stat.exists
        fail_msg: "No resumable checkpoint manifest was found. Use report_run_mode=fresh first."
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Load resume manifest
      ansible.builtin.slurp:
        path: "{{ report_resume_manifest_path }}"
      register: report_resume_manifest_raw
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Decode resume manifest
      ansible.builtin.set_fact:
        report_resume_manifest_parse:
          ok: true
          data: "{{ report_resume_manifest_raw.content | b64decode | from_yaml }}"
          error: ""
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Set resume manifest data
      ansible.builtin.set_fact:
        report_resume_manifest: "{{ report_resume_manifest_parse.data if (report_resume_manifest_parse.ok | default(false)) else {} }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Restore run workspace metadata from resume manifest
      ansible.builtin.set_fact:
        report_run_id: "{{ report_resume_manifest.run_id | default(report_run_id) }}"
        report_run_workspace_dir: "{{ report_resume_manifest.run_workspace_dir | default(report_run_workspace_dir) }}"
        report_run_workspace_manifest_path: "{{ report_resume_manifest.run_workspace_manifest_path | default(report_run_workspace_manifest_path) }}"
        report_run_workspace_shared_dir: "{{ report_resume_manifest.run_workspace_shared_dir | default(report_run_workspace_shared_dir) }}"
        report_run_workspace_postures_dir: "{{ report_resume_manifest.run_workspace_postures_dir | default(report_run_workspace_postures_dir) }}"
        report_run_workspace_capabilities_dir: "{{ report_resume_manifest.run_workspace_capabilities_dir | default(report_run_workspace_capabilities_dir) }}"
        report_run_workspace_report_dir: "{{ report_resume_manifest.run_workspace_report_dir | default(report_run_workspace_report_dir) }}"
        report_workspace_completed_artifacts: "{{ report_resume_manifest.completed_artifacts | default([]) }}"
        report_workspace_failed_artifacts: "{{ report_resume_manifest.failed_artifacts | default([]) }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Validate resume manifest JSON
      ansible.builtin.assert:
        that:
          - report_resume_manifest_parse.ok | default(false)
        fail_msg: "The resume manifest exists but could not be parsed. {{ report_resume_manifest_parse.error | default('Unknown parse error.') }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Validate resume manifest content
      ansible.builtin.assert:
        that:
          - (report_resume_manifest.status | default('')) in ['failed', 'completed']
          - (report_resume_manifest.report_mode | default('')) == report_mode_resolved
          - (report_resume_manifest.snapshot_path | default('') | length) > 0
          - (report_resume_manifest.resume_next_stage | default('') | length) > 0
        fail_msg: "The last saved checkpoint is not resumable for this report mode. Use report_run_mode=fresh."
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Preserve resolved OpenShift cluster health profile before selector scoping
      ansible.builtin.set_fact:
        cluster_health_profile_unscoped: "{{ cluster_health_profile | default({}) }}"

    - name: Resolve requested selector sources for this run
      ansible.builtin.set_fact:
        selected_postures_source: >-
          {{
            (selected_postures | default(''))
            if (
              ((selected_postures | default('')) is sequence and (selected_postures | default('')) is not string and ((selected_postures | default('')) | length) > 0)
              or ((selected_postures | default('')) is string and ((selected_postures | default('') | trim | length) > 0))
            )
            else (
              report_resume_manifest.selected_postures
              if (
                (report_run_mode | default('fresh')) == 'resume_last_failure'
                and (report_resume_manifest.selected_postures | default([]) | length) > 0
              )
              else []
            )
          }}
        selected_capabilities_source: >-
          {{
            (selected_capabilities | default(''))
            if (
              ((selected_capabilities | default('')) is sequence and (selected_capabilities | default('')) is not string and ((selected_capabilities | default('')) | length) > 0)
              or ((selected_capabilities | default('')) is string and ((selected_capabilities | default('') | trim | length) > 0))
            )
            else (
              report_resume_manifest.selected_capabilities
              if (
                (report_run_mode | default('fresh')) == 'resume_last_failure'
                and (report_resume_manifest.selected_capabilities | default([]) | length) > 0
              )
              else []
            )
          }}

    - name: Normalize requested posture and capability selectors
      ansible.builtin.set_fact:
        selected_postures_list: >-
          {{
            (
              selected_postures_source
              if (selected_postures_source is sequence and selected_postures_source is not string)
              else (selected_postures_source | default('') | split(','))
            )
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | unique
            | list
          }}
        selected_capabilities_list: >-
          {{
            (
              selected_capabilities_source
              if (selected_capabilities_source is sequence and selected_capabilities_source is not string)
              else (selected_capabilities_source | default('') | split(','))
            )
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | unique
            | list
          }}

    - name: Compute effective selector scope
      vars:
        requested_posture_unknown: "{{ selected_postures_list | difference((cluster_health_profile_unscoped.get('postures', {}) | default({}) | dict2items | map(attribute='key') | list)) }}"
        requested_capability_unknown: "{{ selected_capabilities_list | difference((cluster_health_profile_unscoped.get('capabilities', {}) | default({}) | dict2items | map(attribute='key') | list)) }}"
        requested_posture_disabled: >-
          {%- set disabled = [] -%}
          {%- for key in selected_postures_list -%}
          {%-   if not (cluster_health_profile_unscoped.get('postures', {}).get(key, {}).get('enabled', false)) -%}
          {%-     set _ = disabled.append(key) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ disabled }}
        requested_capability_disabled: >-
          {%- set disabled = [] -%}
          {%- for key in selected_capabilities_list -%}
          {%-   if not (cluster_health_profile_unscoped.get('capabilities', {}).get(key, {}).get('enabled', false)) -%}
          {%-     set _ = disabled.append(key) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ disabled }}
        selector_active: "{{ ((selected_postures_list | length) + (selected_capabilities_list | length)) > 0 }}"
        posture_execution_dependency_map:
          capacity_planning_snapshot:
            - platform_architecture_and_lifecycle
          day2_production_readiness:
            - platform_architecture_and_lifecycle
            - backup_and_disaster_recovery
            - observability
            - security_and_governance
            - declarative_operations
        capability_execution_dependency_map: {}
        effective_selected_postures_computed: >-
          {{
            (
              selected_postures_list
              + (['day2_production_readiness'] if (selected_capabilities_list | length) > 0 else [])
            )
            | unique
            | list
          }}
        effective_execution_postures_computed: >-
          {%- set auto_included_postures = (['day2_production_readiness'] if (selected_capabilities_list | length) > 0 else []) -%}
          {%- set ns = namespace(postures=((selected_postures_list + auto_included_postures) | unique | list)) -%}
          {%- for key in selected_postures_list | unique | list -%}
            {%- for dep in (posture_execution_dependency_map.get(key, [])) -%}
              {%- if dep not in ns.postures -%}
                {%- set _ = ns.postures.append(dep) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {%- for key in selected_capabilities_list | unique | list -%}
            {%- for dep in (capability_execution_dependency_map.get(key, [])) -%}
              {%- if dep not in ns.postures -%}
                {%- set _ = ns.postures.append(dep) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ ns.postures }}
      ansible.builtin.set_fact:
        report_requested_postures: "{{ selected_postures_list }}"
        report_requested_capabilities: "{{ selected_capabilities_list }}"
        report_unknown_postures: "{{ requested_posture_unknown }}"
        report_unknown_capabilities: "{{ requested_capability_unknown }}"
        report_disabled_postures: "{{ requested_posture_disabled }}"
        report_disabled_capabilities: "{{ requested_capability_disabled }}"
        report_selector_scope_active: "{{ selector_active | bool }}"
        report_effective_selected_postures: "{{ effective_selected_postures_computed }}"
        report_execution_selected_postures: "{{ effective_execution_postures_computed }}"
        report_effective_selected_capabilities: "{{ selected_capabilities_list }}"
        report_effective_section_scope:
          postures: "{{ effective_selected_postures_computed }}"
          capabilities: "{{ selected_capabilities_list }}"

    - name: Validate requested posture and capability selectors
      ansible.builtin.assert:
        that:
          - (report_unknown_postures | default([]) | length) == 0
          - (report_unknown_capabilities | default([]) | length) == 0
          - (report_disabled_postures | default([]) | length) == 0
          - (report_disabled_capabilities | default([]) | length) == 0
          - (not (report_selector_scope_active | default(false) | bool)) or (((report_effective_selected_postures | default([]) | length) + (report_effective_selected_capabilities | default([]) | length)) > 0)
        fail_msg: >-
          Invalid selective execution request.
          unknown postures={{ report_unknown_postures | default([]) }},
          unknown capabilities={{ report_unknown_capabilities | default([]) }},
          disabled postures={{ report_disabled_postures | default([]) }},
          disabled capabilities={{ report_disabled_capabilities | default([]) }}.

    - name: Apply selector-scoped OpenShift cluster health profile
      vars:
        scoped_postures: >-
          {%- set scoped = {} -%}
          {%- for item in (cluster_health_profile_unscoped.get('postures', {}) | dict2items) -%}
          {%-   set _ = scoped.update({item.key: (item.value | combine({'enabled': (item.key in (report_effective_selected_postures | default([])))}, recursive=True))}) -%}
          {%- endfor -%}
          {{ scoped }}
        execution_scoped_postures: >-
          {%- set scoped = {} -%}
          {%- for item in (cluster_health_profile_unscoped.get('postures', {}) | dict2items) -%}
          {%-   set _ = scoped.update({item.key: (item.value | combine({'enabled': (item.key in (report_execution_selected_postures | default(report_effective_selected_postures | default([]))))}, recursive=True))}) -%}
          {%- endfor -%}
          {{ scoped }}
        scoped_capabilities: >-
          {%- set scoped = {} -%}
          {%- for item in (cluster_health_profile_unscoped.get('capabilities', {}) | dict2items) -%}
          {%-   set _ = scoped.update({item.key: (item.value | combine({'enabled': (item.key in (report_effective_selected_capabilities | default([])))}, recursive=True))}) -%}
          {%- endfor -%}
          {{ scoped }}
      ansible.builtin.set_fact:
        cluster_health_profile: >-
          {{
            cluster_health_profile_unscoped
            if not (report_selector_scope_active | default(false) | bool)
            else (
              cluster_health_profile_unscoped
              | combine(
                  {
                    'postures': scoped_postures,
                    'capabilities': scoped_capabilities
                  },
                  recursive=True
                )
            )
          }}
        cluster_health_profile_execution: >-
          {{
            cluster_health_profile_unscoped
            if not (report_selector_scope_active | default(false) | bool)
            else (
              cluster_health_profile_unscoped
              | combine(
                  {
                    'postures': execution_scoped_postures,
                    'capabilities': scoped_capabilities
                  },
                  recursive=True
                )
            )
          }}

    - name: Resolve selector-scope dependency contract
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/report_common/tasks/resolve_openshift_selector_scope_dependencies.yml"

    - name: Reduce optional support-evidence scope for selected runs
      ansible.builtin.set_fact:
        collect_live_cluster_compare: false
        collect_live_managed_gates: false
        collect_live_advisor_export: false
        collect_live_insights_archive: false
        collect_live_sosreport: false
        cluster_compare_path: ""
        managed_gates_path: ""
        advisor_export_path: ""
        insights_archive_path: ""
        sosreport_paths: []
      when:
        - report_selector_scope_active | default(false) | bool
        - not (report_scope_requires_optional_support_evidence | default(true) | bool)

    - name: Read resume checkpoint snapshot
      ansible.builtin.slurp:
        src: "{{ report_resume_manifest.snapshot_path }}"
      register: report_resume_snapshot_raw
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Parse resume checkpoint snapshot as unsafe data
      ansible.builtin.set_fact:
        report_resume_snapshot: "{{ (report_resume_snapshot_raw.content | b64decode) | ohc_parse_checkpoint_json_unsafe }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Extract safe resume naming facts from checkpoint snapshot
      vars:
        report_resume_snapshot_text: "{{ report_resume_snapshot_raw.content | b64decode }}"
      ansible.builtin.set_fact:
        report_resume_cluster_infrastructure_name: "{{ report_resume_snapshot_text | ohc_checkpoint_get('cluster_profile.infrastructure_name', '') }}"
        report_resume_cluster_classification_label: "{{ report_resume_snapshot_text | ohc_checkpoint_get('cluster_profile.cluster_classification_label', '') }}"
        report_resume_cluster_classification_source: "{{ report_resume_snapshot_text | ohc_checkpoint_get('cluster_profile.cluster_classification_source', '') }}"
        report_resume_cluster_deployment_type: "{{ report_resume_snapshot_text | ohc_checkpoint_get('cluster_profile.deployment_type', '') }}"
        report_resume_cluster_deployment_type_source: "{{ report_resume_snapshot_text | ohc_checkpoint_get('cluster_profile.deployment_type_source', '') }}"
        report_resume_report_timestamp: "{{ report_resume_snapshot_text | ohc_checkpoint_get('report_timestamp', '') }}"
        report_resume_generated_at: "{{ report_resume_snapshot_text | ohc_checkpoint_get('report_generated_at', '') }}"
        report_resume_ocp_user: "{{ report_resume_snapshot_text | ohc_checkpoint_get('oc_user_cmd.stdout', '') }}"
        report_resume_oc_context: "{{ report_resume_snapshot_text | ohc_checkpoint_get('oc_context_cmd.stdout', '') }}"
        report_resume_api_server: "{{ report_resume_snapshot_text | ohc_checkpoint_get('oc_server_cmd.stdout', '') }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Precompute safe resume report naming values
      ansible.builtin.set_fact:
        report_render_cluster_type: >-
          {{
            report_resume_cluster_classification_label
            if (report_resume_cluster_classification_label | default('') | trim) not in ['', 'unknown']
            else (
              report_resume_cluster_deployment_type
              if (report_resume_cluster_deployment_type | default('') | trim) not in ['', 'unknown']
              else (
                provider_family
                if (provider_family | default('generic')) != 'generic'
                else (platform_family | default('openshift'))
              )
            )
          }}
        report_render_cluster_name_source: >-
          {{
            report_resume_cluster_infrastructure_name
            if (report_resume_cluster_infrastructure_name | default('') | trim) not in ['', 'unknown']
            else (oc_context_cmd.stdout | default('cluster') | trim)
          }}
        report_render_cluster_name: >-
          {{
            (
              (
                report_resume_cluster_infrastructure_name
                if (report_resume_cluster_infrastructure_name | default('') | trim) not in ['', 'unknown']
                else (oc_context_cmd.stdout | default('cluster') | trim)
              )
              | lower
              | regex_replace('[^a-z0-9._-]+', '-')
              | regex_replace('^-+', '')
              | regex_replace('-+$', '')
            ) or 'cluster'
          }}
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Precompute safe resume report file prefix
      ansible.builtin.set_fact:
        report_render_file_prefix: "{{ report_basename }}-{{ report_render_cluster_type }}-{{ report_render_cluster_name }}-{{ report_resume_report_timestamp | default(report_timestamp | default('')) }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Seed safe resume report context facts
      ansible.builtin.set_fact:
        report_timestamp: "{{ report_resume_report_timestamp | default(ansible_date_time.iso8601_basic_short) }}"
        report_generated_at: "{{ report_resume_generated_at | default(ansible_date_time.iso8601) }}"
        report_context: "{{ report_resume_oc_context | default('unknown') }}"
        report_api_server: "{{ report_resume_api_server | default('unknown') }}"
        report_user: "{{ report_resume_ocp_user | default('unknown') }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Build minimal safe resume report cluster profile
      ansible.builtin.set_fact:
        report_render_cluster_profile:
          infrastructure_name: "{{ report_resume_cluster_infrastructure_name | default('') }}"
