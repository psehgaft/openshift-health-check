---
- name: Build OpenShift AI capability artifact facts
  vars:
    day2_openshift_ai_section_current: "{{ (((day2_capability_sections | default([])) | selectattr('key', 'equalto', 'openshift_ai') | list | first) | default({})) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: openshift_ai
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      openshift_ai_present: "{{ ((day2_posture_summary | default({})).get('openshift_ai_present', false)) | bool }}"
      status_summary: "{{ day2_openshift_ai_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_openshift_ai_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_openshift_ai_section: "{{ day2_openshift_ai_section_current }}"
    capability_artifact_collection_inputs:
      openshift_ai_present: "{{ ((day2_posture_summary | default({})).get('openshift_ai_present', false)) | bool }}"
