---
- name: Build day 2 production readiness posture artifact facts
  ansible.builtin.set_fact:
    posture_artifact_key: day2_production_readiness
    posture_artifact_analysis_summary: "{{ day2_production_readiness_summary | default({}) }}"
    posture_artifact_findings:
      checks: "{{ day2_posture_checks | default([]) }}"
      findings: "{{ day2_posture_findings | default([]) }}"
      product_evidence_findings: "{{ assessment_product_evidence_findings | default([]) }}"
    posture_artifact_render_inputs:
      day2_posture_summary: "{{ day2_posture_summary | default({}) }}"
      day2_production_readiness_summary: "{{ day2_production_readiness_summary | default({}) }}"
      checks: "{{ day2_posture_checks | default([]) }}"
      findings: "{{ day2_posture_findings | default([]) }}"
      capability_sections: "{{ day2_capability_sections | default([]) }}"
      capability_assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      capability_assessment_error: "{{ (day2_posture_summary | default({})).get('capability_assessment_error', '') }}"
      product_evidence: "{{ assessment_product_evidence | default({}) }}"
      product_evidence_findings: "{{ assessment_product_evidence_findings | default([]) }}"
    posture_artifact_collection_inputs:
      check_count: "{{ (day2_posture_checks | default([])) | length }}"
      finding_count: "{{ (day2_posture_findings | default([])) | length }}"
      capability_section_count: "{{ (day2_capability_sections | default([])) | length }}"
      blocker_count: "{{ ((day2_production_readiness_summary | default({})).get('top_blockers', [])) | length }}"
      capability_assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
    posture_artifact_section_fields:
      summary: "{{ day2_production_readiness_summary | default({}) }}"
      recommendations: "{{ (day2_production_readiness_summary | default({})).get('recommendation', 'Use the owning posture sections and capability sections as the remediation queue, and rerun the assessment when blockers or incomplete evidence are cleared.') }}"
      day2_posture_summary: "{{ day2_posture_summary | default({}) }}"
      day2_production_readiness_summary: "{{ day2_production_readiness_summary | default({}) }}"
      checks: "{{ day2_posture_checks | default([]) }}"
      findings: "{{ day2_posture_findings | default([]) }}"
      capability_sections: "{{ day2_capability_sections | default([]) }}"
      capability_assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      capability_assessment_error: "{{ (day2_posture_summary | default({})).get('capability_assessment_error', '') }}"
      product_evidence: "{{ assessment_product_evidence | default({}) }}"
      product_evidence_findings: "{{ assessment_product_evidence_findings | default([]) }}"
