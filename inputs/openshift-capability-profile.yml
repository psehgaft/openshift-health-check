---
# Customer input file for profile-driven optional OpenShift capabilities.
# Use with:
#   ansible-playbook playbooks/openshift_cluster_health_report.yml -e @inputs/openshift-capability-profile.yml
#
# Optional capabilities are hidden when absent unless they are required here,
# detected on the cluster, or have actionable findings.
openshift_report_capability_profile:
  backup:
    required: true
    criticality: critical
    expected_state: healthy
    owner: operations
    evidence_required: [must-gather, inspect, oc-get]
    notes: "Production clusters should have backup schedules plus successful backup and restore evidence."
  disconnected_installation:
    required: true
    criticality: critical
    expected_state: configured
    owner: platform
    evidence_required: [must-gather, inspect, oc-get]
    notes: "Require for restricted-network clusters."
  disaster_recovery_secondary_site:
    required: true
    criticality: critical
    expected_state: configured
    owner: operations
    evidence_required: [must-gather, inspect, oc-get]
    notes: "Require when the customer expects cross-site disaster recovery."
  gitops:
    required: true
    criticality: high
    expected_state: present
    owner: operations
    evidence_required: [must-gather, inspect, oc-get]
    notes: "Declarative operations are expected for most production OpenShift environments."
  logging:
    required: true
    criticality: high
    expected_state: configured
    owner: observability
    evidence_required: [must-gather, oc-get]
    notes: "Application, infrastructure, and audit log collection or forwarding should be intentionally configured."
  external_alerting:
    required: true
    criticality: high
    expected_state: configured
    owner: observability
    evidence_required: [must-gather, oc-get]
    notes: "Production alerts should route to an accountable external receiver or operations process."
  user_workload_monitoring:
    required: true
    criticality: high
    expected_state: configured
    owner: observability
    evidence_required: [must-gather, oc-get]
    notes: "Most production clusters need user workload metrics enabled or an approved alternate monitoring path."
  monitoring_persistence:
    required: true
    criticality: high
    expected_state: configured
    owner: observability
    evidence_required: [must-gather, oc-get]
    notes: "Persistent Prometheus and Alertmanager storage is expected for production monitoring continuity."
  oauth_identity_provider:
    required: true
    criticality: high
    expected_state: configured
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Production OpenShift clusters should have at least one configured OAuth identity provider."
  acs:
    required: true
    criticality: high
    expected_state: present
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Require when Advanced Cluster Security is part of the customer security baseline."
  workload_vulnerability_scanner:
    required: true
    criticality: high
    expected_state: present
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Require when workload image vulnerability scanning or secured-cluster scanner agents are part of the security baseline."
  odf:
    required: true
    criticality: high
    expected_state: healthy
    owner: storage
    evidence_required: [must-gather, oc-get]
    notes: "Show when ODF resources exist, have findings, or ODF is required by the customer profile."
  virtualization:
    required: true
    criticality: high
    expected_state: healthy
    owner: platform
    evidence_required: [must-gather, oc-get]
    notes: "Show when OpenShift Virtualization resources exist, have findings, or are required."
  machine_health_checks:
    required: true
    criticality: high
    expected_state: present
    owner: platform
    evidence_required: [must-gather, oc-get]
    notes: "Worker auto-remediation is expected for most production machine-API clusters."
  private_registry_mirrors:
    required: true
    criticality: high
    expected_state: configured
    owner: platform
    evidence_required: [must-gather, inspect, oc-get]
    notes: "Require when release and workload image pulls should use internal mirrors."
  proxy_configuration:
    required: true
    criticality: high
    expected_state: configured
    owner: network
    evidence_required: [must-gather, inspect, oc-get]
    notes: "Require when outbound traffic must traverse a corporate proxy."
  custom_ca_trust:
    required: true
    criticality: high
    expected_state: configured
    owner: security
    evidence_required: [must-gather, inspect, oc-get]
    notes: "Require when internal registries, proxies, or endpoints use private trust roots."
  ipsec_enabled:
    required: true
    criticality: high
    expected_state: configured
    owner: network
    evidence_required: [must-gather, oc-get]
    notes: "Require when the customer expects OVN-Kubernetes IPsec encryption for pod-to-pod or external traffic."
  etcd_encryption_enabled:
    required: true
    criticality: high
    expected_state: configured
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Require when OpenShift API resources stored in etcd must be encrypted at rest."
  encryption_at_rest:
    required: true
    criticality: high
    expected_state: configured
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Production clusters should have an explicit data-at-rest encryption posture."
  audit_log_forwarding:
    required: true
    criticality: high
    expected_state: configured
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Audit logs should be retained or forwarded according to the customer compliance baseline."
  pipelines:
    required: true
    criticality: medium
    expected_state: present
    owner: delivery
    evidence_required: [must-gather, oc-get]
    notes: "Show when OpenShift Pipelines or PipelineRuns exist, have findings, or the customer requires cluster-hosted pipeline execution."
  cicd_runners:
    required: true
    criticality: medium
    expected_state: present
    owner: delivery
    evidence_required: [must-gather, oc-get, prometheus]
    notes: "Show only when runner pods are detected, have findings, or the customer hosts CI/CD runners on the cluster."
  external_metrics:
    required: true
    criticality: medium
    expected_state: configured
    owner: observability
    evidence_required: [must-gather, oc-get, prometheus]
    notes: "Require this when the customer expects metric export to an external observability platform."
  grafana_dashboards:
    required: true
    criticality: medium
    expected_state: present
    owner: observability
    evidence_required: [must-gather, oc-get]
    notes: "Require when in-cluster Grafana dashboards are expected for platform or application metrics."
  compliance:
    required: true
    criticality: medium
    expected_state: present
    owner: security
    evidence_required: [must-gather, oc-get, insights]
    notes: "Require when the customer has formal compliance scanning obligations."
  cert_manager:
    required: true
    criticality: medium
    expected_state: present
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Require when certificate lifecycle automation is expected on-cluster."
  acm:
    required: true
    criticality: medium
    expected_state: present
    owner: operations
    evidence_required: [must-gather, oc-get]
    notes: "Require when the cluster should be managed by ACM or a fleet-management hub."
  ai:
    required: true
    criticality: medium
    expected_state: healthy
    owner: platform
    evidence_required: [must-gather, oc-get]
    notes: "Show when AI or model-serving resources exist, have findings, or are required."
  external_secrets:
    required: true
    criticality: medium
    expected_state: present
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Require when secrets are expected to be synchronized from an external secret manager."
  cluster_autoscaler:
    required: true
    criticality: medium
    expected_state: present
    owner: platform
    evidence_required: [must-gather, oc-get]
    notes: "Require when machine API scaling is expected for workload elasticity."
  image_registry_governance:
    required: true
    criticality: medium
    expected_state: configured
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Image registry exposure, pruning, and policy should be intentional."
  external_private_registry:
    required: true
    criticality: medium
    expected_state: configured
    owner: delivery
    evidence_required: [must-gather, oc-get]
    notes: "Require when application workloads are expected to pull images from an external private registry."
  network_policy_baseline:
    required: true
    criticality: medium
    expected_state: configured
    owner: network
    evidence_required: [must-gather, oc-get]
    notes: "Multi-tenant production clusters should define namespace isolation expectations."
  egress_controls:
    required: true
    criticality: medium
    expected_state: configured
    owner: network
    evidence_required: [must-gather, oc-get]
    notes: "Require when outbound network paths are governed."
  quota_governance:
    required: true
    criticality: medium
    expected_state: configured
    owner: operations
    evidence_required: [must-gather, oc-get]
    notes: "Shared clusters should use quotas or documented exceptions for tenant namespaces."
  multi_tenancy_governance:
    required: true
    criticality: medium
    expected_state: configured
    owner: operations
    evidence_required: [must-gather, oc-get]
    notes: "Shared clusters should have namespace onboarding, RBAC, quota, and isolation guardrails."
  service_mesh:
    required: true
    criticality: medium
    expected_state: healthy
    owner: platform
    evidence_required: [must-gather, oc-get]
    notes: "Show when service mesh resources exist, have findings, or are required."
  serverless:
    required: true
    criticality: medium
    expected_state: healthy
    owner: platform
    evidence_required: [must-gather, oc-get]
    notes: "Show when OpenShift Serverless resources exist, have findings, or are required."
  windows_containers:
    required: true
    criticality: medium
    expected_state: healthy
    owner: platform
    evidence_required: [must-gather, oc-get]
    notes: "Show when Windows workloads or MachineSets exist, have findings, or are required."
  gpu_acceleration:
    required: true
    criticality: medium
    expected_state: healthy
    owner: platform
    evidence_required: [must-gather, oc-get, prometheus]
    notes: "Show when GPU nodes/operators/workloads exist, have findings, or are required."
  sandboxed_containers:
    required: true
    criticality: medium
    expected_state: healthy
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Show when sandboxed containers are installed, have findings, or are required."
  node_tuning:
    required: true
    criticality: medium
    expected_state: configured
    owner: platform
    evidence_required: [must-gather, oc-get]
    notes: "Require when node performance or custom kernel/runtime tuning is part of the baseline."
  nmstate_networking:
    required: true
    criticality: medium
    expected_state: configured
    owner: network
    evidence_required: [must-gather, oc-get]
    notes: "Require when node network configuration is managed through NMState."
  cost_management:
    required: true
    criticality: low
    expected_state: present
    owner: operations
    evidence_required: [must-gather, oc-get]
    notes: "Require when chargeback, showback, or cost allocation is part of the operating model."
  descheduler:
    required: true
    criticality: low
    expected_state: present
    owner: operations
    evidence_required: [must-gather, oc-get]
    notes: "Require when workload rebalancing is part of the operations model."
