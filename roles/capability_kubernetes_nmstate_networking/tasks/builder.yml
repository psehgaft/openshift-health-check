---
- name: Build Kubernetes NMState networking capability artifact facts
  vars:
    day2_kubernetes_nmstate_networking_section_current: "{{ (day2_capability_sections_by_key | default({})).get('kubernetes_nmstate_networking', {}) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: kubernetes_nmstate_networking
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      kubernetes_nmstate_networking_present: "{{ ((day2_posture_summary | default({})).get('kubernetes_nmstate_networking_present', false)) | bool }}"
      kubernetes_nmstate_networking_healthy: "{{ ((day2_posture_summary | default({})).get('kubernetes_nmstate_networking_healthy', false)) | bool }}"
      status_summary: "{{ day2_kubernetes_nmstate_networking_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_kubernetes_nmstate_networking_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_kubernetes_nmstate_networking_section: "{{ day2_kubernetes_nmstate_networking_section_current }}"
    capability_artifact_collection_inputs:
      kubernetes_nmstate_networking_present: "{{ ((day2_posture_summary | default({})).get('kubernetes_nmstate_networking_present', false)) | bool }}"
      kubernetes_nmstate_networking_healthy: "{{ ((day2_posture_summary | default({})).get('kubernetes_nmstate_networking_healthy', false)) | bool }}"
