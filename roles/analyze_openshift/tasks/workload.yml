---
- name: Resolve node label governance source nodes
  ansible.builtin.set_fact:
    node_label_governance_source_nodes: >-
      {{
        openshift_node_items
        if (openshift_node_items is defined and (openshift_node_items | length) > 0)
        else (
          ((analysis_graph.nodes | default({})).get('items', []))
          if (((analysis_graph.nodes | default({})).get('items', []) | length) > 0)
          else (
            ((nodes | default({})).get('items', []))
            if (((nodes | default({})).get('items', []) | length) > 0)
            else (((collected_resource_graph | default({})).get('nodes', {})).get('items', []))
          )
        )
      }}
  changed_when: false

- name: Build OpenShift workload analysis bundle
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helpers_from_stdin.py"
    stdin: "{{ {
      'fail_on_error': true,
      'helpers': [
        {
          'name': 'workload_health',
          'script': 'scripts/build_workload_health_findings.py',
          'input': {
            'pods': ((analysis_graph.pods | default({})).get('items', [])),
            'deployments': ((analysis_graph.deployments | default({})).get('items', [])),
            'statefulsets': ((analysis_graph.statefulsets | default({})).get('items', [])),
            'daemonsets': ((analysis_graph.daemonsets | default({})).get('items', [])),
            'deploymentconfigs': ((analysis_graph.deploymentconfigs | default({})).get('items', [])),
            'platform_namespaces_regex': (platform_namespaces_regex | default('^$')),
            'user_namespaces_exclude_regex': (user_namespaces_exclude_regex | default('^$')),
            'operator_managed_namespace_names': (operator_managed_namespace_names | default([])),
            'filter_operator_managed_user_pods': false,
            'filter_operator_managed_workloads': false,
            'include_aged_user_pods': false,
            'include_high_replica_workloads': true,
            'high_replica_threshold': 10,
            'include_probe_findings': true
          }
        },
        {
          'name': 'workload_label_governance',
          'script': 'scripts/build_workload_label_governance_findings.py',
          'input': {
            'user_namespaces_exclude_regex': user_namespaces_exclude_regex,
            'operator_managed_namespace_names': (operator_managed_namespace_names | default([])),
            'namespaces': ((analysis_graph.namespaces | default({})).get('items', [])),
            'pods': ((analysis_graph.pods | default({})).get('items', [])),
            'deployments': ((analysis_graph.deployments | default({})).get('items', [])),
            'statefulsets': ((analysis_graph.statefulsets | default({})).get('items', [])),
            'daemonsets': ((analysis_graph.daemonsets | default({})).get('items', [])),
            'deploymentconfigs': ((analysis_graph.deploymentconfigs | default({})).get('items', [])),
            'serviceaccounts': ((analysis_graph.serviceaccounts | default({})).get('items', [])),
            'gitops_applications': ((analysis_graph.gitops_applications | default({})).get('items', []))
          }
        },
        {
          'name': 'node_label_governance',
          'script': 'scripts/build_node_label_governance_findings.py',
          'input': {
            'nodes': (node_label_governance_source_nodes | default([]))
          }
        },
        {
          'name': 'deploymentconfig_resource_findings',
          'script': 'scripts/build_deploymentconfig_resource_findings.py',
          'input': {
            'deploymentconfigs': ((analysis_graph.deploymentconfigs | default({})).get('items', [])),
            'exclude_regex': (user_namespaces_exclude_regex | default('^$'))
          }
        },
        {
          'name': 'route_ingress_findings',
          'script': 'scripts/build_route_ingress_findings.py',
          'input': {
            'services': ((analysis_graph.services | default({})).get('items', [])),
            'routes': ((analysis_graph.routes | default({})).get('items', [])),
            'ingresses': ((analysis_graph.ingresses | default({})).get('items', [])),
            'warn_on_ingress_without_class': (warn_on_ingress_without_class | default(false))
          }
        }
      ]
    } | to_json }}"
  register: openshift_workload_analysis_bundle_cmd
  changed_when: false
  failed_when: openshift_workload_analysis_bundle_cmd.rc != 0 or (openshift_workload_analysis_bundle_cmd.stdout | default('') | length == 0)

- name: Normalize OpenShift workload analysis bundle
  vars:
    openshift_workload_analysis_bundle_results: "{{ (openshift_workload_analysis_bundle_cmd.stdout | from_json).results | default({}) }}"
  ansible.builtin.set_fact:
    openshift_workload_health_findings_data: "{{ openshift_workload_analysis_bundle_results.workload_health.output | default({}) }}"
    workload_label_governance_data: "{{ openshift_workload_analysis_bundle_results.workload_label_governance.output | default({}) }}"
    node_label_governance_data: "{{ openshift_workload_analysis_bundle_results.node_label_governance.output | default({}) }}"
    deploymentconfig_resource_findings_data: "{{ openshift_workload_analysis_bundle_results.deploymentconfig_resource_findings.output | default({}) }}"
    route_ingress_findings_data: "{{ openshift_workload_analysis_bundle_results.route_ingress_findings.output | default({}) }}"
  changed_when: false

- name: Expand OpenShift workload analysis bundle
  ansible.builtin.set_fact:
    platform_pod_issues: "{{ openshift_workload_health_findings_data.platform_pod_issues | default([]) }}"
    deployment_issues: "{{ openshift_workload_health_findings_data.deployment_issues | default([]) }}"
    statefulset_issues: "{{ openshift_workload_health_findings_data.statefulset_issues | default([]) }}"
    daemonset_issues: "{{ openshift_workload_health_findings_data.daemonset_issues | default([]) }}"
    deploymentconfig_issues: "{{ openshift_workload_health_findings_data.deploymentconfig_issues | default([]) }}"
    workload_health_issues: "{{ openshift_workload_health_findings_data.workload_health_issues | default([]) }}"
    high_replica_workloads: "{{ openshift_workload_health_findings_data.high_replica_workloads | default([]) }}"
    workload_probe_findings: "{{ openshift_workload_health_findings_data.workload_probe_findings | default([]) }}"
    workload_label_governance_findings: "{{ workload_label_governance_data.workload_label_governance_findings | default([]) }}"
    node_label_governance_findings: "{{ node_label_governance_data.node_label_governance_findings | default([]) }}"
    workload_resource_findings: "{{ (workload_resource_findings | default([])) + (deploymentconfig_resource_findings_data.deploymentconfig_resource_findings | default([])) }}"
    service_names_by_namespace: "{{ route_ingress_findings_data.service_names_by_namespace | default({}) }}"
    route_issues: "{{ route_ingress_findings_data.route_issues | default([]) }}"
    ingress_issues: "{{ route_ingress_findings_data.ingress_issues | default([]) }}"
    route_host_owners: "{{ route_ingress_findings_data.route_host_owners | default({}) }}"
    ingress_host_owners: "{{ route_ingress_findings_data.ingress_host_owners | default({}) }}"
    route_host_conflicts: "{{ route_ingress_findings_data.route_host_conflicts | default([]) }}"
    ingress_host_conflicts: "{{ route_ingress_findings_data.ingress_host_conflicts | default([]) }}"
    route_ingress_host_conflicts: "{{ route_ingress_findings_data.route_ingress_host_conflicts | default([]) }}"
  changed_when: false
