---
- name: Build canonical analysis graph
  ansible.builtin.include_tasks: build_analysis_graph.yml

- name: Project canonical analysis graph into analysis facts
  ansible.builtin.include_tasks: project_analysis_graph.yml

- name: Run core analysis
  ansible.builtin.include_tasks: core.yml

- name: Run security and configuration analysis
  ansible.builtin.include_tasks: security.yml
  when: report_scope_requires_openshift_security_analysis | default(true) | bool

- name: Run review-domain analysis
  ansible.builtin.include_tasks: review_domains.yml
  when: report_scope_requires_review_domain_analysis | default(true) | bool

- name: Run observability and performance analysis
  ansible.builtin.include_tasks: observability.yml
  when: report_scope_requires_observability_analysis | default(true) | bool

- name: Derive targeted node debug candidates
  ansible.builtin.include_tasks: node_debug_targets.yml

- name: Run production Day 2 posture analysis
  ansible.builtin.include_tasks: day2.yml
  when: report_scope_requires_day2_analysis | default(true) | bool

- name: Build connected-cluster posture analysis
  ansible.builtin.include_tasks: connected_cluster_posture.yml
  when: report_scope_requires_connected_cluster_posture_analysis | default(true) | bool

- name: Build supportability evidence analysis
  ansible.builtin.include_tasks: supportability_evidence.yml
  when: report_scope_requires_supportability_analysis | default(true) | bool

- name: Build summary analysis
  ansible.builtin.include_tasks: summary.yml
