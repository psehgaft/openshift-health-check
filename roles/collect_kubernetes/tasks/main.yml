---
- name: Detect Kubernetes cluster type from cluster signals
  block:
    - name: Create Kubernetes cluster type detection input file
      ansible.builtin.tempfile:
        state: file
        suffix: .json
      register: kubernetes_cluster_type_input_file
      changed_when: false

    - name: Write Kubernetes cluster type detection input data
      ansible.builtin.copy:
        dest: "{{ kubernetes_cluster_type_input_file.path }}"
        mode: "0600"
        content: "{{ {
          'requested_provider_family': provider_family | default('generic'),
          'requested_cluster_profile_mode': cluster_profile_mode | default('production'),
          'context': oc_context_cmd.stdout | default(''),
          'nodes': (nodes | default({})).get('items', []),
          'namespaces': (namespaces | default({})).get('items', []),
          'crds': (crds | default({})).get('items', [])
        } | to_json }}"
      changed_when: false

    - name: Run Kubernetes cluster type detection
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/detect_kubernetes_cluster_type.py"
          - "{{ kubernetes_cluster_type_input_file.path }}"
      register: kubernetes_provider_detection_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove Kubernetes cluster type detection input file
      ansible.builtin.file:
        path: "{{ kubernetes_cluster_type_input_file.path }}"
        state: absent
      when: kubernetes_cluster_type_input_file is defined and (kubernetes_cluster_type_input_file.path | default('') | length > 0)
      changed_when: false

- name: Normalize Kubernetes cluster type detection
  ansible.builtin.set_fact:
    kubernetes_provider_detection: "{{ kubernetes_provider_detection_cmd.stdout | from_json if (kubernetes_provider_detection_cmd.rc == 0 and (kubernetes_provider_detection_cmd.stdout | default('') | length > 0)) else {'provider_family': (provider_family | default('generic')), 'detected_from': 'fallback', 'cluster_profile_mode': (cluster_profile_mode | default('production'))} }}"

- name: Set resolved cluster type facts
  ansible.builtin.set_fact:
    resolved_provider_family: "{{ kubernetes_provider_detection.provider_family | default(provider_family | default('generic')) }}"
    observed_provider_family: "{{ kubernetes_provider_detection.observed_provider_family | default(kubernetes_provider_detection.provider_family | default(provider_family | default('generic'))) }}"
    resolved_cluster_profile_mode: "{{ kubernetes_provider_detection.cluster_profile_mode | default(cluster_profile_mode | default('production')) }}"
    cluster_type_detection_source: "{{ kubernetes_provider_detection.detected_from | default('fallback') }}"
    observed_cluster_type_detection_source: "{{ kubernetes_provider_detection.observed_detected_from | default(kubernetes_provider_detection.detected_from | default('fallback')) }}"
