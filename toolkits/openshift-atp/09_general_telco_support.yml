# TC 70: Capa Física (LACP Bonding y MTU 9000)
- name: "TC-70: Capa Física (LACP Bonding y MTU 9000)"
  when: run_tc70_physical_lacp_mtu | default(true) | bool
  block:
    - name: "TC-70: Query bond0 MTU from NodeNetworkConfigurationEnactment"
      ansible.builtin.shell: >-
        oc get nnce -o jsonpath='{range .items[*]}{.metadata.name}{"\:\ bond0="}{.status.interface[?(@.name=="bond0")].mtu}{"\n"}{end}'
      register: tc70_cmd
      changed_when: false
      failed_when: false

    - name: "TC-70: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-70',
          'name': 'Capa Física (LACP Bonding y MTU 9000)',
