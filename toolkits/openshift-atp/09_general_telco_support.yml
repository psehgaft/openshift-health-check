          'details': tc69_cmd.stdout | default(tc69_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc69', 'redhat_registry']

# TC 70: Capa Física (LACP Bonding y MTU 9000)
- name: "TC-70: Capa Física (LACP Bonding y MTU 9000)"
  when: run_tc70_physical_lacp_mtu | default(true) | bool
  block:
    - name: "TC-70: Verify runtime LACP mode, link state, and MTU on nodes with bond0"
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail

          nodes="$(oc get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>&1)"
          nodes_rc=$?
          if [[ "$nodes_rc" -ne 0 ]]; then
            echo "Could not list cluster nodes: $nodes" >&2
            echo "TC70_RESULT=FAIL"
            exit 1
          fi
          if [[ -z "$nodes" ]]; then
            echo "No cluster nodes were returned by the API." >&2
            echo "TC70_RESULT=FAIL"
            exit 1
          fi

          nodes_checked=0
          bonds_found=0
          bonds_passed=0
          bonds_failed=0

          while IFS= read -r node; do
            [[ -n "$node" ]] || continue
            nodes_checked=$((nodes_checked + 1))
            echo "== Node: $node =="

            output="$(oc debug -q "node/$node" -- chroot /host bash -c 'if [ -r /proc/net/bonding/bond0 ]; then cat /proc/net/bonding/bond0; ip -o link show dev bond0; else echo TC70_BOND_ABSENT; fi' 2>&1)"
            node_rc=$?
            printf '%s\n' "$output"

            if [[ "$node_rc" -ne 0 ]]; then
              echo "Could not inspect host networking on $node (oc debug exit code $node_rc)." >&2
              bonds_failed=$((bonds_failed + 1))
              continue
            fi

            if grep -qF "TC70_BOND_ABSENT" <<< "$output"; then
              echo "bond0 is not configured on $node; this node is outside this check."
              continue
            fi

            bonds_found=$((bonds_found + 1))
            mode_ok=false
            mii_ok=false
            mtu_ok=false
            grep -qF "Bonding Mode: IEEE 802.3ad" <<< "$output" && mode_ok=true
            grep -qiE '^MII Status:[[:space:]]*up([[:space:]]|$)' <<< "$output" && mii_ok=true
            grep -qE '(^|[[:space:]])mtu 9000([[:space:]]|$)' <<< "$output" && mtu_ok=true

            echo "LACP 802.3ad=$mode_ok; MII up=$mii_ok; MTU 9000=$mtu_ok"
            if [[ "$mode_ok" == "true" && "$mii_ok" == "true" && "$mtu_ok" == "true" ]]; then
              bonds_passed=$((bonds_passed + 1))
            else
              bonds_failed=$((bonds_failed + 1))
              echo "bond0 on $node does not meet all ATP requirements." >&2
            fi
          done <<< "$nodes"

          echo "Nodes inspected: $nodes_checked; bond0 interfaces found: $bonds_found; compliant bonds: $bonds_passed; failed inspections/interfaces: $bonds_failed"
          if [[ "$bonds_found" -eq 0 ]]; then
            echo "No bond0 interface was found on any node. Configure bond0 for this test or mark the case not applicable for this cluster profile." >&2
            echo "TC70_RESULT=FAIL"
            exit 1
          fi
          if [[ "$bonds_failed" -gt 0 || "$bonds_passed" -ne "$bonds_found" ]]; then
            echo "TC70_RESULT=FAIL: every discovered bond0 must use IEEE 802.3ad, report MII Status up, and have MTU 9000."
            exit 1
          fi

          echo "TC70_RESULT=PASS: every discovered bond0 uses IEEE 802.3ad, reports MII Status up, and has MTU 9000."
        executable: /bin/bash
      register: tc70_cmd
      changed_when: false
      failed_when: false

    - name: "TC-70: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-70',
          'name': 'Capa Física (LACP Bonding y MTU 9000)',
          'category': 'General Support / Telco',
          'expected': 'Every node configured with bond0 reports IEEE 802.3ad mode, MII Status up, and MTU 9000; nodes without bond0 are reported as not applicable for that node.',
          'status': ('Pass' if (tc70_cmd.rc == 0 and 'TC70_RESULT=PASS' in (tc70_cmd.stdout | default(''))) else 'Fail'),
          'procedure': 'For each cluster node, inspect /proc/net/bonding/bond0 and ip -o link show dev bond0 using oc debug node/<node> -- chroot /host; validate 802.3ad, MII up, and MTU 9000.',
          'evidence': ((tc70_cmd.stdout | default('')) ~ (('\\nSTDERR:\\n' ~ (tc70_cmd.stderr | default(''))) if (tc70_cmd.stderr | default('') | length > 0) else '') ~ ('\\nExit code: ' ~ (tc70_cmd.rc | string) if tc70_cmd.rc is defined else '')),
          'details': tc70_cmd.stdout | default(tc70_cmd.stderr) | truncate(300),
          'remediation': 'If no bond0 is found, verify whether the cluster network design requires LACP and configure the intended bond through a NodeNetworkConfigurationPolicy. For a failing node, verify the policy is successfully enacted, the switch ports are in the same LACP port-channel, member links are up, and MTU 9000 is configured end-to-end on the bond, physical switch ports, and network path. Confirm with /proc/net/bonding/bond0 and ip -d link show bond0, then rerun.'
        }] }}"
  tags: ['general', 'telco', 'tc70', 'bonding_mtu']

# TC 71: Perfilamiento de Nodos (Roles/Labels/MaxPods 250)
- name: "TC-71: Perfilamiento de Nodos (Roles/Labels/MaxPods 250)"
  when: run_tc71_node_profiling_maxpods | default(true) | bool
  block:
    - name: "TC-71: Verify every node role label and exact pod capacity"
      vars:
        tc71_required_roles_json: "{{ tc71_expected_node_roles | default([]) | to_json }}"
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail

          expected_roles_json={{ tc71_required_roles_json | quote }}
          nodes_json="$(oc get nodes -o json 2>&1)"
          nodes_rc=$?
          if [[ "$nodes_rc" -ne 0 ]]; then
            echo "Could not query node inventory: $nodes_json" >&2
            echo "TC71_RESULT=FAIL"
            exit 1
          fi
          if ! jq -e '.items | length > 0' <<< "$nodes_json" >/dev/null; then
            echo "The API returned no nodes or invalid node JSON." >&2
            echo "$nodes_json"
            echo "TC71_RESULT=FAIL"
            exit 1
          fi

          node_count="$(jq '.items | length' <<< "$nodes_json")"
          node_failures=0
          echo "Expected pod capacity per node: 250"
          echo "Required cluster role names: $expected_roles_json"
          echo "== Node role labels, capacity, and allocatable pods =="

          while IFS=$'\t' read -r node roles capacity allocatable; do
            [[ -n "$node" ]] || continue
            printf 'Node=%s roles=%s capacity.pods=%s allocatable.pods=%s\n' "$node" "${roles:-none}" "${capacity:-missing}" "${allocatable:-missing}"

            if [[ -z "$roles" || "$roles" == "NONE" ]]; then
              echo "FAIL: $node has no node-role.kubernetes.io/* label." >&2
              node_failures=$((node_failures + 1))
            fi
            if [[ "$capacity" != "250" ]]; then
              echo "FAIL: $node capacity.pods is '$capacity'; expected exactly 250." >&2
              node_failures=$((node_failures + 1))
            fi
            if [[ "$allocatable" != "250" ]]; then
              echo "FAIL: $node allocatable.pods is '$allocatable'; expected exactly 250." >&2
              node_failures=$((node_failures + 1))
            fi
          done < <(jq -r '
            .items[] |
            [
              .metadata.name,
              ([((.metadata.labels // {}) | keys[]) | select(startswith("node-role.kubernetes.io/")) | sub("^node-role.kubernetes.io/"; "")] | unique | if length == 0 then "NONE" else join(",") end),
              (.status.capacity.pods // ""),
              (.status.allocatable.pods // "")
            ] | @tsv
          ' <<< "$nodes_json")

          missing_roles="$(jq -r --argjson required "$expected_roles_json" '
            ([.items[].metadata.labels // {} | keys[] | select(startswith("node-role.kubernetes.io/")) | sub("^node-role.kubernetes.io/"; "")] | unique) as $actual |
            $required[] | select(. as $role | ($actual | index($role)) == null)
          ' <<< "$nodes_json")"
          if [[ -n "$missing_roles" ]]; then
            echo "FAIL: expected role labels not found on any node: $(tr '\n' ' ' <<< "$missing_roles")" >&2
            node_failures=$((node_failures + 1))
          fi

          echo "Nodes checked: $node_count; validation failures: $node_failures"
          if [[ "$node_failures" -gt 0 ]]; then
            echo "TC71_RESULT=FAIL: review the node role design and KubeletConfig/MachineConfigPool rollout."
            exit 1
          fi
          echo "TC71_RESULT=PASS: every node has role labels and capacity/allocatable pods equal to 250; all configured required roles are present."
        executable: /bin/bash
      register: tc71_cmd
      changed_when: false
      failed_when: false

    - name: "TC-71: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-71',
          'name': 'Perfilamiento de Nodos (Roles/Labels/MaxPods)',
          'category': 'General Support / Telco',
          'expected': 'Every node has at least one node-role.kubernetes.io/* label and reports capacity.pods=250 and allocatable.pods=250. Optional tc71_expected_node_roles must also all be present.',
          'status': ('Pass' if (tc71_cmd.rc == 0 and 'TC71_RESULT=PASS' in (tc71_cmd.stdout | default(''))) else 'Fail'),
          'procedure': 'Query all nodes as JSON; report role labels, capacity.pods, and allocatable.pods; optionally verify required role names configured in tc71_expected_node_roles.',
          'evidence': ((tc71_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc71_cmd.stderr | default(''))) if (tc71_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc71_cmd.rc | string) if tc71_cmd.rc is defined else '')),
          'details': tc71_cmd.stdout | default(tc71_cmd.stderr) | truncate(300),
          'remediation': 'Fix the malformed historical JSONPath by using the updated JSON-based check. To configure the pod limit, use a KubeletConfig targeting the intended MachineConfigPool with kubeletConfig.maxPods: 250; ensure podsPerCore does not impose a lower effective limit. Wait until the MCP is Updated=True, Updating=False, and Degraded=False, then confirm every node with oc describe node <name> (Capacity and Allocatable pods). Review node-role labels against the approved topology and configure tc71_expected_node_roles in inventory/group_vars if specific cluster-wide role names are mandatory.'
        }] }}"
  tags: ['general', 'telco', 'tc71', 'profiling']

# TC 72: Rendimiento (HugePages)
- name: "TC-72: Rendimiento (HugePages)"
  when: run_tc72_performance_hugepages | default(true) | bool
  block:
    - name: "TC-72: Verify HugePages capacity and allocatable resources on target workers"
      vars:
        tc72_node_selector_value: "{{ tc72_node_selector | default('node-role.kubernetes.io/worker=') }}"
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail

          node_selector={{ tc72_node_selector_value | quote }}
          nodes_json="$(oc get nodes -l "$node_selector" -o json 2>&1)"
          nodes_rc=$?
          if [[ "$nodes_rc" -ne 0 ]]; then
            echo "Could not query nodes with selector '$node_selector': $nodes_json" >&2
            echo "TC72_RESULT=FAIL"
            exit 1
          fi
          if ! jq -e '.items | length > 0' <<< "$nodes_json" >/dev/null; then
            echo "No nodes matched selector '$node_selector' or the API returned invalid JSON." >&2
            echo "TC72_RESULT=FAIL"
            exit 1
          fi

          node_count="$(jq '.items | length' <<< "$nodes_json")"
          node_failures=0
          echo "Target node selector: $node_selector"
          echo "== HugePages capacity and allocatable resources by node =="

          while IFS=$'\t' read -r node cap_1gi alloc_1gi cap_2mi alloc_2mi; do
            [[ -n "$node" ]] || continue
            printf 'Node=%s capacity(1Gi)=%s allocatable(1Gi)=%s capacity(2Mi)=%s allocatable(2Mi)=%s\n' \
              "$node" "${cap_1gi:-0}" "${alloc_1gi:-0}" "${cap_2mi:-0}" "${alloc_2mi:-0}"

            has_available_hugepages=false
            if [[ "${cap_1gi:-0}" =~ ^[1-9][0-9]*([EPTGMK]i?)?$ && "${alloc_1gi:-0}" =~ ^[1-9][0-9]*([EPTGMK]i?)?$ ]]; then
              has_available_hugepages=true
            fi
            if [[ "${cap_2mi:-0}" =~ ^[1-9][0-9]*([EPTGMK]i?)?$ && "${alloc_2mi:-0}" =~ ^[1-9][0-9]*([EPTGMK]i?)?$ ]]; then
              has_available_hugepages=true
            fi

            if [[ "$has_available_hugepages" != "true" ]]; then
              echo "FAIL: $node has no positive HugePages resource in both capacity and allocatable for either 1Gi or 2Mi." >&2
              node_failures=$((node_failures + 1))
            fi
          done < <(jq -r '
            .items[] |
            [
              .metadata.name,
              (.status.capacity["hugepages-1Gi"] // "0"),
              (.status.allocatable["hugepages-1Gi"] // "0"),
              (.status.capacity["hugepages-2Mi"] // "0"),
              (.status.allocatable["hugepages-2Mi"] // "0")
            ] | @tsv
          ' <<< "$nodes_json")

          echo "Target workers checked: $node_count; nodes without schedulable HugePages: $node_failures"
          if [[ "$node_failures" -gt 0 ]]; then
            echo "TC72_RESULT=FAIL: each target worker must expose positive capacity and allocatable HugePages for 1Gi or 2Mi."
            exit 1
          fi
          echo "TC72_RESULT=PASS: every target worker exposes HugePages capacity and allocatable resources for at least one supported page size."
        executable: /bin/bash
      register: tc72_cmd
      changed_when: false
      failed_when: false

    - name: "TC-72: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-72',
          'name': 'Rendimiento (HugePages)',
          'category': 'General Support / Telco',
          'expected': 'Every node selected for CNF workloads has positive capacity and allocatable HugePages for 1Gi or 2Mi, matching the approved PerformanceProfile.',
          'status': ('Pass' if (tc72_cmd.rc == 0 and 'TC72_RESULT=PASS' in (tc72_cmd.stdout | default(''))) else 'Fail'),
          'procedure': 'Query each node matching tc72_node_selector (default: workers) as JSON; validate positive capacity and allocatable HugePages for at least one of 1Gi or 2Mi.',
          'evidence': ((tc72_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc72_cmd.stderr | default(''))) if (tc72_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc72_cmd.rc | string) if tc72_cmd.rc is defined else '')),
          'details': tc72_cmd.stdout | default(tc72_cmd.stderr) | truncate(300),
          'remediation': 'Use the Node Tuning Operator PerformanceProfile hugepages.pages configuration to pre-allocate the size and count required by the CNF on the intended nodes/NUMA nodes. Wait for the relevant MachineConfigPool rollout to finish, then verify oc describe node <node> reports positive hugepages capacity and allocatable resources. Configure tc72_node_selector to target the cluster nodes designed for CNFs; do not allocate pages on every worker unless the topology requires it.'
        }] }}"
  tags: ['general', 'telco', 'tc72', 'hugepages']

# TC 73: Aceleración de Red (SR-IOV y VFs)
- name: "TC-73: Aceleración de Red (SR-IOV y VFs)"
  when: run_tc73_network_acceleration_sriov | default(true) | bool
  block:
    - name: "TC-73: Query SriovNetworkNodeState sync status"
      ansible.builtin.command: oc get sriovnetworknodestates -n openshift-sriov-network-operator --no-headers
      register: tc73_cmd
      changed_when: false
      failed_when: false

    - name: "TC-73: Record Result"
      vars:
        sriov_lines: "{{ tc73_cmd.stdout_lines | default([]) }}"
        unready_sriov: "{{ sriov_lines | reject('search', 'Succeeded') | list }}"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-73',
          'name': 'Aceleración de Red (SR-IOV y VFs)',
          'category': 'General Support / Telco',
          'expected': 'SriovNetworkNodeState with syncStatus=Succeeded and active VFs',
          'status': ('Pass' if (tc73_cmd.rc == 0 and unready_sriov | length == 0 and sriov_lines | length > 0) else 'Fail'),
          'procedure': (tc73_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc73_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc73_cmd.stderr | default(''))) if (tc73_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc73_cmd.rc | string) if tc73_cmd.rc is defined else '')),
          'details': 'SR-IOV States: ' ~ (sriov_lines | length) ~ ', Unready: ' ~ (unready_sriov | length)
        }] }}"
  tags: ['general', 'telco', 'tc73', 'sriov']
