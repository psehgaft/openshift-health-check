---
- name: Record timing event
  ansible.builtin.set_fact:
    report_timing_events: >-
      {{
        (report_timing_events | default([]))
        + [
            {
              'stage': (report_timing_stage | default('unspecified')),
              'event': (report_timing_event | default('mark')),
              'label': (report_timing_label | default('')),
              'epoch': (now(utc=true).timestamp() | float),
              'iso8601': (now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ')),
              'report_mode': (report_mode_resolved | default(report_mode | default('unknown'))),
              'run_mode': (report_run_mode | default('fresh'))
            }
          ]
      }}
