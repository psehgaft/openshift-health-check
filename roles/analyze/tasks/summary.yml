---
- name: Build aggregate lists
  ansible.builtin.set_fact:
    default_storageclasses: "{{ storageclass_summary | default([]) | selectattr('is_default', 'in', ['true', 'True']) | list }}"
    top_pod_restart_hotspots: "{{ (pod_restart_hotspots | default([]) | sort(attribute='restarts', reverse=true) | list)[:top_restart_pod_limit] }}"
    high_restart_pods: "{{ (pod_restart_hotspots | default([]) | selectattr('restarts', 'ge', pod_restart_warning_threshold | default(5)) | sort(attribute='restarts', reverse=true) | list) }}"
    top_high_restart_pods: "{{ ((pod_restart_hotspots | default([]) | selectattr('restarts', 'ge', pod_restart_warning_threshold | default(5)) | sort(attribute='restarts', reverse=true) | list)[:top_restart_pod_limit]) }}"
    top_pvc_issues: "{{ (pvc_issues | default([]))[:top_pvc_issue_limit] }}"
    top_pv_issues: "{{ (pv_issues | default([]))[:top_pvc_issue_limit] }}"
    top_event_reasons: "{{ (warning_event_reason_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | list)[:top_event_reason_limit] }}"
    top_alert_groups: "{{ (firing_alert_name_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | list)[:top_alert_group_limit] }}"
    top_alert_namespaces: "{{ (firing_alert_namespace_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | list)[:top_namespace_issue_limit] }}"
    top_namespace_issue_summary: "{{ (namespace_issue_summary | default([]))[:top_namespace_issue_limit] }}"
    top_workload_health_issues: "{{ (workload_health_issues | default([]))[:top_workload_issue_limit] }}"
    top_workload_probe_findings: "{{ (workload_probe_findings | default([]))[:top_workload_issue_limit] }}"
    top_overprovisioned_pods: "{{ (overprovisioned_pods | default([]))[:top_workload_issue_limit] }}"
    top_quota_pressure_findings: "{{ (quota_pressure_findings | default([]))[:top_workload_issue_limit] }}"
    top_security_findings: "{{ (security_findings | default([]))[:top_security_issue_limit] }}"
    top_workload_practice_findings: "{{ (workload_practice_findings | default([]))[:top_security_issue_limit] }}"
    top_route_issues: "{{ (route_issues | default([]))[:top_workload_issue_limit] }}"
    top_ingress_issues: "{{ (ingress_issues | default([]))[:top_workload_issue_limit] }}"
    top_route_host_conflicts: "{{ (route_host_conflicts | default([]))[:top_workload_issue_limit] }}"
    top_ingress_host_conflicts: "{{ (ingress_host_conflicts | default([]))[:top_workload_issue_limit] }}"
    top_deprecated_crd_findings: "{{ (deprecated_crd_findings | default([]))[:top_deprecated_api_limit] }}"
    top_deprecated_api_lines: "{{ (deprecated_api_lines | default([]))[:top_deprecated_api_limit] }}"
    top_services_without_endpoints: "{{ (services_without_endpoints | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_serviceaccounts: "{{ (likely_unused_serviceaccounts | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_configmaps: "{{ (likely_unused_configmaps | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_secrets: "{{ (likely_unused_secrets | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_crds: "{{ (likely_unused_crds | default([]))[:top_deprecated_api_limit] }}"
    top_image_registry_findings: "{{ (image_registry_findings | default([]))[:top_security_issue_limit] }}"
    top_feature_findings: "{{ (feature_findings | default([]))[:top_security_issue_limit] }}"
    top_observability_findings: "{{ (observability_findings | default([]))[:top_security_issue_limit] }}"
  changed_when: false

- name: Build security issue type counts
  ansible.builtin.set_fact:
    security_issue_type_counts: "{{ security_issue_type_counts | default({}) | combine({item.issue: ((security_issue_type_counts[item.issue] | default(0)) + 1)}, recursive=True) }}"
  loop: "{{ security_findings | default([]) }}"
  changed_when: false

- name: Build workload practice issue type counts
  ansible.builtin.set_fact:
    workload_practice_issue_type_counts: "{{ workload_practice_issue_type_counts | default({}) | combine({item.issue: ((workload_practice_issue_type_counts[item.issue] | default(0)) + 1)}, recursive=True) }}"
  loop: "{{ workload_practice_findings | default([]) }}"
  changed_when: false

- name: Build workload probe issue type counts
  ansible.builtin.set_fact:
    workload_probe_issue_type_counts: "{{ workload_probe_issue_type_counts | default({}) | combine({item.issue: ((workload_probe_issue_type_counts[item.issue] | default(0)) + 1)}, recursive=True) }}"
  loop: "{{ workload_probe_findings | default([]) }}"
  changed_when: false

- name: Build health summary
  ansible.builtin.set_fact:
    health_summary:
      status: >-
        {{
          'CRITICAL'
          if (
            cv_available != 'True'
            or cv_failing == 'True'
            or (degraded_operators | default([]) | length > 0)
            or (unavailable_operators | default([]) | length > 0)
            or (not_ready_nodes | default([]) | length > 0)
            or (degraded_mcps | default([]) | length > 0)
            or (route_issues | default([]) | length > 0)
            or (ingress_issues | default([]) | length > 0)
            or (route_host_conflicts | default([]) | length > 0)
            or (ingress_host_conflicts | default([]) | length > 0)
            or (auth_findings | default([]) | length > 0)
            or (ingresscontroller_issues | default([]) | length > 0)
            or (infrastructure_component_issues | default([]) | length > 0)
            or (critical_pod_density_nodes | default([]) | length > 0)
            or (expiring_certificates_critical | default([]) | length > 0)
            or (collection_summary.core_failed_commands | default(0) | int > 0)
          )
          else (
            'WARNING'
            if (
              (progressing_operators | default([]) | length > 0)
              or (pressure_nodes | default([]) | length > 0)
              or (platform_pod_issues | default([]) | length > 0)
              or (high_restart_pods | default([]) | length > 0)
              or (namespace_issue_summary | default([]) | length > 0)
              or (pvc_issues | default([]) | length > 0)
              or (pv_issues | default([]) | length > 0)
              or (workload_health_issues | default([]) | length > 0)
              or (workload_probe_findings | default([]) | length > 0)
              or (overprovisioned_pods | default([]) | length > 0)
              or (quota_pressure_findings | default([]) | length > 0)
              or (security_findings | default([]) | length > 0)
              or (workload_practice_findings | default([]) | length > 0)
              or (empty_user_namespaces | default([]) | length > 0)
              or (services_without_endpoints | default([]) | length > 0)
              or (likely_unused_serviceaccounts | default([]) | length > 0)
              or (likely_unused_configmaps | default([]) | length > 0)
              or (likely_unused_secrets | default([]) | length > 0)
              or (likely_unused_crds | default([]) | length > 0)
              or (image_registry_findings | default([]) | length > 0)
              or (feature_findings | default([]) | length > 0)
              or (namespaces_without_networkpolicy | default([]) | length > 0)
              or (namespaces_missing_ingress_policies | default([]) | length > 0)
              or (namespaces_missing_egress_policies | default([]) | length > 0)
              or (namespaces_without_limitrange | default([]) | length > 0)
              or (namespaces_without_resourcequota | default([]) | length > 0)
              or (conditional_updates | default([]) | length > 0)
              or (deprecated_crd_findings | default([]) | length > 0)
              or (deprecated_api_lines | default([]) | length > 0)
              or (high_pod_density_nodes | default([]) | length > 0)
              or (expiring_certificates_warning | default([]) | length > 0)
              or (observability_findings | default([]) | length > 0)
              or (recent_warning_events | default([]) | length > 0)
              or (collection_failures | default([]) | length > 0)
            )
            else 'HEALTHY'
          )
        }}
      cluster_version: "{{ clusterversion.status.desired.version | default('unknown') }}"
      operators_total: "{{ clusteroperators.items | default([]) | length }}"
      operators_degraded: "{{ degraded_operators | default([]) | length }}"
      operators_unavailable: "{{ unavailable_operators | default([]) | length }}"
      nodes_total: "{{ nodes.items | default([]) | length }}"
      nodes_not_ready: "{{ not_ready_nodes | default([]) | length }}"
      node_pressure_count: "{{ pressure_nodes | default([]) | length }}"
      mcps_degraded: "{{ degraded_mcps | default([]) | length }}"
      platform_pod_issues: "{{ platform_pod_issues | default([]) | length }}"
      high_restart_pods: "{{ high_restart_pods | default([]) | length }}"
      workload_health_issues: "{{ workload_health_issues | default([]) | length }}"
      workload_probe_findings: "{{ workload_probe_findings | default([]) | length }}"
      overprovisioned_pods: "{{ overprovisioned_pods | default([]) | length }}"
      quota_pressure_findings: "{{ quota_pressure_findings | default([]) | length }}"
      route_issues: "{{ route_issues | default([]) | length }}"
      ingress_issues: "{{ ingress_issues | default([]) | length }}"
      route_host_conflicts: "{{ route_host_conflicts | default([]) | length }}"
      ingress_host_conflicts: "{{ ingress_host_conflicts | default([]) | length }}"
      auth_findings: "{{ auth_findings | default([]) | length }}"
      ingresscontroller_issues: "{{ ingresscontroller_issues | default([]) | length }}"
      infrastructure_component_issues: "{{ infrastructure_component_issues | default([]) | length }}"
      security_findings: "{{ security_findings | default([]) | length }}"
      workload_practice_findings: "{{ workload_practice_findings | default([]) | length }}"
      empty_user_namespaces: "{{ empty_user_namespaces | default([]) | length }}"
      services_without_endpoints: "{{ services_without_endpoints | default([]) | length }}"
      likely_unused_serviceaccounts: "{{ likely_unused_serviceaccounts | default([]) | length }}"
      likely_unused_configmaps: "{{ likely_unused_configmaps | default([]) | length }}"
      likely_unused_secrets: "{{ likely_unused_secrets | default([]) | length }}"
      likely_unused_crds: "{{ likely_unused_crds | default([]) | length }}"
      image_registry_findings: "{{ image_registry_findings | default([]) | length }}"
      feature_findings: "{{ feature_findings | default([]) | length }}"
      deprecated_crd_findings: "{{ deprecated_crd_findings | default([]) | length }}"
      deprecated_api_lines: "{{ deprecated_api_lines | default([]) | length }}"
      namespaces_without_networkpolicy: "{{ namespaces_without_networkpolicy | default([]) | length }}"
      namespaces_missing_ingress_policies: "{{ namespaces_missing_ingress_policies | default([]) | length }}"
      namespaces_missing_egress_policies: "{{ namespaces_missing_egress_policies | default([]) | length }}"
      namespaces_without_resourcequota: "{{ namespaces_without_resourcequota | default([]) | length }}"
      namespaces_without_limitrange: "{{ namespaces_without_limitrange | default([]) | length }}"
      namespaces_non_active: "{{ namespace_issue_summary | default([]) | length }}"
      pv_issues: "{{ pv_issues | default([]) | length }}"
      pvc_issues: "{{ pvc_issues | default([]) | length }}"
      high_pod_density_nodes: "{{ high_pod_density_nodes | default([]) | length }}"
      critical_pod_density_nodes: "{{ critical_pod_density_nodes | default([]) | length }}"
      expiring_certificates_warning: "{{ expiring_certificates_warning | default([]) | length }}"
      expiring_certificates_critical: "{{ expiring_certificates_critical | default([]) | length }}"
      observability_findings: "{{ observability_findings | default([]) | length }}"
      collection_failed_commands: "{{ collection_summary.failed_commands | default(0) }}"
      collection_core_failed_commands: "{{ collection_summary.core_failed_commands | default(0) }}"
      collection_timed_out_commands: "{{ collection_summary.timed_out_commands | default(0) }}"
      available_updates: "{{ available_updates | default([]) | length }}"
      conditional_updates: "{{ conditional_updates | default([]) | length }}"
      recent_warning_events: "{{ recent_warning_events | default([]) | length }}"
      firing_alerts: "{{ firing_alerts | default([]) | length }}"

- name: Build cluster current state
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    from collections import Counter, defaultdict
    from datetime import datetime, timezone

    data = json.loads(r'''{{ {
      "cluster_profile": cluster_profile | default({}),
      "clusterversion": clusterversion | default({}),
      "clusteroperators": clusteroperators.items | default([]),
      "nodes": nodes.items | default([]),
      "pods": pods.items | default([]),
      "deployments": deployments.items | default([]),
      "statefulsets": statefulsets.items | default([]),
      "daemonsets": daemonsets.items | default([]),
      "routes": routes.items | default([]),
      "ingresses": ingresses.items | default([]),
      "namespaces": namespaces.items | default([]),
      "storageclasses": storageclasses.items | default([]),
      "machineconfigpools": machineconfigpools.items | default([]),
      "ingresscontrollers": ingresscontrollers.items | default([]),
      "node_pod_counts": node_pod_counts | default({}),
      "node_cpu_utilization_results": node_cpu_utilization_results | default([]),
      "node_memory_utilization_results": node_memory_utilization_results | default([]),
      "node_disk_utilization_results": node_disk_utilization_results | default([]),
      "kubelet_pod_density_results": kubelet_pod_density_results | default([]),
      "report_generated_at": report_generated_at,
      "cv_available": cv_available | default('Unknown'),
      "cv_progressing": cv_progressing | default('Unknown'),
      "cv_failing": cv_failing | default('Unknown')
    } | to_json }}''')

    def parse_cpu(value):
        if value in (None, ""):
            return 0.0
        s = str(value).strip()
        if s.endswith("m"):
            try:
                return float(s[:-1]) / 1000.0
            except Exception:
                return 0.0
        try:
            return float(s)
        except Exception:
            return 0.0

    def parse_binary_bytes(value):
        if value in (None, ""):
            return 0.0
        s = str(value).strip()
        multipliers = {
            "Ki": 1024,
            "Mi": 1024 ** 2,
            "Gi": 1024 ** 3,
            "Ti": 1024 ** 4,
            "Pi": 1024 ** 5,
            "Ei": 1024 ** 6,
            "K": 1000,
            "M": 1000 ** 2,
            "G": 1000 ** 3,
            "T": 1000 ** 4,
            "P": 1000 ** 5,
            "E": 1000 ** 6,
        }
        for suffix, mult in multipliers.items():
            if s.endswith(suffix):
                try:
                    return float(s[:-len(suffix)]) * mult
                except Exception:
                    return 0.0
        try:
            return float(s)
        except Exception:
            return 0.0

    def iso_to_dt(value):
        if not value:
            return None
        try:
            if str(value).endswith("Z"):
                return datetime.fromisoformat(str(value).replace("Z", "+00:00"))
            return datetime.fromisoformat(str(value))
        except Exception:
            return None

    def avg(values):
        vals = [float(v) for v in values if v not in (None, "")]
        if not vals:
            return None
        return round(sum(vals) / len(vals), 1)

    def summarize_counter(counter, key_name, value_name="count", limit=10):
        return [
            {key_name: key, value_name: value}
            for key, value in sorted(counter.items(), key=lambda item: (-item[1], str(item[0])))
        ][:limit]

    def normalize_instance_name(raw):
        if not raw:
            return ""
        text = str(raw)
        if ":" in text:
            return text.split(":", 1)[0]
        return text

    cpu_util_by_node = {}
    for item in data["node_cpu_utilization_results"]:
        node = normalize_instance_name(item.get("metric", {}).get("node") or item.get("metric", {}).get("kubernetes_node") or item.get("metric", {}).get("instance"))
        value = item.get("value", [None, None])[1]
        try:
            cpu_util_by_node[node] = float(value)
        except Exception:
            pass

    mem_util_by_node = {}
    for item in data["node_memory_utilization_results"]:
        node = normalize_instance_name(item.get("metric", {}).get("node") or item.get("metric", {}).get("kubernetes_node") or item.get("metric", {}).get("instance"))
        value = item.get("value", [None, None])[1]
        try:
            mem_util_by_node[node] = float(value)
        except Exception:
            pass

    disk_util_by_node = {}
    for item in data["node_disk_utilization_results"]:
        node = normalize_instance_name(item.get("metric", {}).get("node") or item.get("metric", {}).get("kubernetes_node") or item.get("metric", {}).get("instance"))
        value = item.get("value", [None, None])[1]
        try:
            disk_util_by_node[node] = float(value)
        except Exception:
            pass

    density_by_node = {}
    for item in data["kubelet_pod_density_results"]:
        node = normalize_instance_name(item.get("metric", {}).get("node") or item.get("metric", {}).get("instance"))
        value = item.get("value", [None, None])[1]
        try:
            density_by_node[node] = float(value)
        except Exception:
            pass

    role_counts = Counter()
    arch_counts = Counter()
    os_image_counts = Counter()
    kernel_counts = Counter()
    runtime_counts = Counter()
    kubelet_counts = Counter()
    instance_type_counts = Counter()
    node_shape_counts = Counter()
    provider_type_counts = Counter()
    operating_system_counts = Counter()
    feature_counts = Counter()
    worker_pool_counts = defaultdict(int)
    worker_pool_zones = defaultdict(set)
    total_cpu_cores = 0.0
    total_memory_bytes = 0.0
    total_disk_bytes = 0.0
    total_pods_scheduled = 0
    master_nodes = 0
    worker_nodes = 0
    infra_nodes = 0
    other_nodes = 0

    def choose_primary_role(roles):
        if "master" in roles:
            return "master"
        if "control-plane" in roles:
            return "control-plane"
        if "infra" in roles:
            return "infra"
        if "worker" in roles:
            return "worker"
        return sorted(roles)[0] if roles else "worker"

    def classify_provider(provider_id, labels, platform):
        text = str(provider_id or "").lower()
        p = str(platform or "").lower()
        if text.startswith("aws://") or p == "aws":
            return "aws"
        if text.startswith("azure://") or p == "azure":
            return "azure"
        if text.startswith("gce://") or p == "gcp":
            return "gcp"
        if text.startswith("vsphere://") or p == "vsphere":
            return "vsphere"
        if text.startswith("openstack://") or p == "openstack":
            return "openstack"
        if text.startswith("ibm://") or p == "ibmcloud":
            return "ibmcloud"
        if text.startswith("nutanix://") or p == "nutanix":
            return "nutanix"
        if text.startswith("oirt://") or text.startswith("ovirt://") or p == "ovirt":
            return "ovirt"
        if text.startswith("libvirt://") or p == "libvirt":
            return "libvirt"
        if p == "baremetal":
            return "baremetal"
        if labels.get("node.openshift.io/os_id") == "rhcos":
            return "platform-managed-or-upi"
        return "unknown"

    def build_node_shape(instance_type, cpu_cores, memory_gib, arch):
        if instance_type and instance_type != "unknown":
            return instance_type, "instance-type-label"
        cpu_part = int(round(cpu_cores)) if cpu_cores >= 1 else round(cpu_cores, 1)
        mem_part = int(round(memory_gib)) if memory_gib >= 1 else round(memory_gib, 1)
        return f"{cpu_part}cpu-{mem_part}gib-{arch}", "allocatable-shape"

    for node in data["nodes"]:
        meta = node.get("metadata", {}) or {}
        labels = meta.get("labels", {}) or {}
        status = node.get("status", {}) or {}
        spec = node.get("spec", {}) or {}
        node_name = meta.get("name", "")
        roles = []
        for key in labels:
            if key.startswith("node-role.kubernetes.io/"):
                role = key.replace("node-role.kubernetes.io/", "", 1) or "worker"
                roles.append(role)
        primary_role = choose_primary_role(roles)
        role_counts[primary_role] += 1
        if primary_role in {"master", "control-plane"}:
            master_nodes += 1
        elif primary_role == "worker":
            worker_nodes += 1
        elif primary_role == "infra":
            infra_nodes += 1
        else:
            other_nodes += 1

        node_info = status.get("nodeInfo", {}) or {}
        arch_counts[node_info.get("architecture", "unknown")] += 1
        os_image_counts[node_info.get("osImage", "unknown")] += 1
        kernel_counts[node_info.get("kernelVersion", "unknown")] += 1
        runtime_counts[node_info.get("containerRuntimeVersion", "unknown")] += 1
        kubelet_counts[node_info.get("kubeletVersion", "unknown")] += 1
        operating_system_counts[node_info.get("operatingSystem", "unknown")] += 1

        instance_type = (
            labels.get("node.kubernetes.io/instance-type")
            or labels.get("beta.kubernetes.io/instance-type")
            or labels.get("machine.openshift.io/instance-type")
            or "unknown"
        )
        instance_type_counts[instance_type] += 1
        provider_type = classify_provider(spec.get("providerID"), labels, (data["cluster_profile"] or {}).get("platform", ""))
        provider_type_counts[provider_type] += 1

        zone = (
            labels.get("topology.kubernetes.io/zone")
            or labels.get("failure-domain.beta.kubernetes.io/zone")
            or "unknown"
        )
        arch = node_info.get("architecture", "unknown")
        allocatable = status.get("allocatable", {}) or {}
        cpu_cores = parse_cpu(allocatable.get("cpu", "0"))
        memory_gib = parse_binary_bytes(allocatable.get("memory", "0")) / (1024 ** 3)
        node_shape, node_shape_source = build_node_shape(instance_type, cpu_cores, memory_gib, arch)
        node_shape_counts[node_shape] += 1
        if primary_role == "worker":
            pool_key = (primary_role, node_shape, node_shape_source, arch, provider_type)
            worker_pool_counts[pool_key] += 1
            worker_pool_zones[pool_key].add(zone)

        for key, value in labels.items():
            if key.startswith("feature.node.kubernetes.io/") and str(value).lower() not in {"false", "", "0"}:
                feature_counts[key.replace("feature.node.kubernetes.io/", "", 1)] += 1

        total_cpu_cores += cpu_cores
        total_memory_bytes += parse_binary_bytes(allocatable.get("memory", "0"))
        total_disk_bytes += parse_binary_bytes(allocatable.get("ephemeral-storage", "0"))
        total_pods_scheduled += int(data["node_pod_counts"].get(node_name, 0) or 0)

    running_pods = 0
    for pod in data["pods"]:
        if ((pod.get("status", {}) or {}).get("phase", "Unknown")) == "Running":
            running_pods += 1

    default_ingress = None
    for ic in data["ingresscontrollers"]:
        if (ic.get("metadata", {}) or {}).get("name") == "default":
            default_ingress = ic
            break
    if default_ingress is None and data["ingresscontrollers"]:
        default_ingress = data["ingresscontrollers"][0]

    ingress_visibility = "unknown"
    ingress_strategy = "unknown"
    if default_ingress:
        strategy = (((default_ingress.get("spec", {}) or {}).get("endpointPublishingStrategy", {}) or {}))
        ingress_strategy = strategy.get("type", "unknown")
        scope = (((strategy.get("loadBalancer", {}) or {}).get("scope")) or "").lower()
        if scope == "internal":
            ingress_visibility = "private"
        elif ingress_strategy == "LoadBalancerService" and scope in {"external", ""}:
            ingress_visibility = "public"

    api_url = ((data["cluster_profile"] or {}).get("api_url") or "").lower()
    api_internal_url = ((data["cluster_profile"] or {}).get("api_internal_url") or "").lower()
    api_visibility = "unknown"
    if api_url and api_internal_url:
        if api_url == api_internal_url or ".internal." in api_url or api_url.startswith("https://api-int."):
            api_visibility = "private"
        else:
            api_visibility = "public"
    elif api_url:
        api_visibility = "private" if (".internal." in api_url or api_url.startswith("https://api-int.")) else "public"

    cluster_visibility = "unknown"
    if api_visibility == "private" and ingress_visibility == "private":
        cluster_visibility = "private"
    elif api_visibility == "public" or ingress_visibility == "public":
        cluster_visibility = "public"
    elif api_visibility == "private" or ingress_visibility == "private":
        cluster_visibility = "mixed"

    install_candidates = []
    cv = data["clusterversion"] or {}
    for entry in (((cv.get("status", {}) or {}).get("history", []) or [])):
        install_candidates.append(entry.get("startedTime"))
        install_candidates.append(entry.get("completionTime"))
    install_candidates.append((cv.get("metadata", {}) or {}).get("creationTimestamp"))
    install_dt_values = [iso_to_dt(x) for x in install_candidates if x]
    install_dt_values = [x for x in install_dt_values if x is not None]
    installed_at = None
    uptime_days = None
    uptime_human = "unknown"
    now_dt = iso_to_dt(data["report_generated_at"])
    if install_dt_values and now_dt is not None:
        installed_at_dt = min(install_dt_values)
        installed_at = installed_at_dt.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
        uptime_seconds = max(0.0, (now_dt - installed_at_dt).total_seconds())
        uptime_days = round(uptime_seconds / 86400.0, 1)
        days = int(uptime_seconds // 86400)
        hours = int((uptime_seconds % 86400) // 3600)
        uptime_human = f"{days}d {hours}h"

    kube_versions = summarize_counter(kubelet_counts, "version", "count", limit=10)
    primary_kube_version = kube_versions[0]["version"] if kube_versions else "unknown"
    kubernetes_version_state = "mixed" if len(kubelet_counts) > 1 else "uniform"

    clusteroperators = {item.get("metadata", {}).get("name", ""): item for item in data["clusteroperators"]}
    insights_operator = clusteroperators.get("insights", {})
    insights_conditions = {
        cond.get("type"): cond.get("status")
        for cond in ((insights_operator.get("status", {}) or {}).get("conditions", []) or [])
    }
    if not insights_operator:
        insights_status = "unknown"
    elif insights_conditions.get("Available") == "True" and insights_conditions.get("Degraded") != "True":
        insights_status = "enabled and healthy"
    elif insights_conditions.get("Degraded") == "True":
        insights_status = "enabled but degraded"
    else:
        insights_status = "configured but not healthy"

    worker_pools = []
    for (role, node_shape, node_shape_source, arch, provider_type), count in sorted(worker_pool_counts.items(), key=lambda item: (-item[1], item[0][0], item[0][1], item[0][2], item[0][3])):
        worker_pools.append({
            "role": role,
            "type": node_shape,
            "type_source": node_shape_source,
            "architecture": arch,
            "provider": provider_type,
            "nodes": count,
            "zones": sorted(worker_pool_zones[(role, node_shape, node_shape_source, arch, provider_type)]),
        })

    mcp_summary = []
    for item in data["machineconfigpools"]:
        status = item.get("status", {}) or {}
        mcp_summary.append({
            "name": (item.get("metadata", {}) or {}).get("name", "unknown"),
            "machine_count": int(status.get("machineCount", 0) or 0),
            "ready_machine_count": int(status.get("readyMachineCount", 0) or 0),
            "updated_machine_count": int(status.get("updatedMachineCount", 0) or 0),
            "degraded_machine_count": int(status.get("degradedMachineCount", 0) or 0),
        })
    mcp_summary.sort(key=lambda item: item["name"])

    result = {
        "ocp_version": (((cv.get("status", {}) or {}).get("desired", {}) or {}).get("version", "unknown")),
        "cluster_version_available": data["cv_available"],
        "cluster_version_progressing": data["cv_progressing"],
        "cluster_version_failing": data["cv_failing"],
        "kubernetes_version": primary_kube_version,
        "kubernetes_version_state": kubernetes_version_state,
        "kubernetes_versions": kube_versions,
        "insights_status": insights_status,
        "cluster_visibility": cluster_visibility,
        "api_visibility": api_visibility,
        "ingress_visibility": ingress_visibility,
        "default_ingress_strategy": ingress_strategy,
        "installed_at": installed_at or "unknown",
        "uptime_days": uptime_days if uptime_days is not None else "unknown",
        "uptime_human": uptime_human,
        "machineconfigpool_count": len(data["machineconfigpools"]),
        "worker_pool_count": len(worker_pools),
        "node_counts": {
            "total": len(data["nodes"]),
            "control_plane": master_nodes,
            "worker": worker_nodes,
            "infra": infra_nodes,
            "other": other_nodes,
        },
        "object_counts": {
            "namespaces": len(data["namespaces"]),
            "pods": len(data["pods"]),
            "running_pods": running_pods,
            "deployments": len(data["deployments"]),
            "statefulsets": len(data["statefulsets"]),
            "daemonsets": len(data["daemonsets"]),
            "routes": len(data["routes"]),
            "ingresses": len(data["ingresses"]),
            "storageclasses": len(data["storageclasses"]),
        },
        "resources": {
            "total_cpu_cores": round(total_cpu_cores, 1),
            "total_memory_gib": round(total_memory_bytes / (1024 ** 3), 1),
            "total_ephemeral_storage_gib": round(total_disk_bytes / (1024 ** 3), 1),
            "average_cpu_cores_per_node": round(total_cpu_cores / len(data["nodes"]), 1) if data["nodes"] else 0,
            "average_memory_gib_per_node": round((total_memory_bytes / (1024 ** 3)) / len(data["nodes"]), 1) if data["nodes"] else 0,
            "average_ephemeral_storage_gib_per_node": round((total_disk_bytes / (1024 ** 3)) / len(data["nodes"]), 1) if data["nodes"] else 0,
            "average_pods_per_node": round(total_pods_scheduled / len(data["nodes"]), 1) if data["nodes"] else 0,
            "average_pod_density_pct": avg(density_by_node.values()) if density_by_node else None,
            "average_cpu_utilization_pct": avg(cpu_util_by_node.values()) if cpu_util_by_node else None,
            "average_memory_utilization_pct": avg(mem_util_by_node.values()) if mem_util_by_node else None,
            "average_disk_utilization_pct": avg(disk_util_by_node.values()) if disk_util_by_node else None,
        },
        "node_architectures": summarize_counter(arch_counts, "architecture", "count", limit=10),
        "instance_types": summarize_counter(Counter({k: v for k, v in instance_type_counts.items() if k != "unknown"}), "instance_type", "count", limit=10),
        "node_shapes": summarize_counter(node_shape_counts, "shape", "count", limit=12),
        "provider_types": summarize_counter(provider_type_counts, "provider", "count", limit=10),
        "operating_systems": summarize_counter(operating_system_counts, "operating_system", "count", limit=10),
        "os_images": summarize_counter(os_image_counts, "os_image", "count", limit=10),
        "kernel_versions": summarize_counter(kernel_counts, "kernel_version", "count", limit=10),
        "container_runtimes": summarize_counter(runtime_counts, "runtime", "count", limit=10),
        "node_roles": summarize_counter(role_counts, "role", "count", limit=10),
        "top_node_features": summarize_counter(feature_counts, "feature", "node_count", limit=12),
        "worker_pools": worker_pools[:15],
        "machineconfigpools": mcp_summary,
    }

    print(json.dumps(result))
    PY
  register: cluster_current_state_cmd
  changed_when: false
  failed_when: false

- name: Normalize cluster current state
  ansible.builtin.set_fact:
    cluster_current_state: "{{ cluster_current_state_cmd.stdout | from_json if (cluster_current_state_cmd.rc == 0 and (cluster_current_state_cmd.stdout | default('') | length > 0)) else {} }}"
