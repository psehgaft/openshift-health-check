---
- name: Check for reusable live report payload artifact
  ansible.builtin.stat:
    path: "{{ report_run_workspace_report_dir }}/payload.json"
  register: report_resume_live_payload_artifact_stat
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)
    - not ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Resolve live report payload artifact reuse eligibility
  ansible.builtin.set_fact:
    report_resume_payload_reuse_active: >-
      {{
        (report_run_mode | default('fresh')) == 'resume_last_failure'
        and (report_resume_live_payload_artifact_stat.stat.exists | default(false))
        and (((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true)) | bool)
        and not ((report_resume_artifact_plan | default({})).get('report', {}).get('invalidated', false) | bool)
      }}
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)
    - not ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Load reusable live payload artifact
  ansible.builtin.include_role:
    name: report_common
    tasks_from: load_openshift_report_payload_artifact.yml
  when: report_resume_payload_reuse_active | default(false) | bool

- name: Resolve reusable live report artifact basenames for resume
  ansible.builtin.set_fact:
    report_resume_reusable_markdown_name: "{{ (report_resume_artifact_plan.report.markdown.path | default('') | basename) }}"
    report_resume_reusable_json_name: "{{ (report_resume_artifact_plan.report.json.path | default('') | basename) }}"
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Repoint live report output paths to reusable artifact names
  ansible.builtin.set_fact:
    report_path: "{{ report_output_dir }}/{{ report_resume_reusable_markdown_name }}"
    report_json_path: "{{ report_output_dir }}/{{ report_resume_reusable_json_name }}"
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Restore reusable live Markdown report into output directory
  ansible.builtin.copy:
    src: "{{ report_run_workspace_report_dir }}/{{ report_resume_reusable_markdown_name }}"
    dest: "{{ report_path }}"
    mode: "0644"
    remote_src: true
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Restore reusable live JSON report into output directory
  ansible.builtin.copy:
    src: "{{ report_run_workspace_report_dir }}/{{ report_resume_reusable_json_name }}"
    dest: "{{ report_json_path }}"
    mode: "0644"
    remote_src: true
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Re-wrap resumed report data structures as unsafe before Markdown render
  ansible.builtin.set_fact:
    analysis_graph: "{{ (analysis_graph | default({})) | ohc_wrap_unsafe }}"
    cluster_profile: "{{ (cluster_profile | default({})) | ohc_wrap_unsafe }}"
    cluster_current_state: "{{ (cluster_current_state | default({})) | ohc_wrap_unsafe }}"
    health_summary: "{{ (health_summary | default({})) | ohc_wrap_unsafe }}"
    openshift_report_payload_common: "{{ (openshift_report_payload_common | default({})) | ohc_wrap_unsafe }}"
    audit_report: "{{ (audit_report | default({})) | ohc_wrap_unsafe }}"
    auth_posture_summary: "{{ (auth_posture_summary | default({})) | ohc_wrap_unsafe }}"
    day2_posture_summary: "{{ (day2_posture_summary | default({})) | ohc_wrap_unsafe }}"
    declarative_operations_summary: "{{ (declarative_operations_summary | default({})) | ohc_wrap_unsafe }}"
    backup_recovery_summary: "{{ (backup_recovery_summary | default({})) | ohc_wrap_unsafe }}"
    observability_summary: "{{ (observability_summary | default({})) | ohc_wrap_unsafe }}"
    security_governance_summary: "{{ (security_governance_summary | default({})) | ohc_wrap_unsafe }}"
    workload_summary: "{{ (workload_summary | default({})) | ohc_wrap_unsafe }}"
    architecture_lifecycle_summary: "{{ (architecture_lifecycle_summary | default({})) | ohc_wrap_unsafe }}"
    day2_readiness_summary: "{{ (day2_readiness_summary | default({})) | ohc_wrap_unsafe }}"
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)
    - not ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Write final Markdown report artifacts
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/write_stdin_to_files.py"
      - "{{ report_path }}"
      - "{{ report_run_workspace_report_dir }}/{{ report_path | basename }}"
      - --mode
      - "0644"
      - --normalize-unknown-labels
    stdin: "{{ lookup('template', report_markdown_template) }}"
  changed_when: true
  when: ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)

- name: Normalize final Markdown Findings tables
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/normalize_findings_tables.py"
      - "{{ report_path }}"
      - "{{ report_run_workspace_report_dir }}/{{ report_path | basename }}"
  changed_when: true
  when: ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)

- name: Render final HTML report when pandoc is available
  ansible.builtin.command:
    argv:
      - pandoc
      - --standalone
      - --from
      - gfm
      - --to
      - html5
      - --css
      - "{{ report_css_path }}"
      - --output
      - "{{ report_html_path }}"
      - "{{ report_path }}"
  register: report_html_cmd
  changed_when: true
  failed_when: false
  when:
    - report_generate_html | default(true) | bool
    - report_pandoc_available | default(false) | bool
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)

- name: Render final PDF report when a PDF engine is available
  ansible.builtin.command:
    argv: "{{ ['pandoc', '--standalone', '--from', 'gfm', '--css', report_css_path, '--pdf-engine=' ~ report_pdf_engine] + (report_pdf_engine_argv | default([])) + ['--output', report_pdf_path, report_path] }}"
  register: report_pdf_cmd
  changed_when: true
  failed_when: false
  when:
    - report_generate_pdf | default(true) | bool
    - report_pandoc_available | default(false) | bool
    - report_pdf_engine | length > 0
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)

- name: Write final live JSON report artifacts
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/write_stdin_to_files.py"
      - "{{ report_run_workspace_report_dir }}/payload.json"
      - "{{ report_json_path }}"
      - "{{ report_run_workspace_report_dir }}/{{ report_json_path | basename }}"
      - --mode
      - "0644"
      - --json-pretty
    stdin: "{{ audit_report | to_json }}"
  changed_when: false
  when: ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)

- name: Record final report artifacts in workspace manifest tracking
  ansible.builtin.set_fact:
    report_workspace_completed_artifacts: >-
      {{
        (report_workspace_completed_artifacts | default([]))
        + ['report/' ~ (report_path | basename)]
        + ['report/' ~ (report_json_path | basename)]
        + ['report/payload.json']
      }}
  when: ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)
