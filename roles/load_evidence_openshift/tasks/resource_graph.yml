---
- name: Build collected-resource extractor input arguments
  ansible.builtin.set_fact:
    collected_resource_extractor_args: >-
      {{
        []
        + (['must-gather', must_gather_path] if (must_gather_path | default('') | trim | length > 0) else [])
        + (['inspect', inspect_path] if (inspect_path | default('') | trim | length > 0) else [])
      }}

- name: Resolve collected-resource extractor cache key
  ansible.builtin.set_fact:
    collected_resource_cache_key: >-
      {{
        (
          (collected_resource_extractor_args | join('||'))
          ~ '||'
          ~ ((playbook_dir ~ '/../scripts/extract_offline_resources.py') | realpath)
          ~ '||'
          ~ (lookup('file', playbook_dir ~ '/../scripts/extract_offline_resources.py') | hash('sha1'))
        ) | hash('sha1')
      }}

- name: Resolve collected-resource extractor cache path
  ansible.builtin.set_fact:
    collected_resource_cache_path: "{{ '/tmp/ohc-collected-resource-cache-' ~ collected_resource_cache_key ~ '.json' }}"

- name: Stat collected-resource extractor cache
  ansible.builtin.stat:
    path: "{{ collected_resource_cache_path }}"
  register: collected_resource_cache_stat

- name: Extract selected OpenShift resources from collected evidence
  ansible.builtin.command:
    argv: "{{ ['python3', playbook_dir ~ '/../scripts/extract_offline_resources.py'] + collected_resource_extractor_args }}"
  register: collected_resource_extract_cmd
  changed_when: false
  when: not (collected_resource_cache_stat.stat.exists | default(false))

- name: Persist collected-resource extractor cache
  ansible.builtin.copy:
    dest: "{{ collected_resource_cache_path }}"
    mode: "0600"
    content: "{{ collected_resource_extract_cmd.stdout }}"
  when:
    - not (collected_resource_cache_stat.stat.exists | default(false))
    - collected_resource_extract_cmd is defined
    - (collected_resource_extract_cmd.rc | default(1)) == 0
    - (collected_resource_extract_cmd.stdout | default('') | trim | length > 0)

- name: Load collected-resource graph from cache
  ansible.builtin.slurp:
    path: "{{ collected_resource_cache_path }}"
  register: collected_resource_cache_slurp

- name: Normalize extracted OpenShift resource facts
  vars:
    collected_resource_cache_payload: "{{ ((collected_resource_cache_slurp.content | b64decode) | from_json) if ((collected_resource_cache_slurp.content | default('') | length) > 0) else {} }}"
  ansible.builtin.set_fact:
    collected_resource_graph: "{{ collected_resource_cache_payload }}"

- name: Validate collected-resource graph JSON
  ansible.builtin.assert:
    that:
      - collected_resource_graph is mapping
    fail_msg: "Cached OpenShift resource graph is not valid JSON."
