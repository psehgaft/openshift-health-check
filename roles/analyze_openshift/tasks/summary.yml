      'storageclass_count': ((graph.storageclasses | default({})).get('items', []) | length),
      'machineconfigpool_count': ((graph.machineconfigpools | default({})).get('items', []) | length),
      'machineconfigpools': graph.machineconfigpools | default({'items': []}),
