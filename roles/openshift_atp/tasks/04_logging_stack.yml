---
# ==============================================================================
# Section 4: Logging Stack (TC 39 to TC 40)
# ==============================================================================

# TC 39: Loki Stack Index validation
- name: "TC-39: Loki Stack Index validation"
  when: run_tc39_loki_stack_indices | default(true) | bool
  block:
    - name: "TC-39: Verify LokiStack CR and storage"
      ansible.builtin.command: oc get lokistack -n openshift-logging
      register: tc39_cmd
      changed_when: false
      failed_when: false

    - name: "TC-39: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-39',
          'name': 'Loki Stack Index validation',
          'category': 'Logging Stack',
          'expected': 'LokiStack indices (application, infrastructure, audit) available',
          'status': ('Pass' if tc39_cmd.rc == 0 else 'Fail'),
          'procedure': (tc39_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc39_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc39_cmd.stderr | default(''))) if (tc39_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc39_cmd.rc | string) if tc39_cmd.rc is defined else '')),
          'details': tc39_cmd.stdout | default(tc39_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc39', 'logging']

# TC 40: Check logs in Loki Stack
- name: "TC-40: Check logs in Loki Stack"
  when: run_tc40_loki_stack_logs | default(true) | bool
  block:
    - name: "TC-40: Query LokiStack gateway pods"
      ansible.builtin.command: oc get pods -n openshift-logging -l app.kubernetes.io/name=lokistack
      register: tc40_cmd
      changed_when: false
      failed_when: false

    - name: "TC-40: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-40',
          'name': 'Check logs in Loki Stack',
          'category': 'Logging Stack',
          'expected': 'Application and cluster logs stored and queryable in Loki',
          'status': ('Pass' if tc40_cmd.rc == 0 else 'Fail'),
          'procedure': (tc40_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc40_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc40_cmd.stderr | default(''))) if (tc40_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc40_cmd.rc | string) if tc40_cmd.rc is defined else '')),
          'details': tc40_cmd.stdout | default(tc40_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc40', 'logging']