        {%- elif (not capability_assessment_completed) and (section.key | default('') == 'cyberark_conjur_secrets_management') -%}
          {%- set conjur_namespace_present = false -%}
          {%- for ns_name in (namespace_names | default([])) -%}
            {%- set lowered = ns_name | string | lower -%}
            {%- if lowered in ['conjur', 'conjur-server', 'cyberark-conjur'] -%}
