---
- name: Create cluster current state temp input
  ansible.builtin.tempfile:
    state: file
    prefix: openshift-cluster-current-state-
    suffix: .json
  register: cluster_current_state_input

- name: Write cluster current state input
  vars:
    graph: "{{ analysis_graph | default({}) }}"
  ansible.builtin.copy:
    dest: "{{ cluster_current_state_input.path }}"
    mode: "0600"
    content: "{{ {
      'cluster_profile': cluster_profile | default({}),
      'clusterversion': graph.clusterversion | default({}),
      'nodes': (graph.nodes | default({})).get('items', []),
      'pods': (graph.pods | default({})).get('items', []),
      'resourcequotas': (graph.resourcequotas | default({})).get('items', []),
      'pod_object_counts': pod_object_counts | default({}),
      'deployment_count': ((graph.deployments | default({})).get('items', []) | length),
      'statefulset_count': ((graph.statefulsets | default({})).get('items', []) | length),
      'daemonset_count': ((graph.daemonsets | default({})).get('items', []) | length),
      'route_count': ((graph.routes | default({})).get('items', []) | length),
      'ingress_count': ((graph.ingresses | default({})).get('items', []) | length),
      'namespace_count': ((graph.namespaces | default({})).get('items', []) | length),
      'storageclass_count': ((graph.storageclasses | default({})).get('items', []) | length),
      'machineconfigpool_count': ((graph.machineconfigpools | default({})).get('items', []) | length),
      'machineconfigpools': graph.machineconfigpools | default({'items': []}),
      'ingresscontrollers': (graph.ingresscontrollers | default({})).get('items', []),
      'services': (graph.services | default({})).get('items', []),
      'configmaps': (graph.configmaps | default({})).get('items', []),
      'secrets': (graph.secrets | default({})).get('items', []),
      'node_pod_counts': node_pod_counts | default({}),
      'node_cpu_utilization_results': node_cpu_utilization_results | default([]),
      'node_memory_utilization_results': node_memory_utilization_results | default([]),
      'node_disk_utilization_results': node_disk_utilization_results | default([]),
      'pod_cpu_usage_all_results': pod_cpu_usage_all_results | default([]),
      'pod_memory_usage_all_results': pod_memory_usage_all_results | default([]),
      'kubelet_pod_density_results': kubelet_pod_density_results | default([]),
      'runtime_signal_resolution_map': runtime_signal_resolution_map | default({}),
      'service_ip_capacity_summary': service_ip_capacity_summary | default({}),
      'pod_ip_capacity_summary': pod_ip_capacity_summary | default({}),
      'node_ip_capacity_summary': node_ip_capacity_summary | default({}),
      'report_generated_at': report_generated_at | default(''),
      'cv_available': cv_available | default('Unknown'),
      'cv_progressing': cv_progressing | default('Unknown'),
      'cv_failing': cv_failing | default('Unknown'),
      'insights_available': ((clusteroperator_status_map | default({})).get('insights', {})).get('available', 'Unknown'),
      'insights_degraded': ((clusteroperator_status_map | default({})).get('insights', {})).get('degraded', 'Unknown'),
      'openshift_deployment_type': cluster_profile.deployment_type | default('openshift'),
      'openshift_cluster_classification_label': cluster_profile.cluster_classification_label | default(cluster_profile.deployment_type | default('openshift')),
      'openshift_cluster_classification_source': cluster_profile.cluster_classification_source | default(cluster_profile.deployment_type_source | default('default-openshift-fallback')),
      'openshift_cluster_classification_confidence': cluster_profile.cluster_classification_confidence | default(cluster_profile.deployment_type_confidence | default('low')),
      'openshift_service_model': cluster_profile.service_model | default('unknown'),
      'openshift_service_variant': cluster_profile.service_variant | default('unknown'),
      'openshift_install_model': cluster_profile.install_model | default('unknown'),
      'openshift_install_model_confidence': cluster_profile.install_model_confidence | default('low'),
      'openshift_control_plane_model': cluster_profile.control_plane_model | default('unknown'),
      'openshift_platform_category': cluster_profile.platform_category | default('unknown'),
      'openshift_public_cloud': cluster_profile.public_cloud | default(false),
      'openshift_is_sno': cluster_profile.is_sno | default(false),
      'openshift_is_hosted_control_plane': cluster_profile.is_hosted_control_plane | default(false)
    } | to_nice_json }}"

- name: Build cluster current state
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/build_openshift_cluster_current_state.py"
      - "{{ cluster_current_state_input.path }}"
  register: cluster_current_state_cmd
  changed_when: false
  failed_when: false

- name: Normalize cluster current state
  vars:
    graph: "{{ analysis_graph | default({}) }}"
    fallback_cluster_networks: "{{ cluster_profile.cluster_networks | default([]) }}"
    fallback_node_count: "{{ (graph.nodes | default({})).get('items', []) | length }}"
    fallback_total_node_slots: >-
      {%- set ns = namespace(total=0) -%}
      {%- for item in fallback_cluster_networks -%}
      {%- set cidr_text = ((item.cidr | default(item.CIDR | default(''))) if (item is mapping) else (item | string)) -%}
      {%- set host_prefix_text = ((item.hostPrefix | string) if (item is mapping and item.hostPrefix is defined and item.hostPrefix is not none) else '') -%}
      {%- set network_prefix_text = (cidr_text | regex_replace('^.*/', '')) -%}
      {%- if (cidr_text | length) > 0 and (host_prefix_text | length) > 0 and network_prefix_text != cidr_text -%}
      {%- set host_prefix_int = host_prefix_text | int(-1) -%}
      {%- set network_prefix_int = network_prefix_text | int(-1) -%}
      {%- if host_prefix_int >= network_prefix_int and network_prefix_int >= 0 -%}
      {%- set ns.total = ns.total + (2 ** (host_prefix_int - network_prefix_int)) -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.total }}
    fallback_additional_nodes_by_pod_network: >-
      {{
        ([((fallback_total_node_slots | int) - (fallback_node_count | int)), 0] | max)
        if (fallback_total_node_slots | int) > 0
        else 'unknown'
      }}
    fallback_pod_network_headroom_pct: >-
      {{
        (((([((fallback_total_node_slots | int) - (fallback_node_count | int)), 0] | max) / (fallback_total_node_slots | float)) * 100) | round(1))
        if (fallback_total_node_slots | int) > 0
        else 'unknown'
      }}
    fallback_node_ips_available: "{{ node_ip_capacity_summary.available_ips | default('unknown') }}"
    fallback_effective_additional_nodes: >-
      {{
        ([(fallback_additional_nodes_by_pod_network | int), (fallback_node_ips_available | int)] | min)
        if (
          (fallback_total_node_slots | int) > 0
          and (fallback_node_ips_available is number or ((fallback_node_ips_available | string) is match('^[0-9]+$')))
        )
        else (
          (fallback_node_ips_available | int)
          if (
            (fallback_total_node_slots | int) == 0
            and (fallback_node_ips_available is number or ((fallback_node_ips_available | string) is match('^[0-9]+$')))
          )
          else fallback_additional_nodes_by_pod_network
        )
      }}
    insights_status_fallback: >-
      {{
        'unknown'
        if (((clusteroperator_status_map | default({})).get('insights', {})) | length) == 0
        else (
          'enabled and healthy'
          if (((clusteroperator_status_map | default({})).get('insights', {})).get('available', 'Unknown') == 'True'
              and ((clusteroperator_status_map | default({})).get('insights', {})).get('degraded', 'False') != 'True')
          else (
            'enabled but degraded'
            if (((clusteroperator_status_map | default({})).get('insights', {})).get('degraded', 'False') == 'True')
            else 'configured but not healthy'
          )
        )
      }}
    cluster_current_state_fallback:
      ocp_version: "{{ graph.clusterversion.status.desired.version | default('unknown') }}"
      cluster_version_available: "{{ cv_available | default('Unknown') }}"
      cluster_version_progressing: "{{ cv_progressing | default('Unknown') }}"
      cluster_version_failing: "{{ cv_failing | default('Unknown') }}"
      kubernetes_version: "{{ (kubelet_version_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | map(attribute='key') | first) | default('unknown') }}"
      deployment_type: "{{ cluster_profile.deployment_type | default('openshift') }}"
      cluster_classification_label: "{{ cluster_profile.cluster_classification_label | default(cluster_profile.deployment_type | default('openshift')) }}"
      cluster_classification_source: "{{ cluster_profile.cluster_classification_source | default(cluster_profile.deployment_type_source | default('default-openshift-fallback')) }}"
      cluster_classification_confidence: "{{ cluster_profile.cluster_classification_confidence | default(cluster_profile.deployment_type_confidence | default('low')) }}"
      service_model: "{{ cluster_profile.service_model | default('unknown') }}"
      service_variant: "{{ cluster_profile.service_variant | default('unknown') }}"
      install_model: "{{ cluster_profile.install_model | default('unknown') }}"
      install_model_confidence: "{{ cluster_profile.install_model_confidence | default('low') }}"
      control_plane_model: "{{ cluster_profile.control_plane_model | default('unknown') }}"
      platform_category: "{{ cluster_profile.platform_category | default('unknown') }}"
      public_cloud: "{{ cluster_profile.public_cloud | default(false) | bool }}"
      is_sno: "{{ cluster_profile.is_sno | default(false) | bool }}"
      is_hosted_control_plane: "{{ cluster_profile.is_hosted_control_plane | default(false) | bool }}"
      kubernetes_version_state: "{{ 'mixed' if ((kubelet_version_counts | default({}) | length) > 1) else ('uniform' if ((kubelet_version_counts | default({}) | length) == 1) else 'unknown') }}"
      kubernetes_versions: []
      insights_status: "{{ insights_status_fallback }}"
      cluster_visibility: unknown
      api_visibility: unknown
      ingress_visibility: unknown
      default_ingress_strategy: unknown
      installed_at: unknown
      uptime_days: unknown
      uptime_human: unknown
      machineconfigpool_count: "{{ (graph.machineconfigpools | default({})).get('items', []) | length }}"
      worker_pool_count: 0
      node_counts:
        total: "{{ (graph.nodes | default({})).get('items', []) | length }}"
        control_plane: "{{ ((cluster_profile.control_plane_node_count | default(0)) | int) }}"
        worker: "{{ ((cluster_profile.worker_node_count | default(0)) | int) }}"
        infra: "{{ ((cluster_profile.infra_node_count | default(0)) | int) }}"
        other: "{{ [0, ((graph.nodes | default({})).get('items', []) | length) - ((cluster_profile.control_plane_node_count | default(0) | int) + (cluster_profile.worker_node_count | default(0) | int) + (cluster_profile.infra_node_count | default(0) | int))] | max }}"
      object_counts:
        namespaces: "{{ (graph.namespaces | default({})).get('items', []) | length }}"
        pods: "{{ (graph.pods | default({})).get('items', []) | length }}"
        running_pods: "{{ (graph.pods | default({})).get('items', []) | selectattr('status.phase', 'equalto', 'Running') | list | length }}"
        deployments: "{{ (graph.deployments | default({})).get('items', []) | length }}"
        statefulsets: "{{ (graph.statefulsets | default({})).get('items', []) | length }}"
        daemonsets: "{{ (graph.daemonsets | default({})).get('items', []) | length }}"
        routes: "{{ (graph.routes | default({})).get('items', []) | length }}"
        ingresses: "{{ (graph.ingresses | default({})).get('items', []) | length }}"
        storageclasses: "{{ (graph.storageclasses | default({})).get('items', []) | length }}"
      resources:
        total_cpu_cores: unknown
        total_cpu_millicores: unknown
        total_memory_gib: unknown
        total_memory_mib: unknown
        total_ephemeral_storage_gib: unknown
        average_cpu_cores_per_node: unknown
        average_cpu_millicores_per_node: unknown
        average_memory_gib_per_node: unknown
        average_memory_mib_per_node: unknown
        average_ephemeral_storage_gib_per_node: unknown
        average_pods_per_node: "{{ (((graph.pods | default({})).get('items', []) | length) / ([1, ((graph.nodes | default({})).get('items', []) | length)] | max)) | round(1) }}"
        average_pod_density_pct: n/a
        average_cpu_utilization_pct: n/a
        average_memory_utilization_pct: n/a
        average_disk_utilization_pct: n/a
      ip_capacity:
        services: "{{ service_ip_capacity_summary | default({'ranges': [], 'range_count': 0, 'range_list': [], 'total_ips': 'unknown', 'taken_ips': 0, 'available_ips': 'unknown', 'observed_ips': 0, 'observed_out_of_range_count': 0, 'observed_out_of_range_sample': []}) }}"
        pods: "{{ pod_ip_capacity_summary | default({'ranges': [], 'range_count': 0, 'range_list': [], 'total_ips': 'unknown', 'taken_ips': 0, 'available_ips': 'unknown', 'observed_ips': 0, 'observed_out_of_range_count': 0, 'observed_out_of_range_sample': []}) }}"
        nodes: "{{ node_ip_capacity_summary | default({'ranges': [], 'range_count': 0, 'range_list': [], 'total_ips': 'unknown', 'taken_ips': 0, 'available_ips': 'unknown', 'observed_ips': 0, 'observed_out_of_range_count': 0, 'observed_out_of_range_sample': []}) }}"
      node_growth_capacity:
        current_nodes: "{{ fallback_node_count | int }}"
        max_nodes_by_pod_network: "{{ (fallback_total_node_slots | int) if (fallback_total_node_slots | int) > 0 else 'unknown' }}"
        additional_nodes_by_pod_network: "{{ fallback_additional_nodes_by_pod_network }}"
        pod_network_headroom_pct: "{{ fallback_pod_network_headroom_pct }}"
        node_ip_ranges: "{{ node_ip_capacity_summary.range_list | default([]) }}"
        node_ips_taken: "{{ node_ip_capacity_summary.taken_ips | default(0) }}"
        node_ips_available: "{{ fallback_node_ips_available }}"
        effective_additional_nodes: "{{ fallback_effective_additional_nodes }}"
        network_slot_details: >-
          {%- set rows = [] -%}
          {%- for item in fallback_cluster_networks -%}
          {%- set cidr_text = ((item.cidr | default(item.CIDR | default(''))) if (item is mapping) else (item | string)) -%}
          {%- set host_prefix_value = ((item.hostPrefix) if (item is mapping and item.hostPrefix is defined and item.hostPrefix is not none) else 'unknown') -%}
          {%- set network_prefix_text = (cidr_text | regex_replace('^.*/', '')) -%}
          {%- set node_slots = 'unknown' -%}
          {%- if (host_prefix_value | string) != 'unknown' and network_prefix_text != cidr_text -%}
          {%- set host_prefix_int = (host_prefix_value | string) | int(-1) -%}
          {%- set network_prefix_int = network_prefix_text | int(-1) -%}
          {%- if host_prefix_int >= network_prefix_int and network_prefix_int >= 0 -%}
          {%- set node_slots = (2 ** (host_prefix_int - network_prefix_int)) -%}
          {%- endif -%}
          {%- endif -%}
          {%- set rows = rows + [{'cidr': cidr_text, 'host_prefix': host_prefix_value, 'node_slots': node_slots}] -%}
          {%- endfor -%}
          {{ rows }}
      node_architectures: []
      instance_types: []
      node_shapes: []
      provider_types: []
      operating_systems: []
      os_images: []
      kernel_versions: []
      container_runtimes: []
      node_roles: []
      top_node_features: []
      worker_pools: []
      machineconfigpools: []
  ansible.builtin.set_fact:
    cluster_current_state_build_error: "{{ '' if (cluster_current_state_cmd.rc == 0 and (cluster_current_state_cmd.stdout | default('') | length > 0)) else (cluster_current_state_cmd.stderr | default(cluster_current_state_cmd.stdout | default('cluster current state builder returned no output')) | trim) }}"
    cluster_current_state: "{{ cluster_current_state_cmd.stdout | from_json if (cluster_current_state_cmd.rc == 0 and (cluster_current_state_cmd.stdout | default('') | length > 0)) else cluster_current_state_fallback }}"

- name: Reconcile cluster current state object counts when needed
  vars:
    graph: "{{ analysis_graph | default({}) }}"
    graph_pod_items: "{{ (graph.pods | default({})).get('items', []) }}"
    collected_pod_items: "{{ ((pods | default({})).get('items', []) if ((pods | default({})) is mapping) else ((pods | default([])) if ((pods | default([])) is sequence and (pods | default([])) is not string) else [])) }}"
    graph_deployment_items: "{{ (graph.deployments | default({})).get('items', []) }}"
    collected_deployment_items: "{{ ((deployments | default({})).get('items', []) if ((deployments | default({})) is mapping) else ((deployments | default([])) if ((deployments | default([])) is sequence and (deployments | default([])) is not string) else [])) }}"
    graph_statefulset_items: "{{ (graph.statefulsets | default({})).get('items', []) }}"
    collected_statefulset_items: "{{ ((statefulsets | default({})).get('items', []) if ((statefulsets | default({})) is mapping) else ((statefulsets | default([])) if ((statefulsets | default([])) is sequence and (statefulsets | default([])) is not string) else [])) }}"
    graph_daemonset_items: "{{ (graph.daemonsets | default({})).get('items', []) }}"
    collected_daemonset_items: "{{ ((daemonsets | default({})).get('items', []) if ((daemonsets | default({})) is mapping) else ((daemonsets | default([])) if ((daemonsets | default([])) is sequence and (daemonsets | default([])) is not string) else [])) }}"
    graph_route_items: "{{ (graph.routes | default({})).get('items', []) }}"
    collected_route_items: "{{ ((routes | default({})).get('items', []) if ((routes | default({})) is mapping) else ((routes | default([])) if ((routes | default([])) is sequence and (routes | default([])) is not string) else [])) }}"
    graph_ingress_items: "{{ (graph.ingresses | default({})).get('items', []) }}"
    collected_ingress_items: "{{ ((ingresses | default({})).get('items', []) if ((ingresses | default({})) is mapping) else ((ingresses | default([])) if ((ingresses | default([])) is sequence and (ingresses | default([])) is not string) else [])) }}"
    graph_namespace_items: "{{ (graph.namespaces | default({})).get('items', []) }}"
    collected_namespace_items: "{{ ((namespaces | default({})).get('items', []) if ((namespaces | default({})) is mapping) else ((namespaces | default([])) if ((namespaces | default([])) is sequence and (namespaces | default([])) is not string) else [])) }}"
    graph_storageclass_items: "{{ (graph.storageclasses | default({})).get('items', []) }}"
    collected_storageclass_items: "{{ ((storageclasses | default({})).get('items', []) if ((storageclasses | default({})) is mapping) else ((storageclasses | default([])) if ((storageclasses | default([])) is sequence and (storageclasses | default([])) is not string) else [])) }}"
    effective_pod_items: "{{ graph_pod_items if (graph_pod_items | length) > 0 else collected_pod_items }}"
    effective_deployment_items: "{{ graph_deployment_items if (graph_deployment_items | length) > 0 else collected_deployment_items }}"
    effective_statefulset_items: "{{ graph_statefulset_items if (graph_statefulset_items | length) > 0 else collected_statefulset_items }}"
    effective_daemonset_items: "{{ graph_daemonset_items if (graph_daemonset_items | length) > 0 else collected_daemonset_items }}"
    effective_route_items: "{{ graph_route_items if (graph_route_items | length) > 0 else collected_route_items }}"
    effective_ingress_items: "{{ graph_ingress_items if (graph_ingress_items | length) > 0 else collected_ingress_items }}"
    effective_namespace_items: "{{ graph_namespace_items if (graph_namespace_items | length) > 0 else collected_namespace_items }}"
    effective_storageclass_items: "{{ graph_storageclass_items if (graph_storageclass_items | length) > 0 else collected_storageclass_items }}"
    graph_object_counts:
      namespaces: "{{ effective_namespace_items | length }}"
      pods: "{{ effective_pod_items | length }}"
      running_pods: "{{ effective_pod_items | selectattr('status.phase', 'equalto', 'Running') | list | length }}"
      deployments: "{{ effective_deployment_items | length }}"
      statefulsets: "{{ effective_statefulset_items | length }}"
      daemonsets: "{{ effective_daemonset_items | length }}"
      routes: "{{ effective_route_items | length }}"
      ingresses: "{{ effective_ingress_items | length }}"
      storageclasses: "{{ effective_storageclass_items | length }}"
    cluster_current_state_needs_object_count_reconcile: >-
      {{
        (
          (cluster_current_state.object_counts | default({})).pods | default(0) | int == 0
          and (graph_object_counts.pods | int) > 0
        )
        or (
          (cluster_current_state.object_counts | default({})).running_pods | default(0) | int == 0
          and (graph_object_counts.running_pods | int) > 0
        )
        or (
          (cluster_current_state.object_counts | default({})).deployments | default(0) | int == 0
          and (graph_object_counts.deployments | int) > 0
        )
        or (
          (cluster_current_state.object_counts | default({})).statefulsets | default(0) | int == 0
          and (graph_object_counts.statefulsets | int) > 0
        )
        or (
          (cluster_current_state.object_counts | default({})).daemonsets | default(0) | int == 0
          and (graph_object_counts.daemonsets | int) > 0
        )
        or (
          (cluster_current_state.object_counts | default({})).routes | default(0) | int == 0
          and (graph_object_counts.routes | int) > 0
        )
        or (
          (cluster_current_state.object_counts | default({})).ingresses | default(0) | int == 0
          and (graph_object_counts.ingresses | int) > 0
        )
        or (
          (cluster_current_state.object_counts | default({})).storageclasses | default(0) | int == 0
          and (graph_object_counts.storageclasses | int) > 0
        )
        or (
          (cluster_current_state.object_counts | default({})).namespaces | default(0) | int == 0
          and (graph_object_counts.namespaces | int) > 0
        )
      }}
  ansible.builtin.set_fact:
    cluster_current_state: >-
      {{
        cluster_current_state
        | combine({
            'object_counts': (
              (cluster_current_state.object_counts | default({}))
              | combine(graph_object_counts, recursive=True)
            ),
            'resources': (
              (cluster_current_state.resources | default({}))
              | combine({
                  'average_pods_per_node': (
                    (((graph_object_counts.pods | int) / ([1, (cluster_current_state.node_counts.total | default(0) | int)] | max)) | round(1))
                    if (graph_object_counts.pods | int) > 0
                    else ((cluster_current_state.resources | default({})).average_pods_per_node | default('unknown'))
                  )
                }, recursive=True)
            )
          }, recursive=True)
        if cluster_current_state_needs_object_count_reconcile
        else cluster_current_state
      }}

- name: Build cluster current state sanity findings
  vars:
    graph: "{{ analysis_graph | default({}) }}"
  ansible.builtin.set_fact:
    cluster_current_state_sanity_findings: >-
      {{
        ([] +
        ([{
          'area': 'object-count-reconcile',
          'detail': 'cluster current state object counts were reconciled from collected graph data because one or more synthesized counts were zero while collected objects were present'
        }] if (cluster_current_state_needs_object_count_reconcile | default(false) | bool) else []) +
        ([{
          'area': 'ip-capacity-services',
          'detail': 'services were collected but no service CIDR ranges were derived'
        }] if (
          (((graph.services | default({})).get('items', []) | length) > 0)
          and ((cluster_current_state.ip_capacity.services.range_list | default([]) | length) == 0)
        ) else []) +
        ([{
          'area': 'ip-capacity-pods',
          'detail': 'pods were collected but no pod CIDR ranges were derived'
        }] if (
          (((graph.pods | default({})).get('items', []) | length) > 0)
          and ((cluster_current_state.ip_capacity.pods.range_list | default([]) | length) == 0)
        ) else []) +
        ([{
          'area': 'node-platform-version',
          'detail': 'nodes were collected but the Kubernetes version summary is unknown'
        }] if (
          (((graph.nodes | default({})).get('items', []) | length) > 0)
          and ((cluster_current_state.kubernetes_version | default('unknown')) == 'unknown')
        ) else []) +
        ([{
          'area': 'machineconfigpools',
          'detail': 'MachineConfigPools were collected but the normalized MCP summary is empty'
        }] if (
          (((graph.machineconfigpools | default({})).get('items', []) | length) > 0)
          and ((cluster_current_state.machineconfigpools | default([]) | length) == 0)
        ) else []) +
        ([{
          'area': 'worker-pools',
          'detail': 'worker nodes were collected but no worker pool summary was derived'
        }] if (
          ((cluster_current_state.node_counts.worker | default(0) | int) > 0)
          and ((cluster_current_state.worker_pools | default([]) | length) == 0)
        ) else []))
      }}

- name: Remove cluster current state temp input
  ansible.builtin.file:
    path: "{{ cluster_current_state_input.path }}"
    state: absent
  changed_when: false
