---
- name: Build backup and disaster recovery posture summary
  ansible.builtin.include_tasks: analysis.yml

- name: Build and persist backup and disaster recovery posture artifact
  ansible.builtin.include_role:
    name: posture_artifact_from_builder
    tasks_from: "{{ 'main' if (report_artifact_persistence_mode | default('buffered')) == 'buffered' else 'immediate' }}"
  vars:
    posture_artifact_builder_tasks_from: builder.yml
