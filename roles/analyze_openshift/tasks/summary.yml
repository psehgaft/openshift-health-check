- name: Build core platform health posture summary
  vars:
    apiserver_readyz_failed: >-
      {{
        (apiserver_readyz_status | default('unavailable')) == 'failed'
        or (apiserver_readyz_failed_checks | default(0) | int) > 0
      }}
    high_impact_progressing_operators: >-
      {{
        (progressing_operators | default([]))
        | select('in', ['authentication', 'dns', 'etcd', 'ingress', 'kube-apiserver', 'network'])
        | list
      }}
    etcd_leader_unhealthy: >-
      {{
        (etcd_leader_count | default('') | string | length > 0)
        and ((etcd_leader_count | float) != 1)
      }}
    apiserver_runtime_degraded: >-
      {{
        ((apiserver_request_5xx_rate | default('') | string | length > 0) and ((apiserver_request_5xx_rate | float) > 0))
        or ((apiserver_request_p99_seconds | default('') | string | length > 0) and ((apiserver_request_p99_seconds | float) > (apiserver_latency_p99_warn_seconds | default(1) | float)))
      }}
    etcd_runtime_degraded: >-
      {{
        ((etcd_wal_fsync_p99_ms | default('') | string | length > 0) and ((etcd_wal_fsync_p99_ms | float) > (etcd_wal_fsync_p99_warn_ms | default(10) | float)))
        or ((etcd_peer_rtt_p99_ms | default('') | string | length > 0) and ((etcd_peer_rtt_p99_ms | float) > (etcd_peer_rtt_p99_warn_ms | default(50) | float)))
        or ((etcd_leader_changes_5m | default('') | string | length > 0) and ((etcd_leader_changes_5m | float) > 0))
      }}
    core_platform_critical: >-
      {{
        cv_failing == 'True'
        or (cv_available == 'False' and cv_progressing != 'True')
        or (degraded_operators | default([]) | length > 0)
        or (unavailable_operators | default([]) | length > 0)
        or (not_ready_nodes | default([]) | length > 0)
        or (degraded_mcps | default([]) | length > 0)
        or (route_issues | default([]) | length > 0)
        or (ingress_issues | default([]) | length > 0)
        or (route_host_conflicts | default([]) | length > 0)
        or (ingress_host_conflicts | default([]) | length > 0)
        or (ingresscontroller_issues | default([]) | length > 0)
        or (infrastructure_component_issues | default([]) | length > 0)
        or (apiservice_issues | default([]) | length > 0)
        or apiserver_readyz_failed
        or etcd_leader_unhealthy
      }}
    core_platform_warning: >-
      {{
        cv_progressing == 'True'
        or cv_available == 'Unknown'
        or (high_impact_progressing_operators | length > 0)
        or (pressure_nodes | default([]) | length > 0)
        or apiserver_runtime_degraded
        or etcd_runtime_degraded
        or (platform_pod_issues | default([]) | length > 0)
        or (image_registry_findings | default([]) | length > 0)
      }}
    core_platform_status: "{{ 'CRITICAL' if (core_platform_critical | bool) else ('WARNING' if (core_platform_warning | bool) else 'HEALTHY') }}"
    core_platform_runtime_reason_summary: >-
      {{
        (
          []
          + (['ClusterVersion failing or unavailable'] if (cv_failing == 'True' or (cv_available == 'False' and cv_progressing != 'True')) else [])
          + (['degraded operators: ' ~ (degraded_operators | join(', '))] if (degraded_operators | default([]) | length > 0) else [])
          + (['unavailable operators: ' ~ (unavailable_operators | join(', '))] if (unavailable_operators | default([]) | length > 0) else [])
          + (['not-ready nodes: ' ~ (not_ready_nodes | join(', '))] if (not_ready_nodes | default([]) | length > 0) else [])
          + (['degraded MCPs: ' ~ (degraded_mcps | join(', '))] if (degraded_mcps | default([]) | length > 0) else [])
          + (['route or ingress admission issues'] if ((route_issues | default([]) | length > 0) or (ingress_issues | default([]) | length > 0) or (route_host_conflicts | default([]) | length > 0) or (ingress_host_conflicts | default([]) | length > 0) or (ingresscontroller_issues | default([]) | length > 0)) else [])
          + (['APIService availability issues'] if (apiservice_issues | default([]) | length > 0) else [])
          + (['API /readyz failed'] if apiserver_readyz_failed else [])
          + (['API runtime degraded'] if apiserver_runtime_degraded else [])
          + (['etcd leader unhealthy'] if etcd_leader_unhealthy else [])
          + (['etcd runtime degraded'] if etcd_runtime_degraded else [])
          + (['platform pod issues'] if (platform_pod_issues | default([]) | length > 0) else [])
          + (['image registry findings'] if (image_registry_findings | default([]) | length > 0) else [])
          + (['high-impact operators progressing: ' ~ (high_impact_progressing_operators | join(', '))] if (high_impact_progressing_operators | length > 0) else [])
        ) | join('; ')
      }}
  ansible.builtin.set_fact:
    core_platform_health_findings: >-
      {{
        []
        + ([{'severity': 'critical', 'area': 'cluster-version', 'detail': 'ClusterVersion reports failing=True or unavailable without progressing.'}] if (cv_failing == 'True' or (cv_available == 'False' and cv_progressing != 'True')) else [])
        + ([{'severity': 'critical', 'area': 'operators', 'detail': 'Degraded operators: ' ~ (degraded_operators | join(', '))}] if (degraded_operators | default([]) | length > 0) else [])
        + ([{'severity': 'critical', 'area': 'operators', 'detail': 'Unavailable operators: ' ~ (unavailable_operators | join(', '))}] if (unavailable_operators | default([]) | length > 0) else [])
        + ([{'severity': 'critical', 'area': 'nodes', 'detail': 'NotReady nodes: ' ~ (not_ready_nodes | join(', '))}] if (not_ready_nodes | default([]) | length > 0) else [])
        + ([{'severity': 'critical', 'area': 'machine-config', 'detail': 'Degraded MachineConfigPools: ' ~ (degraded_mcps | join(', '))}] if (degraded_mcps | default([]) | length > 0) else [])
        + ([{'severity': 'critical', 'area': 'network-access', 'detail': 'Route, ingress, or ingress-controller health issues were detected.'}] if ((route_issues | default([]) | length > 0) or (ingress_issues | default([]) | length > 0) or (route_host_conflicts | default([]) | length > 0) or (ingress_host_conflicts | default([]) | length > 0) or (ingresscontroller_issues | default([]) | length > 0)) else [])
        + ([{'severity': 'critical', 'area': 'apiservices', 'detail': 'Unavailable aggregated API services: ' ~ ((apiservice_issues | default([]) | length) | string)}] if (apiservice_issues | default([]) | length > 0) else [])
        + ([{'severity': 'critical', 'area': 'api-readyz', 'detail': 'API /readyz failed or reported failed checks.'}] if apiserver_readyz_failed else [])
        + ([{'severity': 'critical', 'area': 'etcd', 'detail': 'etcd leader count is not healthy.'}] if etcd_leader_unhealthy else [])
        + ([{'severity': 'warning', 'area': 'cluster-version', 'detail': 'ClusterVersion is progressing or availability is unknown.'}] if (cv_progressing == 'True' or cv_available == 'Unknown') else [])
        + ([{'severity': 'warning', 'area': 'operators', 'detail': 'High-impact operators progressing: ' ~ (high_impact_progressing_operators | join(', '))}] if (high_impact_progressing_operators | length > 0) else [])
        + ([{'severity': 'warning', 'area': 'nodes', 'detail': 'Nodes under pressure: ' ~ ((pressure_nodes | default([]) | map(attribute='name') | list) | join(', '))}] if (pressure_nodes | default([]) | length > 0) else [])
        + ([{'severity': 'warning', 'area': 'api-runtime', 'detail': 'API request errors or latency exceeded warning thresholds.'}] if apiserver_runtime_degraded else [])
        + ([{'severity': 'warning', 'area': 'etcd-runtime', 'detail': 'etcd latency or leader-change metrics exceeded warning thresholds.'}] if etcd_runtime_degraded else [])
        + ([{'severity': 'warning', 'area': 'platform-pods', 'detail': 'Platform namespace pod issues: ' ~ ((platform_pod_issues | default([]) | length) | string)}] if (platform_pod_issues | default([]) | length > 0) else [])
        + ([{'severity': 'warning', 'area': 'image-registry', 'detail': 'Image registry findings: ' ~ ((image_registry_findings | default([]) | length) | string)}] if (image_registry_findings | default([]) | length > 0) else [])
      }}

- name: Finalize core platform health posture summary
  vars:
    core_platform_critical_count: "{{ core_platform_health_findings | default([]) | selectattr('severity', 'equalto', 'critical') | list | length }}"
    core_platform_warning_count: "{{ core_platform_health_findings | default([]) | selectattr('severity', 'equalto', 'warning') | list | length }}"
  ansible.builtin.set_fact:
    core_platform_health_summary: "{{ (health_summary | default({})) | combine({
      'status': ('CRITICAL' if (core_platform_critical_count | int) > 0 else ('WARNING' if (core_platform_warning_count | int) > 0 else 'HEALTHY')),
      'core_platform_runtime_reason_summary': (
        core_platform_health_findings | default([]) | map(attribute='detail') | list | join('; ')
        if ((core_platform_critical_count | int) + (core_platform_warning_count | int)) > 0
        else ''
      ),
      'critical_findings': core_platform_critical_count,
      'warning_findings': core_platform_warning_count
    }, recursive=True) }}"

- name: Precompute networking architecture summary inputs
  vars:
    graph: "{{ analysis_graph | default({}) }}"
    route_items: "{{ (graph.routes | default({})).get('items', []) }}"
    ingress_items: "{{ (graph.ingresses | default({})).get('items', []) }}"
    service_items: "{{ (graph.services | default({})).get('items', []) }}"
    proxy_spec: "{{ graph.proxy_config.spec | default({}) }}"
  ansible.builtin.set_fact:
    networking_route_namespaces: "{{ route_items | map(attribute='metadata.namespace') | select('defined') | list | unique }}"
    networking_ingress_namespaces: "{{ ingress_items | map(attribute='metadata.namespace') | select('defined') | list | unique }}"
    networking_service_exposure_namespaces: >-
      {{
        service_items
        | selectattr('metadata.namespace', 'defined')
        | selectattr('spec.type', 'defined')
        | selectattr('spec.type', 'in', ['LoadBalancer', 'NodePort'])
        | map(attribute='metadata.namespace')
        | list
        | unique
      }}
    networking_external_ip_service_namespaces: >-
      {{
        service_items
        | selectattr('metadata.namespace', 'defined')
        | selectattr('spec.externalIPs', 'defined')
        | map(attribute='metadata.namespace')
        | list
        | unique
      }}
    networking_proxy_status: "{{ graph.proxy_config.status | default({}) }}"
    networking_proxy_http: "{{ proxy_spec.httpProxy | default('') }}"
    networking_proxy_https: "{{ proxy_spec.httpsProxy | default('') }}"
    networking_proxy_trusted_ca: "{{ proxy_spec.trustedCA.name | default('') }}"
    networking_proxy_no_proxy_entries: "{{ ((proxy_spec.noProxy | default('')).split(',') | map('trim') | reject('equalto', '') | list) if ((proxy_spec.noProxy | default('') | length) > 0) else [] }}"
    networking_cluster_proxy_configured: "{{ ((proxy_spec.httpProxy | default('')) | length > 0) or ((proxy_spec.httpsProxy | default('')) | length > 0) }}"
    networking_default_ingresscontroller_issue_count: "{{ ingresscontroller_issues | default([]) | selectattr('component', 'equalto', 'ingresscontroller/default') | list | length }}"
    networking_nondefault_ingresscontroller_issue_count: "{{ (ingresscontroller_issues | default([]) | length) - (ingresscontroller_issues | default([]) | selectattr('component', 'equalto', 'ingresscontroller/default') | list | length) }}"

- name: Build networking architecture summary
  vars:
    exposed_user_namespaces: "{{ ((networking_route_namespaces | default([])) + (networking_ingress_namespaces | default([])) + (networking_service_exposure_namespaces | default([])) + (networking_external_ip_service_namespaces | default([]))) | unique | reject('match', user_namespaces_exclude_regex | default('^$')) | list }}"
    exposed_namespaces_without_networkpolicy: "{{ exposed_user_namespaces | intersect(namespaces_without_networkpolicy | default([])) }}"
    exposed_namespaces_missing_ingress_policies: "{{ exposed_user_namespaces | intersect(namespaces_missing_ingress_policies | default([])) }}"
    exposed_namespaces_missing_egress_policies: "{{ exposed_user_namespaces | intersect(namespaces_missing_egress_policies | default([])) }}"
    proxy_required_internal_no_proxy_entries:
      - ".svc"
      - ".cluster.local"
    proxy_missing_internal_no_proxy_entries: "{{ proxy_required_internal_no_proxy_entries | difference(networking_proxy_no_proxy_entries | default([])) if (networking_cluster_proxy_configured | default(false) | bool) else [] }}"
    networking_service_endpoint_gap_count: "{{ services_without_endpoints | default([]) | length }}"
    network_architecture_status: >-
      {{
        'CRITICAL'
        if (
          (route_host_conflicts | default([]) | length) > 0
          or (ingress_host_conflicts | default([]) | length) > 0
          or (route_ingress_host_conflicts | default([]) | length) > 0
          or (networking_default_ingresscontroller_issue_count | int) > 0
        )
        else (
          'WARNING'
          if (
            (route_issues | default([]) | length) > 0
            or (ingress_issues | default([]) | length) > 0
            or (networking_nondefault_ingresscontroller_issue_count | int) > 0
            or (networking_service_endpoint_gap_count | int) > 0
            or (proxy_missing_internal_no_proxy_entries | length) > 0
          )
          else 'HEALTHY'
        )
      }}
    network_architecture_reason_summary: >-
      {{
        (
          []
          + (['route issues=' ~ ((route_issues | default([]) | length) | string)] if (route_issues | default([]) | length) > 0 else [])
          + (['ingress issues=' ~ ((ingress_issues | default([]) | length) | string)] if (ingress_issues | default([]) | length) > 0 else [])
          + (['route host conflicts=' ~ ((route_host_conflicts | default([]) | length) | string)] if (route_host_conflicts | default([]) | length) > 0 else [])
          + (['ingress host conflicts=' ~ ((ingress_host_conflicts | default([]) | length) | string)] if (ingress_host_conflicts | default([]) | length) > 0 else [])
          + (['cross route/ingress host conflicts=' ~ ((route_ingress_host_conflicts | default([]) | length) | string)] if (route_ingress_host_conflicts | default([]) | length) > 0 else [])
          + (['default ingress controller issues=' ~ ((networking_default_ingresscontroller_issue_count | int) | string)] if (networking_default_ingresscontroller_issue_count | int) > 0 else [])
          + (['non-default ingress controller issues=' ~ ((networking_nondefault_ingresscontroller_issue_count | int) | string)] if (networking_nondefault_ingresscontroller_issue_count | int) > 0 else [])
          + (['service endpoint gaps=' ~ ((networking_service_endpoint_gap_count | int) | string)] if (networking_service_endpoint_gap_count | int) > 0 else [])
          + (['exposed namespace policy context=' ~ ((exposed_namespaces_without_networkpolicy | length) | string) ~ ' without NetworkPolicy'] if (exposed_namespaces_without_networkpolicy | length) > 0 else [])
          + (['proxy noProxy gaps=' ~ (proxy_missing_internal_no_proxy_entries | join(', '))] if (proxy_missing_internal_no_proxy_entries | length) > 0 else [])
        ) | join('; ')
      }}
    network_architecture_recommendation: >-
      {{
        (
          'Stabilize networking architecture first: resolve default ingress controller problems and duplicate host claims across Route and Ingress objects before treating application access paths as reliable.'
          if network_architecture_status == 'CRITICAL'
          else (
            'Reduce networking architecture risk next: fix route or ingress admission problems, repair Services with no ready endpoints, review non-default ingress controller issues, and correct proxy noProxy gaps before treating application access as production-ready.'
            if network_architecture_status == 'WARNING'
            else 'Networking architecture looks acceptable for this run. Keep route and ingress ownership clean, review namespace isolation requirements for exposed workloads, and maintain proxy or egress settings as designed.'
          )
        )
      }}
  ansible.builtin.set_fact:
    network_architecture_summary:
      status: "{{ network_architecture_status }}"
      reason_summary: "{{ network_architecture_reason_summary }}"
      recommendation: "{{ network_architecture_recommendation }}"
      route_issue_count: "{{ route_issues | default([]) | length }}"
      ingress_issue_count: "{{ ingress_issues | default([]) | length }}"
      route_host_conflict_count: "{{ route_host_conflicts | default([]) | length }}"
      ingress_host_conflict_count: "{{ ingress_host_conflicts | default([]) | length }}"
      cross_host_conflict_count: "{{ route_ingress_host_conflicts | default([]) | length }}"
      ingresscontroller_issue_count: "{{ ingresscontroller_issues | default([]) | length }}"
      default_ingresscontroller_issue_count: "{{ networking_default_ingresscontroller_issue_count }}"
      nondefault_ingresscontroller_issue_count: "{{ networking_nondefault_ingresscontroller_issue_count }}"
      service_endpoint_gap_count: "{{ networking_service_endpoint_gap_count }}"
      service_endpoint_gap_samples: "{{ top_services_without_endpoints | default([]) }}"
      exposed_namespace_count: "{{ exposed_user_namespaces | length }}"
      service_exposure_namespace_count: "{{ (((networking_service_exposure_namespaces | default([])) + (networking_external_ip_service_namespaces | default([]))) | unique | reject('match', user_namespaces_exclude_regex | default('^$')) | list | length) }}"
      exposed_namespaces_without_networkpolicy: "{{ exposed_namespaces_without_networkpolicy }}"
      exposed_namespaces_missing_ingress_policies: "{{ exposed_namespaces_missing_ingress_policies }}"
      exposed_namespaces_missing_egress_policies: "{{ exposed_namespaces_missing_egress_policies }}"
      cluster_proxy_configured: "{{ networking_cluster_proxy_configured }}"
      http_proxy_configured: "{{ networking_proxy_http | length > 0 }}"
      https_proxy_configured: "{{ networking_proxy_https | length > 0 }}"
      trusted_ca_configured: "{{ networking_proxy_trusted_ca | length > 0 }}"
      no_proxy_entry_count: "{{ networking_proxy_no_proxy_entries | length }}"
      no_proxy_entries_sample: "{{ (networking_proxy_no_proxy_entries | default([]))[:10] }}"
      proxy_missing_internal_no_proxy_entries: "{{ proxy_missing_internal_no_proxy_entries }}"
      proxy_status: "{{ networking_proxy_status }}"

- name: Build security and compliance posture summary
  vars:
    requested_compliance_standards: >-
      {{
        (
          (
            (
              (cluster_health_profile | default({})).capabilities
              | default({})
            ).compliance_requirements_validation
            | default({})
          ).standards
          | default([])
        )
        | map('string')
        | list
      }}
    compliance_standards_for_security_summary: >-
      {{
        (
          compliance_standards_summary | default([])
          | selectattr('standard', 'in', requested_compliance_standards)
          | list
        )
        if (requested_compliance_standards | length) > 0
        else (compliance_standards_summary | default([]))
      }}
    privileged_access_count: >-
      {{
        (privileged_serviceaccount_access | default([]) | length)
        + (privileged_user_access | default([]) | length)
        + (privileged_group_access | default([]) | length)
      }}
    active_non_supported_standards: >-
      {{
        compliance_standards_for_security_summary
        | selectattr('active_enabled', 'equalto', true)
        | rejectattr('verdict', 'equalto', 'supported')
        | list
      }}
    high_signal_security_findings: >-
      {{
        security_findings | default([])
        | selectattr('issue', 'in', [
          'privileged-containers',
          'host-network',
          'host-pid',
          'host-ipc',
          'hostpath-volume',
          'run-as-root',
          'unconfined-seccomp-profile',
          'allow-privilege-escalation-not-disabled',
          'capabilities-not-fully-dropped'
        ])
        | list
      }}
    configured_but_inactive_standards: >-
      {{
        compliance_standards_for_security_summary
        | selectattr('configured', 'equalto', true)
        | rejectattr('active_enabled', 'equalto', true)
        | list
      }}
    stale_access_review_count: >-
      {{
        (stale_access_review_serviceaccounts | default([]) | length)
        + (stale_access_review_users | default([]) | length)
        + (stale_access_review_groups | default([]) | length)
      }}
    security_compliance_status: >-
      {{
        'CRITICAL'
        if ((expiring_certificates_critical | default([]) | length) > 0)
        else (
          'WARNING'
          if (
            (auth_posture_summary.status | default('unknown')) in ['warning', 'review']
            or (privileged_access_count | int) > 0
            or (scc_grant_findings | default([]) | length) > 0
            or (high_signal_security_findings | length) > 0
            or (image_registry_findings | default([]) | length) > 0
            or (compliance_suite_findings | default([]) | length) > 0
            or (active_non_supported_standards | length) > 0
            or (configured_but_inactive_standards | length) > 0
            or (compliance_operator_summary.invalid_profilebundle_count | default(0) | int) > 0
            or (expiring_certificates_warning | default([]) | length) > 0
          )
          else 'HEALTHY'
        )
      }}
    security_compliance_reason_summary: >-
      {{
        (
          []
          + (['critical certificate expiry=' ~ ((expiring_certificates_critical | default([]) | length) | string)] if (expiring_certificates_critical | default([]) | length) > 0 else [])
          + (['auth posture=' ~ (auth_posture_summary.reason_summary | default('unknown'))] if (auth_posture_summary.status | default('unknown')) in ['warning', 'review'] else [])
          + (['privileged access grants=' ~ ((privileged_access_count | int) | string)] if (privileged_access_count | int) > 0 else [])
          + (['high-risk SCC grants=' ~ ((scc_grant_findings | default([]) | length) | string)] if (scc_grant_findings | default([]) | length) > 0 else [])
          + (['high-signal pod security findings=' ~ ((high_signal_security_findings | length) | string)] if (high_signal_security_findings | length) > 0 else [])
          + (['image registry policy findings=' ~ ((image_registry_findings | default([]) | length) | string)] if (image_registry_findings | default([]) | length) > 0 else [])
          + (['warning certificate expiry=' ~ ((expiring_certificates_warning | default([]) | length) | string)] if (expiring_certificates_warning | default([]) | length) > 0 else [])
          + (['active compliance standards needing review=' ~ ((active_non_supported_standards | length) | string)] if (active_non_supported_standards | length) > 0 else [])
          + (['configured but inactive compliance standards=' ~ ((configured_but_inactive_standards | length) | string)] if (configured_but_inactive_standards | length) > 0 else [])
          + (['compliance suite findings=' ~ ((compliance_suite_findings | default([]) | length) | string)] if (compliance_suite_findings | default([]) | length) > 0 else [])
          + (['invalid compliance profile bundles=' ~ ((compliance_operator_summary.invalid_profilebundle_count | default(0) | int) | string)] if (compliance_operator_summary.invalid_profilebundle_count | default(0) | int) > 0 else [])
        ) | join('; ')
      }}
    security_compliance_recommendation: >-
      {{
        (
          'Address immediate security posture risks first: rotate or replace critically expiring certificates, reduce privileged access exposure, and correct the highest-signal access or compliance issues before treating the cluster as production-ready.'
          if security_compliance_status == 'CRITICAL'
          else (
            'Reduce security and compliance risk next: review identity-provider posture, privileged access grants, SCC exposure, image registry policy findings, active compliance standards, and certificate warnings. Treat namespace guardrail gaps as baseline governance debt rather than the primary security signal.'
            if security_compliance_status == 'WARNING'
            else 'Security and compliance posture looks acceptable for this run. Keep access controls, certificate hygiene, and active compliance standards under normal review while tracking namespace baseline guardrails as governance hygiene.'
          )
        )
      }}
  ansible.builtin.set_fact:
    security_compliance_summary:
      status: "{{ security_compliance_status }}"
      reason_summary: "{{ security_compliance_reason_summary }}"
      recommendation: "{{ security_compliance_recommendation }}"
      auth_posture_status: "{{ auth_posture_summary.status | default('unknown') }}"
      identity_provider_count: "{{ auth_posture_summary.identity_provider_count | default(0) }}"
      external_identity_provider_count: "{{ auth_posture_summary.external_identity_provider_count | default(0) }}"
      local_identity_provider_count: "{{ auth_posture_summary.local_identity_provider_count | default(0) }}"
      kubeadmin_secret_present: "{{ auth_posture_summary.kubeadmin_secret_present | default(false) }}"
      privileged_access_count: "{{ privileged_access_count }}"
      stale_access_review_count: "{{ stale_access_review_count }}"
      scc_grant_findings: "{{ scc_grant_findings | default([]) | length }}"
      security_findings: "{{ security_findings | default([]) | length }}"
      image_registry_findings: "{{ image_registry_findings | default([]) | length }}"
      likely_unused_secrets: "{{ likely_unused_secrets | default([]) | length }}"
      expiring_certificates_warning: "{{ expiring_certificates_warning | default([]) | length }}"
      expiring_certificates_critical: "{{ expiring_certificates_critical | default([]) | length }}"
      compliance_suite_findings: "{{ compliance_suite_findings | default([]) | length }}"
      compliance_active_standards_review_count: "{{ active_non_supported_standards | length }}"
      compliance_configured_inactive_standard_count: "{{ configured_but_inactive_standards | length }}"
      compliance_invalid_profilebundle_count: "{{ compliance_operator_summary.invalid_profilebundle_count | default(0) }}"
      high_signal_security_findings: "{{ high_signal_security_findings | length }}"

- name: Build observability posture summary
  vars:
    monitoring_operator_healthy: >-
      {{
        (clusteroperator_status_map.monitoring.available | default('Unknown')) == 'True'
        and (clusteroperator_status_map.monitoring.degraded | default('False')) != 'True'
      }}
    vendor_managed_observability_present: >-
      {{
        (observability_forwarding_summary.vendor_managed_log_forwarding_present | default(false))
        or (observability_forwarding_summary.vendor_managed_metrics_forwarding_present | default(false))
      }}
    vendor_managed_observability_configured: >-
      {{
        (
          (observability_forwarding_summary.vendor_managed_log_forwarding_present | default(false))
          and (
            (observability_forwarding_summary.logs_delivery_verification_status | default('not-configured')) != 'not-configured'
            or (observability_forwarding_summary.application_logs_collected | default(false))
            or (observability_forwarding_summary.infrastructure_logs_collected | default(false))
            or (observability_forwarding_summary.audit_logs_collected | default(false))
          )
        )
        or
        (
          (observability_forwarding_summary.vendor_managed_metrics_forwarding_present | default(false))
          and (
            (observability_forwarding_summary.metrics_delivery_verification_status | default('not-configured')) != 'not-configured'
            or (observability_forwarding_summary.cluster_metrics_delivery_state | default('not-configured')) != 'not-configured'
            or (observability_forwarding_summary.user_workload_metrics_delivery_state | default('not-configured')) != 'not-configured'
          )
        )
      }}
    firing_critical_alert_count: "{{ (firing_alerts_by_severity | default({})).critical | default(0) }}"
    firing_warning_alert_count: >-
      {{
        (firing_alerts | default([]) | length)
        - ((firing_alerts_by_severity | default({})).critical | default(0) | int)
      }}
    warning_event_count: "{{ recent_warning_events | default([]) | length }}"
    warning_event_posture_threshold: "{{ observability_warning_event_threshold | default(10) | int }}"
    log_gap_count: >-
      {{
        (
          (1 if not (observability_forwarding_summary.application_logs_collected | default(false)) else 0)
          + (1 if not (observability_forwarding_summary.infrastructure_logs_collected | default(false)) else 0)
          + (1 if not (observability_forwarding_summary.audit_logs_collected | default(false)) else 0)
          + (1 if (observability_forwarding_summary.application_logs_collected | default(false)) and not (observability_forwarding_summary.application_logs_exported_external | default(false)) else 0)
          + (1 if (observability_forwarding_summary.infrastructure_logs_collected | default(false)) and not (observability_forwarding_summary.infrastructure_logs_exported_external | default(false)) else 0)
          + (1 if (observability_forwarding_summary.audit_logs_collected | default(false)) and not (observability_forwarding_summary.audit_logs_exported_external | default(false)) else 0)
        )
        if (require_cluster_log_forwarder | default(false) | bool)
        else 0
      }}
    metrics_gap_count: >-
      {{
        (1 if ((observability_forwarding_summary.cluster_metrics_remote_write_count | default(0) | int) > 0 and (observability_forwarding_summary.external_cluster_metrics_remote_write_count | default(0) | int) == 0) else 0)
        + (1 if ((observability_forwarding_summary.user_workload_metrics_remote_write_count | default(0) | int) > 0 and (observability_forwarding_summary.external_user_workload_metrics_remote_write_count | default(0) | int) == 0) else 0)
        + (1 if ((observability_forwarding_summary.cluster_metrics_remote_write_count | default(0) | int) == 0 and (require_external_metrics_remote_write | default(false) | bool)) else 0)
      }}
    alerting_gap_count: >-
      {{
        (1 if ((observability_forwarding_summary.alertmanagerconfigs_without_route_receivers | default(0) | int) > 0) else 0)
        + (1 if ((observability_forwarding_summary.external_alert_receiver_count | default(0) | int) > 0 and not (observability_forwarding_summary.alert_routing_to_external_receiver_configured | default(false))) else 0)
        + (1 if ((observability_forwarding_summary.alert_delivery_source_count | default(0) | int) > 0 and (observability_forwarding_summary.external_alert_receiver_count | default(0) | int) == 0) else 0)
        + (1 if (
            (require_external_alert_delivery | default(false) | bool)
            and ((observability_forwarding_summary.alert_delivery_verification_status | default('not-configured')) in ['not-configured', 'missing', 'failed'])
            and not (observability_forwarding_summary.vendor_managed_alerting_present | default(false))
          ) else 0)
      }}
    prometheus_query_applicable: "{{ prometheus_evidence_summary.applicable | default((report_mode_resolved | default('live')) == 'live') | bool }}"
    prometheus_query_collected: "{{ prometheus_evidence_summary.collected | default(false) | bool }}"
    metric_evidence_gap_count: "{{ 1 if (prometheus_query_applicable | bool) and not (prometheus_query_collected | bool) else 0 }}"
    observability_status: >-
      {{
        'CRITICAL'
        if (
          (not monitoring_operator_healthy and not vendor_managed_observability_configured)
          or (firing_critical_alert_count | int) > 0
        )
        else (
          'WARNING'
          if (
            (not monitoring_operator_healthy and vendor_managed_observability_configured)
            or
            (log_gap_count | int) > 0
            or (metrics_gap_count | int) > 0
            or (alerting_gap_count | int) > 0
            or (metric_evidence_gap_count | int) > 0
            or ((insights_archive_findings | default([]) | length) > 0)
            or ((warning_event_count | int) >= (warning_event_posture_threshold | int))
            or (firing_warning_alert_count | int) > 0
          )
          else 'HEALTHY'
        )
      }}
    observability_reason_summary: >-
      {{
        (
          []
          + (['monitoring operator not healthy and no vendor-managed observability presence was detected'] if (not monitoring_operator_healthy and not vendor_managed_observability_configured) else [])
          + (['monitoring operator not healthy but vendor-managed observability presence was detected'] if (not monitoring_operator_healthy and vendor_managed_observability_configured) else [])
          + (['vendor-managed observability=' ~ ((((observability_forwarding_summary.metrics_forwarding_vendor_names | default([])) + (observability_forwarding_summary.log_forwarding_vendor_names | default([]))) | unique) | join(','))] if vendor_managed_observability_present else [])
          + (['critical firing alerts=' ~ ((firing_critical_alert_count | int) | string)] if (firing_critical_alert_count | int) > 0 else [])
          + (['non-critical firing alerts=' ~ ((firing_warning_alert_count | int) | string)] if (firing_warning_alert_count | int) > 0 else [])
          + (['warning events over threshold=' ~ ((recent_warning_events | default([]) | length) | string)] if (warning_event_count | int) >= (warning_event_posture_threshold | int) else [])
          + (['log forwarding gaps=' ~ ((log_gap_count | int) | string)] if (log_gap_count | int) > 0 else [])
          + (['metrics forwarding gaps=' ~ ((metrics_gap_count | int) | string)] if (metrics_gap_count | int) > 0 else [])
          + (['alert delivery gaps=' ~ ((alerting_gap_count | int) | string)] if (alerting_gap_count | int) > 0 else [])
          + (['prometheus/thanos metric evidence unavailable'] if (metric_evidence_gap_count | int) > 0 else [])
          + (['insights archive findings=' ~ ((insights_archive_findings | default([]) | length) | string)] if ((insights_archive_findings | default([]) | length) > 0) else [])
        ) | join('; ')
      }}
    observability_recommendation: >-
      {{
        (
          'Stabilize observability first: restore the monitoring operator, triage active firing alerts, and treat configured telemetry paths as unverified until alerting, logging, and metrics delivery are confirmed end to end.'
          if observability_status == 'CRITICAL'
          else (
            'Reduce observability risk next: close log, alert-routing, metrics-forwarding, and Prometheus/Thanos evidence gaps, and distinguish externally configured telemetry from actually verified delivery before treating the platform as operationally observable.'
            if observability_status == 'WARNING'
            else 'Observability posture looks acceptable for this run. Keep monitoring healthy, preserve alerting and forwarding configuration, and periodically verify that configured telemetry paths are still delivering as intended.'
          )
        )
      }}
  ansible.builtin.set_fact:
    observability_summary:
      status: "{{ observability_status }}"
      reason_summary: "{{ observability_reason_summary }}"
      recommendation: "{{ observability_recommendation }}"
      monitoring_operator_healthy: "{{ monitoring_operator_healthy }}"
      vendor_managed_observability_present: "{{ vendor_managed_observability_present }}"
      vendor_managed_observability_configured: "{{ vendor_managed_observability_configured }}"
      vendor_managed_observability_vendors: "{{ ((observability_forwarding_summary.metrics_forwarding_vendor_names | default([])) + (observability_forwarding_summary.log_forwarding_vendor_names | default([]))) | unique }}"
      firing_alert_count: "{{ firing_alerts | default([]) | length }}"
      firing_critical_alert_count: "{{ firing_critical_alert_count }}"
      firing_noncritical_alert_count: "{{ firing_warning_alert_count }}"
      warning_event_count: "{{ recent_warning_events | default([]) | length }}"
      observability_findings: "{{ observability_findings | default([]) | length }}"
      log_gap_count: "{{ log_gap_count }}"
      metrics_gap_count: "{{ metrics_gap_count }}"
      alerting_gap_count: "{{ alerting_gap_count }}"
      metric_evidence_gap_count: "{{ metric_evidence_gap_count }}"
      prometheus_query_applicable: "{{ prometheus_query_applicable }}"
      prometheus_query_collected: "{{ prometheus_query_collected }}"
      prometheus_query_status: "{{ prometheus_evidence_summary.status | default('not-collected') }}"
      prometheus_query_transport: "{{ prometheus_evidence_summary.transport | default('unavailable') }}"
      prometheus_query_count: "{{ prometheus_evidence_summary.query_count | default(0) }}"
      prometheus_non_empty_query_count: "{{ prometheus_evidence_summary.non_empty_result_count | default(0) }}"
      application_logs_delivery_state: "{{ observability_forwarding_summary.application_logs_delivery_state | default('not-collected') }}"
      infrastructure_logs_delivery_state: "{{ observability_forwarding_summary.infrastructure_logs_delivery_state | default('not-collected') }}"
      audit_logs_delivery_state: "{{ observability_forwarding_summary.audit_logs_delivery_state | default('not-collected') }}"
      logs_delivery_verification_status: "{{ observability_forwarding_summary.logs_delivery_verification_status | default('not-configured') }}"
      cluster_metrics_delivery_state: "{{ observability_forwarding_summary.cluster_metrics_delivery_state | default('not-configured') }}"
      user_workload_metrics_delivery_state: "{{ observability_forwarding_summary.user_workload_metrics_delivery_state | default('not-configured') }}"
      metrics_delivery_verification_status: "{{ observability_forwarding_summary.metrics_delivery_verification_status | default('not-configured') }}"
      alert_delivery_state: "{{ observability_forwarding_summary.alert_delivery_state | default('not-configured') }}"
      alert_delivery_verification_status: "{{ observability_forwarding_summary.alert_delivery_verification_status | default('not-configured') }}"
      alert_delivery_source_count: "{{ observability_forwarding_summary.alert_delivery_source_count | default(0) }}"
      external_alert_receiver_count: "{{ observability_forwarding_summary.external_alert_receiver_count | default(0) }}"
      external_log_output_count: "{{ observability_forwarding_summary.external_log_forwarding_outputs | default([]) | length }}"
      insights_archive_findings: "{{ insights_archive_findings | default([]) | length }}"

- name: Build backup and disaster recovery posture summary
  vars:
    available_backup_storage_locations: "{{ backup_storage_location_summary | default([]) | selectattr('available', 'equalto', 'True') | list }}"
    paused_backup_schedules: "{{ backup_schedule_summary | default([]) | selectattr('paused', 'equalto', true) | list }}"
    clean_successful_backup_count: "{{ backup_posture_data.clean_successful_backup_count | default(0) }}"
    completed_backup_with_issues_count: >-
      {{
        (backup_posture_data.successful_backup_count | default(0) | int)
        - (backup_posture_data.clean_successful_backup_count | default(0) | int)
      }}
    clean_completed_restore_count: "{{ backup_posture_data.clean_completed_restore_count | default(0) }}"
    completed_restore_with_issues_count: >-
      {{
        (backup_posture_data.completed_restore_count | default(0) | int)
        - (backup_posture_data.clean_completed_restore_count | default(0) | int)
      }}
    backup_tooling_detected: >-
      {{
        (dataprotectionapplication_summary | default([]) | length) > 0
        or (backup_storage_location_summary | default([]) | length) > 0
        or (backup_schedule_summary | default([]) | length) > 0
        or (backup_summary | default([]) | length) > 0
        or (restore_summary | default([]) | length) > 0
      }}
    control_plane_recovery_applicable: "{{ not (cluster_profile.is_hosted_control_plane | default(false) | bool) }}"
    control_plane_runtime_healthy: >-
      {{
        (platform_health_summary.apiserver_readyz_failed | default(0) | int) == 0
        and (platform_health_summary.apiserver_runtime_degraded | default(0) | int) == 0
        and (platform_health_summary.etcd_leader_unhealthy | default(0) | int) == 0
        and (platform_health_summary.etcd_runtime_degraded | default(0) | int) == 0
      }}
    control_plane_backup_evidence_scanned: "{{ ((control_plane_backup_evidence_data | default({})).summary | default({})).present | default(false) | bool }}"
    control_plane_snapshot_evidence_collected: "{{ ((control_plane_backup_evidence_data | default({})).summary | default({})).healthy | default(false) | bool }}"
    control_plane_backup_nodes_with_any_artifacts: "{{ ((control_plane_backup_evidence_data | default({})).summary | default({})).nodes_with_any_artifacts | default(0) }}"
    control_plane_backup_newest_matching_pair_age_hours: "{{ ((control_plane_backup_evidence_data | default({})).summary | default({})).newest_matching_pair_age_hours | default('unknown') }}"
    control_plane_backup_findings_summary: >-
      {{
        (
          (control_plane_backup_evidence_data | default({})).findings
          | default([])
          | map(attribute='detail')
          | list
          | join('; ')
        )
        if (((control_plane_backup_evidence_data | default({})).findings | default([]) | length) > 0)
        else 'none'
      }}
    storage_provider_warning: "{{ storage_posture_summary.local_or_ephemeral_only_risk | default(false) | bool }}"
    backup_recovery_status: >-
      {{
        'CRITICAL'
        if (
          (backup_posture_findings | default([]) | selectattr('issue', 'in', ['backup-tooling-not-detected', 'backup-storage-location-missing', 'backup-storage-location-unavailable', 'backup-schedule-missing', 'successful-backup-missing']) | list | length) > 0
          or (clean_successful_backup_count | int) == 0
        )
        else (
          'WARNING'
          if (
            (backup_posture_findings | default([]) | selectattr('issue', 'in', ['backup-schedule-paused', 'successful-backup-has-warnings-or-errors', 'successful-backup-stale', 'restore-evidence-not-demonstrated', 'restore-evidence-has-warnings-or-errors']) | list | length) > 0
            or (machine_healthcheck_findings | default([]) | length) > 0
            or storage_provider_warning
          )
          else 'HEALTHY'
        )
      }}
    backup_recovery_reason_summary: >-
      {{
        (
          []
          + (['backup tooling not detected'] if not (backup_tooling_detected | bool) else [])
          + (['available backup storage locations=0'] if (available_backup_storage_locations | length) == 0 else [])
          + (['available backup storage locations=' ~ ((available_backup_storage_locations | length) | string)] if (available_backup_storage_locations | length) > 0 else [])
          + (['backup schedules=0'] if (backup_schedule_summary | default([]) | length) == 0 else [])
          + (['paused backup schedules=' ~ ((paused_backup_schedules | length) | string)] if (paused_backup_schedules | length) > 0 else [])
          + (['clean successful backups=0'] if (clean_successful_backup_count | int) == 0 else [])
          + (['clean successful backups=' ~ ((clean_successful_backup_count | int) | string)] if (clean_successful_backup_count | int) > 0 else [])
          + (['completed backups with warnings/errors=' ~ ((completed_backup_with_issues_count | int) | string)] if (completed_backup_with_issues_count | int) > 0 else [])
          + (['clean restore evidence=0'] if (clean_completed_restore_count | int) == 0 else [])
          + (['clean restore evidence=' ~ ((clean_completed_restore_count | int) | string)] if (clean_completed_restore_count | int) > 0 else [])
          + (['completed restores with warnings/errors=' ~ ((completed_restore_with_issues_count | int) | string)] if (completed_restore_with_issues_count | int) > 0 else [])
          + (['machine remediation findings=' ~ ((machine_healthcheck_findings | default([]) | length) | string)] if ((machine_healthcheck_findings | default([]) | length) > 0) else [])
          + (['storage provider risk=local-or-ephemeral-only'] if storage_provider_warning else [])
        ) | join('; ')
      }}
    backup_recovery_recommendation: >-
      {{
        (
          'Stabilize recovery posture first: ensure backup tooling is present, at least one backup storage location is available, schedules are active, and a clean successful backup exists before treating disaster recovery as credible.'
          if backup_recovery_status == 'CRITICAL'
          else (
            'Reduce recovery risk next: investigate paused schedules, backup or restore runs with warnings or errors, stale backup evidence, and machine remediation gaps before treating resilience as production-ready.'
            if backup_recovery_status == 'WARNING'
            else 'Backup and disaster recovery posture looks acceptable for this run. Keep backup success and restore evidence current, and maintain machine remediation coverage for the worker fleet.'
          )
        )
      }}
  ansible.builtin.set_fact:
    backup_recovery_summary:
      status: "{{ backup_recovery_status }}"
      reason_summary: "{{ backup_recovery_reason_summary }}"
      recommendation: "{{ backup_recovery_recommendation }}"
      backup_tooling_detected: "{{ backup_tooling_detected }}"
      control_plane_recovery_applicable: "{{ control_plane_recovery_applicable }}"
      control_plane_runtime_healthy: "{{ control_plane_runtime_healthy }}"
      control_plane_backup_evidence_scanned: "{{ control_plane_backup_evidence_scanned }}"
      control_plane_snapshot_evidence_collected: "{{ control_plane_snapshot_evidence_collected }}"
      control_plane_backup_node_count: "{{ ((control_plane_backup_evidence_data | default({})).summary | default({})).node_count | default(0) }}"
      control_plane_backup_nodes_with_any_artifacts: "{{ control_plane_backup_nodes_with_any_artifacts }}"
      control_plane_backup_nodes_with_matching_pairs: "{{ ((control_plane_backup_evidence_data | default({})).summary | default({})).nodes_with_matching_pairs | default(0) }}"
      control_plane_backup_newest_matching_pair_age_hours: "{{ control_plane_backup_newest_matching_pair_age_hours }}"
      control_plane_backup_findings_summary: "{{ control_plane_backup_findings_summary }}"
      dataprotectionapplication_count: "{{ dataprotectionapplication_summary | default([]) | length }}"
      available_backup_storage_location_count: "{{ available_backup_storage_locations | length }}"
      backup_schedule_count: "{{ backup_schedule_summary | default([]) | length }}"
      paused_backup_schedule_count: "{{ paused_backup_schedules | length }}"
      successful_backup_count: "{{ backup_posture_data.successful_backup_count | default(0) }}"
      clean_successful_backup_count: "{{ clean_successful_backup_count }}"
      completed_backup_with_issues_count: "{{ completed_backup_with_issues_count }}"
      completed_restore_count: "{{ backup_posture_data.completed_restore_count | default(0) }}"
      clean_completed_restore_count: "{{ clean_completed_restore_count }}"
      completed_restore_with_issues_count: "{{ completed_restore_with_issues_count }}"
      backup_posture_findings: "{{ backup_posture_findings | default([]) | length }}"
      machine_healthcheck_findings: "{{ machine_healthcheck_findings | default([]) | length }}"
      external_storage_provider_detected: "{{ storage_posture_summary.has_external_storage_provider | default(false) }}"
      local_or_ephemeral_only_risk: "{{ storage_posture_summary.local_or_ephemeral_only_risk | default(false) }}"
      external_storageclass_count: "{{ storage_posture_summary.external_storageclass_count | default(0) }}"
      local_storageclass_count: "{{ storage_posture_summary.local_storageclass_count | default(0) }}"
      external_pv_count: "{{ storage_posture_summary.external_pv_count | default(0) }}"
      local_pv_count: "{{ storage_posture_summary.local_pv_count | default(0) }}"

- name: Build node health and capacity posture summary
  vars:
    node_diagnostics_evidence_gap: "{{ (node_diagnostics_summary.verdict | default('insufficient-evidence')) not in ['supported', 'basic-supported', 'node-level-not-requested', 'node-level-no-targets'] }}"
    node_capacity_status: >-
      {{
        'CRITICAL'
        if (
          (not_ready_nodes | default([]) | length) > 0
          or (critical_pod_density_nodes | default([]) | length) > 0
        )
        else (
          'WARNING'
          if (
            (pressure_nodes | default([]) | length) > 0
            or (high_pod_density_nodes | default([]) | length) > 0
            or (quota_pressure_findings | default([]) | length) > 0
            or (high_cpu_nodes | default([]) | length) > 0
            or (high_memory_nodes | default([]) | length) > 0
            or (high_disk_nodes | default([]) | length) > 0
          )
          else 'HEALTHY'
        )
      }}
    node_capacity_reason_summary: >-
      {{
        (
          []
          + (['not ready nodes=' ~ ((not_ready_nodes | default([]) | length) | string)] if ((not_ready_nodes | default([]) | length) > 0) else [])
          + (['nodes under pressure=' ~ ((pressure_nodes | default([]) | length) | string)] if ((pressure_nodes | default([]) | length) > 0) else [])
          + (['critical pod density nodes=' ~ ((critical_pod_density_nodes | default([]) | length) | string)] if ((critical_pod_density_nodes | default([]) | length) > 0) else [])
          + (['high pod density nodes=' ~ ((high_pod_density_nodes | default([]) | length) | string)] if ((high_pod_density_nodes | default([]) | length) > 0) else [])
          + (['quota pressure findings=' ~ ((quota_pressure_findings | default([]) | length) | string)] if ((quota_pressure_findings | default([]) | length) > 0) else [])
          + (['high CPU nodes=' ~ ((high_cpu_nodes | default([]) | length) | string)] if ((high_cpu_nodes | default([]) | length) > 0) else [])
          + (['high memory nodes=' ~ ((high_memory_nodes | default([]) | length) | string)] if ((high_memory_nodes | default([]) | length) > 0) else [])
          + (['high disk nodes=' ~ ((high_disk_nodes | default([]) | length) | string)] if ((high_disk_nodes | default([]) | length) > 0) else [])
          + (['node diagnostics evidence=' ~ (node_diagnostics_summary.verdict | default('unknown'))] if node_diagnostics_evidence_gap else [])
        ) | join('; ')
      }}
    node_capacity_recommendation: >-
      {{
        (
          'Stabilize node health first: restore NotReady nodes, relieve the most saturated nodes, and do not treat node capacity as healthy until critical density issues are cleared.'
          if node_capacity_status == 'CRITICAL'
          else (
            'Reduce node and capacity risk next: address node pressure, quota pressure, and high utilization or density hotspots. Review node-level diagnostics coverage so future node investigations and capacity planning stay credible.'
            if node_capacity_status == 'WARNING'
            else 'Node health and capacity posture look acceptable for this run. Keep readiness, pressure, density, utilization, and diagnostics coverage under normal review as workloads grow.'
          )
        )
      }}
  ansible.builtin.set_fact:
    node_health_capacity_summary:
      status: "{{ node_capacity_status }}"
      reason_summary: "{{ node_capacity_reason_summary }}"
      recommendation: "{{ node_capacity_recommendation }}"
      not_ready_node_count: "{{ not_ready_nodes | default([]) | length }}"
      node_pressure_count: "{{ pressure_nodes | default([]) | length }}"
      high_pod_density_node_count: "{{ high_pod_density_nodes | default([]) | length }}"
      critical_pod_density_node_count: "{{ critical_pod_density_nodes | default([]) | length }}"
      quota_pressure_finding_count: "{{ quota_pressure_findings | default([]) | length }}"
      high_cpu_node_count: "{{ high_cpu_nodes | default([]) | length }}"
      high_memory_node_count: "{{ high_memory_nodes | default([]) | length }}"
      high_disk_node_count: "{{ high_disk_nodes | default([]) | length }}"
      low_cpu_node_count: "{{ low_cpu_nodes | default([]) | length }}"
      low_memory_node_count: "{{ low_memory_nodes | default([]) | length }}"
      diagnostics_verdict: "{{ node_diagnostics_summary.verdict | default('insufficient-evidence') }}"
      diagnostics_sosreport_count: "{{ node_diagnostics_summary.sosreport_count | default(0) }}"
      diagnostics_inspect_present: "{{ node_diagnostics_summary.inspect_present | default(false) }}"
      external_storage_provider_detected: "{{ storage_posture_summary.has_external_storage_provider | default(false) }}"
      local_or_ephemeral_only_risk: "{{ storage_posture_summary.local_or_ephemeral_only_risk | default(false) }}"

- name: Build workload health and deployment hygiene posture summary
  vars:
    workload_runtime_issue_count: >-
      {{
        (unhealthy_user_pods | default([]) | length)
        + (workload_health_issues | default([]) | length)
      }}
    workload_warning_issue_count: >-
      {{
        (high_restart_pods | default([]) | length)
        + (high_replica_workloads | default([]) | length)
        + (orphan_pods | default([]) | length)
        + (workload_label_governance_findings | default([]) | length)
        + (workload_resource_findings | default([]) | length)
        + (workload_probe_findings | default([]) | length)
      }}
    workload_hygiene_debt_count: >-
      {{
        (high_replica_workloads | default([]) | length)
        + (orphan_pods | default([]) | length)
        + (workload_label_governance_findings | default([]) | length)
        + (workload_resource_findings | default([]) | length)
        + (workload_probe_findings | default([]) | length)
      }}
    workload_efficiency_context_count: >-
      {{
        (overprovisioned_pods | default([]) | length)
      }}
    workload_status: >-
      {{
        'CRITICAL'
        if (
          (unhealthy_user_pods | default([]) | length) > 0
          or (workload_health_issues | default([]) | length) > 0
        )
        else (
          'WARNING'
          if (
            (high_restart_pods | default([]) | length) > 0
            or (workload_hygiene_debt_count | int) > 0
          )
          else 'HEALTHY'
        )
      }}
    workload_reason_summary: >-
      {{
        (
          []
          + (['unhealthy user pods=' ~ ((unhealthy_user_pods | default([]) | length) | string)] if ((unhealthy_user_pods | default([]) | length) > 0) else [])
          + (['workload rollout issues=' ~ ((workload_health_issues | default([]) | length) | string)] if ((workload_health_issues | default([]) | length) > 0) else [])
          + (['restart hotspots=' ~ ((high_restart_pods | default([]) | length) | string)] if ((high_restart_pods | default([]) | length) > 0) else [])
          + (['probe coverage findings=' ~ ((workload_probe_findings | default([]) | length) | string)] if ((workload_probe_findings | default([]) | length) > 0) else [])
          + (['resource request/limit findings=' ~ ((workload_resource_findings | default([]) | length) | string)] if ((workload_resource_findings | default([]) | length) > 0) else [])
          + (['label governance findings=' ~ ((workload_label_governance_findings | default([]) | length) | string)] if ((workload_label_governance_findings | default([]) | length) > 0) else [])
          + (['orphan pods=' ~ ((orphan_pods | default([]) | length) | string)] if ((orphan_pods | default([]) | length) > 0) else [])
          + (['high replica workloads=' ~ ((high_replica_workloads | default([]) | length) | string)] if ((high_replica_workloads | default([]) | length) > 0) else [])
          + (['overprovisioned pods=' ~ ((overprovisioned_pods | default([]) | length) | string)] if ((overprovisioned_pods | default([]) | length) > 0) else [])
        ) | join('; ')
      }}
    workload_recommendation: >-
      {{
        (
          'Stabilize workload runtime health first: fix unhealthy user pods and incomplete workload rollouts before treating application posture as acceptable.'
          if workload_status == 'CRITICAL'
          else (
            'Reduce workload deployment risk next: review restart hotspots and workload hygiene debt such as missing probes, resource settings, labels, or owner references. Treat overprovisioning signals as softer follow-up context.'
            if workload_status == 'WARNING'
            else 'Workload health and deployment hygiene look acceptable for this run. Keep rollout status, restart hotspots, probes, and resource hygiene under normal review.'
          )
        )
      }}
  ansible.builtin.set_fact:
    workload_health_summary:
      status: "{{ workload_status }}"
      reason_summary: "{{ workload_reason_summary }}"
      recommendation: "{{ workload_recommendation }}"
      unhealthy_user_pod_count: "{{ unhealthy_user_pods | default([]) | length }}"
      workload_health_issue_count: "{{ workload_health_issues | default([]) | length }}"
      high_restart_pod_count: "{{ high_restart_pods | default([]) | length }}"
      service_endpoint_gap_count: "{{ services_without_endpoints | default([]) | length }}"
      workload_hygiene_debt_count: "{{ workload_hygiene_debt_count }}"
      workload_efficiency_context_count: "{{ workload_efficiency_context_count }}"
      high_replica_workload_count: "{{ high_replica_workloads | default([]) | length }}"
      orphan_pod_count: "{{ orphan_pods | default([]) | length }}"
      workload_label_governance_count: "{{ workload_label_governance_findings | default([]) | length }}"
      workload_resource_finding_count: "{{ workload_resource_findings | default([]) | length }}"
      workload_probe_finding_count: "{{ workload_probe_findings | default([]) | length }}"
      overprovisioned_pod_count: "{{ overprovisioned_pods | default([]) | length }}"

- name: Build platform architecture and lifecycle summary
  vars:
    graph: "{{ analysis_graph | default({}) }}"
    current_date: "{{ now(utc=true, fmt='%Y-%m-%d') }}"
    ocp_version_full: "{{ graph.clusterversion.status.desired.version | default('unknown') }}"
    ocp_version_minor: "{{ (graph.clusterversion.status.desired.version | default('') | regex_search('^[0-9]+\\.[0-9]+')) | default('') }}"
    lifecycle_calendar: "{{ (lookup('file', role_path ~ '/vars/lifecycle_calendar.yml') | from_yaml).openshift_lifecycle_calendar | default({}) }}"
    release_calendar: "{{ lifecycle_calendar.get(ocp_version_minor, {}) }}"
    maintenance_end: "{{ release_calendar.maintenance_end | default('') }}"
    full_support_end: "{{ release_calendar.full_support_end | default('') }}"
    eus_end: "{{ release_calendar.eus_end | default('') }}"
    eus_term_2_end: "{{ release_calendar.eus_term_2_end | default('') }}"
    topology_warning_count: >-
      {{
        (1 if (topology_resilience.single_zone_worker_pool_count | default(0) | int) > 0 else 0)
        + (1 if (topology_resilience.worker_nodes_without_zone_label | default(0) | int) > 0 else 0)
        + (1 if (topology_resilience.worker_zone_spread_unbalanced | default(false) | bool) else 0)
        + (1 if (topology_resilience.machinesets_without_zone_label | default(0) | int) > 0 else 0)
        + (1 if (topology_resilience.machineset_replica_unbalanced | default(false) | bool) else 0)
      }}
    topology_reason_summary: >-
      {{
        (
          []
          + (['worker pools limited to one zone'] if (topology_resilience.single_zone_worker_pool_count | default(0) | int) > 0 else [])
          + (['worker nodes missing zone labels'] if (topology_resilience.worker_nodes_without_zone_label | default(0) | int) > 0 else [])
          + (['worker zone spread is imbalanced'] if (topology_resilience.worker_zone_spread_unbalanced | default(false) | bool) else [])
          + (['machine API worker pools missing zone labels'] if (topology_resilience.machinesets_without_zone_label | default(0) | int) > 0 else [])
          + (['machine API worker-pool replicas are imbalanced'] if (topology_resilience.machineset_replica_unbalanced | default(false) | bool) else [])
        ) | join('; ')
      }}
    deployment_type_confidence_warning: "{{ (cluster_profile.cluster_classification_confidence | default(cluster_profile.deployment_type_confidence | default('low'))) == 'low' }}"
    derived_machine_networks: >-
      {{
        (cluster_profile.machine_networks | default([]))
        if ((cluster_profile.machine_networks | default([]) | length) > 0)
        else (
          (node_ip_capacity_summary.range_list | default([]))
          if (
            (node_ip_capacity_summary.source | default('')) not in ['', 'unknown', 'not-found']
            and ((node_ip_capacity_summary.range_list | default([])) | length) > 0
          )
          else []
        )
      }}
    derived_machine_networks_source: >-
      {{
        cluster_profile.machine_networks_source | default('not-exposed-via-cluster-api')
        if ((cluster_profile.machine_networks | default([]) | length) > 0)
        else (
          'derived-from-' ~ (node_ip_capacity_summary.source | default('node-ip-analysis'))
          if (
            (node_ip_capacity_summary.source | default('')) not in ['', 'unknown', 'not-found']
            and ((node_ip_capacity_summary.range_list | default([])) | length) > 0
          )
          else (cluster_profile.machine_networks_source | default('not-exposed-via-cluster-api'))
        )
      }}
    machine_networks_evidence_gap: "{{ (derived_machine_networks | default([]) | length) == 0 }}"
    lifecycle_support_phase: >-
      {{
        'unknown'
        if (release_calendar | length) == 0
        else (
          'full-support'
          if (full_support_end | length > 0 and current_date <= full_support_end)
          else (
            'maintenance-support'
            if (maintenance_end | length > 0 and current_date <= maintenance_end)
            else (
              'eus-term-1-available'
              if (eus_end | length > 0 and current_date <= eus_end)
              else (
                'eus-term-2-available'
                if (eus_term_2_end | length > 0 and current_date <= eus_term_2_end)
                else 'unsupported'
              )
            )
          )
        )
      }}
    lifecycle_support_status: >-
      {{
        'unknown'
        if lifecycle_support_phase == 'unknown'
        else (
          'supported'
          if lifecycle_support_phase in ['full-support', 'maintenance-support']
          else (
            'eus-optional'
            if lifecycle_support_phase in ['eus-term-1-available', 'eus-term-2-available']
            else 'unsupported'
          )
        )
      }}
    conditional_update_risk_names: >-
      {{
        conditional_updates | default([])
        | map(attribute='risks')
        | map('default', [])
        | map('first')
        | select('defined')
        | map(attribute='name')
        | list
      }}
    days_to_maintenance_end: >-
      {{
        (
          ((maintenance_end | to_datetime('%Y-%m-%d')) - (current_date | to_datetime('%Y-%m-%d'))).days
        )
        if (maintenance_end | length > 0)
        else None
      }}
    days_to_eus_end: >-
      {{
        (
          ((eus_end | to_datetime('%Y-%m-%d')) - (current_date | to_datetime('%Y-%m-%d'))).days
        )
        if (eus_end | length > 0)
        else None
      }}
    architecture_lifecycle_status: >-
      {{
        'CRITICAL'
        if lifecycle_support_status == 'unsupported'
        else (
          'WARNING'
          if (
            lifecycle_support_status == 'eus-optional'
            or (conditional_updates | default([]) | length > 0)
            or (topology_warning_count | int) > 0
            or deployment_type_confidence_warning
            or machine_networks_evidence_gap
          )
          else (
            'not-assessed'
            if lifecycle_support_status == 'unknown'
            else 'HEALTHY'
          )
        )
      }}
    architecture_lifecycle_recommendation: >-
      {{
        (
          'Upgrade planning is urgent: this OpenShift minor release is outside base support. Move to a currently supported minor immediately, and do not treat conditional update or topology cleanup as a substitute for a supported lifecycle state.'
          if lifecycle_support_status == 'unsupported'
          else (
            'Base maintenance support has ended for this EUS-capable minor. Confirm Extended Update Support entitlement and coverage immediately, or upgrade to a fully supported minor before treating the platform as lifecycle-stable.'
            if lifecycle_support_status == 'eus-optional'
            else (
              'Tighten architecture and lifecycle posture next: resolve conditional update risks, improve failure-domain spread and zone labeling, and verify deployment topology assumptions before treating the cluster architecture as production-ready.'
              if (
                (conditional_updates | default([]) | length > 0)
                or (topology_warning_count | int) > 0
              )
              else (
                'Architecture and lifecycle posture are acceptable for this run. Keep the cluster on a supported release, preserve multi-zone worker spread where expected, and continue normal upgrade readiness review.'
                if (
                  lifecycle_support_status == 'supported'
                  and not deployment_type_confidence_warning
                  and not machine_networks_evidence_gap
                )
                else 'Architecture and lifecycle evidence is incomplete for this run. Verify cluster classification assumptions and machine-network design explicitly before relying on this posture as a full architecture review.'
              )
            )
          )
        )
      }}
    architecture_lifecycle_reason_summary: >-
      {{
        (
          []
          + (
            ['support status=' ~ lifecycle_support_status ~ ' phase=' ~ lifecycle_support_phase]
            if lifecycle_support_status != 'supported'
            else []
          )
          + (
            ['conditional update risks: ' ~ (conditional_update_risk_names[:3] | join(', '))]
            if (conditional_update_risk_names | length) > 0
            else []
          )
          + (
            [topology_reason_summary]
            if (topology_reason_summary | length) > 0
            else []
          )
          + (
            ['cluster classification confidence=' ~ (cluster_profile.cluster_classification_confidence | default(cluster_profile.deployment_type_confidence | default('low')))]
            if deployment_type_confidence_warning
            else []
          )
          + (
            ['machine-network design was not exposed by collected cluster API data']
            if machine_networks_evidence_gap
            else []
          )
        ) | join('; ')
      }}
  ansible.builtin.set_fact:
    architecture_lifecycle_summary:
      status: "{{ architecture_lifecycle_status }}"
      support_status: "{{ lifecycle_support_status }}"
      support_phase: "{{ lifecycle_support_phase }}"
      version: "{{ ocp_version_full }}"
      version_minor: "{{ ocp_version_minor | default('unknown') }}"
      ga_date: "{{ release_calendar.ga | default('unknown') }}"
      full_support_end: "{{ full_support_end | default('unknown') }}"
      maintenance_end: "{{ maintenance_end | default('unknown') }}"
      eus_end: "{{ eus_end | default('n/a') }}"
      eus_term_2_end: "{{ eus_term_2_end | default('n/a') }}"
      days_to_maintenance_end: "{{ days_to_maintenance_end }}"
      days_to_eus_end: "{{ days_to_eus_end }}"
      conditional_update_count: "{{ conditional_updates | default([]) | length }}"
      conditional_update_risk_names: "{{ conditional_update_risk_names }}"
      topology_warning_count: "{{ topology_warning_count | int }}"
      topology_reason_summary: "{{ topology_reason_summary }}"
      reason_summary: "{{ architecture_lifecycle_reason_summary }}"
      recommendation: "{{ architecture_lifecycle_recommendation }}"
      cluster_classification_label: "{{ cluster_profile.cluster_classification_label | default(cluster_profile.deployment_type | default('openshift')) }}"
      cluster_classification_source: "{{ cluster_profile.cluster_classification_source | default(cluster_profile.deployment_type_source | default('default-openshift-fallback')) }}"
      cluster_classification_confidence: "{{ cluster_profile.cluster_classification_confidence | default(cluster_profile.deployment_type_confidence | default('low')) }}"
      service_model: "{{ cluster_profile.service_model | default('unknown') }}"
      service_model_source: "{{ cluster_profile.service_model_source | default('not-derived') }}"
      service_model_confidence: "{{ cluster_profile.service_model_confidence | default('low') }}"
      service_variant: "{{ cluster_profile.service_variant | default('unknown') }}"
      install_model: "{{ cluster_profile.install_model | default('unknown') }}"
      install_model_source: "{{ cluster_profile.install_model_source | default('not-derived') }}"
      install_model_confidence: "{{ cluster_profile.install_model_confidence | default('low') }}"
      control_plane_model: "{{ cluster_profile.control_plane_model | default('unknown') }}"
      control_plane_model_source: "{{ cluster_profile.control_plane_model_source | default('not-derived') }}"
      control_plane_model_confidence: "{{ cluster_profile.control_plane_model_confidence | default('low') }}"
      platform_category: "{{ cluster_profile.platform_category | default('unknown') }}"
      public_cloud: "{{ cluster_profile.public_cloud | default(false) | bool }}"
      deployment_type: "{{ cluster_profile.deployment_type | default('openshift') }}"
      deployment_type_source: "{{ cluster_profile.deployment_type_source | default('default-openshift-fallback') }}"
      deployment_type_confidence: "{{ cluster_profile.deployment_type_confidence | default('low') }}"
      deployment_type_confidence_warning: "{{ deployment_type_confidence_warning }}"
      machine_networks: "{{ derived_machine_networks }}"
      machine_networks_known: "{{ (derived_machine_networks | default([]) | length) > 0 }}"
      machine_networks_source: "{{ derived_machine_networks_source }}"
      machine_networks_evidence_gap: "{{ machine_networks_evidence_gap }}"
      lifecycle_policy_source: repo-local-versioned-policy

- name: Build declarative operations summary
  vars:
    declarative_operations_status: >-
      {{
        'WARNING'
        if (
          not (day2_posture_summary.gitops_present | default(false))
          or
          (
            (day2_posture_summary.gitops_present | default(false))
            and (
              (day2_posture_summary.gitops_application_count | default(0) | int) == 0
              or not (day2_posture_summary.gitops_operational | default(false))
            )
          )
          or (
            (day2_posture_summary.gitops_application_count | default(0) | int) > 0
            and not (day2_posture_summary.gitops_automated_sync_present | default(false))
          )
        )
        else 'HEALTHY'
      }}
    declarative_operations_reason_summary: >-
      {{
        (
          []
          + (['Declarative GitOps operations evidence was not detected'] if not (day2_posture_summary.gitops_present | default(false)) else [])
          + (['GitOps controller evidence is present but no GitOps Application resources were found'] if ((day2_posture_summary.gitops_present | default(false)) and (day2_posture_summary.gitops_application_count | default(0) | int) == 0) else [])
          + (['GitOps Applications were found but none exposed a Git repository source'] if (((day2_posture_summary.gitops_application_count | default(0) | int) > 0) and not (day2_posture_summary.gitops_operational | default(false))) else [])
          + (['GitOps Applications were found but none showed automated sync'] if (((day2_posture_summary.gitops_application_count | default(0) | int) > 0) and not (day2_posture_summary.gitops_automated_sync_present | default(false))) else [])
          + (['supporting operations context: identityProviders=' ~ (day2_posture_summary.identity_provider_count | default(0) | string) ~ ', successfulBackups=' ~ (day2_posture_summary.successful_backup_count | default(0) | string) ~ ', machineHealthChecks=' ~ (day2_posture_summary.machinehealthcheck_count | default(0) | string)] if declarative_operations_status != 'WARNING' else [])
        ) | join('; ')
      }}
    declarative_operations_recommendation: >-
      {{
        (
          'Strengthen the operating model next: ensure GitOps is present, GitOps Applications exist, point to Git repository sources, and use the intended reconciliation policy. Onboard platform and application resources into the declared operating model and verify whether automated sync should be enabled for those applications.'
          if declarative_operations_status == 'WARNING'
          else 'Operations and lifecycle maturity look acceptable for this run. Treat GitOps and broader Day 2 inventory as operating-model context unless the customer requires a declarative operations standard.'
        )
      }}
  ansible.builtin.set_fact:
    declarative_operations_summary:
      status: "{{ declarative_operations_status }}"
      reason_summary: "{{ declarative_operations_reason_summary }}"
      recommendation: "{{ declarative_operations_recommendation }}"
      gitops_present: "{{ day2_posture_summary.gitops_present | default(false) }}"
      gitops_operational: "{{ day2_posture_summary.gitops_operational | default(false) }}"
      gitops_automated_sync_present: "{{ day2_posture_summary.gitops_automated_sync_present | default(false) }}"
      argocd_count: "{{ day2_posture_summary.argocd_count | default(0) }}"
      gitops_application_count: "{{ day2_posture_summary.gitops_application_count | default(0) }}"
      gitops_repo_backed_application_count: "{{ day2_posture_summary.gitops_repo_backed_application_count | default(0) }}"
      gitops_automated_sync_application_count: "{{ day2_posture_summary.gitops_automated_sync_application_count | default(0) }}"
      gitops_appproject_count: "{{ day2_posture_summary.gitops_appproject_count | default(0) }}"
      acm_managed: "{{ day2_posture_summary.acm_managed | default(false) }}"
      acm_klusterlet_count: "{{ day2_posture_summary.acm_klusterlet_count | default(0) }}"
      acm_managedclusteraddon_count: "{{ day2_posture_summary.acm_managedclusteraddon_count | default(0) }}"
      acm_agent_namespace_count: "{{ day2_posture_summary.acm_agent_namespace_count | default(0) }}"
      identity_provider_count: "{{ day2_posture_summary.identity_provider_count | default(0) }}"
      backup_schedule_count: "{{ day2_posture_summary.backup_schedule_count | default(0) }}"
      successful_backup_count: "{{ day2_posture_summary.successful_backup_count | default(0) }}"
      machinehealthcheck_count: "{{ day2_posture_summary.machinehealthcheck_count | default(0) }}"
      machinehealthcheck_expected: "{{ day2_posture_summary.machinehealthcheck_expected | default(false) }}"
      clusterautoscaler_count: "{{ day2_posture_summary.clusterautoscaler_count | default(0) }}"
      clusterautoscaler_expected: "{{ day2_posture_summary.clusterautoscaler_expected | default(false) }}"
      insights_healthy: "{{ day2_posture_summary.insights_healthy | default(false) }}"
      day2_check_count: "{{ day2_posture_summary.checks_total | default(0) }}"
      capability_check_warning_count: "{{ day2_posture_summary.checks_warn | default(0) }}"

- name: Build Day 2 production readiness synthesis summary
  vars:
    readiness_lifecycle_warning: >-
      {{
        (architecture_lifecycle_summary.support_status | default('unknown')) not in ['supported', 'unknown']
      }}
    readiness_upgrade_blocked: "{{ (upgrade_readiness_summary.status | default('not-assessed')) == 'BLOCKED' }}"
    readiness_upgrade_warning: "{{ (upgrade_readiness_summary.status | default('not-assessed')) == 'WARNING' }}"
    readiness_observability_critical: "{{ (observability_summary.status | default('not-assessed')) == 'CRITICAL' }}"
    readiness_observability_warning: "{{ (observability_summary.status | default('not-assessed')) == 'WARNING' }}"
    readiness_backup_critical: "{{ (backup_recovery_summary.status | default('not-assessed')) == 'CRITICAL' }}"
    readiness_backup_warning: "{{ (backup_recovery_summary.status | default('not-assessed')) == 'WARNING' }}"
    readiness_security_critical: "{{ (security_compliance_summary.status | default('not-assessed')) == 'CRITICAL' }}"
    readiness_security_warning: "{{ (security_compliance_summary.status | default('not-assessed')) == 'WARNING' }}"
    readiness_operations_warning: "{{ (declarative_operations_summary.status | default('not-assessed')) == 'WARNING' }}"
    readiness_collection: "{{ assessment_collection_summary | default(report_collection | default({})) }}"
    readiness_collection_confidence: >-
      {{
        'low'
        if (readiness_collection.core_failed_commands | default(0) | int) > 0
        else (
          'medium'
          if (
            (readiness_collection.failed_commands | default(0) | int) > 0
            or (readiness_collection.timed_out_commands | default(0) | int) > 0
          )
          else 'high'
        )
      }}
    readiness_evidence_confidence: "{{ supportability_summary.evidence_confidence | default(report_confidence | default(readiness_collection_confidence)) }}"
    readiness_evidence_warning: "{{ readiness_evidence_confidence in ['low', 'unknown'] }}"
    day2_production_readiness_status: >-
      {{
        'CRITICAL'
        if (
          readiness_upgrade_blocked
          or readiness_observability_critical
          or readiness_backup_critical
          or readiness_security_critical
        )
        else (
          'WARNING'
          if (
            readiness_lifecycle_warning
            or readiness_upgrade_warning
            or readiness_observability_warning
            or readiness_backup_warning
            or readiness_security_warning
            or readiness_operations_warning
            or readiness_extensions_warning
            or readiness_evidence_warning
          )
          else 'HEALTHY'
        )
      }}
    day2_production_readiness_top_blockers: >-
      {{
        (
          []
          + (['Upgrade readiness is blocked'] if readiness_upgrade_blocked else [])
          + (['Observability posture is critical'] if readiness_observability_critical else [])
          + (['Backup and disaster recovery posture is critical'] if readiness_backup_critical else [])
          + (['Security and compliance posture is critical'] if readiness_security_critical else [])
          + (['Evidence confidence is limited'] if readiness_evidence_warning else [])
          + (['Lifecycle support needs review'] if (not readiness_upgrade_blocked and readiness_lifecycle_warning) else [])
          + (['Observability posture needs review'] if (not readiness_observability_critical and readiness_observability_warning) else [])
          + (['Backup and disaster recovery posture needs review'] if (not readiness_backup_critical and readiness_backup_warning) else [])
          + (['Security and compliance posture needs review'] if (not readiness_security_critical and readiness_security_warning) else [])
          + (['Operations maturity needs review'] if readiness_operations_warning else [])
        )[:3]
      }}
    day2_production_readiness_reason_summary: >-
      {{
        (
          []
          + (['lifecycle support=' ~ (architecture_lifecycle_summary.support_status | default('unknown'))] if readiness_lifecycle_warning else [])
          + (['upgrade readiness=' ~ (upgrade_readiness_summary.status | default('not-assessed'))] if (readiness_upgrade_blocked or readiness_upgrade_warning) else [])
          + (['observability=' ~ (observability_summary.status | default('not-assessed'))] if (readiness_observability_critical or readiness_observability_warning) else [])
          + (['backup and DR=' ~ (backup_recovery_summary.status | default('not-assessed'))] if (readiness_backup_critical or readiness_backup_warning) else [])
          + (['security and compliance=' ~ (security_compliance_summary.status | default('not-assessed'))] if (readiness_security_critical or readiness_security_warning) else [])
          + (['declarative operations=' ~ (declarative_operations_summary.status | default('not-assessed'))] if readiness_operations_warning else [])
          + (['evidence confidence=' ~ readiness_evidence_confidence] if readiness_evidence_warning else [])
        ) | join('; ')
      }}
    day2_production_readiness_recommendation: >-
      {{
        (
          'Production readiness is blocked by higher-risk posture gaps. Resolve critical blockers in priority order: close evidence gaps if confidence is low, clear upgrade blockers, then fix critical observability, backup, disaster-recovery, security, or compliance findings before treating the cluster as production-ready.'
          if day2_production_readiness_status == 'CRITICAL'
          else (
            'Production readiness needs follow-up. Address lifecycle, upgrade, observability, recovery, security, operations, or evidence-confidence warnings in the owning posture sections, then re-run the report before declaring the cluster production-ready.'
            if day2_production_readiness_status == 'WARNING'
            else 'Day 2 production readiness looks acceptable for this run. Keep lifecycle, observability, recovery, and operations maturity under normal review as the cluster evolves.'
          )
        )
      }}
  ansible.builtin.set_fact:
    day2_production_readiness_summary:
      status: "{{ day2_production_readiness_status }}"
      reason_summary: "{{ day2_production_readiness_reason_summary }}"
      recommendation: "{{ day2_production_readiness_recommendation }}"
      lifecycle_support_status: "{{ architecture_lifecycle_summary.support_status | default('unknown') }}"
      upgrade_readiness_status: "{{ upgrade_readiness_summary.status | default('not-assessed') }}"
      observability_status: "{{ observability_summary.status | default('not-assessed') }}"
      backup_recovery_status: "{{ backup_recovery_summary.status | default('not-assessed') }}"
      security_compliance_status: "{{ security_compliance_summary.status | default('not-assessed') }}"
      declarative_operations_status: "{{ declarative_operations_summary.status | default('not-assessed') }}"
      evidence_confidence: "{{ readiness_evidence_confidence }}"
      top_blockers: "{{ day2_production_readiness_top_blockers }}"

- name: Create CI/CD runner summary input
  ansible.builtin.tempfile:
    state: file
    prefix: openshift-cicd-runner-summary-
    suffix: .json
  register: cicd_runner_summary_input_file
  changed_when: false

- name: Write CI/CD runner summary input
  ansible.builtin.copy:
    dest: "{{ cicd_runner_summary_input_file.path }}"
    content: "{{ analysis_graph | default({}) | to_json }}"
    mode: "0600"
  changed_when: false

- name: Build CI/CD runner summary
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/build_cicd_runner_summary.py"
      - "{{ cicd_runner_summary_input_file.path }}"
  register: cicd_runner_summary_cmd
  changed_when: false
  failed_when: cicd_runner_summary_cmd.rc != 0

- name: Normalize CI/CD runner summary
  ansible.builtin.set_fact:
    cicd_runner_analysis: "{{ cicd_runner_summary_cmd.stdout | from_json if (cicd_runner_summary_cmd.rc == 0 and (cicd_runner_summary_cmd.stdout | default('') | trim | length > 0)) else {'summary': {}, 'findings': []} }}"

- name: Remove CI/CD runner summary input
  ansible.builtin.file:
    path: "{{ cicd_runner_summary_input_file.path }}"
    state: absent
  changed_when: false
  when: cicd_runner_summary_input_file.path is defined

- name: Build container platform adoption and release engineering summary
  vars:
    graph: "{{ analysis_graph | default({}) }}"
    runner_summary: "{{ (cicd_runner_analysis | default({})).summary | default({}) }}"
    pipeline_inventory_count: "{{ (graph.pipelines | default({})).get('items', []) | length }}"
    pipelinerun_inventory_count: "{{ (graph.pipelineruns | default({})).get('items', []) | length }}"
    buildconfig_inventory_count: "{{ (graph.buildconfigs | default({})).get('items', []) | length }}"
    build_inventory_count: "{{ (graph.builds | default({})).get('items', []) | length }}"
    imagestream_inventory_count: "{{ (graph.imagestreams | default({})).get('items', []) | length }}"
    product_evidence_present_count: >-
      {{
        (
          assessment_product_evidence | default({})
        ) | dict2items | selectattr('value.present', 'defined') | selectattr('value.present', 'equalto', true) | list | length
      }}
    gitops_argocd_count: "{{ (gitops_summary | default({}))['argocd_count'] | default(0) }}"
    gitops_application_count: "{{ (gitops_summary | default({}))['application_count'] | default(0) }}"
    day2_tekton_present: "{{ (day2_posture_summary | default({}))['tekton_present'] | default(false) }}"
    external_delivery_evidence_present: >-
      {{
        (
          (gitops_argocd_count | int) > 0
          or (gitops_application_count | int) > 0
          or (day2_tekton_present | bool)
          or (pipeline_inventory_count | int) > 0
          or (pipelinerun_inventory_count | int) > 0
          or (runner_summary.present | default(false) | bool)
        )
      }}
    triggerless_buildconfig_warning_count: >-
      {{
        (buildconfigs_without_triggers | default([]) | length)
        if (
          (buildconfigs_without_triggers | default([]) | length) > 0
          and not external_delivery_evidence_present
        )
        else 0
      }}
    triggerless_buildconfig_info_count: >-
      {{
        (buildconfigs_without_triggers | default([]) | length)
        if (
          (buildconfigs_without_triggers | default([]) | length) > 0
          and external_delivery_evidence_present
        )
        else 0
      }}
    release_engineering_status: >-
      {{
        'WARNING'
        if (
          (failed_pipelineruns | default([]) | length) > 0
          or (triggerless_buildconfig_warning_count | int) > 0
          or (runner_summary.unhealthy_pod_count | default(0) | int) > 0
          or (runner_summary.unschedulable_pod_count | default(0) | int) > 0
          or (runner_summary.privileged_pod_count | default(0) | int) > 0
        )
        else (
          'HEALTHY'
          if (
            (pipeline_inventory_count | int) > 0
            or (pipelinerun_inventory_count | int) > 0
            or (buildconfig_inventory_count | int) > 0
            or (build_inventory_count | int) > 0
            or (imagestream_inventory_count | int) > 0
            or (runner_summary.present | default(false) | bool)
          )
          else 'INFO'
        )
      }}
    release_engineering_reason_summary: >-
      {{
        (
          []
          + (['failed PipelineRuns=' ~ ((failed_pipelineruns | default([]) | length) | string)] if ((failed_pipelineruns | default([]) | length) > 0) else [])
          + (['BuildConfigs without triggers=' ~ ((triggerless_buildconfig_warning_count | int) | string)] if (triggerless_buildconfig_warning_count | int) > 0 else [])
          + (['BuildConfigs without triggers treated as automation context=' ~ ((triggerless_buildconfig_info_count | int) | string)] if (triggerless_buildconfig_info_count | int) > 0 else [])
          + (['pipelines=' ~ ((pipeline_inventory_count | int) | string)] if (pipeline_inventory_count | int) > 0 else [])
          + (['PipelineRuns=' ~ ((pipelinerun_inventory_count | int) | string)] if (pipelinerun_inventory_count | int) > 0 else [])
          + (['BuildConfigs=' ~ ((buildconfig_inventory_count | int) | string)] if (buildconfig_inventory_count | int) > 0 else [])
          + (['Builds=' ~ ((build_inventory_count | int) | string)] if (build_inventory_count | int) > 0 else [])
          + (['ImageStreams=' ~ ((imagestream_inventory_count | int) | string)] if (imagestream_inventory_count | int) > 0 else [])
          + (['cluster-hosted runner pods=' ~ ((runner_summary.runner_pod_count | default(0) | int) | string)] if (runner_summary.runner_pod_count | default(0) | int) > 0 else [])
          + (['unhealthy runner pods=' ~ ((runner_summary.unhealthy_pod_count | default(0) | int) | string)] if (runner_summary.unhealthy_pod_count | default(0) | int) > 0 else [])
          + (['unschedulable runner pods=' ~ ((runner_summary.unschedulable_pod_count | default(0) | int) | string)] if (runner_summary.unschedulable_pod_count | default(0) | int) > 0 else [])
          + (['privileged runner pods=' ~ ((runner_summary.privileged_pod_count | default(0) | int) | string)] if (runner_summary.privileged_pod_count | default(0) | int) > 0 else [])
          + (['no release-engineering footprint detected'] if ((pipeline_inventory_count | int) == 0 and (pipelinerun_inventory_count | int) == 0 and (buildconfig_inventory_count | int) == 0 and (build_inventory_count | int) == 0 and (imagestream_inventory_count | int) == 0 and not (runner_summary.present | default(false) | bool)) else [])
        ) | join('; ')
      }}
    release_engineering_recommendation: >-
      {{
        (
          'Reduce release-engineering risk next: investigate failed PipelineRuns first, fix unhealthy or unschedulable cluster-hosted runner pods, review privileged or unbounded runner pools, and review triggerless BuildConfigs only where no other delivery automation evidence exists.'
          if release_engineering_status == 'WARNING'
          else (
            'Release-engineering evidence is present. Treat triggerless BuildConfigs as context when pipelines, cluster-hosted runners, or external automation already exist, and keep delivery failures and runner health under normal review.'
            if (
              (pipeline_inventory_count | int) > 0
              or (pipelinerun_inventory_count | int) > 0
              or (buildconfig_inventory_count | int) > 0
              or (build_inventory_count | int) > 0
              or (imagestream_inventory_count | int) > 0
              or (runner_summary.present | default(false) | bool)
            )
            else 'No clear release-engineering footprint was detected in collected resources. Treat this as absence of evidence rather than an automatic defect unless delivery tooling or cluster-hosted runners are expected for this cluster.'
          )
        )
      }}
  ansible.builtin.set_fact:
    release_engineering_adoption_summary:
      status: "{{ release_engineering_status }}"
      reason_summary: "{{ release_engineering_reason_summary }}"
      recommendation: "{{ release_engineering_recommendation }}"
      pipeline_count: "{{ pipeline_inventory_count }}"
      pipelinerun_count: "{{ pipelinerun_inventory_count }}"
