---
- name: Build warning event summaries
  ansible.builtin.set_fact:
    warning_event_reason_counts: "{{ warning_event_reason_counts | default({}) | combine({event_reason: ((warning_event_reason_counts[event_reason] | default(0)) + 1)}, recursive=True) }}"
  loop: "{{ (analysis_graph.events | default({})).get('items', []) }}"
  vars:
    event_reason: "{{ item.reason | default('Unknown') }}"
  changed_when: false

- name: Parse monitoring config YAML
  vars:
    graph_configmaps: "{{ (analysis_graph.configmaps | default({'items': []})).get('items', []) }}"
    cluster_monitoring_config_obj: "{{ (graph_configmaps | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring') | selectattr('metadata.name', 'equalto', 'cluster-monitoring-config') | list | first) | default({}) }}"
    user_workload_monitoring_config_obj: "{{ (graph_configmaps | selectattr('metadata.namespace', 'equalto', 'openshift-user-workload-monitoring') | selectattr('metadata.name', 'equalto', 'user-workload-monitoring-config') | list | first) | default({}) }}"
  ansible.builtin.set_fact:
    cluster_monitoring_config_parsed: "{{ ((cluster_monitoring_config_obj.data['config.yaml'] | default('')) | from_yaml) if (cluster_monitoring_config_obj.data is defined and cluster_monitoring_config_obj.data['config.yaml'] is defined) else {} }}"
    user_workload_monitoring_config_parsed: "{{ ((user_workload_monitoring_config_obj.data['config.yaml'] | default('')) | from_yaml) if (user_workload_monitoring_config_obj.data is defined and user_workload_monitoring_config_obj.data['config.yaml'] is defined) else {} }}"

- name: Attempt to discover thanos querier route
  ansible.builtin.command: oc -n openshift-monitoring get route thanos-querier -o jsonpath={.spec.host}
  register: thanos_route_cmd
  changed_when: false
  failed_when: false
  when: (report_mode_resolved | default('live')) == 'live'

- name: Capture bearer token
  ansible.builtin.command: oc whoami -t
  register: oc_token_cmd
  changed_when: false
  failed_when: false
  when: (report_mode_resolved | default('live')) == 'live'

- name: Attempt API server readyz check
  ansible.builtin.command: oc get --raw=/readyz?verbose
  register: apiserver_readyz_cmd
  changed_when: false
  failed_when: false
  when: (report_mode_resolved | default('live')) == 'live'

- name: Build observability forwarding summary
  ansible.builtin.set_fact:
    observability_forwarding_summary:
      monitoring_operator_available: >-
        {{
          clusteroperator_status_map.monitoring.available
          if ((clusteroperator_status_map | default({})).get('monitoring', {}) | length) > 0
          else (
            'True'
            if (
              (
                (analysis_graph.namespaces | default({'items': []})).get('items', [])
                | selectattr('metadata.name', 'equalto', 'openshift-monitoring')
                | list
                | length
              ) > 0
              and (
                (
                  (analysis_graph.pods | default({'items': []})).get('items', [])
                  | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring')
                  | list
                  | length
                ) > 0
                or (
                  (analysis_graph.deployments | default({'items': []})).get('items', [])
                  | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring')
                  | list
                  | length
                ) > 0
              )
            )
            else 'Unknown'
          )
        }}
      monitoring_operator_degraded: >-
        {{
          clusteroperator_status_map.monitoring.degraded
          if ((clusteroperator_status_map | default({})).get('monitoring', {}) | length) > 0
          else (
            'False'
            if (
              (
                (analysis_graph.namespaces | default({'items': []})).get('items', [])
                | selectattr('metadata.name', 'equalto', 'openshift-monitoring')
                | list
                | length
              ) > 0
              and (
                (
                  (analysis_graph.pods | default({'items': []})).get('items', [])
                  | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring')
                  | list
                  | length
                ) > 0
                or (
                  (analysis_graph.deployments | default({'items': []})).get('items', [])
                  | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring')
                  | list
                  | length
                ) > 0
              )
            )
            else 'Unknown'
          )
        }}
      thanos_querier_route_found: >-
        {{
          (
            (analysis_graph.routes | default({'items': []})).get('items', [])
            | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring')
            | selectattr('metadata.name', 'equalto', 'thanos-querier')
            | list
            | length
          ) > 0
        }}
      cluster_log_forwarder_count: "{{ (analysis_graph.clusterlogforwarders | default({})).get('items', []) | length }}"
      alertmanagerconfig_count: "{{ (analysis_graph.alertmanagerconfigs | default({})).get('items', []) | length }}"
      cluster_alertmanager_additional_config_count: "{{ ((((cluster_monitoring_config_parsed.alertmanagerMain | default({})).additionalAlertmanagerConfigs | default([])) | length)) }}"
      user_workload_alertmanager_additional_config_count: "{{ ((((user_workload_monitoring_config_parsed.alertmanager | default({})).additionalAlertmanagerConfigs | default([])) | length)) }}"
      log_forwarding_outputs: []
      external_log_forwarding_outputs: []
      external_alert_receivers: []
      alert_delivery_config_sources: []
      alert_delivery_source_count: 0
      external_alert_receiver_count: 0
      external_alert_delivery_configured: false
      alert_routing_to_external_receiver_configured: false
      alertmanagerconfigs_with_external_routes: 0
      alertmanagerconfigs_without_route_receivers: 0
      application_log_pipeline_count: 0
      infrastructure_log_pipeline_count: 0
      audit_log_pipeline_count: 0
      application_logs_collected: false
      infrastructure_logs_collected: false
      audit_logs_collected: false
      application_logs_exported_external: false
      infrastructure_logs_exported_external: false
      audit_logs_exported_external: false
      application_logs_delivery_state: not-collected
      infrastructure_logs_delivery_state: not-collected
      audit_logs_delivery_state: not-collected
      logs_delivery_verification_status: not-configured
      cluster_metrics_remote_write_count: "{{ (((cluster_monitoring_config_parsed.prometheusK8s | default({})).remoteWrite | default([])) | length) }}"
      user_workload_metrics_remote_write_count: "{{ (((user_workload_monitoring_config_parsed.prometheus | default({})).remoteWrite | default([])) | length) }}"
      external_cluster_metrics_remote_write_count: 0
      external_user_workload_metrics_remote_write_count: 0
      cluster_metrics_delivery_state: not-configured
      user_workload_metrics_delivery_state: not-configured
      metrics_delivery_verification_status: not-configured
      alert_delivery_state: not-configured
      alert_delivery_verification_status: not-configured

- name: Update thanos route capability in observability summary
  ansible.builtin.set_fact:
    observability_forwarding_summary: "{{ observability_forwarding_summary | combine({'thanos_querier_route_found': (((thanos_route_cmd.rc | default(1)) == 0 and (thanos_route_cmd.stdout | default('') | trim | length > 0)) or (observability_forwarding_summary.thanos_querier_route_found | default(false)))}, recursive=True) }}"

- name: Select must-gather path for offline control-plane evidence
  ansible.builtin.set_fact:
    control_plane_evidence_must_gather_path: >-
      {{
        (((live_support_data | default({})).get('paths', {})).get('must_gather', ''))
        if ((report_mode_resolved | default('live')) == 'live')
        else (must_gather_path | default(''))
      }}

- name: Parse offline control-plane evidence from must-gather
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/parse_control_plane_evidence.py"
      - "{{ control_plane_evidence_must_gather_path }}"
  register: control_plane_evidence_cmd
  changed_when: false
  failed_when: false
  when: control_plane_evidence_must_gather_path | default('') | trim | length > 0

- name: Normalize offline control-plane evidence
  ansible.builtin.set_fact:
    control_plane_evidence_data: >-
      {{
        control_plane_evidence_cmd.stdout | from_json
        if (
          control_plane_evidence_cmd is defined
          and (control_plane_evidence_cmd.rc | default(1)) == 0
          and (control_plane_evidence_cmd.stdout | default('') | trim | length > 0)
        )
        else {'summary': {'present': false}, 'artifacts': {}, 'samples': {}}
      }}
  changed_when: false

- name: Build offline workload metric fallbacks
  block:
    - name: Create offline workload fallback input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-offline-workload-
        suffix: .json
      register: offline_workload_fallback_input_file
      changed_when: false

    - name: Write offline workload fallback input data
      ansible.builtin.copy:
        dest: "{{ offline_workload_fallback_input_file.path }}"
        mode: "0600"
        content: "{{ {
          'nodes': ((analysis_graph.nodes | default({})).get('items', [])),
          'pods': ((analysis_graph.pods | default({})).get('items', [])),
          'exclude_regex': user_namespaces_exclude_regex,
          'omc_summary': (omc_summary | default({}))
        } | to_json }}"
      changed_when: false

    - name: Run offline workload fallback analysis
      ansible.builtin.shell: |
        python3 - <<'PY' "{{ offline_workload_fallback_input_file.path }}"
        import json
        import re
        import sys

        with open(sys.argv[1], "r", encoding="utf-8") as handle:
            data = json.load(handle)

        def parse_cpu(value):
            if value in (None, ""):
                return 0.0
            s = str(value).strip()
            if s.endswith("m"):
                try:
                    return float(s[:-1]) / 1000.0
                except Exception:
                    return 0.0
            try:
                return float(s)
            except Exception:
                return 0.0

        def parse_mem(value):
            if value in (None, ""):
                return 0.0
            s = str(value).strip()
            units = {
                "Ki": 1024, "Mi": 1024**2, "Gi": 1024**3, "Ti": 1024**4,
                "Pi": 1024**5, "Ei": 1024**6, "K": 1000, "M": 1000**2,
                "G": 1000**3, "T": 1000**4, "P": 1000**5, "E": 1000**6,
            }
            for suf, mult in units.items():
                if s.endswith(suf):
                    try:
                        return float(s[:-len(suf)]) * mult
                    except Exception:
                        return 0.0
            try:
                return float(s)
            except Exception:
                return 0.0

        exclude_re = re.compile(data.get("exclude_regex") or r"^$")
        node_alloc = {}
        for node in data.get("nodes") or []:
            meta = node.get("metadata", {}) or {}
            status = node.get("status", {}) or {}
            alloc = status.get("allocatable", {}) or {}
            name = meta.get("name") or ""
            if not name:
                continue
            node_alloc[name] = {
                "cpu_m": parse_cpu(alloc.get("cpu")) * 1000.0,
                "memory_b": parse_mem(alloc.get("memory")),
                "disk_b": parse_mem(alloc.get("ephemeral-storage")),
                "pods": int(alloc.get("pods") or 0),
            }

        node_cpu_req = {}
        node_mem_req = {}
        node_disk_req = {}
        node_pod_counts = {}
        pod_cpu_rows = []
        pod_mem_rows = []
        for pod in data.get("pods") or []:
            meta = pod.get("metadata", {}) or {}
            spec = pod.get("spec", {}) or {}
            ns = meta.get("namespace") or ""
            name = meta.get("name") or ""
            node = spec.get("nodeName") or ""
            if node:
                node_pod_counts[node] = node_pod_counts.get(node, 0) + 1

            cpu_m = 0.0
            mem_b = 0.0
            disk_b = 0.0
            for c in (spec.get("containers") or []):
                req = (c.get("resources", {}) or {}).get("requests", {}) or {}
                cpu_m += parse_cpu(req.get("cpu")) * 1000.0
                mem_b += parse_mem(req.get("memory"))
                disk_b += parse_mem(req.get("ephemeral-storage"))

            if node:
                node_cpu_req[node] = node_cpu_req.get(node, 0.0) + cpu_m
                node_mem_req[node] = node_mem_req.get(node, 0.0) + mem_b
                node_disk_req[node] = node_disk_req.get(node, 0.0) + disk_b

            if ns and name and not exclude_re.match(ns):
                pod_cpu_rows.append({"metric": {"namespace": ns, "pod": name}, "value": [0, str(cpu_m / 1000.0)]})
                pod_mem_rows.append({"metric": {"namespace": ns, "pod": name}, "value": [0, str(mem_b)]})

        node_cpu_rows = []
        node_mem_rows = []
        node_disk_rows = []
        node_density_rows = []
        for node_name, alloc in node_alloc.items():
            cpu_pct = round((node_cpu_req.get(node_name, 0.0) / alloc["cpu_m"]) * 100.0, 1) if alloc["cpu_m"] > 0 else 0.0
            mem_pct = round((node_mem_req.get(node_name, 0.0) / alloc["memory_b"]) * 100.0, 1) if alloc["memory_b"] > 0 else 0.0
            disk_pct = round((node_disk_req.get(node_name, 0.0) / alloc["disk_b"]) * 100.0, 1) if alloc["disk_b"] > 0 else 0.0
            density_pct = round((node_pod_counts.get(node_name, 0) / alloc["pods"]) * 100.0, 1) if alloc["pods"] > 0 else 0.0
            node_cpu_rows.append({"metric": {"node": node_name}, "value": [0, str(cpu_pct)]})
            node_mem_rows.append({"metric": {"node": node_name}, "value": [0, str(mem_pct)]})
            node_disk_rows.append({"metric": {"node": node_name}, "value": [0, str(disk_pct)]})
            node_density_rows.append({"metric": {"node": node_name}, "value": [0, str(density_pct)]})

        pod_cpu_rows.sort(key=lambda item: float(item["value"][1]), reverse=True)
        pod_mem_rows.sort(key=lambda item: float(item["value"][1]), reverse=True)

        sample_alert_rules = ((data.get("omc_summary") or {}).get("sample_alert_rules") or [])[:20]
        firing_alerts = [{"metric": {"severity": "warning", "alertname": line, "namespace": "cluster"}, "value": [0, "1"]} for line in sample_alert_rules]

        print(json.dumps({
            "node_cpu_utilization": node_cpu_rows,
            "node_memory_utilization": node_mem_rows,
            "node_disk_utilization": node_disk_rows,
            "kubelet_pod_density": node_density_rows,
            "top_pod_cpu_usage": pod_cpu_rows[:20],
            "top_pod_memory_usage": pod_mem_rows[:20],
            "pod_cpu_usage_all": pod_cpu_rows,
            "pod_memory_usage_all": pod_mem_rows,
            "firing_alerts": firing_alerts,
        }))
        PY
      register: offline_workload_fallback_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove offline workload fallback input file
      ansible.builtin.file:
        path: "{{ offline_workload_fallback_input_file.path }}"
        state: absent
      when: offline_workload_fallback_input_file is defined and (offline_workload_fallback_input_file.path | default('') | length > 0)
      changed_when: false

- name: Normalize offline workload metric fallbacks
  ansible.builtin.set_fact:
    offline_workload_fallback_data: >-
      {{
        offline_workload_fallback_cmd.stdout | from_json
        if (
          offline_workload_fallback_cmd is defined
          and (offline_workload_fallback_cmd.rc | default(1)) == 0
          and (offline_workload_fallback_cmd.stdout | default('') | trim | length > 0)
        )
        else {
          'node_cpu_utilization': [],
          'node_memory_utilization': [],
          'node_disk_utilization': [],
          'kubelet_pod_density': [],
          'top_pod_cpu_usage': [],
          'top_pod_memory_usage': [],
          'pod_cpu_usage_all': [],
          'pod_memory_usage_all': [],
          'firing_alerts': []
        }
      }}
  changed_when: false

- name: Detect vendor-managed telemetry evidence
  block:
    - name: Create vendor-managed telemetry input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-vendor-telemetry-
        suffix: .json
      register: observability_vendor_telemetry_input_file
      changed_when: false

    - name: Write vendor-managed telemetry input data
      ansible.builtin.copy:
        dest: "{{ observability_vendor_telemetry_input_file.path }}"
        mode: "0600"
        content: "{{ {
          'dynakubes': ((analysis_graph.dynakubes | default({})).get('items', [])),
          'edgeconnects': ((analysis_graph.edgeconnects | default({})).get('items', [])),
          'datadogagents': ((analysis_graph.datadogagents | default({})).get('items', [])),
          'clusteragents': ((analysis_graph.clusteragents | default({})).get('items', [])),
          'infravizs': ((analysis_graph.infravizs | default({})).get('items', [])),
          'lokistacks': ((analysis_graph.lokistacks | default({})).get('items', [])),
          'crds': ((analysis_graph.crds | default({})).get('items', [])),
          'namespaces': ((analysis_graph.namespaces | default({})).get('items', [])),
          'pods': ((analysis_graph.pods | default({})).get('items', [])),
          'deployments': ((analysis_graph.deployments | default({})).get('items', [])),
          'daemonsets': ((analysis_graph.daemonsets | default({})).get('items', [])),
          'statefulsets': ((analysis_graph.statefulsets | default({})).get('items', []))
        } | to_json }}"
      changed_when: false

    - name: Run vendor-managed telemetry detection
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/build_vendor_managed_telemetry.py"
          - "{{ observability_vendor_telemetry_input_file.path }}"
      register: observability_vendor_telemetry_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove vendor-managed telemetry input file
      ansible.builtin.file:
        path: "{{ observability_vendor_telemetry_input_file.path }}"
        state: absent
      when: observability_vendor_telemetry_input_file is defined and (observability_vendor_telemetry_input_file.path | default('') | length > 0)
      changed_when: false

- name: Normalize vendor-managed telemetry evidence
  ansible.builtin.set_fact:
    observability_vendor_telemetry_data: "{{ observability_vendor_telemetry_cmd.stdout | from_json if (observability_vendor_telemetry_cmd.rc == 0 and (observability_vendor_telemetry_cmd.stdout | default('') | length > 0)) else {'vendor_managed_metrics_forwarding_present': false, 'vendor_managed_log_forwarding_present': false, 'metrics_vendor_names': [], 'log_vendor_names': []} }}"

- name: Build log forwarding findings
  block:
    - name: Create log forwarding input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-log-forwarding-
        suffix: .json
      register: observability_log_forwarding_input_file
      changed_when: false

    - name: Write log forwarding input data
      ansible.builtin.copy:
        dest: "{{ observability_log_forwarding_input_file.path }}"
        mode: "0600"
        content: "{{ {
          'items': ((analysis_graph.clusterlogforwarders | default({})).get('items', [])),
          'vendor_managed_present': (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)),
          'vendor_names': (observability_vendor_telemetry_data.log_vendor_names | default([])),
          'require_cluster_log_forwarder': (require_cluster_log_forwarder | bool)
        } | to_json }}"
      changed_when: false

    - name: Run log forwarding analysis
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/build_log_forwarding_findings.py"
          - "{{ observability_log_forwarding_input_file.path }}"
      register: observability_log_forwarding_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove log forwarding input file
      ansible.builtin.file:
        path: "{{ observability_log_forwarding_input_file.path }}"
        state: absent
      when: observability_log_forwarding_input_file is defined and (observability_log_forwarding_input_file.path | default('') | length > 0)
      changed_when: false

- name: Normalize log forwarding findings
  ansible.builtin.set_fact:
    observability_log_forwarding_data: "{{ observability_log_forwarding_cmd.stdout | from_json if (observability_log_forwarding_cmd.rc == 0 and (observability_log_forwarding_cmd.stdout | default('') | length > 0)) else {'findings': [], 'outputs': [], 'external_outputs': [], 'pipeline_counts': {'application': 0, 'infrastructure': 0, 'audit': 0}, 'external_pipeline_counts': {'application': 0, 'infrastructure': 0, 'audit': 0}} }}"

- name: Build metrics forwarding findings
  block:
    - name: Create metrics forwarding input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-metrics-forwarding-
        suffix: .json
      register: observability_metrics_forwarding_input_file
      changed_when: false

    - name: Write metrics forwarding input data
      ansible.builtin.copy:
        dest: "{{ observability_metrics_forwarding_input_file.path }}"
        mode: "0600"
        content: "{{ {
          'cluster_remote_write': (((cluster_monitoring_config_parsed.prometheusK8s | default({})).remoteWrite | default([]))),
          'user_remote_write': (((user_workload_monitoring_config_parsed.prometheus | default({})).remoteWrite | default([]))),
          'vendor_managed_present': (observability_vendor_telemetry_data.vendor_managed_metrics_forwarding_present | default(false)),
          'vendor_names': (observability_vendor_telemetry_data.metrics_vendor_names | default([])),
          'require_external_metrics_remote_write': (require_external_metrics_remote_write | bool)
        } | to_json }}"
      changed_when: false

    - name: Run metrics forwarding analysis
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/build_metrics_forwarding_findings.py"
          - "{{ observability_metrics_forwarding_input_file.path }}"
      register: observability_metrics_forwarding_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove metrics forwarding input file
      ansible.builtin.file:
        path: "{{ observability_metrics_forwarding_input_file.path }}"
        state: absent
      when: observability_metrics_forwarding_input_file is defined and (observability_metrics_forwarding_input_file.path | default('') | length > 0)
      changed_when: false

- name: Normalize metrics forwarding findings
  ansible.builtin.set_fact:
    observability_metrics_forwarding_data: "{{ observability_metrics_forwarding_cmd.stdout | from_json if (observability_metrics_forwarding_cmd.rc == 0 and (observability_metrics_forwarding_cmd.stdout | default('') | length > 0)) else {'findings': [], 'cluster_external_count': 0, 'user_external_count': 0} }}"

- name: Build external alert delivery findings
  block:
    - name: Create external alert delivery input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-alert-delivery-
        suffix: .json
      register: observability_alert_delivery_input_file
      changed_when: false

    - name: Write external alert delivery input data
      ansible.builtin.copy:
        dest: "{{ observability_alert_delivery_input_file.path }}"
        mode: "0600"
        content: "{{ {
          'items': ((analysis_graph.alertmanagerconfigs | default({})).get('items', [])),
          'cluster_alertmanager_additional_configs': ((((cluster_monitoring_config_parsed.alertmanagerMain | default({})).additionalAlertmanagerConfigs | default([])))),
          'user_workload_alertmanager_additional_configs': ((((user_workload_monitoring_config_parsed.alertmanager | default({})).additionalAlertmanagerConfigs | default([]))))
        } | to_json }}"
      changed_when: false

    - name: Run external alert delivery analysis
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/build_external_alert_delivery_findings.py"
          - "{{ observability_alert_delivery_input_file.path }}"
      register: observability_alert_delivery_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove external alert delivery input file
      ansible.builtin.file:
        path: "{{ observability_alert_delivery_input_file.path }}"
        state: absent
      when: observability_alert_delivery_input_file is defined and (observability_alert_delivery_input_file.path | default('') | length > 0)
      changed_when: false

- name: Normalize external alert delivery findings
  ansible.builtin.set_fact:
    observability_alert_delivery_data: "{{ observability_alert_delivery_cmd.stdout | from_json if (observability_alert_delivery_cmd.rc == 0 and (observability_alert_delivery_cmd.stdout | default('') | length > 0)) else {'findings': [], 'receivers': [], 'config_sources': [], 'alert_delivery_source_count': 0, 'external_alert_receiver_count': 0, 'external_alert_delivery_configured': false, 'alert_routing_to_external_receiver_configured': false, 'alertmanagerconfigs_with_external_routes': 0, 'alertmanagerconfigs_without_route_receivers': 0} }}"

- name: Build observability findings and summary
  ansible.builtin.set_fact:
    observability_findings: "{{ (observability_log_forwarding_data.findings | default([])) + (observability_metrics_forwarding_data.findings | default([])) + (observability_alert_delivery_data.findings | default([])) + observability_platform_findings }}"
    observability_forwarding_summary: "{{ observability_forwarding_summary | combine(observability_forwarding_updates, recursive=True) }}"
  vars:
    observability_platform_findings: >-
      {{
        ([] +
        ([{'issue': 'monitoring-operator-not-healthy', 'detail': 'monitoring cluster operator is unavailable or degraded'}] if (clusteroperator_status_map.monitoring.available | default('Unknown')) != 'True' or (clusteroperator_status_map.monitoring.degraded | default('False')) == 'True' else []))
      }}
    observability_forwarding_updates:
      vendor_managed_log_forwarding_present: "{{ observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false) }}"
      vendor_managed_metrics_forwarding_present: "{{ observability_vendor_telemetry_data.vendor_managed_metrics_forwarding_present | default(false) }}"
      log_forwarding_vendor_names: "{{ observability_vendor_telemetry_data.log_vendor_names | default([]) }}"
      metrics_forwarding_vendor_names: "{{ observability_vendor_telemetry_data.metrics_vendor_names | default([]) }}"
      log_forwarding_outputs: "{{ observability_log_forwarding_data.outputs | default([]) }}"
      external_log_forwarding_outputs: "{{ observability_log_forwarding_data.external_outputs | default([]) }}"
      application_log_pipeline_count: "{{ (observability_log_forwarding_data.pipeline_counts | default({})).application | default(0) }}"
      infrastructure_log_pipeline_count: "{{ (observability_log_forwarding_data.pipeline_counts | default({})).infrastructure | default(0) }}"
      audit_log_pipeline_count: "{{ (observability_log_forwarding_data.pipeline_counts | default({})).audit | default(0) }}"
      application_logs_collected: "{{ ((((observability_log_forwarding_data.pipeline_counts | default({})).application | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      infrastructure_logs_collected: "{{ ((((observability_log_forwarding_data.pipeline_counts | default({})).infrastructure | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      audit_logs_collected: "{{ ((((observability_log_forwarding_data.pipeline_counts | default({})).audit | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      application_logs_exported_external: "{{ ((((observability_log_forwarding_data.external_pipeline_counts | default({})).application | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      infrastructure_logs_exported_external: "{{ ((((observability_log_forwarding_data.external_pipeline_counts | default({})).infrastructure | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      audit_logs_exported_external: "{{ ((((observability_log_forwarding_data.external_pipeline_counts | default({})).audit | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      application_logs_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((((observability_log_forwarding_data.external_pipeline_counts | default({})).application | default(0)) | int) > 0)
          else (
            'vendor-managed-not-verified'
            if (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false))
            else (
            'cluster-local-only'
            if ((((observability_log_forwarding_data.pipeline_counts | default({})).application | default(0)) | int) > 0)
            else 'not-collected'
            )
          )
        }}
      infrastructure_logs_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((((observability_log_forwarding_data.external_pipeline_counts | default({})).infrastructure | default(0)) | int) > 0)
          else (
            'vendor-managed-not-verified'
            if (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false))
            else (
            'cluster-local-only'
            if ((((observability_log_forwarding_data.pipeline_counts | default({})).infrastructure | default(0)) | int) > 0)
            else 'not-collected'
            )
          )
        }}
      audit_logs_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((((observability_log_forwarding_data.external_pipeline_counts | default({})).audit | default(0)) | int) > 0)
          else (
            'vendor-managed-not-verified'
            if (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false))
            else (
            'cluster-local-only'
            if ((((observability_log_forwarding_data.pipeline_counts | default({})).audit | default(0)) | int) > 0)
            else 'not-collected'
            )
          )
        }}
      logs_delivery_verification_status: >-
        {{
          'not-verified'
          if (((observability_log_forwarding_data.outputs | default([]) | length) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)))
          else 'not-configured'
        }}
      external_alert_receivers: "{{ observability_alert_delivery_data.receivers | default([]) }}"
      alert_delivery_config_sources: "{{ observability_alert_delivery_data.config_sources | default([]) }}"
      alert_delivery_source_count: "{{ observability_alert_delivery_data.alert_delivery_source_count | default(0) }}"
      external_alert_receiver_count: "{{ observability_alert_delivery_data.external_alert_receiver_count | default(0) }}"
      external_alert_delivery_configured: "{{ observability_alert_delivery_data.external_alert_delivery_configured | default(false) }}"
      alert_routing_to_external_receiver_configured: "{{ observability_alert_delivery_data.alert_routing_to_external_receiver_configured | default(false) }}"
      alertmanagerconfigs_with_external_routes: "{{ observability_alert_delivery_data.alertmanagerconfigs_with_external_routes | default(0) }}"
      alertmanagerconfigs_without_route_receivers: "{{ observability_alert_delivery_data.alertmanagerconfigs_without_route_receivers | default(0) }}"
      external_cluster_metrics_remote_write_count: "{{ observability_metrics_forwarding_data.cluster_external_count | default(0) }}"
      external_user_workload_metrics_remote_write_count: "{{ observability_metrics_forwarding_data.user_external_count | default(0) }}"
      alert_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if (
            (observability_alert_delivery_data.external_alert_receiver_count | default(0) | int) > 0
            and (observability_alert_delivery_data.alert_routing_to_external_receiver_configured | default(false))
          )
          else (
            'configuration-present-external-not-proven'
            if ((observability_alert_delivery_data.alert_delivery_source_count | default(0) | int) > 0)
            else 'not-configured'
          )
        }}
      alert_delivery_verification_status: >-
        {{
          'not-verified'
          if ((observability_alert_delivery_data.alert_delivery_source_count | default(0) | int) > 0)
          else 'not-configured'
        }}
      cluster_metrics_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((observability_metrics_forwarding_data.cluster_external_count | default(0) | int) > 0)
          else (
            'vendor-managed-not-verified'
            if (observability_vendor_telemetry_data.vendor_managed_metrics_forwarding_present | default(false))
            else (
            'cluster-local-only'
            if ((observability_forwarding_summary.cluster_metrics_remote_write_count | default(0) | int) > 0)
            else 'not-configured'
            )
          )
        }}
      user_workload_metrics_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((observability_metrics_forwarding_data.user_external_count | default(0) | int) > 0)
          else (
            'vendor-managed-not-verified'
            if (observability_vendor_telemetry_data.vendor_managed_metrics_forwarding_present | default(false))
            else (
            'cluster-local-only'
            if ((observability_forwarding_summary.user_workload_metrics_remote_write_count | default(0) | int) > 0)
            else 'not-configured'
            )
          )
        }}
      metrics_delivery_verification_status: >-
        {{
          'not-verified'
          if (
            (observability_forwarding_summary.cluster_metrics_remote_write_count | default(0) | int) > 0
            or (observability_forwarding_summary.user_workload_metrics_remote_write_count | default(0) | int) > 0
            or (observability_vendor_telemetry_data.vendor_managed_metrics_forwarding_present | default(false))
          )
          else 'not-configured'
        }}

- name: Normalize warning event timestamps
  ansible.builtin.set_fact:
    warning_event_items_unsorted: "{{ warning_event_items_unsorted | default([]) + [item | combine({'_sort_timestamp': ((item.lastTimestamp | default(item.eventTime | default(item.metadata.creationTimestamp | default('')))) | string)})] }}"
  loop: "{{ (analysis_graph.events | default({})).get('items', []) }}"
  changed_when: false

- name: Sort warning events
  ansible.builtin.set_fact:
    warning_event_items: "{{ (warning_event_items_unsorted | default([])) | sort(attribute='_sort_timestamp', reverse=true) | map('combine', {}) | list }}"
    recent_warning_events: "{{ ((warning_event_items_unsorted | default([])) | sort(attribute='_sort_timestamp', reverse=true) | map('combine', {}) | list)[:warning_event_limit] }}"

- name: Create Prometheus query input file
  ansible.builtin.tempfile:
    state: file
    prefix: openshift-prom-query-
    suffix: .json
  register: prom_query_input_file

- name: Write Prometheus query input
  ansible.builtin.copy:
    dest: "{{ prom_query_input_file.path }}"
    mode: "0600"
    content: >-
      {{
        {
          "route_host": (thanos_route_cmd.stdout | default('') | trim),
          "bearer_token": (oc_token_cmd.stdout | default('') | trim),
          "timeout_seconds": 30,
          "queries": [
            {"name": "firing_alerts", "query": prom_queries.firing_alerts},
            {"name": "etcd_wal_fsync", "query": prom_queries.etcd_wal_fsync_p99_ms},
            {"name": "etcd_backend_commit", "query": prom_queries.etcd_backend_commit_p99_ms},
            {"name": "etcd_leader_changes", "query": prom_queries.etcd_leader_changes_5m},
            {"name": "etcd_members_reporting_leader", "query": prom_queries.etcd_members_reporting_leader},
            {"name": "etcd_leader_count", "query": prom_queries.etcd_leader_count},
            {"name": "etcd_peer_rtt", "query": prom_queries.etcd_peer_rtt_p99_ms},
            {"name": "apiserver_latency", "query": prom_queries.apiserver_request_p99_seconds},
            {"name": "apiserver_5xx_rate", "query": prom_queries.apiserver_request_5xx_rate},
            {"name": "apiserver_read_rate", "query": prom_queries.apiserver_request_read_rate},
            {"name": "apiserver_write_rate", "query": prom_queries.apiserver_request_write_rate},
            {"name": "apiserver_read_inflight", "query": prom_queries.apiserver_current_read_inflight},
            {"name": "apiserver_write_inflight", "query": prom_queries.apiserver_current_write_inflight},
            {"name": "apiserver_storage_objects", "query": prom_queries.apiserver_storage_objects_total},
            {"name": "node_cpu_utilization", "query": prom_queries.node_cpu_utilization},
            {"name": "node_memory_utilization", "query": prom_queries.node_memory_utilization},
            {"name": "node_disk_utilization", "query": prom_queries.node_disk_utilization},
            {"name": "kubelet_pod_density", "query": prom_queries.kubelet_pod_density},
            {"name": "top_pod_cpu_usage", "query": prom_queries.top_pod_cpu_usage},
            {"name": "top_pod_memory_usage", "query": prom_queries.top_pod_memory_usage},
            {"name": "pod_cpu_usage_all", "query": prom_queries.pod_cpu_usage_all},
            {"name": "pod_memory_usage_all", "query": prom_queries.pod_memory_usage_all},
            {"name": "controlplane_to_worker_network_latency", "query": prom_queries.controlplane_to_worker_network_latency_ms | default('')},
            {"name": "worker_to_worker_network_latency", "query": prom_queries.worker_to_worker_network_latency_ms | default('')}
          ]
        } | to_json
      }}

- name: Run Prometheus signal helper
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/query_prometheus_signals.py"
      - "{{ prom_query_input_file.path }}"
  register: prom_query_helper_cmd
  changed_when: false
  failed_when: false

- name: Remove Prometheus query input file
  ansible.builtin.file:
    path: "{{ prom_query_input_file.path }}"
    state: absent
  when: prom_query_input_file is defined and (prom_query_input_file.path | default('') | length > 0)
  changed_when: false

- name: Normalize Prometheus helper output
  ansible.builtin.set_fact:
    prom_query_helper_data: "{{ prom_query_helper_cmd.stdout | from_json if (prom_query_helper_cmd.rc == 0 and (prom_query_helper_cmd.stdout | default('') | length > 0)) else {'prom_available': false, 'transport': 'unavailable', 'route_working': false, 'proxy_working': false, 'route_error': '', 'proxy_error': '', 'results': {}, 'query_errors': {}, 'query_statuses': {}} }}"
    prom_available: "{{ ((prom_query_helper_cmd.stdout | from_json).prom_available) if (prom_query_helper_cmd.rc == 0 and (prom_query_helper_cmd.stdout | default('') | length > 0)) else false }}"
    prom_result_map: "{{ ((prom_query_helper_cmd.stdout | from_json).results) if (prom_query_helper_cmd.rc == 0 and (prom_query_helper_cmd.stdout | default('') | length > 0)) else {} }}"
    prom_query_error_map: "{{ ((prom_query_helper_cmd.stdout | from_json).query_errors) if (prom_query_helper_cmd.rc == 0 and (prom_query_helper_cmd.stdout | default('') | length > 0)) else {} }}"
    prom_query_status_map: "{{ ((prom_query_helper_cmd.stdout | from_json).query_statuses) if (prom_query_helper_cmd.rc == 0 and (prom_query_helper_cmd.stdout | default('') | length > 0)) else {} }}"
    prom_collection_transport: "{{ ((prom_query_helper_cmd.stdout | from_json).transport) if (prom_query_helper_cmd.rc == 0 and (prom_query_helper_cmd.stdout | default('') | length > 0)) else 'unavailable' }}"

- name: Build Prometheus evidence summary
  ansible.builtin.set_fact:
    prometheus_evidence_summary:
      applicable: "{{ (report_mode_resolved | default('live')) == 'live' }}"
      collected: "{{ prom_available | default(false) | bool }}"
      status: "{{ 'collected' if (prom_available | default(false) | bool) else 'unavailable' }}"
      transport: "{{ prom_collection_transport | default('unavailable') }}"
      route_working: "{{ prom_query_helper_data.route_working | default(false) }}"
      proxy_working: "{{ prom_query_helper_data.proxy_working | default(false) }}"
      query_count: "{{ prom_result_map | default({}) | length }}"
      non_empty_result_count: "{{ (prom_result_map | default({}) | dict2items | rejectattr('value', 'equalto', []) | list | length) }}"
      source: "openshift-monitoring/thanos-querier"
      collection_method: "{{ 'route' if (prom_collection_transport | default('unavailable')) == 'route' else ('oc get --raw service proxy' if (prom_collection_transport | default('unavailable')) == 'oc-proxy' else 'not-collected') }}"
      source_order_note: "Prometheus/Thanos is one of the official cluster data sources and is used where time-series metrics improve accuracy; object and configuration evidence still follows must-gather, inspect, oc get, then insights."
      metric_scopes:
        - alerting
        - api-server
        - etcd
        - node-utilization
        - pod-usage
        - pod-density
        - optional-network-latency
      route_error: "{{ prom_query_helper_data.route_error | default('') }}"
      proxy_error: "{{ prom_query_helper_data.proxy_error | default('') }}"
      query_errors: "{{ prom_query_error_map | default({}) }}"
      query_statuses: "{{ prom_query_status_map | default({}) }}"

- name: Derive offline control-plane fallback summaries
  vars:
    cp_summary: "{{ (control_plane_evidence_data | default({})).get('summary', {}) }}"
    kube_apiserver_operator: "{{ (clusteroperator_status_map | default({})).get('kube-apiserver', {}) }}"
    kube_apiserver_healthy: "{{ (kube_apiserver_operator.get('available', 'Unknown') == 'True') and (kube_apiserver_operator.get('degraded', 'False') != 'True') }}"
    live_support_parsed: "{{ (live_support_data | default({})).get('parsed', {}) }}"
    sosreport_summary: "{{ (live_support_parsed.sosreport | default(sosreport_data | default({}))).get('summary', {}) }}"
    sosreport_node_names: "{{ sosreport_summary.node_names | default([]) }}"
    control_plane_node_names: >-
      {%- set nodes = [] -%}
      {%- for node in ((analysis_graph.nodes | default({'items': []})).get('items', [])) -%}
        {%- set labels = node.metadata.labels | default({}) -%}
        {%- set name = node.metadata.name | default('') -%}
        {%- if name and ('node-role.kubernetes.io/master' in labels or 'node-role.kubernetes.io/control-plane' in labels) -%}
          {%- set _ = nodes.append(name) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ nodes | unique }}
    worker_node_names: >-
      {%- set nodes = [] -%}
      {%- for node in ((analysis_graph.nodes | default({'items': []})).get('items', [])) -%}
        {%- set labels = node.metadata.labels | default({}) -%}
        {%- set name = node.metadata.name | default('') -%}
        {%- if name and ('node-role.kubernetes.io/worker' in labels) -%}
          {%- set _ = nodes.append(name) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ nodes | unique }}
    sosreport_control_plane_nodes: "{{ sosreport_node_names | intersect(control_plane_node_names) }}"
    sosreport_worker_nodes: "{{ sosreport_node_names | intersect(worker_node_names) }}"
    controlplane_to_worker_network_text: >-
      {{
        (
          'network diagnostics present on control plane nodes '
          ~ ((sosreport_control_plane_nodes | length) | string)
          ~ '/'
          ~ ((control_plane_node_names | length) | string)
          ~ ' and worker nodes '
          ~ ((sosreport_worker_nodes | length) | string)
          ~ '/'
          ~ ((worker_node_names | length) | string)
          ~ '; measured control-plane-to-worker RTT was not available in this run'
        )
        if ((sosreport_control_plane_nodes | length) > 0 or (sosreport_worker_nodes | length) > 0)
        else ''
      }}
    worker_to_worker_network_text: >-
      {{
        (
          'network diagnostics present on worker nodes '
          ~ ((sosreport_worker_nodes | length) | string)
          ~ '/'
          ~ ((worker_node_names | length) | string)
          ~ '; measured worker-to-worker RTT was not available in this run'
        )
        if ((sosreport_worker_nodes | length) > 0)
        else ''
      }}
    offline_readyz_status: >-
      {{
        'failed'
        if ((cp_summary.apiserver_readyz_failed_checks | default(0) | int) > 0)
        else (
          'ok'
          if (
            kube_apiserver_healthy
            or (cp_summary.apiserver_termination_logs_present | default(false))
          )
          else 'not-collected'
        )
      }}
  ansible.builtin.set_fact:
    control_plane_offline_signals_present: >-
      {{
        (cp_summary.present | default(false))
        and (
          (cp_summary.object_count_present | default(false))
          or (cp_summary.endpoint_status_present | default(false))
          or (cp_summary.endpoint_health_present | default(false))
          or (cp_summary.apiserver_termination_logs_present | default(false))
        )
      }}
    control_plane_query_status_map_offline:
      apiserver_storage_objects: "{{ 'collected' if (cp_summary.object_count_present | default(false)) else 'not-collected' }}"
      apiserver_read_rate: not-collected
      apiserver_write_rate: not-collected
      apiserver_read_inflight: not-collected
      apiserver_write_inflight: not-collected
      apiserver_5xx_rate: not-collected
      apiserver_latency: not-collected
      etcd_members_reporting_leader: "{{ 'collected' if (cp_summary.endpoint_status_present | default(false)) else 'not-collected' }}"
      etcd_leader_count: "{{ 'collected' if (cp_summary.endpoint_status_present | default(false)) else 'not-collected' }}"
      etcd_wal_fsync: not-collected
      etcd_backend_commit: not-collected
      etcd_leader_changes: not-collected
      etcd_peer_rtt: not-collected
      controlplane_to_worker_network_latency: "{{ 'derived' if ((sosreport_control_plane_nodes | length) > 0 or (sosreport_worker_nodes | length) > 0) else 'not-configured' }}"
      worker_to_worker_network_latency: "{{ 'derived' if ((sosreport_worker_nodes | length) > 0) else 'not-configured' }}"
    apiserver_readyz_status_offline: "{{ offline_readyz_status }}"
    apiserver_readyz_failed_checks_offline: "{{ cp_summary.apiserver_readyz_failed_checks | default(0) }}"
    apiserver_storage_objects_total_offline: "{{ cp_summary.apiserver_storage_objects_total if (cp_summary.object_count_present | default(false)) else '' }}"
    etcd_members_reporting_leader_offline: "{{ cp_summary.etcd_members_reporting_leader if (cp_summary.endpoint_status_present | default(false)) else '' }}"
    etcd_leader_count_offline: "{{ cp_summary.etcd_leader_count if (cp_summary.endpoint_status_present | default(false)) else '' }}"
    controlplane_to_worker_network_latency_offline: "{{ controlplane_to_worker_network_text }}"
    worker_to_worker_network_latency_offline: "{{ worker_to_worker_network_text }}"
    controlplane_to_worker_network_latency_offline_meta:
      evidence_type: qualitative-node-network-diagnostics
      control_plane_nodes_covered: "{{ sosreport_control_plane_nodes | default([]) }}"
      worker_nodes_covered: "{{ sosreport_worker_nodes | default([]) }}"
      control_plane_coverage_count: "{{ sosreport_control_plane_nodes | length }}"
      worker_coverage_count: "{{ sosreport_worker_nodes | length }}"
      control_plane_total_count: "{{ control_plane_node_names | length }}"
      worker_total_count: "{{ worker_node_names | length }}"
    worker_to_worker_network_latency_offline_meta:
      evidence_type: qualitative-node-network-diagnostics
      worker_nodes_covered: "{{ sosreport_worker_nodes | default([]) }}"
      worker_coverage_count: "{{ sosreport_worker_nodes | length }}"
      worker_total_count: "{{ worker_node_names | length }}"
  changed_when: false

- name: Record Prometheus query availability finding
  ansible.builtin.set_fact:
    observability_findings: "{{ (observability_findings | default([])) + [{'issue': 'prometheus-query-endpoint-unavailable', 'detail': prom_query_error_detail}] }}"
  vars:
    prom_query_error_detail: >-
      {{
        'neither thanos route nor API proxy query path was usable'
        ~ (
          '; route=' ~ (prom_query_helper_data.route_error | default('n/a'))
          if (prom_query_helper_data.route_error | default('') | length) > 0
          else ''
        )
        ~ (
          '; proxy=' ~ (prom_query_helper_data.proxy_error | default('n/a'))
          if (prom_query_helper_data.proxy_error | default('') | length) > 0
          else ''
        )
      }}
  when: not (prom_available | default(false) | bool)

- name: Build resolved runtime signal map for node and pod families
  vars:
    capability_profile_data: "{{ openshift_report_capability_profile | default({}) }}"
    prometheus_profile_capabilities: >-
      {%- set keys = [] -%}
      {%- for item in (capability_profile_data | dict2items) -%}
        {%- set value = item.value if item.value is mapping else {} -%}
        {%- set evidence = value.get('evidence_required', []) -%}
        {%- set expected = (value.get('expected_state', 'present') | string | lower) -%}
        {%- if ('prometheus' in evidence) and expected != 'not_applicable' -%}
          {%- set _ = keys.append(item.key) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ keys }}
    runtime_signal_specs:
      - name: node_cpu_utilization
        offline_method: request-based-node-cpu-pressure
        units: percent
        approximation: true
      - name: node_memory_utilization
        offline_method: request-based-node-memory-pressure
        units: percent
        approximation: true
      - name: node_disk_utilization
        offline_method: request-based-node-ephemeral-storage-pressure
        units: percent
        approximation: true
      - name: kubelet_pod_density
        offline_method: object-derived-pod-density
        units: percent
        approximation: false
      - name: top_pod_cpu_usage
        offline_method: request-based-pod-cpu
        units: cores
        approximation: true
      - name: top_pod_memory_usage
        offline_method: request-based-pod-memory
        units: bytes
        approximation: true
      - name: pod_cpu_usage_all
        offline_method: request-based-pod-cpu
        units: cores
        approximation: true
      - name: pod_memory_usage_all
        offline_method: request-based-pod-memory
        units: bytes
        approximation: true
  ansible.builtin.set_fact:
    runtime_signal_resolution_map: >-
      {%- set resolved = {} -%}
      {%- set prom_results = prom_result_map | default({}) -%}
      {%- set prom_statuses = prom_query_status_map | default({}) -%}
      {%- set offline_results = offline_workload_fallback_data | default({}) -%}
      {%- set cap_data = capability_profile_data | default({}) -%}
      {%- set prom_caps = prometheus_profile_capabilities | default([]) -%}
      {%- for spec in runtime_signal_specs -%}
        {%- set name = spec.name -%}
        {%- set prom_rows = prom_results.get(name, []) -%}
        {%- set offline_rows = offline_results.get(name, []) -%}
        {%- set prom_has_rows = prom_rows is sequence and prom_rows is not string and prom_rows is not mapping and (prom_rows | length > 0) -%}
        {%- set offline_has_rows = offline_rows is sequence and offline_rows is not string and offline_rows is not mapping and (offline_rows | length > 0) -%}
        {%- set prom_status = prom_statuses.get(name, 'not-collected') -%}
        {%- set related_caps = [] -%}
        {%- if name in ['top_pod_cpu_usage', 'top_pod_memory_usage', 'pod_cpu_usage_all', 'pod_memory_usage_all'] and (cap_data.get('user_workload_metrics_monitoring') is mapping) -%}
          {%- set _ = related_caps.append('user_workload_metrics_monitoring') -%}
        {%- endif -%}
        {%- if name in ['node_cpu_utilization', 'node_memory_utilization', 'node_disk_utilization', 'kubelet_pod_density'] and (cap_data.get('persistent_monitoring_storage') is mapping) -%}
          {%- set _ = related_caps.append('persistent_monitoring_storage') -%}
        {%- endif -%}
        {%- for cap_name in prom_caps -%}
          {%- if cap_name not in related_caps -%}
            {%- set _ = related_caps.append(cap_name) -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set expected_live = false -%}
        {%- for cap_name in related_caps -%}
          {%- set cap_value = cap_data.get(cap_name, {}) if (cap_data.get(cap_name) is mapping) else {} -%}
          {%- set evidence = cap_value.get('evidence_required', []) -%}
          {%- set expected_state = (cap_value.get('expected_state', 'present') | string | lower) -%}
          {%- if ('prometheus' in evidence) and expected_state != 'not_applicable' and (cap_value.get('required', false) or expected_state in ['configured', 'healthy', 'present']) -%}
            {%- set expected_live = true -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if prom_has_rows -%}
          {%- set entry = {
            'value': prom_rows,
            'status': 'observed',
            'source': 'prometheus',
            'method': 'prometheus-query',
            'confidence': 'high',
            'is_approximation': false,
            'units': spec.units,
            'collected_from': 'openshift-monitoring/thanos-querier',
            'reason': '',
            'capability_profile_related_capabilities': related_caps,
            'capability_profile_expected_live': expected_live
          } -%}
        {%- elif offline_has_rows -%}
          {%- set entry = {
            'value': offline_rows,
            'status': 'derived',
            'source': 'cluster-object',
            'method': spec.offline_method,
            'confidence': ('low' if (spec.approximation and expected_live) else ('medium' if spec.approximation else 'high')),
            'is_approximation': spec.approximation,
            'units': spec.units,
            'collected_from': 'analysis_graph nodes/pods inventory',
            'reason': (
              'offline-fallback-used-live-metrics-expected-by-capability-profile'
              if expected_live
              else (('prometheus-' ~ prom_status) if prom_status not in ['not-collected', 'not-configured'] else 'offline-fallback-used')
            ),
            'capability_profile_related_capabilities': related_caps,
            'capability_profile_expected_live': expected_live
          } -%}
        {%- else -%}
          {%- set entry = {
            'value': [],
            'status': prom_status,
            'source': ('prometheus' if prom_status in ['no-data', 'query-failed'] else 'unavailable'),
            'method': ('prometheus-query' if prom_status in ['no-data', 'query-failed'] else 'not-collected'),
            'confidence': 'low',
            'is_approximation': false,
            'units': spec.units,
            'collected_from': '',
            'reason': prom_status,
            'capability_profile_related_capabilities': related_caps,
            'capability_profile_expected_live': expected_live
          } -%}
        {%- endif -%}
        {%- set _ = resolved.update({name: entry}) -%}
      {%- endfor -%}
      {{ resolved }}
  changed_when: false

