            - name: Persist shared collection and analysis artifacts for resumed live run
              ansible.builtin.include_role:
                name: report_common
                tasks_from: persist_openshift_shared_artifacts.yml
            - name: Save resumed live analysis checkpoint
              ansible.builtin.include_role:
                name: report_common
                tasks_from: save_run_checkpoint.yml
              vars:
                run_checkpoint_stage: analysis
                run_checkpoint_resume_next_stage: report
                run_checkpoint_status: completed
                run_checkpoint_write_snapshot: false
            - name: Build live OpenShift report
              ansible.builtin.include_role:
                name: report_openshift
        - name: Resume live report stage only
          when: (report_resume_manifest.resume_next_stage | default('')) == 'report'
          ansible.builtin.include_role:
            name: report_openshift
        - name: Mark resumed live run checkpoint as completed
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: render
            run_checkpoint_resume_next_stage: ""
            run_checkpoint_status: completed
            run_checkpoint_write_snapshot: false
      rescue:
        - name: Record failed resumed live run checkpoint
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: "{{ report_resume_manifest.resume_next_stage or 'report' }}"
            run_checkpoint_resume_next_stage: "{{ report_resume_manifest.resume_next_stage or 'report' }}"
            run_checkpoint_status: failed
            run_checkpoint_failed_task: "{{ ansible_failed_task.name | default('unknown-task') }}"
            run_checkpoint_failed_message: >-
              {{
                'Task failed during resumed live analysis or render stage. '
                ~ 'rc=' ~ ((ansible_failed_result.rc | default('unknown')) | string)
                ~ ', changed=' ~ ((ansible_failed_result.changed | default(false)) | string)
                ~ ', stderr_lines=' ~ (((ansible_failed_result.stderr_lines | default([])) | length) | string)
                ~ ', stdout_lines=' ~ (((ansible_failed_result.stdout_lines | default([])) | length) | string)
              }}
            run_checkpoint_write_snapshot: false
        - name: Re-raise resumed live workflow failure
          ansible.builtin.fail:
            msg: >-
              Resumed live OpenShift workflow failed again in task
              '{{ ansible_failed_task.name | default("unknown-task") }}'.
              {{
                'Raw failure output was omitted from the rescue message because collected cluster data can contain literal template markers. '
                ~ 'rc=' ~ ((ansible_failed_result.rc | default('unknown')) | string)
                ~ ', changed=' ~ ((ansible_failed_result.changed | default(false)) | string)
              }}
              Fix the reported issue and rerun with report_run_mode=resume_last_failure or use report_run_mode=fresh for a clean restart.

