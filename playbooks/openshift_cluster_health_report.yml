---
- name: Generate an OpenShift cluster health report
  hosts: local
  gather_facts: true
  vars:
    platform_family: openshift
    provider_family: generic
    cluster_profile_mode: production
    kube_cli: oc
    report_mode: auto
    report_output_dir: "{{ playbook_dir }}/../reports"
    report_basename: "cluster-report"
    report_generate_html: true
    report_generate_pdf: true
    collection_parallelism: 8
    collection_command_timeout_seconds: 300
    keep_collection_artifacts: false
    warning_event_limit: 20
    top_restart_pod_limit: 15
    top_alert_group_limit: 15
    top_event_reason_limit: 15
    top_namespace_issue_limit: 15
    top_pvc_issue_limit: 20
    top_workload_issue_limit: 25
    top_security_issue_limit: 25
    top_certificate_issue_limit: 20
    require_cluster_log_forwarder: false
    require_external_metrics_remote_write: false
    warn_on_ingress_without_class: false
    openshift_report_capability_profile:
      gitops:
        required: true
        criticality: high
        expected_state: present
        owner: operations
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Declarative operations are expected for most production OpenShift environments."
      pipelines:
        required: false
        criticality: medium
        expected_state: present
        owner: delivery
        evidence_required: [must-gather, oc-get]
        notes: "Show when OpenShift Pipelines or PipelineRuns exist, have findings, or the customer requires cluster-hosted pipeline execution."
      cicd_runners:
        required: false
        criticality: medium
        expected_state: present
        owner: delivery
        evidence_required: [must-gather, oc-get, prometheus]
        notes: "Show only when runner pods are detected, have findings, or the customer hosts CI/CD runners on the cluster."
      backup:
        required: true
        criticality: critical
        expected_state: healthy
        owner: operations
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Production clusters should have backup schedules plus successful backup and restore evidence."
      logging:
        required: true
        criticality: high
        expected_state: configured
        owner: observability
        evidence_required: [must-gather, oc-get]
        notes: "Application, infrastructure, and audit log collection or forwarding should be intentionally configured."
      external_metrics:
        required: false
        criticality: medium
        expected_state: configured
        owner: observability
        evidence_required: [must-gather, oc-get, prometheus]
        notes: "Require this when the customer expects metric export to an external observability platform."
      external_alerting:
        required: true
        criticality: high
        expected_state: configured
        owner: observability
        evidence_required: [must-gather, oc-get]
        notes: "Production alerts should route to an accountable external receiver or operations process."
      user_workload_monitoring:
        required: true
        criticality: high
        expected_state: configured
        owner: observability
        evidence_required: [must-gather, oc-get]
        notes: "Most production clusters need user workload metrics enabled or an approved alternate monitoring path."
      grafana_dashboards:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [must-gather, oc-get]
        notes: "Require when in-cluster Grafana dashboards are expected for platform or application metrics."
      monitoring_persistence:
        required: true
        criticality: high
        expected_state: configured
        owner: observability
        evidence_required: [must-gather, oc-get]
        notes: "Persistent Prometheus and Alertmanager storage is expected for production monitoring continuity."
      oauth_identity_provider:
        required: true
        criticality: high
        expected_state: configured
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Production OpenShift clusters should have at least one configured OAuth identity provider."
      compliance:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [must-gather, oc-get, insights]
        notes: "Require when the customer has formal compliance scanning obligations."
      acs:
        required: false
        criticality: high
        expected_state: present
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when Advanced Cluster Security is part of the customer security baseline."
      workload_vulnerability_scanner:
        required: false
        criticality: high
        expected_state: present
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when workload image vulnerability scanning or secured-cluster scanner agents are part of the security baseline."
      cert_manager:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when certificate lifecycle automation is expected on-cluster."
      cost_management:
        required: false
        criticality: low
        expected_state: present
        owner: operations
        evidence_required: [must-gather, oc-get]
        notes: "Require when chargeback, showback, or cost allocation is part of the operating model."
      acm:
        required: false
        criticality: medium
        expected_state: present
        owner: operations
        evidence_required: [must-gather, oc-get]
        notes: "Require when the cluster should be managed by ACM or a fleet-management hub."
      odf:
        required: false
        criticality: high
        expected_state: healthy
        owner: storage
        evidence_required: [must-gather, oc-get]
        notes: "Show when ODF resources exist, have findings, or ODF is required by the customer profile."
      virtualization:
        required: false
        criticality: high
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Show when OpenShift Virtualization resources exist, have findings, or are required."
      ai:
        required: false
        criticality: medium
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Show when AI or model-serving resources exist, have findings, or are required."
      external_secrets:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when secrets are expected to be synchronized from an external secret manager."
      cluster_autoscaler:
        required: false
        criticality: medium
        expected_state: present
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Require when machine API scaling is expected for workload elasticity."
      machine_health_checks:
        required: true
        criticality: high
        expected_state: present
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Worker auto-remediation is expected for most production machine-API clusters."
      image_registry_governance:
        required: true
        criticality: medium
        expected_state: configured
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Image registry exposure, pruning, and policy should be intentional."
      disconnected_installation:
        required: false
        criticality: critical
        expected_state: configured
        owner: platform
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Require for restricted-network clusters."
      private_registry_mirrors:
        required: false
        criticality: high
        expected_state: configured
        owner: platform
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Require when release and workload image pulls should use internal mirrors."
      external_private_registry:
        required: false
        criticality: medium
        expected_state: configured
        owner: delivery
        evidence_required: [must-gather, oc-get]
        notes: "Require when application workloads are expected to pull images from an external private registry."
      proxy_configuration:
        required: false
        criticality: high
        expected_state: configured
        owner: network
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Require when outbound traffic must traverse a corporate proxy."
      custom_ca_trust:
        required: false
        criticality: high
        expected_state: configured
        owner: security
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Require when internal registries, proxies, or endpoints use private trust roots."
      ipsec_enabled:
        required: false
        criticality: high
        expected_state: configured
        owner: network
        evidence_required: [must-gather, oc-get]
        notes: "Require when the customer expects OVN-Kubernetes IPsec encryption for pod-to-pod or external traffic."
      etcd_encryption_enabled:
        required: true
        criticality: high
        expected_state: configured
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when OpenShift API resources stored in etcd must be encrypted at rest."
      encryption_at_rest:
        required: true
        criticality: high
        expected_state: configured
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Production clusters should have an explicit data-at-rest encryption posture."
      audit_log_forwarding:
        required: true
        criticality: high
        expected_state: configured
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Audit logs should be retained or forwarded according to the customer compliance baseline."
      network_policy_baseline:
        required: true
        criticality: medium
        expected_state: configured
        owner: network
        evidence_required: [must-gather, oc-get]
        notes: "Multi-tenant production clusters should define namespace isolation expectations."
      egress_controls:
        required: false
        criticality: medium
        expected_state: configured
        owner: network
        evidence_required: [must-gather, oc-get]
        notes: "Require when outbound network paths are governed."
      quota_governance:
        required: true
        criticality: medium
        expected_state: configured
        owner: operations
        evidence_required: [must-gather, oc-get]
        notes: "Shared clusters should use quotas or documented exceptions for tenant namespaces."
      multi_tenancy_governance:
        required: true
        criticality: medium
        expected_state: configured
        owner: operations
        evidence_required: [must-gather, oc-get]
        notes: "Shared clusters should have namespace onboarding, RBAC, quota, and isolation guardrails."
      service_mesh:
        required: false
        criticality: medium
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Show when service mesh resources exist, have findings, or are required."
      serverless:
        required: false
        criticality: medium
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Show when OpenShift Serverless resources exist, have findings, or are required."
      windows_containers:
        required: false
        criticality: medium
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Show when Windows workloads or MachineSets exist, have findings, or are required."
      gpu_acceleration:
        required: false
        criticality: medium
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get, prometheus]
        notes: "Show when GPU nodes/operators/workloads exist, have findings, or are required."
      sandboxed_containers:
        required: false
        criticality: medium
        expected_state: healthy
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Show when sandboxed containers are installed, have findings, or are required."
      node_tuning:
        required: false
        criticality: medium
        expected_state: configured
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Require when node performance or custom kernel/runtime tuning is part of the baseline."
      nmstate_networking:
        required: false
        criticality: medium
        expected_state: configured
        owner: network
        evidence_required: [must-gather, oc-get]
        notes: "Require when node network configuration is managed through NMState."
      descheduler:
        required: false
        criticality: low
        expected_state: present
        owner: operations
        evidence_required: [must-gather, oc-get]
        notes: "Require when workload rebalancing is part of the operations model."
      disaster_recovery_secondary_site:
        required: false
        criticality: critical
        expected_state: configured
        owner: operations
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Require when the customer expects cross-site disaster recovery."
    evidence_mode: auto
    collect_live_support_artifacts: true
    live_support_collection_profile: all
    live_support_artifact_output_dir: ""
    live_support_artifact_parallelism: 3
    live_support_artifact_timeout_seconds: 1800
    collect_live_must_gather: false
    collect_live_inspect: false
    collect_live_cluster_compare: false
    collect_live_managed_gates: false
    collect_live_advisor_export: false
    collect_live_insights_archive: false
    collect_live_sosreport: true
    live_support_sosreport_nodes: []
    live_support_sosreport_node_selector: ""
    live_support_sosreport_node_limit: 3
    live_support_sosreport_args:
      - "-k"
      - "crio.all=on"
      - "-k"
      - "crio.logs=on"
      - "-k"
      - "podman.all=on"
      - "-k"
      - "podman.logs=on"
    live_support_cluster_compare_command_argv: []
    live_support_managed_gates_command_argv: []
    live_support_advisor_export_command_argv: []
    live_support_sosreport_command_argv: []
    case_bundle_path: ""
    must_gather_path: ""
    cluster_compare_path: ""
    managed_gates_path: ""
    inspect_path: ""
    sosreport_paths: []
    advisor_export_path: ""
    write_redaction_manifest: false
    redaction_manifest_path: ""
    write_redacted_bundle: false
    redacted_bundle_output_dir: ""
    platform_namespaces_regex: "^(default|openshift|openshift-.*|kube-system|kube-public|kube-node-lease|kube-.*|kubernetes-.*)$"
    user_namespaces_exclude_regex: "^(default|openshift|openshift-.*|kube-system|kube-public|kube-node-lease|kube-.*|kubernetes-.*)$"
    etcd_wal_fsync_p99_warn_ms: 10
    etcd_peer_rtt_p99_warn_ms: 50
    controlplane_to_worker_latency_warn_ms: 20
    worker_to_worker_latency_warn_ms: 20
    apiserver_latency_p99_warn_seconds: 1
    pod_density_warn_pct: 80
    pod_density_critical_pct: 90
    certificate_expiry_warn_days: 30
    certificate_expiry_critical_days: 7
    prom_queries:
      firing_alerts: 'ALERTS{alertstate="firing"}'
      etcd_wal_fsync_p99_ms: 'histogram_quantile(0.99, sum by (le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))) * 1000'
      etcd_backend_commit_p99_ms: 'histogram_quantile(0.99, sum by (le) (rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))) * 1000'
      etcd_leader_changes_5m: 'sum(increase(etcd_server_leader_changes_seen_total[5m]))'
      etcd_members_reporting_leader: 'sum(etcd_server_has_leader)'
      etcd_leader_count: 'sum(etcd_server_is_leader)'
      etcd_peer_rtt_p99_ms: 'histogram_quantile(0.99, sum by (le) (rate(etcd_network_peer_round_trip_time_seconds_bucket[5m]))) * 1000'
      controlplane_to_worker_network_latency_ms: ''
      worker_to_worker_network_latency_ms: ''
      apiserver_request_p99_seconds: 'histogram_quantile(0.99, sum by (le) (rate(apiserver_request_duration_seconds_bucket{verb!~"WATCH|LIST"}[5m])))'
      apiserver_request_5xx_rate: 'sum(rate(apiserver_request_total{code=~"5.."}[5m]))'
      apiserver_request_read_rate: 'sum(rate(apiserver_request_total{verb=~"GET|LIST|WATCH"}[5m]))'
      apiserver_request_write_rate: 'sum(rate(apiserver_request_total{verb!~"GET|LIST|WATCH"}[5m]))'
      apiserver_current_read_inflight: 'sum(apiserver_current_inflight_requests{request_kind="read"})'
      apiserver_current_write_inflight: 'sum(apiserver_current_inflight_requests{request_kind="mutating"})'
      apiserver_storage_objects_total: 'sum(apiserver_storage_objects)'
      node_cpu_utilization: '100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))'
      node_memory_utilization: '100 * (1 - ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100) / 100)'
      node_disk_utilization: 'max by (instance) (100 * (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|nsfs|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|nsfs|squashfs"})))'
      kubelet_pod_density: '100 * (sum by (node) (kubelet_running_pods) / sum by (node) (kube_node_status_allocatable{resource="pods"}))'
      top_pod_cpu_usage: 'topk(20, sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!="",pod!="",namespace!~"openshift-.*"}[5m])))'
      top_pod_memory_usage: 'topk(20, sum by (namespace,pod) (container_memory_working_set_bytes{container!="",pod!="",namespace!~"openshift-.*"}))'
      pod_cpu_usage_all: 'sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!="",pod!="",namespace!~"openshift-.*"}[5m]))'
      pod_memory_usage_all: 'sum by (namespace,pod) (container_memory_working_set_bytes{container!="",pod!="",namespace!~"openshift-.*"})'
  tasks:
    - name: Resolve unified OpenShift report mode
      ansible.builtin.set_fact:
        report_mode_resolved: >-
          {{
            ('collected' if report_mode == 'offline' else report_mode)
            if (report_mode | default('auto')) != 'auto'
            else (
              'collected'
              if (
                (case_bundle_path | default('') | trim | length > 0)
                or (must_gather_path | default('') | trim | length > 0)
                or (inspect_path | default('') | trim | length > 0)
                or (cluster_compare_path | default('') | trim | length > 0)
                or (managed_gates_path | default('') | trim | length > 0)
                or (advisor_export_path | default('') | trim | length > 0)
                or ((sosreport_paths | default([])) | length > 0)
              )
              else 'live'
            )
          }}

    - name: Validate unified OpenShift report mode
      ansible.builtin.assert:
        that:
          - report_mode_resolved in ['live', 'collected']
        fail_msg: "Set report_mode to auto, live, collected, or offline."

    - name: Run live OpenShift health workflow
      when: report_mode_resolved == 'live'
      block:
        - name: Run preflight checks
          ansible.builtin.include_role:
            name: preflight_common

        - name: Run OpenShift preflight checks
          ansible.builtin.include_role:
            name: preflight_openshift

        - name: Collect common cluster data
          ansible.builtin.include_role:
            name: collect_common

        - name: Collect OpenShift cluster data
          ansible.builtin.include_role:
            name: collect_openshift

        - name: Build preliminary OpenShift analysis graph
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: build_analysis_graph.yml

        - name: Project preliminary OpenShift analysis graph
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: project_analysis_graph.yml

        - name: Run preliminary core analysis for node debug targets
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: core.yml

        - name: Derive targeted node debug candidates
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: node_debug_targets.yml

        - name: Collect live support artifacts
          ansible.builtin.include_role:
            name: collect_live_support_evidence

        - name: Run common analysis
          ansible.builtin.include_role:
            name: analyze_common

        - name: Analyze OpenShift-specific data
          ansible.builtin.include_role:
            name: analyze_openshift

        - name: Build live OpenShift report
          ansible.builtin.include_role:
            name: report_openshift
      always:
        - name: Ensure temporary collection artifacts are removed
          ansible.builtin.file:
            path: "{{ collection_run_metadata.results_path | dirname }}"
            state: absent
          when:
            - report_mode_resolved == 'live'
            - not (keep_collection_artifacts | bool)
            - collection_run_metadata is defined
            - collection_run_metadata.results_path | default('') | length > 0
          failed_when: false

    - name: Run collected-state OpenShift evidence workflow
      when: report_mode_resolved == 'collected'
      block:
        - name: Load common evidence
          ansible.builtin.include_role:
            name: load_evidence_common

        - name: Load OpenShift evidence
          ansible.builtin.include_role:
            name: load_evidence_openshift

        - name: Prepare collected-state OpenShift analysis
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: prepare_collected_state.yml

        - name: Run common analysis against collected-state inputs
          ansible.builtin.include_role:
            name: analyze_common

        - name: Run unified OpenShift analysis against collected-state inputs
          ansible.builtin.include_role:
            name: analyze_openshift

        - name: Build collected-state OpenShift health synthesis
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: collected_state_health.yml

        - name: Finalize collected-state supportability rollup
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: finalize_collected_supportability.yml

        - name: Build collected-state OpenShift report
          ansible.builtin.include_role:
            name: report_openshift
            tasks_from: render_collected_state_report.yml
