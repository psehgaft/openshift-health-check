    routes: "{{ collected_commands.routes.stdout | from_json if (collected_commands.routes.rc | default(1)) == 0 else {'items': []} }}"
    ingresses: "{{ collected_commands.ingresses.stdout | from_json if (collected_commands.ingresses.rc | default(1)) == 0 else {'items': []} }}"
    ingresscontrollers: "{{ collected_commands.ingresscontrollers.stdout | from_json if (collected_commands.ingresscontrollers.rc | default(1)) == 0 else {'items': []} }}"
    serviceaccounts: "{{ collected_commands.serviceaccounts.stdout | from_json if (collected_commands.serviceaccounts.rc | default(1)) == 0 else {'items': []} }}"
    services: "{{ collected_commands.services.stdout | from_json if (collected_commands.services.rc | default(1)) == 0 else {'items': []} }}"
    endpoints: "{{ collected_commands.endpoints.stdout | from_json if (collected_commands.endpoints.rc | default(1)) == 0 else {'items': []} }}"
    crds: "{{ collected_commands.crds.stdout | from_json if (collected_commands.crds.rc | default(1)) == 0 else {'items': []} }}"
    namespaces: "{{ collected_commands.namespaces.stdout | from_json if (collected_commands.namespaces.rc | default(1)) == 0 else {'items': []} }}"
    networkpolicies: "{{ collected_commands.networkpolicies.stdout | from_json if (collected_commands.networkpolicies.rc | default(1)) == 0 else {'items': []} }}"
    resourcequotas: "{{ collected_commands.resourcequotas.stdout | from_json if (collected_commands.resourcequotas.rc | default(1)) == 0 else {'items': []} }}"
    limitranges: "{{ collected_commands.limitranges.stdout | from_json if (collected_commands.limitranges.rc | default(1)) == 0 else {'items': []} }}"
    secrets: "{{ collected_commands.secrets.stdout | from_json if (collected_commands.secrets.rc | default(1)) == 0 else {'items': []} }}"
    configmaps: "{{ collected_commands.configmaps.stdout | from_json if (collected_commands.configmaps.rc | default(1)) == 0 else {'items': []} }}"
    storageclasses: "{{ collected_commands.storageclasses.stdout | from_json if (collected_commands.storageclasses.rc | default(1)) == 0 else {'items': []} }}"
    persistentvolumes: "{{ collected_commands.persistentvolumes.stdout | from_json if (collected_commands.persistentvolumes.rc | default(1)) == 0 else {'items': []} }}"
    persistentvolumeclaims: "{{ collected_commands.persistentvolumeclaims.stdout | from_json if (collected_commands.persistentvolumeclaims.rc | default(1)) == 0 else {'items': []} }}"
