---
- name: Build node capacity summary
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_node_capacity_facts.py"
    stdin: >-
      {{
        {
          'analysis_graph': (analysis_graph | default({})),
          'openshift_node_items': (openshift_node_items | default([])),
          'pods': (pods | default({})),
          'node_pod_counts': (node_pod_counts | default({})),
          'node_pod_counts_fallback': (node_pod_counts_fallback | default({})),
          'node_cpu_request_millicores': (node_cpu_request_millicores | default({})),
          'cluster_max_pods_per_node_default': (cluster_max_pods_per_node_default | default(250))
        } | to_json
      }}
  register: node_capacity_facts_cmd
  changed_when: false
  when: report_scope_requires_core_node_analysis | default(true) | bool

- name: Normalize node capacity summary
  vars:
    node_capacity_facts: "{{ (node_capacity_facts_cmd.stdout | from_json) if (node_capacity_facts_cmd.stdout | default('') | length > 0) else {} }}"
  ansible.builtin.set_fact:
    node_capacity_summary: "{{ node_capacity_facts.node_capacity_summary | default([]) }}"
    node_capacity_summary_by_density_desc: "{{ node_capacity_facts.node_capacity_summary_by_density_desc | default([]) }}"
    node_capacity_summary_by_density_asc: "{{ node_capacity_facts.node_capacity_summary_by_density_asc | default([]) }}"
  when: report_scope_requires_core_node_analysis | default(true) | bool
