---
- name: Build persistent monitoring storage capability artifact facts
  vars:
    day2_persistent_monitoring_storage_section_current: "{{ (day2_capability_sections_by_key | default({})).get('persistent_monitoring_storage', {}) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: persistent_monitoring_storage
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      observability_status: "{{ day2_persistent_monitoring_storage_section_current.status | default('unknown') }}"
      observability_reason_summary: "{{ day2_persistent_monitoring_storage_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_persistent_monitoring_storage_section: "{{ day2_persistent_monitoring_storage_section_current }}"
    capability_artifact_collection_inputs:
      monitoring_persistent_storage_configured: "{{ ((day2_posture_summary | default({})).get('monitoring_persistent_storage_configured', false)) | bool }}"
