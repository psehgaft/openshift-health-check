                'checks': [{
                  'capability': 'cyberark_conjur_secrets_management',
                  'status': ('OK' if capability_status == 'OK' else ('WARN' if capability_status == 'WARNING' else 'INFO')),
                  'level': ('required' if (section.required | default(false)) else 'informational'),
                  'source': 'CyberArk Conjur workload and Secrets Provider inventory',
                  'detail': top_detail
                }],
                'findings': findings,
                'top_detail': top_detail,
                'recommended_action': recommended_action
              }, recursive=True) -%}
        {%- elif (not capability_assessment_completed) and (section.key | default('') == 'compliance_requirements_validation') -%}
          {%- set compliance_operator_present = compliance_operator_summary.present | default(false) -%}
          {%- set compliancesuite_count = (compliance_operator_summary.get('suite_count') | default(((analysis_graph.compliancesuites | default({})).get('items', []) | length)) | int) -%}
          {%- set compliance_present = compliance_operator_present or (compliancesuite_count > 0) -%}
          {%- set compliance_scan_setting_binding_count = (compliance_operator_summary.get('scan_setting_binding_count') | default(0) | int) -%}
          {%- set compliance_scan_count = (compliance_operator_summary.get('scan_count') | default(0) | int) -%}
          {%- set compliance_invalid_profilebundle_count = (compliance_operator_summary.get('invalid_profilebundle_count') | default(0) | int) -%}
          {%- set compliance_failed_check_count = (compliance_operator_summary.get('failed_check_count') | default(0) | int) -%}
          {%- set compliance_failing_scan_count = (compliance_operator_summary.get('failing_scan_count') | default(0) | int) -%}
          {%- set compliance_scan_config_present = (
                compliance_scan_setting_binding_count > 0
                or compliancesuite_count > 0
                or compliance_scan_count > 0
              ) -%}
          {%- set requested_compliance_standards = [] -%}
          {%- set compliance_capability = ((cluster_health_profile | default({})).get('capabilities', {}).get('compliance_requirements_validation', {}) | default({})) -%}
          {%- set requested_standards_source = compliance_capability.get('standards', []) | default([]) -%}
          {%- for item in requested_standards_source -%}
            {%- set raw = item | string | trim -%}
            {%- set lowered = raw | lower -%}
            {%- set normalized = (
                  'FIPS' if lowered == 'fips'
                  else (
                    'FedRAMP' if lowered in ['fedramp', 'fedramp moderate']
                    else (
                      'HIPAA' if lowered == 'hipaa'
                      else (
                        'PCI-DSS' if lowered in ['pci', 'pci-dss', 'pcidss']
                        else (
                          'SOC' if lowered in ['soc', 'soc1', 'soc2', 'soc3']
                          else (
                            'SOX' if lowered == 'sox'
                            else (
                              'NIST' if lowered == 'nist'
                              else ('CIS' if lowered == 'cis' else raw)
                            )
                          )
                        )
                      )
                    )
                  )
                ) -%}
            {%- if normalized and (normalized not in requested_compliance_standards) -%}
              {%- set _ = requested_compliance_standards.append(normalized) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set standards_by_name = {} -%}
          {%- for item in (compliance_standards_summary | default([])) -%}
            {%- set standard_name = (item.get('standard') or '') | string | trim -%}
            {%- if standard_name -%}
              {%- set _ = standards_by_name.update({standard_name: item}) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set ns = namespace(
                requested_status=[],
                requested_gaps=[],
                standard_checks=[],
                requested_failed_scan_count=0,
                requested_failed_check_count=0
              ) -%}
          {%- for standard_name in requested_compliance_standards -%}
            {%- set summary = standards_by_name.get(standard_name, {}) -%}
            {%- set verdict = (summary.get('verdict') or 'not-configured') | string -%}
            {%- set runtime_status = (summary.get('runtime_status') or 'not-applicable') | string -%}
            {%- set detail = (summary.get('detail') or '') | string | trim -%}
            {%- set ns.requested_failed_scan_count = ns.requested_failed_scan_count + ((summary.get('failing_scan_count') | default(0)) | int) -%}
            {%- set ns.requested_failed_check_count = ns.requested_failed_check_count + ((summary.get('failed_check_count') | default(0)) | int) -%}
            {%- set _ = ns.requested_status.append(standard_name ~ '=' ~ (runtime_status if standard_name == 'FIPS' else verdict)) -%}
            {%- set standard_supported = (
                  (runtime_status == 'enabled')
                  if standard_name == 'FIPS'
                  else (verdict == 'supported')
                ) -%}
            {%- set standard_detail = (
                  (
                    'runtime=' ~ runtime_status ~ ' verdict=' ~ verdict ~ ((' detail=' ~ detail) if detail else '')
                  )
                  if standard_name == 'FIPS'
                  else (
                    'verdict=' ~ verdict
                    ~ ' configured=' ~ ((summary.get('configured') | default(false)) | string)
                    ~ ' active=' ~ ((summary.get('active_enabled') | default(false)) | string)
                    ~ ' scans=' ~ ((summary.get('scan_count') | default(0) | int) | string)
                    ~ ' failedScans=' ~ ((summary.get('failing_scan_count') | default(0) | int) | string)
                    ~ ' failedChecks=' ~ ((summary.get('failed_check_count') | default(0) | int) | string)
                    ~ ((' detail=' ~ detail) if detail else '')
                  )
                ) -%}
            {%- set _ = ns.standard_checks.append({
                  'capability': 'compliance_requirements_validation',
                  'status': ('OK' if standard_supported else ('WARN' if (section.required | default(false)) else 'INFO')),
                  'level': ('required' if (section.required | default(false)) else 'informational'),
                  'source': 'compliance standard ' ~ standard_name,
                  'detail': standard_name ~ ': ' ~ standard_detail
                }) -%}
            {%- if standard_name == 'FIPS' -%}
              {%- if runtime_status != 'enabled' -%}
                {%- set gap_detail = (
                      'FIPS is an install-time cluster setting and runtime node evidence does not confirm full enablement'
                      if runtime_status == 'unknown'
                      else (
                        'FIPS crypto policy evidence is partial and /proc/sys/crypto/fips_enabled confirmation was not collected'
                        if runtime_status == 'crypto-policy-fips'
                        else 'runtime FIPS status is ' ~ runtime_status
                      )
                    ) -%}
                {%- set _ = ns.requested_gaps.append({'standard': standard_name, 'detail': gap_detail}) -%}
              {%- endif -%}
            {%- elif verdict != 'supported' -%}
              {%- set gap_detail = (
                    'matching Compliance Operator content is available but no current binding, suite, or scan evidence shows it is configured'
                    if verdict == 'content-available'
                    else (
                      'Compliance Operator resources are configured for this standard, but no active suite or scan evidence was found'
                      if verdict == 'configured-no-scan'
                      else (
                        'active scans or checks for this standard need review'
                        if verdict == 'review-required'
                        else 'no matching Compliance Operator standard evidence was found'
                      )
                    )
                  ) -%}
              {%- if detail -%}
                {%- set gap_detail = gap_detail ~ ' (' ~ detail ~ ')' -%}
              {%- endif -%}
              {%- set _ = ns.requested_gaps.append({'standard': standard_name, 'detail': gap_detail}) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set compliance_operator_healthy = compliance_present and compliance_scan_config_present and (compliance_invalid_profilebundle_count == 0) -%}
          {%- set compliance_healthy = (
                ((ns.requested_gaps | length) == 0 and compliance_invalid_profilebundle_count == 0)
                if (requested_compliance_standards | length) > 0
                else compliance_operator_healthy
              ) -%}
          {%- set capability_status = (
                'OK'
                if compliance_healthy
                else ('WARNING' if (compliance_present or (section.required | default(false))) else 'INFO')
              ) -%}
          {%- set top_detail = (
                'requested=' ~ ((requested_compliance_standards | join(',')) or 'none')
                ~ ' suites=' ~ (compliancesuite_count | string)
                ~ ' scans=' ~ (compliance_scan_count | string)
                ~ ' bindings=' ~ (compliance_scan_setting_binding_count | string)
                ~ ' failedChecks=' ~ ((ns.requested_failed_check_count if (requested_compliance_standards | length) > 0 else compliance_failed_check_count) | string)
                ~ ' failingScans=' ~ ((ns.requested_failed_scan_count if (requested_compliance_standards | length) > 0 else compliance_failing_scan_count) | string)
                ~ ' invalidProfileBundles=' ~ (compliance_invalid_profilebundle_count | string)
                ~ ' standards=' ~ ((ns.requested_status | join(';')) or 'not-requested')
              ) -%}
          {%- set recommended_action = (
                'No compliance-validation remediation is required for this capability.'
                if capability_status == 'OK'
                else (
                  'No compliance validation evidence was found from requested runtime signals or Compliance Operator suites, scans, scan-setting bindings, profile content, and openshift-compliance resources.'
                  if not compliance_present
                  else (
                    'Requested compliance standards are not fully satisfied. Review the named standards, confirm the expected Compliance Operator content, and remediate missing configuration, inactive scans, or review-required findings.'
                    if (requested_compliance_standards | length) > 0 and (ns.requested_gaps | length) > 0
                    else (
                      'Compliance Operator profile bundles are invalid, so requested compliance standards cannot be trusted until the bundle issues are fixed.'
                      if (requested_compliance_standards | length) > 0 and compliance_invalid_profilebundle_count > 0
                      else 'Compliance validation evidence is present but scan-backed configuration is incomplete. Review suite, scan, binding, and profile-bundle state before relying on compliance results.'
                    )
                  )
                )
              ) -%}
          {%- set findings = (
                []
                if capability_status == 'OK'
                else [{
                  'severity': ('warning' if capability_status == 'WARNING' else 'info'),
                  'issue': (
                    'Compliance validation evidence missing'
                    if not compliance_present
                    else (
                      'Requested compliance standards are not fully satisfied'
                      if (requested_compliance_standards | length) > 0 and (ns.requested_gaps | length) > 0
                      else (
                        'Compliance profile bundle validation failed'
                        if (requested_compliance_standards | length) > 0 and compliance_invalid_profilebundle_count > 0
                        else 'Compliance validation configuration incomplete'
                      )
                    )
                  ),
                  'source': 'compliance requirements validation evidence',
                  'recommended_action': recommended_action
                }]
              ) -%}
          {%- set updated = section | combine({
                'status': capability_status,
                'accounting_state': 'assessed',
                'check_count': (1 + (requested_compliance_standards | length)),
                'finding_count': (findings | length),
                'checks': ([{
                  'capability': 'compliance_requirements_validation',
                  'status': ('OK' if capability_status == 'OK' else ('WARN' if capability_status == 'WARNING' else 'INFO')),
                  'level': ('required' if (section.required | default(false)) else 'informational'),
                  'source': 'compliance requirements validation evidence',
                  'detail': top_detail
                }] + ns.standard_checks),
                'findings': findings,
                'top_detail': top_detail,
                'recommended_action': recommended_action
              }, recursive=True) -%}
        {%- elif (not capability_assessment_completed) and (section.key | default('') == 'workload_vulnerability_scanning') -%}
          {%- set scanner_subscription_present = false -%}
          {%- for pkg in (subscription_packages | default([])) -%}
            {%- set lowered = pkg | string | lower -%}
            {%- if lowered in ['trivy-operator', 'container-security-operator', 'aqua', 'aqua-operator', 'qualys-cloud-agent-operator', 'prisma-cloud-compute'] -%}
              {%- set scanner_subscription_present = true -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set scanner_crd_present = false -%}
          {%- for crd in ((analysis_graph.crds | default({})).get('items', []) | default([])) -%}
            {%- set crd_name = (((crd.get('metadata') or {}).get('name')) or '') | string | lower -%}
            {%- if 'aquasecurity.github.io' in crd_name or 'vulnerabilityreports' in crd_name -%}
              {%- set scanner_crd_present = true -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set scanner_namespace_present = false -%}
          {%- for ns_name in (namespace_names | default([])) -%}
            {%- set lowered = ns_name | string | lower -%}
            {%- if lowered in ['trivy-system', 'stackrox', 'rhacs-operator', 'aqua', 'qualys', 'qualys-agent', 'twistlock', 'prisma-cloud'] -%}
              {%- set scanner_namespace_present = true -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set scanner_workload_present = false -%}
          {%- for blob in (all_workload_blobs | default([])) -%}
            {%- set lowered = blob | string | lower -%}
            {%- if 'trivy-operator' in lowered or 'starboard' in lowered or 'trivy-scanner' in lowered or 'aqua' in lowered or 'qualys' in lowered or 'qualys-cloud-agent' in lowered or 'twistlock' in lowered or 'prisma-cloud' in lowered or 'vulnerability-scanner' in lowered or 'stackrox-scanner' in lowered -%}
              {%- set scanner_workload_present = true -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set scanner_context_present = scanner_subscription_present or scanner_crd_present or scanner_namespace_present or scanner_workload_present -%}
          {%- set scanner_present = scanner_workload_present -%}
          {%- set capability_status = (
                'OK'
                if scanner_present
                else ('WARNING' if (scanner_context_present or (section.required | default(false))) else 'INFO')
              ) -%}
          {%- set top_detail = (
                'scannerPresent=' ~ (scanner_present | string)
                ~ ' scannerContextPresent=' ~ (scanner_context_present | string)
                ~ ' scannerSubscriptionPresent=' ~ (scanner_subscription_present | string)
                ~ ' scannerCrdPresent=' ~ (scanner_crd_present | string)
                ~ ' scannerWorkloadPresent=' ~ (scanner_workload_present | string)
                ~ ' scannerNamespacePresent=' ~ (scanner_namespace_present | string)
              ) -%}
          {%- set recommended_action = (
                'No workload-vulnerability-scanning remediation is required for this capability.'
                if capability_status == 'OK'
                else (
                  'Scanner context was detected from namespace, subscription, or CRD evidence, but no live workload vulnerability or security scanner workload footprint was found. Review operator rollout and active scanner deployment state.'
                  if scanner_context_present
                  else 'No live workload vulnerability or security scanner workload footprint was detected. If scanner coverage is expected, review RHACS, Qualys, Prisma Cloud, Aqua, Trivy, or equivalent scanner deployment evidence.'
                )
              ) -%}
          {%- set findings = (
                []
                if capability_status == 'OK'
                else [{
                  'severity': ('warning' if capability_status == 'WARNING' else 'info'),
                  'issue': (
                    'Scanner context present but no live scanner workload footprint detected'
                    if scanner_context_present
                    else 'No workload vulnerability or security scanner footprint detected'
                  ),
                  'source': 'live workload scanner operator, agent, and report inventory',
                  'recommended_action': recommended_action
                }]
              ) -%}
          {%- set updated = section | combine({
                'status': capability_status,
                'accounting_state': 'assessed',
                'check_count': 1,
                'finding_count': (findings | length),
                'checks': [{
                  'capability': 'workload_vulnerability_scanning',
                  'status': ('OK' if capability_status == 'OK' else ('WARN' if capability_status == 'WARNING' else 'INFO')),
                  'level': ('required' if (section.required | default(false)) else 'informational'),
                  'source': 'live workload scanner operator, agent, and report inventory',
                  'detail': top_detail
                }],
                'findings': findings,
                'top_detail': top_detail,
                'recommended_action': recommended_action
              }, recursive=True) -%}
        {%- elif (not capability_assessment_completed) and (section.key | default('') == 'advanced_cluster_security') -%}
          {%- set acs_operator_subscription_present = ('container-security-operator' in (subscription_packages | default([]))) -%}
          {%- set acs_namespace_present = ('stackrox' in (namespace_names | default([]))) or ('rhacs-operator' in (namespace_names | default([]))) -%}
          {%- set acs_crd_present = false -%}
          {%- for crd in ((analysis_graph.crds | default({})).get('items', []) | default([])) -%}
            {%- set crd_name = (((crd.get('metadata') or {}).get('name')) or '') | string | lower -%}
            {%- if 'platform.stackrox.io' in crd_name or 'central.stackrox.io' in crd_name or 'securedcluster.stackrox.io' in crd_name or 'stackrox.io' in crd_name -%}
              {%- set acs_crd_present = true -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set acs_workload_present = false -%}
          {%- for blob in (all_workload_blobs | default([])) -%}
            {%- set lowered = blob | string | lower -%}
            {%- if 'stackrox-central' in lowered or 'central-db' in lowered or 'stackrox-scanner' in lowered or 'stackrox-scanner-db' in lowered or 'secured-cluster-services' in lowered or 'admission-control' in lowered or 'stackrox-sensor' in lowered -%}
              {%- set acs_workload_present = true -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set advanced_cluster_security_present = acs_operator_subscription_present or acs_namespace_present or acs_crd_present or acs_workload_present -%}
          {%- set capability_status = ('OK' if advanced_cluster_security_present else 'INFO') -%}
          {%- set top_detail = (
                'subscriptionPresent=' ~ (acs_operator_subscription_present | string)
                ~ ' acsNamespacePresent=' ~ (acs_namespace_present | string)
                ~ ' acsCrdPresent=' ~ (acs_crd_present | string)
                ~ ' acsWorkloadPresent=' ~ (acs_workload_present | string)
              ) -%}
          {%- set recommended_action = (
                'No RHACS footprint remediation is required for this capability.'
                if advanced_cluster_security_present
                else 'No RHACS operator, CRD, namespace, or secured-cluster workload footprint was detected. If RHACS is the intended workload-security platform, review operator installation and secured-cluster rollout evidence.'
              ) -%}
          {%- set findings = (
                []
                if advanced_cluster_security_present
                else [{
                  'severity': 'info',
                  'issue': 'Advanced Cluster Security footprint missing',
                  'source': 'RHACS operator and secured-cluster inventory',
                  'recommended_action': recommended_action
                }]
              ) -%}
          {%- set updated = section | combine({
                'status': capability_status,
                'accounting_state': 'assessed',
                'check_count': 1,
                'finding_count': (findings | length),
                'checks': [{
                  'capability': 'advanced_cluster_security',
                  'status': ('OK' if advanced_cluster_security_present else 'INFO'),
                  'level': ('required' if (section.required | default(false)) else 'informational'),
                  'source': 'RHACS operator and secured-cluster inventory',
                  'detail': top_detail
                }],
                'findings': findings,
                'top_detail': top_detail,
                'recommended_action': recommended_action
              }, recursive=True) -%}
        {%- endif -%}
        {%- set _ = sections.append(updated) -%}
      {%- endfor -%}
      {{ sections }}
