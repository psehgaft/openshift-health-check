          'evidence': 'No command executed; this test is gated by an explicit run toggle.'
          'details': tc68_cmd.stdout | default(tc68_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc68', 'dns_ntp']

