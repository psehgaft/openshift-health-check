---
- name: Build workloads using external private registries capability artifact facts
  ansible.builtin.set_fact:
    capability_artifact_key: workloads_using_external_private_registries
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      workloads_using_external_private_registries_present: "{{ ((day2_posture_summary | default({})).get('workloads_using_external_private_registries_present', false)) | bool }}"
      external_private_registry_count: "{{ ((day2_posture_summary | default({})).get('external_private_registry_count', 0)) | int }}"
      external_private_registry_workload_count: "{{ ((day2_posture_summary | default({})).get('external_private_registry_workload_count', 0)) | int }}"
      external_private_registry_workloads_with_pull_secret: "{{ ((day2_posture_summary | default({})).get('external_private_registry_workloads_with_pull_secret', 0)) | int }}"
      external_private_registry_workloads_with_serviceaccount_pull_secret: "{{ ((day2_posture_summary | default({})).get('external_private_registry_workloads_with_serviceaccount_pull_secret', 0)) | int }}"
      credentialed_public_registry_count: "{{ ((day2_posture_summary | default({})).get('credentialed_public_registry_count', 0)) | int }}"
      workloads_with_image_pull_secret: "{{ ((day2_posture_summary | default({})).get('workloads_with_image_pull_secret', 0)) | int }}"
    capability_artifact_render_inputs:
      cluster_image_mirror_configuration_present: "{{ ((day2_posture_summary | default({})).get('cluster_image_mirror_configuration_present', false)) | bool }}"
      disconnected_cluster_image_sources_present: "{{ ((day2_posture_summary | default({})).get('disconnected_cluster_image_sources_present', false)) | bool }}"
    capability_artifact_collection_inputs:
      external_private_registry_count: "{{ ((day2_posture_summary | default({})).get('external_private_registry_count', 0)) | int }}"
      external_private_registry_workload_count: "{{ ((day2_posture_summary | default({})).get('external_private_registry_workload_count', 0)) | int }}"
      external_private_registry_workloads_with_pull_secret: "{{ ((day2_posture_summary | default({})).get('external_private_registry_workloads_with_pull_secret', 0)) | int }}"
      external_private_registry_workloads_with_serviceaccount_pull_secret: "{{ ((day2_posture_summary | default({})).get('external_private_registry_workloads_with_serviceaccount_pull_secret', 0)) | int }}"
      credentialed_public_registry_count: "{{ ((day2_posture_summary | default({})).get('credentialed_public_registry_count', 0)) | int }}"
      workloads_with_image_pull_secret: "{{ ((day2_posture_summary | default({})).get('workloads_with_image_pull_secret', 0)) | int }}"
      cluster_image_mirror_configuration_present: "{{ ((day2_posture_summary | default({})).get('cluster_image_mirror_configuration_present', false)) | bool }}"
      image_mirror_resource_count: "{{ ((day2_posture_summary | default({})).get('image_mirror_resource_count', 0)) | int }}"
      disconnected_cluster_image_sources_present: "{{ ((day2_posture_summary | default({})).get('disconnected_cluster_image_sources_present', false)) | bool }}"
      disconnected_catalogsource_count: "{{ ((day2_posture_summary | default({})).get('disconnected_catalogsource_count', 0)) | int }}"
