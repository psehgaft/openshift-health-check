---
- name: Build Windows container workloads capability artifact facts
  vars:
    day2_windows_container_workloads_section_current: "{{ (((day2_capability_sections | default([])) | selectattr('key', 'equalto', 'windows_container_workloads') | list | first) | default({})) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: windows_container_workloads
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      windows_container_workloads_present: "{{ ((day2_posture_summary | default({})).get('windows_container_workloads_present', false)) | bool }}"
      windows_container_workloads_healthy: "{{ ((day2_posture_summary | default({})).get('windows_container_workloads_healthy', false)) | bool }}"
      status_summary: "{{ day2_windows_container_workloads_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_windows_container_workloads_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_windows_container_workloads_section: "{{ day2_windows_container_workloads_section_current }}"
    capability_artifact_collection_inputs:
      windows_container_workloads_present: "{{ ((day2_posture_summary | default({})).get('windows_container_workloads_present', false)) | bool }}"
      windows_container_workloads_healthy: "{{ ((day2_posture_summary | default({})).get('windows_container_workloads_healthy', false)) | bool }}"
