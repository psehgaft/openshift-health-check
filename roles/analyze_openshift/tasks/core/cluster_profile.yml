---
- name: Build cluster profile
  vars:
    graph: "{{ analysis_graph | default({}) }}"
  ansible.builtin.set_fact:
    cluster_profile:
      infrastructure_name: "{{ graph.infrastructure.status.infrastructureName | default('unknown') }}"
      infrastructure_creation_timestamp: "{{ graph.infrastructure.metadata.creationTimestamp | default('') }}"
      platform: "{{ graph.infrastructure.status.platformStatus.type | default(graph.infrastructure.status.platform | default('unknown')) }}"
      control_plane_topology: "{{ graph.infrastructure.status.controlPlaneTopology | default('unknown') }}"
      infrastructure_topology: "{{ graph.infrastructure.status.infrastructureTopology | default('unknown') }}"
      api_url: "{{ graph.infrastructure.status.apiServerURL | default('unknown') }}"
      api_internal_url: "{{ graph.infrastructure.status.apiServerInternalURL | default('unknown') }}"
      base_domain: "{{ graph.dns_config.spec.baseDomain | default(graph.ingress_config.spec.domain | default('unknown')) }}"
      ingress_domain: "{{ graph.ingress_config.spec.domain | default('unknown') }}"
      network_type: "{{ graph.network_config.status.networkType | default('unknown') }}"
      service_networks: "{{ graph.network_config.spec.serviceNetwork | default([]) }}"
      cluster_networks: "{{ graph.network_config.spec.clusterNetwork | default([]) }}"
      machine_networks: []
      machine_networks_source: not-exposed-via-cluster-api
      identity_provider_count: "{{ graph.oauth_config.spec.identityProviders | default([]) | length }}"
      identity_provider_names: "{{ graph.oauth_config.spec.identityProviders | default([]) | map(attribute='name') | list }}"
      platform_category: unknown
      public_cloud: false
      service_model: unknown
      service_model_source: not-derived
      service_model_confidence: low
      service_variant: unknown
      install_model: unknown
      install_model_source: not-derived
      install_model_confidence: low
      control_plane_model: unknown
      control_plane_model_source: not-derived
      control_plane_model_confidence: low
      machine_api_worker_pool_count: 0
      machine_api_managed_worker_pools: false
      cluster_classification_label: openshift
      cluster_classification_source: default-openshift-fallback
      cluster_classification_confidence: low
      deployment_type: openshift
      deployment_type_source: default-openshift-fallback
      deployment_type_confidence: low
      is_sno: false
      is_hosted_control_plane: false
      control_plane_node_count: 0
      worker_node_count: 0
      infra_node_count: 0
