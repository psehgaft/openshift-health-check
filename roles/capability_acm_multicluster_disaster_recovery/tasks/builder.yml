---
- name: Build ACM multicluster disaster recovery capability artifact facts
  vars:
    day2_acm_multicluster_disaster_recovery_section_current: "{{ (((day2_capability_sections | default([])) | selectattr('key', 'equalto', 'acm_multicluster_disaster_recovery') | list | first) | default({})) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: acm_multicluster_disaster_recovery
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      acm_managed: "{{ ((day2_posture_summary | default({})).get('acm_managed', false)) | bool }}"
      acm_klusterlet_count: "{{ ((day2_posture_summary | default({})).get('acm_klusterlet_count', 0)) | int }}"
      acm_managedclusteraddon_count: "{{ ((day2_posture_summary | default({})).get('acm_managedclusteraddon_count', 0)) | int }}"
      acm_agent_namespace_count: "{{ ((day2_posture_summary | default({})).get('acm_agent_namespace_count', 0)) | int }}"
      secondary_site_disaster_recovery_present: "{{ ((day2_posture_summary | default({})).get('secondary_site_disaster_recovery_present', false)) | bool }}"
      secondary_site_disaster_recovery_healthy: "{{ ((day2_posture_summary | default({})).get('secondary_site_disaster_recovery_healthy', false)) | bool }}"
      drpolicy_count: "{{ ((day2_posture_summary | default({})).get('drpolicy_count', 0)) | int }}"
      valid_drpolicy_count: "{{ ((day2_posture_summary | default({})).get('valid_drpolicy_count', 0)) | int }}"
      drcluster_count: "{{ ((day2_posture_summary | default({})).get('drcluster_count', 0)) | int }}"
      drplacementcontrol_count: "{{ ((day2_posture_summary | default({})).get('drplacementcontrol_count', 0)) | int }}"
      volumereplicationgroup_count: "{{ ((day2_posture_summary | default({})).get('volumereplicationgroup_count', 0)) | int }}"
      volumereplicationclass_count: "{{ ((day2_posture_summary | default({})).get('volumereplicationclass_count', 0)) | int }}"
      status_summary: "{{ day2_acm_multicluster_disaster_recovery_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_acm_multicluster_disaster_recovery_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_acm_multicluster_disaster_recovery_section: "{{ day2_acm_multicluster_disaster_recovery_section_current }}"
    capability_artifact_collection_inputs:
      acm_managed: "{{ ((day2_posture_summary | default({})).get('acm_managed', false)) | bool }}"
      acm_klusterlet_count: "{{ ((day2_posture_summary | default({})).get('acm_klusterlet_count', 0)) | int }}"
      acm_managedclusteraddon_count: "{{ ((day2_posture_summary | default({})).get('acm_managedclusteraddon_count', 0)) | int }}"
      acm_agent_namespace_count: "{{ ((day2_posture_summary | default({})).get('acm_agent_namespace_count', 0)) | int }}"
      secondary_site_disaster_recovery_present: "{{ ((day2_posture_summary | default({})).get('secondary_site_disaster_recovery_present', false)) | bool }}"
      secondary_site_disaster_recovery_healthy: "{{ ((day2_posture_summary | default({})).get('secondary_site_disaster_recovery_healthy', false)) | bool }}"
      drpolicy_count: "{{ ((day2_posture_summary | default({})).get('drpolicy_count', 0)) | int }}"
      valid_drpolicy_count: "{{ ((day2_posture_summary | default({})).get('valid_drpolicy_count', 0)) | int }}"
      drcluster_count: "{{ ((day2_posture_summary | default({})).get('drcluster_count', 0)) | int }}"
      drplacementcontrol_count: "{{ ((day2_posture_summary | default({})).get('drplacementcontrol_count', 0)) | int }}"
      volumereplicationgroup_count: "{{ ((day2_posture_summary | default({})).get('volumereplicationgroup_count', 0)) | int }}"
      volumereplicationclass_count: "{{ ((day2_posture_summary | default({})).get('volumereplicationclass_count', 0)) | int }}"
      secondary_site_dr_problem_drcluster_count: "{{ ((day2_posture_summary | default({})).get('secondary_site_dr_problem_drcluster_count', 0)) | int }}"
      secondary_site_dr_problem_drpc_count: "{{ ((day2_posture_summary | default({})).get('secondary_site_dr_problem_drpc_count', 0)) | int }}"
      secondary_site_dr_problem_vrg_count: "{{ ((day2_posture_summary | default({})).get('secondary_site_dr_problem_vrg_count', 0)) | int }}"
