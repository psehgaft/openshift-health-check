      'node_disk_utilization_results': node_disk_utilization_results | default([]),
      'pod_cpu_usage_all_results': pod_cpu_usage_all_results | default([]),
      'pod_memory_usage_all_results': pod_memory_usage_all_results | default([]),
      'kubelet_pod_density_results': kubelet_pod_density_results | default([]),
      'runtime_signal_resolution_map': runtime_signal_resolution_map | default({}),
      'service_ip_capacity_summary': service_ip_capacity_summary | default({}),
      'pod_ip_capacity_summary': pod_ip_capacity_summary | default({}),
      'node_ip_capacity_summary': node_ip_capacity_summary | default({}),
      'report_generated_at': report_generated_at | default(''),
      'cv_available': cv_available | default('Unknown'),
      'cv_progressing': cv_progressing | default('Unknown'),
      'cv_failing': cv_failing | default('Unknown'),
      'insights_available': ((clusteroperator_status_map | default({})).get('insights', {})).get('available', 'Unknown'),
      'insights_degraded': ((clusteroperator_status_map | default({})).get('insights', {})).get('degraded', 'Unknown'),
      'openshift_deployment_type': cluster_profile.deployment_type | default('openshift'),
      'openshift_cluster_classification_label': cluster_profile.cluster_classification_label | default(cluster_profile.deployment_type | default('openshift')),
      'openshift_cluster_classification_source': cluster_profile.cluster_classification_source | default(cluster_profile.deployment_type_source | default('default-openshift-fallback')),
      'openshift_cluster_classification_confidence': cluster_profile.cluster_classification_confidence | default(cluster_profile.deployment_type_confidence | default('low')),
      'openshift_service_model': cluster_profile.service_model | default('unknown'),
