---
- name: Resolve posture artifact resume decision
  ansible.builtin.set_fact:
    posture_artifact_resume_decision: "{{ ((report_resume_artifact_plan | default({})).get('postures', {})).get((posture_artifact_key_hint | default(role_name | regex_replace('^posture_', ''))), {'should_build': true, 'reusable': false}) }}"
  when: report_run_mode | default('fresh') == 'resume_last_failure'

- name: Build posture artifact facts from local builder task
  ansible.builtin.include_tasks: "{{ posture_artifact_builder_tasks_from }}"
  when: >
    (report_run_mode | default('fresh')) != 'resume_last_failure'
    or (posture_artifact_resume_decision.should_build | default(true) | bool)

- name: Build and buffer OpenShift posture artifact payload
  vars:
    posture_profile_current: "{{ ((cluster_health_profile | default({})).get('postures', {})).get(posture_artifact_key, {}) }}"
    posture_profile_includes_current: "{{ posture_profile_current.get('includes', []) if posture_profile_current is mapping else [] }}"
    posture_profile_satisfied_by_all_current: "{{ posture_profile_current.get('satisfied_by_all', []) if posture_profile_current is mapping else [] }}"
    posture_profile_capability_keys_current: "{{ (posture_profile_includes_current + posture_profile_satisfied_by_all_current) | unique }}"
    posture_profile_capability_sections_current: >-
      {%- set resolved = [] -%}
      {%- set section_map = day2_capability_sections_by_key | default({}) -%}
      {%- for capability_key in posture_profile_capability_keys_current -%}
      {%- set section = section_map.get(capability_key, {}) -%}
      {%- if section is mapping and (section | length) > 0 -%}
      {%- set _ = resolved.append(section) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ resolved }}
    posture_artifact_dependency_keys_resolved: >-
      {{
        posture_artifact_dependency_keys
        if (posture_artifact_dependency_keys is defined)
        else ((report_posture_artifact_dependency_keys_by_key | default({})).get(posture_artifact_key, (report_scope_posture_dependency_map | default({})).get(posture_artifact_key, [])))
      }}
    posture_artifact_shared_inputs_used_resolved: >-
      {{
        posture_artifact_shared_inputs_used
        if (posture_artifact_shared_inputs_used is defined)
        else ((report_posture_artifact_shared_inputs_by_key | default({})).get(posture_artifact_key, []))
      }}
    posture_artifact_payload_current: >-
      {{
        (
          {
            'schema_version': (report_artifact_schema_version | default('1')),
            'repo_contract_version': (report_repo_contract_version | default('openshift-artifact-workspace-v1')),
            'run_id': (report_run_id | default('')),
            'platform_family': (platform_family | default('openshift')),
            'report_mode': (report_mode_resolved | default('live')),
            'key': posture_artifact_key,
            'kind': 'posture',
            'requested_by_selector': ((report_requested_postures | default([])) | length > 0) and (posture_artifact_key in (report_requested_postures | default([]))),
            'dependency_keys': posture_artifact_dependency_keys_resolved,
            'shared_inputs_used': posture_artifact_shared_inputs_used_resolved,
            'upstream_shared_artifact_hashes': (report_current_shared_artifact_hashes | default({})),
            'section_scope': {
              'postures': (report_effective_selected_postures | default([])),
              'capabilities': (report_effective_selected_capabilities | default([]))
            },
            'enabled': (((cluster_health_profile | default({})).get('postures', {})).get(posture_artifact_key, {}).get('enabled', true)),
            'required': (((cluster_health_profile | default({})).get('postures', {})).get(posture_artifact_key, {}).get('required', false)),
            'profile_capability_mapping': {
              'includes': posture_profile_includes_current,
              'satisfied_by_all': posture_profile_satisfied_by_all_current
            },
            'owned_capability_keys': posture_profile_capability_keys_current,
            'owned_capability_sections': posture_profile_capability_sections_current,
            'generated_at': (report_generated_at | default(ansible_date_time.iso8601)),
            'status': 'render-ready',
            'errors': [],
            'analysis_summary': (posture_artifact_analysis_summary | default({})),
            'findings': (posture_artifact_findings | default({})),
            'render_inputs': (
              (posture_artifact_render_inputs | default({}))
              | combine(
                  {
                    'profile_capability_mapping': {
                      'includes': posture_profile_includes_current,
                      'satisfied_by_all': posture_profile_satisfied_by_all_current
                    },
                    'owned_capability_keys': posture_profile_capability_keys_current,
                    'owned_capability_sections': posture_profile_capability_sections_current
                  },
                  recursive=True
                )
            ),
            'collection_inputs': (posture_artifact_collection_inputs | default({}))
          }
          | combine((posture_artifact_section_fields | default({})), recursive=True)
        )
      }}
  ansible.builtin.set_fact:
    report_buffered_posture_artifacts: "{{ (report_buffered_posture_artifacts | default({})) | combine({posture_artifact_key: posture_artifact_payload_current}, recursive=False) }}"
  when: >
    (report_artifact_persistence_mode | default('buffered')) == 'buffered'
    and (
      (report_run_mode | default('fresh')) != 'resume_last_failure'
      or (posture_artifact_resume_decision.should_build | default(true) | bool)
    )
