---
- name: Parse optional collected evidence bundle
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/parse_optional_evidence_bundle.py"
    stdin: "{{ optional_evidence_bundle_input | to_json }}"
  register: optional_evidence_bundle_cmd
  changed_when: false
  vars:
    optional_evidence_bundle_input:
      evidence_sources: "{{ evidence_sources | default([]) }}"
      evidence_summary: "{{ evidence_summary | default({'source_count': 0, 'source_labels': []}) }}"
      evidence_limitations: "{{ evidence_limitations | default([]) }}"
      evidence_mode: "{{ evidence_mode | default('auto') }}"
      must_gather_path: "{{ must_gather_path | default('') }}"
      cluster_compare_path: "{{ cluster_compare_path | default('') }}"
      inspect_path: "{{ inspect_path | default('') }}"
      managed_gates_path: "{{ managed_gates_path | default('') }}"
      sosreport_paths: "{{ sosreport_paths | default([]) }}"
      advisor_export_path: "{{ advisor_export_path | default('') }}"
      insights_archive_path: "{{ insights_archive_path | default('') }}"
      requires_cluster_compare: "{{ report_scope_requires_cluster_compare_evidence | default(true) | bool }}"
      requires_inspect: "{{ report_scope_requires_inspect_evidence | default(true) | bool }}"
      requires_managed_gates: "{{ report_scope_requires_managed_gates_evidence | default(true) | bool }}"
      requires_sosreport: "{{ report_scope_requires_sosreport_evidence | default(true) | bool }}"
      requires_advisor_export: "{{ report_scope_requires_advisor_export_evidence | default(true) | bool }}"
      requires_insights_archive: "{{ report_scope_requires_insights_archive_evidence | default(true) | bool }}"

- name: Merge optional collected evidence bundle
  vars:
    optional_evidence_bundle_payload: "{{ (optional_evidence_bundle_cmd.stdout | from_json) if (optional_evidence_bundle_cmd.stdout | default('') | trim | length > 0) else {} }}"
  ansible.builtin.set_fact:
    cluster_compare_data: "{{ optional_evidence_bundle_payload.cluster_compare_data | default(cluster_compare_data | default({})) }}"
    inspect_data: "{{ optional_evidence_bundle_payload.inspect_data | default(inspect_data | default({})) }}"
    managed_gates_data: "{{ optional_evidence_bundle_payload.managed_gates_data | default(managed_gates_data | default({})) }}"
    sosreport_data: "{{ optional_evidence_bundle_payload.sosreport_data | default(sosreport_data | default({})) }}"
    advisor_export_data: "{{ optional_evidence_bundle_payload.advisor_export_data | default(advisor_export_data | default({})) }}"
    insights_archive_data: "{{ optional_evidence_bundle_payload.insights_archive_data | default(insights_archive_data | default({})) }}"
    evidence_mode_resolved: "{{ optional_evidence_bundle_payload.evidence_mode_resolved | default(evidence_mode_resolved | default('inspect')) }}"
    evidence_sources: "{{ optional_evidence_bundle_payload.evidence_sources | default(evidence_sources | default([])) }}"
    evidence_summary: "{{ optional_evidence_bundle_payload.evidence_summary | default(evidence_summary | default({'source_count': 0, 'source_labels': []})) }}"
    evidence_limitations: "{{ optional_evidence_bundle_payload.evidence_limitations | default(evidence_limitations | default([])) }}"
