---
- name: Build cluster metrics remote write capability artifact facts
  vars:
    day2_cluster_metrics_remote_write_section_current: "{{ (((day2_capability_sections | default([])) | selectattr('key', 'equalto', 'cluster_metrics_remote_write') | list | first) | default({})) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: cluster_metrics_remote_write
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      observability_status: "{{ day2_cluster_metrics_remote_write_section_current.status | default('unknown') }}"
      observability_reason_summary: "{{ day2_cluster_metrics_remote_write_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_cluster_metrics_remote_write_section: "{{ day2_cluster_metrics_remote_write_section_current }}"
    capability_artifact_collection_inputs:
      external_cluster_metrics_remote_write_count: "{{ ((day2_posture_summary | default({})).get('external_cluster_metrics_remote_write_count', 0)) | int }}"
      external_user_workload_metrics_remote_write_count: "{{ ((day2_posture_summary | default({})).get('external_user_workload_metrics_remote_write_count', 0)) | int }}"
