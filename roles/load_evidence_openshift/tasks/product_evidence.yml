---
- name: Load product-specific evidence summaries
  ansible.builtin.include_role:
    name: load_evidence_openshift_product_slices
  when:
    - report_scope_requires_product_evidence_summary | default(true) | bool
    - report_scope_use_scoped_product_evidence_builder | default(false) | bool

- name: Load full product-specific evidence summaries
  ansible.builtin.include_role:
    name: load_evidence_openshift_products
  when:
    - report_scope_requires_product_evidence_summary | default(true) | bool
    - not (report_scope_use_scoped_product_evidence_builder | default(false) | bool)
