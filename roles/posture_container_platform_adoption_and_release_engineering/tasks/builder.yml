---
- name: Build container platform adoption and release engineering posture artifact facts
  ansible.builtin.set_fact:
    posture_artifact_key: container_platform_adoption_and_release_engineering
    posture_artifact_analysis_summary: "{{ release_engineering_adoption_summary | default({}) }}"
    posture_artifact_findings:
      cicd_runner_findings: "{{ (release_engineering_adoption_summary | default({})).get('runner_findings', []) }}"
      failed_pipelineruns: "{{ top_failed_pipelineruns | default([]) }}"
      buildconfigs_without_triggers: "{{ top_buildconfigs_without_triggers | default([]) }}"
    posture_artifact_render_inputs:
      release_engineering_adoption_summary: "{{ release_engineering_adoption_summary | default({}) }}"
      cicd_runner_summary: "{{ (release_engineering_adoption_summary | default({})).get('runner_summary', {}) }}"
      cicd_runner_findings: "{{ (release_engineering_adoption_summary | default({})).get('runner_findings', []) }}"
      buildconfig_strategy_counts: "{{ buildconfig_strategy_counts | default({}) }}"
      pipelinerun_status_counts: "{{ pipelinerun_status_counts | default({}) }}"
      failed_pipelineruns: "{{ top_failed_pipelineruns | default([]) }}"
      buildconfigs_without_triggers: "{{ top_buildconfigs_without_triggers | default([]) }}"
    posture_artifact_collection_inputs:
      pipeline_count: "{{ (release_engineering_adoption_summary | default({})).get('pipeline_count', 0) }}"
      pipelinerun_count: "{{ (release_engineering_adoption_summary | default({})).get('pipelinerun_count', 0) }}"
      buildconfig_count: "{{ (release_engineering_adoption_summary | default({})).get('buildconfig_count', 0) }}"
      build_count: "{{ (release_engineering_adoption_summary | default({})).get('build_count', 0) }}"
      imagestream_count: "{{ (release_engineering_adoption_summary | default({})).get('imagestream_count', 0) }}"
      failed_pipelinerun_count: "{{ (release_engineering_adoption_summary | default({})).get('failed_pipelinerun_count', 0) }}"
      triggerless_buildconfig_warning_count: "{{ (release_engineering_adoption_summary | default({})).get('triggerless_buildconfig_warning_count', 0) }}"
      triggerless_buildconfig_info_count: "{{ (release_engineering_adoption_summary | default({})).get('triggerless_buildconfig_info_count', 0) }}"
      external_delivery_evidence_present: "{{ (release_engineering_adoption_summary | default({})).get('external_delivery_evidence_present', false) }}"
      runner_pod_count: "{{ ((release_engineering_adoption_summary | default({})).get('runner_summary', {})).get('runner_pod_count', 0) }}"
    posture_artifact_section_fields:
      summary: "{{ release_engineering_adoption_summary | default({}) }}"
      recommendations: "{{ (release_engineering_adoption_summary | default({})).get('recommendation', 'Review failed pipelines, build-automation ownership, and cluster-hosted runner health before treating release engineering as healthy.') }}"
      release_engineering_adoption_summary: "{{ release_engineering_adoption_summary | default({}) }}"
      cicd_runner_summary: "{{ (release_engineering_adoption_summary | default({})).get('runner_summary', {}) }}"
      cicd_runner_findings: "{{ (release_engineering_adoption_summary | default({})).get('runner_findings', []) }}"
      buildconfig_strategy_counts: "{{ buildconfig_strategy_counts | default({}) }}"
      pipelinerun_status_counts: "{{ pipelinerun_status_counts | default({}) }}"
      failed_pipelineruns: "{{ top_failed_pipelineruns | default([]) }}"
      buildconfigs_without_triggers: "{{ top_buildconfigs_without_triggers | default([]) }}"
