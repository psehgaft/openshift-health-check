---
- name: Build workload health posture artifact facts
  ansible.builtin.set_fact:
    posture_artifact_key: workload_health
    posture_artifact_analysis_summary: "{{ workload_health_summary | default({}) }}"
    posture_artifact_findings:
      platform_pod_issues: "{{ platform_pod_issues | default([]) }}"
      unhealthy_user_pods: "{{ top_unhealthy_user_pods | default(unhealthy_user_pods | default([])) }}"
      workload_health_issues: "{{ top_workload_health_issues | default(workload_health_issues | default([])) }}"
      restart_hotspots: "{{ top_high_restart_pods | default(pod_restart_hotspots | default([])) }}"
      workload_resilience_findings: "{{ top_workload_resilience_findings | default((workload_resilience_data.findings | default([]))) }}"
      workload_resilience_pdb_review_findings: "{{ top_workload_resilience_pdb_review_findings | default((workload_resilience_data.pdb_review_findings | default([]))) }}"
      workload_resilience_summary:
        multi_replica_workload_count: "{{ workload_resilience_data.multi_replica_workload_count | default(0) }}"
        multi_replica_workloads_without_pdb: "{{ workload_resilience_data.multi_replica_workloads_without_pdb | default(0) }}"
        multi_replica_workloads_without_usable_pdb: "{{ workload_resilience_data.multi_replica_workloads_without_usable_pdb | default(0) }}"
        multi_replica_workloads_without_spread_policy: "{{ workload_resilience_data.multi_replica_workloads_without_spread_policy | default(0) }}"
        multi_replica_workloads_with_node_or_zone_spread_policy: "{{ workload_resilience_data.multi_replica_workloads_with_node_or_zone_spread_policy | default(0) }}"
        multi_replica_workloads_with_other_spread_policy: "{{ workload_resilience_data.multi_replica_workloads_with_other_spread_policy | default(0) }}"
      aged_user_pods: "{{ top_aged_user_pods | default(aged_user_pods | default([])) }}"
      high_replica_workloads: "{{ top_high_replica_workloads | default(high_replica_workloads | default([])) }}"
      orphan_pods: "{{ top_orphan_pods | default(orphan_pods | default([])) }}"
      workload_label_governance_findings: "{{ top_workload_label_governance_findings | default(workload_label_governance_findings | default([])) }}"
      node_label_governance_findings: "{{ top_node_label_governance_findings | default(node_label_governance_findings | default([])) }}"
      workload_resource_findings: "{{ top_workload_resource_findings | default(workload_resource_findings | default([])) }}"
      workload_probe_findings: "{{ top_workload_probe_findings | default(workload_probe_findings | default([])) }}"
      overprovisioned_pods: "{{ top_overprovisioned_pods | default(overprovisioned_pods | default([])) }}"
      stale_user_pods: "{{ top_stale_user_pods | default([]) }}"
      stale_configmaps: "{{ top_stale_configmaps | default([]) }}"
      stale_generic_secrets: "{{ top_stale_generic_secrets | default([]) }}"
      stale_dockerconfigjson_secrets: "{{ top_stale_dockerconfigjson_secrets | default([]) }}"
    posture_artifact_render_inputs:
      metric_source_status: "{{ (audit_report.domains.observability.prometheus_query | default({})).get('status', (prometheus_evidence_summary | default({})).get('status', 'not-collected')) }}"
      platform_pod_issues: "{{ platform_pod_issues | default([]) }}"
      unhealthy_user_pods: "{{ top_unhealthy_user_pods | default(unhealthy_user_pods | default([])) }}"
      workload_health_issues: "{{ top_workload_health_issues | default(workload_health_issues | default([])) }}"
      restart_hotspots: "{{ top_high_restart_pods | default(pod_restart_hotspots | default([])) }}"
      workload_resilience_findings: "{{ top_workload_resilience_findings | default((workload_resilience_data.findings | default([]))) }}"
      workload_resilience_pdb_review_findings: "{{ top_workload_resilience_pdb_review_findings | default((workload_resilience_data.pdb_review_findings | default([]))) }}"
      workload_resilience_summary:
        multi_replica_workload_count: "{{ workload_resilience_data.multi_replica_workload_count | default(0) }}"
        multi_replica_workloads_without_pdb: "{{ workload_resilience_data.multi_replica_workloads_without_pdb | default(0) }}"
        multi_replica_workloads_without_usable_pdb: "{{ workload_resilience_data.multi_replica_workloads_without_usable_pdb | default(0) }}"
        multi_replica_workloads_without_spread_policy: "{{ workload_resilience_data.multi_replica_workloads_without_spread_policy | default(0) }}"
        multi_replica_workloads_with_node_or_zone_spread_policy: "{{ workload_resilience_data.multi_replica_workloads_with_node_or_zone_spread_policy | default(0) }}"
        multi_replica_workloads_with_other_spread_policy: "{{ workload_resilience_data.multi_replica_workloads_with_other_spread_policy | default(0) }}"
      aged_user_pods: "{{ top_aged_user_pods | default(aged_user_pods | default([])) }}"
      high_replica_workloads: "{{ top_high_replica_workloads | default(high_replica_workloads | default([])) }}"
      orphan_pods: "{{ top_orphan_pods | default(orphan_pods | default([])) }}"
      workload_label_governance_findings: "{{ top_workload_label_governance_findings | default(workload_label_governance_findings | default([])) }}"
      node_label_governance_findings: "{{ top_node_label_governance_findings | default(node_label_governance_findings | default([])) }}"
      workload_resource_findings: "{{ top_workload_resource_findings | default(workload_resource_findings | default([])) }}"
      workload_probe_issue_type_counts: "{{ workload_probe_issue_type_counts | default({}) }}"
      workload_probe_findings: "{{ top_workload_probe_findings | default(workload_probe_findings | default([])) }}"
      overprovisioned_pods: "{{ top_overprovisioned_pods | default(overprovisioned_pods | default([])) }}"
      stale_user_pods: "{{ top_stale_user_pods | default([]) }}"
      stale_configmaps: "{{ top_stale_configmaps | default([]) }}"
      stale_generic_secrets: "{{ top_stale_generic_secrets | default([]) }}"
      stale_dockerconfigjson_secrets: "{{ top_stale_dockerconfigjson_secrets | default([]) }}"
      services_without_endpoints: "{{ top_services_without_endpoints | default(services_without_endpoints | default([])) }}"
      top_pod_cpu_usage_summary: "{{ top_pod_cpu_usage_summary | default([]) }}"
      top_pod_memory_usage_summary: "{{ top_pod_memory_usage_summary | default([]) }}"
    posture_artifact_collection_inputs:
      unhealthy_user_pod_count: "{{ (unhealthy_user_pods | default([])) | length }}"
      rollout_issue_count: "{{ (workload_health_issues | default([])) | length }}"
      restart_hotspot_count: "{{ (pod_restart_hotspots | default([])) | length }}"
      probe_finding_count: "{{ (workload_probe_findings | default([])) | length }}"
      overprovisioned_pod_count: "{{ (overprovisioned_pods | default([])) | length }}"
    posture_artifact_section_fields:
      summary: "{{ workload_health_summary | default({}) }}"
      recommendations: "{{ (workload_health_summary | default({})).get('recommendation', 'Review unhealthy user pods, rollout failures, restart hotspots, probe coverage, resource hygiene, ownership, labels, and rightsizing context before treating workload posture as healthy.') }}"
      platform_pod_issues: "{{ platform_pod_issues | default([]) }}"
      unhealthy_user_pods: "{{ top_unhealthy_user_pods | default(unhealthy_user_pods | default([])) }}"
      restart_hotspots: "{{ top_high_restart_pods | default(pod_restart_hotspots | default([])) }}"
      aged_user_pods: "{{ top_aged_user_pods | default(aged_user_pods | default([])) }}"
      workload_health_issues: "{{ top_workload_health_issues | default(workload_health_issues | default([])) }}"
      high_replica_workloads: "{{ top_high_replica_workloads | default(high_replica_workloads | default([])) }}"
      workload_resilience_findings: "{{ top_workload_resilience_findings | default((workload_resilience_data.findings | default([]))) }}"
      workload_resilience_pdb_review_findings: "{{ top_workload_resilience_pdb_review_findings | default((workload_resilience_data.pdb_review_findings | default([]))) }}"
      workload_resilience_summary:
        multi_replica_workload_count: "{{ workload_resilience_data.multi_replica_workload_count | default(0) }}"
        multi_replica_workloads_without_pdb: "{{ workload_resilience_data.multi_replica_workloads_without_pdb | default(0) }}"
        multi_replica_workloads_without_usable_pdb: "{{ workload_resilience_data.multi_replica_workloads_without_usable_pdb | default(0) }}"
        multi_replica_workloads_without_spread_policy: "{{ workload_resilience_data.multi_replica_workloads_without_spread_policy | default(0) }}"
        multi_replica_workloads_with_node_or_zone_spread_policy: "{{ workload_resilience_data.multi_replica_workloads_with_node_or_zone_spread_policy | default(0) }}"
        multi_replica_workloads_with_other_spread_policy: "{{ workload_resilience_data.multi_replica_workloads_with_other_spread_policy | default(0) }}"
      orphan_pods: "{{ top_orphan_pods | default(orphan_pods | default([])) }}"
      workload_label_governance_findings: "{{ top_workload_label_governance_findings | default(workload_label_governance_findings | default([])) }}"
      node_label_governance_findings: "{{ top_node_label_governance_findings | default(node_label_governance_findings | default([])) }}"
      workload_resource_findings: "{{ top_workload_resource_findings | default(workload_resource_findings | default([])) }}"
      workload_probe_issue_type_counts: "{{ workload_probe_issue_type_counts | default({}) }}"
      workload_probe_findings: "{{ top_workload_probe_findings | default(workload_probe_findings | default([])) }}"
      overprovisioned_pods: "{{ top_overprovisioned_pods | default(overprovisioned_pods | default([])) }}"
      stale_user_pods: "{{ top_stale_user_pods | default([]) }}"
      stale_configmaps: "{{ top_stale_configmaps | default([]) }}"
      stale_generic_secrets: "{{ top_stale_generic_secrets | default([]) }}"
      stale_dockerconfigjson_secrets: "{{ top_stale_dockerconfigjson_secrets | default([]) }}"
      services_without_endpoints: "{{ top_services_without_endpoints | default(services_without_endpoints | default([])) }}"
      metric_source_status: "{{ (audit_report.domains.observability.prometheus_query | default({})).get('status', (prometheus_evidence_summary | default({})).get('status', 'not-collected')) }}"
      top_pod_cpu_usage_summary: "{{ top_pod_cpu_usage_summary | default([]) }}"
      top_pod_memory_usage_summary: "{{ top_pod_memory_usage_summary | default([]) }}"
