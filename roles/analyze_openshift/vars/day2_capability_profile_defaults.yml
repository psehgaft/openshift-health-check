---
openshift_report_capability_profile_defaults:
  application_backup_and_restore_readiness:
    required: true
    criticality: critical
    expected_state: healthy
    owner: operations
    evidence_required: [must-gather, inspect, oc-get]
    notes: "Production clusters should have OADP application backup schedules plus successful backup and restore evidence."
    docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/backup_and_restore/oadp-application-backup-and-restore"
  control_plane_backup_and_recovery_readiness:
    required: true
    criticality: critical
    expected_state: healthy
    owner: operations
    evidence_required: [must-gather, inspect, oc-get, oc-debug-node]
    notes: "Self-managed OpenShift clusters should have recurring etcd snapshot backups, off-cluster retention of snapshot and static pod resources, and tested control-plane recovery procedures."
    docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/etcd/backing-up-and-restoring-etcd-data"
  declarative_gitops_operations:
    required: true
    criticality: high
    expected_state: healthy
    owner: operations
    evidence_required: [must-gather, inspect, oc-get]
    notes: "Declarative operations are expected for most production OpenShift environments, including Git-backed Argo CD Application inventory that represents the intended reconciliation model."
    docs: "https://docs.redhat.com/en/documentation/red_hat_openshift_gitops/1.20/html/declarative_cluster_configuration/index"
  cluster_log_forwarding:
    required: true
    criticality: high
    expected_state: healthy
    owner: observability
    evidence_required: [must-gather, oc-get]
    notes: "Application, infrastructure, and audit log collection should be configured and forwarded to the intended external destination when centralized log retention is part of the operating model."
    docs: "https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.4/html/configuring_logging/configuring-log-forwarding"
  external_alert_delivery:
    required: true
    criticality: high
    expected_state: healthy
    owner: observability
    evidence_required: [must-gather, oc-get]
    notes: "Production alerts should have accountable external receivers configured and referenced by alert routing so notifications can leave the cluster through the intended path."
    docs: "https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/configuring_core_platform_monitoring/configuring-alerts-and-notifications"
  user_workload_metrics_monitoring:
    required: true
    criticality: high
    expected_state: configured
    owner: observability
    evidence_required: [must-gather, oc-get]
    notes: "Most production clusters need user workload metrics enabled or an approved alternate monitoring path."
    docs: "https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/configuring_user_workload_monitoring/index"
  persistent_monitoring_storage:
    required: true
    criticality: high
    expected_state: healthy
    owner: observability
    evidence_required: [must-gather, oc-get]
    notes: "Persistent storage is expected for Prometheus and Alertmanager, and for Thanos Ruler on multi-node clusters, to preserve monitoring continuity and high availability."
    docs: "https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html-single/configuring_core_platform_monitoring/configuring_core_platform_monitoring"
  oauth_external_identity_provider:
    required: true
    criticality: high
    expected_state: healthy
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Production OpenShift clusters should have at least one configured external OAuth identity provider rather than relying only on local identity providers or kubeadmin fallback."
    docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/authentication_and_authorization/configuring-identity-providers"
  machine_health_check_remediation:
    required: true
    criticality: high
    expected_state: present
    owner: platform
    evidence_required: [must-gather, oc-get]
    notes: "Worker auto-remediation is expected for most production clusters that use Machine API-managed worker pools, except where the customer intentionally does not use MachineHealthCheck remediation."
    docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/machine_management/index"
  etcd_encryption:
    required: true
    criticality: high
    expected_state: healthy
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "OpenShift API resources stored in etcd should be encrypted at rest and the encryption rollout should be completed across the reporting API server components."
    docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/etcd/etcd#enabling-etcd-encryption_encrypting-etcd"
  platform_encryption_at_rest:
    required: true
    criticality: high
    expected_state: healthy
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Production clusters should have an explicit data-at-rest encryption posture with completed etcd encryption rollout across the API server components that report encryption status."
    docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/etcd/etcd#enabling-etcd-encryption_encrypting-etcd"
  image_registry_policy_governance:
    required: true
    criticality: medium
    expected_state: healthy
    owner: security
    evidence_required: [must-gather, oc-get]
    notes: "Image registry exposure, import filters, insecure registry configuration, internal-registry workload use, and pruning posture should be intentionally governed with no outstanding registry-policy findings."
    docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/registry/index"
  namespace_network_policy_baseline:
    required: true
    criticality: medium
    expected_state: healthy
    owner: network
    evidence_required: [must-gather, oc-get]
    notes: "Multi-tenant production clusters should have NetworkPolicy baseline coverage across observed user namespaces, or documented exceptions where tenant isolation is intentionally not enforced."
    docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/network_security/network-policy"
  multi_tenant_namespace_governance:
    required: true
    criticality: medium
    expected_state: healthy
    owner: operations
    evidence_required: [must-gather, oc-get]
    notes: "Shared clusters should have an intentional team onboarding path for projects or namespaces, and non-admin users should not be able to self-provision namespaces directly. Validate disabled self-provisioning plus baseline tenant guardrails, including NetworkPolicy coverage, ResourceQuota coverage, and LimitRange coverage or documented exceptions."
    docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/building_applications/projects"
