    top_apiservice_issues: "{{ openshift_aggregate_facts.top_apiservice_issues | default([]) }}"
    top_failed_pipelineruns: "{{ openshift_aggregate_facts.top_failed_pipelineruns | default([]) }}"
    top_buildconfigs_without_triggers: "{{ openshift_aggregate_facts.top_buildconfigs_without_triggers | default([]) }}"
    top_compliance_suite_findings: "{{ openshift_aggregate_facts.top_compliance_suite_findings | default([]) }}"
    top_compliance_standards_findings: "{{ openshift_aggregate_facts.top_compliance_standards_findings | default([]) }}"
    top_backup_posture_findings: "{{ openshift_aggregate_facts.top_backup_posture_findings | default([]) }}"
    top_machine_healthcheck_findings: "{{ openshift_aggregate_facts.top_machine_healthcheck_findings | default([]) }}"
    top_day2_posture_findings: "{{ openshift_aggregate_facts.top_day2_posture_findings | default([]) }}"
    top_live_cluster_compare_findings: "{{ openshift_aggregate_facts.top_live_cluster_compare_findings | default([]) }}"
    top_live_managed_gate_findings: "{{ openshift_aggregate_facts.top_live_managed_gate_findings | default([]) }}"
    top_live_advisor_findings: "{{ openshift_aggregate_facts.top_live_advisor_findings | default([]) }}"
    top_live_must_gather_findings: "{{ openshift_aggregate_facts.top_live_must_gather_findings | default([]) }}"
    top_live_omc_findings: "{{ openshift_aggregate_facts.top_live_omc_findings | default([]) }}"
    top_live_inspect_findings: "{{ openshift_aggregate_facts.top_live_inspect_findings | default([]) }}"
    top_live_sosreport_findings: "{{ openshift_aggregate_facts.top_live_sosreport_findings | default([]) }}"
    top_scc_grant_findings: "{{ openshift_aggregate_facts.top_scc_grant_findings | default([]) }}"
    top_scc_pod_findings: "{{ openshift_aggregate_facts.top_scc_pod_findings | default([]) }}"
    top_namespace_metadata_governance_findings: "{{ openshift_aggregate_facts.top_namespace_metadata_governance_findings | default([]) }}"
    top_privileged_serviceaccount_access: "{{ openshift_aggregate_facts.top_privileged_serviceaccount_access | default([]) }}"
    top_privileged_user_access: "{{ openshift_aggregate_facts.top_privileged_user_access | default([]) }}"
    top_privileged_group_access: "{{ openshift_aggregate_facts.top_privileged_group_access | default([]) }}"
    top_stale_access_review_serviceaccounts: "{{ openshift_aggregate_facts.top_stale_access_review_serviceaccounts | default([]) }}"
    top_stale_access_review_users: "{{ openshift_aggregate_facts.top_stale_access_review_users | default([]) }}"
    top_stale_access_review_groups: "{{ openshift_aggregate_facts.top_stale_access_review_groups | default([]) }}"
    security_issue_type_counts: "{{ openshift_aggregate_facts.security_issue_type_counts | default({}) }}"
    workload_practice_issue_type_counts: "{{ openshift_aggregate_facts.workload_practice_issue_type_counts | default({}) }}"
    workload_probe_issue_type_counts: "{{ openshift_aggregate_facts.workload_probe_issue_type_counts | default({}) }}"
  changed_when: false
