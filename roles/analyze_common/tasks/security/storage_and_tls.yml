- name: Build bundled storage and TLS input facts
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_common_storage_tls_bundle.py"
    stdin: >-
      {{
        {
          "storageclasses": (analysis_graph.storageclasses | default({})).get('items', []),
          "persistentvolumes": (analysis_graph.persistentvolumes | default({})).get('items', []),
          "persistentvolumeclaims": (analysis_graph.persistentvolumeclaims | default({})).get('items', []),
          "secrets": (analysis_graph.secrets | default({})).get('items', []),
          "security_findings": security_findings | default([]),
          "workload_practice_findings": workload_practice_findings | default([])
        } | to_json
      }}
  register: storage_tls_bundle_cmd
  changed_when: false
  failed_when: false

- name: Normalize bundled storage and TLS input facts
  ansible.builtin.set_fact:
    storage_tls_bundle: >-
      {{
        storage_tls_bundle_cmd.stdout | from_json
        if (storage_tls_bundle_cmd.rc == 0 and (storage_tls_bundle_cmd.stdout | default('') | length > 0))
        else {
          'storage_tls_input_facts': {
            'storageclass_summary': [],
            'pv_phase_counts': {},
            'pv_issues': [],
            'pvc_phase_counts': {},
            'pvc_issues': [],
            'tls_secret_expiry_targets': [],
            'certificate_expiry_findings': []
          },
          'storageclass_summary': [],
          'pv_phase_counts': {},
          'pv_issues': [],
          'pvc_phase_counts': {},
          'pvc_issues': [],
          'tls_secret_expiry_targets': [],
          'certificate_expiry_findings': [],
          'storage_posture_summary': {
            'external_storageclass_count': 0,
            'local_storageclass_count': 0,
            'default_external_storageclass_count': 0,
            'external_storageclass_names': [],
            'local_storageclass_names': [],
            'external_pv_count': 0,
            'local_pv_count': 0,
            'hostpath_workload_count': 0,
            'ephemeral_workload_count': 0,
            'has_external_storage_provider': false,
            'local_or_ephemeral_only_risk': false,
            'findings': []
          }
        }
      }}

- name: Expand bundled storage and TLS input facts
  ansible.builtin.set_fact:
    storage_tls_input_facts: "{{ storage_tls_bundle.storage_tls_input_facts | default({}) }}"
    storageclass_summary: "{{ storage_tls_bundle.storageclass_summary | default([]) }}"
    pv_phase_counts: "{{ storage_tls_bundle.pv_phase_counts | default({}) }}"
    pv_issues: "{{ storage_tls_bundle.pv_issues | default([]) }}"
    pvc_phase_counts: "{{ storage_tls_bundle.pvc_phase_counts | default({}) }}"
    pvc_issues: "{{ storage_tls_bundle.pvc_issues | default([]) }}"
    tls_secret_expiry_targets: "{{ storage_tls_bundle.tls_secret_expiry_targets | default([]) }}"
    certificate_expiry_findings: "{{ storage_tls_bundle.certificate_expiry_findings | default([]) }}"
    storage_posture_summary: "{{ storage_tls_bundle.storage_posture_summary | default({'external_storageclass_count': 0, 'local_storageclass_count': 0, 'default_external_storageclass_count': 0, 'external_storageclass_names': [], 'local_storageclass_names': [], 'external_pv_count': 0, 'local_pv_count': 0, 'hostpath_workload_count': 0, 'ephemeral_workload_count': 0, 'has_external_storage_provider': false, 'local_or_ephemeral_only_risk': false, 'findings': []}) }}"
  changed_when: false

- name: Collect TLS secret certificate expiry with openssl
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/batch_tls_secret_expiry.py"
    stdin: >-
      {{
        {
          "timeout_seconds": 20,
          "parallelism": effective_analysis_parallelism | default(analysis_parallelism | default(collection_parallelism | default(4))),
          "secrets": tls_secret_expiry_targets | default([])
        } | to_json
      }}
  register: tls_secret_cert_expiry_cmd
  changed_when: false
  failed_when: false

- name: Build certificate expiry findings
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_storage_tls_facts.py"
    stdin: >-
      {{
        {
          "certificate_expiry_results": ((tls_secret_cert_expiry_cmd.stdout | from_json).results if (tls_secret_cert_expiry_cmd.rc == 0 and (tls_secret_cert_expiry_cmd.stdout | default('') | length > 0)) else [])
        } | to_json
      }}
  register: certificate_expiry_findings_cmd
  changed_when: false
  failed_when: false

- name: Normalize certificate expiry findings
  ansible.builtin.set_fact:
    certificate_expiry_findings: "{{ (certificate_expiry_findings_cmd.stdout | from_json).certificate_expiry_findings if (certificate_expiry_findings_cmd.rc == 0 and (certificate_expiry_findings_cmd.stdout | default('') | length > 0)) else [] }}"
  changed_when: false
