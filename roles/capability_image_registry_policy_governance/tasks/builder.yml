---
- name: Build image registry policy governance capability artifact facts
  vars:
    day2_image_registry_policy_governance_section_current: "{{ (day2_capability_sections_by_key | default({})).get('image_registry_policy_governance', {}) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: image_registry_policy_governance
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      security_governance_status: "{{ day2_image_registry_policy_governance_section_current.status | default('unknown') }}"
      security_governance_reason_summary: "{{ day2_image_registry_policy_governance_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_image_registry_policy_governance_section: "{{ day2_image_registry_policy_governance_section_current }}"
    capability_artifact_collection_inputs:
      image_registry_findings_count: "{{ (image_registry_findings | default([]) | length) | int }}"
      image_registry_issue_names: "{{ image_registry_findings | default([]) | map(attribute='issue') | reject('equalto', '') | list }}"
