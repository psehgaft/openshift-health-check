---
- name: Detect operator-managed workload namespaces
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_operator_managed_namespaces.py"
    stdin: "{{ {
      'namespaces': ((analysis_graph.namespaces | default({})).get('items', [])),
      'deployments': ((analysis_graph.deployments | default({})).get('items', [])),
      'statefulsets': ((analysis_graph.statefulsets | default({})).get('items', [])),
      'daemonsets': ((analysis_graph.daemonsets | default({})).get('items', [])),
      'deploymentconfigs': ((analysis_graph.deploymentconfigs | default({})).get('items', [])),
      'subscriptions': ((analysis_graph.subscriptions | default({})).get('items', []))
    } | to_json }}"
  register: operator_managed_namespaces_cmd
  changed_when: false
  failed_when: operator_managed_namespaces_cmd.rc != 0 or (operator_managed_namespaces_cmd.stdout | default('') | length == 0)

- name: Normalize operator-managed workload namespaces
  ansible.builtin.set_fact:
    operator_managed_namespace_names: "{{ (operator_managed_namespaces_cmd.stdout | from_json).operator_managed_namespace_names | default([]) }}"
  changed_when: false

- name: Run common workload health and resilience analysis
  ansible.builtin.include_tasks: workload/health_and_resilience.yml

- name: Run common workload governance analysis
  ansible.builtin.include_tasks: workload/governance.yml

- name: Run common workload probe coverage analysis when not bundled
  ansible.builtin.include_tasks: workload/probe_coverage.yml
  when: workload_analysis_bundle is not defined
