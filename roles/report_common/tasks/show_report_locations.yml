---
- name: Show report locations
  ansible.builtin.debug:
    msg:
      - "Health report generated: {{ report_path }}"
      - "JSON report generated: {{ report_json_path }}"
      - "HTML report generated: {{ report_html_path if (execution_stats.report_formats_generated.html | default(false)) else 'skipped' }}"
      - "PDF report generated: {{ report_pdf_path if (execution_stats.report_formats_generated.pdf | default(false)) else (report_pdf_status_reason | default('skipped')) }}"
      - "Overall status: {{ report_status_value }}"
      - "Audit score: {{ report_score_total }}/{{ report_score_max }}"
      - "Cluster health score: {{ report_health_score }}/100 ({{ report_health_score_label }})"
      - "Latest checkpoint stage: {{ report_resume_last_completed_stage | default('none') }}"
      - "Checkpoint manifest: {{ report_resume_manifest_path | default('not-configured') }}"
