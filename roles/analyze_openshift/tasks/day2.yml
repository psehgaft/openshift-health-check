---
- name: Build production Day 2 posture summary
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json

    data = json.loads(r'''{{ {
      "cluster_profile": cluster_profile | default({}),
      "network_config": analysis_graph.network_config | default({}),
      "apiserver_config": analysis_graph.apiserver_config | default({}),
      "proxy_config": analysis_graph.proxy_config | default({}),
      "image_config": analysis_graph.image_config | default({}),
      "imagedigestmirrorsets": (analysis_graph.imagedigestmirrorsets | default({})).get('items', []),
      "imagetagmirrorsets": (analysis_graph.imagetagmirrorsets | default({})).get('items', []),
      "imagecontentsourcepolicies": (analysis_graph.imagecontentsourcepolicies | default({})).get('items', []),
      "catalogsources": (analysis_graph.catalogsources | default({})).get('items', []),
      "clusteroperators": clusteroperator_status_map | default({}),
      "cluster_monitoring_config": cluster_monitoring_config_parsed | default({}),
      "user_workload_monitoring_config": user_workload_monitoring_config_parsed | default({}),
      "subscriptions": (analysis_graph.subscriptions | default({})).get('items', []),
      "pods": (analysis_graph.pods | default({})).get('items', []),
      "deployments": (analysis_graph.deployments | default({})).get('items', []),
      "statefulsets": (analysis_graph.statefulsets | default({})).get('items', []),
      "daemonsets": (analysis_graph.daemonsets | default({})).get('items', []),
      "serviceaccounts": (analysis_graph.serviceaccounts | default({})).get('items', []),
      "secrets": (analysis_graph.secrets | default({})).get('items', []),
      "configmaps": (analysis_graph.configmaps | default({})).get('items', []),
      "crds": (analysis_graph.crds | default({})).get('items', []),
      "servicemonitors": (analysis_graph.servicemonitors | default({})).get('items', []),
      "podmonitors": (analysis_graph.podmonitors | default({})).get('items', []),
      "argocds": (analysis_graph.argocds | default({})).get('items', []),
      "gitops_applications": (analysis_graph.gitops_applications | default({})).get('items', []),
      "gitops_appprojects": (analysis_graph.gitops_appprojects | default({})).get('items', []),
      "clusterautoscalers": (analysis_graph.clusterautoscalers | default({})).get('items', []),
      "klusterlets": (analysis_graph.klusterlets | default({})).get('items', []),
      "managedclusteraddons": (analysis_graph.managedclusteraddons | default({})).get('items', []),
      "clustersecretstores": (analysis_graph.clustersecretstores | default({})).get('items', []),
      "secretstores": (analysis_graph.secretstores | default({})).get('items', []),
      "externalsecrets": (analysis_graph.externalsecrets | default({})).get('items', []),
      "namespaces": (analysis_graph.namespaces | default({})).get('items', []),
      "clusterlogforwarders": (analysis_graph.clusterlogforwarders | default({})).get('items', []),
      "backupstoragelocations": (analysis_graph.backupstoragelocations | default({})).get('items', []),
      "schedules": (analysis_graph.schedules | default({})).get('items', []),
      "dataprotectionapplications": (analysis_graph.dataprotectionapplications | default({})).get('items', []),
      "compliancesuites": (analysis_graph.compliancesuites | default({})).get('items', []),
      "machinehealthchecks": (analysis_graph.machinehealthchecks | default({})).get('items', []),
      "machinesets": (analysis_graph.machinesets | default({})).get('items', []),
      "backup_posture": backup_posture_data | default({}),
      "observability_forwarding_summary": observability_forwarding_summary | default({}),
      "observability_findings": observability_findings | default([]),
      "identity_provider_count": (cluster_profile.identity_provider_count | default(0)),
      "image_registry_findings": image_registry_findings | default([]),
      "machine_healthcheck_findings": machine_healthcheck_findings | default([]),
      "compliance_suite_findings": compliance_suite_findings | default([]),
      "backup_posture_findings": backup_posture_findings | default([]),
      "capability_profile": openshift_report_capability_profile | default({})
    } | to_json }}''')

    platform = str((((data.get("cluster_profile") or {}).get("platform")) or "unknown")).strip()
    deployment_type = str((((data.get("cluster_profile") or {}).get("deployment_type")) or "openshift")).strip().lower()
    managed_deployment_types = {"aro", "rosa", "rosa-hcp", "osd"}
    cloud_managed = deployment_type in managed_deployment_types
    is_sno = bool(((data.get("cluster_profile") or {}).get("is_sno")) or False)
    is_hosted_control_plane = bool(((data.get("cluster_profile") or {}).get("is_hosted_control_plane")) or False)

    cmc = data.get("cluster_monitoring_config") or {}
    network_config = data.get("network_config") or {}
    apiserver_config = data.get("apiserver_config") or {}
    proxy_config = data.get("proxy_config") or {}
    image_config = data.get("image_config") or {}
    imagedigestmirrorsets = data.get("imagedigestmirrorsets") or []
    imagetagmirrorsets = data.get("imagetagmirrorsets") or []
    imagecontentsourcepolicies = data.get("imagecontentsourcepolicies") or []
    catalogsources = data.get("catalogsources") or []
    uwm = data.get("user_workload_monitoring_config") or {}
    prom_k8s = (cmc.get("prometheusK8s") or {})
    alertmanager_main = (cmc.get("alertmanagerMain") or {})
    enable_user_workload = bool(cmc.get("enableUserWorkload", False))
    monitoring_persistent = bool(prom_k8s.get("volumeClaimTemplate")) and bool(alertmanager_main.get("volumeClaimTemplate"))
    default_network = ((network_config.get("spec") or {}).get("defaultNetwork") or {})
    ovn_config = default_network.get("ovnKubernetesConfig") or {}
    ipsec_config = ovn_config.get("ipsecConfig")
    ipsec_enabled = isinstance(ipsec_config, dict)
    ipsec_mode = str((ipsec_config or {}).get("mode") or ("Full" if ipsec_enabled else "Disabled"))
    network_type = str(((network_config.get("status") or {}).get("networkType") or default_network.get("type") or "unknown"))
    etcd_encryption_type = str((((apiserver_config.get("spec") or {}).get("encryption") or {}).get("type") or "identity")).strip().lower()
    etcd_encryption_enabled = etcd_encryption_type in {"aescbc", "aesgcm"}
    etcd_encryption_condition = next(
        (
            item for item in ((apiserver_config.get("status") or {}).get("conditions") or [])
            if str(item.get("type") or "").lower() == "encrypted"
        ),
        {},
    )
    etcd_encryption_complete = str(etcd_encryption_condition.get("status") or "").lower() == "true"
    proxy_spec = proxy_config.get("spec") or {}
    image_spec = image_config.get("spec") or {}
    cluster_proxy_configured = bool(proxy_spec.get("httpProxy") or proxy_spec.get("httpsProxy"))
    custom_ca_configured = bool(
        ((proxy_spec.get("trustedCA") or {}).get("name"))
        or ((image_spec.get("additionalTrustedCA") or {}).get("name"))
    )
    registry_sources = image_spec.get("registrySources") or {}
    mirror_resource_count = len(imagedigestmirrorsets) + len(imagetagmirrorsets) + len(imagecontentsourcepolicies)
    restricted_registry_sources = bool(registry_sources.get("allowedRegistries") or registry_sources.get("blockedRegistries"))
    disconnected_catalog_count = len([
        item for item in catalogsources
        if str((((item.get("spec") or {}).get("image")) or "")).strip()
        and not any(public in str((((item.get("spec") or {}).get("image")) or "")).lower() for public in ["registry.redhat.io", "quay.io", "registry.connect.redhat.com"])
    ])
    private_registry_mirrors_present = mirror_resource_count > 0
    disconnected_installation_present = mirror_resource_count > 0 or disconnected_catalog_count > 0

    argocds = data.get("argocds") or []
    subscriptions = data.get("subscriptions") or []
    gitops_apps = data.get("gitops_applications") or []
    gitops_projects = data.get("gitops_appprojects") or []
    clustersecretstores = data.get("clustersecretstores") or []
    secretstores = data.get("secretstores") or []
    externalsecrets = data.get("externalsecrets") or []
    clusterautoscalers = data.get("clusterautoscalers") or []
    klusterlets = data.get("klusterlets") or []
    managedclusteraddons = data.get("managedclusteraddons") or []
    namespaces = data.get("namespaces") or []
    pods = data.get("pods") or []
    deployments = data.get("deployments") or []
    statefulsets = data.get("statefulsets") or []
    daemonsets = data.get("daemonsets") or []
    serviceaccounts = data.get("serviceaccounts") or []
    secrets = data.get("secrets") or []
    configmaps = data.get("configmaps") or []
    crds = data.get("crds") or []
    servicemonitors = data.get("servicemonitors") or []
    podmonitors = data.get("podmonitors") or []
    clusterlogforwarders = data.get("clusterlogforwarders") or []
    backupstoragelocations = data.get("backupstoragelocations") or []
    schedules = data.get("schedules") or []
    dataprotectionapplications = data.get("dataprotectionapplications") or []
    compliancesuites = data.get("compliancesuites") or []
    machinehealthchecks = data.get("machinehealthchecks") or []
    machinesets = data.get("machinesets") or []
    operators = data.get("clusteroperators") or {}
    obs = data.get("observability_forwarding_summary") or {}
    backup_posture = data.get("backup_posture") or {}

    insights = operators.get("insights", {}) or {}
    insights_healthy = insights.get("available") == "True" and insights.get("degraded") != "True"
    namespace_names = {((item.get("metadata") or {}).get("name") or "") for item in namespaces}
    acm_agent_namespaces = sorted(
        name for name in namespace_names
        if name in {"open-cluster-management-agent", "open-cluster-management-agent-addon"}
    )
    subscription_packages = {
        str((((item.get("spec") or {}).get("name")) or "")).strip()
        for item in subscriptions
        if str((((item.get("spec") or {}).get("name")) or "")).strip()
    }
    subscription_namespaces = {
        str((((item.get("metadata") or {}).get("namespace")) or "")).strip()
        for item in subscriptions
        if str((((item.get("metadata") or {}).get("namespace")) or "")).strip()
    }

    def pod_spec_from(obj):
        spec = obj.get("spec") or {}
        return ((spec.get("template") or {}).get("spec") or spec)

    def text_blob(obj):
        meta = obj.get("metadata") or {}
        labels = meta.get("labels") or {}
        spec = pod_spec_from(obj)
        parts = [meta.get("name") or "", meta.get("namespace") or ""]
        parts.extend([str(k) for k in labels.keys()])
        parts.extend([str(v) for v in labels.values()])
        for container in (spec.get("containers") or []) + (spec.get("initContainers") or []):
            parts.extend([container.get("name") or "", container.get("image") or ""])
        return " ".join(parts).lower()

    def any_keyword(keywords, values):
        return any(any(keyword in value for keyword in keywords) for value in values)

    crd_names = {((item.get("metadata") or {}).get("name") or "").lower() for item in crds}

    def crd_has(*needles):
        return any(any(needle in name for needle in needles) for name in crd_names)

    def image_registry(image):
        value = str(image or "").strip()
        first = value.split("/", 1)[0]
        if "." in first or ":" in first or first == "localhost":
            return first.lower()
        return "docker.io"

    all_workloads = pods + deployments + statefulsets + daemonsets
    all_workload_blobs = [text_blob(item) for item in all_workloads]
    internal_registry_markers = [
        ".svc", ".cluster.local", "image-registry.openshift-image-registry.svc",
        "quay.io/openshift", "registry.redhat.io", "registry.access.redhat.com",
    ]
    public_registry_names = {"docker.io", "index.docker.io", "quay.io", "ghcr.io", "gcr.io", "registry.k8s.io", "k8s.gcr.io"}
    external_image_registries = set()
    credentialed_public_image_registries = set()
    workloads_with_pull_secret = 0
    for obj in all_workloads:
        spec = pod_spec_from(obj)
        pull_secrets = spec.get("imagePullSecrets") or []
        if pull_secrets:
            workloads_with_pull_secret += 1
        for container in (spec.get("containers") or []) + (spec.get("initContainers") or []):
            registry = image_registry(container.get("image"))
            if registry and registry not in public_registry_names and not any(marker in registry for marker in internal_registry_markers):
                external_image_registries.add(registry)
            elif registry in public_registry_names and pull_secrets:
                credentialed_public_image_registries.add(registry)
    dockerconfig_secret_count = len([item for item in secrets if item.get("type") in ["kubernetes.io/dockerconfigjson", "kubernetes.io/dockercfg"]])
    serviceaccount_pull_secret_count = sum(len((item.get("imagePullSecrets") or [])) for item in serviceaccounts)
    external_private_registry_present = (len(external_image_registries) > 0 and (
        workloads_with_pull_secret > 0 or dockerconfig_secret_count > 0 or serviceaccount_pull_secret_count > 0
    )) or len(credentialed_public_image_registries) > 0
    dashboard_configmaps = [
        item for item in configmaps
        if (
            any("grafana_dashboard" in str(k).lower() or "grafana_dashboard" in str(v).lower() for k, v in ((item.get("metadata") or {}).get("labels") or {}).items())
            or any(str(key).lower().endswith(".json") and "dashboard" in str(value).lower() for key, value in ((item.get("data") or {}).items()))
        )
    ]
    grafana_present = any_keyword(["grafana"], all_workload_blobs) or "grafana" in namespace_names
    grafana_dashboard_present = grafana_present and (len(dashboard_configmaps) > 0 or crd_has("grafanadashboards", "grafana.integreatly.org", "grafana.com"))
    workload_scanner_present = (
        any_keyword(["trivy-operator", "starboard", "stackrox", "collector", "sensor", "twistlock", "defender", "sysdig-agent", "falco"], all_workload_blobs)
        or crd_has("aquasecurity.github.io", "vulnerabilityreports", "stackrox.io", "falcosecurity.dev", "falco.org")
        or "stackrox" in namespace_names
    )
    gitops_application_names = {
        str((((item.get("metadata") or {}).get("name")) or "")).strip()
        for item in gitops_apps
        if str((((item.get("metadata") or {}).get("name")) or "")).strip()
    }

    checks = []
    findings = []
    capability_profile = data.get("capability_profile") or {}

    def level_rank(value):
        return {"required": 3, "recommended": 2, "informational": 1}.get(value, 2)

    def normalize_level(value):
        if value in {"required", "recommended", "informational"}:
            return value
        return "recommended"

    def choose_level(*values):
        normalized = [normalize_level(v) for v in values if v]
        return max(normalized, key=level_rank) if normalized else "recommended"

    def cap(key):
        value = capability_profile.get(key) or {}
        return value if isinstance(value, dict) else {}

    def cap_required(key):
        return bool(cap(key).get("required", False))

    def cap_expected_state(key, fallback="present"):
        value = str(cap(key).get("expected_state") or fallback).strip().lower()
        return value if value in {"present", "absent", "configured", "healthy", "not_applicable"} else fallback

    def cap_owner(key, fallback="platform"):
        return str(cap(key).get("owner") or fallback).strip() or fallback

    def cap_criticality(key, fallback="medium"):
        value = str(cap(key).get("criticality") or fallback).strip().lower()
        return value if value in {"critical", "high", "medium", "low", "info"} else fallback

    def cap_level(key, fallback):
        if cap_expected_state(key) == "not_applicable":
            return "informational"
        if cap_required(key):
            return "required"
        return normalize_level(fallback)

    def cap_failure_severity(key, fallback="warning"):
        if not cap_required(key):
            return "info"
        criticality = cap_criticality(key)
        return "critical" if criticality == "critical" else fallback

    def cap_status_for_presence(key, present, healthy=True):
        expected = cap_expected_state(key)
        if expected == "not_applicable":
            return "INFO"
        if expected == "absent":
            return "WARN" if present else "OK"
        if expected == "healthy":
            return "OK" if present and healthy else ("WARN" if cap_required(key) else "INFO")
        return "OK" if present else ("WARN" if cap_required(key) else "INFO")

    cluster_shape = "single-node" if is_sno else ("hosted-control-plane" if is_hosted_control_plane else "multi-node")
    provider_baseline = deployment_type if cloud_managed else "self-managed"
    control_plane_mode = "hosted" if is_hosted_control_plane else ("single-replica" if is_sno else "classic")
    day2_baseline_profile = {
        "provider": provider_baseline,
        "cluster_shape": cluster_shape,
        "control_plane_mode": control_plane_mode,
    }

    base_required_level = "recommended" if is_sno else "required"
    telemetry_level = "required" if cloud_managed else "recommended"
    external_secrets_level = cap_level("external_secrets", "required" if platform == "Azure" else ("recommended" if cloud_managed else "informational"))
    compliance_level = cap_level("compliance", "informational" if is_sno else "recommended")
    insights_level = "recommended" if cloud_managed else "informational"
    namespace_guardrails_level = cap_level("multi_tenancy_governance", "informational" if is_sno else "recommended")
    pipelines_level = cap_level("pipelines", "informational" if is_sno else "recommended")
    cert_manager_level = cap_level("cert_manager", "informational" if is_sno else "recommended")
    acs_level = cap_level("acs", "recommended" if cloud_managed and not is_sno else "informational")
    machine_remediation_level = cap_level("machine_health_checks", "recommended" if (cloud_managed and len(machinesets) > 0 and not is_sno and not is_hosted_control_plane) else "informational")
    autoscaler_level = cap_level("cluster_autoscaler", "recommended" if (cloud_managed and len(machinesets) > 0 and not is_sno and not is_hosted_control_plane) else "informational")

    def add_check(capability, status, detail, source, level="recommended", scored=True):
        normalized_level = normalize_level(level)
        checks.append({
            "capability": capability,
            "status": status,
            "detail": detail,
            "source": source,
            "level": normalized_level,
            "scored": bool(scored and normalized_level != "informational"),
        })

    def add_finding(issue, detail, severity="warning", source="general"):
        findings.append({
            "issue": issue,
            "detail": detail,
            "severity": severity,
            "source": source,
        })

    gitops_present = bool(argocds or gitops_apps or gitops_projects)
    add_check(
        "GitOps controller and application inventory",
        cap_status_for_presence("gitops", gitops_present),
        f"argocds={len(argocds)} applications={len(gitops_apps)} appprojects={len(gitops_projects)}",
        "GitOps resource inventory",
        level=cap_level("gitops", base_required_level),
    )
    if not gitops_present:
        add_finding(
            "prod-day2-gitops-missing",
            "no Argo CD, Argo CD Application, or AppProject resources were found",
            severity=cap_failure_severity("gitops"),
            source="GitOps resource inventory",
        )

    ext_secret_store_count = len(clustersecretstores) + len(secretstores)
    ext_secrets_present = ext_secret_store_count > 0 or len(externalsecrets) > 0
    add_check(
        "External secrets integration",
        cap_status_for_presence("external_secrets", ext_secrets_present),
        f"clustersecretstores={len(clustersecretstores)} secretstores={len(secretstores)} externalsecrets={len(externalsecrets)}",
        "external secrets integration guidance",
        level=external_secrets_level,
    )
    if not ext_secrets_present:
        add_finding(
            "prod-day2-external-secrets-missing",
            "no External Secrets Operator stores or ExternalSecret resources were found",
            severity=cap_failure_severity("external_secrets"),
            source="external secrets integration guidance",
        )

    add_check(
        "User workload monitoring enabled",
        cap_status_for_presence("user_workload_monitoring", enable_user_workload, len(servicemonitors) > 0 or len(podmonitors) > 0 or bool(uwm)),
        f"enableUserWorkload={enable_user_workload} servicemonitors={len(servicemonitors)} podmonitors={len(podmonitors)} user_workload_config_present={bool(uwm)}",
        "user workload monitoring and platform monitoring guidance",
        level=cap_level("user_workload_monitoring", base_required_level),
    )
    if not enable_user_workload:
        add_finding(
            "prod-day2-user-workload-monitoring-disabled",
            "cluster-monitoring-config does not enable user workload monitoring",
            severity=cap_failure_severity("user_workload_monitoring"),
            source="user workload monitoring and platform monitoring guidance",
        )

    add_check(
        "Grafana dashboard inventory",
        cap_status_for_presence("grafana_dashboards", grafana_dashboard_present),
        f"grafana_present={grafana_present} dashboard_configmaps={len(dashboard_configmaps)} grafana_dashboard_crds={crd_has('grafanadashboards', 'grafana.integreatly.org', 'grafana.com')}",
        "Grafana dashboard configuration inventory",
        level=cap_level("grafana_dashboards", "informational"),
        scored=False,
    )
    if not grafana_dashboard_present and cap_required("grafana_dashboards"):
        add_finding(
            "prod-day2-grafana-dashboards-missing",
            "no Grafana dashboard ConfigMap or Grafana dashboard CRD signal was detected",
            severity=cap_failure_severity("grafana_dashboards"),
            source="Grafana dashboard configuration inventory",
        )

    add_check(
        "Persistent cluster monitoring storage",
        cap_status_for_presence("monitoring_persistence", monitoring_persistent),
        "prometheusK8s and alertmanagerMain volumeClaimTemplate must both be present for this check",
        "Red Hat monitoring + IBM/Azure guidance",
        level=cap_level("monitoring_persistence", choose_level(base_required_level, telemetry_level)),
    )
    if not monitoring_persistent:
        add_finding(
            "prod-day2-monitoring-persistence-missing",
            "cluster monitoring does not show persistent volume claim templates for both Prometheus and Alertmanager",
            severity=cap_failure_severity("monitoring_persistence"),
            source="Red Hat monitoring + IBM/Azure guidance",
        )

    log_forwarding_present = len(obs.get("external_log_forwarding_outputs") or []) > 0 or len(clusterlogforwarders) > 0
    add_check(
        "External log forwarding",
        cap_status_for_presence("logging", len(obs.get("external_log_forwarding_outputs") or []) > 0),
        f"clusterlogforwarders={len(clusterlogforwarders)} external_outputs={len(obs.get('external_log_forwarding_outputs') or [])}",
        "cluster logging and external forwarding guidance",
        level=cap_level("logging", telemetry_level),
    )
    if not log_forwarding_present or len(obs.get("external_log_forwarding_outputs") or []) == 0:
        add_finding(
            "prod-day2-external-log-forwarding-missing",
            "no external log forwarding outputs were detected from ClusterLogForwarder resources",
            severity=cap_failure_severity("logging"),
            source="cluster logging and external forwarding guidance",
        )

    cluster_remote_write = int(obs.get("external_cluster_metrics_remote_write_count") or 0)
    user_remote_write = int(obs.get("external_user_workload_metrics_remote_write_count") or 0)
    add_check(
        "External metrics forwarding",
        cap_status_for_presence("external_metrics", cluster_remote_write > 0),
        f"cluster_remote_write={cluster_remote_write} user_remote_write={user_remote_write}",
        "Red Hat monitoring + vendor monitoring guidance",
        level=cap_level("external_metrics", telemetry_level),
    )
    if cluster_remote_write == 0:
        add_finding(
            "prod-day2-external-metrics-forwarding-missing",
            "no external cluster metrics remoteWrite target was detected",
            severity=cap_failure_severity("external_metrics"),
            source="Red Hat monitoring + vendor monitoring guidance",
        )

    backup_ready = bool(dataprotectionapplications and backupstoragelocations and schedules)
    successful_backups = int(backup_posture.get("successful_backup_count") or 0)
    add_check(
        "Backup and restore baseline",
        cap_status_for_presence("backup", backup_ready, successful_backups > 0),
        f"dpas={len(dataprotectionapplications)} backupstoragelocations={len(backupstoragelocations)} schedules={len(schedules)} successful_backups={successful_backups}",
        "OADP and backup posture guidance",
        level=cap_level("backup", base_required_level),
    )
    if not backup_ready or successful_backups == 0:
        add_finding(
            "prod-day2-backup-baseline-incomplete",
            "backup posture is missing OADP resources, active schedules, or successful backup evidence",
            severity=cap_failure_severity("backup"),
            source="OADP and backup posture guidance",
        )

    compliance_present = len(compliancesuites) > 0
    add_check(
        "Compliance scanning",
        cap_status_for_presence("compliance", compliance_present),
        f"compliancesuites={len(compliancesuites)} findings={len(data.get('compliance_suite_findings') or [])}",
        "compliance operator guidance",
        level=compliance_level,
    )
    if not compliance_present:
        add_finding(
            "prod-day2-compliance-scanning-missing",
            "no ComplianceSuite resources were found",
            severity=cap_failure_severity("compliance"),
            source="compliance operator guidance",
        )

    idp_count = int(data.get("identity_provider_count") or 0)
    add_check(
        "Central identity provider integration",
        cap_status_for_presence("oauth_identity_provider", idp_count > 0),
        f"identity_providers={idp_count}",
        "identity provider and production authentication guidance",
        level=cap_level("oauth_identity_provider", base_required_level),
    )
    if idp_count == 0:
        add_finding(
            "prod-day2-identity-provider-missing",
            "oauth cluster has no configured identity provider",
            severity=cap_failure_severity("oauth_identity_provider"),
            source="identity provider and production authentication guidance",
        )

    add_check(
        "Red Hat Insights connectivity",
        "OK" if insights_healthy else "WARN",
        f"available={insights.get('available', 'Unknown')} degraded={insights.get('degraded', 'Unknown')}",
        "Red Hat Insights guidance",
        level=insights_level,
    )
    if not insights_healthy:
        add_finding(
            "prod-day2-insights-not-healthy",
            "the insights operator is not healthy",
            source="Red Hat Insights guidance",
        )

    mhc_expected = cloud_managed and len(machinesets) > 0 and not is_sno and not is_hosted_control_plane
    mhc_present = len(machinehealthchecks) > 0
    add_check(
        "Worker machine remediation",
        "OK" if (mhc_present or (not mhc_expected and not cap_required("machine_health_checks"))) else "WARN",
        f"platform={platform} machinesets={len(machinesets)} machinehealthchecks={len(machinehealthchecks)}",
        "existing machine remediation posture + managed-cloud practice",
        level=machine_remediation_level,
    )
    if (mhc_expected or cap_required("machine_health_checks")) and not mhc_present:
        add_finding(
            "prod-day2-machinehealthcheck-missing",
            "no MachineHealthCheck resources were found for a cloud cluster with MachineSets",
            severity=cap_failure_severity("machine_health_checks"),
            source="existing machine remediation posture + managed-cloud practice",
        )

    autoscaler_expected = cloud_managed and len(machinesets) > 0 and not is_sno and not is_hosted_control_plane
    autoscaler_present = len(clusterautoscalers) > 0
    add_check(
        "Cluster autoscaler",
        "OK" if (autoscaler_present or (not autoscaler_expected and not cap_required("cluster_autoscaler"))) else "WARN",
        f"platform={platform} clusterautoscalers={len(clusterautoscalers)}",
        "cluster autoscaler and managed-cloud guidance",
        level=autoscaler_level,
    )
    if (autoscaler_expected or cap_required("cluster_autoscaler")) and not autoscaler_present:
        add_finding(
            "prod-day2-cluster-autoscaler-missing",
            "no ClusterAutoscaler resource was found for a cloud cluster with MachineSets",
            severity=cap_failure_severity("cluster_autoscaler"),
            source="cluster autoscaler and managed-cloud guidance",
        )

    image_policy_clean = len(data.get("image_registry_findings") or []) == 0
    add_check(
        "Registry governance baseline",
        "OK" if image_policy_clean else "WARN",
        f"image_registry_findings={len(data.get('image_registry_findings') or [])}",
        "registry governance guidance",
        level=cap_level("image_registry_governance", "informational" if is_sno else "recommended"),
    )

    add_check(
        "Private registry mirror configuration",
        cap_status_for_presence("private_registry_mirrors", private_registry_mirrors_present),
        f"imagedigestmirrorsets={len(imagedigestmirrorsets)} imagetagmirrorsets={len(imagetagmirrorsets)} imagecontentsourcepolicies={len(imagecontentsourcepolicies)} registry_sources_policy={restricted_registry_sources}",
        "OpenShift image mirror configuration",
        level=cap_level("private_registry_mirrors", "informational"),
        scored=False,
    )
    if not private_registry_mirrors_present and cap_required("private_registry_mirrors"):
        add_finding(
            "prod-day2-private-registry-mirrors-missing",
            "no ImageDigestMirrorSet, ImageTagMirrorSet, or ImageContentSourcePolicy resources were found",
            severity=cap_failure_severity("private_registry_mirrors"),
            source="OpenShift image mirror configuration",
        )

    add_check(
        "Disconnected installation image sources",
        cap_status_for_presence("disconnected_installation", disconnected_installation_present),
        f"mirror_resources={mirror_resource_count} non_public_catalogsources={disconnected_catalog_count}",
        "OpenShift disconnected installation mirror inventory",
        level=cap_level("disconnected_installation", "informational"),
        scored=False,
    )
    if not disconnected_installation_present and cap_required("disconnected_installation"):
        add_finding(
            "prod-day2-disconnected-installation-evidence-missing",
            "no disconnected image mirror resources or non-public Operator CatalogSource images were found",
            severity=cap_failure_severity("disconnected_installation"),
            source="OpenShift disconnected installation mirror inventory",
        )

    add_check(
        "IPsec encryption enabled",
        cap_status_for_presence("ipsec_enabled", ipsec_enabled),
        f"networkType={network_type} ipsecConfigPresent={ipsec_enabled} mode={ipsec_mode}",
        "OVN-Kubernetes IPsec configuration",
        level=cap_level("ipsec_enabled", "informational"),
        scored=False,
    )
    if not ipsec_enabled and cap_required("ipsec_enabled"):
        add_finding(
            "prod-day2-ipsec-not-enabled",
            "networks.operator.openshift.io/cluster does not show spec.defaultNetwork.ovnKubernetesConfig.ipsecConfig",
            severity=cap_failure_severity("ipsec_enabled"),
            source="OVN-Kubernetes IPsec configuration",
        )

    add_check(
        "etcd encryption enabled",
        cap_status_for_presence("etcd_encryption_enabled", etcd_encryption_enabled, etcd_encryption_complete or etcd_encryption_enabled),
        f"apiserver_encryption_type={etcd_encryption_type} encrypted_condition={etcd_encryption_condition.get('status', 'not-reported')}",
        "OpenShift APIServer etcd encryption configuration",
        level=cap_level("etcd_encryption_enabled", "informational"),
        scored=False,
    )
    if not etcd_encryption_enabled and cap_required("etcd_encryption_enabled"):
        add_finding(
            "prod-day2-etcd-encryption-not-enabled",
            "apiserver.config.openshift.io/cluster does not set spec.encryption.type to aescbc or aesgcm",
            severity=cap_failure_severity("etcd_encryption_enabled"),
            source="OpenShift APIServer etcd encryption configuration",
        )

    add_check(
        "Data-at-rest encryption posture",
        cap_status_for_presence("encryption_at_rest", etcd_encryption_enabled, etcd_encryption_complete or etcd_encryption_enabled),
        f"apiserver_encryption_type={etcd_encryption_type} encrypted_condition={etcd_encryption_condition.get('status', 'not-reported')}",
        "OpenShift APIServer etcd encryption configuration",
        level=cap_level("encryption_at_rest", "recommended"),
        scored=False,
    )
    if not etcd_encryption_enabled and cap_required("encryption_at_rest"):
        add_finding(
            "prod-day2-encryption-at-rest-not-enabled",
            "required data-at-rest posture is missing because OpenShift APIServer etcd encryption is identity or not configured",
            severity=cap_failure_severity("encryption_at_rest"),
            source="OpenShift APIServer etcd encryption configuration",
        )

    add_check(
        "Cluster proxy configuration",
        cap_status_for_presence("proxy_configuration", cluster_proxy_configured),
        f"httpProxy={bool(proxy_spec.get('httpProxy'))} httpsProxy={bool(proxy_spec.get('httpsProxy'))} noProxy_entries={len(str(proxy_spec.get('noProxy') or '').split(',')) if proxy_spec.get('noProxy') else 0}",
        "OpenShift cluster-wide Proxy configuration",
        level=cap_level("proxy_configuration", "informational"),
        scored=False,
    )
    if not cluster_proxy_configured and cap_required("proxy_configuration"):
        add_finding(
            "prod-day2-proxy-configuration-missing",
            "proxy.config.openshift.io/cluster does not set spec.httpProxy or spec.httpsProxy",
            severity=cap_failure_severity("proxy_configuration"),
            source="OpenShift cluster-wide Proxy configuration",
        )

    add_check(
        "Custom trust bundle configuration",
        cap_status_for_presence("custom_ca_trust", custom_ca_configured),
        f"proxy_trustedCA={((proxy_spec.get('trustedCA') or {}).get('name') or 'none')} image_additionalTrustedCA={((image_spec.get('additionalTrustedCA') or {}).get('name') or 'none')}",
        "OpenShift Proxy and Image trust configuration",
        level=cap_level("custom_ca_trust", "informational"),
        scored=False,
    )
    if not custom_ca_configured and cap_required("custom_ca_trust"):
        add_finding(
            "prod-day2-custom-ca-trust-missing",
            "neither proxy.config.openshift.io/cluster.spec.trustedCA nor image.config.openshift.io/cluster.spec.additionalTrustedCA references a ConfigMap",
            severity=cap_failure_severity("custom_ca_trust"),
            source="OpenShift Proxy and Image trust configuration",
        )

    add_check(
        "Application external private registry usage",
        cap_status_for_presence("external_private_registry", external_private_registry_present),
        f"external_registries={len(external_image_registries)} credentialed_public_registries={len(credentialed_public_image_registries)} workloads_with_imagePullSecrets={workloads_with_pull_secret} docker_registry_secrets={dockerconfig_secret_count} serviceaccount_pull_secrets={serviceaccount_pull_secret_count}",
        "Kubernetes imagePullSecrets and workload image inventory",
        level=cap_level("external_private_registry", "informational"),
        scored=False,
    )
    if not external_private_registry_present and cap_required("external_private_registry"):
        add_finding(
            "prod-day2-external-private-registry-missing",
            "no workload evidence showed external non-public image registries with image pull credentials",
            severity=cap_failure_severity("external_private_registry"),
            source="Kubernetes imagePullSecrets and workload image inventory",
        )

    add_check(
        "Workload vulnerability scanner agents",
        cap_status_for_presence("workload_vulnerability_scanner", workload_scanner_present),
        f"scanner_present={workload_scanner_present} scanner_crds={crd_has('aquasecurity.github.io', 'vulnerabilityreports', 'stackrox.io', 'falcosecurity.dev', 'falco.org')} stackrox_namespace={'stackrox' in namespace_names}",
        "workload scanner operator, agent, and CRD inventory",
        level=cap_level("workload_vulnerability_scanner", "informational"),
        scored=False,
    )
    if not workload_scanner_present and cap_required("workload_vulnerability_scanner"):
        add_finding(
            "prod-day2-workload-vulnerability-scanner-missing",
            "no common workload vulnerability scanner agent, operator, or vulnerability report CRD was detected",
            severity=cap_failure_severity("workload_vulnerability_scanner"),
            source="workload scanner operator, agent, and CRD inventory",
        )

    platform_app_catalog = [
        {
            "key": "logging",
            "capability": "Cluster logging app footprint",
            "level": cap_level("logging", telemetry_level),
            "source": "cluster logging inventory",
            "present": bool(clusterlogforwarders or "openshift-logging" in namespace_names),
            "detail": f"clusterlogforwarders={len(clusterlogforwarders)} openshift_logging_namespace={'openshift-logging' in namespace_names}",
            "issue": "prod-day2-platform-cluster-logging-missing",
            "finding": "no cluster logging app footprint was detected from ClusterLogForwarder resources or openshift-logging namespace",
        },
        {
            "key": "external_secrets",
            "capability": "External Secrets Operator app footprint",
            "level": external_secrets_level,
            "source": "external secrets inventory",
            "present": bool(ext_secrets_present or "external-secrets-operator" in namespace_names),
            "detail": f"stores={ext_secret_store_count} externalsecrets={len(externalsecrets)} namespace_present={'external-secrets-operator' in namespace_names}",
            "issue": "prod-day2-platform-external-secrets-operator-missing",
            "finding": "no external-secrets operator footprint was detected",
        },
        {
            "key": "backup",
            "capability": "OADP operator app footprint",
            "level": cap_level("backup", base_required_level),
            "source": "backup and recovery inventory",
            "present": bool(dataprotectionapplications or backupstoragelocations or schedules or "openshift-adp" in namespace_names),
            "detail": f"dpas={len(dataprotectionapplications)} backupstoragelocations={len(backupstoragelocations)} schedules={len(schedules)} openshift_adp_namespace={'openshift-adp' in namespace_names}",
            "issue": "prod-day2-platform-oadp-operator-missing",
            "finding": "no OADP operator or backup app footprint was detected",
        },
        {
            "key": "compliance",
            "capability": "Compliance operator app footprint",
            "level": compliance_level,
            "source": "compliance operator inventory",
            "present": bool(compliancesuites or "openshift-compliance" in namespace_names),
            "detail": f"compliancesuites={len(compliancesuites)} openshift_compliance_namespace={'openshift-compliance' in namespace_names}",
            "issue": "prod-day2-platform-compliance-operator-missing",
            "finding": "no compliance operator app footprint was detected",
        },
        {
            "key": "pipelines",
            "capability": "Pipelines operator app footprint",
            "level": pipelines_level,
            "source": "pipeline operator inventory",
            "present": bool("openshift-pipelines-operator-rh" in subscription_packages or "openshift-pipelines" in namespace_names or "openshift-pipelines-operator-bootstrap" in gitops_application_names),
            "detail": f"subscription_present={'openshift-pipelines-operator-rh' in subscription_packages} openshift_pipelines_namespace={'openshift-pipelines' in namespace_names} gitops_app_present={'openshift-pipelines-operator-bootstrap' in gitops_application_names}",
            "issue": "prod-day2-platform-pipelines-operator-missing",
            "finding": "no OpenShift Pipelines operator footprint was detected",
        },
        {
            "key": "cert_manager",
            "capability": "cert-manager operator footprint",
            "level": cert_manager_level,
            "source": "certificate management inventory",
            "present": bool("openshift-cert-manager-operator" in subscription_packages or "cert-manager-operator" in namespace_names or "cert-manager" in namespace_names),
            "detail": f"subscription_present={'openshift-cert-manager-operator' in subscription_packages} cert_manager_operator_namespace={'cert-manager-operator' in namespace_names} cert_manager_namespace={'cert-manager' in namespace_names}",
            "issue": "prod-day2-platform-cert-manager-missing",
            "finding": "no cert-manager operator footprint was detected",
        },
        {
            "key": "acs",
            "capability": "Advanced Cluster Security operator footprint",
            "level": acs_level,
            "source": "security operator inventory",
            "present": bool("container-security-operator" in subscription_packages or "container-security-operator" in namespace_names or "stackrox" in namespace_names),
            "detail": f"subscription_present={'container-security-operator' in subscription_packages} operator_namespace={'container-security-operator' in namespace_names} stackrox_namespace={'stackrox' in namespace_names}",
            "issue": "prod-day2-platform-acs-missing",
            "finding": "no Advanced Cluster Security operator footprint was detected",
        },
        {
            "key": "multi_tenancy_governance",
            "capability": "Namespace onboarding guardrails footprint",
            "level": namespace_guardrails_level,
            "source": "namespace onboarding inventory",
            "present": bool(
                "namespace-onboarding" in gitops_application_names
                or "self-provisioner" in gitops_application_names
            ),
            "detail": f"namespace_onboarding_app_present={'namespace-onboarding' in gitops_application_names} self_provisioner_app_present={'self-provisioner' in gitops_application_names}",
            "issue": "prod-day2-platform-namespace-governance-weak",
            "finding": "no namespace-onboarding or self-provisioner GitOps application footprint was detected",
        },
        {
            "key": "cost_management",
            "capability": "Cost management operator footprint",
            "level": cap_level("cost_management", "informational"),
            "source": "cost management inventory",
            "present": bool("redhat-cost-management" in subscription_packages or "cost-management" in namespace_names),
            "detail": f"subscription_present={'redhat-cost-management' in subscription_packages} namespace_present={'cost-management' in namespace_names}",
            "issue": "prod-day2-platform-cost-management-missing",
            "finding": "no cost management operator footprint was detected",
        },
    ]

    for item in platform_app_catalog:
        present = bool(item["present"])
        key = item["key"]
        required_or_present = present or cap_required(key)
        if not required_or_present:
            continue
        add_check(
            item["capability"],
            cap_status_for_presence(key, present),
            item["detail"],
            item["source"],
            level=item["level"],
            scored=False,
        )
        if not present and required_or_present:
            add_finding(
                item["issue"],
                item["finding"],
                severity=cap_failure_severity(key),
                source=item["source"],
            )

    acm_managed = bool(klusterlets or managedclusteraddons or acm_agent_namespaces)
    if acm_managed or cap_required("acm"):
        add_check(
            "ACM managed-cluster registration",
            cap_status_for_presence("acm", acm_managed),
            f"klusterlets={len(klusterlets)} managedclusteraddons={len(managedclusteraddons)} agent_namespaces={','.join(acm_agent_namespaces) or 'none'}",
            "managed-cluster registration inventory",
            level=cap_level("acm", "informational"),
            scored=False,
        )
    if not acm_managed and cap_required("acm"):
        add_finding(
            "prod-day2-acm-management-missing",
            "no ACM managed-cluster signals were found from Klusterlet, ManagedClusterAddOn, or ACM agent namespaces",
            severity=cap_failure_severity("acm"),
            source="managed-cluster registration inventory",
        )

    print(json.dumps({
        "day2_posture_checks": checks,
        "day2_posture_findings": findings,
        "scored_day2_posture_findings": [item for item in findings if item.get("severity") != "info"],
        "day2_posture_summary": {
            "checks_total": len(checks),
            "checks_warn": len([c for c in checks if c["status"] == "WARN"]),
            "scored_findings_count": len([item for item in findings if item.get("severity") != "info"]),
            "baseline_profile": day2_baseline_profile,
            "capability_profile": capability_profile,
            "gitops_present": gitops_present,
            "argocd_count": len(argocds),
            "gitops_application_count": len(gitops_apps),
            "gitops_appproject_count": len(gitops_projects),
            "external_secret_store_count": ext_secret_store_count,
            "external_secret_count": len(externalsecrets),
            "clusterautoscaler_count": len(clusterautoscalers),
            "clusterautoscaler_expected": autoscaler_expected,
            "machinehealthcheck_count": len(machinehealthchecks),
            "machinehealthcheck_expected": mhc_expected,
            "acm_managed": acm_managed,
            "acm_klusterlet_count": len(klusterlets),
            "acm_managedclusteraddon_count": len(managedclusteraddons),
            "acm_agent_namespace_count": len(acm_agent_namespaces),
            "enable_user_workload_monitoring": enable_user_workload,
            "servicemonitor_count": len(servicemonitors),
            "podmonitor_count": len(podmonitors),
            "grafana_present": grafana_present,
            "grafana_dashboard_configmap_count": len(dashboard_configmaps),
            "grafana_dashboard_present": grafana_dashboard_present,
            "external_private_registry_present": external_private_registry_present,
            "external_private_registry_count": len(external_image_registries),
            "credentialed_public_registry_count": len(credentialed_public_image_registries),
            "workloads_with_image_pull_secret": workloads_with_pull_secret,
            "private_registry_mirrors_present": private_registry_mirrors_present,
            "image_mirror_resource_count": mirror_resource_count,
            "disconnected_installation_present": disconnected_installation_present,
            "disconnected_catalogsource_count": disconnected_catalog_count,
            "ipsec_enabled": ipsec_enabled,
            "ipsec_mode": ipsec_mode,
            "etcd_encryption_enabled": etcd_encryption_enabled,
            "etcd_encryption_type": etcd_encryption_type,
            "etcd_encryption_complete": etcd_encryption_complete,
            "cluster_proxy_configured": cluster_proxy_configured,
            "custom_ca_trust_configured": custom_ca_configured,
            "workload_vulnerability_scanner_present": workload_scanner_present,
            "monitoring_persistent_storage_configured": monitoring_persistent,
            "external_log_forwarding_output_count": len(obs.get("external_log_forwarding_outputs") or []),
            "external_cluster_metrics_remote_write_count": cluster_remote_write,
            "external_user_workload_metrics_remote_write_count": user_remote_write,
            "backup_schedule_count": len(schedules),
            "successful_backup_count": successful_backups,
            "compliancesuite_count": len(compliancesuites),
            "identity_provider_count": idp_count,
            "insights_healthy": insights_healthy,
        }
    }))
    PY
  register: day2_posture_cmd
  changed_when: false
  failed_when: false

- name: Normalize production Day 2 posture summary
  vars:
    day2_posture_payload: >-
      {{
        day2_posture_cmd.stdout | from_json
        if (day2_posture_cmd.rc == 0 and (day2_posture_cmd.stdout | default('') | length > 0))
        else {
          'day2_posture_checks': [],
          'day2_posture_findings': [],
          'scored_day2_posture_findings': [],
          'day2_posture_summary': {
            'checks_total': 0,
            'checks_warn': 0,
            'scored_findings_count': 0,
            'baseline_profile': {},
            'gitops_present': false,
            'argocd_count': 0,
            'gitops_application_count': 0,
            'gitops_appproject_count': 0,
            'external_secret_store_count': 0,
            'external_secret_count': 0,
            'clusterautoscaler_count': 0,
            'clusterautoscaler_expected': false,
            'machinehealthcheck_count': 0,
            'machinehealthcheck_expected': false,
            'acm_managed': false,
            'acm_klusterlet_count': 0,
            'acm_managedclusteraddon_count': 0,
            'acm_agent_namespace_count': 0,
            'enable_user_workload_monitoring': false,
            'servicemonitor_count': 0,
            'podmonitor_count': 0,
            'grafana_present': false,
            'grafana_dashboard_configmap_count': 0,
            'grafana_dashboard_present': false,
            'external_private_registry_present': false,
            'external_private_registry_count': 0,
            'credentialed_public_registry_count': 0,
            'workloads_with_image_pull_secret': 0,
            'private_registry_mirrors_present': false,
            'image_mirror_resource_count': 0,
            'disconnected_installation_present': false,
            'disconnected_catalogsource_count': 0,
            'ipsec_enabled': false,
            'ipsec_mode': 'Disabled',
            'etcd_encryption_enabled': false,
            'etcd_encryption_type': 'unknown',
            'etcd_encryption_complete': false,
            'cluster_proxy_configured': false,
            'custom_ca_trust_configured': false,
            'workload_vulnerability_scanner_present': false,
            'monitoring_persistent_storage_configured': false,
            'external_log_forwarding_output_count': 0,
            'external_cluster_metrics_remote_write_count': 0,
            'external_user_workload_metrics_remote_write_count': 0,
            'backup_schedule_count': 0,
            'successful_backup_count': 0,
            'compliancesuite_count': 0,
            'identity_provider_count': 0,
            'insights_healthy': false
          }
        }
      }}
  ansible.builtin.set_fact:
    day2_posture_data: "{{ day2_posture_payload }}"
    day2_posture_checks: "{{ day2_posture_payload.day2_posture_checks | default([]) }}"
    day2_posture_findings: "{{ day2_posture_payload.day2_posture_findings | default([]) }}"
    scored_day2_posture_findings: "{{ day2_posture_payload.scored_day2_posture_findings | default([]) }}"
    day2_posture_summary: "{{ day2_posture_payload.day2_posture_summary | default({}) }}"
