---
- name: Build cluster-hosted CI/CD runners capability artifact facts
  vars:
    day2_cluster_hosted_cicd_runners_section_current: "{{ (((day2_capability_sections | default([])) | selectattr('key', 'equalto', 'cluster_hosted_cicd_runners') | list | first) | default({})) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: cluster_hosted_cicd_runners
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      cluster_hosted_cicd_runners_present: "{{ ((day2_posture_summary | default({})).get('cluster_hosted_cicd_runners_present', false)) | bool }}"
      status_summary: "{{ day2_cluster_hosted_cicd_runners_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_cluster_hosted_cicd_runners_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_cluster_hosted_cicd_runners_section: "{{ day2_cluster_hosted_cicd_runners_section_current }}"
    capability_artifact_collection_inputs:
      cluster_hosted_cicd_runners_present: "{{ ((day2_posture_summary | default({})).get('cluster_hosted_cicd_runners_present', false)) | bool }}"
