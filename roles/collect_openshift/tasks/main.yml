---
- name: Define OpenShift-specific collection commands
  ansible.builtin.set_fact:
    openshift_collection_core_command_names:
      - clusterversion
      - clusteroperators
      - machineconfigpools
      - routes
    openshift_collection_commands:
      - name: clusterversion
        argv: ["oc", "get", "clusterversion", "version", "-o", "json"]
      - name: clusteroperators
        argv: ["oc", "get", "clusteroperators", "-o", "json"]
      - name: infrastructure
        argv: ["oc", "get", "infrastructure", "cluster", "-o", "json"]
      - name: network
        argv: ["oc", "get", "network", "cluster", "-o", "json"]
      - name: ingress_config
        argv: ["oc", "get", "ingress.config.openshift.io", "cluster", "-o", "json"]
      - name: image_config
        argv: ["oc", "get", "image.config.openshift.io", "cluster", "-o", "json"]
      - name: image_registry_config
        argv: ["oc", "get", "configs.imageregistry.operator.openshift.io", "cluster", "-o", "json"]
      - name: image_pruner
        argv: ["oc", "get", "imagepruner.imageregistry.operator.openshift.io", "cluster", "-o", "json"]
      - name: dns
        argv: ["oc", "get", "dns.operator/default", "-o", "json"]
      - name: apiservices
        argv: ["oc", "get", "apiservices.apiregistration.k8s.io", "-o", "json"]
      - name: oauth
        argv: ["oc", "get", "oauth", "cluster", "-o", "json"]
      - name: securitycontextconstraints
        argv: ["oc", "get", "securitycontextconstraints.security.openshift.io", "-o", "json"]
      - name: buildconfigs
        argv: ["oc", "get", "buildconfigs.build.openshift.io", "-A", "-o", "json"]
      - name: deploymentconfigs
        argv: ["oc", "get", "deploymentconfigs.apps.openshift.io", "-A", "-o", "json"]
      - name: builds
        argv: ["oc", "get", "builds.build.openshift.io", "-A", "-o", "json"]
      - name: imagestreams
        argv: ["oc", "get", "imagestreams.image.openshift.io", "-A", "-o", "json"]
      - name: pipelines
        argv: ["oc", "get", "pipelines.tekton.dev", "-A", "-o", "json", "--ignore-not-found"]
      - name: pipelineruns
        argv: ["oc", "get", "pipelineruns.tekton.dev", "-A", "-o", "json", "--ignore-not-found"]
      - name: volumesnapshotclasses
        argv: ["oc", "get", "volumesnapshotclasses.snapshot.storage.k8s.io", "-o", "json", "--ignore-not-found"]
      - name: dataprotectionapplications
        argv: ["oc", "get", "dataprotectionapplications.oadp.openshift.io", "-A", "-o", "json", "--ignore-not-found"]
      - name: backupstoragelocations
        argv: ["oc", "get", "backupstoragelocations.velero.io", "-A", "-o", "json", "--ignore-not-found"]
      - name: schedules
        argv: ["oc", "get", "schedules.velero.io", "-A", "-o", "json", "--ignore-not-found"]
      - name: backups
        argv: ["oc", "get", "backups.velero.io", "-A", "-o", "json", "--ignore-not-found"]
      - name: restores
        argv: ["oc", "get", "restores.velero.io", "-A", "-o", "json", "--ignore-not-found"]
      - name: compliancesuites
        argv: ["oc", "get", "compliancesuites.compliance.openshift.io", "-A", "-o", "json", "--ignore-not-found"]
      - name: users
        argv: ["oc", "get", "users.user.openshift.io", "-o", "json"]
      - name: groups
        argv: ["oc", "get", "groups.user.openshift.io", "-o", "json"]
      - name: machineconfigpools
        argv: ["oc", "get", "machineconfigpools", "-o", "json"]
      - name: machinesets
        argv: ["oc", "get", "machinesets.machine.openshift.io", "-A", "-o", "json", "--ignore-not-found"]
      - name: machinehealthchecks
        argv: ["oc", "get", "machinehealthchecks.machine.openshift.io", "-A", "-o", "json", "--ignore-not-found"]
      - name: routes
        argv: ["oc", "get", "routes", "-A", "-o", "json"]
      - name: ingresscontrollers
        argv: ["oc", "-n", "openshift-ingress-operator", "get", "ingresscontrollers", "-o", "json"]
      - name: clusterlogforwarders
        argv: ["oc", "get", "clusterlogforwarders", "-A", "-o", "json"]
      - name: alertmanagerconfigs
        argv: ["oc", "get", "alertmanagerconfigs.monitoring.coreos.com", "-A", "-o", "json", "--ignore-not-found"]
      - name: cluster_monitoring_config
        argv: ["oc", "-n", "openshift-monitoring", "get", "configmap", "cluster-monitoring-config", "-o", "json"]
      - name: user_workload_monitoring_config
        argv: ["oc", "-n", "openshift-user-workload-monitoring", "get", "configmap", "user-workload-monitoring-config", "-o", "json"]
    openshift_optional_missing_resource_commands:
      - pipelines
      - pipelineruns
      - volumesnapshotclasses
      - dataprotectionapplications
      - backupstoragelocations
      - schedules
      - backups
      - restores
      - compliancesuites
      - machinesets
      - machinehealthchecks
      - alertmanagerconfigs
      - clusterlogforwarders
    openshift_optional_missing_object_commands:
      - cluster_monitoring_config
      - user_workload_monitoring_config

- name: Collect OpenShift-specific data in parallel
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import subprocess
    from concurrent.futures import ThreadPoolExecutor, as_completed

    commands = json.loads(r'''{{ openshift_collection_commands | to_json }}''')
    timeout_seconds = int({{ collection_command_timeout_seconds | int }})
    max_workers = min(
        max(1, int({{ collection_parallelism | int }})),
        max(1, len(commands)),
    )

    def run_command(spec):
        try:
            proc = subprocess.run(
                spec["argv"],
                capture_output=True,
                text=True,
                timeout=timeout_seconds,
                check=False,
            )
            return {
                "name": spec["name"],
                "rc": proc.returncode,
                "stdout": proc.stdout,
                "stderr": proc.stderr,
                "stdout_lines": proc.stdout.splitlines(),
                "timed_out": False,
            }
        except subprocess.TimeoutExpired as exc:
            return {
                "name": spec["name"],
                "rc": 124,
                "stdout": exc.stdout or "",
                "stderr": f"timed out after {timeout_seconds} seconds",
                "stdout_lines": (exc.stdout or "").splitlines(),
                "timed_out": True,
            }
        except Exception as exc:
            return {
                "name": spec["name"],
                "rc": 1,
                "stdout": "",
                "stderr": str(exc),
                "stdout_lines": [],
                "timed_out": False,
            }

    results = {}
    with ThreadPoolExecutor(max_workers=max_workers) as pool:
        futures = {pool.submit(run_command, spec): spec["name"] for spec in commands}
        for future in as_completed(futures):
            result = future.result()
            results[result["name"]] = result

    print(json.dumps(results))
    PY
  register: openshift_collected_commands_cmd
  changed_when: false
  failed_when: false

- name: Normalize OpenShift-specific command results
  ansible.builtin.set_fact:
    openshift_collected_commands: "{{ openshift_collected_commands_cmd.stdout | from_json if (openshift_collected_commands_cmd.rc == 0 and (openshift_collected_commands_cmd.stdout | default('') | length > 0)) else {} }}"

- name: Capture OpenShift optional collection skips
  ansible.builtin.set_fact:
    collection_skipped_optional_commands: "{{ (collection_skipped_optional_commands | default([])) + [collection_skip_entry] }}"
  loop: "{{ openshift_collected_commands | default({}) | dict2items }}"
  vars:
    collection_failure_stderr: "{{ item.value.stderr | default('') | trim }}"
    collection_failure_stderr_lower: "{{ collection_failure_stderr | lower }}"
    optional_missing_resource_failure: >-
      {{
        (item.key in (openshift_optional_missing_resource_commands | default([])))
        and ("the server doesn't have a resource type" in collection_failure_stderr_lower)
      }}
    optional_missing_object_failure: >-
      {{
        (item.key in (openshift_optional_missing_object_commands | default([])))
        and ('error from server (notfound)' in collection_failure_stderr_lower)
      }}
    collection_skip_entry:
      name: "{{ item.key }}"
      rc: "{{ item.value.rc | default(1) }}"
      category: "{{ 'optional-api-missing' if optional_missing_resource_failure else 'optional-object-missing' }}"
      detail: "{{ collection_failure_stderr }}"
  when:
    - (item.value.rc | default(1) | int) != 0
    - optional_missing_resource_failure or optional_missing_object_failure
  changed_when: false

- name: Merge OpenShift-specific collection failures
  ansible.builtin.set_fact:
    collection_failures: "{{ (collection_failures | default([])) + [collection_failure_entry] }}"
  loop: "{{ openshift_collected_commands | default({}) | dict2items }}"
  vars:
    collection_failure_stderr: "{{ item.value.stderr | default('') | trim }}"
    collection_failure_stderr_lower: "{{ collection_failure_stderr | lower }}"
    optional_missing_resource_failure: >-
      {{
        (item.key in (openshift_optional_missing_resource_commands | default([])))
        and ("the server doesn't have a resource type" in collection_failure_stderr_lower)
      }}
    optional_missing_object_failure: >-
      {{
        (item.key in (openshift_optional_missing_object_commands | default([])))
        and ('error from server (notfound)' in collection_failure_stderr_lower)
      }}
    collection_failure_entry:
      name: "{{ item.key }}"
      rc: "{{ item.value.rc | default(1) }}"
      timed_out: "{{ item.value.timed_out | default(false) }}"
      stderr: "{{ collection_failure_stderr }}"
  when:
    - (item.value.rc | default(1) | int) != 0
    - not optional_missing_resource_failure
    - not optional_missing_object_failure
  changed_when: false

- name: Merge OpenShift-specific collection summary
  ansible.builtin.set_fact:
    collection_summary:
      command_count: "{{ (collection_summary.command_count | default(0) | int) + (openshift_collection_commands | length) }}"
      applicable_command_count: "{{ [0, (((collection_summary.command_count | default(0) | int) + (openshift_collection_commands | length)) - (collection_skipped_optional_commands | default([]) | length))] | max }}"
      parallelism: "{{ collection_summary.parallelism | default(collection_parallelism | int) }}"
      timeout_seconds: "{{ collection_summary.timeout_seconds | default(collection_command_timeout_seconds | int) }}"
      failed_commands: "{{ collection_failures | default([]) | length }}"
      optional_skipped_commands: "{{ collection_skipped_optional_commands | default([]) | length }}"
      timed_out_commands: "{{ collection_failures | default([]) | selectattr('timed_out', 'equalto', true) | list | length }}"
      succeeded_commands: "{{ [0, (((collection_summary.command_count | default(0) | int) + (openshift_collection_commands | length)) - (collection_failures | default([]) | length) - (collection_skipped_optional_commands | default([]) | length))] | max }}"
      core_failed_commands: "{{ (collection_failures | default([]) | selectattr('name', 'in', (collection_core_command_names + openshift_collection_core_command_names)) | list | length) }}"
  changed_when: false

- name: Extend core command names with OpenShift commands
  ansible.builtin.set_fact:
    collection_core_command_names: "{{ collection_core_command_names + openshift_collection_core_command_names }}"

