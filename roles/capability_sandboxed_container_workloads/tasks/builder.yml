---
- name: Build sandboxed container workloads capability artifact facts
  vars:
    day2_sandboxed_container_workloads_section_current: "{{ (day2_capability_sections_by_key | default({})).get('sandboxed_container_workloads', {}) }}"
    sandboxed_container_workloads_present_current: "{{ ((day2_posture_summary | default({})).get('sandboxed_container_workloads_present', false)) | bool }}"
    sandboxed_container_workloads_healthy_current: "{{ ((day2_posture_summary | default({})).get('sandboxed_container_workloads_healthy', false)) | bool }}"
    sandboxed_container_workloads_context_present_current: "{{ ((day2_posture_summary | default({})).get('sandboxed_container_workloads_context_present', false)) | bool }}"
    sandboxed_container_workloads_required_current: "{{ (day2_sandboxed_container_workloads_section_current.required | default(false)) | bool }}"
    sandboxed_container_workloads_reason_summary_current: >-
      {{
        (
          day2_sandboxed_container_workloads_section_current.top_detail
          | default('')
          | string
          | trim
        )
        or (
          'context_present=' ~ (sandboxed_container_workloads_context_present_current | string)
          ~ ' footprint_present=' ~ (sandboxed_container_workloads_present_current | string)
          ~ ' healthy=' ~ (sandboxed_container_workloads_healthy_current | string)
        )
      }}
    sandboxed_container_workloads_recommended_action_current: >-
      {{
        'Confirm sandboxed-container operator services and stronger-isolation workload paths remain healthy.'
        if sandboxed_container_workloads_present_current
        else 'If sandboxed containers are intended, confirm KataConfig or sandboxed-containers operator footprint and the expected stronger-isolation workload path.'
      }}
    sandboxed_container_workloads_status_current: >-
      {{
        'OK'
        if (sandboxed_container_workloads_present_current and sandboxed_container_workloads_healthy_current)
        else ('WARNING' if sandboxed_container_workloads_required_current else 'INFO')
      }}
    sandboxed_container_workloads_checks_current: >-
      {{
        [
          {
            'capability': 'Sandboxed workload context',
            'capability_key': 'sandboxed_container_workloads',
            'detail': (
              'context_present=' ~ (sandboxed_container_workloads_context_present_current | string)
              ~ ' footprint_present=' ~ (sandboxed_container_workloads_present_current | string)
            ),
            'level': ((day2_sandboxed_container_workloads_section_current.criticality | default('medium')) | string),
            'scored': false,
            'source': 'Sandboxed container capability summary',
            'status': ('OK' if sandboxed_container_workloads_context_present_current else ('WARN' if sandboxed_container_workloads_required_current else 'INFO'))
          },
          {
            'capability': 'Healthy sandboxed workload path',
            'capability_key': 'sandboxed_container_workloads',
            'detail': 'healthy=' ~ (sandboxed_container_workloads_healthy_current | string),
            'level': ((day2_sandboxed_container_workloads_section_current.criticality | default('medium')) | string),
            'scored': false,
            'source': 'Sandboxed container capability summary',
            'status': ('OK' if (sandboxed_container_workloads_present_current and sandboxed_container_workloads_healthy_current) else ('WARN' if (sandboxed_container_workloads_context_present_current or sandboxed_container_workloads_required_current) else 'INFO'))
          }
        ]
      }}
    sandboxed_container_workloads_findings_current: >-
      {{
        []
        if (sandboxed_container_workloads_present_current and sandboxed_container_workloads_healthy_current)
        else [
          {
            'capability': 'sandboxed_container_workloads',
            'issue': 'prod-day2-sandboxed-workloads-needs-verification',
            'severity': ('warning' if sandboxed_container_workloads_required_current else 'info'),
            'source': 'Sandboxed container capability summary',
            'detail': (
              'sandboxed workload context was detected, but no healthy stronger-isolation workload path was confirmed'
              if sandboxed_container_workloads_context_present_current
              else 'no healthy KataConfig or sandboxed-container footprint was confirmed'
            ),
            'recommended_action': sandboxed_container_workloads_recommended_action_current,
            'docs': ((day2_sandboxed_container_workloads_section_current.docs | default([])) | string)
          }
        ]
      }}
    sandboxed_container_workloads_section_override_current: >-
      {{
        (day2_sandboxed_container_workloads_section_current | default({}))
        | combine(
            {
              'accounting_state': 'assessed',
              'check_count': (sandboxed_container_workloads_checks_current | length),
              'finding_count': (sandboxed_container_workloads_findings_current | length),
              'checks': sandboxed_container_workloads_checks_current,
              'findings': sandboxed_container_workloads_findings_current,
              'status': sandboxed_container_workloads_status_current,
              'top_detail': sandboxed_container_workloads_reason_summary_current,
              'recommended_action': sandboxed_container_workloads_recommended_action_current
            },
            recursive=True
          )
      }}
  ansible.builtin.set_fact:
    capability_artifact_key: sandboxed_container_workloads
    capability_artifact_section_override: "{{ sandboxed_container_workloads_section_override_current }}"
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      accounting_state: assessed
      check_count: "{{ (sandboxed_container_workloads_checks_current | length) | int }}"
      finding_count: "{{ (sandboxed_container_workloads_findings_current | length) | int }}"
      sandboxed_container_workloads_present: "{{ sandboxed_container_workloads_present_current | bool }}"
      sandboxed_container_workloads_healthy: "{{ sandboxed_container_workloads_healthy_current | bool }}"
      sandboxed_container_workloads_context_present: "{{ sandboxed_container_workloads_context_present_current | bool }}"
      status_summary: "{{ sandboxed_container_workloads_section_override_current.status }}"
      reason_summary: "{{ sandboxed_container_workloads_section_override_current.top_detail }}"
    capability_artifact_render_inputs:
      day2_sandboxed_container_workloads_section: "{{ sandboxed_container_workloads_section_override_current }}"
    capability_artifact_collection_inputs:
      sandboxed_container_workloads_present: "{{ sandboxed_container_workloads_present_current | bool }}"
      sandboxed_container_workloads_healthy: "{{ sandboxed_container_workloads_healthy_current | bool }}"
      sandboxed_container_workloads_context_present: "{{ sandboxed_container_workloads_context_present_current | bool }}"
