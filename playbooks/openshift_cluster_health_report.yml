        - name: Persist shared collection and analysis artifacts for collected run
          ansible.builtin.include_role:
            name: report_common
            tasks_from: persist_openshift_shared_artifacts.yml

        - name: Save collected analysis checkpoint
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: analysis
            run_checkpoint_resume_next_stage: report
            run_checkpoint_status: completed
            run_checkpoint_write_snapshot: true
            run_checkpoint_snapshot_payload:
              platform_family: "{{ platform_family }}"
              provider_family: "{{ provider_family }}"
              kube_cli: "{{ kube_cli }}"
              report_mode_resolved: "{{ report_mode_resolved }}"
              report_run_mode: "{{ report_run_mode | default('fresh') }}"
              report_output_dir: "{{ report_output_dir }}"
              report_basename: "{{ report_basename }}"
              report_generate_html: "{{ report_generate_html | default(false) }}"
              report_generate_pdf: "{{ report_generate_pdf | default(false) }}"
              report_timestamp: "{{ report_timestamp | default('') }}"
              report_generated_at: "{{ report_generated_at | default('') }}"
              cluster_profile_mode: "{{ cluster_profile_mode | default('auto') }}"
              cluster_health_profile: "{{ cluster_health_profile | default({}) }}"
              cluster_profile: "{{ cluster_profile | default({}) }}"
              resolved_cluster_profile_mode: "{{ resolved_cluster_profile_mode | default(cluster_profile_mode | default('auto')) }}"
              collected_resource_graph: "{{ collected_resource_graph | default({}) }}"
              live_support_data: "{{ live_support_data | default({}) }}"

