---
# Generic Kubernetes production capability profile.
# Use with:
#   ansible-playbook playbooks/k8s_cluster_health_report.yml -e @inputs/kubernetes-capability-profile.yml
kubernetes_report_capability_profile:
  backup:
    required: true
    criticality: critical
    expected_state: healthy
    owner: operations
    evidence_required: [kubectl-get]
    notes: "Production clusters should have backup and restore evidence."
  network_policy_baseline:
    required: true
    criticality: high
    expected_state: configured
    owner: security
    evidence_required: [kubectl-get]
    notes: "Production namespaces should have NetworkPolicy coverage unless an approved alternate segmentation control exists."
  resource_quota_governance:
    required: true
    criticality: high
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "User namespaces should have ResourceQuota coverage."
  workload_resilience:
    required: true
    criticality: high
    expected_state: configured
    owner: app
    evidence_required: [kubectl-get]
    notes: "Multi-replica workloads should use disruption and spread controls."
  resource_requests_limits:
    required: true
    criticality: high
    expected_state: configured
    owner: app
    evidence_required: [kubectl-get]
    notes: "Workloads should define CPU and memory requests and limits."
  external_storage:
    required: true
    criticality: high
    expected_state: present
    owner: storage
    evidence_required: [kubectl-get]
    notes: "Production clusters normally need external persistent storage."
  deprecated_api_review:
    required: true
    criticality: high
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "Deprecated APIs should be reviewed before upgrades."
  external_logging:
    required: true
    criticality: high
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get]
    notes: "Logs should have an intentional collection or forwarding path."
  external_monitoring:
    required: true
    criticality: high
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Monitoring and alerting should be configured for production operations."
  user_workload_monitoring:
    required: true
    criticality: high
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Application teams should expose scrape configuration through ServiceMonitor, PodMonitor, or an approved equivalent."
  workload_vulnerability_scanner:
    required: false
    criticality: high
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Require when workload image vulnerability scanning or secured-cluster scanner agents are part of the security baseline."
  limit_range_defaults:
    required: true
    criticality: medium
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "User namespaces should have LimitRange defaults."
  ingress_exposure:
    required: true
    criticality: medium
    expected_state: configured
    owner: network
    evidence_required: [kubectl-get]
    notes: "Ingress should be intentional, owned, and TLS-aware."
  tls_certificate_hygiene:
    required: true
    criticality: medium
    expected_state: configured
    owner: security
    evidence_required: [kubectl-get]
    notes: "Application TLS material should be inventoried and reviewed for expiry."
  grafana_dashboards:
    required: false
    criticality: medium
    expected_state: present
    owner: observability
    evidence_required: [kubectl-get]
    notes: "Require when the customer expects in-cluster Grafana dashboards for application or platform metrics."
  external_private_registry:
    required: false
    criticality: medium
    expected_state: configured
    owner: delivery
    evidence_required: [kubectl-get]
    notes: "Require when workloads are expected to pull application images from an external private registry."
  autoscaling:
    required: false
    criticality: medium
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get, metrics]
    notes: "Require when workload or node autoscaling is expected."
  policy_engine:
    required: false
    criticality: medium
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Require when admission policy-as-code is part of the baseline."
  secrets_management:
    required: false
    criticality: medium
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Require when external or sealed secret workflows are expected."
  cicd_runners:
    required: false
    criticality: medium
    expected_state: present
    owner: delivery
    evidence_required: [kubectl-get, metrics]
    notes: "Show when cluster-hosted CI/CD runners are detected or required."
  provider_node_pools:
    required: true
    criticality: medium
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get, provider-api]
    notes: "Node-pool, zone, and provider metadata should be available for resilience review."
  service_mesh:
    required: false
    criticality: low
    expected_state: present
    owner: network
    evidence_required: [kubectl-get]
    notes: "Require only when service mesh is part of the application platform."
