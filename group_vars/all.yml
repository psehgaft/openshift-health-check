# Self Node Remediation Operator install check (TC-28)
tc28_operator_namespace: openshift-workload-availability
tc28_operator_group_name: workload-availability-operator-group
tc28_subscription_name: self-node-remediation
tc28_subscription_api_resource: subscriptions.operators.coreos.com
tc28_csv_api_resource: clusterserviceversions.operators.coreos.com
tc28_installplan_api_resource: installplans.operators.coreos.com
tc28_packagemanifest_api_resource: packagemanifests.packages.operators.coreos.com
tc28_package_name: self-node-remediation
tc28_channel: stable
tc28_catalog_source: redhat-operators
tc28_catalog_namespace: openshift-marketplace
tc28_install_wait_attempts: 60
tc28_install_wait_interval_seconds: 10
tc28_controller_deployment: self-node-remediation-controller-manager
tc28_controller_rollout_timeout: 10m

# Add site-specific FC/iSCSI StorageClass names that cannot be auto-detected.
tc67a_san_storage_class_names: []
