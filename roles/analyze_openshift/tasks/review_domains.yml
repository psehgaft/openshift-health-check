---
- name: Build APIService availability findings
  ansible.builtin.set_fact:
    apiservice_issues: "{{ apiservice_issues | default([]) + apiservice_issue_entry }}"
  loop: "{{ (apiservices | default({})).get('items', []) }}"
  vars:
    available_condition: "{{ (item.status.conditions | default([]) | selectattr('type', 'equalto', 'Available') | list | first) | default({}) }}"
    service_ref: "{{ ((item.spec.service.namespace | default('')) ~ '/' ~ (item.spec.service.name | default(''))) if (item.spec.service is defined) else 'Local' }}"
    apiservice_issue_entry: >-
      {{
        [{
          'name': item.metadata.name | default('unknown'),
          'service': service_ref,
          'available': available_condition.status | default('Unknown'),
          'reason': available_condition.reason | default('unknown'),
          'detail': available_condition.message | default(available_condition.reason | default('APIService is not reporting Available=True'))
        }]
        if ((available_condition.status | default('Unknown')) != 'True')
        else []
      }}
  changed_when: false

- name: Build secret type counts
  ansible.builtin.set_fact:
    secret_type_counts: "{{ secret_type_counts | default({}) | combine({secret_type: (((secret_type_counts | default({}))[secret_type] | default(0)) + 1)}, recursive=True) }}"
  loop: "{{ (secrets | default({})).get('items', []) }}"
  vars:
    secret_type: "{{ item.type | default('unknown') }}"
  changed_when: false

- name: Build BuildConfig strategy counts
  ansible.builtin.set_fact:
    buildconfig_strategy_counts: "{{ buildconfig_strategy_counts | default({}) | combine({strategy_name: (((buildconfig_strategy_counts | default({}))[strategy_name] | default(0)) + 1)}, recursive=True) }}"
    buildconfigs_without_triggers: "{{ buildconfigs_without_triggers | default([]) + triggerless_entry }}"
  loop: "{{ (buildconfigs | default({})).get('items', []) }}"
  vars:
    strategy_name: >-
      {{
        'Source'
        if (item.spec.strategy.sourceStrategy is defined)
        else (
          'Docker'
          if (item.spec.strategy.dockerStrategy is defined)
          else (
            'Custom'
            if (item.spec.strategy.customStrategy is defined)
            else (
              'JenkinsPipeline'
              if (item.spec.strategy.jenkinsPipelineStrategy is defined)
              else 'Unknown'
            )
          )
        )
      }}
    triggerless_entry: >-
      {{
        [{
          'namespace': item.metadata.namespace | default(''),
          'name': item.metadata.name | default(''),
          'strategy': strategy_name
        }]
        if ((item.spec.triggers | default([]) | length) == 0)
        else []
      }}
  changed_when: false

- name: Build PipelineRun status summary
  ansible.builtin.set_fact:
    pipelinerun_status_counts: "{{ pipelinerun_status_counts | default({}) | combine({pipelinerun_status: (((pipelinerun_status_counts | default({}))[pipelinerun_status] | default(0)) + 1)}, recursive=True) }}"
    failed_pipelineruns: "{{ failed_pipelineruns | default([]) + failed_pipelinerun_entry }}"
  loop: "{{ (pipelineruns | default({})).get('items', []) }}"
  vars:
    succeeded_condition: "{{ (item.status.conditions | default([]) | selectattr('type', 'equalto', 'Succeeded') | list | first) | default({}) }}"
    pipelinerun_status: >-
      {{
        'Succeeded'
        if (succeeded_condition.status | default('')) == 'True'
        else (
          'Failed'
          if (succeeded_condition.status | default('')) == 'False'
          else (
            'Running'
            if (succeeded_condition.status | default('')) == 'Unknown'
            else (item.status.phase | default('Unknown'))
          )
        )
      }}
    failed_pipelinerun_entry: >-
      {{
        [{
          'namespace': item.metadata.namespace | default(''),
          'name': item.metadata.name | default(''),
          'pipeline': ((item.metadata.labels | default({})).get('tekton.dev/pipeline', 'unknown')),
          'status': pipelinerun_status,
          'reason': succeeded_condition.reason | default(item.status.reason | default('unknown')),
          'started_at': item.status.startTime | default('unknown'),
          'completed_at': item.status.completionTime | default('in-progress')
        }]
        if (pipelinerun_status == 'Failed')
        else []
      }}
  changed_when: false

- name: Build ComplianceSuite summary
  ansible.builtin.set_fact:
    compliance_result_counts: "{{ compliance_result_counts | default({}) | combine({suite_result: (((compliance_result_counts | default({}))[suite_result] | default(0)) + 1)}, recursive=True) }}"
    compliance_suite_findings: "{{ compliance_suite_findings | default([]) + compliance_suite_finding_entry }}"
    compliance_suite_summary: "{{ compliance_suite_summary | default([]) + [compliance_suite_summary_entry] }}"
  loop: "{{ (compliancesuites | default({})).get('items', []) }}"
  vars:
    suite_phase: "{{ item.status.phase | default('Unknown') }}"
    suite_result: "{{ item.status.result | default(suite_phase) }}"
    compliance_suite_summary_entry:
      namespace: "{{ item.metadata.namespace | default('') }}"
      name: "{{ item.metadata.name | default('') }}"
      phase: "{{ suite_phase }}"
      result: "{{ suite_result }}"
    compliance_suite_finding_entry: >-
      {{
        [compliance_suite_summary_entry]
        if (
          suite_result not in ['COMPLIANT', 'NOT-APPLICABLE', 'PASS']
          or suite_phase not in ['DONE', 'COMPLIANT', 'NOT-APPLICABLE']
        ) else []
      }}
  changed_when: false

- name: Build DataProtectionApplication summary
  ansible.builtin.set_fact:
    dataprotectionapplication_summary: "{{ dataprotectionapplication_summary | default([]) + [dpa_summary_entry] }}"
  loop: "{{ (dataprotectionapplications | default({})).get('items', []) }}"
  vars:
    reconciled_condition: "{{ (item.status.conditions | default([]) | selectattr('type', 'equalto', 'Reconciled') | list | first) | default({}) }}"
    dpa_summary_entry:
      namespace: "{{ item.metadata.namespace | default('') }}"
      name: "{{ item.metadata.name | default('') }}"
      phase: "{{ item.status.phase | default('Unknown') }}"
      reconciled: "{{ reconciled_condition.status | default('Unknown') }}"
      reason: "{{ reconciled_condition.reason | default('unknown') }}"
  changed_when: false

- name: Build SCC posture summary
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json

    sccs = json.loads(r'''{{ (securitycontextconstraints | default({})).get('items', []) | to_json }}''')
    summary = []
    findings = []

    def is_platform_namespace(ns):
        return ns.startswith("openshift-") or ns.startswith("kube-") or ns in {"default", "openshift"}

    for scc in sccs:
        meta = scc.get("metadata", {}) or {}
        users = (scc.get("users") or [])
        groups = (scc.get("groups") or [])
        volumes = scc.get("volumes") or []
        run_as_user = ((scc.get("runAsUser") or {}).get("type") or "Unknown")
        name = meta.get("name", "unknown")
        privileged = bool(scc.get("allowPrivilegedContainer", False))
        host_dir = bool(scc.get("allowHostDirVolumePlugin", False))
        host_network = bool(scc.get("allowHostNetwork", False))
        host_pid = bool(scc.get("allowHostPID", False))
        host_ipc = bool(scc.get("allowHostIPC", False))
        anyuid = run_as_user == "RunAsAny"
        all_volumes = "*" in volumes
        risk_flags = []
        if privileged:
            risk_flags.append("privileged")
        if anyuid:
            risk_flags.append("runAsAny")
        if host_dir:
            risk_flags.append("hostPath")
        if host_network:
            risk_flags.append("hostNetwork")
        if host_pid:
            risk_flags.append("hostPID")
        if host_ipc:
            risk_flags.append("hostIPC")
        if all_volumes:
            risk_flags.append("allVolumes")
        summary.append({
            "name": name,
            "priority": meta.get("annotations", {}).get("kubernetes.io/description", ""),
            "privileged": privileged,
            "anyuid": anyuid,
            "host_network": host_network,
            "host_pid": host_pid,
            "host_ipc": host_ipc,
            "host_dir": host_dir,
            "all_volumes": all_volumes,
            "user_count": len(users),
            "group_count": len(groups),
            "risk_summary": ", ".join(risk_flags) if risk_flags else "restricted"
        })
        if not risk_flags:
            continue
        for subject in users:
            if subject.startswith("system:serviceaccount:"):
                parts = subject.split(":")
                if len(parts) >= 4:
                    ns = parts[2]
                    sa = parts[3]
                    if not is_platform_namespace(ns):
                        findings.append({
                            "scc": name,
                            "subject_kind": "ServiceAccount",
                            "subject": f"{ns}/{sa}",
                            "risk_summary": ", ".join(risk_flags),
                        })
            elif not subject.startswith("system:"):
                findings.append({
                    "scc": name,
                    "subject_kind": "User",
                    "subject": subject,
                    "risk_summary": ", ".join(risk_flags),
                })
        for subject in groups:
            if subject.startswith("system:serviceaccounts:"):
                parts = subject.split(":")
                if len(parts) >= 3:
                    ns = parts[2]
                    if not is_platform_namespace(ns):
                        findings.append({
                            "scc": name,
                            "subject_kind": "ServiceAccount group",
                            "subject": ns,
                            "risk_summary": ", ".join(risk_flags),
                        })
            elif not subject.startswith("system:"):
                findings.append({
                    "scc": name,
                    "subject_kind": "Group",
                    "subject": subject,
                    "risk_summary": ", ".join(risk_flags),
                })

    print(json.dumps({
        "scc_posture_summary": sorted(summary, key=lambda item: item["name"]),
        "scc_grant_findings": sorted(findings, key=lambda item: (item["scc"], item["subject_kind"], item["subject"])),
    }))
    PY
  register: scc_posture_summary_cmd
  changed_when: false
  failed_when: false

- name: Normalize SCC posture summary
  ansible.builtin.set_fact:
    scc_posture_summary: "{{ (scc_posture_summary_cmd.stdout | from_json).scc_posture_summary if (scc_posture_summary_cmd.rc == 0 and (scc_posture_summary_cmd.stdout | default('') | length > 0)) else [] }}"
    scc_grant_findings: "{{ (scc_posture_summary_cmd.stdout | from_json).scc_grant_findings if (scc_posture_summary_cmd.rc == 0 and (scc_posture_summary_cmd.stdout | default('') | length > 0)) else [] }}"
