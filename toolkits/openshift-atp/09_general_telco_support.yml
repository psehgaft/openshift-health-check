---
# ==============================================================================
# Section 9: General Support & Telco 5G Profile (TC 63 to TC 73)
# ==============================================================================

# TC 63: Quay Registry
- name: "TC-63: Quay Registry"
  when: run_tc63_quay_registry | default(true) | bool
  block:
    - name: "TC-63: Verify Quay registry endpoint reachability"
      ansible.builtin.command: curl -s -k -I https://quay.io
      register: tc63_cmd
      changed_when: false
      failed_when: false

    - name: "TC-63: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-63',
          'name': 'Quay Registry',
          'category': 'General Support / Telco',
          'expected': 'Quay enterprise/upstream registry reachable for container images',
          'status': ('Pass' if (tc63_cmd.rc == 0 and ('HTTP' in tc63_cmd.stdout or '200' in tc63_cmd.stdout or '301' in tc63_cmd.stdout)) else 'Fail'),
          'procedure': (tc63_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc63_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc63_cmd.stderr | default(''))) if (tc63_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc63_cmd.rc | string) if tc63_cmd.rc is defined else '')),
          'details': tc63_cmd.stdout | default(tc63_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc63', 'quay']

# TC 64: Must-gather, SSH y sosreport
- name: "TC-64: Must-gather, SSH y sosreport"
  when: run_tc64_must_gather_sosreport | default(true) | bool
  block:
    - name: "TC-64: Collect must-gather and sosreport artifacts"
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          dest_dir="{{ atp_report_dir }}/{{ atp_report_basename }}-TC64-diagnostics"
          mkdir -p "$dest_dir"
          must_gather_dir="$dest_dir/must-gather"
          must_gather_archive="$dest_dir/must-gather.tar.gz"
          must_gather_log="$dest_dir/must-gather.log"
          must_gather_rc=0
          root_rc=1
          sos_rc=1
          copy_rc=1
          node="{{ tc64_node_target | default('') }}"

          echo "== Collect OpenShift must-gather =="
          if timeout 45m oc adm must-gather --dest-dir="$must_gather_dir" --timeout=45m >"$must_gather_log" 2>&1; then
            must_gather_rc=0
          else
            must_gather_rc=$?
          fi
          cat "$must_gather_log"
          must_gather_files="$(find "$must_gather_dir" -type f 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$must_gather_rc" -eq 0 && "$must_gather_files" -gt 0 ]]; then
            if tar -czf "$must_gather_archive" -C "$dest_dir" must-gather; then
              echo "Must-gather archive: $must_gather_archive"
              ls -lh "$must_gather_archive"
              sha256sum "$must_gather_archive"
              if ! gzip -t "$must_gather_archive"; then
                echo "Must-gather archive integrity check failed." >&2
                must_gather_rc=1
              fi
            else
              echo "Could not package the collected must-gather directory." >&2
              must_gather_rc=1
            fi
          else
            echo "Must-gather did not produce files (command rc=$must_gather_rc, files=$must_gather_files)." >&2
            must_gather_rc=1
          fi

          echo "== Select a worker node for host diagnostics =="
          if [[ -z "$node" ]]; then
            node="$(oc get nodes -l node-role.kubernetes.io/worker -o jsonpath='{.items[0].metadata.name}' 2>&1)"
            node_lookup_rc=$?
            if [[ "$node_lookup_rc" -ne 0 || -z "$node" ]]; then
              echo "Could not discover a worker node: $node" >&2
              node=""
            fi
          fi
          if [[ -n "$node" ]]; then
            echo "Selected node: $node"
            root_output="$(oc debug -q "node/$node" -- chroot /host id -u 2>&1)"
            root_rc=$?
            echo "Host root check output: $root_output (exit code $root_rc)"

            echo "== Generate sosreport through the node debug pod toolbox =="
            sos_output="$(timeout 45m oc debug -q "node/$node" -- chroot /host toolbox run sos report --batch -k crio.all=on -k crio.logs=on -k podman.all=on -k podman.logs=on 2>&1)"
            sos_rc=$?
            echo "$sos_output"
            archive_name="$(printf '%s\n' "$sos_output" | grep -Eo 'sosreport-[^/[:space:]]+\.tar\.(xz|gz|bz2|zst)' | tail -n 1)"
            if [[ -z "$archive_name" ]]; then
              archive_name="$(oc debug -q "node/$node" -- chroot /host find /var/tmp -maxdepth 1 -type f -name 'sosreport-*.tar.*' -mmin -60 -printf '%f\n' 2>/dev/null | sort | tail -n 1)"
            fi
            if [[ -n "$archive_name" ]]; then
              echo "Node sosreport archive: /var/tmp/$archive_name"
              if oc debug -q "node/$node" -- cat "/host/var/tmp/$archive_name" > "$dest_dir/$archive_name" && [[ -s "$dest_dir/$archive_name" ]]; then
                echo "Copied sosreport: $dest_dir/$archive_name"
                ls -lh "$dest_dir/$archive_name"
                sha256sum "$dest_dir/$archive_name"
                archive_valid=0
                case "$archive_name" in
                  *.tar.xz) xz -t "$dest_dir/$archive_name" || archive_valid=1 ;;
                  *.tar.gz) gzip -t "$dest_dir/$archive_name" || archive_valid=1 ;;
                  *.tar.bz2) bzip2 -t "$dest_dir/$archive_name" || archive_valid=1 ;;
                  *.tar.zst) zstd -t "$dest_dir/$archive_name" || archive_valid=1 ;;
                  *) echo "Unsupported sosreport archive format: $archive_name" >&2; archive_valid=1 ;;
                esac
                if [[ "$archive_valid" -eq 0 ]]; then
                  copy_rc=0
                else
                  echo "sosreport archive integrity check failed." >&2
                  copy_rc=1
                fi
              else
                echo "Could not copy a non-empty sosreport archive from the node." >&2
              fi
            else
              echo "sosreport archive was not found in the command output or host /var/tmp." >&2
            fi
          else
            echo "No worker node was available for sosreport collection." >&2
          fi

          echo "Artifacts directory: $dest_dir"
          if [[ "$must_gather_rc" -eq 0 && "$root_rc" -eq 0 && "$sos_rc" -eq 0 && "$copy_rc" -eq 0 ]]; then
            echo "TC64_RESULT=PASS"
            exit 0
          fi
          echo "TC64_RESULT=FAIL (must-gather=$must_gather_rc root-access=$root_rc sosreport=$sos_rc archive-copy=$copy_rc)" >&2
          exit 1
        executable: /bin/bash
      register: tc64_cmd
      changed_when: false
      failed_when: false
      async: 5400
      poll: 10

    - name: "TC-64: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-64',
          'name': 'Must-gather, SSH y sosreport',
          'category': 'General Support / Telco',
          'expected': 'A non-empty must-gather archive and a non-empty, valid sosreport archive are generated and saved under the ATP report directory; debug access reaches host root',
          'status': ('Pass' if tc64_cmd.rc == 0 else 'Fail'),
          'procedure': 'Run oc adm must-gather with the supported command and timeout; access a worker host through oc debug and chroot /host; run sos report non-interactively through toolbox; copy both diagnostic archives to the ATP report directory and record their SHA-256 checksums',
          'evidence': ((tc64_cmd.stdout | default('')) ~ (('\\nSTDERR:\\n' ~ (tc64_cmd.stderr | default(''))) if (tc64_cmd.stderr | default('') | length > 0) else '') ~ ('\\nExit code: ' ~ (tc64_cmd.rc | string) if tc64_cmd.rc is defined else '')),
          'details': 'Diagnostic artifacts are saved under ' ~ (atp_report_dir | string) ~ '; inspect the captured archive paths and checksums.',
          'remediation': 'Review must-gather logs and the selected node debug output. Confirm cluster-admin permissions, image access for the default must-gather/toolbox images, sufficient disk space, and node scheduling. Resolve the failing stage and rerun; the playbook does not upload diagnostic archives.'
        }] }}"
  tags: ['general', 'telco', 'tc64', 'must_gather']

