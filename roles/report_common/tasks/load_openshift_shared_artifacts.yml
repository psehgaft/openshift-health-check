---
- name: Initialize loaded OpenShift shared artifacts
  ansible.builtin.set_fact:
    openshift_shared_artifacts: "{{ openshift_shared_artifacts | default({}) }}"

- name: Find OpenShift shared artifacts
  ansible.builtin.find:
    paths: "{{ report_run_workspace_shared_dir }}"
    patterns: "*.json"
    file_type: file
  register: openshift_shared_artifact_files

- name: Load OpenShift shared artifacts in bulk
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_json_artifact_dir.py"
      - "{{ report_run_workspace_shared_dir }}"
  register: openshift_shared_artifacts_cmd
  changed_when: false
  when: (openshift_shared_artifact_files.matched | default(0) | int) > 0

- name: Merge OpenShift shared artifacts
  ansible.builtin.set_fact:
    openshift_shared_artifacts: >-
      {{
        (openshift_shared_artifacts | default({}))
        | combine(
            {
              shared_artifact_key: shared_artifact
            },
            recursive=True
          )
      }}
  vars:
    shared_artifact: "{{ item.value | default({}) }}"
    shared_artifact_key: >-
      {{
        (
          'collection'
          if ((shared_artifact.kind | default('')) == 'shared-collection')
          else (
            'analysis_graph'
            if ((shared_artifact.kind | default('')) == 'shared-analysis-graph')
            else item.key
          )
        )
      }}
  loop: "{{ ((openshift_shared_artifacts_cmd.stdout | default('{}')) | from_json | dict2items) if (openshift_shared_artifacts_cmd is defined and (openshift_shared_artifacts_cmd.rc | default(1)) == 0 and (openshift_shared_artifacts_cmd.stdout | default('') | length) > 0) else [] }}"
  when:
    - shared_artifact | length > 0

- name: Restore canonical facts from OpenShift shared artifacts
  vars:
    openshift_shared_collection_artifact: "{{ (openshift_shared_artifacts | default({})).get('collection', {}) }}"
    openshift_shared_analysis_graph_artifact: "{{ (openshift_shared_artifacts | default({})).get('analysis_graph', {}) }}"
  ansible.builtin.set_fact:
    collected_resource_graph: >-
      {{
        openshift_shared_collection_artifact.collected_resource_graph
        | default(collected_resource_graph | default({}))
      }}
    analysis_graph: >-
      {{
        openshift_shared_analysis_graph_artifact
        | default(analysis_graph | default({}))
      }}
    cluster_profile: >-
      {{
        openshift_shared_analysis_graph_artifact.cluster_profile
        | default(
            openshift_shared_collection_artifact.cluster_profile
            | default(cluster_profile | default({}))
          )
      }}
    evidence_summary: >-
      {{
        openshift_shared_collection_artifact.evidence_summary
        | default(evidence_summary | default({}))
      }}
    assessment_collection_summary: >-
      {{
        openshift_shared_collection_artifact.collection_summary
        | default(assessment_collection_summary | default({}))
      }}
    assessment_collection_failures: >-
      {{
        openshift_shared_collection_artifact.collection_failures
        | default(assessment_collection_failures | default([]))
      }}
    assessment_collection_skipped_optional_commands: >-
      {{
        openshift_shared_collection_artifact.collection_skipped_optional_commands
        | default(assessment_collection_skipped_optional_commands | default([]))
      }}
    live_support_data: >-
      {{
        openshift_shared_collection_artifact.live_support_data
        | default(live_support_data | default({}))
      }}
