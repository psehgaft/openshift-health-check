---
- name: Build API server audit and log retention capability artifact facts
  vars:
    day2_api_server_audit_and_log_retention_section_current: "{{ (day2_capability_sections_by_key | default({})).get('api_server_audit_and_log_retention', {}) }}"
    api_server_audit_profile_current: "{{ (day2_posture_summary | default({})).get('apiserver_audit_profile', 'not-configured') }}"
    api_server_audit_logging_present_current: "{{ ((day2_posture_summary | default({})).get('api_audit_logging_present', false)) | bool }}"
    api_server_audit_retention_present_current: "{{ ((day2_posture_summary | default({})).get('api_audit_retention_present', false)) | bool }}"
    audit_logs_delivery_state_current: "{{ (observability_summary | default({})).get('audit_logs_delivery_state', 'not-configured') }}"
    vendor_managed_log_forwarding_present_current: "{{ ((observability_summary | default({})).get('vendor_managed_log_forwarding_present', false)) | bool }}"
    log_forwarding_vendor_names_current: "{{ (observability_summary | default({})).get('log_forwarding_vendor_names', []) }}"
    api_server_audit_required_current: "{{ (day2_api_server_audit_and_log_retention_section_current.required | default(false)) | bool }}"
    api_server_audit_gap_status_current: "{{ 'WARNING' if (api_server_audit_required_current | bool) else 'INFO' }}"
    api_server_audit_gap_check_status_current: "{{ 'WARN' if (api_server_audit_required_current | bool) else 'INFO' }}"
    api_server_audit_gap_severity_current: "{{ 'warning' if (api_server_audit_required_current | bool) else 'info' }}"
    api_server_audit_healthy_current: >-
      {{
        (api_server_audit_logging_present_current | bool)
        and (api_server_audit_retention_present_current | bool)
        and ((api_server_audit_profile_current | string) not in ['not-configured', 'unknown', ''])
        and (
          (audit_logs_delivery_state_current in ['configured', 'delivering', 'verified'])
          or (vendor_managed_log_forwarding_present_current | bool)
        )
      }}
    api_server_audit_signal_present_current: >-
      {{
        (api_server_audit_logging_present_current | bool)
        or (api_server_audit_retention_present_current | bool)
        or ((api_server_audit_profile_current | string) not in ['not-configured', 'unknown', ''])
        or (vendor_managed_log_forwarding_present_current | bool)
      }}
    api_server_audit_status_current: >-
      {{
        'OK'
        if (api_server_audit_healthy_current | bool)
        else api_server_audit_gap_status_current
      }}
    api_server_audit_reason_current: >-
      {{
        'auditProfile=' ~ (api_server_audit_profile_current | string)
        ~ ' loggingPresent=' ~ ((api_server_audit_logging_present_current | bool) | string)
        ~ ' retentionPresent=' ~ ((api_server_audit_retention_present_current | bool) | string)
        ~ ' deliveryState=' ~ (audit_logs_delivery_state_current | string)
        ~ ' vendorManagedForwarding=' ~ ((vendor_managed_log_forwarding_present_current | bool) | string)
        ~ ' vendors=' ~ (((log_forwarding_vendor_names_current | default([])) | join(',')) or 'none')
      }}
    api_server_audit_recommended_action_current: >-
      {{
        'Validate that API server audit logs are retained and delivered through the intended platform or vendor-managed path.'
        if (api_server_audit_healthy_current | bool)
        else 'If API audit logging is required, configure or verify the audit profile, retention path, and delivery target before treating this control as satisfied.'
      }}
    api_server_audit_checks_current:
      - name: API server audit profile configured
        status: >-
          {{
            'OK'
            if ((api_server_audit_profile_current | string) not in ['not-configured', 'unknown', ''])
            else api_server_audit_gap_check_status_current
          }}
        detail: "auditProfile={{ api_server_audit_profile_current | string }}"
      - name: API audit logging enabled
        status: >-
          {{
            'OK'
            if (api_server_audit_logging_present_current | bool)
            else api_server_audit_gap_check_status_current
          }}
        detail: "loggingPresent={{ (api_server_audit_logging_present_current | bool) | string }}"
      - name: API audit retention configured
        status: >-
          {{
            'OK'
            if (api_server_audit_retention_present_current | bool)
            else api_server_audit_gap_check_status_current
          }}
        detail: "retentionPresent={{ (api_server_audit_retention_present_current | bool) | string }}"
      - name: Audit log delivery path available
        status: >-
          {{
            'OK'
            if (
              (audit_logs_delivery_state_current in ['configured', 'delivering', 'verified'])
              or (vendor_managed_log_forwarding_present_current | bool)
            )
            else api_server_audit_gap_check_status_current
          }}
        detail: >-
          {{
            'deliveryState=' ~ (audit_logs_delivery_state_current | string)
            ~ ' vendorManagedForwarding=' ~ ((vendor_managed_log_forwarding_present_current | bool) | string)
            ~ ' vendors=' ~ (((log_forwarding_vendor_names_current | default([])) | join(',')) or 'none')
          }}
    api_server_audit_checks_enriched_current: >-
      {{
        api_server_audit_checks_current
        | map(
            'combine',
            {
              'capability': 'API server audit and log retention',
              'capability_key': 'api_server_audit_and_log_retention',
              'level': ((day2_api_server_audit_and_log_retention_section_current.criticality | default('medium')) | string),
              'scored': false,
              'source': 'API audit configuration and observability delivery inventory'
            }
          )
        | list
      }}
    api_server_audit_findings_current: >-
      {{
        ([] +
        ([{
          'capability': 'api_server_audit_and_log_retention',
          'issue': 'prod-day2-api-server-audit-and-log-retention-profile-missing',
          'severity': api_server_audit_gap_severity_current,
          'source': 'API audit configuration and observability delivery inventory',
          'detail': 'The API server audit profile is not configured.',
          'recommended_action': api_server_audit_recommended_action_current,
          'docs': ((day2_api_server_audit_and_log_retention_section_current.docs | default([])) | string)
        }] if ((api_server_audit_profile_current | string) in ['not-configured', 'unknown', '']) else []) +
        ([{
          'capability': 'api_server_audit_and_log_retention',
          'issue': 'prod-day2-api-server-audit-and-log-retention-logging-missing',
          'severity': api_server_audit_gap_severity_current,
          'source': 'API audit configuration and observability delivery inventory',
          'detail': 'API audit logging was not detected.',
          'recommended_action': api_server_audit_recommended_action_current,
          'docs': ((day2_api_server_audit_and_log_retention_section_current.docs | default([])) | string)
        }] if not (api_server_audit_logging_present_current | bool) else []) +
        ([{
          'capability': 'api_server_audit_and_log_retention',
          'issue': 'prod-day2-api-server-audit-and-log-retention-retention-missing',
          'severity': api_server_audit_gap_severity_current,
          'source': 'API audit configuration and observability delivery inventory',
          'detail': 'API audit retention was not detected.',
          'recommended_action': api_server_audit_recommended_action_current,
          'docs': ((day2_api_server_audit_and_log_retention_section_current.docs | default([])) | string)
        }] if not (api_server_audit_retention_present_current | bool) else []) +
        ([{
          'capability': 'api_server_audit_and_log_retention',
          'issue': 'prod-day2-api-server-audit-and-log-retention-delivery-gap',
          'severity': api_server_audit_gap_severity_current,
          'source': 'API audit configuration and observability delivery inventory',
          'detail': 'No healthy audit log delivery path was detected through the platform or vendor-managed forwarding path.',
          'recommended_action': api_server_audit_recommended_action_current,
          'docs': ((day2_api_server_audit_and_log_retention_section_current.docs | default([])) | string)
        }] if not (
          (audit_logs_delivery_state_current in ['configured', 'delivering', 'verified'])
          or (vendor_managed_log_forwarding_present_current | bool)
        ) else []))
      }}
    api_server_audit_section_override_current: >-
      {{
        (day2_api_server_audit_and_log_retention_section_current | default({}))
        | combine(
            {
              'accounting_state': 'assessed',
              'check_count': (api_server_audit_checks_current | length),
              'finding_count': (api_server_audit_findings_current | length),
              'checks': api_server_audit_checks_enriched_current,
              'findings': api_server_audit_findings_current,
              'status': api_server_audit_status_current,
              'top_detail': api_server_audit_reason_current,
              'recommended_action': api_server_audit_recommended_action_current
            },
            recursive=True
          )
      }}
  ansible.builtin.set_fact:
    capability_artifact_key: api_server_audit_and_log_retention
    capability_artifact_section_override: "{{ api_server_audit_section_override_current }}"
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      accounting_state: assessed
      check_count: "{{ (api_server_audit_checks_current | length) | int }}"
      finding_count: "{{ (api_server_audit_findings_current | length) | int }}"
      observability_status: "{{ api_server_audit_status_current }}"
      observability_reason_summary: "{{ api_server_audit_reason_current }}"
      top_detail: "{{ api_server_audit_reason_current }}"
      apiserver_audit_profile: "{{ api_server_audit_profile_current }}"
    capability_artifact_render_inputs:
      day2_api_server_audit_and_log_retention_section: "{{ api_server_audit_section_override_current }}"
    capability_artifact_collection_inputs:
      apiserver_audit_profile: "{{ api_server_audit_profile_current }}"
      api_audit_logging_present: "{{ api_server_audit_logging_present_current | bool }}"
      api_audit_retention_present: "{{ api_server_audit_retention_present_current | bool }}"
      audit_logs_delivery_state: "{{ audit_logs_delivery_state_current }}"
      vendor_managed_log_forwarding_present: "{{ vendor_managed_log_forwarding_present_current | bool }}"
      log_forwarding_vendor_names: "{{ log_forwarding_vendor_names_current }}"
