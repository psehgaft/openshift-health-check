---
- name: Build node tuning operator capability artifact facts
  vars:
    day2_node_tuning_operator_section_current: "{{ (day2_capability_sections_by_key | default({})).get('node_tuning_operator', {}) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: node_tuning_operator
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      node_tuning_operator_present: "{{ ((day2_posture_summary | default({})).get('node_tuning_operator_present', false)) | bool }}"
      node_tuning_operator_healthy: "{{ ((day2_posture_summary | default({})).get('node_tuning_operator_healthy', false)) | bool }}"
      node_tuning_operator_context_present: "{{ ((day2_posture_summary | default({})).get('node_tuning_operator_context_present', false)) | bool }}"
      status_summary: "{{ day2_node_tuning_operator_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_node_tuning_operator_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_node_tuning_operator_section: "{{ day2_node_tuning_operator_section_current }}"
    capability_artifact_collection_inputs:
      node_tuning_operator_present: "{{ ((day2_posture_summary | default({})).get('node_tuning_operator_present', false)) | bool }}"
      node_tuning_operator_healthy: "{{ ((day2_posture_summary | default({})).get('node_tuning_operator_healthy', false)) | bool }}"
      node_tuning_operator_context_present: "{{ ((day2_posture_summary | default({})).get('node_tuning_operator_context_present', false)) | bool }}"
