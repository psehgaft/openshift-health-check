---
- name: Build platform pod issue list
  ansible.builtin.set_fact:
    platform_pod_issues: "{{ platform_pod_issues | default([]) + pod_issue }}"
  loop: "{{ (analysis_graph.pods | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    phase: "{{ item.status.phase | default('Unknown') }}"
    ready_container_count: "{{ item.status.containerStatuses | default([]) | selectattr('ready', 'equalto', true) | list | length | int }}"
    total_container_count: "{{ item.status.containerStatuses | default([]) | length | int }}"
    pod_issue: >-
      {{
        [{
          'namespace': ns_name,
          'name': item.metadata.name,
          'phase': phase,
          'ready': (ready_container_count | int) ~ '/' ~ (total_container_count | int)
        }]
        if (
          ((ns_name is match(platform_namespaces_regex)) and (phase not in ['Running', 'Succeeded', 'Completed']))
          or
          ((ns_name is match(platform_namespaces_regex)) and phase == 'Running' and (total_container_count | int) > 0 and (ready_container_count | int) < (total_container_count | int))
        ) else []
      }}
  changed_when: false

- name: Build unhealthy user pod findings
  ansible.builtin.set_fact:
    unhealthy_user_pods: "{{ (unhealthy_user_pods | default([])) + pod_issue }}"
  loop: "{{ (analysis_graph.pods | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    phase: "{{ item.status.phase | default('Unknown') }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    ready_container_count: "{{ item.status.containerStatuses | default([]) | selectattr('ready', 'equalto', true) | list | length | int }}"
    total_container_count: "{{ item.status.containerStatuses | default([]) | length | int }}"
    pod_issue: >-
      {{
        [{
          'namespace': ns_name,
          'name': item.metadata.name,
          'phase': phase,
          'ready': (ready_container_count | int) ~ '/' ~ (total_container_count | int)
        }]
        if (
          (is_user_namespace | bool)
          and (phase not in ['Running', 'Succeeded', 'Completed'])
        ) else []
      }}
  changed_when: false

- name: Build deployment health findings
  ansible.builtin.set_fact:
    deployment_issues: "{{ deployment_issues | default([]) + issue_entry }}"
  loop: "{{ (analysis_graph.deployments | default({})).get('items', []) }}"
  vars:
    desired: "{{ item.spec.replicas | default(1) | int }}"
    available: "{{ item.status.availableReplicas | default(0) | int }}"
    ready: "{{ item.status.readyReplicas | default(0) | int }}"
    updated: "{{ item.status.updatedReplicas | default(0) | int }}"
    issue_entry: "{{ [{'kind': 'Deployment', 'namespace': item.metadata.namespace | default(''), 'name': item.metadata.name, 'desired': (desired | int), 'available': (available | int), 'ready': (ready | int), 'updated': (updated | int)}] if (desired | int) > 0 and ((available | int) < (desired | int) or (ready | int) < (desired | int) or (updated | int) < (desired | int)) else [] }}"
  changed_when: false

- name: Build statefulset health findings
  ansible.builtin.set_fact:
    statefulset_issues: "{{ statefulset_issues | default([]) + issue_entry }}"
  loop: "{{ (analysis_graph.statefulsets | default({})).get('items', []) }}"
  vars:
    desired: "{{ item.spec.replicas | default(1) | int }}"
    available: "{{ item.status.currentReplicas | default(0) | int }}"
    ready: "{{ item.status.readyReplicas | default(0) | int }}"
    updated: "{{ item.status.updatedReplicas | default(0) | int }}"
    issue_entry: "{{ [{'kind': 'StatefulSet', 'namespace': item.metadata.namespace | default(''), 'name': item.metadata.name, 'desired': (desired | int), 'available': (available | int), 'ready': (ready | int), 'updated': (updated | int)}] if (desired | int) > 0 and ((ready | int) < (desired | int) or (updated | int) < (desired | int)) else [] }}"
  changed_when: false

- name: Build daemonset health findings
  ansible.builtin.set_fact:
    daemonset_issues: "{{ daemonset_issues | default([]) + issue_entry }}"
  loop: "{{ (analysis_graph.daemonsets | default({})).get('items', []) }}"
  vars:
    desired: "{{ item.status.desiredNumberScheduled | default(0) | int }}"
    available: "{{ item.status.numberReady | default(0) | int }}"
    updated: "{{ item.status.updatedNumberScheduled | default(0) | int }}"
    issue_entry: "{{ [{'kind': 'DaemonSet', 'namespace': item.metadata.namespace | default(''), 'name': item.metadata.name, 'desired': (desired | int), 'available': (available | int), 'ready': (available | int), 'updated': (updated | int)}] if (desired | int) > 0 and ((available | int) < (desired | int) or (updated | int) < (desired | int)) else [] }}"
  changed_when: false

- name: Combine workload health findings
  ansible.builtin.set_fact:
    workload_health_issues: "{{ (deployment_issues | default([])) + (statefulset_issues | default([])) + (daemonset_issues | default([])) }}"

- name: Build high replica workload review findings
  ansible.builtin.set_fact:
    high_replica_workloads: "{{ (high_replica_workloads | default([])) + replica_review_entry }}"
  loop: "{{ ((analysis_graph.deployments | default({})).get('items', [])) + ((analysis_graph.statefulsets | default({})).get('items', [])) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    kind_name: "{{ item.kind | default('Workload') }}"
    desired_replicas: "{{ item.spec.replicas | default(1) | int }}"
    replica_review_entry: >-
      {{
        [{
          'kind': kind_name,
          'namespace': ns_name,
          'name': item.metadata.name | default('unknown'),
          'replicas': desired_replicas
        }]
        if ((is_user_namespace | bool) and (desired_replicas | int) > 10) else []
      }}
  changed_when: false

- name: Build multi-replica workload resilience findings
  block:
    - name: Create workload resilience input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-workload-resilience-
        suffix: .json
      register: workload_resilience_input_file
      changed_when: false

    - name: Write workload resilience input data
      ansible.builtin.copy:
        dest: "{{ workload_resilience_input_file.path }}"
        mode: "0600"
        content: "{{ {
          'deployments': ((analysis_graph.deployments | default({})).get('items', [])),
          'statefulsets': ((analysis_graph.statefulsets | default({})).get('items', [])),
          'poddisruptionbudgets': ((analysis_graph.poddisruptionbudgets | default({})).get('items', [])),
          'exclude_regex': (user_namespaces_exclude_regex | default('^$'))
        } | to_json }}"
      changed_when: false

    - name: Run workload resilience analysis
      ansible.builtin.shell: |
        python3 - <<'PY' "{{ workload_resilience_input_file.path }}"
        import json
        import re
        import sys

        with open(sys.argv[1], "r", encoding="utf-8") as handle:
            data = json.load(handle)

        exclude_re = re.compile(data.get("exclude_regex") or r"^$")

        def normalize_labels(raw):
            return {
                str(key): str(value)
                for key, value in (raw or {}).items()
                if key not in (None, "") and value not in (None, "")
            }

        def match_expression(labels, expr):
            key = str((expr or {}).get("key") or "")
            if not key:
                return False
            operator = str((expr or {}).get("operator") or "")
            values = [str(value) for value in ((expr or {}).get("values") or [])]
            present = key in labels
            label_value = str(labels.get(key, ""))
            if operator == "In":
                return present and label_value in values
            if operator == "NotIn":
                return (not present) or label_value not in values
            if operator == "Exists":
                return present
            if operator == "DoesNotExist":
                return not present
            return False

        def selector_matches(selector, labels):
            selector = selector or {}
            match_labels = normalize_labels(selector.get("matchLabels"))
            expressions = selector.get("matchExpressions") or []
            if not match_labels and not expressions:
                return True
            for key, value in match_labels.items():
                if labels.get(key) != value:
                    return False
            return all(match_expression(labels, expr) for expr in expressions)

        def has_spread_policy(pod_spec):
            pod_spec = pod_spec or {}
            spread_constraints = pod_spec.get("topologySpreadConstraints") or []
            if spread_constraints:
                return True
            affinity = (pod_spec.get("affinity") or {}).get("podAntiAffinity") or {}
            return bool((affinity.get("requiredDuringSchedulingIgnoredDuringExecution") or []) or (affinity.get("preferredDuringSchedulingIgnoredDuringExecution") or []))

        workloads = []
        for collection_name, kind in (("deployments", "Deployment"), ("statefulsets", "StatefulSet")):
            for item in data.get(collection_name, []):
                metadata = item.get("metadata", {}) or {}
                namespace = str(metadata.get("namespace") or "")
                if exclude_re.search(namespace):
                    continue
                desired_replicas = int(((item.get("spec", {}) or {}).get("replicas", 1)) or 1)
                if desired_replicas < 2:
                    continue
                template = (((item.get("spec", {}) or {}).get("template", {}) or {}))
                template_metadata = template.get("metadata", {}) or {}
                template_spec = template.get("spec", {}) or {}
                workloads.append({
                    "kind": kind,
                    "namespace": namespace,
                    "name": str(metadata.get("name") or "unknown"),
                    "replicas": desired_replicas,
                    "labels": normalize_labels(template_metadata.get("labels")),
                    "has_spread_policy": has_spread_policy(template_spec),
                })

        pdbs_by_namespace = {}
        for item in data.get("poddisruptionbudgets", []):
            metadata = item.get("metadata", {}) or {}
            namespace = str(metadata.get("namespace") or "")
            pdbs_by_namespace.setdefault(namespace, []).append({
                "name": str(metadata.get("name") or "unknown"),
                "selector": ((item.get("spec", {}) or {}).get("selector") or {}),
            })

        findings = []
        for workload in workloads:
            matching_pdbs = [
                pdb["name"]
                for pdb in pdbs_by_namespace.get(workload["namespace"], [])
                if selector_matches(pdb.get("selector"), workload["labels"])
            ]
            if not matching_pdbs:
                findings.append({
                    "kind": workload["kind"],
                    "namespace": workload["namespace"],
                    "name": workload["name"],
                    "issue": "missing-pod-disruption-budget",
                    "detail": f"replicas={workload['replicas']}; no matching PodDisruptionBudget"
                })
            if not workload["has_spread_policy"]:
                findings.append({
                    "kind": workload["kind"],
                    "namespace": workload["namespace"],
                    "name": workload["name"],
                    "issue": "missing-workload-spread-policy",
                    "detail": f"replicas={workload['replicas']}; no topology spread constraints or pod anti-affinity"
                })

        print(json.dumps({
            "findings": findings,
            "multi_replica_workload_count": len(workloads),
            "multi_replica_workloads_without_pdb": sum(1 for item in findings if item["issue"] == "missing-pod-disruption-budget"),
            "multi_replica_workloads_without_spread_policy": sum(1 for item in findings if item["issue"] == "missing-workload-spread-policy"),
        }))
        PY
      register: workload_resilience_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove workload resilience input file
      ansible.builtin.file:
        path: "{{ workload_resilience_input_file.path }}"
        state: absent
      when: workload_resilience_input_file is defined and (workload_resilience_input_file.path | default('') | length > 0)
      changed_when: false

- name: Normalize multi-replica workload resilience findings
  ansible.builtin.set_fact:
    workload_resilience_data: "{{ workload_resilience_cmd.stdout | from_json if (workload_resilience_cmd.rc == 0 and (workload_resilience_cmd.stdout | default('') | length > 0)) else {'findings': [], 'multi_replica_workload_count': 0, 'multi_replica_workloads_without_pdb': 0, 'multi_replica_workloads_without_spread_policy': 0} }}"
    workload_practice_findings: "{{ (workload_practice_findings | default([])) + ((workload_resilience_cmd.stdout | from_json).findings if (workload_resilience_cmd.rc == 0 and (workload_resilience_cmd.stdout | default('') | length > 0)) else []) }}"

- name: Build orphan pod review findings
  ansible.builtin.set_fact:
    orphan_pods: "{{ (orphan_pods | default([])) + orphan_pod_entry }}"
  loop: "{{ (analysis_graph.pods | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    phase: "{{ item.status.phase | default('Unknown') }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    owner_references: "{{ item.metadata.ownerReferences | default([]) }}"
    orphan_pod_entry: >-
      {{
        [{
          'namespace': ns_name,
          'name': item.metadata.name | default('unknown'),
          'phase': phase
        }]
        if (
          (is_user_namespace | bool)
          and (phase not in ['Succeeded', 'Completed'])
          and ((owner_references | length) == 0)
        ) else []
      }}
  changed_when: false

- name: Build workload ownership label review findings
  ansible.builtin.set_fact:
    workload_label_governance_findings: "{{ (workload_label_governance_findings | default([])) + label_review_entry }}"
  loop: "{{ ((analysis_graph.deployments | default({})).get('items', [])) + ((analysis_graph.statefulsets | default({})).get('items', [])) + ((analysis_graph.daemonsets | default({})).get('items', [])) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    workload_name: "{{ item.metadata.name | default('unknown') }}"
    workload_kind: "{{ item.kind | default('Workload') }}"
    labels: "{{ item.metadata.labels | default({}) }}"
    annotations: "{{ item.metadata.annotations | default({}) }}"
    missing_parts: >-
      {{
        ([] +
        (['app.kubernetes.io/name'] if (labels.get('app.kubernetes.io/name', '') | length) == 0 else []) +
        (['app.kubernetes.io/instance'] if (labels.get('app.kubernetes.io/instance', '') | length) == 0 else []) +
        (['app.kubernetes.io/component'] if (labels.get('app.kubernetes.io/component', '') | length) == 0 else []) +
        (['app.kubernetes.io/part-of'] if (labels.get('app.kubernetes.io/part-of', '') | length) == 0 else []) +
        (['app.kubernetes.io/managed-by'] if (labels.get('app.kubernetes.io/managed-by', '') | length) == 0 else []))
      }}
    label_context_values: >-
      {{
        ([] +
        (['app=' ~ labels.get('app')] if (labels.get('app', '') | length) > 0 else []) +
        (['app.kubernetes.io/name=' ~ labels.get('app.kubernetes.io/name')] if (labels.get('app.kubernetes.io/name', '') | length) > 0 else []) +
        (['app.kubernetes.io/instance=' ~ labels.get('app.kubernetes.io/instance')] if (labels.get('app.kubernetes.io/instance', '') | length) > 0 else []) +
        (['app.kubernetes.io/component=' ~ labels.get('app.kubernetes.io/component')] if (labels.get('app.kubernetes.io/component', '') | length) > 0 else []) +
        (['app.kubernetes.io/part-of=' ~ labels.get('app.kubernetes.io/part-of')] if (labels.get('app.kubernetes.io/part-of', '') | length) > 0 else []) +
        (['app.kubernetes.io/managed-by=' ~ labels.get('app.kubernetes.io/managed-by')] if (labels.get('app.kubernetes.io/managed-by', '') | length) > 0 else []) +
        (['namespace=' ~ ns_name] if (ns_name | length) > 0 else []) +
        (['workload=' ~ workload_name] if (workload_name | length) > 0 else []))
      }}
    annotation_context_values: >-
      {{
        ([] +
        (['owner.email=' ~ annotations.get('owner.email')] if (annotations.get('owner.email', '') | length) > 0 else []) +
        (['owner.contact=' ~ annotations.get('owner.contact')] if (annotations.get('owner.contact', '') | length) > 0 else []) +
        (['contact=' ~ annotations.get('contact')] if (annotations.get('contact', '') | length) > 0 else []) +
        (['description=' ~ annotations.get('description')] if (annotations.get('description', '') | length) > 0 else []) +
        (['kind=' ~ workload_kind] if (workload_kind | length) > 0 else []))
      }}
    label_review_entry: >-
      {{
        [{
          'kind': workload_kind,
          'namespace': ns_name,
          'name': workload_name,
          'detail': missing_parts | join('; '),
          'label_values': label_context_values,
          'annotation_values': annotation_context_values
        }]
        if ((is_user_namespace | bool) and (missing_parts | length > 0)) else []
      }}
  changed_when: false

- name: Build workload resource requirement findings
  ansible.builtin.set_fact:
    workload_resource_findings: "{{ (workload_resource_findings | default([])) + resource_entries }}"
  loop: "{{ ((analysis_graph.deployments | default({})).get('items', [])) + ((analysis_graph.statefulsets | default({})).get('items', [])) + ((analysis_graph.daemonsets | default({})).get('items', [])) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    pod_spec: "{{ item.spec.template.spec | default({}) }}"
    containers: "{{ (pod_spec.containers | default([])) + (pod_spec.initContainers | default([])) }}"
    containers_without_requests: "{{ containers | rejectattr('resources.requests', 'defined') | map(attribute='name') | list }}"
    containers_without_limits: "{{ containers | rejectattr('resources.limits', 'defined') | map(attribute='name') | list }}"
    resource_entries: >-
      {{
        ([] +
        ([{
          'kind': item.kind | default('Workload'),
          'namespace': ns_name,
          'name': item.metadata.name | default('unknown'),
          'issue': 'workload-missing-resource-requests',
          'detail': containers_without_requests | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and containers_without_requests | length > 0 else []) +
        ([{
          'kind': item.kind | default('Workload'),
          'namespace': ns_name,
          'name': item.metadata.name | default('unknown'),
          'issue': 'workload-missing-resource-limits',
          'detail': containers_without_limits | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and containers_without_limits | length > 0 else []))
      }}
  changed_when: false

- name: Build deployment probe coverage findings
  ansible.builtin.set_fact:
    workload_probe_findings: "{{ workload_probe_findings | default([]) + probe_findings }}"
  loop: "{{ (analysis_graph.deployments | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    workload_name: "{{ item.metadata.name | default('') }}"
    containers: "{{ item.spec.template.spec.containers | default([]) }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    missing_liveness_containers: "{{ containers | rejectattr('livenessProbe', 'defined') | map(attribute='name') | list }}"
    missing_readiness_containers: "{{ containers | rejectattr('readinessProbe', 'defined') | map(attribute='name') | list }}"
    missing_startup_containers: "{{ containers | rejectattr('startupProbe', 'defined') | map(attribute='name') | list }}"
    probe_findings: >-
      {{
        ([] +
        ([{'kind': 'Deployment', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-liveness-probe', 'containers': missing_liveness_containers, 'detail': missing_liveness_containers | join(', ')}] if (is_user_namespace | bool) and containers | length > 0 and missing_liveness_containers | length > 0 else []) +
        ([{'kind': 'Deployment', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-readiness-probe', 'containers': missing_readiness_containers, 'detail': missing_readiness_containers | join(', ')}] if (is_user_namespace | bool) and containers | length > 0 and missing_readiness_containers | length > 0 else []) +
        ([{'kind': 'Deployment', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-startup-probe', 'containers': missing_startup_containers, 'detail': missing_startup_containers | join(', ')}] if (is_user_namespace | bool) and containers | length > 0 and missing_startup_containers | length > 0 else []))
      }}
  changed_when: false

- name: Build statefulset probe coverage findings
  ansible.builtin.set_fact:
    workload_probe_findings: "{{ workload_probe_findings | default([]) + probe_findings }}"
  loop: "{{ (analysis_graph.statefulsets | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    workload_name: "{{ item.metadata.name | default('') }}"
    containers: "{{ item.spec.template.spec.containers | default([]) }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    missing_liveness_containers: "{{ containers | rejectattr('livenessProbe', 'defined') | map(attribute='name') | list }}"
    missing_readiness_containers: "{{ containers | rejectattr('readinessProbe', 'defined') | map(attribute='name') | list }}"
    missing_startup_containers: "{{ containers | rejectattr('startupProbe', 'defined') | map(attribute='name') | list }}"
    probe_findings: >-
      {{
        ([] +
        ([{'kind': 'StatefulSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-liveness-probe', 'containers': missing_liveness_containers, 'detail': missing_liveness_containers | join(', ')}] if (is_user_namespace | bool) and containers | length > 0 and missing_liveness_containers | length > 0 else []) +
        ([{'kind': 'StatefulSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-readiness-probe', 'containers': missing_readiness_containers, 'detail': missing_readiness_containers | join(', ')}] if (is_user_namespace | bool) and containers | length > 0 and missing_readiness_containers | length > 0 else []) +
        ([{'kind': 'StatefulSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-startup-probe', 'containers': missing_startup_containers, 'detail': missing_startup_containers | join(', ')}] if (is_user_namespace | bool) and containers | length > 0 and missing_startup_containers | length > 0 else []))
      }}
  changed_when: false

- name: Build daemonset probe coverage findings
  ansible.builtin.set_fact:
    workload_probe_findings: "{{ workload_probe_findings | default([]) + probe_findings }}"
  loop: "{{ (analysis_graph.daemonsets | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    workload_name: "{{ item.metadata.name | default('') }}"
    containers: "{{ item.spec.template.spec.containers | default([]) }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    missing_liveness_containers: "{{ containers | rejectattr('livenessProbe', 'defined') | map(attribute='name') | list }}"
    missing_readiness_containers: "{{ containers | rejectattr('readinessProbe', 'defined') | map(attribute='name') | list }}"
    missing_startup_containers: "{{ containers | rejectattr('startupProbe', 'defined') | map(attribute='name') | list }}"
    probe_findings: >-
      {{
        ([] +
        ([{'kind': 'DaemonSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-liveness-probe', 'containers': missing_liveness_containers, 'detail': missing_liveness_containers | join(', ')}] if (is_user_namespace | bool) and containers | length > 0 and missing_liveness_containers | length > 0 else []) +
        ([{'kind': 'DaemonSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-readiness-probe', 'containers': missing_readiness_containers, 'detail': missing_readiness_containers | join(', ')}] if (is_user_namespace | bool) and containers | length > 0 and missing_readiness_containers | length > 0 else []) +
        ([{'kind': 'DaemonSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-startup-probe', 'containers': missing_startup_containers, 'detail': missing_startup_containers | join(', ')}] if (is_user_namespace | bool) and containers | length > 0 and missing_startup_containers | length > 0 else []))
      }}
  changed_when: false
