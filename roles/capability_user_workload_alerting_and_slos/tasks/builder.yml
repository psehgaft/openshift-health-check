---
- name: Build user workload alerting and SLOs capability artifact facts
  vars:
    day2_user_workload_alerting_and_slos_section_current: "{{ (day2_capability_sections_by_key | default({})).get('user_workload_alerting_and_slos', {}) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: user_workload_alerting_and_slos
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      observability_status: "{{ day2_user_workload_alerting_and_slos_section_current.status | default('unknown') }}"
      observability_reason_summary: "{{ day2_user_workload_alerting_and_slos_section_current.top_detail | default('unknown') }}"
      delivery_model: "{{ (day2_posture_summary | default({})).get('user_workload_alerting_delivery_model', 'none') }}"
    capability_artifact_render_inputs:
      day2_user_workload_alerting_and_slos_section: "{{ day2_user_workload_alerting_and_slos_section_current }}"
    capability_artifact_collection_inputs:
      enable_user_workload_monitoring: "{{ ((day2_posture_summary | default({})).get('enable_user_workload_monitoring', false)) | bool }}"
      servicemonitor_count: "{{ ((day2_posture_summary | default({})).get('servicemonitor_count', 0)) | int }}"
      podmonitor_count: "{{ ((day2_posture_summary | default({})).get('podmonitor_count', 0)) | int }}"
      user_workload_alertmanager_additional_config_count: "{{ ((day2_posture_summary | default({})).get('user_workload_alertmanager_additional_config_count', 0)) | int }}"
      user_workload_alerting_signal_present: "{{ ((day2_posture_summary | default({})).get('user_workload_alerting_signal_present', false)) | bool }}"
      user_workload_vendor_managed_observability_present: "{{ ((day2_posture_summary | default({})).get('user_workload_vendor_managed_observability_present', false)) | bool }}"
      user_workload_observability_vendor_names: "{{ (day2_posture_summary | default({})).get('user_workload_observability_vendor_names', []) }}"
      user_workload_alerting_delivery_model: "{{ (day2_posture_summary | default({})).get('user_workload_alerting_delivery_model', 'none') }}"
