---
- name: Enrich fallback capability sections from owning posture summaries
  vars:
    day2_posture_payload: "{{ day2_posture_data | default({}) }}"
    capability_assessment_completed: >-
      {{
        (day2_posture_payload.assessment_state | default('completed')) == 'completed'
        and ((day2_posture_payload.capability_sections | default([])) | length > 0)
      }}
  ansible.builtin.set_fact:
    day2_capability_sections_resolved: >-
      {%- set sections = [] -%}
      {%- for section in (day2_capability_sections_resolved | default([])) -%}
        {%- set updated = section -%}
        {%- if (not capability_assessment_completed) and (section.key | default('') == 'application_backup_and_restore_readiness') -%}
          {%- set backup_tooling_detected = backup_recovery_summary.backup_tooling_detected | default(false) -%}
          {%- set dataprotectionapplication_count = backup_recovery_summary.dataprotectionapplication_count | default(0) | int -%}
          {%- set available_backup_storage_location_count = backup_recovery_summary.available_backup_storage_location_count | default(0) | int -%}
          {%- set backup_schedule_count = backup_recovery_summary.backup_schedule_count | default(0) | int -%}
          {%- set clean_successful_backup_count = backup_recovery_summary.clean_successful_backup_count | default(0) | int -%}
          {%- set clean_completed_restore_count = backup_recovery_summary.clean_completed_restore_count | default(0) | int -%}
          {%- set paused_backup_schedule_count = backup_recovery_summary.paused_backup_schedule_count | default(0) | int -%}
          {%- set completed_backup_with_issues_count = backup_recovery_summary.completed_backup_with_issues_count | default(0) | int -%}
          {%- set completed_restore_with_issues_count = backup_recovery_summary.completed_restore_with_issues_count | default(0) | int -%}
          {%- set backup_ready = (
                backup_tooling_detected
                and available_backup_storage_location_count > 0
                and backup_schedule_count > 0
                and clean_successful_backup_count > 0
                and clean_completed_restore_count > 0
                and paused_backup_schedule_count == 0
                and completed_backup_with_issues_count == 0
                and completed_restore_with_issues_count == 0
              ) -%}
          {%- set capability_status = ('OK' if backup_ready else 'WARNING') -%}
          {%- set top_detail = (
                'dpas=' ~ (dataprotectionapplication_count | string)
                ~ ' backupstoragelocations=' ~ (available_backup_storage_location_count | string)
                ~ ' schedules=' ~ (backup_schedule_count | string)
                ~ ' cleanSuccessfulBackups=' ~ (clean_successful_backup_count | string)
                ~ ' cleanCompletedRestores=' ~ (clean_completed_restore_count | string)
                ~ ' pausedSchedules=' ~ (paused_backup_schedule_count | string)
                ~ ' backupIssues=' ~ (completed_backup_with_issues_count | string)
                ~ ' restoreIssues=' ~ (completed_restore_with_issues_count | string)
              ) -%}
          {%- set recommended_action = (
                'No workload backup and restore remediation is required for this capability.'
                if capability_status == 'OK'
                else 'Validate usable BackupStorageLocations, active schedules, clean successful backups, and clean restore tests for workload recovery.'
              ) -%}
          {%- set findings = (
                [{
                  'severity': 'warning',
                  'issue': 'Application backup and restore baseline incomplete',
                  'source': 'OADP application backup posture guidance',
                  'recommended_action': recommended_action
                }]
                if capability_status == 'WARNING'
                else []
              ) -%}
          {%- set updated = section | combine({
                'status': capability_status,
                'accounting_state': 'assessed',
                'check_count': 1,
                'finding_count': (findings | length),
                'checks': [{
                  'capability': 'application_backup_and_restore_readiness',
                  'status': ('OK' if capability_status == 'OK' else 'WARN'),
                  'level': ('required' if (section.required | default(false)) else 'informational'),
                  'source': 'OADP application backup posture guidance',
                  'detail': top_detail
                }],
                'findings': findings,
                'top_detail': top_detail,
                'recommended_action': recommended_action
              }, recursive=True) -%}
        {%- elif (not capability_assessment_completed) and (section.key | default('') == 'control_plane_backup_and_recovery_readiness') -%}
          {%- set control_plane_recovery_applicable = not (cluster_profile.is_hosted_control_plane | default(false) | bool) -%}
          {%- set control_plane_runtime_healthy = (
                (platform_health_summary.apiserver_readyz_failed | default(0) | int) == 0
                and (platform_health_summary.apiserver_runtime_degraded | default(0) | int) == 0
                and (platform_health_summary.etcd_leader_unhealthy | default(0) | int) == 0
                and (platform_health_summary.etcd_runtime_degraded | default(0) | int) == 0
              ) -%}
          {%- set control_plane_backup_evidence_summary = ((control_plane_backup_evidence_data | default({})).summary | default({})) -%}
          {%- set control_plane_snapshot_evidence_collected = control_plane_backup_evidence_summary.healthy | default(false) | bool -%}
          {%- set control_plane_backup_evidence_scanned = control_plane_backup_evidence_summary.present | default(false) | bool -%}
          {%- set control_plane_backup_node_count = control_plane_backup_evidence_summary.node_count | default(0) | int -%}
          {%- set control_plane_backup_nodes_with_any_artifacts = control_plane_backup_evidence_summary.nodes_with_any_artifacts | default(0) | int -%}
          {%- set control_plane_backup_nodes_with_matching_pairs = control_plane_backup_evidence_summary.nodes_with_matching_pairs | default(0) | int -%}
          {%- set capability_status = (
                'INFO'
                if (not control_plane_recovery_applicable)
                else (
                  'WARNING'
                  if (not control_plane_runtime_healthy)
                  else (
                    'OK'
                    if control_plane_snapshot_evidence_collected
                    else (
                      'WARNING'
                      if control_plane_backup_evidence_scanned
                      else 'WARNING'
                    )
                  )
                )
              ) -%}
          {%- set top_detail = (
                'hostedControlPlane=true management cluster evidence is required to validate etcd snapshot and control-plane recovery readiness'
                if (not control_plane_recovery_applicable)
                else (
                  'control plane recovery readiness is reduced because API or etcd runtime health is degraded, so snapshot and restore operations should not be treated as fully validated until control plane health is restored'
                  if (not control_plane_runtime_healthy)
                  else (
                    'matching etcd snapshot and static pod backup artifact evidence was found on '
                    ~ (control_plane_backup_nodes_with_matching_pairs | string)
                    ~ ' control plane node(s)'
                    if control_plane_snapshot_evidence_collected
                    else (
                      'control plane nodes were scanned but no retained matching snapshot_*.db and static_kuberesources backup artifact pair was found: '
                      ~ 'nodesScanned=' ~ (control_plane_backup_node_count | string)
                      ~ ', nodesWithAnyArtifacts=' ~ (control_plane_backup_nodes_with_any_artifacts | string)
                      ~ ', matchingPairs=' ~ (control_plane_backup_nodes_with_matching_pairs | string)
                      if control_plane_backup_evidence_scanned
                      else 'control plane runtime was healthy, but live node-level backup evidence was not collected for this report'
                    )
                  )
                )
              ) -%}
          {%- set recommended_action = (
                'Validate etcd snapshot and restore readiness from the hosted control plane management cluster evidence set.'
                if (not control_plane_recovery_applicable)
                else (
                  'Restore API and etcd runtime health before validating control-plane backup and restore readiness.'
                  if (not control_plane_runtime_healthy)
                  else (
                    'No control-plane backup remediation is required for this capability.'
                    if control_plane_snapshot_evidence_collected
                    else (
                      'The report scanned control plane nodes but did not find a retained matching snapshot_*.db and static_kuberesources archive pair. Review the configured backup paths, retain recent backup artifacts, and document a recent restore drill.'
                      if control_plane_backup_evidence_scanned
                      else 'Enable live control-plane node backup evidence collection with oc debug access, or provide collected backup artifact evidence to the report.'
                    )
                  )
                )
              ) -%}
          {%- set findings = (
                []
                if capability_status == 'OK'
                else [{
                  'severity': 'warning',
                  'issue': 'Control plane backup and recovery readiness',
                  'source': 'backup and disaster recovery posture summary',
                  'recommended_action': recommended_action
                }]
              ) -%}
          {%- set updated = section | combine({
                'status': capability_status,
                'accounting_state': 'assessed',
                'check_count': 1,
                'finding_count': (findings | length),
                'checks': [{
                  'capability': 'control_plane_backup_and_recovery_readiness',
                  'status': capability_status,
                  'level': ('recommended' if capability_status != 'INFO' else 'informational'),
                  'source': 'backup and disaster recovery posture summary',
                  'detail': top_detail
                }],
                'findings': findings,
                'top_detail': top_detail,
                'recommended_action': recommended_action
              }, recursive=True) -%}
        {%- elif (not capability_assessment_completed) and (section.key | default('') == 'secondary_site_disaster_recovery') -%}
          {%- set drpolicy_count = ((analysis_graph.drpolicies | default({})).get('items', []) | length) -%}
          {%- set drcluster_count = ((analysis_graph.drclusters | default({})).get('items', []) | length) -%}
          {%- set drplacementcontrol_count = ((analysis_graph.drplacementcontrols | default({})).get('items', []) | length) -%}
          {%- set volumereplicationgroup_count = ((analysis_graph.volumereplicationgroups | default({})).get('items', []) | length) -%}
          {%- set volumereplication_count = ((analysis_graph.volumereplications | default({})).get('items', []) | length) -%}
          {%- set volumereplicationclass_count = ((analysis_graph.volumereplicationclasses | default({})).get('items', []) | length) -%}
          {%- set secondary_site_dr_present = (
                drpolicy_count > 0
                or drcluster_count > 0
                or drplacementcontrol_count > 0
                or volumereplicationgroup_count > 0
                or volumereplication_count > 0
                or volumereplicationclass_count > 0
              ) -%}
          {%- if not secondary_site_dr_present -%}
            {%- set top_detail = (
                  'no secondary-site DR inventory was found in the collected graph: '
                  ~ 'drpolicies=' ~ (drpolicy_count | string)
                  ~ ', drclusters=' ~ (drcluster_count | string)
                  ~ ', drplacementcontrols=' ~ (drplacementcontrol_count | string)
                  ~ ', volumereplicationgroups=' ~ (volumereplicationgroup_count | string)
                  ~ ', volumereplications=' ~ (volumereplication_count | string)
                  ~ ', volumereplicationclasses=' ~ (volumereplicationclass_count | string)
                ) -%}
            {%- set recommended_action = 'No DRPolicy, DRCluster, DRPlacementControl, VolumeReplicationGroup, VolumeReplication, or VolumeReplicationClass resources were found. If secondary-site disaster recovery is expected for this cluster, review ODF/ACM DR configuration and provide the intended multicluster replication and protected-workload evidence.' -%}
            {%- set updated = section | combine({
                  'status': ('WARNING' if (section.required | default(false)) else 'INFO'),
                  'accounting_state': 'assessed',
                  'check_count': 1,
                  'finding_count': 1,
                  'checks': [{
                    'capability': 'secondary_site_disaster_recovery',
                    'status': ('WARN' if (section.required | default(false)) else 'INFO'),
                    'level': ('required' if (section.required | default(false)) else 'informational'),
                    'source': 'secondary-site DR inventory from collected graph',
                    'detail': top_detail
                  }],
                  'findings': [{
                    'severity': ('warning' if (section.required | default(false)) else 'info'),
                    'issue': 'Secondary-site disaster recovery inventory missing',
                    'source': 'secondary-site DR inventory from collected graph',
                    'recommended_action': recommended_action
                  }],
                  'top_detail': top_detail,
                  'recommended_action': recommended_action
                }, recursive=True) -%}
          {%- endif -%}
        {%- elif (not capability_assessment_completed) and (section.key | default('') == 'acm_multicluster_disaster_recovery') -%}
          {%- set drpolicy_count = ((analysis_graph.drpolicies | default({})).get('items', []) | length) -%}
          {%- set valid_drpolicy_count = day2_posture_summary.valid_drpolicy_count | default(0) | int -%}
          {%- set drcluster_count = ((analysis_graph.drclusters | default({})).get('items', []) | length) -%}
          {%- set drplacementcontrol_count = ((analysis_graph.drplacementcontrols | default({})).get('items', []) | length) -%}
          {%- set volumereplicationgroup_count = ((analysis_graph.volumereplicationgroups | default({})).get('items', []) | length) -%}
          {%- set volumereplication_count = ((analysis_graph.volumereplications | default({})).get('items', []) | length) -%}
          {%- set volumereplicationclass_count = ((analysis_graph.volumereplicationclasses | default({})).get('items', []) | length) -%}
          {%- set acm_klusterlet_count = declarative_operations_summary.acm_klusterlet_count | default(day2_posture_summary.acm_klusterlet_count | default(0)) | int -%}
          {%- set acm_managedclusteraddon_count = declarative_operations_summary.acm_managedclusteraddon_count | default(day2_posture_summary.acm_managedclusteraddon_count | default(0)) | int -%}
          {%- set acm_agent_namespace_count = declarative_operations_summary.acm_agent_namespace_count | default(day2_posture_summary.acm_agent_namespace_count | default(0)) | int -%}
          {%- set acm_registration_present = (acm_klusterlet_count > 0) or (acm_managedclusteraddon_count > 0) or (acm_agent_namespace_count > 0) -%}
          {%- set acm_registration_healthy = (acm_klusterlet_count > 0) or (acm_agent_namespace_count > 0) -%}
          {%- set secondary_site_dr_present = (
                drpolicy_count > 0
                or drcluster_count > 0
                or drplacementcontrol_count > 0
                or volumereplicationgroup_count > 0
                or volumereplication_count > 0
                or volumereplicationclass_count > 0
              ) -%}
          {%- set acm_dr_present = secondary_site_dr_present and acm_registration_present -%}
          {%- set topology_ready = (valid_drpolicy_count > 0) and (drcluster_count >= 2) -%}
          {%- set replication_ready = (volumereplicationclass_count > 0) and ((volumereplication_count > 0) or (volumereplicationgroup_count > 0)) -%}
          {%- set protected_workloads_ready = (drplacementcontrol_count > 0) or (volumereplicationgroup_count > 0) -%}
          {%- set problem_drcluster_count = day2_posture_summary.secondary_site_dr_problem_drcluster_count | default(0) | int -%}
          {%- set problem_drpc_count = day2_posture_summary.secondary_site_dr_problem_drpc_count | default(0) | int -%}
          {%- set problem_vrg_count = day2_posture_summary.secondary_site_dr_problem_vrg_count | default(0) | int -%}
          {%- set acm_dr_healthy = (
                acm_dr_present
                and acm_registration_healthy
                and topology_ready
                and replication_ready
                and protected_workloads_ready
                and problem_drcluster_count == 0
                and problem_drpc_count == 0
                and problem_vrg_count == 0
              ) -%}
          {%- set capability_status = ('OK' if acm_dr_healthy else ('WARNING' if (secondary_site_dr_present or acm_registration_present or (section.required | default(false))) else 'INFO')) -%}
          {%- set top_detail = (
                'klusterlets=' ~ (acm_klusterlet_count | string)
                ~ ' managedclusteraddons=' ~ (acm_managedclusteraddon_count | string)
                ~ ' agentNamespaces=' ~ (acm_agent_namespace_count | string)
                ~ ' drpolicies=' ~ (drpolicy_count | string)
                ~ ' validPolicies=' ~ (valid_drpolicy_count | string)
                ~ ' drclusters=' ~ (drcluster_count | string)
                ~ ' drplacementcontrols=' ~ (drplacementcontrol_count | string)
                ~ ' volumereplications=' ~ (volumereplication_count | string)
                ~ ' volumereplicationgroups=' ~ (volumereplicationgroup_count | string)
                ~ ' volumereplicationclasses=' ~ (volumereplicationclass_count | string)
                ~ ' problemDrClusters=' ~ (problem_drcluster_count | string)
                ~ ' problemDrpcs=' ~ (problem_drpc_count | string)
                ~ ' problemVrgs=' ~ (problem_vrg_count | string)
              ) -%}
          {%- set recommended_action = (
                'No ACM + ODF multicluster disaster-recovery remediation is required for this capability.'
                if capability_status == 'OK'
                else (
                  'The DR scan did not find sufficient ACM + ODF DR evidence. If cluster disaster recovery is expected, implement the ACM + ODF DR solution: register the cluster with ACM, deploy ODF DR resources, define at least one valid DRPolicy spanning two DRClusters, configure VolumeReplicationClass and replication objects, and map protected workloads through DRPlacementControl or VolumeReplicationGroup resources.'
                  if (not secondary_site_dr_present)
                  else (
                    'The DR scan found ODF DR resources, but ACM managed-cluster registration evidence is missing or incomplete. Complete the ACM registration path with Klusterlet and agent namespace health, then validate the ACM + ODF DR topology.'
                    if (not acm_registration_healthy)
                    else 'The DR scan found ACM + ODF DR inventory, but the result is still insufficient for readiness. Review valid DRPolicy coverage, DRCluster count, VolumeReplicationClass and replication objects, DRPlacementControl or VolumeReplicationGroup coverage, and any DR resource warning states before relying on the cluster DR path.'
                  )
                )
              ) -%}
          {%- set findings = (
                []
                if capability_status == 'OK'
                else [{
                  'severity': ('warning' if capability_status == 'WARNING' else 'info'),
                  'issue': (
                    'ACM + ODF multicluster DR footprint missing'
                    if (not secondary_site_dr_present)
                    else (
                      'ACM managed-cluster registration missing or incomplete for DR'
                      if (not acm_registration_healthy)
                      else 'ACM + ODF multicluster DR topology or health incomplete'
                    )
                  ),
                  'source': 'ACM registration plus multicluster DR topology inventory',
                  'recommended_action': recommended_action
                }]
              ) -%}
          {%- set updated = section | combine({
                'status': capability_status,
                'accounting_state': 'assessed',
                'check_count': 1,
                'finding_count': (findings | length),
                'checks': [{
                  'capability': 'acm_multicluster_disaster_recovery',
                  'status': ('OK' if capability_status == 'OK' else ('WARN' if capability_status == 'WARNING' else 'INFO')),
                  'level': ('required' if (section.required | default(false)) else 'informational'),
                  'source': 'ACM registration plus multicluster DR topology inventory',
                  'detail': top_detail
                }],
                'findings': findings,
                'top_detail': top_detail,
                'recommended_action': recommended_action
              }, recursive=True) -%}
        {%- elif (not capability_assessment_completed) and (section.key | default('') == 'declarative_gitops_operations') -%}
          {%- set gitops_present = day2_posture_summary.gitops_present | default(false) -%}
          {%- set gitops_operational = day2_posture_summary.gitops_operational | default(false) -%}
          {%- set gitops_automated_sync_present = day2_posture_summary.gitops_automated_sync_present | default(false) -%}
          {%- set gitops_application_count = day2_posture_summary.gitops_application_count | default(0) | int -%}
          {%- set gitops_repo_backed_application_count = day2_posture_summary.gitops_repo_backed_application_count | default(0) | int -%}
          {%- set gitops_automated_sync_application_count = day2_posture_summary.gitops_automated_sync_application_count | default(0) | int -%}
          {%- set gitops_appproject_count = day2_posture_summary.gitops_appproject_count | default(0) | int -%}
          {%- set argocd_count = day2_posture_summary.argocd_count | default(0) | int -%}
          {%- set gitops_status = (
                'INFO'
                if not gitops_present
                else (
                  'WARNING'
                  if (
                    gitops_application_count == 0
                    or not gitops_operational
                    or (
                      gitops_application_count > 0
                      and not gitops_automated_sync_present
                    )
                  )
                  else 'OK'
                )
              ) -%}
          {%- set top_detail = (
                'GitOps inventory from declarative operations posture: '
                ~ 'present=' ~ (gitops_present | string)
                ~ ', operational=' ~ (gitops_operational | string)
                ~ ', argocds=' ~ (argocd_count | string)
                ~ ', applications=' ~ (gitops_application_count | string)
                ~ ', repoBacked=' ~ (gitops_repo_backed_application_count | string)
                ~ ', automatedSync=' ~ (gitops_automated_sync_application_count | string)
                ~ ', appProjects=' ~ (gitops_appproject_count | string)
              ) -%}
          {%- set recommended_action = (
                'Ensure GitOps is present, GitOps Applications are defined, Git-backed, and use the intended reconciliation policy.'
                if gitops_status == 'WARNING'
                else 'No declarative GitOps remediation is required for this capability.'
              ) -%}
          {%- set findings = (
                [{
                  'severity': 'warning',
                  'issue': 'Declarative GitOps operations evidence missing or incomplete',
                  'source': 'declarative operations posture summary',
                  'recommended_action': recommended_action
                }]
                if gitops_status == 'WARNING'
                else []
              ) -%}
          {%- set updated = section | combine({
                'status': gitops_status,
                'accounting_state': 'assessed',
                'check_count': 1,
                'finding_count': (findings | length),
                'checks': [{
                  'capability': 'declarative_gitops_operations',
                  'status': ('WARN' if gitops_status == 'WARNING' else ('OK' if gitops_status == 'OK' else 'INFO')),
                  'level': ('required' if (section.required | default(false)) else 'informational'),
                  'source': 'day 2 GitOps inventory',
                  'detail': top_detail
                }],
                'findings': findings,
                'top_detail': top_detail,
                'recommended_action': recommended_action
              }, recursive=True) -%}
        {%- elif (not capability_assessment_completed) and (section.key | default('') == 'cluster_log_forwarding') -%}
          {%- set clusterlogforwarder_count = ((analysis_graph.clusterlogforwarders | default({})).get('items', []) | length) -%}
          {%- set application_logs_delivery_state = observability_summary.application_logs_delivery_state | default('not-collected') -%}
          {%- set infrastructure_logs_delivery_state = observability_summary.infrastructure_logs_delivery_state | default('not-collected') -%}
          {%- set audit_logs_delivery_state = observability_summary.audit_logs_delivery_state | default('not-collected') -%}
          {%- set external_log_output_count = observability_summary.external_log_output_count | default(0) | int -%}
          {%- set vendor_log_forwarding_present = observability_summary.vendor_managed_log_forwarding_present | default(false) -%}
          {%- set log_forwarding_vendor_names = observability_summary.log_forwarding_vendor_names | default([]) -%}
          {%- set logs_delivery_verification_status = observability_summary.logs_delivery_verification_status | default('not-configured') -%}
          {%- set log_gap_count = observability_summary.log_gap_count | default(0) | int -%}
          {%- set log_collection_present = (
                application_logs_delivery_state != 'not-collected'
                or infrastructure_logs_delivery_state != 'not-collected'
                or audit_logs_delivery_state != 'not-collected'
                or clusterlogforwarder_count > 0
                or vendor_log_forwarding_present
              ) -%}
          {%- set cluster_log_forwarding_healthy = (
                vendor_log_forwarding_present
                or (
                  application_logs_delivery_state == 'externally-configured-not-verified'
                  and infrastructure_logs_delivery_state == 'externally-configured-not-verified'
                  and audit_logs_delivery_state == 'externally-configured-not-verified'
                  and external_log_output_count > 0
                )
              ) -%}
          {%- set capability_status = (
                'OK'
                if cluster_log_forwarding_healthy
                else (
                  'WARNING'
                  if (log_collection_present or (section.required | default(false)))
                  else 'INFO'
                )
              ) -%}
          {%- set top_detail = (
                'clusterlogforwarders=' ~ (clusterlogforwarder_count | string)
                ~ ' app=' ~ (application_logs_delivery_state | string)
                ~ ' infra=' ~ (infrastructure_logs_delivery_state | string)
                ~ ' audit=' ~ (audit_logs_delivery_state | string)
                ~ ' externalOutputs=' ~ (external_log_output_count | string)
                ~ ' vendorManaged=' ~ (vendor_log_forwarding_present | string)
                ~ ' vendors=' ~ ((log_forwarding_vendor_names | join(',')) or 'none')
                ~ ' verification=' ~ (logs_delivery_verification_status | string)
                ~ ' logGaps=' ~ (log_gap_count | string)
              ) -%}
          {%- set recommended_action = (
                'No log-forwarding remediation is required for this capability.'
                if capability_status == 'OK'
                else (
                  'No native ClusterLogForwarder or vendor-managed log-forwarding evidence was found. If centralized logging is expected, configure either ClusterLogForwarder pipelines with external outputs or the approved vendor-managed log-forwarding path for application, infrastructure, and audit logs.'
                  if not log_collection_present
                  else 'Complete the intended log-forwarding path by wiring application, infrastructure, and audit log collection to external outputs or the approved vendor-managed destination, then verify export end to end.'
                )
              ) -%}
          {%- set findings = (
                []
                if capability_status == 'OK'
                else [{
                  'severity': ('warning' if capability_status == 'WARNING' else 'info'),
                  'issue': (
                    'Centralized log-forwarding evidence missing'
                    if not log_collection_present
                    else 'Centralized log-forwarding path incomplete'
                  ),
                  'source': 'observability posture summary',
                  'recommended_action': recommended_action
                }]
              ) -%}
          {%- set updated = section | combine({
                'status': capability_status,
                'accounting_state': 'assessed',
                'check_count': 1,
                'finding_count': (findings | length),
                'checks': [{
                  'capability': 'cluster_log_forwarding',
                  'status': ('OK' if capability_status == 'OK' else ('WARN' if capability_status == 'WARNING' else 'INFO')),
                  'level': ('required' if (section.required | default(false)) else 'informational'),
                  'source': 'observability posture summary',
                  'detail': top_detail
                }],
                'findings': findings,
                'top_detail': top_detail,
                'recommended_action': recommended_action
