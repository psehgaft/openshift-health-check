---
- name: Resolve live support artifact root
  ansible.builtin.set_fact:
    live_support_artifact_root: >-
      {{
        (live_support_artifact_output_dir | default('') | trim)
        if (live_support_artifact_output_dir | default('') | trim | length > 0)
        else (report_output_dir ~ '/support-artifacts-' ~ report_timestamp)
      }}
    live_support_sosreport_explicit_targets: >-
      {{
        (live_support_sosreport_nodes | default([]))
        if ((live_support_sosreport_nodes | default([])) | length > 0)
        else (node_debug_target_nodes | default([]))
      }}
    live_support_sosreport_no_targets: >-
      {{
        ((live_support_sosreport_nodes | default([])) | length == 0)
        and ((node_debug_target_nodes | default([])) | length == 0)
        and ((live_support_sosreport_node_selector | default('') | trim | length) == 0)
        and ((live_support_sosreport_command_argv | default([])) | length == 0)
      }}

- name: Resolve live support artifact paths
  ansible.builtin.set_fact:
    live_support_cluster_compare_path: "{{ live_support_artifact_root }}/cluster-compare/cluster-compare.json"
    live_support_managed_gates_path: "{{ live_support_artifact_root }}/managed-gates/managed-gates.json"
    live_support_advisor_export_path: "{{ live_support_artifact_root }}/advisor/advisor-export.json"
    live_support_insights_archive_path: "{{ live_support_artifact_root }}/insights-archive"
    live_support_inspect_path: "{{ live_support_artifact_root }}/inspect"
    live_support_must_gather_root: "{{ live_support_artifact_root }}/must-gather"
    live_support_control_plane_backup_evidence_path: "{{ live_support_artifact_root }}/control-plane-backup/control-plane-backup-evidence.json"
    live_support_sosreport_output_dir: "{{ live_support_artifact_root }}/oc-debug-node-sosreport"
    live_support_collected_sosreport_paths: []

- name: Ensure live artifact root exists
  ansible.builtin.file:
    path: "{{ live_support_artifact_root }}"
    state: directory
    mode: "0755"
  when: collect_live_support_artifacts | bool

- name: Normalize OpenShift collector capability source
  ansible.builtin.set_fact:
    openshift_scan_collectors: "{{ (openshift_scan_capabilities | default({})).get('collectors', {}) }}"

- name: Resolve live support collector plan
  ansible.builtin.set_fact:
    live_support_collector_capabilities:
      must-gather:
        category: "{{ openshift_scan_collectors.must_gather.category | default('oc-native') }}"
        applicable: "{{ openshift_scan_collectors.must_gather.applicable | default(true) | bool }}"
        tool_available: "{{ openshift_scan_collectors.must_gather.tool_available | default(false) | bool }}"
        configured: "{{ openshift_scan_collectors.must_gather.configured | default(true) | bool }}"
        requested: "{{ collect_live_support_artifacts | bool and (((live_support_collection_profile | default('all')) == 'all') or (collect_live_must_gather | default(false) | bool)) }}"
        requirement_summary: "{{ openshift_scan_collectors.must_gather.requirement_summary | default('Requires oc access to the cluster and the ability to run must-gather pods.') }}"
      inspect:
        category: "{{ openshift_scan_collectors.inspect.category | default('oc-native') }}"
        applicable: "{{ openshift_scan_collectors.inspect.applicable | default(true) | bool }}"
        tool_available: "{{ openshift_scan_collectors.inspect.tool_available | default(false) | bool }}"
        configured: "{{ openshift_scan_collectors.inspect.configured | default(true) | bool }}"
        requested: "{{ collect_live_support_artifacts | bool and (((live_support_collection_profile | default('all')) == 'all') or (collect_live_inspect | default(false) | bool)) }}"
        requirement_summary: "{{ openshift_scan_collectors.inspect.requirement_summary | default('Requires oc access to inspect cluster resources.') }}"
      cluster-compare:
        category: "{{ openshift_scan_collectors.cluster_compare.category | default('oc-plugin') }}"
        applicable: "{{ openshift_scan_collectors.cluster_compare.applicable | default(true) | bool }}"
        tool_available: "{{ openshift_scan_collectors.cluster_compare.tool_available | default(false) | bool }}"
        configured: "{{ openshift_scan_collectors.cluster_compare.configured | default(true) | bool }}"
        requested: "{{ collect_live_support_artifacts | bool and (((live_support_collection_profile | default('all')) == 'all') or (collect_live_cluster_compare | default(false) | bool)) }}"
        requirement_summary: "{{ openshift_scan_collectors.cluster_compare.requirement_summary | default('Requires the oc cluster-compare plugin plus a configured reference command.') }}"
      managed-gates:
        category: "{{ openshift_scan_collectors.managed_gates.category | default('provider-api') }}"
        applicable: "{{ openshift_scan_collectors.managed_gates.applicable | default(false) | bool }}"
        tool_available: "{{ openshift_scan_collectors.managed_gates.tool_available | default(false) | bool }}"
        configured: >-
          {{
            openshift_scan_collectors.managed_gates.configured
            | default(((live_support_managed_gates_command_argv | default([])) | length > 0))
            | bool
          }}
        requested: "{{ collect_live_support_artifacts | bool and (((live_support_collection_profile | default('all')) == 'all') or (collect_live_managed_gates | default(false) | bool)) }}"
        requirement_summary: "{{ openshift_scan_collectors.managed_gates.requirement_summary | default('Requires provider-side tooling or an explicit managed-gates command for managed OpenShift offerings.') }}"
      advisor-export:
        category: "{{ openshift_scan_collectors.advisor_export.category | default('external-service') }}"
        applicable: "{{ openshift_scan_collectors.advisor_export.applicable | default(true) | bool }}"
        tool_available: "{{ openshift_scan_collectors.advisor_export.tool_available | default(false) | bool }}"
        configured: >-
          {{
            openshift_scan_collectors.advisor_export.configured
            | default(((live_support_advisor_export_command_argv | default([])) | length > 0))
            | bool
          }}
        requested: "{{ collect_live_support_artifacts | bool and (((live_support_collection_profile | default('all')) == 'all') or (collect_live_advisor_export | default(false) | bool)) }}"
        requirement_summary: "{{ openshift_scan_collectors.advisor_export.requirement_summary | default('Requires an explicit Advisor or Insights export command.') }}"
      insights-archive:
        category: "{{ openshift_scan_collectors.insights_archive.category | default('oc-native') }}"
        applicable: "{{ openshift_scan_collectors.insights_archive.applicable | default(true) | bool }}"
        tool_available: "{{ openshift_scan_collectors.insights_archive.tool_available | default(false) | bool }}"
        configured: "{{ openshift_scan_collectors.insights_archive.configured | default(true) | bool }}"
        requested: "{{ collect_live_support_artifacts | bool and (((live_support_collection_profile | default('all')) == 'all') or (collect_live_insights_archive | default(false) | bool)) }}"
        requirement_summary: "{{ openshift_scan_collectors.insights_archive.requirement_summary | default('Uses oc to copy the Insights Operator archive from a running pod.') }}"
      sosreport:
        category: "{{ openshift_scan_collectors.sosreport.category | default('node-level') }}"
        applicable: "{{ openshift_scan_collectors.sosreport.applicable | default(true) | bool }}"
        tool_available: "{{ openshift_scan_collectors.sosreport.tool_available | default(false) | bool }}"
        configured: "{{ openshift_scan_collectors.sosreport.configured | default(true) | bool }}"
        requested: "{{ collect_live_support_artifacts | bool and (((live_support_collection_profile | default('all')) == 'all') or (collect_live_sosreport | default(false) | bool)) }}"
        access_path: "{{ openshift_scan_collectors.sosreport.access_path | default('oc-debug-node') }}"
        requirement_summary: "{{ openshift_scan_collectors.sosreport.requirement_summary | default('Requires node-level access through oc debug node/<node> or SSH, then toolbox/sosreport collection.') }}"

- name: Resolve enabled live support collectors
  ansible.builtin.set_fact:
    live_support_collect_must_gather_resolved: >-
      {{
        (live_support_collector_capabilities['must-gather'].requested | bool)
        and (live_support_collector_capabilities['must-gather'].applicable | bool)
        and (live_support_collector_capabilities['must-gather'].tool_available | bool)
        and (live_support_collector_capabilities['must-gather'].configured | bool)
      }}
    live_support_collect_inspect_resolved: >-
      {{
        (live_support_collector_capabilities['inspect'].requested | bool)
        and (live_support_collector_capabilities['inspect'].applicable | bool)
        and (live_support_collector_capabilities['inspect'].tool_available | bool)
        and (live_support_collector_capabilities['inspect'].configured | bool)
      }}
    live_support_collect_cluster_compare_resolved: >-
      {{
        (live_support_collector_capabilities['cluster-compare'].requested | bool)
        and (live_support_collector_capabilities['cluster-compare'].applicable | bool)
        and (live_support_collector_capabilities['cluster-compare'].tool_available | bool)
        and (live_support_collector_capabilities['cluster-compare'].configured | bool)
      }}
    live_support_collect_managed_gates_resolved: >-
      {{
        (live_support_collector_capabilities['managed-gates'].requested | bool)
        and (live_support_collector_capabilities['managed-gates'].applicable | bool)
        and (live_support_collector_capabilities['managed-gates'].tool_available | bool)
        and (live_support_collector_capabilities['managed-gates'].configured | bool)
      }}
    live_support_collect_advisor_export_resolved: >-
      {{
        (live_support_collector_capabilities['advisor-export'].requested | bool)
        and (live_support_collector_capabilities['advisor-export'].applicable | bool)
        and (live_support_collector_capabilities['advisor-export'].tool_available | bool)
        and (live_support_collector_capabilities['advisor-export'].configured | bool)
      }}
    live_support_collect_insights_archive_resolved: >-
      {{
        (live_support_collector_capabilities['insights-archive'].requested | bool)
        and (live_support_collector_capabilities['insights-archive'].applicable | bool)
        and (live_support_collector_capabilities['insights-archive'].tool_available | bool)
        and (live_support_collector_capabilities['insights-archive'].configured | bool)
      }}
    live_support_collect_sosreport_resolved: >-
      {{
        (live_support_collector_capabilities['sosreport'].requested | bool)
        and (live_support_collector_capabilities['sosreport'].applicable | bool)
        and (live_support_collector_capabilities['sosreport'].tool_available | bool)
        and (live_support_collector_capabilities['sosreport'].configured | bool)
        and (
          ((live_support_sosreport_nodes | default([])) | length > 0)
          or ((live_support_sosreport_node_selector | default('') | trim | length) > 0)
          or ((node_debug_target_nodes | default([])) | length > 0)
          or (live_support_sosreport_no_targets | bool)
          or ((live_support_sosreport_command_argv | default([])) | length > 0)
        )
      }}

- name: Finalize live support collector capability statuses
  ansible.builtin.set_fact:
    live_support_collector_capabilities: >-
      {{
        live_support_collector_capabilities
        | combine({
            item.key: (
              item.value
              | combine({
                  'enabled': (
                    live_support_collect_must_gather_resolved if item.key == 'must-gather'
                    else (
                      live_support_collect_inspect_resolved if item.key == 'inspect'
                      else (
                        live_support_collect_cluster_compare_resolved if item.key == 'cluster-compare'
                        else (
                          live_support_collect_managed_gates_resolved if item.key == 'managed-gates'
                          else (
                            live_support_collect_advisor_export_resolved if item.key == 'advisor-export'
                            else (
                              live_support_collect_insights_archive_resolved if item.key == 'insights-archive'
                              else live_support_collect_sosreport_resolved
                            )
                          )
                        )
                      )
                    )
                  ),
                  'status': (
                    'disabled'
                    if not (collect_live_support_artifacts | bool)
                    else (
                      'not-applicable'
                      if not (item.value.applicable | bool)
                      else (
                        'not-requested'
                        if not (item.value.requested | bool)
                        else (
                          'missing-tooling'
                          if not (item.value.tool_available | bool)
                          else (
                            'not-configured'
                            if not (item.value.configured | bool)
                            else (
                            'planned'
                            if (
                              live_support_collect_must_gather_resolved if item.key == 'must-gather'
                              else (
                                live_support_collect_inspect_resolved if item.key == 'inspect'
                                else (
                                  live_support_collect_cluster_compare_resolved if item.key == 'cluster-compare'
                                  else (
                                    live_support_collect_managed_gates_resolved if item.key == 'managed-gates'
                                    else (
                                      live_support_collect_advisor_export_resolved if item.key == 'advisor-export'
                                      else (
                                        live_support_collect_insights_archive_resolved if item.key == 'insights-archive'
                                        else live_support_collect_sosreport_resolved
                                      )
                                    )
                                  )
                                )
                              )
                              )
                              else 'skipped'
                            )
                          )
                        )
                      )
                    )
                  ),
                  'detail': (
                    'Collector execution is disabled for this run.'
                    if not (collect_live_support_artifacts | bool)
                    else (
                      'This collector does not apply to the current cluster or provider profile.'
                      if not (item.value.applicable | bool)
                      else (
                        'This collector was not requested by the current collection profile.'
                        if not (item.value.requested | bool)
                        else (
                          'Required tool or access path is not available on the scan host.'
                          if not (item.value.tool_available | bool)
                          else (
                            'Collector prerequisites are available, but no command or baseline was configured.'
                            if not (item.value.configured | bool)
                            else (
                              'No symptom-based node targets were derived; the default sosreport collector will skip without collecting arbitrary nodes.'
                              if (item.key == 'sosreport' and (live_support_sosreport_no_targets | default(false) | bool))
                              else 'Collector is planned for this scan.'
                            )
                          )
                        )
                      )
                    )
                  )
                }, recursive=True)
            )
          }, recursive=True)
      }}
  loop: "{{ live_support_collector_capabilities | dict2items }}"

- name: Build live support collectors
  ansible.builtin.set_fact:
    live_support_collectors:
      - name: must-gather
        enabled: "{{ live_support_collect_must_gather_resolved | bool }}"
        argv:
          - "{{ kube_cli | default('oc') }}"
          - adm
          - must-gather
          - --dest-dir
          - "{{ live_support_must_gather_root }}"
        output_kind: directory
        output_path: ""
        timeout_seconds: "{{ live_support_artifact_timeout_seconds | int }}"
      - name: inspect
        enabled: "{{ live_support_collect_inspect_resolved | bool }}"
        argv:
          - "{{ kube_cli | default('oc') }}"
          - adm
          - inspect
          - nodes
          - clusteroperators
          - machineconfigpools
          - routes
          - --dest-dir
          - "{{ live_support_inspect_path }}"
        output_kind: directory
        output_path: ""
        timeout_seconds: "{{ live_support_artifact_timeout_seconds | int }}"
      - name: cluster-compare
        enabled: "{{ live_support_collect_cluster_compare_resolved | bool }}"
        argv: >-
          {{
            (live_support_cluster_compare_command_argv | default([]))
            if ((live_support_cluster_compare_command_argv | default([])) | length > 0)
            else [kube_cli | default('oc'), 'cluster-compare', '-o', 'json']
          }}
        output_kind: file
        output_path: "{{ live_support_cluster_compare_path }}"
        timeout_seconds: "{{ live_support_artifact_timeout_seconds | int }}"
      - name: managed-gates
        enabled: "{{ live_support_collect_managed_gates_resolved | bool }}"
        argv: "{{ live_support_managed_gates_command_argv | default([]) }}"
        output_kind: file
        output_path: "{{ live_support_managed_gates_path }}"
        timeout_seconds: "{{ live_support_artifact_timeout_seconds | int }}"
      - name: advisor-export
        enabled: "{{ live_support_collect_advisor_export_resolved | bool }}"
        argv: "{{ live_support_advisor_export_command_argv | default([]) }}"
        output_kind: file
        output_path: "{{ live_support_advisor_export_path }}"
        timeout_seconds: "{{ live_support_artifact_timeout_seconds | int }}"
      - name: insights-archive
        enabled: "{{ live_support_collect_insights_archive_resolved | bool }}"
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/collect_insights_archive.py"
          - --kube-cli
          - "{{ kube_cli | default('oc') }}"
          - --output-dir
          - "{{ live_support_insights_archive_path }}"
        output_kind: none
        output_path: ""
        timeout_seconds: "{{ live_support_artifact_timeout_seconds | int }}"
      - name: sosreport
        enabled: "{{ live_support_collect_sosreport_resolved | bool }}"
        argv: >-
          {{
            live_support_sosreport_command_argv
            if ((live_support_sosreport_command_argv | default([])) | length > 0)
            else (
              [
                'python3',
                playbook_dir ~ '/../scripts/collect_node_sosreports.py',
                '--kube-cli',
                kube_cli | default('oc'),
                '--output-dir',
                live_support_sosreport_output_dir,
                '--timeout-seconds',
                live_support_artifact_timeout_seconds | string,
                '--node-limit',
                live_support_sosreport_node_limit | default(0) | string
              ]
              + (
                ['--require-explicit-nodes']
                if (live_support_sosreport_no_targets | default(false) | bool)
                else []
              )
              + (
                ['--node-selector', live_support_sosreport_node_selector]
                if (live_support_sosreport_node_selector | default('') | trim | length > 0)
                else []
              )
              + (
                (live_support_sosreport_explicit_targets | default([]))
                | map('regex_replace', '^', '--node=')
                | list
              )
              + (
                (live_support_sosreport_args | default([]))
                | map('regex_replace', '^', '--sos-arg=')
                | list
              )
            )
          }}
        output_kind: none
        output_path: ""
        timeout_seconds: "{{ live_support_artifact_timeout_seconds | int }}"

- name: Write live support collector specification
  ansible.builtin.copy:
    dest: "{{ live_support_artifact_root }}/collector-spec.json"
    mode: "0644"
    content: "{{ {'parallelism': (effective_live_support_artifact_parallelism | default(live_support_artifact_parallelism) | int), 'collectors': live_support_collectors} | to_nice_json }}"
  when: collect_live_support_artifacts | bool

- name: Run live support collectors in parallel
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_live_artifact_collectors.py"
      - "{{ live_support_artifact_root }}/collector-spec.json"
  register: live_support_collectors_cmd
  changed_when: false
  failed_when: false
  when: collect_live_support_artifacts | bool

- name: Normalize live support collector results
  ansible.builtin.set_fact:
    live_support_artifact_collection: >-
      {{
        (live_support_collectors_cmd.stdout | from_json)
        if (
          (collect_live_support_artifacts | bool)
          and (live_support_collectors_cmd.rc | default(1)) == 0
          and (live_support_collectors_cmd.stdout | default('') | length > 0)
        )
        else {'parallelism': 0, 'collector_count': 0, 'results': {}}
      }}

- name: Update live support collector statuses from execution results
  ansible.builtin.set_fact:
    live_support_collector_capabilities: >-
      {{
        live_support_collector_capabilities
        | combine({
            item.key: (
              item.value
              | combine({
                  'status': (
                    item.value.status
                    if not (item.value.enabled | default(false) | bool)
                    else (
                      'not-run'
                      if (collector_result | length) == 0
                      else (
                        'timed-out'
                        if (collector_result.timed_out | default(false) | bool)
                        else (
                          'completed'
                          if (collector_result.rc | default(1) | int) == 0
                          else 'failed'
                        )
                      )
                    )
                  ),
                  'detail': (
                    item.value.detail
                    if not (item.value.enabled | default(false) | bool)
                    else (
                      'Collector was enabled but did not return an execution result.'
                      if (collector_result | length) == 0
                      else (
                        'Collector completed successfully.'
                        if (collector_result.rc | default(1) | int) == 0
                        else (
                          (collector_result.stderr | default('Collector failed.')) | string | trim | truncate(240, true, '...')
                        )
                      )
                    )
                  ),
                  'rc': (collector_result.rc | default('')),
                  'duration_seconds': (collector_result.duration_seconds | default(''))
                }, recursive=True)
            )
          }, recursive=True)
      }}
  vars:
    collector_result: "{{ (live_support_artifact_collection.results | default({})).get(item.key, {}) }}"
  loop: "{{ live_support_collector_capabilities | dict2items }}"

- name: Discover live support case bundle outputs
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/discover_case_bundle.py"
      - "{{ live_support_artifact_root }}"
  register: live_support_bundle_cmd
  changed_when: false
  failed_when: false
  when: collect_live_support_artifacts | bool

- name: Collect live control-plane backup evidence
  ansible.builtin.command:
    argv: >-
      {{
        [
          'python3',
          playbook_dir ~ '/../scripts/collect_control_plane_backup_evidence.py',
          '--kube-cli',
          kube_cli | default('oc'),
          '--output',
          live_support_control_plane_backup_evidence_path,
          '--timeout-seconds',
          (live_support_artifact_timeout_seconds | int) | string
        ]
        + (
          (control_plane_backup_search_paths | default([]))
          | map('regex_replace', '^', '--search-path=')
          | list
        )
      }}
  register: live_support_control_plane_backup_collect_cmd
  changed_when: false
  failed_when: false
  when:
    - collect_live_support_artifacts | bool
    - not (cluster_profile.is_hosted_control_plane | default(false) | bool)

- name: Normalize live support bundle payload
  ansible.builtin.set_fact:
    live_support_bundle_data: >-
      {{
        (live_support_bundle_cmd.stdout | from_json)
        if (
          (collect_live_support_artifacts | bool)
          and (live_support_bundle_cmd.rc | default(1)) == 0
          and (live_support_bundle_cmd.stdout | default('') | length > 0)
        )
        else {}
      }}

- name: Stat known live support collector outputs
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - { key: "inspect", path: "{{ live_support_inspect_path }}" }
    - { key: "cluster-compare", path: "{{ live_support_cluster_compare_path }}" }
    - { key: "managed-gates", path: "{{ live_support_managed_gates_path }}" }
    - { key: "advisor-export", path: "{{ live_support_advisor_export_path }}" }
    - { key: "insights-archive", path: "{{ live_support_insights_archive_path }}" }
  register: live_support_known_output_stats
  when: collect_live_support_artifacts | bool

- name: Build known live support collector output map
  ansible.builtin.set_fact:
    live_support_known_output_map: "{{ live_support_known_output_map | default({}) | combine({item.item.key: item.stat}) }}"
  loop: "{{ (live_support_known_output_stats.results | default([])) }}"
  when: collect_live_support_artifacts | bool

- name: Resolve discovered live support artifact paths
  ansible.builtin.set_fact:
    live_support_collected_must_gather_path: "{{ live_support_bundle_data.must_gather_path | default('') }}"
    live_support_collected_cluster_compare_path: >-
      {{
        live_support_cluster_compare_path
        if (
          (((live_support_artifact_collection.results | default({})).get('cluster-compare', {})).get('rc', 1) | int) == 0
          and ((live_support_known_output_map | default({})).get('cluster-compare', {}).exists | default(false))
        )
        else (live_support_bundle_data.cluster_compare_path | default(''))
      }}
    live_support_collected_managed_gates_path: >-
      {{
        live_support_managed_gates_path
        if (
          (((live_support_artifact_collection.results | default({})).get('managed-gates', {})).get('rc', 1) | int) == 0
          and ((live_support_known_output_map | default({})).get('managed-gates', {}).exists | default(false))
        )
        else (live_support_bundle_data.managed_gates_path | default(''))
      }}
    live_support_collected_inspect_path: >-
      {{
        live_support_inspect_path
        if (
          (((live_support_artifact_collection.results | default({})).get('inspect', {})).get('rc', 1) | int) == 0
