- name: Build shared OpenShift domain payload for live reporting
  vars:
    live_support_parsed: "{{ (live_support_data | default({})).get('parsed', {}) }}"
    live_advisor_export_summary: "{{ (live_support_parsed.get('advisor_export', {}) | default({})).get('summary', advisor_summary | default({})) }}"
    live_cluster_compare_summary: "{{ (live_support_parsed.get('cluster_compare', {}) | default({})).get('summary', {}) }}"
    live_managed_gates_summary: "{{ (live_support_parsed.get('managed_gates', {}) | default({})).get('summary', {}) }}"
    audit_report_domains_safe: "{{ (audit_report | default({})).get('domains', {}) }}"
    audit_report_observability_safe: "{{ (audit_report_domains_safe.get('observability', {}) | default({})) }}"
    workload_resilience_data_safe: "{{ workload_resilience_data | default({}) }}"
  ansible.builtin.set_fact:
    openshift_report_domain_payload:
      evidence_and_supportability:
        summary: "{{ supportability_posture_artifact.summary | default(supportability_posture_render_inputs.supportability_summary | default(live_supportability_summary | default({}))) }}"
        recommendations: "{{ supportability_posture_artifact.recommendations | default('Resolve the named unsupported, review-required, or incomplete supportability conditions before using lower-priority sections for final sign-off.') }}"
        diagnostics_coverage: "{{ supportability_posture_artifact.diagnostics_coverage | default(supportability_posture_render_inputs.diagnostics_coverage | default(diagnostics_coverage | default({}))) }}"
        product_evidence: "{{ supportability_posture_artifact.product_evidence | default(supportability_posture_render_inputs.product_evidence | default({})) }}"
        product_evidence_findings: "{{ supportability_posture_artifact.product_evidence_findings | default(supportability_posture_render_inputs.product_evidence_findings | default([])) }}"
        connected_cluster_posture: "{{ supportability_posture_artifact.connected_cluster_posture | default(supportability_posture_render_inputs.connected_cluster_posture | default(assessment_connected_cluster_posture | default(connected_cluster_posture | default({})))) }}"
