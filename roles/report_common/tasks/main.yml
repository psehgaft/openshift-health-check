---
- name: Define common report paths
  ansible.builtin.set_fact:
    report_cluster_type: "{{ resolved_provider_family if (resolved_provider_family | default(provider_family | default('generic'))) != 'generic' else (platform_family | default('kubernetes')) }}"
    report_cluster_name_source: "{{ cluster_profile.infrastructure_name | default((oc_context_cmd.stdout | default('cluster') | trim)) }}"
    report_cluster_name: "{{ ((cluster_profile.infrastructure_name | default((oc_context_cmd.stdout | default('cluster') | trim))) | lower | regex_replace('[^a-z0-9._-]+', '-') | regex_replace('^-+', '') | regex_replace('-+$', '')) or 'cluster' }}"
    report_file_prefix: "{{ report_basename }}-{{ (resolved_provider_family if (resolved_provider_family | default(provider_family | default('generic'))) != 'generic' else (platform_family | default('kubernetes'))) }}-{{ ((cluster_profile.infrastructure_name | default((oc_context_cmd.stdout | default('cluster') | trim))) | lower | regex_replace('[^a-z0-9._-]+', '-') | regex_replace('^-+', '') | regex_replace('-+$', '')) or 'cluster' }}-{{ report_timestamp }}"

- name: Define common report output files
  ansible.builtin.set_fact:
    report_path: "{{ report_output_dir }}/{{ report_file_prefix }}.md"
    report_json_path: "{{ report_output_dir }}/{{ report_file_prefix }}.json"
    report_html_path: "{{ report_output_dir }}/{{ report_file_prefix }}.html"
    report_pdf_path: "{{ report_output_dir }}/{{ report_file_prefix }}.pdf"
    report_css_path: "{{ playbook_dir }}/../templates/report.css"

- name: Resolve common report collection metadata
  ansible.builtin.set_fact:
    report_collection: "{{ assessment_collection_summary | default({}) }}"
    report_collection_failures: "{{ assessment_collection_failures | default([]) }}"
    report_collection_skipped_optional_commands: "{{ assessment_collection_skipped_optional_commands | default([]) }}"

- name: Build common collection confidence facts
  ansible.builtin.set_fact:
    report_collection_success_rate_pct: "{{ ((((report_collection.succeeded_commands | default(0) | float) / ((report_collection.applicable_command_count | default(report_collection.command_count | default(0)) | float) if (report_collection.applicable_command_count | default(report_collection.command_count | default(0)) | float) > 0 else 1.0)) * 100) | round(1)) }}"
    report_confidence: >-
      {{
        'low'
        if (
          (report_collection.core_failed_commands | default(0) | int) > 0
          or (cluster_current_state_build_error | default('') | trim | length > 0)
        )
        else (
          'medium'
          if (
            (report_collection.failed_commands | default(0) | int) > 0
            or (report_collection.timed_out_commands | default(0) | int) > 0
          )
          else 'high'
        )
      }}
    report_confidence_detail: >-
      {{
        'core collection commands failed or the detailed state summarizer fell back to direct fact counts'
        if (
          (report_collection.core_failed_commands | default(0) | int) > 0
          or (cluster_current_state_build_error | default('') | trim | length > 0)
        )
        else (
          'some non-core collection commands failed or timed out, but the main health signals were collected'
          if (
            (report_collection.failed_commands | default(0) | int) > 0
            or (report_collection.timed_out_commands | default(0) | int) > 0
          )
          else 'all planned collection commands completed and the synthesized state data was built successfully'
        )
      }}

- name: Build common execution stats
  ansible.builtin.set_fact:
    execution_stats:
      started_at: "{{ report_generated_at }}"
      completed_at: "{{ report_generated_at }}"
      duration_seconds: 0
      duration_minutes: 0
      ocp_user: "{{ oc_user_cmd.stdout | default('unknown') | trim }}"
      local_user: "{{ ansible_env.USER | default(ansible_user_id | default('unknown')) }}"
      local_hostname: "{{ ansible_hostname | default('unknown') }}"
      local_fqdn: "{{ ansible_fqdn | default(ansible_hostname | default('unknown')) }}"
      local_os: "{{ ansible_distribution | default('unknown') }} {{ ansible_distribution_version | default('') | trim }}"
      local_python: "{{ ansible_python_version | default('unknown') }}"
      ansible_version: "{{ ansible_version.full | default('unknown') }}"
      context: "{{ oc_context_cmd.stdout | default('unknown') | trim }}"
      api_server: "{{ oc_server_cmd.stdout | default('unknown') | trim }}"
      report_formats_generated:
        markdown: true
        json: true
        html: false
        pdf: false
      collection:
        command_count: "{{ report_collection.command_count | default(0) }}"
        success_rate_pct: "{{ report_collection_success_rate_pct }}"
        parallelism: "{{ report_collection.parallelism | default(0) }}"
        timeout_seconds: "{{ report_collection.timeout_seconds | default(0) }}"
        failed_commands: "{{ report_collection.failed_commands | default(0) }}"
        timed_out_commands: "{{ report_collection.timed_out_commands | default(0) }}"
        core_failed_commands: "{{ report_collection.core_failed_commands | default(0) }}"
      report_confidence: "{{ report_confidence }}"
      report_confidence_detail: "{{ report_confidence_detail }}"
      checkpoint:
        manifest_path: "{{ report_resume_manifest_path | default('') }}"
        last_completed_stage: "{{ report_resume_last_completed_stage | default('') }}"
        resume_next_stage: "{{ report_resume_last_resume_next_stage | default('') }}"
        run_mode: "{{ report_run_mode | default('fresh') }}"

- name: Build common audit rubric
  vars:
    scored_workload_practice_findings_resolved: "{{ workload_practice_findings | default([]) | rejectattr('issue', 'equalto', 'missing-pod-disruption-budget') | list }}"
  ansible.builtin.set_fact:
    scored_workload_practice_findings: "{{ scored_workload_practice_findings_resolved }}"
    audit_checks:
      - id: nodes
        title: Node Health
        severity: "{{ 'critical' if (not_ready_nodes | default([]) | length > 0) else ('warning' if ((pressure_nodes | default([]) | length) > 0) else 'pass') }}"
        score: "{{ 0 if (not_ready_nodes | default([]) | length > 0) else (10 if ((pressure_nodes | default([]) | length) == 0) else 7) }}"
        max_score: 10
        findings_count: "{{ (not_ready_nodes | default([]) | length) + (pressure_nodes | default([]) | length) }}"
      - id: workloads
        title: Workload Health
        severity: "{{ 'critical' if (workload_health_issues | default([]) | length > 0 or unhealthy_user_pods | default([]) | length > 0) else ('warning' if (high_restart_pods | default([]) | length > 0 or high_replica_workloads | default([]) | length > 0 or orphan_pods | default([]) | length > 0 or workload_label_governance_findings | default([]) | length > 0 or workload_resource_findings | default([]) | length > 0 or workload_probe_findings | default([]) | length > 0) else 'pass') }}"
        score: "{{ 2 if (workload_health_issues | default([]) | length > 0 or unhealthy_user_pods | default([]) | length > 0) else (6 if (high_restart_pods | default([]) | length > 0 or high_replica_workloads | default([]) | length > 0 or orphan_pods | default([]) | length > 0 or workload_label_governance_findings | default([]) | length > 0 or workload_resource_findings | default([]) | length > 0 or workload_probe_findings | default([]) | length > 0) else 10) }}"
        max_score: 10
        findings_count: "{{ (workload_health_issues | default([]) | length) + (high_replica_workloads | default([]) | length) + (orphan_pods | default([]) | length) + (workload_label_governance_findings | default([]) | length) + (workload_resource_findings | default([]) | length) + (workload_probe_findings | default([]) | length) + (unhealthy_user_pods | default([]) | length) + (high_restart_pods | default([]) | length) }}"
      - id: security_practices
        title: Security And Best Practices
        severity: "{{ 'warning' if (security_findings | default([]) | length > 0 or scored_workload_practice_findings_resolved | default([]) | length > 0 or health_summary.namespaces_without_networkpolicy | default(0) | int > 0 or health_summary.namespaces_missing_ingress_policies | default(0) | int > 0 or health_summary.namespaces_missing_egress_policies | default(0) | int > 0 or health_summary.namespaces_without_resourcequota | default(0) | int > 0 or health_summary.namespaces_without_limitrange | default(0) | int > 0) else 'pass' }}"
        score: "{{ 9 if (security_findings | default([]) | length > 0 or scored_workload_practice_findings_resolved | default([]) | length > 0 or health_summary.namespaces_without_networkpolicy | default(0) | int > 0 or health_summary.namespaces_missing_ingress_policies | default(0) | int > 0 or health_summary.namespaces_missing_egress_policies | default(0) | int > 0 or health_summary.namespaces_without_resourcequota | default(0) | int > 0 or health_summary.namespaces_without_limitrange | default(0) | int > 0) and (resolved_cluster_profile_mode | default(cluster_profile_mode | default('production'))) in ['development', 'lightweight'] else (6 if (security_findings | default([]) | length > 0 or scored_workload_practice_findings_resolved | default([]) | length > 0 or health_summary.namespaces_without_networkpolicy | default(0) | int > 0 or health_summary.namespaces_missing_ingress_policies | default(0) | int > 0 or health_summary.namespaces_missing_egress_policies | default(0) | int > 0 or health_summary.namespaces_without_resourcequota | default(0) | int > 0 or health_summary.namespaces_without_limitrange | default(0) | int > 0) else 14) }}"
        max_score: 14
        findings_count: "{{ (security_findings | default([]) | length) + (scored_workload_practice_findings | default([]) | length) + (health_summary.namespaces_without_networkpolicy | default(0) | int) + (health_summary.namespaces_missing_ingress_policies | default(0) | int) + (health_summary.namespaces_missing_egress_policies | default(0) | int) + (health_summary.namespaces_without_resourcequota | default(0) | int) + (health_summary.namespaces_without_limitrange | default(0) | int) }}"
      - id: unused_resources
        title: Unused Resource Heuristics
        severity: "{{ 'warning' if (health_summary.empty_user_namespaces | default(0) | int > 0 or health_summary.services_without_endpoints | default(0) | int > 0 or health_summary.likely_unused_serviceaccounts | default(0) | int > 0 or health_summary.likely_unused_configmaps | default(0) | int > 0 or health_summary.likely_unused_secrets | default(0) | int > 0 or health_summary.likely_unused_crds | default(0) | int > 0) else 'pass' }}"
        score: "{{ 8 if (health_summary.empty_user_namespaces | default(0) | int > 0 or health_summary.services_without_endpoints | default(0) | int > 0 or health_summary.likely_unused_serviceaccounts | default(0) | int > 0 or health_summary.likely_unused_configmaps | default(0) | int > 0 or health_summary.likely_unused_secrets | default(0) | int > 0 or health_summary.likely_unused_crds | default(0) | int > 0) and (resolved_cluster_profile_mode | default(cluster_profile_mode | default('production'))) in ['development', 'lightweight'] else (5 if (health_summary.empty_user_namespaces | default(0) | int > 0 or health_summary.services_without_endpoints | default(0) | int > 0 or health_summary.likely_unused_serviceaccounts | default(0) | int > 0 or health_summary.likely_unused_configmaps | default(0) | int > 0 or health_summary.likely_unused_secrets | default(0) | int > 0 or health_summary.likely_unused_crds | default(0) | int > 0) else 10) }}"
        max_score: 10
        findings_count: "{{ (health_summary.empty_user_namespaces | default(0) | int) + (health_summary.services_without_endpoints | default(0) | int) + (health_summary.likely_unused_serviceaccounts | default(0) | int) + (health_summary.likely_unused_configmaps | default(0) | int) + (health_summary.likely_unused_secrets | default(0) | int) + (health_summary.likely_unused_crds | default(0) | int) }}"
      - id: provider_platform
        title: Provider Platform Checks
        severity: "{{ 'warning' if (health_summary.provider_specific_findings | default(0) | int > 0) else 'pass' }}"
        score: "{{ 5 if (health_summary.provider_specific_findings | default(0) | int > 0) else 10 }}"
        max_score: 10
        findings_count: "{{ health_summary.provider_specific_findings | default(0) | int }}"
      - id: storage
        title: Storage Health
        severity: "{{ 'warning' if (pv_issues | default([]) | length > 0 or pvc_issues | default([]) | length > 0) else 'pass' }}"
        score: "{{ 5 if (pv_issues | default([]) | length > 0 or pvc_issues | default([]) | length > 0) else 10 }}"
        max_score: 10
        findings_count: "{{ (pv_issues | default([]) | length) + (pvc_issues | default([]) | length) }}"
      - id: lifecycle
        title: API And Certificate Lifecycle
        severity: "{{ 'warning' if (deprecated_crd_findings | default([]) | length > 0 or deprecated_api_lines | default([]) | length > 0 or certificate_expiry_findings | default([]) | length > 0) else 'pass' }}"
        score: "{{ 6 if (deprecated_crd_findings | default([]) | length > 0 or deprecated_api_lines | default([]) | length > 0 or certificate_expiry_findings | default([]) | length > 0) else 14 }}"
        max_score: 14
        findings_count: "{{ (deprecated_crd_findings | default([]) | length) + (deprecated_api_lines | default([]) | length) + (certificate_expiry_findings | default([]) | length) }}"
      - id: collection_completeness
        title: Data Collection Completeness
        severity: "{{ 'critical' if (report_collection.core_failed_commands | default(0) | int > 0) else ('warning' if (report_collection.failed_commands | default(0) | int > 0) else 'pass') }}"
        score: "{{ 0 if (report_collection.core_failed_commands | default(0) | int > 0) else (6 if (report_collection.failed_commands | default(0) | int > 0) else 12) }}"
        max_score: 12
        findings_count: "{{ report_collection.failed_commands | default(0) }}"

- name: Build common audit score summary
  ansible.builtin.set_fact:
    audit_score_total: "{{ audit_checks | map(attribute='score') | map('int') | list | sum }}"
    audit_score_max: "{{ audit_checks | map(attribute='max_score') | map('int') | list | sum }}"
    audit_critical_checks: "{{ audit_checks | selectattr('severity', 'equalto', 'critical') | map(attribute='id') | list }}"
    audit_warning_checks: "{{ audit_checks | selectattr('severity', 'equalto', 'warning') | map(attribute='id') | list }}"

- name: Build common cluster health score
  ansible.builtin.set_fact:
    cluster_health_score: "{{ (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) | round(1) }}"
    cluster_health_score_label: >-
      {{
        'Excellent'
        if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 95 )
        else (
          'Good'
          if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 85 )
          else (
            'Fair'
            if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 70 )
            else (
              'Poor'
              if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 50 )
              else 'Critical'
            )
          )
        )
      }}

- name: Build common suggested next steps
  ansible.builtin.set_fact:
    suggested_next_steps: >-
      {{
        []
        + ([{'priority': 'immediate', 'summary': 'Fix collection failures first.', 'detail': 'Check the data collection section and rerun after failed commands are resolved.'}] if (report_collection.failed_commands | default(0) | int) > 0 else [])
        + ([{'priority': 'immediate', 'summary': 'Restore node health.', 'detail': 'Start with NotReady nodes and node pressure before lower-priority cleanup.'}] if (not_ready_nodes | default([]) | length > 0 or pressure_nodes | default([]) | length > 0) else [])
        + ([{'priority': 'next', 'summary': 'Rebalance worker nodes across failure domains.', 'detail': 'Review worker pool groups limited to one zone, nodes missing zone labels, and uneven zone spread so worker capacity remains distributed across availability zones during failures.'}] if ((topology_resilience.single_zone_worker_pool_count | default(0) | int) > 0 or (topology_resilience.worker_nodes_without_zone_label | default(0) | int) > 0 or (topology_resilience.worker_zone_spread_unbalanced | default(false) | bool)) else [])
        + ([{'priority': 'next', 'summary': 'Review workload rollout and governance problems.', 'detail': 'Focus on unhealthy non-running pods, unhealthy workloads, unusually high replica counts, ownerless pods, missing recommended labels, missing requests or limits, missing probes, and restart hotspots.'}] if (workload_health_issues | default([]) | length > 0 or high_replica_workloads | default([]) | length > 0 or orphan_pods | default([]) | length > 0 or workload_label_governance_findings | default([]) | length > 0 or workload_resource_findings | default([]) | length > 0 or workload_probe_findings | default([]) | length > 0 or unhealthy_user_pods | default([]) | length > 0 or high_restart_pods | default([]) | length > 0) else [])
        + ([{'priority': 'next', 'summary': 'Review storage and lifecycle findings.', 'detail': 'Check PV and PVC health, deprecated APIs, CRDs, and expiring TLS secrets.'}] if (pv_issues | default([]) | length > 0 or pvc_issues | default([]) | length > 0 or deprecated_crd_findings | default([]) | length > 0 or deprecated_api_lines | default([]) | length > 0 or certificate_expiry_findings | default([]) | length > 0) else [])
        + ([{'priority': 'next', 'summary': 'Review node growth headroom before scaling out.', 'detail': 'Check the estimated max nodes from pod-network allocation, remaining node slots, and node IP availability so cluster scaling does not exhaust network space.'}] if ((cluster_current_state.node_growth_capacity.additional_nodes_by_pod_network | default('unknown')) != 'unknown' and (cluster_current_state.node_growth_capacity.additional_nodes_by_pod_network | int) <= 3) or ((cluster_current_state.node_growth_capacity.node_ips_available | default('unknown')) != 'unknown' and (cluster_current_state.node_growth_capacity.node_ips_available | int) <= 3) else [])
        + ([{'priority': 'next', 'summary': 'Add or validate an external persistent storage provider.', 'detail': 'The cluster did not show evidence of external persistent storage from StorageClasses or PV backends. Review whether workloads rely on local hostPath, local PVs, or ephemeral volumes only, and add a supported shared or external storage provider where persistence is required.'}] if (not (storage_posture_summary.has_external_storage_provider | default(false) | bool) or (storage_posture_summary.local_or_ephemeral_only_risk | default(false) | bool)) else [])
        + ([{'priority': 'next', 'summary': 'Review provider-specific platform findings.', 'detail': 'Check the provider section for node pool shape, managed component health, and platform-specific signals.'}] if (provider_specific_findings | default([]) | rejectattr('issue', 'equalto', 'minikube-lightweight-profile') | list | length > 0) else [])
        + ([{'priority': 'planned', 'summary': 'Use the report for hygiene work.', 'detail': 'Review unused-resource heuristics, namespace guardrails, and pod security findings after service health is stable.'}] if (security_findings | default([]) | length > 0 or scored_workload_practice_findings | default([]) | length > 0 or health_summary.empty_user_namespaces | default(0) | int > 0 or health_summary.likely_unused_serviceaccounts | default(0) | int > 0 or health_summary.likely_unused_configmaps | default(0) | int > 0 or health_summary.likely_unused_secrets | default(0) | int > 0 or health_summary.likely_unused_crds | default(0) | int > 0) else [])
        + ([{'priority': 'note', 'summary': 'This run used a non-production profile.', 'detail': 'Development or lightweight profile mode reduces some hygiene and unused-resource penalties so the score better matches lab or local clusters.'}] if (resolved_cluster_profile_mode | default(cluster_profile_mode | default('production'))) in ['development', 'lightweight'] else [])
        + ([{'priority': 'steady-state', 'summary': 'Keep the cluster under normal review.', 'detail': 'No major health risks were detected in this run.'}] if (health_summary.status == 'HEALTHY' and (report_collection.failed_commands | default(0) | int) == 0) else [])
      }}

- name: Build common audit payload
  ansible.builtin.set_fact:
    audit_report:
      metadata:
        generated_at: "{{ report_generated_at }}"
        completed_at: "{{ report_generated_at }}"
        context: "{{ oc_context_cmd.stdout | default('unknown') | trim }}"
        api_server: "{{ oc_server_cmd.stdout | default('unknown') | trim }}"
        user: "{{ oc_user_cmd.stdout | default('unknown') | trim }}"
        cluster_type: "{{ report_cluster_type }}"
        platform_family: "{{ platform_family | default('kubernetes') }}"
        provider_family: "{{ resolved_provider_family | default(provider_family | default('generic')) }}"
        cluster_profile_mode: "{{ resolved_cluster_profile_mode | default(cluster_profile_mode | default('production')) }}"
        cluster_type_detection_source: "{{ cluster_type_detection_source | default('not-applicable') }}"
        checkpoint:
          manifest_path: "{{ report_resume_manifest_path | default('') }}"
          last_completed_stage: "{{ report_resume_last_completed_stage | default('') }}"
          resume_next_stage: "{{ report_resume_last_resume_next_stage | default('') }}"
          run_mode: "{{ report_run_mode | default('fresh') }}"
      cluster_profile: "{{ cluster_profile | default({}) }}"
      cluster_current_state: "{{ cluster_current_state | default({}) }}"
      health_summary: "{{ health_summary | default({}) }}"
      suggested_next_steps: "{{ suggested_next_steps | default([]) }}"
      audit:
        score_total: "{{ audit_score_total }}"
        score_max: "{{ audit_score_max }}"
        cluster_health_score: "{{ cluster_health_score }}"
        cluster_health_score_label: "{{ cluster_health_score_label }}"
        critical_checks: "{{ audit_critical_checks }}"
        warning_checks: "{{ audit_warning_checks }}"
        checks: "{{ audit_checks }}"
      findings:
        report_collection_failures: "{{ report_collection_failures | default([]) }}"
        not_ready_nodes: "{{ not_ready_nodes | default([]) }}"
        pressure_nodes: "{{ pressure_nodes | default([]) }}"
        workload_health_issues: "{{ top_workload_health_issues | default([]) }}"
        unhealthy_user_pods: "{{ top_unhealthy_user_pods | default([]) }}"
        high_replica_workloads: "{{ top_high_replica_workloads | default([]) }}"
        orphan_pods: "{{ top_orphan_pods | default([]) }}"
        workload_label_governance_findings: "{{ top_workload_label_governance_findings | default([]) }}"
        workload_resource_findings: "{{ top_workload_resource_findings | default([]) }}"
        workload_probe_findings: "{{ top_workload_probe_findings | default([]) }}"
        high_restart_pods: "{{ top_high_restart_pods | default([]) }}"
        security_findings: "{{ top_security_findings | default([]) }}"
        workload_practice_findings: "{{ top_workload_practice_findings | default([]) }}"
        services_without_endpoints: "{{ top_services_without_endpoints | default([]) }}"
        likely_unused_serviceaccounts: "{{ top_likely_unused_serviceaccounts | default([]) }}"
        likely_unused_configmaps: "{{ top_likely_unused_configmaps | default([]) }}"
        likely_unused_secrets: "{{ top_likely_unused_secrets | default([]) }}"
        likely_unused_crds: "{{ top_likely_unused_crds | default([]) }}"
        deprecated_crd_findings: "{{ top_deprecated_crd_findings | default([]) }}"
        deprecated_api_lines: "{{ top_deprecated_api_lines | default([]) }}"
        pv_issues: "{{ top_pv_issues | default([]) }}"
        pvc_issues: "{{ top_pvc_issues | default([]) }}"
        certificate_expiry_findings: "{{ certificate_expiry_findings | default([]) }}"
        provider_specific_findings: "{{ top_provider_specific_findings | default([]) }}"
      metrics:
        report_collection: "{{ report_collection | default({}) }}"
        report_collection_success_rate_pct: "{{ report_collection_success_rate_pct }}"
        report_confidence: "{{ report_confidence }}"
        report_confidence_detail: "{{ report_confidence_detail }}"
        prometheus_evidence_summary: "{{ prometheus_evidence_summary | default({}) }}"
        node_capacity_summary_by_density_desc: "{{ node_capacity_summary_by_density_desc | default([]) }}"
        provider_nodepool_summary: "{{ provider_nodepool_summary | default([]) }}"
        provider_component_summary: "{{ provider_component_summary | default([]) }}"
        provider_current_state: "{{ provider_current_state | default({}) }}"

- name: Build shared report conversion capability facts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: build_report_conversion_capabilities.yml

- name: Capture final common report completion epoch
  ansible.builtin.set_fact:
    final_report_completion_epoch: "{{ now(utc=true, fmt='%s') | int }}"

- name: Format final common report completion time
  ansible.builtin.set_fact:
    final_report_completion_iso: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(final_report_completion_epoch | int, utc=true) }}"

- name: Update common final execution stats before rendering artifacts
  vars:
    updated_execution_stats: "{{ execution_stats | combine({'completed_at': final_report_completion_iso, 'duration_seconds': ((final_report_completion_epoch | int) - (ansible_date_time.epoch | int)), 'duration_minutes': ((((final_report_completion_epoch | int) - (ansible_date_time.epoch | int)) | float) / 60.0) | round(1), 'report_formats_generated': {'markdown': true, 'json': true, 'html': false, 'pdf': false}}, recursive=True) }}"
  ansible.builtin.set_fact:
    report_completed_at: "{{ final_report_completion_iso }}"
    execution_stats: "{{ updated_execution_stats }}"
    audit_report: "{{ audit_report | combine({'execution_stats': updated_execution_stats, 'metadata': (audit_report.metadata | combine({'completed_at': final_report_completion_iso}, recursive=True))}, recursive=True) }}"

- name: Render common report artifacts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: render_report_artifacts.yml
  vars:
    report_markdown_template: "{{ playbook_dir }}/../templates/k8s_cluster_health_report.md.j2"

- name: Update common generated format status
  vars:
    generated_format_status:
      markdown: true
      json: true
      html: "{{ (report_html_cmd.rc | default(1)) == 0 }}"
      pdf: "{{ (report_pdf_cmd.rc | default(1)) == 0 }}"
    updated_execution_stats: "{{ execution_stats | combine({'report_formats_generated': generated_format_status}, recursive=True) }}"
  ansible.builtin.set_fact:
    execution_stats: "{{ updated_execution_stats }}"
    audit_report: "{{ audit_report | combine({'execution_stats': ((audit_report.execution_stats | default(execution_stats)) | combine({'report_formats_generated': generated_format_status}, recursive=True))}, recursive=True) }}"
    report_pdf_status_reason: >-
      {{
        'generated'
        if ((report_pdf_cmd.rc | default(1)) == 0)
        else (
          'skipped: pandoc not found'
          if not (report_pandoc_available | bool)
          else (
            'skipped: no supported PDF engine found'
            if (report_pdf_engine | default('') | length) == 0
            else (
              'skipped: PDF generation disabled'
              if not (report_generate_pdf | default(true) | bool)
              else (
                'failed: ' ~ ((report_pdf_cmd.stderr | default(report_pdf_cmd.stdout | default('unknown error')) | trim) or 'unknown error')
              )
            )
          )
        )
      }}

- name: Show common report locations
  ansible.builtin.include_role:
    name: report_common
    tasks_from: show_report_locations.yml
  vars:
    report_status_value: "{{ health_summary.status | default('UNKNOWN') }}"
    report_score_total: "{{ audit_score_total }}"
    report_score_max: "{{ audit_score_max }}"
    report_health_score: "{{ cluster_health_score }}"
    report_health_score_label: "{{ cluster_health_score_label }}"
