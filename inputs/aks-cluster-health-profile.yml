---
# AKS production capability profile.
# Use with:
#   ansible-playbook playbooks/aks_cluster_health_report.yml -e @inputs/aks-cluster-health-profile.yml
kubernetes_report_capability_profile:
  backup_and_restore_readiness:
    required: true
    criticality: critical
    expected_state: healthy
    owner: operations
    evidence_required: [kubectl-get]
    notes: "Production AKS clusters should have backup and restore evidence."
    docs: "https://velero.io/docs/latest/"
  namespace_network_policy_baseline:
    required: true
    criticality: high
    expected_state: configured
    owner: security
    evidence_required: [kubectl-get]
    notes: "AKS production namespaces should have NetworkPolicy coverage or an approved Azure network segmentation alternative."
    docs: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"
  namespace_resource_quota_governance:
    required: true
    criticality: high
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "User namespaces should have ResourceQuota coverage."
    docs: "https://kubernetes.io/docs/concepts/policy/resource-quotas/"
  workload_resilience_controls:
    required: true
    criticality: high
    expected_state: configured
    owner: app
    evidence_required: [kubectl-get]
    notes: "Multi-replica workloads should use disruption and spread controls."
    docs: "https://kubernetes.io/docs/tasks/run-application/configure-pdb/"
  workload_resource_requests_limits:
    required: true
    criticality: high
    expected_state: configured
    owner: app
    evidence_required: [kubectl-get]
    notes: "Workloads should define CPU and memory requests and limits."
    docs: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
  persistent_storage_integration:
    required: true
    criticality: high
    expected_state: present
    owner: storage
    evidence_required: [kubectl-get]
    notes: "Production AKS clusters normally use Azure Disk, Azure Files, or another CSI-backed provider."
    docs: "https://kubernetes.io/docs/concepts/storage/storage-classes/"
  deprecated_api_upgrade_review:
    required: true
    criticality: high
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "Deprecated APIs should be reviewed before AKS upgrades."
    docs: "https://kubernetes.io/docs/reference/using-api/deprecation-guide/"
  external_log_forwarding:
    required: true
    criticality: high
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get]
    notes: "Logs should have an intentional collection or forwarding path."
    docs: "https://kubernetes.io/docs/concepts/cluster-administration/logging/"
  external_monitoring_integration:
    required: true
    criticality: high
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Monitoring and alerting should be configured through Azure Monitor, Prometheus, or another supported platform."
    docs: "https://prometheus-operator.dev/docs/developer/getting-started/"
  user_workload_metrics_monitoring:
    required: true
    criticality: high
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Application teams should expose scrape configuration through ServiceMonitor, PodMonitor, or an approved equivalent."
    docs: "https://prometheus-operator.dev/docs/developer/getting-started/"
  workload_vulnerability_scanning:
    required: false
    criticality: high
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Require when workload image vulnerability scanning or secured-cluster scanner agents are part of the security baseline."
    docs: "https://aquasecurity.github.io/trivy-operator/latest/"
  namespace_limit_range_defaults:
    required: true
    criticality: medium
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "User namespaces should have LimitRange defaults."
    docs: "https://kubernetes.io/docs/concepts/policy/limit-range/"
  ingress_external_exposure:
    required: true
    criticality: medium
    expected_state: configured
    owner: network
    evidence_required: [kubectl-get]
    notes: "Ingress should be intentional, owned, and TLS-aware."
    docs: "https://kubernetes.io/docs/concepts/services-networking/ingress/"
  tls_certificate_lifecycle_hygiene:
    required: true
    criticality: medium
    expected_state: configured
    owner: security
    evidence_required: [kubectl-get]
    notes: "Application TLS material should be inventoried and reviewed for expiry."
    docs: "https://kubernetes.io/docs/concepts/configuration/secret/#tls-secrets"
  grafana_metrics_dashboards:
    required: false
    criticality: medium
    expected_state: present
    owner: observability
    evidence_required: [kubectl-get]
    notes: "Require when the customer expects in-cluster Grafana dashboards for application or platform metrics."
    docs: "https://grafana.github.io/grafana-operator/docs/"
  dynatrace_observability:
    required: false
    criticality: medium
    expected_state: present
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Require when Dynatrace-managed observability components are expected on the cluster."
    docs: "https://docs.dynatrace.com/docs/ingest-from/setup-on-k8s"
  qualys_scanning_agents:
    required: false
    criticality: medium
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Require when Qualys Container Security sensors, Qualys Cloud Agent, or related Qualys scanning agents are expected to run on cluster nodes or workloads."
    docs: "https://docs.qualys.com/en/cs-sensor/latest/deploying_sensor_in_k8s/deploying_sensor_in_kubernetes.htm"
  prisma_twistlock_defenders:
    required: false
    criticality: medium
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Require when Prisma Cloud Compute or legacy Twistlock Defender agents are expected to protect cluster nodes or workloads."
    docs: "https://pan.dev/prisma-cloud/docs/cwpp/deploy-defenders/"
  aqua_security_platform:
    required: false
    criticality: medium
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Require when Aqua platform components such as Aqua Console, Aqua Gateway, Aqua Enforcer, kube-enforcer, or related Aqua-managed security services are expected on the cluster."
    docs: "https://github.com/aquasecurity/deployments"
  splunk_observability:
    required: false
    criticality: medium
    expected_state: present
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Require when Splunk-managed telemetry components are expected on the cluster."
    docs: "https://help.splunk.com/en/splunk-enterprise/get-started/get-data-in/9.2/get-other-kinds-of-data-in/overview-of-the-splunk-opentelemetry-collector-for-kubernetes"
  loki_stack_logging:
    required: false
    criticality: medium
    expected_state: present
    owner: observability
    evidence_required: [kubectl-get]
    notes: "Require when Loki-based in-cluster log storage is expected on the cluster."
    docs: "https://grafana.com/docs/loki/latest/setup/install/"
  datadog_observability:
    required: false
    criticality: medium
    expected_state: present
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Require when Datadog-managed telemetry components are expected on the cluster."
    docs: "https://docs.datadoghq.com/containers/kubernetes/installation/"
  appdynamics_observability:
    required: false
    criticality: medium
    expected_state: present
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Require when AppDynamics Cluster Agent, InfraViz, or related AppDynamics observability components are expected on the cluster."
    docs: "https://docs.appdynamics.com/appd/24.x/latest/en/infrastructure-visibility/monitor-kubernetes-with-the-cluster-agent/install-the-cluster-agent"
  workloads_using_external_private_registries:
    required: false
    criticality: medium
    expected_state: configured
    owner: delivery
    evidence_required: [kubectl-get]
    notes: "Require when workloads are expected to pull application images from an external private registry."
    docs: "https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/"
  workload_autoscaling:
    required: true
    criticality: medium
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get, metrics]
    notes: "Most production AKS clusters should use HPA, cluster autoscaler, KEDA, or an approved fixed-capacity model."
    docs: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"
  admission_policy_engine:
    required: false
    criticality: medium
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Require when Azure Policy, Gatekeeper, Kyverno, or another admission policy engine is part of the baseline."
    docs: "https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/"
  external_or_sealed_secrets_management:
    required: false
    criticality: medium
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Require when Azure Key Vault integration, external-secrets, or sealed secrets are expected."
    docs: "https://external-secrets.io/latest/"
  cluster_hosted_cicd_runners:
    required: false
    criticality: medium
    expected_state: present
    owner: delivery
    evidence_required: [kubectl-get, metrics]
    notes: "Show when cluster-hosted CI/CD runners are detected or required."
    docs: "https://docs.gitlab.com/runner/executors/kubernetes/"
  provider_node_pool_inventory:
    required: true
    criticality: medium
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get, provider-api]
    notes: "AKS node-pool, zone, and provider labels should be available for resilience review."
    docs: "https://kubernetes.io/docs/reference/labels-annotations-taints/"
  service_mesh_control_plane:
    required: false
    criticality: low
    expected_state: present
    owner: network
    evidence_required: [kubectl-get]
    notes: "Require only when service mesh is part of the application platform."
    docs: "https://istio.io/latest/docs/setup/install/"
