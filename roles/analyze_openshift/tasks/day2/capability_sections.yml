---
- name: Resolve production Day 2 capability section list
  ansible.builtin.include_tasks: resolve_sections.yml

- name: Resolve production Day 2 capability summary aggregate
  ansible.builtin.include_tasks: aggregate.yml

- name: Enrich fallback production Day 2 capability sections
  ansible.builtin.include_tasks: enrich_sections.yml
  when: not (day2_capability_assessment_completed | default(false) | bool)
