---
- name: Build bundled workload health, resilience, and probe findings
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_common_workload_analysis_bundle.py"
    stdin: "{{ {
      'analysis_graph': (analysis_graph | default({})),
      'platform_namespaces_regex': (platform_namespaces_regex | default('^$')),
      'user_namespaces_exclude_regex': (user_namespaces_exclude_regex | default('^$')),
      'operator_managed_namespace_names': (operator_managed_namespace_names | default([])),
      'workload_probe_findings': (workload_probe_findings | default([]))
    } | to_json }}"
  register: workload_analysis_bundle_cmd
  changed_when: false
  failed_when: false

- name: Normalize bundled workload health, resilience, and probe findings
  ansible.builtin.set_fact:
    workload_analysis_bundle: >-
      {{
        workload_analysis_bundle_cmd.stdout | from_json
        if (workload_analysis_bundle_cmd.rc == 0 and (workload_analysis_bundle_cmd.stdout | default('') | length > 0))
        else {
          'workload_health_findings_data': {
            'platform_pod_issues': [],
            'unhealthy_user_pods': [],
            'aged_user_pods': [],
            'deployment_issues': [],
            'statefulset_issues': [],
            'daemonset_issues': [],
            'deploymentconfig_issues': [],
            'workload_health_issues': [],
            'high_replica_workloads': [],
            'workload_probe_findings': []
          },
          'platform_pod_issues': [],
          'unhealthy_user_pods': [],
          'aged_user_pods': [],
          'deployment_issues': [],
          'deploymentconfig_issues': [],
          'statefulset_issues': [],
          'daemonset_issues': [],
          'workload_health_issues': [],
          'high_replica_workloads': [],
          'workload_resilience_data': {
            'findings': [],
            'pdb_review_findings': [],
            'multi_replica_workload_count': 0,
            'multi_replica_workloads_without_pdb': 0,
            'multi_replica_workloads_without_usable_pdb': 0,
            'multi_replica_workloads_without_spread_policy': 0,
            'multi_replica_workloads_with_node_or_zone_spread_policy': 0,
            'multi_replica_workloads_with_other_spread_policy': 0
          },
          'workload_practice_findings_append': [],
          'workload_probe_findings': []
        }
      }}

- name: Expand bundled workload health, resilience, and probe findings
  ansible.builtin.set_fact:
    workload_health_findings_data: "{{ workload_analysis_bundle.workload_health_findings_data | default({}) }}"
    platform_pod_issues: "{{ workload_analysis_bundle.platform_pod_issues | default([]) }}"
    unhealthy_user_pods: "{{ workload_analysis_bundle.unhealthy_user_pods | default([]) }}"
    aged_user_pods: "{{ workload_analysis_bundle.aged_user_pods | default([]) }}"
    deployment_issues: "{{ workload_analysis_bundle.deployment_issues | default([]) }}"
    deploymentconfig_issues: "{{ workload_analysis_bundle.deploymentconfig_issues | default([]) }}"
    statefulset_issues: "{{ workload_analysis_bundle.statefulset_issues | default([]) }}"
    daemonset_issues: "{{ workload_analysis_bundle.daemonset_issues | default([]) }}"
    workload_health_issues: "{{ workload_analysis_bundle.workload_health_issues | default([]) }}"
    high_replica_workloads: "{{ workload_analysis_bundle.high_replica_workloads | default([]) }}"
    workload_resilience_data: "{{ workload_analysis_bundle.workload_resilience_data | default({'findings': [], 'pdb_review_findings': [], 'multi_replica_workload_count': 0, 'multi_replica_workloads_without_pdb': 0, 'multi_replica_workloads_without_usable_pdb': 0, 'multi_replica_workloads_without_spread_policy': 0, 'multi_replica_workloads_with_node_or_zone_spread_policy': 0, 'multi_replica_workloads_with_other_spread_policy': 0}) }}"
    workload_practice_findings: "{{ (workload_practice_findings | default([])) + (workload_analysis_bundle.workload_practice_findings_append | default([])) }}"
    workload_probe_findings: "{{ workload_analysis_bundle.workload_probe_findings | default([]) }}"
