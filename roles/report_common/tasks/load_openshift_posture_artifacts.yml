---
- name: Find OpenShift posture artifacts
  ansible.builtin.find:
    paths: "{{ report_run_workspace_postures_dir }}"
    patterns: "*.json"
    file_type: file
  register: openshift_posture_artifact_files

- name: Initialize loaded OpenShift posture artifacts
  ansible.builtin.set_fact:
    openshift_posture_artifacts: "{{ openshift_posture_artifacts | default({}) }}"

- name: Read OpenShift posture artifact files
  ansible.builtin.slurp:
    path: "{{ item.path }}"
  loop: "{{ openshift_posture_artifact_files.files | default([]) }}"
  register: openshift_posture_artifact_raw_results
  when: (openshift_posture_artifact_files.matched | default(0) | int) > 0

- name: Merge OpenShift posture artifacts
  ansible.builtin.set_fact:
    openshift_posture_artifacts: >-
      {{
        (openshift_posture_artifacts | default({}))
        | combine(
            {
              (posture_artifact.key | default((item.item.path | basename | regex_replace('\.json$', '')))): posture_artifact
            },
            recursive=True
          )
      }}
  vars:
    posture_artifact: >-
      {{
        (
          item.content | b64decode | from_json
        )
        if (item.content | default('') | length > 0)
        else {}
      }}
  loop: "{{ openshift_posture_artifact_raw_results.results | default([]) }}"
  when:
    - not (item.skipped | default(false))
    - (item.content | default('') | length) > 0
