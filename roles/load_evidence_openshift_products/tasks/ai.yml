---
- name: Build AI product evidence summary
  vars:
    datasciencecluster_items: "{{ (product_graph_current.datascienceclusters | default({'items': []})).get('items', []) }}"
    dscinitialization_items: "{{ (product_graph_current.dscinitializations | default({'items': []})).get('items', []) }}"
    notebook_items: "{{ (product_graph_current.notebooks | default({'items': []})).get('items', []) }}"
    servingruntime_items: "{{ (product_graph_current.servingruntimes | default({'items': []})).get('items', []) }}"
    inferenceservice_items: "{{ (product_graph_current.inferenceservices | default({'items': []})).get('items', []) }}"
    modelmeshserving_items: "{{ (product_graph_current.modelmeshservings | default({'items': []})).get('items', []) }}"
    acceleratorprofile_items: "{{ (product_graph_current.acceleratorprofiles | default({'items': []})).get('items', []) }}"
    ai_sources: >-
      {{
        (
          (datasciencecluster_items + dscinitialization_items + notebook_items + servingruntime_items + inferenceservice_items + modelmeshserving_items + acceleratorprofile_items)
          | map(attribute='_evidence_sources')
          | list
          | flatten
          | unique
        )
        if (
          (
            (datasciencecluster_items + dscinitialization_items + notebook_items + servingruntime_items + inferenceservice_items + modelmeshserving_items + acceleratorprofile_items)
            | map(attribute='_evidence_sources')
            | list
            | flatten
            | unique
            | length
          ) > 0
        )
        else (['oc get'] if ((datasciencecluster_items | length > 0) or (dscinitialization_items | length > 0) or (notebook_items | length > 0) or (servingruntime_items | length > 0) or (inferenceservice_items | length > 0) or (modelmeshserving_items | length > 0) or (acceleratorprofile_items | length > 0)) else [])
      }}
  ansible.builtin.set_fact:
    assessment_product_evidence: >-
      {{
        assessment_product_evidence | combine({
          'ai': {
            'installed': ((datasciencecluster_items | length) > 0) or ((dscinitialization_items | length) > 0) or ((notebook_items | length) > 0) or ((servingruntime_items | length) > 0) or ((inferenceservice_items | length) > 0) or ((modelmeshserving_items | length) > 0) or ((acceleratorprofile_items | length) > 0),
            'health_applicable': ((datasciencecluster_items | length) > 0) or ((dscinitialization_items | length) > 0) or ((notebook_items | length) > 0) or ((servingruntime_items | length) > 0) or ((inferenceservice_items | length) > 0) or ((modelmeshserving_items | length) > 0) or ((acceleratorprofile_items | length) > 0),
            'present': ((datasciencecluster_items | length) > 0) or ((dscinitialization_items | length) > 0) or ((notebook_items | length) > 0) or ((servingruntime_items | length) > 0) or ((inferenceservice_items | length) > 0) or ((modelmeshserving_items | length) > 0) or ((acceleratorprofile_items | length) > 0),
            'datasciencecluster_count': (datasciencecluster_items | length),
            'dscinitialization_count': (dscinitialization_items | length),
            'notebook_count': (notebook_items | length),
            'servingruntime_count': (servingruntime_items | length),
            'inferenceservice_count': (inferenceservice_items | length),
            'modelmeshserving_count': (modelmeshserving_items | length),
            'acceleratorprofile_count': (acceleratorprofile_items | length),
            'unready_datasciencecluster_count': (
              datasciencecluster_items
              | map(attribute='status.conditions')
              | map('default', [])
              | map('to_json')
              | select('search', '"type": "Ready", "status": "False"|"type": "Available", "status": "False"')
              | list
              | length
            ),
            'unready_inferenceservice_count': (
              inferenceservice_items
              | map(attribute='status.conditions')
              | map('default', [])
              | map('to_json')
              | select('search', '"type": "Ready", "status": "False"')
              | list
              | length
            ),
            'evidence_sources': ai_sources
          }
        }, recursive=True)
      }}
