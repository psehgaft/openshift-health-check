- name: Collect OpenShift-specific data in parallel
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import os
    import subprocess
    import tempfile
    from concurrent.futures import ThreadPoolExecutor, as_completed

    commands = json.loads(r'''{{ openshift_collection_commands | to_json }}''')
    timeout_seconds = int({{ collection_command_timeout_seconds | int }})
    max_workers = min(
        max(1, int({{ effective_collection_parallelism | default(collection_parallelism) | int }})),
        max(1, len(commands)),
    )

    def run_command(spec):
        try:
            proc = subprocess.run(
                spec["argv"],
                capture_output=True,
                text=True,
                timeout=timeout_seconds,
                check=False,
            )
            return {
                "name": spec["name"],
                "rc": proc.returncode,
                "stdout": proc.stdout,
                "stderr": proc.stderr,
                "stdout_lines": proc.stdout.splitlines(),
                "timed_out": False,
            }
        except subprocess.TimeoutExpired as exc:
            return {
                "name": spec["name"],
                "rc": 124,
                "stdout": exc.stdout or "",
                "stderr": f"timed out after {timeout_seconds} seconds",
                "stdout_lines": (exc.stdout or "").splitlines(),
                "timed_out": True,
            }
        except Exception as exc:
            return {
                "name": spec["name"],
                "rc": 1,
                "stdout": "",
                "stderr": str(exc),
                "stdout_lines": [],
                "timed_out": False,
            }

    results = {}
    with ThreadPoolExecutor(max_workers=max_workers) as pool:
        futures = {pool.submit(run_command, spec): spec["name"] for spec in commands}
        for future in as_completed(futures):
            result = future.result()
            results[result["name"]] = result

    output_dir = tempfile.mkdtemp(prefix="cluster-health-collect-openshift-")
    output_path = os.path.join(output_dir, "collected-commands.json")
    status_path = os.path.join(output_dir, "collected-command-status.json")
    with open(output_path, "w", encoding="utf-8") as handle:
        json.dump(results, handle)
    with open(status_path, "w", encoding="utf-8") as handle:
        json.dump(
            {
                name: {
                    "rc": result.get("rc", 1),
                    "stderr": result.get("stderr", ""),
                    "timed_out": result.get("timed_out", False),
                }
                for name, result in results.items()
            },
            handle,
        )
    print(json.dumps({
        "results_path": output_path,
        "status_path": status_path,
        "command_count": len(commands),
        "max_workers": max_workers,
        "timeout_seconds": timeout_seconds
    }))
    PY
  register: openshift_collected_commands_cmd
  changed_when: false
  failed_when: false

- name: Normalize OpenShift-specific collection metadata
  ansible.builtin.set_fact:
    openshift_collection_run_metadata: "{{ openshift_collected_commands_cmd.stdout | from_json if (openshift_collected_commands_cmd.rc == 0 and (openshift_collected_commands_cmd.stdout | default('') | length > 0)) else {} }}"

- name: Load OpenShift-specific command results
  ansible.builtin.set_fact:
    openshift_collected_commands: "{{ lookup('file', openshift_collection_run_metadata.results_path) | from_json if (openshift_collection_run_metadata.results_path | default('') | length > 0) else {} }}"

- name: Load OpenShift-specific command status
  ansible.builtin.set_fact:
    openshift_collected_command_status: "{{ lookup('file', openshift_collection_run_metadata.status_path) | from_json if (openshift_collection_run_metadata.status_path | default('') | length > 0) else {} }}"

- name: Capture OpenShift optional collection skips
  ansible.builtin.set_fact:
    assessment_collection_skipped_optional_commands: "{{ existing_optional_skip_entries + [collection_skip_entry] }}"
  loop: "{{ openshift_collected_command_status | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    existing_optional_skip_entries: >-
      {{
        assessment_collection_skipped_optional_commands
        if (
          assessment_collection_skipped_optional_commands is defined
          and assessment_collection_skipped_optional_commands is sequence
          and assessment_collection_skipped_optional_commands is not string
        )
        else []
      }}
    collection_result: "{{ item.value if (item.value is mapping) else {} }}"
    collection_failure_stderr: "{{ collection_result.stderr | default('') | trim }}"
    collection_failure_stderr_lower: "{{ collection_failure_stderr | lower }}"
    optional_missing_resource_failure: >-
      {{
        (item.key in (openshift_optional_missing_resource_commands | default([])))
        and ("the server doesn't have a resource type" in collection_failure_stderr_lower)
      }}
    optional_missing_object_failure: >-
      {{
        (item.key in (openshift_optional_missing_object_commands | default([])))
        and ('error from server (notfound)' in collection_failure_stderr_lower)
      }}
    optional_forbidden_failure: >-
      {{
        (item.key in (openshift_optional_forbidden_command_names | default([])))
        and (
          'forbidden' in collection_failure_stderr_lower
          or 'unauthorized' in collection_failure_stderr_lower
        )
      }}
    collection_skip_entry:
      name: "{{ item.key }}"
      rc: "{{ collection_result.rc | default(1) }}"
      category: "{{ 'optional-api-missing' if optional_missing_resource_failure else ('optional-object-missing' if optional_missing_object_failure else 'optional-access-denied') }}"
      detail: "{{ collection_failure_stderr }}"
  when:
    - (collection_result.rc | default(1) | int) != 0
    - optional_missing_resource_failure or optional_missing_object_failure or optional_forbidden_failure
  changed_when: false

- name: Merge OpenShift-specific collection failures
  ansible.builtin.set_fact:
    assessment_collection_failures: "{{ (assessment_collection_failures | default([])) + [collection_failure_entry] }}"
  loop: "{{ openshift_collected_command_status | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    collection_result: "{{ item.value if (item.value is mapping) else {} }}"
    collection_failure_stderr: "{{ collection_result.stderr | default('') | trim }}"
    collection_failure_stderr_lower: "{{ collection_failure_stderr | lower }}"
    optional_missing_resource_failure: >-
      {{
        (item.key in (openshift_optional_missing_resource_commands | default([])))
        and ("the server doesn't have a resource type" in collection_failure_stderr_lower)
      }}
    optional_missing_object_failure: >-
      {{
        (item.key in (openshift_optional_missing_object_commands | default([])))
        and ('error from server (notfound)' in collection_failure_stderr_lower)
      }}
    optional_forbidden_failure: >-
      {{
        (item.key in (openshift_optional_forbidden_command_names | default([])))
        and (
          'forbidden' in collection_failure_stderr_lower
          or 'unauthorized' in collection_failure_stderr_lower
        )
      }}
    collection_failure_entry:
      name: "{{ item.key }}"
      rc: "{{ collection_result.rc | default(1) }}"
      timed_out: "{{ collection_result.timed_out | default(false) }}"
      stderr: "{{ collection_failure_stderr }}"
  when:
    - (collection_result.rc | default(1) | int) != 0
    - not optional_missing_resource_failure
    - not optional_missing_object_failure
    - not optional_forbidden_failure
  changed_when: false

- name: Merge OpenShift-specific collection summary
  ansible.builtin.set_fact:
    assessment_collection_summary:
      command_count: "{{ (assessment_collection_summary.command_count | default(0) | int) + (openshift_collection_commands | length) }}"
      applicable_command_count: "{{ [0, (((assessment_collection_summary.command_count | default(0) | int) + (openshift_collection_commands | length)) - (assessment_collection_skipped_optional_commands | default([]) | length))] | max }}"
      parallelism: "{{ assessment_collection_summary.parallelism | default(collection_parallelism | int) }}"
      timeout_seconds: "{{ assessment_collection_summary.timeout_seconds | default(collection_command_timeout_seconds | int) }}"
      failed_commands: "{{ assessment_collection_failures | default([]) | length }}"
      optional_skipped_commands: "{{ assessment_collection_skipped_optional_commands | default([]) | length }}"
      timed_out_commands: "{{ assessment_collection_failures | default([]) | selectattr('timed_out', 'equalto', true) | list | length }}"
      succeeded_commands: "{{ [0, (((assessment_collection_summary.command_count | default(0) | int) + (openshift_collection_commands | length)) - (assessment_collection_failures | default([]) | length) - (assessment_collection_skipped_optional_commands | default([]) | length))] | max }}"
      core_failed_commands: "{{ (assessment_collection_failures | default([]) | selectattr('name', 'in', (collection_core_command_names + openshift_collection_core_command_names)) | list | length) }}"
  changed_when: false

