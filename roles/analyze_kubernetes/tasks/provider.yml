---
- name: Build Kubernetes provider analysis
  block:
    - name: Create Kubernetes provider analysis input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-k8s-provider-
        suffix: .json
      register: kubernetes_provider_analysis_input_file
      changed_when: false

    - name: Write Kubernetes provider analysis input data
      ansible.builtin.copy:
        dest: "{{ kubernetes_provider_analysis_input_file.path }}"
        mode: "0600"
        content: "{{ {
          'provider_family': (resolved_provider_family | default(provider_family | default('generic'))),
          'cluster_profile_mode': (resolved_cluster_profile_mode | default(cluster_profile_mode | default('production'))),
          'nodes': ((nodes | default({})).get('items', [])),
          'pods': ((pods | default({})).get('items', [])),
          'deployments': ((deployments | default({})).get('items', [])),
          'daemonsets': ((daemonsets | default({})).get('items', [])),
          'namespaces': ((namespaces | default({})).get('items', []))
        } | to_json }}"
      changed_when: false

    - name: Run Kubernetes provider analysis
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/build_kubernetes_provider_analysis.py"
          - "{{ kubernetes_provider_analysis_input_file.path }}"
      register: kubernetes_provider_analysis_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove Kubernetes provider analysis input file
      ansible.builtin.file:
        path: "{{ kubernetes_provider_analysis_input_file.path }}"
        state: absent
      when: kubernetes_provider_analysis_input_file is defined and (kubernetes_provider_analysis_input_file.path | default('') | length > 0)
      changed_when: false

- name: Normalize Kubernetes provider analysis
  ansible.builtin.set_fact:
    kubernetes_provider_analysis: "{{ kubernetes_provider_analysis_cmd.stdout | from_json if (kubernetes_provider_analysis_cmd.rc == 0 and (kubernetes_provider_analysis_cmd.stdout | default('') | length > 0)) else {'provider_nodepool_summary': [], 'provider_component_summary': [], 'provider_specific_findings': [], 'provider_current_state': {'provider': (resolved_provider_family | default(provider_family | default('generic'))), 'profile_mode': (resolved_cluster_profile_mode | default(cluster_profile_mode | default('production'))), 'details': []}} }}"

- name: Set Kubernetes provider analysis facts
  ansible.builtin.set_fact:
    provider_nodepool_summary: "{{ kubernetes_provider_analysis.provider_nodepool_summary | default([]) }}"
    provider_component_summary: "{{ kubernetes_provider_analysis.provider_component_summary | default([]) }}"
    provider_specific_findings: "{{ kubernetes_provider_analysis.provider_specific_findings | default([]) }}"
    provider_current_state: "{{ kubernetes_provider_analysis.provider_current_state | default({'provider': (resolved_provider_family | default(provider_family | default('generic'))), 'profile_mode': (resolved_cluster_profile_mode | default(cluster_profile_mode | default('production'))), 'details': []}) }}"
