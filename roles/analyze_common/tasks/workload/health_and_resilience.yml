---
- name: Build workload health and resilience findings
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_workload_health_findings.py"
    stdin: "{{ {
      'pods': ((analysis_graph.pods | default({})).get('items', [])),
      'deployments': ((analysis_graph.deployments | default({})).get('items', [])),
      'statefulsets': ((analysis_graph.statefulsets | default({})).get('items', [])),
      'daemonsets': ((analysis_graph.daemonsets | default({})).get('items', [])),
      'platform_namespaces_regex': (platform_namespaces_regex | default('^$')),
      'user_namespaces_exclude_regex': (user_namespaces_exclude_regex | default('^$')),
      'operator_managed_namespace_names': (operator_managed_namespace_names | default([])),
      'filter_operator_managed_user_pods': true,
      'filter_operator_managed_workloads': true,
      'include_aged_user_pods': true,
      'age_threshold_days': 30,
      'include_high_replica_workloads': true,
      'high_replica_threshold': 10,
      'include_probe_findings': false
    } | to_json }}"
  register: workload_health_findings_cmd
  changed_when: false
  failed_when: false

- name: Normalize workload health and resilience findings
  ansible.builtin.set_fact:
    workload_health_findings_data: >-
      {{
        workload_health_findings_cmd.stdout | from_json
        if (workload_health_findings_cmd.rc == 0 and (workload_health_findings_cmd.stdout | default('') | length > 0))
        else {
          'platform_pod_issues': [],
          'unhealthy_user_pods': [],
          'aged_user_pods': [],
          'deployment_issues': [],
          'statefulset_issues': [],
          'daemonset_issues': [],
          'deploymentconfig_issues': [],
          'workload_health_issues': [],
          'high_replica_workloads': [],
          'workload_probe_findings': []
        }
      }}

- name: Expand workload health and resilience findings
  ansible.builtin.set_fact:
    platform_pod_issues: "{{ workload_health_findings_data.platform_pod_issues | default([]) }}"
    unhealthy_user_pods: "{{ workload_health_findings_data.unhealthy_user_pods | default([]) }}"
    aged_user_pods: "{{ workload_health_findings_data.aged_user_pods | default([]) }}"
    deployment_issues: "{{ workload_health_findings_data.deployment_issues | default([]) }}"
    statefulset_issues: "{{ workload_health_findings_data.statefulset_issues | default([]) }}"
    daemonset_issues: "{{ workload_health_findings_data.daemonset_issues | default([]) }}"
    workload_health_issues: "{{ workload_health_findings_data.workload_health_issues | default([]) }}"
    high_replica_workloads: "{{ workload_health_findings_data.high_replica_workloads | default([]) }}"

- name: Build multi-replica workload resilience findings
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_workload_resilience.py"
    stdin: "{{ {
      'deployments': ((analysis_graph.deployments | default({})).get('items', [])),
      'statefulsets': ((analysis_graph.statefulsets | default({})).get('items', [])),
      'deploymentconfigs': ((analysis_graph.deploymentconfigs | default({})).get('items', [])),
      'poddisruptionbudgets': ((analysis_graph.poddisruptionbudgets | default({})).get('items', [])),
      'exclude_regex': (user_namespaces_exclude_regex | default('^$')),
      'operator_managed_namespace_names': (operator_managed_namespace_names | default([]))
    } | to_json }}"
  register: workload_resilience_cmd
  changed_when: false
  failed_when: false

- name: Normalize multi-replica workload resilience findings
  ansible.builtin.set_fact:
    workload_resilience_data: "{{ workload_resilience_cmd.stdout | from_json if (workload_resilience_cmd.rc == 0 and (workload_resilience_cmd.stdout | default('') | length > 0)) else {'findings': [], 'pdb_review_findings': [], 'multi_replica_workload_count': 0, 'multi_replica_workloads_without_pdb': 0, 'multi_replica_workloads_without_usable_pdb': 0, 'multi_replica_workloads_without_spread_policy': 0, 'multi_replica_workloads_with_node_or_zone_spread_policy': 0, 'multi_replica_workloads_with_other_spread_policy': 0} }}"
    workload_practice_findings: "{{ (workload_practice_findings | default([])) + ((workload_resilience_cmd.stdout | from_json).findings if (workload_resilience_cmd.rc == 0 and (workload_resilience_cmd.stdout | default('') | length > 0)) else []) }}"
