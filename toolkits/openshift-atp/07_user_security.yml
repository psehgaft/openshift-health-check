# TC 58: Create a Secret
- name: "TC-58: Create a Secret"
  when: run_tc58_create_secret | default(true) | bool
  block:
    - name: "TC-58: Create test Secret"
      ansible.builtin.shell: |
        set -o pipefail
        if ! oc get project testproject -o name >/dev/null 2>&1; then
          oc new-project testproject --description="ATP Test Project"
        fi
        oc create secret generic test-atp --from-literal=name=test -n testproject --dry-run=client -o yaml | oc apply -n testproject -f -
      args:
        executable: /bin/bash
      register: tc58_cmd
      changed_when: false
      failed_when: false

    - name: "TC-58: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-58',
          'name': 'Create a Secret',
          'category': 'User & Security',
          'expected': 'Secret test-atp exists in testproject and is created or updated successfully',
          'status': ('Pass' if tc58_cmd.rc == 0 else 'Fail'),
