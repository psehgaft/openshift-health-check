      ansible.builtin.shell: >
        NODE=$(oc get nodes -l node-role.kubernetes.io/worker -o jsonpath='{.items[0].metadata.name}');
        oc debug node/${NODE} -- chroot /host getent hosts api.{{ cluster_name }}.{{ cluster_domain }}
      register: tc68_cmd
      changed_when: false
      failed_when: false

    - name: "TC-68: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-68',
          'name': 'Servicios Base (NTP y DNS)',
          'category': 'General Support / Telco',
          'expected': 'Cluster API and registry DNS resolution working from nodes',
          'status': ('Pass' if tc68_cmd.rc == 0 else 'Fail'),
          'procedure': (tc68_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc68_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc68_cmd.stderr | default(''))) if (tc68_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc68_cmd.rc | string) if tc68_cmd.rc is defined else '')),
          'details': tc68_cmd.stdout | default(tc68_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc68', 'dns_ntp']

