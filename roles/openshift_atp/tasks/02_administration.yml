---
# ==============================================================================
# Section 2: OpenShift Administration (TC 24 to TC 29 and TC 31; TC-30 runs last)
# ==============================================================================

# TC 24: Create Limit Range in OCP Default Project
- name: "TC-24: Create Limit Range in OCP Default Project"
  when: run_tc24_create_limitrange | default(true) | bool
  block:
    - name: "TC-24: Apply LimitRange manifest"
      ansible.builtin.shell: |
        set -euo pipefail
        cat <<EOF | oc apply -n default -f -
        apiVersion: "v1"
        kind: "LimitRange"
        metadata:
          name: "test-resource-limits"
          namespace: default
        spec:
          limits:
            - type: "Container"
              max:
                cpu: "2"
                memory: "1Gi"
              min:
                cpu: "100m"
                memory: "4Mi"
              default:
                cpu: "300m"
                memory: "200Mi"
              defaultRequest:
                cpu: "200m"
                memory: "100Mi"
              maxLimitRequestRatio:
                cpu: "10"
        EOF
        oc get limits -n default
      register: tc24_cmd
      changed_when: false
      failed_when: false

    - name: "TC-24: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-24',
          'name': 'Create Limit Range in OCP Default Project',
          'category': 'OpenShift Administration',
          'expected': 'LimitRange test-resource-limits created in default namespace',
          'status': ('Pass' if tc24_cmd.rc == 0 else 'Fail'),
          'procedure': (tc24_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc24_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc24_cmd.stderr | default(''))) if (tc24_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc24_cmd.rc | string) if tc24_cmd.rc is defined else '')),
          'details': tc24_cmd.stdout | default(tc24_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc24', 'administration']

# TC 25: Create Resource Quota in OCP Default Project
- name: "TC-25: Create Resource Quota in OCP Default Project"
  when: run_tc25_create_resourcequota | default(true) | bool
  block:
    - name: "TC-25: Apply ResourceQuota manifest"
      ansible.builtin.shell: |
        set -euo pipefail
        cat <<EOF | oc apply -n default -f -
        apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: compute-resources
        spec:
          hard:
            pods: "4"
            requests.cpu: "1"
            requests.memory: 1Gi
            requests.ephemeral-storage: 2Gi
            limits.cpu: "2"
            limits.memory: 2Gi
            limits.ephemeral-storage: 4Gi
        EOF
        oc get resourcequotas -n default
      register: tc25_cmd
      changed_when: false
      failed_when: false

    - name: "TC-25: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-25',
          'name': 'Create Resource Quota in OCP Default Project',
          'category': 'OpenShift Administration',
          'expected': 'ResourceQuota compute-resources applied to default namespace',
          'status': ('Pass' if tc25_cmd.rc == 0 else 'Fail'),
          'procedure': (tc25_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc25_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc25_cmd.stderr | default(''))) if (tc25_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc25_cmd.rc | string) if tc25_cmd.rc is defined else '')),
          'details': tc25_cmd.stdout | default(tc25_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc25', 'administration']

# TC 26: Sanity Reboot (guarded rolling reboot; opt-in)
- name: "TC-26: Sanity Reboot"
  block:
    - name: "TC-26: Determine whether the guarded reboot is explicitly authorized"
      ansible.builtin.set_fact:
        tc26_execution_requested: "{{ run_tc26_sanity_reboot | default(false) | bool }}"
        tc26_confirmation_matches: "{{ (tc26_reboot_confirmation | default('') | string) == ('REBOOT-CLUSTER-' ~ cluster_name) }}"

    - name: "TC-26: Reboot cluster nodes sequentially and collect before/after evidence"
      ansible.builtin.include_tasks: node_reboot_sequence.yml
      vars:
        tc_reboot_case_id: "TC-26"
        tc_reboot_scope: "all"
        tc_reboot_ready_timeout_seconds: "{{ tc26_node_ready_timeout_seconds | default(1800) }}"
        tc_reboot_boot_timeout_seconds: "{{ tc26_boot_id_timeout_seconds | default(900) }}"
        tc_reboot_drain_timeout: "{{ tc26_drain_timeout | default('10m') }}"
        tc_reboot_delay_minutes: "{{ tc26_reboot_delay_minutes | default(2) }}"
      when:
        - tc26_execution_requested | bool
        - tc26_confirmation_matches | bool

    - name: "TC-26: Classify reboot outcome"
      ansible.builtin.set_fact:
        tc26_status: >-
          {% if not (tc26_execution_requested | bool and tc26_confirmation_matches | bool) %}
          Skipped
          {% elif tc_reboot_cmd is defined and (tc_reboot_cmd.rc | default(1) | int) == 0 and 'TC_REBOOT_RESULT=PASS' in (tc_reboot_cmd.stdout | default('')) %}
          Pass
          {% else %}
          Fail
          {% endif %}

    - name: "TC-26: Build report result"
      ansible.builtin.set_fact:
        tc26_result:
          id: "TC-26"
          name: "Sanity Reboot"
          category: "OpenShift Administration"
          expected: "Capture node status before and after; reboot nodes one at a time, wait for each boot ID to change and node to return Ready before proceeding; leave every node Ready and restore its schedulability."
          status: "{{ tc26_status | trim }}"
          procedure: "Opt-in guarded rolling reboot: verify cluster health, capture oc get nodes before, cordon and drain without bypassing PDBs, reboot workers before control-plane nodes, wait for the rebooted node to become Ready before continuing, uncordon, then capture oc get nodes after."
          evidence: |
            {% if tc26_status | trim == 'Skipped' %}
            No reboot command was executed. Enable run_tc26_sanity_reboot and provide tc26_reboot_confirmation=REBOOT-CLUSTER-{{ cluster_name }}.
            {% else %}
            {{ tc_reboot_before_cmd.stdout | default('') }}
            {{ tc_reboot_cmd.stdout | default('') }}
            {% if tc_reboot_cmd.stderr | default('') | length > 0 %}
            STDERR:
            {{ tc_reboot_cmd.stderr }}
            {% endif %}
            Exit code: {{ tc_reboot_cmd.rc | default('unknown') }}
            {% endif %}
          details: |
            {% if tc26_status | trim == 'Skipped' %}
            TC-26 was not executed; the default is disabled and an exact confirmation is required.
            {% else %}
            {{ tc_reboot_cmd.stdout | default(tc_reboot_cmd.stderr | default('No reboot evidence available'), true) | truncate(700) }}
            {% endif %}
          remediation: "If execution failed, use the captured per-node evidence to identify the blocked drain, reboot timeout, API/operator health issue, or uncordon failure. PDB protections are not bypassed. Resolve the blocker and rerun only after all nodes and ClusterOperators are healthy."

    - name: "TC-26: Append Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [tc26_result] }}"
  tags: ['general', 'telco', 'tc26', 'administration']

# TC 27: Reboot Worker (guarded; opt-in)
- name: "TC-27: Reboot Worker"
  block:
    - name: "TC-27: Determine whether the selected worker reboot is explicitly authorized"
      ansible.builtin.set_fact:
        tc27_execution_requested: "{{ run_tc27_reboot_worker | default(false) | bool }}"
        tc27_confirmation_matches: "{{ (tc27_reboot_confirmation | default('') | string) == ('REBOOT-WORKER-' ~ (tc27_worker_node | default(''))) }}"
        tc27_target_configured: "{{ tc27_worker_node | default('') | length > 0 }}"

    - name: "TC-27: Reboot one worker and collect before/after evidence"
      ansible.builtin.include_tasks: node_reboot_sequence.yml
      vars:
        tc_reboot_case_id: "TC-27"
        tc_reboot_scope: "worker"
        tc_reboot_worker_node: "{{ tc27_worker_node }}"
        tc_reboot_ready_timeout_seconds: "{{ tc27_node_ready_timeout_seconds | default(1800) }}"
        tc_reboot_boot_timeout_seconds: "{{ tc27_boot_id_timeout_seconds | default(900) }}"
        tc_reboot_drain_timeout: "{{ tc27_drain_timeout | default('10m') }}"
        tc_reboot_delay_minutes: "{{ tc27_reboot_delay_minutes | default(2) }}"
      when:
        - tc27_execution_requested | bool
        - tc27_target_configured | bool
        - tc27_confirmation_matches | bool

    - name: "TC-27: Classify reboot outcome"
      ansible.builtin.set_fact:
        tc27_status: >-
          {% if not (tc27_execution_requested | bool and tc27_target_configured | bool and tc27_confirmation_matches | bool) %}
          Skipped
          {% elif tc_reboot_cmd is defined and (tc_reboot_cmd.rc | default(1) | int) == 0 and 'TC_REBOOT_RESULT=PASS' in (tc_reboot_cmd.stdout | default('')) %}
          Pass
          {% else %}
          Fail
          {% endif %}

    - name: "TC-27: Build report result"
      ansible.builtin.set_fact:
        tc27_result:
          id: "TC-27"
          name: "Reboot Worker"
          category: "OpenShift Administration"
          expected: "The explicitly selected worker is cordoned and drained; its boot ID changes, it returns Ready, then it is uncordoned; node evidence is captured before and after."
          status: "{{ tc27_status | trim }}"
          procedure: "Opt-in guarded single-worker reboot: capture oc get nodes before; cordon and drain the selected worker without bypassing PDBs; reboot it, wait for the boot ID to change and Ready status, uncordon, then capture oc get nodes after."
          evidence: |
            {% if tc27_status | trim == 'Skipped' %}
            No reboot command was executed. Enable run_tc27_reboot_worker, set tc27_worker_node, and provide tc27_reboot_confirmation=REBOOT-WORKER-<node>.
            {% else %}
            {{ tc_reboot_before_cmd.stdout | default('') }}
            {{ tc_reboot_cmd.stdout | default('') }}
            {% if tc_reboot_cmd.stderr | default('') | length > 0 %}
            STDERR:
            {{ tc_reboot_cmd.stderr }}
            {% endif %}
            Exit code: {{ tc_reboot_cmd.rc | default('unknown') }}
            {% endif %}
          details: |
            {% if tc27_status | trim == 'Skipped' %}
            TC-27 was not executed; the default is disabled and an exact worker target and confirmation are required.
            {% else %}
            {{ tc_reboot_cmd.stdout | default(tc_reboot_cmd.stderr | default('No reboot evidence available'), true) | truncate(700) }}
            {% endif %}
          remediation: "If execution failed, use the evidence to inspect the selected worker, drain/PDB conditions, boot ID transition, Ready timeout, and schedulability. Do not bypass PDB protections. Resolve the cause and rerun after the cluster is healthy."

    - name: "TC-27: Append Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [tc27_result] }}"
  tags: ['general', 'telco', 'tc27', 'administration']

# TC 28: Install Self Node Remediation Operator
- name: "TC-28: Install Self Node Remediation Operator"
  when: run_tc28_install_operator | default(true) | bool
  block:
    - name: "TC-28: Install SNRO and verify its workloads"
      ansible.builtin.shell: |
        set -euo pipefail
        wait_attempts={{ tc28_install_wait_attempts | default(60) | int }}
        wait_interval={{ tc28_install_wait_interval_seconds | default(10) | int }}
        package_name={{ tc28_package_name | default('self-node-remediation') | quote }}
        catalog_namespace={{ tc28_catalog_namespace | default('openshift-marketplace') | quote }}
        packagemanifest_resource={{ tc28_packagemanifest_api_resource | default('packagemanifests.packages.operators.coreos.com') | quote }}
        subscription_resource={{ tc28_subscription_api_resource | default('subscriptions.operators.coreos.com') | quote }}
        installplan_resource={{ tc28_installplan_api_resource | default('installplans.operators.coreos.com') | quote }}
        csv_resource={{ tc28_csv_api_resource | default('clusterserviceversions.operators.coreos.com') | quote }}
        controller_deployment={{ tc28_controller_deployment | default('self-node-remediation-controller-manager') | quote }}
        subscription={{ tc28_subscription_name | default('self-node-remediation') | quote }}
        operator_namespace={{ tc28_operator_namespace | default('openshift-workload-availability') | quote }}
        cat <<'SNRO_RESOURCES' | oc apply -f -
        apiVersion: v1
        kind: Namespace
        metadata:
          name: openshift-workload-availability
        ---
        apiVersion: operators.coreos.com/v1
        kind: OperatorGroup
        metadata:
          name: workload-availability-operator-group
          namespace: openshift-workload-availability
        ---
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: self-node-remediation
          namespace: openshift-workload-availability
        spec:
          channel: stable
          installPlanApproval: Automatic
          name: self-node-remediation
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        SNRO_RESOURCES

        echo "Subscription applied or already configured. Waiting up to $((wait_attempts * wait_interval)) seconds for the SNRO CSV to reach Succeeded."

        installed_csv=""
        for attempt in $(seq 1 "$wait_attempts"); do
          subscription_json="$(oc get "$subscription_resource" "$subscription" -n "$operator_namespace" -o json)"
          installed_csv="$(jq -r '.status.installedCSV // empty' <<< "$subscription_json")"
          resolution_error="$(jq -r '[.status.conditions[]? | select(.type == "ResolutionFailed" and .status == "True") | .message] | join("; ")' <<< "$subscription_json")"

          if [[ -n "$resolution_error" ]]; then
            echo "Subscription resolution failed: $resolution_error" >&2
            oc describe "$subscription_resource" "$subscription" -n "$operator_namespace" >&2 || true
            oc get "$packagemanifest_resource" "$package_name" -n "$catalog_namespace" -o yaml >&2 || true
            exit 1
          fi

          if [[ -n "$installed_csv" ]]; then
            phase="$(oc get "$csv_resource" "$installed_csv" -n "$operator_namespace" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            echo "Attempt $attempt: CSV=$installed_csv phase=${phase:-Pending}"
            if [[ "$phase" == "Succeeded" ]]; then
              break
            fi
            if [[ "$phase" == "Failed" ]]; then
              echo "ClusterServiceVersion $installed_csv entered Failed phase." >&2
              oc describe "$csv_resource" "$installed_csv" -n "$operator_namespace" >&2 || true
              exit 1
            fi
          else
            echo "Attempt $attempt: waiting for Subscription to resolve an installed CSV."
          fi
          sleep "$wait_interval"
        done

        if [[ -z "$installed_csv" || "$(oc get "$csv_resource" "$installed_csv" -n "$operator_namespace" -o jsonpath='{.status.phase}' 2>/dev/null || true)" != "Succeeded" ]]; then
          echo "Timed out waiting for the SNRO CSV to reach Succeeded." >&2
          oc describe "$subscription_resource" "$subscription" -n "$operator_namespace" >&2 || true
          oc get "$installplan_resource" -n "$operator_namespace" >&2 || true
          oc get "$csv_resource" -n "$operator_namespace" >&2 || true
          exit 1
        fi

        echo "Waiting for the SNRO controller Deployment rollout."
        oc rollout status deployment/"$controller_deployment" -n "$operator_namespace" --timeout=10m
        deployment_json="$(oc get deployment "$controller_deployment" -n "$operator_namespace" -o json)"
        deployment_desired="$(jq -r '.spec.replicas // 1' <<< "$deployment_json")"
        deployment_available="$(jq -r '.status.availableReplicas // 0' <<< "$deployment_json")"
        if [[ "$deployment_desired" -lt 1 || "$deployment_available" -lt "$deployment_desired" ]]; then
          echo "SNRO controller Deployment is not fully available: available=$deployment_available desired=$deployment_desired" >&2
          oc get pods -n "$operator_namespace" -o wide >&2 || true
          exit 1
        fi

        echo "== Discover Self Node Remediation DaemonSets =="
        daemonsets_json="$(oc get daemonsets -n "$operator_namespace" -o json)"
        daemonset_names="$(jq -r '.items[] | select(.metadata.name | test("self-node-remediation"; "i")) | .metadata.name' <<< "$daemonsets_json")"
        daemonset_note=""
        if [[ -z "$daemonset_names" ]]; then
          daemonset_note="No Self Node Remediation DaemonSet was returned by the API. CSV and controller Deployment are successful; inspect this resource if the installed operator release is expected to deploy an agent DaemonSet."
          echo "SNRO_OPTIONAL_RESOURCE_NOTE=$daemonset_note"
        else
          while IFS= read -r daemonset_name; do
            [[ -n "$daemonset_name" ]] || continue
            daemonset_json="$(oc get daemonset "$daemonset_name" -n "$operator_namespace" -o json)"
            desired="$(jq -r '.status.desiredNumberScheduled // 0' <<< "$daemonset_json")"
            ready="$(jq -r '.status.numberReady // 0' <<< "$daemonset_json")"
            echo "DaemonSet=$daemonset_name ready=$ready desired=$desired"
            if [[ "$desired" -lt 1 || "$ready" -ne "$desired" ]]; then
              echo "SNRO DaemonSet $daemonset_name is not ready on all targeted nodes: ready=$ready desired=$desired" >&2
              oc get pods -n "$operator_namespace" -o wide >&2 || true
              exit 1
            fi
          done <<< "$daemonset_names"
        fi

        echo "== Subscription =="
        oc get "$subscription_resource" "$subscription" -n "$operator_namespace" -o yaml
        echo "== Installed ClusterServiceVersion =="
        oc get "$csv_resource" "$installed_csv" -n "$operator_namespace" -o yaml
        echo "== Controller Deployment =="
        oc get deployment self-node-remediation-controller-manager -n "$operator_namespace" -o wide
        echo "== Remediation DaemonSets (if present) =="
        oc get daemonsets -n "$operator_namespace" -o wide
        echo "== Remediation configuration (if present) =="
        if ! oc get selfnoderemediationconfig self-node-remediation-config -n "$operator_namespace" -o yaml; then
          echo "SNRO_OPTIONAL_RESOURCE_NOTE=SelfNodeRemediationConfig was not found; inspect the installed release and CRD availability."
        fi
        echo "== Remediation strategy template (if present) =="
        if ! oc get selfnoderemediationtemplate self-node-remediation-automatic-strategy-template -n "$operator_namespace" -o yaml; then
          echo "SNRO_OPTIONAL_RESOURCE_NOTE=SelfNodeRemediationTemplate was not found; inspect the installed release and CRD availability."
        fi
        echo "== SNRO pods =="
        oc get pods -n "$operator_namespace" -o wide
        echo "SNRO_RESULT=PASS csv=$installed_csv phase=Succeeded controller_available=$deployment_available/$deployment_desired"
        if [[ -n "$daemonset_names" ]]; then echo "SNRO_DAEMONSET_RESULT=PASS names=$(tr '\n' ',' <<< "$daemonset_names")"; fi
      args:
        executable: /bin/bash
      register: tc28_cmd
      changed_when: false
      failed_when: false

    - name: "TC-28: Record Result"
      ansible.builtin.set_fact:
        tc28_result:
          id: "TC-28"
          name: "Install Self Node Remediation Operator"
          category: "OpenShift Administration"
          expected: "Self Node Remediation Operator CSV is Succeeded and the controller Deployment is available; any discovered SNRO DaemonSet is ready, with configuration/template resources recorded when present"
          status: "{{ 'Pass' if tc28_cmd.rc == 0 and 'SNRO_RESULT=PASS' in (tc28_cmd.stdout | default('')) else 'Fail' }}"
          procedure: "{{ tc28_cmd.cmd | default('Install the self-node-remediation package from redhat-operators/stable in openshift-workload-availability, then verify its CSV and workloads') }}"
          evidence: "{{ (tc28_cmd.stdout | default('')) ~ (('\\nSTDERR:\\n' ~ (tc28_cmd.stderr | default(''))) if (tc28_cmd.stderr | default('') | length > 0) else '') ~ ('\\nExit code: ' ~ (tc28_cmd.rc | string) if tc28_cmd.rc is defined else '') }}"
          details: "{{ tc28_cmd.stdout | default(tc28_cmd.stderr, true) | truncate(700) }}"
          remediation: "Confirm the self-node-remediation package and stable channel are available in the redhat-operators CatalogSource. Inspect Subscription ResolutionFailed conditions, InstallPlan, CSV events, and pods in openshift-workload-availability. Verify node scheduling, image pulls, RBAC, and watchdog/device prerequisites. Do not create a SelfNodeRemediation CR or simulate a node failure as part of this install check."
    - name: "TC-28: Append Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [tc28_result] }}"
  tags: ['general', 'telco', 'tc28', 'administration']

# TC 29: Purge Namespace (Project)
- name: "TC-29: Purge Namespace (Project)"
  when: run_tc29_purge_namespace | default(true) | bool
  block:
    - name: "TC-29: Inspect and purge resources in testproject"
      ansible.builtin.shell: |
        set -euo pipefail
        oc project testproject
        echo "== Resources before cleanup =="
        oc status
        oc delete all --all -n testproject --wait=true
        echo "== Resources after cleanup =="
        oc status
        remaining="$(oc get all --no-headers -n testproject)"
        if [[ -n "$remaining" ]]; then
          echo "Resources remain in testproject after cleanup:" >&2
          echo "$remaining" >&2
          exit 1
        fi
        echo "No resources remain in testproject."
      args:
        executable: /bin/bash
      register: tc29_cmd
      changed_when: false
      failed_when: false

    - name: "TC-29: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-29',
          'name': 'Purge Namespace (Project)',
          'category': 'OpenShift Administration',
          'expected': 'All resources in namespace testproject purged',
          'status': ('Pass' if tc29_cmd.rc == 0 else 'Fail'),
          'procedure': (tc29_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc29_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc29_cmd.stderr | default(''))) if (tc29_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc29_cmd.rc | string) if tc29_cmd.rc is defined else '')),
          'details': tc29_cmd.stdout | default(tc29_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc29', 'administration']

# TC 31: Cleanup a Worker
- name: "TC-31: Cleanup a Worker"
  when: run_tc31_cleanup_worker | default(true) | bool
  block:
    - name: "TC-31: Test cordon and uncordon workflow on first worker"
      ansible.builtin.shell: |
        set -euo pipefail
        NODE="$(oc get nodes -l node-role.kubernetes.io/worker -o jsonpath='{.items[0].metadata.name}')"
        if [[ -z "$NODE" ]]; then
          echo "No worker node was found." >&2
          exit 1
        fi
        oc adm cordon "$NODE"
        echo "== Node after cordon =="
        oc get node "$NODE" -o wide
        oc adm uncordon "$NODE"
        echo "== Node after uncordon =="
        oc get node "$NODE" -o wide
      register: tc31_cmd
      changed_when: false
      failed_when: false

    - name: "TC-31: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-31',
          'name': 'Cleanup a Worker',
          'category': 'OpenShift Administration',
          'expected': 'Worker is cordoned, inspected, and returned to schedulable state',
          'status': ('Pass' if tc31_cmd.rc == 0 else 'Fail'),
          'procedure': (tc31_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc31_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc31_cmd.stderr | default(''))) if (tc31_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc31_cmd.rc | string) if tc31_cmd.rc is defined else '')),
          'details': tc31_cmd.stdout | default(tc31_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc31', 'administration']