---
- name: Build API server audit and log retention capability artifact facts
  vars:
    day2_api_server_audit_and_log_retention_section_current: "{{ (((day2_capability_sections | default([])) | selectattr('key', 'equalto', 'api_server_audit_and_log_retention') | list | first) | default({})) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: api_server_audit_and_log_retention
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      observability_status: "{{ day2_api_server_audit_and_log_retention_section_current.status | default('unknown') }}"
      observability_reason_summary: "{{ day2_api_server_audit_and_log_retention_section_current.top_detail | default('unknown') }}"
      apiserver_audit_profile: "{{ (day2_posture_summary | default({})).get('apiserver_audit_profile', 'not-configured') }}"
    capability_artifact_render_inputs:
      day2_api_server_audit_and_log_retention_section: "{{ day2_api_server_audit_and_log_retention_section_current }}"
    capability_artifact_collection_inputs:
      apiserver_audit_profile: "{{ (day2_posture_summary | default({})).get('apiserver_audit_profile', 'not-configured') }}"
      api_audit_logging_present: "{{ ((day2_posture_summary | default({})).get('api_audit_logging_present', false)) | bool }}"
      api_audit_retention_present: "{{ ((day2_posture_summary | default({})).get('api_audit_retention_present', false)) | bool }}"
      audit_logs_delivery_state: "{{ (observability_summary | default({})).get('audit_logs_delivery_state', 'not-configured') }}"
      vendor_managed_log_forwarding_present: "{{ ((observability_summary | default({})).get('vendor_managed_log_forwarding_present', false)) | bool }}"
      log_forwarding_vendor_names: "{{ (observability_summary | default({})).get('log_forwarding_vendor_names', []) }}"
