# TC 67a: Storage (PVC, iSCSI y Multipath)
- name: "TC-67a: Storage (PVC, iSCSI y Multipath)"
  when: run_tc67a_storage_iscsi_multipath | default(true) | bool
  block:
    - name: "TC-67a: Check bound PVCs, SAN configuration, and worker multipath paths"
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          san_classes="{{ tc67a_san_storage_class_names | default([]) | join(',') }}"
          worker_json="$(oc get nodes -l node-role.kubernetes.io/worker -o json 2>&1)"
          worker_rc=$?
          pv_json="$(oc get pv -o json 2>&1)"
          pv_rc=$?
          pvc_json="$(oc get pvc -A -o json 2>&1)"
          pvc_rc=$?
          sc_json="$(oc get storageclass -o json 2>&1)"
          sc_rc=$?

          echo "== Bound PVC inventory =="
          if [[ "$pvc_rc" -eq 0 ]]; then
            printf '%s\n' "$pvc_json" | jq -r '.items[] | select(.status.phase == "Bound") | [.metadata.namespace, .metadata.name, .spec.storageClassName, .spec.volumeName] | @tsv'
            all_bound_pvc_count="$(printf '%s' "$pvc_json" | jq '[.items[] | select(.status.phase == "Bound")] | length')"
          else
            echo "$pvc_json" >&2
            exit 1
          fi

          if [[ "$worker_rc" -ne 0 || "$pv_rc" -ne 0 || "$sc_rc" -ne 0 ]]; then
            echo "Could not query workers, PVs, or StorageClasses."
            echo "$worker_json"
            echo "$pv_json"
            echo "$sc_json"
            exit 1
          fi
          worker_names="$(printf '%s' "$worker_json" | jq -r '.items[].metadata.name')"
          if [[ -z "$worker_names" ]]; then
            echo "No worker nodes were found."
            exit 1
          fi

          san_pvs="$(printf '%s' "$pv_json" | jq -c --arg csv "$san_classes" '($csv | split(",")) as $classes | [.items[] | select((.spec.iscsi != null) or (.spec.fc != null) or (((.spec.csi.driver // "") | test("iscsi|fibre|fibrechannel|netapp-san|pure-fc"; "i"))) or ((.spec.storageClassName // "") as $sc | ($sc != "" and ($classes | index($sc)) != null))) | {name: .metadata.name, phase: .status.phase, storageClass: .spec.storageClassName, claimNamespace: .spec.claimRef.namespace, claimName: .spec.claimRef.name, iscsi: ((.spec.iscsi != null) or (((.spec.csi.driver // "") | test("iscsi"; "i"))))}]')"
          san_sc_matches="$(printf '%s' "$sc_json" | jq -c --arg csv "$san_classes" '($csv | split(",")) as $classes | [.items[].metadata.name as $sc | select($sc != "" and ($classes | index($sc)) != null) | $sc]')"
          san_pv_count="$(printf '%s' "$san_pvs" | jq 'length')"
          san_sc_count="$(printf '%s' "$san_sc_matches" | jq 'length')"
          echo "Configured SAN storage classes: $san_sc_matches"
          echo "SAN-related PVs: $san_pvs"
          if [[ "$san_pv_count" -eq 0 && "$san_sc_count" -eq 0 ]]; then
            echo "TC67A_RESULT=NOT_APPLICABLE: no iSCSI/FC/SAN PV or configured SAN StorageClass was detected."
            echo "Worker multipathd state is not a failure when this cluster has no SAN-backed storage."
            exit 3
          fi

          san_pv_names="$(printf '%s' "$san_pvs" | jq -r '.[] | select(.phase == "Bound" and .claimName != null) | .name')"
          san_bound_pvc_count=0
          while IFS= read -r pv_name; do
            [[ -n "$pv_name" ]] || continue
            mapped_count="$(printf '%s' "$pvc_json" | jq --arg pv "$pv_name" '[.items[] | select(.status.phase == "Bound" and .spec.volumeName == $pv)] | length')"
            san_bound_pvc_count=$((san_bound_pvc_count + mapped_count))
          done <<< "$san_pv_names"
          echo "Bound PVCs using SAN PVs: $san_bound_pvc_count (all Bound PVCs in cluster: $all_bound_pvc_count)"
          if [[ "$san_bound_pvc_count" -eq 0 ]]; then
            echo "SAN is configured but no bound PVC is using a SAN-backed PV."
            exit 1
          fi

          worker_count=0
          worker_failures=0
          active_path_nodes=0
          iscsi_session_nodes=0
          iscsi_pv_count="$(printf '%s' "$san_pvs" | jq '[.[] | select(.iscsi == true)] | length')"
          while IFS= read -r node; do
            [[ -n "$node" ]] || continue
            worker_count=$((worker_count + 1))
            echo "== Worker $node: /etc/iscsi, multipathd, and multipath -ll =="
            node_output="$(oc debug -q "node/$node" -- chroot /host bash -lc '
              echo "multipathd: $(systemctl is-active multipathd 2>&1)"
              systemctl is-active multipathd >/dev/null 2>&1 || exit 11
              echo "-- /etc/iscsi --"
              if [[ -d /etc/iscsi ]]; then ls -la /etc/iscsi; else echo "/etc/iscsi is absent"; fi
              echo "-- iSCSI sessions --"
              iscsiadm -m session 2>&1 || true
              echo "-- multipath -ll --"
              multipath -ll 2>&1
            ' 2>&1)"
            node_rc=$?
            printf '%s\n' "$node_output"
            if [[ "$node_rc" -ne 0 ]]; then
              worker_failures=$((worker_failures + 1))
            fi
            if printf '%s' "$node_output" | grep -Eq 'active[[:space:]]+ready[[:space:]]+running'; then
              active_path_nodes=$((active_path_nodes + 1))
            fi
            if printf '%s' "$node_output" | grep -Eq 'tcp:|iser:'; then
              iscsi_session_nodes=$((iscsi_session_nodes + 1))
            elif [[ "$iscsi_pv_count" -gt 0 ]]; then
              echo "No iSCSI session evidence found on $node."
            fi
          done <<< "$worker_names"

          echo "Workers inspected: $worker_count; workers with multipath paths active/ready/running: $active_path_nodes; workers with iSCSI sessions: $iscsi_session_nodes; worker command failures: $worker_failures"
          if [[ "$worker_count" -eq 0 || "$worker_failures" -gt 0 || "$active_path_nodes" -eq 0 || ( "$iscsi_pv_count" -gt 0 && "$iscsi_session_nodes" -eq 0 ) ]]; then
            echo "TC67A_RESULT=FAIL: configured SAN storage requires an active multipath daemon and at least one active/ready/running path."
            exit 1
          fi
          echo "TC67A_RESULT=PASS"
        executable: /bin/bash
      register: tc67a_cmd
      changed_when: false
      failed_when: false

    - name: "TC-67a: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-67a',
          'name': 'Storage (PVC, iSCSI y Multipath)',
          'category': 'General Support / Telco',
          'expected': 'When SAN storage is configured, a SAN-backed PVC is Bound; worker nodes report multipathd active and at least one active/ready/running path. For iSCSI-backed PVs, an active iSCSI session is also detected. If no SAN storage is configured, the multipath-specific check is not applicable.',
          'status': ('Skipped' if tc67a_cmd.rc == 3 else 'Pass' if tc67a_cmd.rc == 0 else 'Fail'),
          'procedure': 'Query Bound PVCs, PV volume types and configured SAN StorageClasses; on every worker inspect /etc/iscsi, iscsid sessions, multipathd, and multipath -ll through oc debug node/<worker> -- chroot /host.',
          'evidence': ((tc67a_cmd.stdout | default('')) ~ (('\\nSTDERR:\\n' ~ (tc67a_cmd.stderr | default(''))) if (tc67a_cmd.stderr | default('') | length > 0) else '') ~ ('\\nExit code: ' ~ (tc67a_cmd.rc | string) if tc67a_cmd.rc is defined else '')),
          'details': tc67a_cmd.stdout | default(tc67a_cmd.stderr) | truncate(300),
          'remediation': 'For SAN-backed storage, verify StorageClass/PVC/PV binding, iSCSI target sessions or FC connectivity, multipath configuration and daemon state on eligible workers, and active/ready paths. Check the SAN CSI driver documentation and node placement before changing host services. Do not enable multipathd when the cluster does not use SAN.'
        }] }}"
  tags: ['general', 'telco', 'tc67a', 'multipath']

# TC 67b: Network (Validación de NNCP)
- name: "TC-67b: Network (Validación de NNCP)"
  when: run_tc67b_network_nncp | default(true) | bool
  block:
    - name: "TC-67b: Query NodeNetworkConfigurationPolicy (NNCP)"
      ansible.builtin.command: oc get nncp --no-headers
      register: tc67b_cmd
      changed_when: false
      failed_when: false

    - name: "TC-67b: Record Result"
      vars:
        nncp_lines: "{{ tc67b_cmd.stdout_lines | default([]) }}"
        unready_nncp: "{{ nncp_lines | reject('search', 'Available') | list }}"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-67b',
          'name': 'Network (Validación de NNCP)',
          'category': 'General Support / Telco',
          'expected': 'All NodeNetworkConfigurationPolicy (NNCP) rules Available=True',
          'status': ('Pass' if (tc67b_cmd.rc == 0 and unready_nncp | length == 0 and nncp_lines | length > 0) else 'Fail'),
          'procedure': (tc67b_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc67b_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc67b_cmd.stderr | default(''))) if (tc67b_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc67b_cmd.rc | string) if tc67b_cmd.rc is defined else '')),
          'details': 'Total NNCPs: ' ~ (nncp_lines | length) ~ ', Unready: ' ~ (unready_nncp | length)
        }] }}"
  tags: ['general', 'telco', 'tc67b', 'nncp']

