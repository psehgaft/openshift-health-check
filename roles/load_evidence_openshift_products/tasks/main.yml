---
- name: Resolve product evidence graph
  ansible.builtin.set_fact:
    product_graph_current: "{{ analysis_graph | default(collected_resource_graph | default({})) }}"

- name: Initialize product evidence defaults
  ansible.builtin.include_tasks: defaults.yml

- name: Build pipelines product evidence summary
  ansible.builtin.include_tasks: pipelines.yml

- name: Build logging product evidence summary
  ansible.builtin.include_tasks: logging.yml

- name: Build GitOps product evidence summary
  ansible.builtin.include_tasks: gitops.yml

- name: Build ODF product evidence summary
  ansible.builtin.include_tasks: odf.yml

- name: Build virtualization product evidence summary
  ansible.builtin.include_tasks: virtualization.yml

- name: Build AI product evidence summary
  ansible.builtin.include_tasks: ai.yml

- name: Build product evidence findings
  ansible.builtin.include_tasks: findings.yml
