      observability_findings: "{{ observability_findings | default([]) | length }}"
      collection_failed_commands: "{{ collection_summary.failed_commands | default(0) }}"
      collection_core_failed_commands: "{{ collection_summary.core_failed_commands | default(0) }}"
      collection_timed_out_commands: "{{ collection_summary.timed_out_commands | default(0) }}"
      available_updates: "{{ available_updates | default([]) | length }}"
      conditional_updates: "{{ conditional_updates | default([]) | length }}"
      recent_warning_events: "{{ recent_warning_events | default([]) | length }}"
      firing_alerts: "{{ firing_alerts | default([]) | length }}"

- name: Create cluster current state temp input
  ansible.builtin.tempfile:
    state: file
    prefix: openshift-cluster-current-state-
    suffix: .json
  register: cluster_current_state_input

- name: Write cluster current state input
  ansible.builtin.copy:
    dest: "{{ cluster_current_state_input.path }}"
    mode: "0600"
    content: "{{ {
      'cluster_profile': cluster_profile | default({}),
      'clusterversion': clusterversion | default({}),
      'nodes': (nodes | default({})).get('items', []),
      'pod_object_counts': pod_object_counts | default({}),
      'deployment_count': ((deployments | default({})).get('items', []) | length),
      'statefulset_count': ((statefulsets | default({})).get('items', []) | length),
      'daemonset_count': ((daemonsets | default({})).get('items', []) | length),
      'route_count': ((routes | default({})).get('items', []) | length),
      'ingress_count': ((ingresses | default({})).get('items', []) | length),
      'namespace_count': ((namespaces | default({})).get('items', []) | length),
      'storageclass_count': ((storageclasses | default({})).get('items', []) | length),
      'machineconfigpool_count': ((machineconfigpools | default({})).get('items', []) | length),
      'machineconfigpools': machineconfigpools | default({'items': []}),
      'ingresscontrollers': (ingresscontrollers | default({})).get('items', []),
      'node_pod_counts': node_pod_counts | default({}),
      'node_cpu_utilization_results': node_cpu_utilization_results | default([]),
      'node_memory_utilization_results': node_memory_utilization_results | default([]),
      'node_disk_utilization_results': node_disk_utilization_results | default([]),
      'kubelet_pod_density_results': kubelet_pod_density_results | default([]),
      'service_ip_capacity_summary': service_ip_capacity_summary | default({}),
      'pod_ip_capacity_summary': pod_ip_capacity_summary | default({}),
      'node_ip_capacity_summary': node_ip_capacity_summary | default({}),
      'report_generated_at': report_generated_at,
      'cv_available': cv_available | default('Unknown'),
      'cv_progressing': cv_progressing | default('Unknown'),
      'cv_failing': cv_failing | default('Unknown'),
      'insights_available': ((clusteroperator_status_map | default({})).get('insights', {})).get('available', 'Unknown'),
      'insights_degraded': ((clusteroperator_status_map | default({})).get('insights', {})).get('degraded', 'Unknown'),
      'openshift_deployment_type': cluster_profile.deployment_type | default('openshift'),
      'openshift_is_sno': cluster_profile.is_sno | default(false),
      'openshift_is_hosted_control_plane': cluster_profile.is_hosted_control_plane | default(false)
    } | to_nice_json }}"

- name: Build cluster current state
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/build_openshift_cluster_current_state.py"
      - "{{ cluster_current_state_input.path }}"
  register: cluster_current_state_cmd
  changed_when: false
  failed_when: false

- name: Normalize cluster current state
  ansible.builtin.set_fact:
    cluster_current_state_build_error: "{{ '' if (cluster_current_state_cmd.rc == 0 and (cluster_current_state_cmd.stdout | default('') | length > 0)) else (cluster_current_state_cmd.stderr | default(cluster_current_state_cmd.stdout | default('cluster current state builder returned no output')) | trim) }}"
    cluster_current_state: "{{ cluster_current_state_cmd.stdout | from_json if (cluster_current_state_cmd.rc == 0 and (cluster_current_state_cmd.stdout | default('') | length > 0)) else cluster_current_state_fallback }}"
  vars:
    insights_status_fallback: >-
      {{
        'unknown'
        if (((clusteroperator_status_map | default({})).get('insights', {})) | length) == 0
        else (
          'enabled and healthy'
          if (((clusteroperator_status_map | default({})).get('insights', {})).get('available', 'Unknown') == 'True'
              and ((clusteroperator_status_map | default({})).get('insights', {})).get('degraded', 'False') != 'True')
          else (
            'enabled but degraded'
            if (((clusteroperator_status_map | default({})).get('insights', {})).get('degraded', 'False') == 'True')
            else 'configured but not healthy'
          )
        )
      }}
    cluster_current_state_fallback:
      ocp_version: "{{ clusterversion.status.desired.version | default('unknown') }}"
      cluster_version_available: "{{ cv_available | default('Unknown') }}"
      cluster_version_progressing: "{{ cv_progressing | default('Unknown') }}"
      cluster_version_failing: "{{ cv_failing | default('Unknown') }}"
      kubernetes_version: "{{ (kubelet_version_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | map(attribute='key') | first) | default('unknown') }}"
      deployment_type: "{{ cluster_profile.deployment_type | default('openshift') }}"
      is_sno: "{{ cluster_profile.is_sno | default(false) | bool }}"
      is_hosted_control_plane: "{{ cluster_profile.is_hosted_control_plane | default(false) | bool }}"
      kubernetes_version_state: "{{ 'mixed' if ((kubelet_version_counts | default({}) | length) > 1) else ('uniform' if ((kubelet_version_counts | default({}) | length) == 1) else 'unknown') }}"
      kubernetes_versions: []
      insights_status: "{{ insights_status_fallback }}"
      cluster_visibility: unknown
      api_visibility: unknown
      ingress_visibility: unknown
      default_ingress_strategy: unknown
      installed_at: unknown
      uptime_days: unknown
      uptime_human: unknown
      machineconfigpool_count: "{{ (machineconfigpools | default({})).get('items', []) | length }}"
      worker_pool_count: 0
      node_counts:
        total: "{{ (nodes | default({})).get('items', []) | length }}"
        control_plane: "{{ ((cluster_profile.control_plane_node_count | default(0)) | int) }}"
        worker: "{{ ((cluster_profile.worker_node_count | default(0)) | int) }}"
        infra: "{{ ((cluster_profile.infra_node_count | default(0)) | int) }}"
        other: "{{ [0, ((nodes | default({})).get('items', []) | length) - ((cluster_profile.control_plane_node_count | default(0) | int) + (cluster_profile.worker_node_count | default(0) | int) + (cluster_profile.infra_node_count | default(0) | int))] | max }}"
      object_counts:
        namespaces: "{{ (namespaces | default({})).get('items', []) | length }}"
        pods: "{{ (pods | default({})).get('items', []) | length }}"
        running_pods: "{{ (pods | default({})).get('items', []) | selectattr('status.phase', 'equalto', 'Running') | list | length }}"
        deployments: "{{ (deployments | default({})).get('items', []) | length }}"
        statefulsets: "{{ (statefulsets | default({})).get('items', []) | length }}"
        daemonsets: "{{ (daemonsets | default({})).get('items', []) | length }}"
        routes: "{{ (routes | default({})).get('items', []) | length }}"
        ingresses: "{{ (ingresses | default({})).get('items', []) | length }}"
        storageclasses: "{{ (storageclasses | default({})).get('items', []) | length }}"
      resources:
        total_cpu_cores: unknown
        total_cpu_millicores: unknown
        total_memory_gib: unknown
        total_memory_mib: unknown
        total_ephemeral_storage_gib: unknown
        average_cpu_cores_per_node: unknown
        average_cpu_millicores_per_node: unknown
        average_memory_gib_per_node: unknown
        average_memory_mib_per_node: unknown
        average_ephemeral_storage_gib_per_node: unknown
        average_pods_per_node: "{{ (((pods | default({})).get('items', []) | length) / ([1, ((nodes | default({})).get('items', []) | length)] | max)) | round(1) }}"
        average_pod_density_pct: n/a
        average_cpu_utilization_pct: n/a
        average_memory_utilization_pct: n/a
        average_disk_utilization_pct: n/a
      ip_capacity:
        services: "{{ service_ip_capacity_summary | default({'ranges': [], 'range_count': 0, 'range_list': [], 'total_ips': 'unknown', 'taken_ips': 0, 'available_ips': 'unknown', 'observed_ips': 0, 'observed_out_of_range_count': 0, 'observed_out_of_range_sample': []}) }}"
        pods: "{{ pod_ip_capacity_summary | default({'ranges': [], 'range_count': 0, 'range_list': [], 'total_ips': 'unknown', 'taken_ips': 0, 'available_ips': 'unknown', 'observed_ips': 0, 'observed_out_of_range_count': 0, 'observed_out_of_range_sample': []}) }}"
        nodes: "{{ node_ip_capacity_summary | default({'ranges': [], 'range_count': 0, 'range_list': [], 'total_ips': 'unknown', 'taken_ips': 0, 'available_ips': 'unknown', 'observed_ips': 0, 'observed_out_of_range_count': 0, 'observed_out_of_range_sample': []}) }}"
      node_growth_capacity:
        current_nodes: "{{ (nodes | default({})).get('items', []) | length }}"
        max_nodes_by_pod_network: unknown
        additional_nodes_by_pod_network: unknown
        pod_network_headroom_pct: unknown
        node_ip_ranges: "{{ node_ip_capacity_summary.range_list | default([]) }}"
        node_ips_taken: "{{ node_ip_capacity_summary.taken_ips | default(0) }}"
        node_ips_available: "{{ node_ip_capacity_summary.available_ips | default('unknown') }}"
        effective_additional_nodes: unknown
        network_slot_details: []
      node_architectures: []
      instance_types: []
      node_shapes: []
      provider_types: []
      operating_systems: []
      os_images: []
      kernel_versions: []
      container_runtimes: []
      node_roles: []
      top_node_features: []
      worker_pools: []
      machineconfigpools: []

- name: Build cluster current state sanity findings
  ansible.builtin.set_fact:
    cluster_current_state_sanity_findings: >-
      {{
        ([] +
        ([{
          'area': 'ip-capacity-services',
          'detail': 'services were collected but no service CIDR ranges were derived'
        }] if (
          (((services | default({})).get('items', []) | length) > 0)
          and ((cluster_current_state.ip_capacity.services.range_list | default([]) | length) == 0)
        ) else []) +
        ([{
          'area': 'ip-capacity-pods',
          'detail': 'pods were collected but no pod CIDR ranges were derived'
        }] if (
          (((pods | default({})).get('items', []) | length) > 0)
          and ((cluster_current_state.ip_capacity.pods.range_list | default([]) | length) == 0)
        ) else []) +
        ([{
          'area': 'node-platform-version',
          'detail': 'nodes were collected but the Kubernetes version summary is unknown'
        }] if (
          (((nodes | default({})).get('items', []) | length) > 0)
          and ((cluster_current_state.kubernetes_version | default('unknown')) == 'unknown')
        ) else []) +
        ([{
          'area': 'machineconfigpools',
          'detail': 'MachineConfigPools were collected but the normalized MCP summary is empty'
        }] if (
          (((machineconfigpools | default({})).get('items', []) | length) > 0)
          and ((cluster_current_state.machineconfigpools | default([]) | length) == 0)
        ) else []) +
        ([{
          'area': 'worker-pools',
          'detail': 'worker nodes were collected but no worker pool summary was derived'
        }] if (
          ((cluster_current_state.node_counts.worker | default(0) | int) > 0)
          and ((cluster_current_state.worker_pools | default([]) | length) == 0)
        ) else []))
      }}

- name: Remove cluster current state temp input
  ansible.builtin.file:
    path: "{{ cluster_current_state_input.path }}"
    state: absent
  changed_when: false

- name: Build OpenShift topology resilience summary
  ansible.builtin.shell: |
    python3 - <<'PY'
    import base64
    import json
    from collections import Counter

    data = json.loads(base64.b64decode(r'''{{ {
      "nodes": (nodes | default({})).get('items', []),
      "worker_pools": (cluster_current_state.worker_pools | default([])),
      "machinesets": (machinesets | default({})).get('items', [])
    } | to_json | b64encode }}''').decode("utf-8"))

    worker_zone_counts = Counter()
    unlabeled_worker_nodes = 0
    for node in data.get("nodes", []):
        meta = node.get("metadata", {}) or {}
        labels = meta.get("labels", {}) or {}
        roles = []
        for key in labels:
            if key.startswith("node-role.kubernetes.io/"):
                roles.append(key.replace("node-role.kubernetes.io/", "", 1) or "worker")
        primary_role = "worker"
        if "master" in roles:
            primary_role = "master"
        elif "control-plane" in roles:
            primary_role = "control-plane"
        elif "infra" in roles:
            primary_role = "infra"
        elif "worker" in roles:
            primary_role = "worker"
        elif roles:
            primary_role = sorted(roles)[0]
        if primary_role != "worker":
            continue
        zone = labels.get("topology.kubernetes.io/zone") or labels.get("failure-domain.beta.kubernetes.io/zone")
        if zone:
            worker_zone_counts[str(zone)] += 1
        else:
            unlabeled_worker_nodes += 1

    worker_pools = data.get("worker_pools", []) or []
    single_zone_pools = [p for p in worker_pools if len(p.get("zones", []) or []) <= 1]
    zone_counts = list(worker_zone_counts.values())
    zone_spread_unbalanced = (max(zone_counts) - min(zone_counts) > 1) if len(zone_counts) > 1 else False

    machineset_summary = []
    machine_set_zone_counts = Counter()
    machinesets_without_zone = 0
    replicas = []
    for item in data.get("machinesets", []):
        meta = item.get("metadata", {}) or {}
        spec = item.get("spec", {}) or {}
        tmpl_meta = (((spec.get("template", {}) or {}).get("metadata", {}) or {}))
        labels = tmpl_meta.get("labels", {}) or {}
        zone = labels.get("topology.kubernetes.io/zone") or labels.get("failure-domain.beta.kubernetes.io/zone") or labels.get("machine.openshift.io/zone")
        replicas_value = int(spec.get("replicas", 0) or 0)
        replicas.append(replicas_value)
        if zone:
            machine_set_zone_counts[str(zone)] += replicas_value
        else:
            machinesets_without_zone += 1
        machineset_summary.append({
            "namespace": meta.get("namespace", "openshift-machine-api"),
            "name": meta.get("name", "unknown"),
            "replicas": replicas_value,
            "zone": zone or "unknown",
        })

    machineset_replica_unbalanced = (max(replicas) - min(replicas) > 1) if len(replicas) > 1 else False

    print(json.dumps({
        "worker_failure_domains_observed": sorted(worker_zone_counts.keys()),
        "worker_zone_counts": [{"zone": z, "nodes": worker_zone_counts[z]} for z in sorted(worker_zone_counts.keys())],
        "worker_nodes_without_zone_label": unlabeled_worker_nodes,
        "single_zone_worker_pools": [{"type": p.get("type", "unknown"), "nodes": p.get("nodes", 0), "zones": p.get("zones", [])} for p in single_zone_pools],
        "single_zone_worker_pool_count": len(single_zone_pools),
        "worker_zone_spread_unbalanced": zone_spread_unbalanced,
        "machineset_summary": machineset_summary,
        "machine_set_failure_domains_observed": sorted(machine_set_zone_counts.keys()),
        "machine_set_zone_counts": [{"zone": z, "replicas": machine_set_zone_counts[z]} for z in sorted(machine_set_zone_counts.keys())],
        "machinesets_without_zone_label": machinesets_without_zone,
        "machineset_replica_unbalanced": machineset_replica_unbalanced,
    }))
    PY
  register: topology_resilience_cmd
  changed_when: false
  failed_when: false

- name: Normalize OpenShift topology resilience summary
  ansible.builtin.set_fact:
    topology_resilience: "{{ topology_resilience_cmd.stdout | from_json if (topology_resilience_cmd.rc == 0 and (topology_resilience_cmd.stdout | default('') | length > 0)) else {'worker_failure_domains_observed': [], 'worker_zone_counts': [], 'worker_nodes_without_zone_label': 0, 'single_zone_worker_pools': [], 'single_zone_worker_pool_count': 0, 'worker_zone_spread_unbalanced': false, 'machineset_summary': [], 'machine_set_failure_domains_observed': [], 'machine_set_zone_counts': [], 'machinesets_without_zone_label': 0, 'machineset_replica_unbalanced': false} }}"
