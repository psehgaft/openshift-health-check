          deployment_type: "{{ report_resume_cluster_deployment_type | default('') }}"
          deployment_type_source: "{{ report_resume_cluster_deployment_type_source | default('') }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Restore resume checkpoint snapshot facts
      ansible.builtin.set_fact: "{{ report_resume_snapshot }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Restore checkpoint pointers from manifest
      ansible.builtin.set_fact:
        report_resume_last_snapshot_path: "{{ report_resume_manifest.snapshot_path | default('') }}"
        report_resume_last_completed_stage: "{{ report_resume_manifest.last_completed_stage | default('') }}"
        report_resume_last_resume_next_stage: "{{ report_resume_manifest.resume_next_stage | default('') }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Ensure run workspace directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ report_run_workspace_dir }}"
        - "{{ report_run_workspace_shared_dir }}"
        - "{{ report_run_workspace_postures_dir }}"
        - "{{ report_run_workspace_capabilities_dir }}"
