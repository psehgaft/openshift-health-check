---
- name: Build namespace hygiene, pod security, and pod CPU facts
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helpers_from_stdin.py"
    stdin: "{{ {
      'fail_on_error': false,
      'helpers': [
        {
          'name': 'security_hygiene',
          'script': 'scripts/build_security_hygiene_facts.py',
          'input': {
            'networkpolicies': ((analysis_graph.networkpolicies | default({})).get('items', [])),
            'resourcequotas': ((analysis_graph.resourcequotas | default({})).get('items', [])),
            'limitranges': ((analysis_graph.limitranges | default({})).get('items', [])),
            'pods': ((analysis_graph.pods | default({})).get('items', [])),
            'namespace_pod_counts': (namespace_pod_counts | default({})),
            'user_namespace_names': (user_namespace_names | default([])),
            'exclude_regex': (user_namespaces_exclude_regex | default('^$'))
          }
        },
        {
          'name': 'pod_cpu_request_map',
          'script': 'scripts/build_pod_cpu_request_map.py',
          'input': {
            'pods': ((analysis_graph.pods | default({})).get('items', [])),
            'nodes': (openshift_node_items | default([]))
          }
        },
        {
          'name': 'pod_security_hardening',
          'script': 'scripts/build_pod_security_hardening_findings.py',
          'input': {
            'pods': ((analysis_graph.pods | default({})).get('items', [])),
            'exclude_regex': (user_namespaces_exclude_regex | default('^$'))
          }
        },
        {
          'name': 'storage_and_sensitive',
          'script': 'scripts/build_storage_and_sensitive_findings.py',
          'input': {
            'pods': ((analysis_graph.pods | default({})).get('items', [])),
            'exclude_regex': (user_namespaces_exclude_regex | default('^$'))
          }
        }
      ]
    } | to_json }}"
  register: security_hygiene_batch_cmd
  changed_when: false
  failed_when: false

- name: Normalize namespace hygiene, pod security, and pod CPU facts
  vars:
    security_hygiene_batch_results: >-
      {{
        (security_hygiene_batch_cmd.stdout | from_json).results
        if (security_hygiene_batch_cmd.rc == 0 and (security_hygiene_batch_cmd.stdout | default('') | length > 0))
        else {}
      }}
  ansible.builtin.set_fact:
    security_hygiene_facts: "{{ security_hygiene_batch_results.security_hygiene.output | default({}) }}"
    pod_cpu_request_map_data: "{{ security_hygiene_batch_results.pod_cpu_request_map.output | default({}) }}"
    pod_security_hardening_data: "{{ security_hygiene_batch_results.pod_security_hardening.output | default({}) }}"
    storage_and_sensitive_findings_data: "{{ security_hygiene_batch_results.storage_and_sensitive.output | default({}) }}"

- name: Apply namespace hygiene and basic pod security facts
  ansible.builtin.set_fact:
    networkpolicy_namespace_counts: "{{ security_hygiene_facts.networkpolicy_namespace_counts | default({}) }}"
    ingress_policy_namespace_counts: "{{ security_hygiene_facts.ingress_policy_namespace_counts | default({}) }}"
    egress_policy_namespace_counts: "{{ security_hygiene_facts.egress_policy_namespace_counts | default({}) }}"
    resourcequota_namespace_counts: "{{ security_hygiene_facts.resourcequota_namespace_counts | default({}) }}"
    limitrange_namespace_counts: "{{ security_hygiene_facts.limitrange_namespace_counts | default({}) }}"
    namespaces_without_networkpolicy: "{{ security_hygiene_facts.namespaces_without_networkpolicy | default([]) }}"
    namespaces_without_resourcequota: "{{ security_hygiene_facts.namespaces_without_resourcequota | default([]) }}"
    namespaces_without_limitrange: "{{ security_hygiene_facts.namespaces_without_limitrange | default([]) }}"
    empty_user_namespaces: "{{ security_hygiene_facts.empty_user_namespaces | default([]) }}"
    namespaces_missing_ingress_policies: "{{ security_hygiene_facts.namespaces_missing_ingress_policies | default([]) }}"
    namespaces_missing_egress_policies: "{{ security_hygiene_facts.namespaces_missing_egress_policies | default([]) }}"
    security_findings: "{{ (security_findings | default([])) + (security_hygiene_facts.security_findings | default([])) }}"
    workload_practice_findings: "{{ (workload_practice_findings | default([])) + (security_hygiene_facts.workload_practice_findings | default([])) }}"

- name: Normalize pod CPU request map
  ansible.builtin.set_fact:
    pod_cpu_request_map: "{{ pod_cpu_request_map_data.pod_cpu_request_map | default({}) }}"
    node_cpu_request_millicores: "{{ pod_cpu_request_map_data.node_cpu_request_millicores | default(node_cpu_request_millicores | default({})) }}"

- name: Normalize pod security hardening findings
  ansible.builtin.set_fact:
    security_findings: "{{ (security_findings | default([])) + (pod_security_hardening_data.security_findings | default([])) }}"

- name: Normalize storage usage and literal sensitive string findings
  ansible.builtin.set_fact:
    security_findings: "{{ (security_findings | default([])) + (storage_and_sensitive_findings_data.security_findings | default([])) }}"
    workload_practice_findings: "{{ (workload_practice_findings | default([])) + (storage_and_sensitive_findings_data.workload_practice_findings | default([])) }}"
