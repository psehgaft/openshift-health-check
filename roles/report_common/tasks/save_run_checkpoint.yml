---
- name: Ensure run checkpoint directory exists
  ansible.builtin.file:
    path: "{{ report_resume_state_dir }}"
    state: directory
    mode: "0755"

- name: Ensure run workspace directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ report_run_workspace_dir }}"
    - "{{ report_run_workspace_shared_dir }}"
    - "{{ report_run_workspace_postures_dir }}"
    - "{{ report_run_workspace_capabilities_dir }}"
    - "{{ report_run_workspace_report_dir }}"

- name: Define run checkpoint paths
  ansible.builtin.set_fact:
    run_checkpoint_snapshot_path: "{{ report_resume_state_dir }}/{{ report_mode_resolved | default('live') }}-{{ run_checkpoint_stage }}.json"
  when: run_checkpoint_write_snapshot | default(true) | bool

- name: Write run checkpoint snapshot
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/write_stdin_to_file.py"
      - "{{ run_checkpoint_snapshot_path }}"
      - --mode
      - "0644"
    stdin: >-
      {{
        (
          run_checkpoint_snapshot_payload
          if (run_checkpoint_snapshot_payload is defined)
          else (
            vars
            | dict2items
            | rejectattr('key', 'match', '^(ansible_|hostvars|groups|group_names|inventory_|play_|playbook_dir|role_path|omit|environment$|vars$|lookup$|query$|q$|now$|undef$|run_checkpoint_|report_resume_)')
            | rejectattr('key', 'match', '.*_(cmd|raw|stat|probe|parse|manifest|result|results)$')
            | rejectattr('key', 'in', [
                'collection_commands',
                'collection_core_command_names',
                'collection_run_metadata',
                'collected_commands',
                'collected_command_status',
                'openshift_collection_commands',
                'openshift_collection_core_command_names',
                'openshift_collection_run_metadata',
                'openshift_collected_commands',
                'report_tool_detection_payload',
                'run_checkpoint_context_filtered'
              ])
            | items2dict
          )
          | to_nice_json
        )
      }}
  changed_when: false
  when: run_checkpoint_write_snapshot | default(true) | bool

- name: Update in-memory checkpoint pointers
  ansible.builtin.set_fact:
    report_resume_last_snapshot_path: "{{ run_checkpoint_snapshot_path if (run_checkpoint_write_snapshot | default(true) | bool) else (report_resume_last_snapshot_path | default('')) }}"
    report_resume_last_completed_stage: "{{ run_checkpoint_stage if (run_checkpoint_status | default('completed')) == 'completed' else (report_resume_last_completed_stage | default('')) }}"
    report_resume_last_resume_next_stage: "{{ run_checkpoint_resume_next_stage if (run_checkpoint_status | default('completed')) == 'completed' else (report_resume_last_resume_next_stage | default('')) }}"

- name: Write run checkpoint manifest
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/write_stdin_to_file.py"
      - "{{ report_resume_manifest_path }}"
      - --mode
      - "0644"
    stdin: >-
      {{
        {
          'schema_version': (report_artifact_schema_version | default('1')),
          'repo_contract_version': (report_repo_contract_version | default('openshift-artifact-workspace-v1')),
          'run_id': (report_run_id | default('')),
          'run_workspace_dir': (report_run_workspace_dir | default('')),
          'run_workspace_manifest_path': (report_run_workspace_manifest_path | default('')),
          'run_workspace_shared_dir': (report_run_workspace_shared_dir | default('')),
          'run_workspace_postures_dir': (report_run_workspace_postures_dir | default('')),
          'run_workspace_capabilities_dir': (report_run_workspace_capabilities_dir | default('')),
          'run_workspace_report_dir': (report_run_workspace_report_dir | default('')),
          'status': (run_checkpoint_status | default('completed')),
          'platform_family': (platform_family | default('unknown')),
          'report_mode': (report_mode_resolved | default('unknown')),
          'failed_stage': (run_checkpoint_stage if (run_checkpoint_status | default('completed')) == 'failed' else ''),
          'failed_task': (run_checkpoint_failed_task | default('')),
          'failed_message': (run_checkpoint_failed_message | default('')),
          'last_completed_stage': (report_resume_last_completed_stage | default('')),
          'resume_next_stage': (report_resume_last_resume_next_stage | default('')),
          'snapshot_path': (report_resume_last_snapshot_path | default('')),
          'updated_at': (ansible_date_time.iso8601 | default('')),
          'report_run_mode': (report_run_mode | default('fresh')),
          'selected_postures': (report_requested_postures | default([])),
          'selected_capabilities': (report_requested_capabilities | default([])),
          'effective_section_scope': (report_effective_section_scope | default({'postures': [], 'capabilities': []})),
          'resolved_dependency_tags': (report_scope_selected_dependency_tags | default([])),
          'resolved_shared_inputs_used': (report_scope_selected_shared_inputs_used | default([])),
          'artifact_counts': {
            'shared': ((report_workspace_completed_artifacts | default([]) | unique | select('match', '^shared/') | list | length) | int),
            'postures': ((report_workspace_completed_artifacts | default([]) | unique | select('match', '^postures/') | list | length) | int),
            'capabilities': ((report_workspace_completed_artifacts | default([]) | unique | select('match', '^capabilities/') | list | length) | int),
            'report': ((report_workspace_completed_artifacts | default([]) | unique | select('match', '^report/') | list | length) | int)
          },
          'completed_artifacts': (report_workspace_completed_artifacts | default([]) | unique | list),
          'failed_artifacts': (report_workspace_failed_artifacts | default([]))
        }
        | to_nice_json
      }}
  changed_when: false

- name: Write workspace run manifest
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/write_stdin_to_file.py"
      - "{{ report_run_workspace_manifest_path }}"
      - --mode
      - "0644"
    stdin: >-
      {{
        {
          'schema_version': (report_artifact_schema_version | default('1')),
          'repo_contract_version': (report_repo_contract_version | default('openshift-artifact-workspace-v1')),
          'run_id': (report_run_id | default('')),
          'run_workspace_dir': (report_run_workspace_dir | default('')),
          'run_workspace_manifest_path': (report_run_workspace_manifest_path | default('')),
          'run_workspace_shared_dir': (report_run_workspace_shared_dir | default('')),
          'run_workspace_postures_dir': (report_run_workspace_postures_dir | default('')),
          'run_workspace_capabilities_dir': (report_run_workspace_capabilities_dir | default('')),
          'run_workspace_report_dir': (report_run_workspace_report_dir | default('')),
          'status': (run_checkpoint_status | default('completed')),
          'platform_family': (platform_family | default('unknown')),
          'report_mode': (report_mode_resolved | default('unknown')),
          'failed_stage': (run_checkpoint_stage if (run_checkpoint_status | default('completed')) == 'failed' else ''),
          'failed_task': (run_checkpoint_failed_task | default('')),
          'failed_message': (run_checkpoint_failed_message | default('')),
          'last_completed_stage': (report_resume_last_completed_stage | default('')),
          'resume_next_stage': (report_resume_last_resume_next_stage | default('')),
          'snapshot_path': (report_resume_last_snapshot_path | default('')),
          'updated_at': (ansible_date_time.iso8601 | default('')),
          'report_run_mode': (report_run_mode | default('fresh')),
          'selected_postures': (report_requested_postures | default([])),
          'selected_capabilities': (report_requested_capabilities | default([])),
          'effective_section_scope': (report_effective_section_scope | default({'postures': [], 'capabilities': []})),
          'resolved_dependency_tags': (report_scope_selected_dependency_tags | default([])),
          'resolved_shared_inputs_used': (report_scope_selected_shared_inputs_used | default([])),
          'artifact_counts': {
            'shared': ((report_workspace_completed_artifacts | default([]) | unique | select('match', '^shared/') | list | length) | int),
            'postures': ((report_workspace_completed_artifacts | default([]) | unique | select('match', '^postures/') | list | length) | int),
            'capabilities': ((report_workspace_completed_artifacts | default([]) | unique | select('match', '^capabilities/') | list | length) | int),
            'report': ((report_workspace_completed_artifacts | default([]) | unique | select('match', '^report/') | list | length) | int)
          },
          'completed_artifacts': (report_workspace_completed_artifacts | default([]) | unique | list),
          'failed_artifacts': (report_workspace_failed_artifacts | default([]))
        }
        | to_nice_json
      }}
  changed_when: false

- name: Show checkpoint status
  vars:
    checkpoint_resume_playbook_name: "{{ 'openshift_cluster_health_report.yml' if (platform_family | default('kubernetes')) == 'openshift' else 'k8s_cluster_health_report.yml' }}"
  ansible.builtin.debug:
    msg:
      - "Checkpoint status: {{ run_checkpoint_status | default('completed') }}"
      - "Checkpoint stage: {{ run_checkpoint_stage }}"
      - "Resume next stage: {{ run_checkpoint_resume_next_stage | default('none') or 'none' }}"
      - "Failed task: {{ run_checkpoint_failed_task | default('none') or 'none' }}"
      - "Checkpoint manifest: {{ report_resume_manifest_path }}"
      - "Run workspace: {{ report_run_workspace_dir | default('not-configured') }}"
      - "Checkpoint snapshot: {{ report_resume_last_snapshot_path | default(run_checkpoint_snapshot_path | default('not-written')) }}"
      - "Resume command: ansible-playbook {{ playbook_dir }}/{{ checkpoint_resume_playbook_name }} -e report_run_mode=resume_last_failure"
