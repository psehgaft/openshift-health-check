---
- name: Build collected-state OpenShift report extras
  ansible.builtin.set_fact:
    openshift_report_payload_mode_extras:
      cluster_compare:
        data: "{{ cluster_compare_data | default({}) }}"
      inspect:
        data: "{{ inspect_data | default({}) }}"
      sosreport:
        data: "{{ sosreport_data | default({}) }}"
      advisor_export:
        data: "{{ advisor_export_data | default({}) }}"
      managed_gates:
        data: "{{ managed_gates_data | default({}) }}"
