---
- name: Build evidence coverage facts
  ansible.builtin.set_fact:
    evidence_coverage:
      cluster_configuration: >-
        {{
          'present'
          if ((must_gather_inventory | default({})).summary.has_cluster_scoped_resources | default(false))
          else ('partial' if (((inspect_data | default({})).summary.file_count | default(0) | int) > 0) else 'missing')
        }}
      namespaced_resources: >-
        {{
          'present'
          if ((must_gather_inventory | default({})).summary.has_namespaces_tree | default(false))
          else ('partial' if (((inspect_data | default({})).summary.namespace_count | default(0) | int) > 0) else 'missing')
        }}
      cluster_events: "{{ 'present' if (((must_gather_inventory | default({})).summary.event_file_count | default(0) | int) > 0) else ('partial' if (((inspect_data | default({})).summary.resource_markers.events | default(0) | int) > 0) else 'missing') }}"
      service_logs: "{{ 'partial' if (((must_gather_inventory | default({})).summary.log_file_count | default(0) | int) > 0) else ('partial' if (((inspect_data | default({})).summary.text_file_count | default(0) | int) > 0) else 'missing') }}"
      node_diagnostics: "{{ 'present' if (((sosreport_data | default({})).summary.count | default(0) | int) > 0) else 'missing' }}"
      inspect: "{{ 'present' if (((inspect_data | default({})).summary.file_count | default(0) | int) > 0) else 'missing' }}"
      advisor_data: "{{ 'present' if ((advisor_export_data | default({})).summary is defined) else 'missing' }}"
      control_plane_backup: missing
      cluster_compare: "{{ 'present' if ((cluster_compare_data | default({})).summary is defined) else 'missing' }}"
      managed_gates: "{{ 'present' if ((managed_gates_data | default({})).summary is defined) else 'missing' }}"
      insights_archive: "{{ 'present' if (((insights_archive_data | default({})).summary.present | default(false) | bool)) else 'missing' }}"

- name: Build evidence limitations
  ansible.builtin.set_fact:
    evidence_limitations: >-
      {{
        (evidence_limitations | default([]))
        + ([{'area': 'node diagnostics', 'detail': 'No sosreport or node-level archive input was provided.'}] if (evidence_coverage.node_diagnostics == 'missing') else [])
        + ([{'area': 'targeted inspect evidence', 'detail': 'No oc adm inspect directory was provided for partial targeted diagnostics.'}] if (evidence_coverage.inspect == 'missing') else [])
        + ([{'area': 'control-plane backup evidence', 'detail': 'No live etcd snapshot or static_kuberesources artifact collection was provided. This capability requires live cluster evidence from control plane nodes.'}] if (evidence_coverage.control_plane_backup == 'missing') else [])
        + ([{'area': 'reference compliance', 'detail': 'No cluster-compare output or baseline reference was provided.'}] if (evidence_coverage.cluster_compare == 'missing') else [])
        + ([{'area': 'managed-service gates', 'detail': 'No provider-managed gate export such as rosa list gates output was provided.'}] if (evidence_coverage.managed_gates == 'missing') else [])
        + ([{'area': 'advisor posture', 'detail': 'No Insights Advisor export or offline Advisor evidence was provided.'}] if (evidence_coverage.advisor_data == 'missing') else [])
        + ([{'area': 'insights archive', 'detail': 'No Insights archive directory was provided for collected-state support evidence.'}] if (evidence_coverage.insights_archive == 'missing') else [])
      }}
