- name: Detect pandoc
  ansible.builtin.shell: command -v pandoc
  register: pandoc_cmd
  changed_when: false
  failed_when: false

- name: Detect wkhtmltopdf
  ansible.builtin.shell: command -v wkhtmltopdf
  register: wkhtmltopdf_cmd
  changed_when: false
  failed_when: false

- name: Detect weasyprint
  ansible.builtin.shell: command -v weasyprint
  register: weasyprint_cmd
  changed_when: false
  failed_when: false

- name: Detect prince
  ansible.builtin.shell: command -v prince
  register: prince_cmd
  changed_when: false
  failed_when: false

- name: Detect tectonic
  ansible.builtin.shell: command -v tectonic
  register: tectonic_cmd
  changed_when: false
  failed_when: false

- name: Detect xelatex
  ansible.builtin.shell: command -v xelatex
  register: xelatex_cmd
  changed_when: false
  failed_when: false

- name: Detect lualatex
  ansible.builtin.shell: command -v lualatex
  register: lualatex_cmd
  changed_when: false
  failed_when: false

- name: Detect pdflatex
  ansible.builtin.shell: command -v pdflatex
  register: pdflatex_cmd
  changed_when: false
  failed_when: false

- name: Build report conversion capability facts
  ansible.builtin.set_fact:
    report_pandoc_available: "{{ pandoc_cmd.rc == 0 }}"
    report_pdf_engine: >-
      {{
        'wkhtmltopdf'
        if wkhtmltopdf_cmd.rc == 0
        else (
          'weasyprint'
          if weasyprint_cmd.rc == 0
          else (
            'prince'
            if prince_cmd.rc == 0
            else (
              'tectonic'
              if tectonic_cmd.rc == 0
              else (
                'xelatex'
                if xelatex_cmd.rc == 0
                else (
                  'lualatex'
                  if lualatex_cmd.rc == 0
                  else (
                    'pdflatex'
                    if pdflatex_cmd.rc == 0
                    else ''
                  )
                )
              )
            )
          )
        )
      }}

- name: Build PDF engine argument list
  ansible.builtin.set_fact:
    report_pdf_engine_argv: >-
      {{
        [
          '--pdf-engine-opt=--orientation',
          '--pdf-engine-opt=Landscape',
          '--pdf-engine-opt=--margin-top',
          '--pdf-engine-opt=10mm',
          '--pdf-engine-opt=--margin-right',
          '--pdf-engine-opt=10mm',
          '--pdf-engine-opt=--margin-bottom',
          '--pdf-engine-opt=10mm',
          '--pdf-engine-opt=--margin-left',
          '--pdf-engine-opt=10mm'
        ]
        if report_pdf_engine == 'wkhtmltopdf'
        else []
      }}

- name: Capture final report completion epoch
  ansible.builtin.set_fact:
    final_report_completion_epoch: "{{ now(utc=true, fmt='%s') | int }}"

- name: Format final report completion time
  ansible.builtin.set_fact:
    final_report_completion_iso: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(final_report_completion_epoch | int, utc=true) }}"

- name: Update final execution stats and audit payload before rendering artifacts
  ansible.builtin.set_fact:
    report_completed_at: "{{ final_report_completion_iso }}"
    execution_stats: "{{ execution_stats | combine({'completed_at': final_report_completion_iso, 'duration_seconds': ((final_report_completion_epoch | int) - (ansible_date_time.epoch | int)), 'duration_minutes': ((((final_report_completion_epoch | int) - (ansible_date_time.epoch | int)) | float) / 60.0) | round(1), 'report_formats_generated': {'markdown': true, 'json': true, 'html': false, 'pdf': false}}, recursive=True) }}"
    audit_report: "{{ audit_report | combine({'execution_stats': (execution_stats | combine({'completed_at': final_report_completion_iso, 'duration_seconds': ((final_report_completion_epoch | int) - (ansible_date_time.epoch | int)), 'duration_minutes': ((((final_report_completion_epoch | int) - (ansible_date_time.epoch | int)) | float) / 60.0) | round(1), 'report_formats_generated': {'markdown': true, 'json': true, 'html': false, 'pdf': false}}, recursive=True)), 'metadata': (audit_report.metadata | combine({'completed_at': final_report_completion_iso, 'local_user': execution_stats.local_user, 'local_hostname': execution_stats.local_hostname}, recursive=True))}, recursive=True) }}"

- name: Render final Markdown report
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/openshift_cluster_health_report.md.j2"
    dest: "{{ report_path }}"
    mode: "0644"

- name: Render final HTML report when pandoc is available
  ansible.builtin.command:
    argv:
      - pandoc
      - --standalone
      - --from
      - gfm
      - --to
      - html5
      - --css
      - "{{ report_css_path }}"
      - --output
      - "{{ report_html_path }}"
      - "{{ report_path }}"
  register: report_html_cmd
  changed_when: true
  failed_when: false
  when:
    - report_generate_html | bool
    - report_pandoc_available | bool

- name: Render final PDF report when a PDF engine is available
  ansible.builtin.command:
    argv: "{{ ['pandoc', '--from', 'gfm', '--css', report_css_path, '--pdf-engine=' ~ report_pdf_engine] + (report_pdf_engine_argv | default([])) + ['--output', report_pdf_path, report_path] }}"
  register: report_pdf_cmd
  changed_when: true
  failed_when: false
  when:
    - report_generate_pdf | bool
    - report_pandoc_available | bool
    - report_pdf_engine | length > 0

- name: Update generated format status
  ansible.builtin.set_fact:
    execution_stats: "{{ execution_stats | combine({'report_formats_generated': {'markdown': true, 'json': true, 'html': (report_html_cmd is defined and report_html_cmd.rc == 0), 'pdf': (report_pdf_cmd is defined and report_pdf_cmd.rc == 0)}}, recursive=True) }}"
    audit_report: "{{ audit_report | combine({'execution_stats': ((audit_report.execution_stats | default(execution_stats)) | combine({'report_formats_generated': {'markdown': true, 'json': true, 'html': (report_html_cmd is defined and report_html_cmd.rc == 0), 'pdf': (report_pdf_cmd is defined and report_pdf_cmd.rc == 0)}}, recursive=True))}, recursive=True) }}"

- name: Write final JSON report
  ansible.builtin.copy:
    dest: "{{ report_json_path }}"
    mode: "0644"
    content: "{{ audit_report | to_nice_json }}"

- name: Show report locations
  ansible.builtin.debug:
    msg:
      - "Health report generated: {{ report_path }}"
      - "JSON report generated: {{ report_json_path }}"
      - "HTML report generated: {{ report_html_path if (execution_stats.report_formats_generated.html | default(false)) else 'skipped' }}"
      - "PDF report generated: {{ report_pdf_path if (execution_stats.report_formats_generated.pdf | default(false)) else 'skipped' }}"
      - "Overall status: {{ health_summary.status }}"
      - "Audit score: {{ audit_score_total }}/{{ audit_score_max }}"
      - "Cluster health score: {{ cluster_health_score }}/100 ({{ cluster_health_score_label }})"
