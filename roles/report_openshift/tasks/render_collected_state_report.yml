---
- name: Define collected-state report paths
  ansible.builtin.set_fact:
    supportability_report_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

- name: Resolve reusable collected-state report artifact basenames for resume
  ansible.builtin.set_fact:
    report_resume_reusable_markdown_name: "{{ (report_resume_artifact_plan.report.markdown.path | default('') | basename) }}"
    report_resume_reusable_json_name: "{{ (report_resume_artifact_plan.report.json.path | default('') | basename) }}"
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Build collected-state report file paths
  ansible.builtin.set_fact:
    supportability_report_name: >-
      {{
        (report_resume_reusable_markdown_name | regex_replace('\\.md$', ''))
        if (
          (report_run_mode | default('fresh')) == 'resume_last_failure'
          and (((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false)) | bool)
        )
        else (report_basename ~ '-' ~ platform_family ~ '-' ~ supportability_report_timestamp)
      }}

- name: Finalize collected-state report output paths
  ansible.builtin.set_fact:
    supportability_report_md_path: "{{ report_output_dir }}/{{ supportability_report_name }}.md"
    supportability_report_json_path: "{{ report_output_dir }}/{{ supportability_report_name }}.json"

- name: Define collected-state report timestamps
  ansible.builtin.set_fact:
    report_generated_at: "{{ report_generated_at | default(ansible_date_time.iso8601) }}"
    report_completed_at: "{{ report_completed_at | default(ansible_date_time.iso8601) }}"

- name: Define collected-state cluster health report defaults
  vars:
    collected_health_status: "{{ health_summary.status | default('UNKNOWN') | string | upper }}"
    collected_supportability_summary: "{{ supportability_summary | default({}) }}"
    collected_cluster_health_score: >-
      {{
        25
        if collected_health_status in ['CRITICAL', 'BLOCKED', 'UNSUPPORTED-RISK']
        else (
          60
          if collected_health_status in ['WARNING', 'WARN', 'REVIEW-REQUIRED']
          else (
            80
            if collected_health_status in ['INFO', 'PARTIAL']
            else (
              100
              if collected_health_status in ['HEALTHY', 'READY', 'SUPPORTED', 'OK']
              else 0
            )
          )
        )
      }}
  ansible.builtin.set_fact:
    cluster_health_score: "{{ collected_cluster_health_score }}"
    cluster_health_score_label: >-
      {{
        'Excellent'
        if (collected_cluster_health_score | int) >= 95
        else (
          'Good'
          if (collected_cluster_health_score | int) >= 85
          else (
            'Fair'
            if (collected_cluster_health_score | int) >= 70
            else (
              'Poor'
              if (collected_cluster_health_score | int) >= 50
              else 'Critical'
            )
          )
        )
      }}
    cluster_health_score_legend:
      - min: 95
        max: 100
        label: Excellent
        meaning: Stable cluster with no material health risks detected.
      - min: 85
        max: 94.9
        label: Good
        meaning: Healthy overall with only limited warnings or hygiene issues.
      - min: 70
        max: 84.9
        label: Fair
        meaning: Noticeable operational debt or warning signals that should be scheduled for remediation.
      - min: 50
        max: 69.9
        label: Poor
        meaning: Multiple risks or degraded areas that require active remediation.
      - min: 0
        max: 49.9
        label: Critical
        meaning: Serious cluster health problems or blocking risks are present.
    report_collection_failures: "{{ report_collection_failures | default([]) }}"
    report_collection_skipped_optional_commands: "{{ report_collection_skipped_optional_commands | default([]) }}"
    report_collection_success_rate_pct: "{{ report_collection_success_rate_pct | default(0) }}"
    report_confidence: "{{ report_confidence | default(collected_supportability_summary.evidence_confidence | default('medium')) }}"
    report_confidence_detail: "{{ report_confidence_detail | default('collected-state report rendered from provided evidence artifacts') }}"
    suggested_next_steps: "{{ suggested_next_steps | default([]) }}"

- name: Ensure report output directory exists
  ansible.builtin.file:
    path: "{{ report_output_dir }}"
    state: directory
    mode: "0755"

- name: Check for reusable collected-state payload artifact
  ansible.builtin.stat:
    path: "{{ report_run_workspace_report_dir }}/payload.json"
  register: report_resume_payload_artifact_stat
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)
    - not ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Resolve collected-state payload artifact reuse eligibility
  ansible.builtin.set_fact:
    report_resume_payload_reuse_active: >-
      {{
        (report_run_mode | default('fresh')) == 'resume_last_failure'
        and (report_resume_payload_artifact_stat.stat.exists | default(false))
        and (((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true)) | bool)
        and not ((report_resume_artifact_plan | default({})).get('report', {}).get('invalidated', false) | bool)
      }}
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)
    - not ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Load reusable collected-state payload artifact
  ansible.builtin.include_role:
    name: report_common
    tasks_from: load_openshift_report_payload_artifact.yml
  when: report_resume_payload_reuse_active | default(false) | bool

- name: Build collected-state support table summaries
  ansible.builtin.include_role:
    name: report_common
    tasks_from: build_offline_openshift_support_tables.yml
  when: not (report_resume_payload_reuse_active | default(false) | bool)

- name: Load OpenShift shared artifacts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: load_openshift_shared_artifacts.yml
  when: not (report_resume_payload_reuse_active | default(false) | bool)

- name: Load OpenShift posture artifacts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: load_openshift_posture_artifacts.yml
  when: not (report_resume_payload_reuse_active | default(false) | bool)

- name: Load OpenShift capability artifacts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: load_openshift_capability_artifacts.yml
  when: not (report_resume_payload_reuse_active | default(false) | bool)

- name: Build shared OpenShift domain payload
  ansible.builtin.include_role:
    name: report_common
    tasks_from: build_openshift_domain_payload.yml
  when: not (report_resume_payload_reuse_active | default(false) | bool)

- name: Build shared OpenShift report payload
  ansible.builtin.include_role:
    name: report_common
    tasks_from: build_openshift_report_payload.yml
  when: not (report_resume_payload_reuse_active | default(false) | bool)

- name: Build collected-state OpenShift report extras
  ansible.builtin.include_role:
    name: report_common
    tasks_from: build_offline_openshift_report_extras.yml
  when: not (report_resume_payload_reuse_active | default(false) | bool)

- name: Build collected-state JSON payload
  ansible.builtin.set_fact:
    supportability_report_payload: "{{ openshift_report_payload_common | combine(openshift_report_payload_mode_extras | default({}), recursive=True) }}"
  when: not (report_resume_payload_reuse_active | default(false) | bool)

- name: Define collected-state report metadata compatibility facts
  vars:
    collected_metadata: "{{ supportability_report_payload.metadata | default({}) }}"
  ansible.builtin.set_fact:
    oc_context_cmd:
      stdout: "{{ collected_metadata.context | default('not-collected') }}"
    oc_server_cmd:
      stdout: "{{ collected_metadata.api_server | default('not-collected') }}"
    oc_user_cmd:
      stdout: "{{ collected_metadata.user | default('not-collected') }}"

- name: Write collected-state JSON report
  ansible.builtin.copy:
    dest: "{{ supportability_report_json_path }}"
    content: "{{ supportability_report_payload | to_nice_json }}"
    mode: "0644"
  when: ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)

- name: Persist assembled collected-state payload into run workspace
  ansible.builtin.copy:
    dest: "{{ report_run_workspace_report_dir }}/payload.json"
    content: "{{ supportability_report_payload | to_nice_json }}"
    mode: "0644"
  when: ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)

- name: Render collected-state Markdown report
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/openshift_cluster_health_report.md.j2"
    dest: "{{ supportability_report_md_path }}"
    mode: "0644"
  when: ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)

- name: Normalize unknown-state labels in collected-state Markdown report
  ansible.builtin.replace:
    path: "{{ supportability_report_md_path }}"
    regexp: "\\b(?:UNKONWN|UNKNWON|UNKNONW|UNKNOWN|Unknown|unknown)\\b"
    replace: "not-assessed"
  when: ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)

- name: Restore reusable collected-state Markdown report into output directory
  ansible.builtin.copy:
    src: "{{ report_run_workspace_report_dir }}/{{ report_resume_reusable_markdown_name }}"
    dest: "{{ supportability_report_md_path }}"
    mode: "0644"
    remote_src: true
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Restore reusable collected-state JSON report into output directory
  ansible.builtin.copy:
    src: "{{ report_run_workspace_report_dir }}/{{ report_resume_reusable_json_name }}"
    dest: "{{ supportability_report_json_path }}"
    mode: "0644"
    remote_src: true
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Persist collected-state Markdown report into run workspace
  ansible.builtin.copy:
    src: "{{ supportability_report_md_path }}"
    dest: "{{ report_run_workspace_report_dir }}/{{ supportability_report_md_path | basename }}"
    mode: "0644"
    remote_src: true
  when: ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)

- name: Persist collected-state JSON report into run workspace
  ansible.builtin.copy:
    src: "{{ supportability_report_json_path }}"
    dest: "{{ report_run_workspace_report_dir }}/{{ supportability_report_json_path | basename }}"
    mode: "0644"
    remote_src: true
  when: ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)

- name: Record collected-state report artifacts in workspace manifest tracking
  ansible.builtin.set_fact:
    report_workspace_completed_artifacts: >-
      {{
        (report_workspace_completed_artifacts | default([]))
        + ['report/' ~ (supportability_report_md_path | basename)]
        + ['report/' ~ (supportability_report_json_path | basename)]
        + ['report/payload.json']
      }}
  when: ((report_resume_artifact_plan | default({})).get('report', {}).get('should_build', true) | bool)
