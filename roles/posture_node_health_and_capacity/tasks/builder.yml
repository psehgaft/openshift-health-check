---
- name: Build node health and capacity posture artifact facts
  ansible.builtin.set_fact:
    posture_artifact_key: node_health_and_capacity
    posture_artifact_analysis_summary: "{{ node_health_capacity_summary | default({}) }}"
    posture_artifact_findings:
      diagnostics: "{{ (node_diagnostics_findings | default([])) | list }}"
      quota_pressure: "{{ quota_pressure_findings | default(top_quota_pressure_findings | default([])) }}"
      hotspots:
        high_pod_density_nodes: "{{ high_pod_density_nodes | default([]) }}"
        high_cpu_nodes: "{{ high_cpu_nodes | default([]) }}"
        high_memory_nodes: "{{ high_memory_nodes | default([]) }}"
        high_disk_nodes: "{{ high_disk_nodes | default([]) }}"
    posture_artifact_render_inputs:
      nodes: "{{ openshift_node_items | default([]) }}"
      machineconfigpools: "{{ assessment_mcp_summary | default(cluster_current_state.machineconfigpools | default([])) }}"
      quota_pressure_findings: "{{ quota_pressure_findings | default(top_quota_pressure_findings | default([])) }}"
      node_capacity_summary_by_density_desc: "{{ node_capacity_summary_by_density_desc | default([]) }}"
      node_capacity_summary_by_density_asc: "{{ node_capacity_summary_by_density_asc | default([]) }}"
      high_pod_density_nodes: "{{ high_pod_density_nodes | default([]) }}"
      high_cpu_nodes: "{{ high_cpu_nodes | default([]) }}"
      high_memory_nodes: "{{ high_memory_nodes | default([]) }}"
      high_disk_nodes: "{{ high_disk_nodes | default([]) }}"
    posture_artifact_collection_inputs:
      node_count: "{{ (openshift_node_items | default([])) | length }}"
      mcp_count: "{{ (assessment_mcp_summary | default(cluster_current_state.machineconfigpools | default([]))) | length }}"
      quota_pressure_count: "{{ (quota_pressure_findings | default(top_quota_pressure_findings | default([]))) | length }}"
      density_row_count: "{{ (node_capacity_summary_by_density_desc | default([])) | length }}"
    posture_artifact_section_fields:
      summary: "{{ node_health_capacity_summary | default({}) }}"
      recommendations: "{{ (node_health_capacity_summary | default({})).get('recommendation', 'Review node readiness, pressure, pod density, capacity hotspots, quota pressure, metric-backed utilization, and targeted node diagnostics before treating node capacity as healthy.') }}"
      diagnostics_summary: "{{ node_diagnostics_summary | default({}) }}"
      diagnostics_findings: "{{ (node_diagnostics_findings | default([])) | list }}"
      nodes: "{{ openshift_node_items | default([]) }}"
      machineconfigpools: "{{ assessment_mcp_summary | default(cluster_current_state.machineconfigpools | default([])) }}"
      quota_pressure_findings: "{{ quota_pressure_findings | default(top_quota_pressure_findings | default([])) }}"
      node_capacity_summary_by_density_desc: "{{ node_capacity_summary_by_density_desc | default([]) }}"
      node_capacity_summary_by_density_asc: "{{ node_capacity_summary_by_density_asc | default([]) }}"
      high_pod_density_nodes: "{{ high_pod_density_nodes | default([]) }}"
      high_cpu_nodes: "{{ high_cpu_nodes | default([]) }}"
      high_memory_nodes: "{{ high_memory_nodes | default([]) }}"
      high_disk_nodes: "{{ high_disk_nodes | default([]) }}"
