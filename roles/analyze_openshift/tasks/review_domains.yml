---
- name: Build APIService availability findings
  ansible.builtin.set_fact:
    apiservice_issues: "{{ apiservice_issues | default([]) + apiservice_issue_entry }}"
  loop: "{{ (analysis_graph.apiservices | default({})).get('items', []) }}"
  vars:
    available_condition: "{{ (item.status.conditions | default([]) | selectattr('type', 'equalto', 'Available') | list | first) | default({}) }}"
    service_ref: "{{ ((item.spec.service.namespace | default('')) ~ '/' ~ (item.spec.service.name | default(''))) if (item.spec.service is defined) else 'Local' }}"
    apiservice_issue_entry: >-
      {{
        [{
          'name': item.metadata.name | default('unknown'),
          'service': service_ref,
          'available': available_condition.status | default('Unknown'),
          'reason': available_condition.reason | default('unknown'),
          'detail': available_condition.message | default(available_condition.reason | default('APIService is not reporting Available=True'))
        }]
        if ((available_condition.status | default('Unknown')) != 'True')
        else []
      }}
  changed_when: false

- name: Build secret type counts
  ansible.builtin.set_fact:
    secret_type_counts: "{{ secret_type_counts | default({}) | combine({secret_type: (((secret_type_counts | default({}))[secret_type] | default(0)) + 1)}, recursive=True) }}"
  loop: "{{ (analysis_graph.secrets | default({})).get('items', []) }}"
  vars:
    secret_type: "{{ item.type | default('unknown') }}"
  changed_when: false

- name: Build BuildConfig strategy counts
  ansible.builtin.set_fact:
    buildconfig_strategy_counts: "{{ buildconfig_strategy_counts | default({}) | combine({strategy_name: (((buildconfig_strategy_counts | default({}))[strategy_name] | default(0)) + 1)}, recursive=True) }}"
    buildconfigs_without_triggers: "{{ buildconfigs_without_triggers | default([]) + triggerless_entry }}"
  loop: "{{ (analysis_graph.buildconfigs | default({})).get('items', []) }}"
  vars:
    strategy_name: >-
      {{
        'Source'
        if (item.spec.strategy.sourceStrategy is defined)
        else (
          'Docker'
          if (item.spec.strategy.dockerStrategy is defined)
          else (
            'Custom'
            if (item.spec.strategy.customStrategy is defined)
            else (
              'JenkinsPipeline'
              if (item.spec.strategy.jenkinsPipelineStrategy is defined)
              else 'Unknown'
            )
          )
        )
      }}
    triggerless_entry: >-
      {{
        [{
          'namespace': item.metadata.namespace | default(''),
          'name': item.metadata.name | default(''),
          'strategy': strategy_name
        }]
        if ((item.spec.triggers | default([]) | length) == 0)
        else []
      }}
  changed_when: false

- name: Build PipelineRun status summary
  ansible.builtin.set_fact:
    pipelinerun_status_counts: "{{ pipelinerun_status_counts | default({}) | combine({pipelinerun_status: (((pipelinerun_status_counts | default({}))[pipelinerun_status] | default(0)) + 1)}, recursive=True) }}"
    failed_pipelineruns: "{{ failed_pipelineruns | default([]) + failed_pipelinerun_entry }}"
  loop: "{{ (analysis_graph.pipelineruns | default({})).get('items', []) }}"
  vars:
    succeeded_condition: "{{ (item.status.conditions | default([]) | selectattr('type', 'equalto', 'Succeeded') | list | first) | default({}) }}"
    pipelinerun_status: >-
      {{
        'Succeeded'
        if (succeeded_condition.status | default('')) == 'True'
        else (
          'Failed'
          if (succeeded_condition.status | default('')) == 'False'
          else (
            'Running'
            if (succeeded_condition.status | default('')) == 'Unknown'
            else (item.status.phase | default('Unknown'))
          )
        )
      }}
    failed_pipelinerun_entry: >-
      {{
        [{
          'namespace': item.metadata.namespace | default(''),
          'name': item.metadata.name | default(''),
          'pipeline': ((item.metadata.labels | default({})).get('tekton.dev/pipeline', 'unknown')),
          'status': pipelinerun_status,
          'reason': succeeded_condition.reason | default(item.status.reason | default('unknown')),
          'started_at': item.status.startTime | default('unknown'),
          'completed_at': item.status.completionTime | default('in-progress')
        }]
        if (pipelinerun_status == 'Failed')
        else []
      }}
  changed_when: false

- name: Build ComplianceSuite summary
  ansible.builtin.set_fact:
    compliance_result_counts: "{{ compliance_result_counts | default({}) | combine({suite_result: (((compliance_result_counts | default({}))[suite_result] | default(0)) + 1)}, recursive=True) }}"
    compliance_suite_findings: "{{ compliance_suite_findings | default([]) + compliance_suite_finding_entry }}"
    compliance_suite_summary: "{{ compliance_suite_summary | default([]) + [compliance_suite_summary_entry] }}"
  loop: "{{ (analysis_graph.compliancesuites | default({})).get('items', []) }}"
  vars:
    suite_phase: "{{ item.status.phase | default('Unknown') }}"
    suite_result: "{{ item.status.result | default(suite_phase) }}"
    compliance_suite_summary_entry:
      namespace: "{{ item.metadata.namespace | default('') }}"
      name: "{{ item.metadata.name | default('') }}"
      phase: "{{ suite_phase }}"
      result: "{{ suite_result }}"
    compliance_suite_finding_entry: >-
      {{
        [compliance_suite_summary_entry]
        if (
          suite_result not in ['COMPLIANT', 'NOT-APPLICABLE', 'PASS']
          or suite_phase not in ['DONE', 'COMPLIANT', 'NOT-APPLICABLE']
        ) else []
      }}
  changed_when: false

- name: Build compliance program posture summary
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import re

    data = json.loads(r'''{{ {
      "namespaces": (analysis_graph.namespaces | default({})).get('items', []),
      "compliancesuites": (analysis_graph.compliancesuites | default({})).get('items', []),
      "compliancescans": (analysis_graph.compliancescans | default({})).get('items', []),
      "scansettings": (analysis_graph.scansettings | default({})).get('items', []),
      "scansettingbindings": (analysis_graph.scansettingbindings | default({})).get('items', []),
      "tailoredprofiles": (analysis_graph.tailoredprofiles | default({})).get('items', []),
      "profiles": (analysis_graph.profiles | default({})).get('items', []),
      "profilebundles": (analysis_graph.profilebundles | default({})).get('items', []),
      "compliancecheckresults": (analysis_graph.compliancecheckresults | default({})).get('items', []),
      "sosreport_reports": (
        (live_support_data.parsed.sosreport.reports | default([]))
        if (live_support_data is defined and live_support_data.parsed is defined)
        else (sosreport_data.reports | default([]))
      )
    } | to_json }}''')

    standards = [
        ("FIPS", [r"\bfips\b"]),
        ("FedRAMP", [r"\bfedramp\b"]),
        ("HIPAA", [r"\bhipaa\b"]),
        ("PCI-DSS", [r"\bpci(?:[-_ ]?dss)?\b"]),
        ("SOC", [r"\bsoc[-_ ]?[123]\b", r"\bservice organization control\b"]),
        ("SOX", [r"\bsox\b"]),
        ("NIST", [r"\bnist\b"]),
        ("CIS", [r"\bcis\b"]),
    ]

    def gather_strings(obj):
        if isinstance(obj, dict):
            strings = []
            for key, value in obj.items():
                if key in {"metadata", "spec", "title", "description", "id"}:
                    strings.extend(gather_strings(value))
            return strings
        if isinstance(obj, list):
            strings = []
            for item in obj:
                strings.extend(gather_strings(item))
            return strings
        if isinstance(obj, str):
            return [obj]
        return []

    def resource_matches(item, regexes):
        haystack = " ".join(gather_strings(item)).lower()
        return any(re.search(pattern, haystack) for pattern in regexes)

    def metadata_name(item):
        return str(((item.get("metadata") or {}).get("name") or ""))

    def binding_profile_refs(binding):
        refs = []
        for profile in ((binding.get("profiles") or []) or []):
            if isinstance(profile, dict):
                refs.append(str(profile.get("name") or ""))
        return [item for item in refs if item]

    def scan_profile_refs(scan):
        spec = scan.get("spec") or {}
        refs = []
        for key in ("profile", "profileRef", "tailoredProfile"):
            value = spec.get(key)
            if isinstance(value, str) and value:
                refs.append(value)
            elif isinstance(value, dict):
                name = str(value.get("name") or "")
                if name:
                    refs.append(name)
        return refs

    def scan_result(scan):
        status = scan.get("status") or {}
        return str(status.get("result") or status.get("phase") or "Unknown")

    def scan_phase(scan):
        status = scan.get("status") or {}
        return str(status.get("phase") or "Unknown")

    def check_result(item):
        status = item.get("status") or {}
        labels = (item.get("metadata") or {}).get("labels") or {}
        return str(
            status.get("result")
            or status.get("status")
            or labels.get("compliance.openshift.io/check-status")
            or item.get("result")
            or "Unknown"
        )

    suites = data.get("compliancesuites") or []
    scans = data.get("compliancescans") or []
    scan_settings = data.get("scansettings") or []
    scan_setting_bindings = data.get("scansettingbindings") or []
    tailored_profiles = data.get("tailoredprofiles") or []
    profiles = data.get("profiles") or []
    profile_bundles = data.get("profilebundles") or []
    check_results = data.get("compliancecheckresults") or []
    sosreport_reports = data.get("sosreport_reports") or []
    fips_enabled_nodes = sum(1 for item in sosreport_reports if str(item.get("fips_enabled_status") or "") == "enabled")
    fips_disabled_nodes = sum(1 for item in sosreport_reports if str(item.get("fips_enabled_status") or "") == "disabled")
    fips_crypto_policy_nodes = sum(1 for item in sosreport_reports if "FIPS" in str(item.get("crypto_policy") or "").upper())
    fips_runtime_evidence_count = fips_enabled_nodes + fips_disabled_nodes
    namespace_names = {(item.get("metadata") or {}).get("name", "") for item in (data.get("namespaces") or [])}

    operator_present = bool(
        suites or scans or scan_settings or scan_setting_bindings or tailored_profiles or profiles or profile_bundles
        or ("openshift-compliance" in namespace_names)
    )

    valid_profilebundle_count = 0
    invalid_profilebundle_count = 0
    profilebundle_summary = []
    for item in profile_bundles:
        status = item.get("status") or {}
        ds_status = str(status.get("dataStreamStatus") or "Unknown")
        profilebundle_summary.append({
            "namespace": ((item.get("metadata") or {}).get("namespace") or ""),
            "name": ((item.get("metadata") or {}).get("name") or ""),
            "data_stream_status": ds_status,
        })
        if ds_status == "VALID":
            valid_profilebundle_count += 1
        else:
            invalid_profilebundle_count += 1

    failing_scan_count = 0
    scan_summary = []
    for item in scans:
        result = scan_result(item)
        phase = scan_phase(item)
        if result not in {"COMPLIANT", "NOT-APPLICABLE", "PASS"} or phase not in {"DONE", "COMPLIANT", "NOT-APPLICABLE"}:
            failing_scan_count += 1
        scan_summary.append({
            "namespace": ((item.get("metadata") or {}).get("namespace") or ""),
            "name": ((item.get("metadata") or {}).get("name") or ""),
            "phase": phase,
            "result": result,
        })

    check_fail_count = 0
    for item in check_results:
        result = check_result(item)
        if result not in {"PASS", "COMPLIANT", "NOT-APPLICABLE", "INFO"}:
            check_fail_count += 1

    standards_summary = []
    standards_findings = []

    for standard_name, regexes in standards:
        matched_profiles = [item for item in profiles if resource_matches(item, regexes)]
        matched_tailored = [item for item in tailored_profiles if resource_matches(item, regexes)]
        standard_profile_names = {metadata_name(item) for item in matched_profiles + matched_tailored if metadata_name(item)}
        standard_profile_refs_lower = {item.lower() for item in standard_profile_names}
        matched_bindings = [
            item for item in scan_setting_bindings
            if (
                any(ref in standard_profile_names for ref in binding_profile_refs(item))
                or any(ref.lower() in standard_profile_refs_lower for ref in binding_profile_refs(item))
            )
        ]
        matched_binding_names = {metadata_name(item) for item in matched_bindings if metadata_name(item)}
        matched_suites = [
            item for item in suites
            if metadata_name(item) in matched_binding_names
        ]
        matched_suite_names = {metadata_name(item) for item in matched_suites if metadata_name(item)}
        matched_scans = []
        for item in scans:
            labels = (item.get("metadata") or {}).get("labels") or {}
            owner_refs = item.get("metadata", {}).get("ownerReferences") or []
            owner_names = {str(ref.get("name") or "") for ref in owner_refs if isinstance(ref, dict)}
            scan_name = metadata_name(item)
            if (
                any(ref in standard_profile_names for ref in scan_profile_refs(item))
                or any(ref.lower() in standard_profile_refs_lower for ref in scan_profile_refs(item))
                or any(name in matched_suite_names for name in owner_names)
                or str(labels.get("compliance.openshift.io/suite") or "") in matched_suite_names
                or any(binding_name and binding_name in scan_name for binding_name in matched_binding_names)
            ):
                matched_scans.append(item)
        matched_scan_names = {metadata_name(item) for item in matched_scans if metadata_name(item)}
        matched_checks = []
        for item in check_results:
            labels = (item.get("metadata") or {}).get("labels") or {}
            if (
                str(labels.get("compliance.openshift.io/scan-name") or "") in matched_scan_names
                or str(labels.get("compliance.openshift.io/suite") or "") in matched_suite_names
            ):
                matched_checks.append(item)

        matched_settings = [
            item for item in scan_settings
            if metadata_name(item) in {str((binding.get("settingsRef") or {}).get("name") or "") for binding in matched_bindings}
        ]
        content_present = bool(matched_profiles or matched_tailored)
        configured = bool(matched_bindings or matched_suites or matched_scans)
        active_enabled = bool(matched_bindings or matched_suites or matched_scans)
        standard_failing_scans = [
            item for item in matched_scans
            if scan_result(item) not in {"COMPLIANT", "NOT-APPLICABLE", "PASS"}
            or scan_phase(item) not in {"DONE", "COMPLIANT", "NOT-APPLICABLE"}
        ]
        standard_failed_checks = [
            item for item in matched_checks
            if check_result(item) not in {"PASS", "COMPLIANT", "NOT-APPLICABLE", "INFO"}
        ]

        runtime_status = "not-applicable"
        if standard_name == "FIPS":
            configured = fips_runtime_evidence_count > 0
            active_enabled = False
            if fips_enabled_nodes > 0 and fips_disabled_nodes == 0:
                runtime_status = "enabled"
            elif fips_disabled_nodes > 0 and fips_enabled_nodes == 0:
                runtime_status = "not-enabled"
            elif fips_enabled_nodes > 0 and fips_disabled_nodes > 0:
                runtime_status = "mixed"
            elif fips_crypto_policy_nodes > 0:
                runtime_status = "crypto-policy-fips"
            else:
                runtime_status = "unknown"
        if standard_name == "FIPS" and runtime_status == "enabled":
            verdict = "supported"
        elif standard_name == "FIPS" and runtime_status == "crypto-policy-fips":
            verdict = "partial-evidence"
        elif standard_name == "FIPS" and runtime_status in {"not-enabled", "mixed"}:
            verdict = "review-required"
        elif standard_name == "FIPS" and content_present and not configured:
            verdict = "content-available"
        elif standard_name == "FIPS":
            verdict = "not-configured"
        elif active_enabled and (standard_failing_scans or standard_failed_checks):
            verdict = "review-required"
        elif active_enabled:
            verdict = "supported"
        elif configured:
            verdict = "configured-no-scan"
        elif content_present:
            verdict = "content-available"
        elif standard_failing_scans or standard_failed_checks:
            verdict = "review-required"
        else:
            verdict = "not-configured"

        standards_summary.append({
            "standard": standard_name,
            "content_present": content_present,
            "configured": configured,
            "active_enabled": active_enabled,
            "profile_count": len(matched_profiles),
            "tailored_profile_count": len(matched_tailored),
            "scan_setting_count": len(matched_settings),
            "scan_setting_binding_count": len(matched_bindings),
            "profilebundle_count": 0,
            "suite_count": len(matched_suites),
            "scan_count": len(matched_scans),
            "failing_scan_count": len(standard_failing_scans),
            "failed_check_count": len(standard_failed_checks),
            "runtime_status": runtime_status,
            "runtime_evidence_count": fips_runtime_evidence_count if standard_name == "FIPS" else 0,
            "verdict": verdict,
            "detail": (
                (
                    f"runtime FIPS evidence: enabled_nodes={fips_enabled_nodes}, disabled_nodes={fips_disabled_nodes}, crypto_policy_fips_nodes={fips_crypto_policy_nodes}"
                    if standard_name == "FIPS" and configured
                    else (
                        "FIPS compliance content is present, but runtime node FIPS evidence was not collected"
                        if standard_name == "FIPS" and content_present
                        else (
                            "no runtime node FIPS evidence was collected"
                            if standard_name == "FIPS"
                            else ""
                        )
                    )
                )
                if standard_name == "FIPS"
                else
                (
                    "configured from Compliance Operator resources"
                    if configured
                    else (
                        "matching Compliance Operator content is present but not bound into current scans"
                        if content_present else
                        "no matching Compliance Operator standard configuration detected"
                    )
                )
            ),
        })

        if configured and verdict == "configured-no-scan":
            standards_findings.append({
                "severity": "warning",
                "area": "compliance",
                "standard": standard_name,
                "detail": f"{standard_name} configuration was detected, but no ComplianceSuite or ComplianceScan evidence was found."
            })
        if content_present and not configured:
            standards_findings.append({
                "severity": "info",
                "area": "compliance",
                "standard": standard_name,
                "detail": f"{standard_name} compliance content is available, but no current binding, suite, or scan evidence shows it is configured."
            })
        if len(standard_failing_scans) > 0:
            standards_findings.append({
                "severity": "warning",
                "area": "compliance",
                "standard": standard_name,
                "detail": f"{standard_name} has failing or incomplete compliance scans: {len(standard_failing_scans)}."
            })
        if len(standard_failed_checks) > 0:
            standards_findings.append({
                "severity": "warning",
                "area": "compliance",
                "standard": standard_name,
                "detail": f"{standard_name} has failed compliance checks: {len(standard_failed_checks)}."
            })
        if standard_name == "FIPS":
            if runtime_status == "unknown":
                standards_findings.append({
                    "severity": "info",
                    "area": "compliance",
                    "standard": standard_name,
                    "detail": "FIPS is an install-time cluster setting. Runtime FIPS mode remains unknown because no explicit node evidence was collected from sosreport or equivalent node diagnostics."
                })
            elif runtime_status == "crypto-policy-fips":
                standards_findings.append({
                    "severity": "info",
                    "area": "compliance",
                    "standard": standard_name,
                    "detail": "FIPS crypto policy was detected, but /proc/sys/crypto/fips_enabled evidence was not collected to confirm runtime FIPS mode."
                })
            elif runtime_status in {"not-enabled", "mixed"}:
                standards_findings.append({
                    "severity": "warning",
                    "area": "compliance",
                    "standard": standard_name,
                    "detail": f"FIPS is expected to be enabled at installation time, but runtime node evidence is {runtime_status}."
                })

    if not operator_present:
        operator_verdict = "not-installed"
    elif invalid_profilebundle_count > 0 or failing_scan_count > 0 or check_fail_count > 0:
        operator_verdict = "review-required"
    elif suites or scans:
        operator_verdict = "supported"
    else:
        operator_verdict = "configured-no-scan"

    findings = []
    if operator_present and invalid_profilebundle_count > 0:
        findings.append({"severity": "warning", "area": "compliance", "detail": f"Compliance Operator profile bundles not reporting VALID: {invalid_profilebundle_count}."})
    if operator_present and failing_scan_count > 0:
        findings.append({"severity": "warning", "area": "compliance", "detail": f"Compliance Operator scans failing or incomplete: {failing_scan_count}."})
    if operator_present and check_fail_count > 0:
        findings.append({"severity": "warning", "area": "compliance", "detail": f"Compliance check results not passing: {check_fail_count}."})
    findings.extend(standards_findings)

    print(json.dumps({
        "operator_summary": {
            "present": operator_present,
            "namespace_present": "openshift-compliance" in namespace_names,
            "suite_count": len(suites),
            "scan_count": len(scans),
            "scan_setting_count": len(scan_settings),
            "scan_setting_binding_count": len(scan_setting_bindings),
            "profile_count": len(profiles),
            "tailored_profile_count": len(tailored_profiles),
            "profilebundle_count": len(profile_bundles),
            "valid_profilebundle_count": valid_profilebundle_count,
            "invalid_profilebundle_count": invalid_profilebundle_count,
            "failing_scan_count": failing_scan_count,
            "failed_check_count": check_fail_count,
            "standards_configured_count": len([item for item in standards_summary if item["configured"]]),
            "fips_runtime_status": next((item["runtime_status"] for item in standards_summary if item["standard"] == "FIPS"), "unknown"),
            "fips_enabled_node_count": fips_enabled_nodes,
            "fips_disabled_node_count": fips_disabled_nodes,
            "verdict": operator_verdict,
            "profilebundle_summary": profilebundle_summary,
            "scan_summary": scan_summary[:20],
        },
        "standards_summary": standards_summary,
        "findings": findings,
    }))
    PY
  register: compliance_program_summary_cmd
  changed_when: false
  failed_when: false

- name: Normalize compliance program posture summary
  vars:
    compliance_program_summary_payload: >-
      {{
        compliance_program_summary_cmd.stdout | from_json
        if (compliance_program_summary_cmd.rc == 0 and (compliance_program_summary_cmd.stdout | default('') | length > 0))
        else {
          'operator_summary': {
            'present': false,
            'namespace_present': false,
            'suite_count': 0,
            'scan_count': 0,
            'scan_setting_count': 0,
            'scan_setting_binding_count': 0,
            'profile_count': 0,
            'tailored_profile_count': 0,
            'profilebundle_count': 0,
            'valid_profilebundle_count': 0,
            'invalid_profilebundle_count': 0,
            'failing_scan_count': 0,
            'failed_check_count': 0,
            'standards_configured_count': 0,
            'verdict': 'unknown',
            'profilebundle_summary': [],
            'scan_summary': []
          },
          'standards_summary': [],
          'findings': []
        }
      }}
  ansible.builtin.set_fact:
    compliance_operator_summary: "{{ compliance_program_summary_payload.operator_summary }}"
    compliance_standards_summary: "{{ compliance_program_summary_payload.standards_summary }}"
    compliance_standards_findings: "{{ compliance_program_summary_payload.findings }}"

- name: Build DataProtectionApplication summary
  ansible.builtin.set_fact:
    dataprotectionapplication_summary: "{{ dataprotectionapplication_summary | default([]) + [dpa_summary_entry] }}"
  loop: "{{ (analysis_graph.dataprotectionapplications | default({})).get('items', []) }}"
  vars:
    reconciled_condition: "{{ (item.status.conditions | default([]) | selectattr('type', 'equalto', 'Reconciled') | list | first) | default({}) }}"
    dpa_summary_entry:
      namespace: "{{ item.metadata.namespace | default('') }}"
      name: "{{ item.metadata.name | default('') }}"
      phase: "{{ item.status.phase | default('Unknown') }}"
      reconciled: "{{ reconciled_condition.status | default('Unknown') }}"
      reason: "{{ reconciled_condition.reason | default('unknown') }}"
  changed_when: false

- name: Build backup posture summary
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    from datetime import datetime, timezone, timedelta

    data = json.loads(r'''{{ {
      "dataprotectionapplications": (analysis_graph.dataprotectionapplications | default({})).get('items', []),
      "backupstoragelocations": (analysis_graph.backupstoragelocations | default({})).get('items', []),
      "schedules": (analysis_graph.schedules | default({})).get('items', []),
      "backups": (analysis_graph.backups | default({})).get('items', []),
      "restores": (analysis_graph.restores | default({})).get('items', [])
    } | to_json }}''')

    def parse_time(value):
        text = str(value or "").strip()
        if not text:
            return None
        try:
            return datetime.fromisoformat(text.replace("Z", "+00:00"))
        except Exception:
            return None

    def bsl_available(item):
        for condition in ((item.get("status") or {}).get("conditions") or []):
            if condition.get("type") == "Available":
                return str(condition.get("status") or "Unknown")
        return "Unknown"

    dpas = data.get("dataprotectionapplications", []) or []
    bsl_items = data.get("backupstoragelocations", []) or []
    schedule_items = data.get("schedules", []) or []
    backup_items = data.get("backups", []) or []
    restore_items = data.get("restores", []) or []

    backup_storage_location_summary = []
    for item in bsl_items:
        meta = item.get("metadata", {}) or {}
        spec = item.get("spec", {}) or {}
        backup_storage_location_summary.append({
            "namespace": meta.get("namespace", ""),
            "name": meta.get("name", ""),
            "provider": spec.get("provider", "unknown"),
            "default": bool((meta.get("labels") or {}).get("velero.io/default-backup-storage-location") == "true"),
            "available": bsl_available(item),
            "bucket": ((spec.get("objectStorage") or {}).get("bucket") or spec.get("bucket") or ""),
            "prefix": ((spec.get("objectStorage") or {}).get("prefix") or ""),
        })

    backup_schedule_summary = []
    paused_schedules = []
    for item in schedule_items:
        meta = item.get("metadata", {}) or {}
        spec = item.get("spec", {}) or {}
        status = item.get("status", {}) or {}
        paused = bool(spec.get("paused", False))
        if paused:
            paused_schedules.append(f"{meta.get('namespace', '')}/{meta.get('name', '')}")
        backup_schedule_summary.append({
            "namespace": meta.get("namespace", ""),
            "name": meta.get("name", ""),
            "paused": paused,
            "schedule": spec.get("schedule", ""),
            "last_backup": status.get("lastBackup", ""),
            "storage_location": ((spec.get("template") or {}).get("storageLocation") or ""),
        })

    successful_backups = []
    clean_successful_backups = []
    backup_summary = []
    for item in backup_items:
        meta = item.get("metadata", {}) or {}
        spec = item.get("spec", {}) or {}
        status = item.get("status", {}) or {}
        phase = str(status.get("phase") or "Unknown")
        completion = status.get("completionTimestamp") or meta.get("creationTimestamp") or ""
        backup_summary.append({
            "namespace": meta.get("namespace", ""),
            "name": meta.get("name", ""),
            "phase": phase,
            "storage_location": spec.get("storageLocation", ""),
            "completion_timestamp": completion,
            "warnings": int(status.get("warnings", 0) or 0),
            "errors": int(status.get("errors", 0) or 0),
        })
        if phase == "Completed":
            successful_backups.append(parse_time(completion))
            if int(status.get("warnings", 0) or 0) == 0 and int(status.get("errors", 0) or 0) == 0:
                clean_successful_backups.append(parse_time(completion))

    completed_restores = []
    clean_completed_restores = []
    restore_summary = []
    for item in restore_items:
        meta = item.get("metadata", {}) or {}
        spec = item.get("spec", {}) or {}
        status = item.get("status", {}) or {}
        phase = str(status.get("phase") or "Unknown")
        completion = status.get("completionTimestamp") or meta.get("creationTimestamp") or ""
        restore_summary.append({
            "namespace": meta.get("namespace", ""),
            "name": meta.get("name", ""),
            "phase": phase,
            "backup_name": spec.get("backupName", ""),
            "completion_timestamp": completion,
            "warnings": int(status.get("warnings", 0) or 0),
            "errors": int(status.get("errors", 0) or 0),
        })
        if phase == "Completed":
            completed_restores.append(parse_time(completion))
            if int(status.get("warnings", 0) or 0) == 0 and int(status.get("errors", 0) or 0) == 0:
                clean_completed_restores.append(parse_time(completion))

    findings = []
    if dpas or bsl_items or schedule_items or backup_items or restore_items:
        if not bsl_items:
            findings.append({"issue": "backup-storage-location-missing", "detail": "no BackupStorageLocation resource was found"})
        elif not any(item["available"] == "True" for item in backup_storage_location_summary):
            findings.append({"issue": "backup-storage-location-unavailable", "detail": "no BackupStorageLocation reported Available=True"})

        if not schedule_items:
            findings.append({"issue": "backup-schedule-missing", "detail": "no Velero Schedule resource was found"})
        elif paused_schedules:
            findings.append({"issue": "backup-schedule-paused", "detail": ", ".join(paused_schedules[:10])})

        successful_count = len([item for item in successful_backups if item is not None])
        clean_successful_count = len([item for item in clean_successful_backups if item is not None])
        if successful_count == 0:
            findings.append({"issue": "successful-backup-missing", "detail": "no Velero Backup resource reported phase=Completed"})
        elif clean_successful_count == 0:
            findings.append({"issue": "successful-backup-has-warnings-or-errors", "detail": "completed backups were found, but all recent completed backups reported warnings or errors"})
        else:
            latest_success = max(item for item in clean_successful_backups if item is not None)
            if latest_success < datetime.now(timezone.utc) - timedelta(days=7):
                findings.append({"issue": "successful-backup-stale", "detail": latest_success.isoformat()})

        completed_restore_count = len([item for item in completed_restores if item is not None])
        clean_completed_restore_count = len([item for item in clean_completed_restores if item is not None])
        if completed_restore_count == 0:
            findings.append({"issue": "restore-evidence-not-demonstrated", "detail": "no Velero Restore resource reported phase=Completed"})
        elif clean_completed_restore_count == 0:
            findings.append({"issue": "restore-evidence-has-warnings-or-errors", "detail": "completed restores were found, but all reported warnings or errors"})
    else:
        findings.append({
            "issue": "backup-tooling-not-detected",
            "detail": "no DataProtectionApplication, BackupStorageLocation, Schedule, Backup, or Restore resources were found"
        })

    print(json.dumps({
        "backup_storage_location_summary": sorted(backup_storage_location_summary, key=lambda item: (item["namespace"], item["name"])),
        "backup_schedule_summary": sorted(backup_schedule_summary, key=lambda item: (item["namespace"], item["name"])),
        "backup_summary": sorted(backup_summary, key=lambda item: (item["completion_timestamp"], item["namespace"], item["name"]), reverse=True)[:15],
        "restore_summary": sorted(restore_summary, key=lambda item: (item["completion_timestamp"], item["namespace"], item["name"]), reverse=True)[:15],
        "backup_posture_findings": findings,
        "successful_backup_count": len([item for item in successful_backups if item is not None]),
        "clean_successful_backup_count": len([item for item in clean_successful_backups if item is not None]),
        "completed_restore_count": len([item for item in completed_restores if item is not None]),
        "clean_completed_restore_count": len([item for item in clean_completed_restores if item is not None]),
    }))
    PY
  register: backup_posture_cmd
  changed_when: false
  failed_when: false

- name: Normalize backup posture summary
  ansible.builtin.set_fact:
    backup_posture_data: "{{ backup_posture_cmd.stdout | from_json if (backup_posture_cmd.rc == 0 and (backup_posture_cmd.stdout | default('') | length > 0)) else {'backup_storage_location_summary': [], 'backup_schedule_summary': [], 'backup_summary': [], 'restore_summary': [], 'backup_posture_findings': [], 'successful_backup_count': 0, 'clean_successful_backup_count': 0, 'completed_restore_count': 0, 'clean_completed_restore_count': 0} }}"

- name: Expand backup posture summary facts
  ansible.builtin.set_fact:
    backup_storage_location_summary: "{{ backup_posture_data.backup_storage_location_summary | default([]) }}"
    backup_schedule_summary: "{{ backup_posture_data.backup_schedule_summary | default([]) }}"
    backup_summary: "{{ backup_posture_data.backup_summary | default([]) }}"
    restore_summary: "{{ backup_posture_data.restore_summary | default([]) }}"
    backup_posture_findings: "{{ backup_posture_data.backup_posture_findings | default([]) }}"

- name: Build machine remediation posture summary
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json

    data = json.loads(r'''{{ {
      "machinesets": (analysis_graph.machinesets | default({})).get('items', []),
      "machinehealthchecks": (analysis_graph.machinehealthchecks | default({})).get('items', [])
    } | to_json }}''')

    machine_sets = data.get("machinesets", []) or []
    mhcs = data.get("machinehealthchecks", []) or []
    findings = []
    summary = []

    if machine_sets and not mhcs:
        findings.append({
            "issue": "machinehealthcheck-missing",
            "detail": "Machine API-managed worker pools were found but no MachineHealthCheck resource was collected"
        })

    for item in mhcs:
        meta = item.get("metadata", {}) or {}
        spec = item.get("spec", {}) or {}
        status = item.get("status", {}) or {}
        paused = bool((meta.get("annotations") or {}).get("cluster.x-k8s.io/paused") == "true" or spec.get("paused", False))
        selector = spec.get("selector") or {}
        empty_selector = not ((selector.get("matchLabels") or {}) or (selector.get("matchExpressions") or []))
        entry = {
            "namespace": meta.get("namespace", ""),
            "name": meta.get("name", ""),
            "paused": paused,
            "max_unhealthy": spec.get("maxUnhealthy", ""),
            "expected_machines": status.get("expectedMachines", "unknown"),
            "current_healthy": status.get("currentHealthy", "unknown"),
            "selector_empty": empty_selector,
        }
        summary.append(entry)
        if paused:
            findings.append({
                "issue": "machinehealthcheck-paused",
                "detail": f"{entry['namespace']}/{entry['name']} is paused"
            })
        if empty_selector:
            findings.append({
                "issue": "machinehealthcheck-selector-empty",
                "detail": f"{entry['namespace']}/{entry['name']} has no selector"
            })

    print(json.dumps({
        "machinehealthcheck_summary": sorted(summary, key=lambda item: (item["namespace"], item["name"])),
        "machine_healthcheck_findings": findings,
    }))
    PY
  register: machine_remediation_cmd
  changed_when: false
  failed_when: false

- name: Normalize machine remediation posture summary
  ansible.builtin.set_fact:
    machine_remediation_data: "{{ machine_remediation_cmd.stdout | from_json if (machine_remediation_cmd.rc == 0 and (machine_remediation_cmd.stdout | default('') | length > 0)) else {'machinehealthcheck_summary': [], 'machine_healthcheck_findings': []} }}"

- name: Expand machine remediation posture facts
  ansible.builtin.set_fact:
    machinehealthcheck_summary: "{{ machine_remediation_data.machinehealthcheck_summary | default([]) }}"
    machine_healthcheck_findings: "{{ machine_remediation_data.machine_healthcheck_findings | default([]) }}"

- name: Build SCC posture summary
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json

    sccs = json.loads(r'''{{ (analysis_graph.securitycontextconstraints | default({})).get('items', []) | to_json }}''')
    pods = json.loads(r'''{{ (analysis_graph.pods | default({})).get('items', []) | to_json }}''')
    summary = []
    findings = []
    pod_findings = []

    def is_platform_namespace(ns):
        return ns.startswith("openshift-") or ns.startswith("kube-") or ns in {"default", "openshift"}

    risky_sccs = {}
    for scc in sccs:
        meta = scc.get("metadata", {}) or {}
        users = (scc.get("users") or [])
        groups = (scc.get("groups") or [])
        volumes = scc.get("volumes") or []
        run_as_user = ((scc.get("runAsUser") or {}).get("type") or "Unknown")
        name = meta.get("name", "unknown")
        privileged = bool(scc.get("allowPrivilegedContainer", False))
        host_dir = bool(scc.get("allowHostDirVolumePlugin", False))
        host_network = bool(scc.get("allowHostNetwork", False))
        host_pid = bool(scc.get("allowHostPID", False))
        host_ipc = bool(scc.get("allowHostIPC", False))
        anyuid = run_as_user == "RunAsAny"
        all_volumes = "*" in volumes
        risk_flags = []
        if privileged:
            risk_flags.append("privileged")
        if anyuid:
            risk_flags.append("runAsAny")
        if host_dir:
            risk_flags.append("hostPath")
        if host_network:
            risk_flags.append("hostNetwork")
        if host_pid:
            risk_flags.append("hostPID")
        if host_ipc:
            risk_flags.append("hostIPC")
        if all_volumes:
            risk_flags.append("allVolumes")
        summary.append({
            "name": name,
            "priority": meta.get("annotations", {}).get("kubernetes.io/description", ""),
            "privileged": privileged,
            "anyuid": anyuid,
            "host_network": host_network,
            "host_pid": host_pid,
            "host_ipc": host_ipc,
            "host_dir": host_dir,
            "all_volumes": all_volumes,
            "user_count": len(users),
            "group_count": len(groups),
            "risk_summary": ", ".join(risk_flags) if risk_flags else "restricted"
        })
        if risk_flags:
            risky_sccs[name] = ", ".join(risk_flags)
        if not risk_flags:
            continue
        for subject in users:
            if subject.startswith("system:serviceaccount:"):
                parts = subject.split(":")
                if len(parts) >= 4:
                    ns = parts[2]
                    sa = parts[3]
                    if not is_platform_namespace(ns):
                        findings.append({
                            "scc": name,
                            "subject_kind": "ServiceAccount",
                            "subject": f"{ns}/{sa}",
                            "risk_summary": ", ".join(risk_flags),
                        })
            elif not subject.startswith("system:"):
                findings.append({
                    "scc": name,
                    "subject_kind": "User",
                    "subject": subject,
                    "risk_summary": ", ".join(risk_flags),
                })
        for subject in groups:
            if subject.startswith("system:serviceaccounts:"):
                parts = subject.split(":")
                if len(parts) >= 3:
                    ns = parts[2]
                    if not is_platform_namespace(ns):
                        findings.append({
                            "scc": name,
                            "subject_kind": "ServiceAccount group",
                            "subject": ns,
                            "risk_summary": ", ".join(risk_flags),
                        })
            elif not subject.startswith("system:"):
                findings.append({
                    "scc": name,
                    "subject_kind": "Group",
                    "subject": subject,
                    "risk_summary": ", ".join(risk_flags),
                })

    for pod in pods:
        meta = pod.get("metadata", {}) or {}
        ns = str(meta.get("namespace") or "")
        if is_platform_namespace(ns):
            continue
        annotations = meta.get("annotations", {}) or {}
        scc_name = (
            annotations.get("openshift.io/scc")
            or annotations.get("security.openshift.io/scc.podSecurityLabelSync")
            or ""
        )
        if scc_name not in risky_sccs:
            continue
        pod_findings.append({
            "namespace": ns,
            "pod": str(meta.get("name") or "unknown"),
            "service_account": str(((pod.get("spec") or {}).get("serviceAccountName")) or "default"),
            "scc": scc_name,
            "risk_summary": risky_sccs[scc_name],
        })

    print(json.dumps({
        "scc_posture_summary": sorted(summary, key=lambda item: item["name"]),
        "scc_grant_findings": sorted(findings, key=lambda item: (item["scc"], item["subject_kind"], item["subject"])),
        "scc_pod_findings": sorted(pod_findings, key=lambda item: (item["scc"], item["namespace"], item["pod"])),
    }))
    PY
  register: scc_posture_summary_cmd
  changed_when: false
  failed_when: false

- name: Normalize SCC posture summary
  ansible.builtin.set_fact:
    scc_posture_summary: "{{ (scc_posture_summary_cmd.stdout | from_json).scc_posture_summary if (scc_posture_summary_cmd.rc == 0 and (scc_posture_summary_cmd.stdout | default('') | length > 0)) else [] }}"
    scc_grant_findings: "{{ (scc_posture_summary_cmd.stdout | from_json).scc_grant_findings if (scc_posture_summary_cmd.rc == 0 and (scc_posture_summary_cmd.stdout | default('') | length > 0)) else [] }}"
    scc_pod_findings: "{{ (scc_posture_summary_cmd.stdout | from_json).scc_pod_findings if (scc_posture_summary_cmd.rc == 0 and (scc_posture_summary_cmd.stdout | default('') | length > 0)) else [] }}"
