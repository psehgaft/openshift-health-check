---
- name: Build image registry exposure and policy findings
  vars:
    graph: "{{ analysis_graph | default({}) }}"
    allowed_imports: "{{ graph.image_config.spec.allowedRegistriesForImport | default([]) }}"
    registry_sources: "{{ graph.image_config.spec.registrySources | default({}) }}"
    allowed_registries: "{{ registry_sources.allowedRegistries | default([]) }}"
    blocked_registries: "{{ registry_sources.blockedRegistries | default([]) }}"
    insecure_registries: "{{ registry_sources.insecureRegistries | default([]) }}"
    public_default_route: "{{ graph.image_registry_config.spec.defaultRoute | default(false) }}"
    pruner_suspended: "{{ graph.image_pruner_config.spec.suspend | default(false) }}"
    image_registry_managed: "{{ graph.image_registry_config.spec.managementState | default('Managed') }}"
    image_registry_finding_entries: >-
      {{
        ([] +
        ([{'issue': 'public-internal-image-registry-route', 'detail': 'imageregistry operator defaultRoute=true'}] if public_default_route else []) +
        ([{'issue': 'missing-image-registry-filter-policy', 'detail': 'allowedRegistriesForImport and registrySources allow/block lists are unset'}] if (allowed_imports | length == 0 and allowed_registries | length == 0 and blocked_registries | length == 0) else []) +
        ([{'issue': 'insecure-image-registries-configured', 'detail': insecure_registries | join(', ')}] if insecure_registries | length > 0 else []))
      }}
    feature_finding_entries: >-
      {{
        ([] +
        ([{'issue': 'image-pruner-suspended', 'detail': 'image pruner is suspended'}] if pruner_suspended else []) +
        ([{'issue': 'image-registry-not-managed', 'detail': image_registry_managed}] if image_registry_managed != 'Managed' else []) +
        ([{'issue': 'insights-operator-not-healthy', 'detail': 'cluster operator insights is unavailable or degraded'}] if ('insights' in (unavailable_operators | default([])) or 'insights' in (degraded_operators | default([]))) else []))
      }}
  ansible.builtin.set_fact:
    image_registry_findings: "{{ image_registry_findings | default([]) + image_registry_finding_entries }}"
    feature_findings: "{{ feature_findings | default([]) + feature_finding_entries }}"

- name: Build internal image registry workload usage findings
  ansible.builtin.shell: |
    python3 - <<'PY'
    import base64
    import json
    import re

    data = json.loads(base64.b64decode(r'''{{ {
      "deployments": (analysis_graph.deployments | default({})).get('items', []),
      "statefulsets": (analysis_graph.statefulsets | default({})).get('items', []),
      "daemonsets": (analysis_graph.daemonsets | default({})).get('items', []),
      "exclude_regex": user_namespaces_exclude_regex | default('^$')
    } | to_json | b64encode }}''').decode("utf-8"))

    exclude_re = re.compile(data.get("exclude_regex") or r"^$")
    internal_markers = [
        "image-registry.openshift-image-registry.svc",
        "image-registry.openshift-image-registry.svc:5000",
    ]

    def is_internal_image(image):
        text = str(image or "").strip().lower()
        return any(marker in text for marker in internal_markers)

    findings = []
    for kind, key in [("Deployment", "deployments"), ("StatefulSet", "statefulsets"), ("DaemonSet", "daemonsets")]:
        for item in data.get(key, []):
            meta = item.get("metadata", {}) or {}
            ns = meta.get("namespace", "")
            if exclude_re.search(ns or ""):
                continue
            template_spec = (((item.get("spec", {}) or {}).get("template", {}) or {}).get("spec", {}) or {})
            containers = (template_spec.get("containers", []) or []) + (template_spec.get("initContainers", []) or [])
            matched = []
            for container in containers:
                image = container.get("image", "")
                if is_internal_image(image):
                    matched.append({
                        "container": container.get("name", "unknown"),
                        "image": image,
                    })
            if matched:
                findings.append({
                    "kind": kind,
                    "namespace": ns,
                    "name": meta.get("name", "unknown"),
                    "container_names": [item["container"] for item in matched],
                    "images": sorted({item["image"] for item in matched}),
                })

    result = {
        "internal_registry_workloads": findings,
        "image_registry_findings": (
            [{
                "issue": "internal-registry-images-in-user-workloads",
                "detail": f"{len(findings)} workload templates reference the internal OpenShift image registry service"
            }] if findings else []
        ),
    }
    print(json.dumps(result))
    PY
  register: internal_registry_workloads_cmd
  changed_when: false
  failed_when: false

- name: Normalize internal image registry workload usage findings
  ansible.builtin.set_fact:
    internal_registry_workloads: "{{ (internal_registry_workloads_cmd.stdout | from_json).internal_registry_workloads if (internal_registry_workloads_cmd.rc == 0 and (internal_registry_workloads_cmd.stdout | default('') | length > 0)) else [] }}"
    image_registry_findings: "{{ (image_registry_findings | default([])) + (((internal_registry_workloads_cmd.stdout | from_json).image_registry_findings) if (internal_registry_workloads_cmd.rc == 0 and (internal_registry_workloads_cmd.stdout | default('') | length > 0)) else []) }}"

- name: Create stale access review input file
  ansible.builtin.tempfile:
    state: file
    suffix: stale-access-review.json
  register: stale_access_review_input_file
  changed_when: false

- name: Write stale access review input
  ansible.builtin.copy:
    dest: "{{ stale_access_review_input_file.path }}"
    mode: "0600"
    content: "{{ {
      'rolebindings': ((analysis_graph.rolebindings | default({})).get('items', [])),
      'clusterrolebindings': ((analysis_graph.clusterrolebindings | default({})).get('items', [])),
      'users': ((analysis_graph.users | default({})).get('items', [])),
      'groups': ((analysis_graph.groups | default({})).get('items', [])),
      'likely_unused_serviceaccounts': (likely_unused_serviceaccounts | default([]))
    } | to_json }}"
  changed_when: false

- name: Build stale access review candidates
  ansible.builtin.shell: |
    python3 - <<'PY' "{{ stale_access_review_input_file.path }}"
    import json
    import re
    import sys

    with open(sys.argv[1], "r", encoding="utf-8") as handle:
        data = json.load(handle)

    system_name_re = re.compile(r"^(system:|kube:|openshift:)")
    user_names = {
        str((((item.get("metadata") or {}).get("name")) or "")).strip()
        for item in (data.get("users") or [])
        if str((((item.get("metadata") or {}).get("name")) or "")).strip()
    }
    group_map = {
        str((((item.get("metadata") or {}).get("name")) or "")).strip(): item
        for item in (data.get("groups") or [])
        if str((((item.get("metadata") or {}).get("name")) or "")).strip()
    }

    stale_users = []
    stale_groups = []
    bindings = (data.get("rolebindings") or []) + (data.get("clusterrolebindings") or [])

    for binding in bindings:
        subjects = binding.get("subjects") or []
        binding_kind = str(binding.get("kind") or "Binding").strip() or "Binding"
        binding_namespace = str((((binding.get("metadata") or {}).get("namespace")) or "")).strip()
        binding_name = str((((binding.get("metadata") or {}).get("name")) or "unknown")).strip() or "unknown"
        binding_scope = "cluster-wide" if not binding_namespace else f"namespace {binding_namespace}"
        grant_source = (
            f"{binding_kind}/{binding_name}"
            if not binding_namespace
            else f"{binding_kind}/{binding_namespace}/{binding_name}"
        )

        for subject in subjects:
            kind = str(subject.get("kind") or "").strip()
            name = str(subject.get("name") or "").strip()
            if not name or system_name_re.search(name):
                continue
            if kind == "User":
                if name not in user_names:
                    stale_users.append({
                        **subject,
                        "binding_scope": binding_scope,
                        "grant_source": grant_source,
                        "reason": "subject appears in RBAC bindings but no matching OpenShift User object was collected",
                    })
            elif kind == "Group":
                matching_group = group_map.get(name)
                if matching_group is None:
                    stale_groups.append({
                        **subject,
                        "binding_scope": binding_scope,
                        "grant_source": grant_source,
                        "reason": "subject appears in RBAC bindings but no matching OpenShift Group object was collected",
                    })
                else:
                    matching_group_users = matching_group.get("users") or []
                    if len(matching_group_users) == 0:
                        stale_groups.append({
                            **subject,
                            "binding_scope": binding_scope,
                            "grant_source": grant_source,
                            "reason": "matching OpenShift Group object was collected but it currently lists no members",
                        })

    print(json.dumps({
        "stale_access_review_serviceaccounts": data.get("likely_unused_serviceaccounts") or [],
        "stale_access_review_users": stale_users,
        "stale_access_review_groups": stale_groups,
    }))
    PY
  register: stale_access_review_cmd
  changed_when: false

- name: Remove stale access review input file
  ansible.builtin.file:
    path: "{{ stale_access_review_input_file.path }}"
    state: absent
  when: stale_access_review_input_file is defined and (stale_access_review_input_file.path | default('') | length > 0)
  changed_when: false

- name: Normalize stale access review candidates
  ansible.builtin.set_fact:
    stale_access_review_serviceaccounts: >-
      {{
        ((stale_access_review_cmd.stdout | default('{}') | from_json).stale_access_review_serviceaccounts | default([]))
      }}
    stale_access_review_users: >-
      {{
        ((stale_access_review_cmd.stdout | default('{}') | from_json).stale_access_review_users | default([]))
      }}
    stale_access_review_groups: >-
      {{
        ((stale_access_review_cmd.stdout | default('{}') | from_json).stale_access_review_groups | default([]))
      }}
  changed_when: false
