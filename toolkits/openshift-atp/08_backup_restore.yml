---
# ==============================================================================
# Section 8: Cluster Backup and Restore (TC 61 to TC 62)
# ==============================================================================

# TC 61: etcd backup
- name: "TC-61: etcd backup"
  when: run_tc61_etcd_backup | default(true) | bool
  block:
    - name: "TC-61: Verify cluster-backup.sh script existence on master node"
      ansible.builtin.shell: >
        MASTER=$(oc get nodes -l node-role.kubernetes.io/master -o jsonpath='{.items[0].metadata.name}');
        oc debug node/${MASTER} -- chroot /host test -f /usr/local/bin/cluster-backup.sh
      register: tc61_cmd
      changed_when: false
      failed_when: false

    - name: "TC-61: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-61',
          'name': 'etcd backup',
          'category': 'Cluster Backup & Restore',
          'expected': 'cluster-backup.sh script available on control-plane nodes',
          'status': ('Pass' if tc61_cmd.rc == 0 else 'Fail'),
          'procedure': (tc61_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc61_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc61_cmd.stderr | default(''))) if (tc61_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc61_cmd.rc | string) if tc61_cmd.rc is defined else '')),
          'details': 'cluster-backup.sh verified on master host'
        }] }}"
  tags: ['general', 'telco', 'tc61', 'etcd_backup']

# TC 62: etcd restore (Disruptive)
- name: "TC-62: etcd restore"
  block:
    - name: "TC-62: Check if etcd restore should run"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-62',
          'name': 'etcd restore',
          'category': 'Cluster Backup & Restore',
          'expected': 'Restore ETCD snapshot and recover cluster active status',
          'status': 'Skipped',
          'procedure': 'Manual only: follow the approved etcd restore runbook in a controlled recovery exercise.',
          'evidence': 'No command executed by this playbook. Attach evidence from the approved manual procedure if performed.',
          'details': 'Manual and highly disruptive; the ATP does not automate etcd restore.'
        }] }}"
  tags: ['general', 'telco', 'tc62', 'etcd_restore']