      block:
        - name: Resume live analysis and report stages
          when: (report_resume_manifest.resume_next_stage | default('')) == 'analysis'
          block:
            - name: Rebuild preliminary OpenShift analysis graph from checkpointed collection state
              ansible.builtin.include_role:
                name: analyze_openshift
                tasks_from: build_analysis_graph.yml
            - name: Re-project preliminary OpenShift analysis graph from checkpointed collection state
              ansible.builtin.include_role:
                name: analyze_openshift
                tasks_from: project_analysis_graph.yml
            - name: Run common analysis
              ansible.builtin.include_role:
                name: analyze_common
            - name: Analyze OpenShift-specific data
              ansible.builtin.include_role:
                name: analyze_openshift

            - name: Prepare OpenShift artifact persistence context for resumed live run
              ansible.builtin.include_role:
                name: report_common
                tasks_from: prepare_openshift_artifact_persistence_context.yml

            - name: Build and persist enabled posture artifacts for resumed live run
              ansible.builtin.include_role:
                name: "{{ item.role }}"
              loop: "{{ openshift_enabled_posture_artifact_roles }}"
              loop_control:
                label: "{{ item.key }}"

            - name: Build and persist enabled capability artifacts for resumed live run
              ansible.builtin.include_role:
                name: "{{ item.role }}"
              loop: "{{ openshift_enabled_capability_artifact_roles }}"
              loop_control:
                label: "{{ item.key }}"

            - name: Persist shared collection and analysis artifacts for resumed live run
              ansible.builtin.include_role:
                name: report_common
                tasks_from: persist_openshift_shared_artifacts.yml
            - name: Save resumed live analysis checkpoint
              ansible.builtin.include_role:
                name: report_common
                tasks_from: save_run_checkpoint.yml
              vars:
                run_checkpoint_stage: analysis
                run_checkpoint_resume_next_stage: report
                run_checkpoint_status: completed
                run_checkpoint_write_snapshot: false
            - name: Build live OpenShift report
              ansible.builtin.include_role:
                name: report_openshift
        - name: Resume live report stage only
          when: (report_resume_manifest.resume_next_stage | default('')) == 'report'
          ansible.builtin.include_role:
            name: report_openshift
        - name: Mark resumed live run checkpoint as completed
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: render
            run_checkpoint_resume_next_stage: ""
            run_checkpoint_status: completed
            run_checkpoint_write_snapshot: false
      rescue:
        - name: Record failed resumed live run checkpoint
