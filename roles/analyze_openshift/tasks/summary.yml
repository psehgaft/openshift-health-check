---
- name: Build aggregate lists
  vars:
    restart_limit: "{{ top_restart_pod_limit | default(10) | int }}"
    restart_table_limit: "{{ top_restart_pod_table_limit | default(100) | int }}"
    restart_table_threshold: "{{ top_restart_pod_table_threshold | default(3) | int }}"
    pvc_issue_limit: "{{ top_pvc_issue_limit | default(10) | int }}"
    event_reason_limit: "{{ top_event_reason_limit | default(10) | int }}"
    alert_group_limit: "{{ top_alert_group_limit | default(10) | int }}"
    namespace_issue_limit: "{{ top_namespace_issue_limit | default(10) | int }}"
    workload_issue_limit: "{{ top_workload_issue_limit | default(10) | int }}"
    security_issue_limit: "{{ top_security_issue_limit | default(10) | int }}"
    deprecated_api_limit: "{{ top_deprecated_api_limit | default(10) | int }}"
  ansible.builtin.set_fact:
    scored_day2_posture_findings: "{{ scored_day2_posture_findings | default(day2_posture_findings | default([])) }}"
    scored_workload_practice_findings: "{{ workload_practice_findings | default([]) | rejectattr('issue', 'equalto', 'missing-pod-disruption-budget') | list }}"
    default_storageclasses: "{{ storageclass_summary | default([]) | selectattr('is_default', 'equalto', true) | list }}"
    top_pod_restart_hotspots: "{{ (pod_restart_hotspots | default([]) | sort(attribute='restarts', reverse=true) | list)[:(restart_limit | int)] }}"
    high_restart_pods: "{{ (pod_restart_hotspots | default([]) | selectattr('restarts', 'gt', (restart_table_threshold | int)) | sort(attribute='restarts', reverse=true) | list) }}"
    top_high_restart_pods: "{{ ((pod_restart_hotspots | default([]) | selectattr('restarts', 'gt', (restart_table_threshold | int)) | sort(attribute='restarts', reverse=true) | list)[:(restart_table_limit | int)]) }}"
    top_pvc_issues: "{{ (pvc_issues | default([]))[:(pvc_issue_limit | int)] }}"
    top_pv_issues: "{{ (pv_issues | default([]))[:(pvc_issue_limit | int)] }}"
    top_event_reasons: "{{ (warning_event_reason_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | list)[:(event_reason_limit | int)] }}"
    top_alert_groups: "{{ (firing_alert_name_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | list)[:(alert_group_limit | int)] }}"
    top_alert_namespaces: "{{ (firing_alert_namespace_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | list)[:(namespace_issue_limit | int)] }}"
    top_namespace_issue_summary: "{{ (namespace_issue_summary | default([]))[:(namespace_issue_limit | int)] }}"
    top_workload_health_issues: "{{ (workload_health_issues | default([]))[:(workload_issue_limit | int)] }}"
    top_unhealthy_user_pods: "{{ (unhealthy_user_pods | default([]))[:(workload_issue_limit | int)] }}"
    top_high_replica_workloads: "{{ (high_replica_workloads | default([]) | sort(attribute='replicas', reverse=true) | list)[:(workload_issue_limit | int)] }}"
    top_orphan_pods: "{{ (orphan_pods | default([]))[:(workload_issue_limit | int)] }}"
    top_workload_label_governance_findings: "{{ (workload_label_governance_findings | default([]))[:(workload_issue_limit | int)] }}"
    top_workload_resource_findings: "{{ (workload_resource_findings | default([]))[:(workload_issue_limit | int)] }}"
    top_workload_probe_findings: "{{ (workload_probe_findings | default([]))[:(workload_issue_limit | int)] }}"
    top_overprovisioned_pods: "{{ (overprovisioned_pods | default([]))[:(workload_issue_limit | int)] }}"
    top_quota_pressure_findings: "{{ (quota_pressure_findings | default([]))[:(workload_issue_limit | int)] }}"
    top_security_findings: "{{ (security_findings | default([]))[:(security_issue_limit | int)] }}"
    top_workload_practice_findings: "{{ (workload_practice_findings | default([]))[:(security_issue_limit | int)] }}"
    top_route_issues: "{{ (route_issues | default([]))[:(workload_issue_limit | int)] }}"
    top_ingress_issues: "{{ (ingress_issues | default([]))[:(workload_issue_limit | int)] }}"
    top_route_host_conflicts: "{{ (route_host_conflicts | default([]))[:(workload_issue_limit | int)] }}"
    top_ingress_host_conflicts: "{{ (ingress_host_conflicts | default([]))[:(workload_issue_limit | int)] }}"
    top_deprecated_crd_findings: "{{ (deprecated_crd_findings | default([]))[:(deprecated_api_limit | int)] }}"
    top_deprecated_api_lines: "{{ (deprecated_api_lines | default([]))[:(deprecated_api_limit | int)] }}"
    top_services_without_endpoints: "{{ (services_without_endpoints | default([]))[:(workload_issue_limit | int)] }}"
    top_likely_unused_serviceaccounts: "{{ (likely_unused_serviceaccounts | default([]))[:(workload_issue_limit | int)] }}"
    top_likely_unused_configmaps: "{{ (likely_unused_configmaps | default([]))[:(workload_issue_limit | int)] }}"
    top_likely_unused_secrets: "{{ (likely_unused_secrets | default([]))[:(workload_issue_limit | int)] }}"
    top_likely_unused_crds: "{{ (likely_unused_crds | default([]))[:(deprecated_api_limit | int)] }}"
    top_image_registry_findings: "{{ (image_registry_findings | default([]))[:(security_issue_limit | int)] }}"
    top_internal_registry_workloads: "{{ (internal_registry_workloads | default([]))[:(workload_issue_limit | int)] }}"
    top_feature_findings: "{{ (feature_findings | default([]))[:(security_issue_limit | int)] }}"
    top_observability_findings: "{{ (observability_findings | default([]))[:(security_issue_limit | int)] }}"
    top_apiservice_issues: "{{ (apiservice_issues | default([]))[:(security_issue_limit | int)] }}"
    top_failed_pipelineruns: "{{ (failed_pipelineruns | default([]))[:(workload_issue_limit | int)] }}"
    top_buildconfigs_without_triggers: "{{ (buildconfigs_without_triggers | default([]))[:(workload_issue_limit | int)] }}"
    top_compliance_suite_findings: "{{ (compliance_suite_findings | default([]))[:(security_issue_limit | int)] }}"
    top_compliance_standards_findings: "{{ (compliance_standards_findings | default([]))[:(security_issue_limit | int)] }}"
    top_backup_posture_findings: "{{ (backup_posture_findings | default([]))[:(security_issue_limit | int)] }}"
    top_machine_healthcheck_findings: "{{ (machine_healthcheck_findings | default([]))[:(security_issue_limit | int)] }}"
    top_day2_posture_findings: "{{ (day2_posture_findings | default([]))[:(security_issue_limit | int)] }}"
    top_live_cluster_compare_findings: "{{ (live_cluster_compare_findings | default([]))[:(security_issue_limit | int)] }}"
    top_live_managed_gate_findings: "{{ (live_managed_gate_findings | default([]))[:(security_issue_limit | int)] }}"
    top_live_advisor_findings: "{{ (live_advisor_findings | default([]))[:(security_issue_limit | int)] }}"
    top_live_must_gather_findings: "{{ (live_must_gather_findings | default([]))[:(security_issue_limit | int)] }}"
    top_live_omc_findings: "{{ (omc_findings | default([]))[:(security_issue_limit | int)] }}"
    top_live_inspect_findings: "{{ (live_inspect_findings | default([]))[:(security_issue_limit | int)] }}"
    top_live_sosreport_findings: "{{ (live_sosreport_findings | default([]))[:(security_issue_limit | int)] }}"
    top_scc_grant_findings: "{{ (scc_grant_findings | default([]))[:(security_issue_limit | int)] }}"
    top_scc_pod_findings: "{{ (scc_pod_findings | default([]))[:(security_issue_limit | int)] }}"
    top_namespace_metadata_governance_findings: "{{ (namespace_metadata_governance_findings | default([]))[:(security_issue_limit | int)] }}"
    top_privileged_serviceaccount_access: "{{ (privileged_serviceaccount_access | default([]) | sort(attribute='namespace') | sort(attribute='name'))[:(security_issue_limit | int)] }}"
    top_privileged_user_access: "{{ (privileged_user_access | default([]) | sort(attribute='name'))[:(security_issue_limit | int)] }}"
    top_privileged_group_access: "{{ (privileged_group_access | default([]) | sort(attribute='name'))[:(security_issue_limit | int)] }}"
    top_stale_access_review_serviceaccounts: "{{ (stale_access_review_serviceaccounts | default([]) | sort(attribute='namespace') | sort(attribute='name'))[:(security_issue_limit | int)] }}"
    top_stale_access_review_users: "{{ (stale_access_review_users | default([]) | unique(attribute='name') | sort(attribute='name'))[:(security_issue_limit | int)] }}"
    top_stale_access_review_groups: "{{ (stale_access_review_groups | default([]) | unique(attribute='name') | sort(attribute='name'))[:(security_issue_limit | int)] }}"
  changed_when: false

- name: Build security issue type counts
  ansible.builtin.set_fact:
    security_issue_type_counts: "{{ security_issue_type_counts | default({}) | combine({item.issue: ((((security_issue_type_counts | default({}))[item.issue] | default(0)) + 1))}, recursive=True) }}"
  loop: "{{ security_findings | default([]) }}"
  changed_when: false

- name: Build workload practice issue type counts
  ansible.builtin.set_fact:
    workload_practice_issue_type_counts: "{{ workload_practice_issue_type_counts | default({}) | combine({item.issue: ((((workload_practice_issue_type_counts | default({}))[item.issue] | default(0)) + 1))}, recursive=True) }}"
  loop: "{{ workload_practice_findings | default([]) }}"
  changed_when: false

- name: Build workload probe issue type counts
  ansible.builtin.set_fact:
    workload_probe_issue_type_counts: "{{ workload_probe_issue_type_counts | default({}) | combine({item.issue: ((((workload_probe_issue_type_counts | default({}))[item.issue] | default(0)) + 1))}, recursive=True) }}"
  loop: "{{ workload_probe_findings | default([]) }}"
  changed_when: false

- name: Build cluster operator version mismatch list
  ansible.builtin.set_fact:
    cluster_operator_version_mismatches: "{{ cluster_operator_version_mismatches | default([]) + mismatch_entry }}"
  loop: "{{ (analysis_graph.clusteroperators | default({})).get('items', []) }}"
  vars:
    desired_version: "{{ analysis_graph.clusterversion.status.desired.version | default('unknown') }}"
    operator_version: "{{ item.status.versions[0].version | default('unknown') if (item.status.versions | default([]) | length > 0) else 'unknown' }}"
    mismatch_entry: >-
      {{
        [{
          'name': item.metadata.name | default('unknown'),
          'operator_version': operator_version,
          'cluster_version': desired_version,
          'available': ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first) | default('Unknown')),
          'progressing': ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Progressing') | map(attribute='status') | first) | default('Unknown')),
          'degraded': ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Degraded') | map(attribute='status') | first) | default('Unknown'))
        }]
        if (
          desired_version not in ['unknown', '']
          and operator_version not in ['unknown', '']
          and operator_version != desired_version
        ) else []
      }}
  changed_when: false

- name: Build live artifact analysis findings
  vars:
    live_support_parsed: "{{ (live_support_data | default({})).get('parsed', {}) }}"
    live_support_paths: "{{ (live_support_data | default({})).get('paths', {}) }}"
  ansible.builtin.set_fact:
    live_cluster_compare_findings: >-
      {{
        ([] +
        ([{
          'issue': 'cluster-compare-errors',
          'severity': 'critical',
          'detail': 'cluster-compare returned ' ~ (live_support_parsed.cluster_compare.summary.error_count | default(0) | string) ~ ' errors during baseline comparison'
        }] if ((live_support_parsed.cluster_compare.summary.error_count | default(0) | int) > 0) else []) +
        ([{
          'issue': 'cluster-compare-drift',
          'severity': 'warning',
          'detail': 'cluster-compare found ' ~ (live_support_parsed.cluster_compare.summary.diff_count | default(0) | string) ~ ' diffs and ' ~ (live_support_parsed.cluster_compare.summary.missing_count | default(0) | string) ~ ' missing baseline items'
        }] if (((live_support_parsed.cluster_compare.summary.diff_count | default(0) | int) > 0) or ((live_support_parsed.cluster_compare.summary.missing_count | default(0) | int) > 0)) else []) +
        ([{
          'issue': 'cluster-compare-warnings',
          'severity': 'warning',
          'detail': 'cluster-compare returned ' ~ (live_support_parsed.cluster_compare.summary.warning_count | default(0) | string) ~ ' warnings'
        }] if ((live_support_parsed.cluster_compare.summary.warning_count | default(0) | int) > 0) else []))
      }}
    live_managed_gate_findings: >-
      {{
        ([] +
        ([{
          'issue': 'managed-gates-blocked',
          'severity': 'critical',
          'detail': (live_support_parsed.managed_gates.summary.blocked_count | default(0) | string) ~ ' managed-service gates are blocked'
        }] if ((live_support_parsed.managed_gates.summary.blocked_count | default(0) | int) > 0) else []) +
        ([{
          'issue': 'managed-gates-pending',
          'severity': 'warning',
          'detail': (live_support_parsed.managed_gates.summary.pending_count | default(0) | string) ~ ' managed-service gates are pending'
        }] if ((live_support_parsed.managed_gates.summary.pending_count | default(0) | int) > 0) else []) +
        ([{
          'issue': 'managed-gates-warning',
          'severity': 'warning',
          'detail': (live_support_parsed.managed_gates.summary.warning_count | default(0) | string) ~ ' managed-service gates returned warning state'
        }] if ((live_support_parsed.managed_gates.summary.warning_count | default(0) | int) > 0) else []))
      }}
    live_advisor_findings: >-
      {{
        ([] +
        ([{
          'issue': 'advisor-critical-recommendations',
          'severity': 'warning',
          'detail': 'Advisor reported ' ~ (live_support_parsed.advisor_export.summary.critical_count | default(0) | string) ~ ' critical recommendations'
        }] if ((live_support_parsed.advisor_export.summary.critical_count | default(0) | int) > 0) else []) +
        ([{
          'issue': 'advisor-high-recommendations',
          'severity': 'warning',
          'detail': 'Advisor reported ' ~ (live_support_parsed.advisor_export.summary.high_count | default(0) | string) ~ ' high-severity recommendations'
        }] if ((live_support_parsed.advisor_export.summary.high_count | default(0) | int) > 0) else []))
      }}
    live_must_gather_findings: >-
      {{
        ([] +
        ([{
          'issue': 'must-gather-not-collected',
          'severity': 'warning',
          'detail': 'must-gather collection was requested but no must-gather bundle was discovered in the live artifact output'
        }] if (
          (live_support_collect_must_gather_resolved | default(false) | bool)
          and ((live_support_paths.must_gather | default('') | length) == 0)
        ) else []) +
        ([{
          'issue': 'must-gather-coverage-thin',
          'severity': 'warning',
          'detail': 'must-gather coverage is thin; cluster resources=' ~ (live_support_parsed.must_gather_inventory.summary.cluster_resource_file_count | default(0) | string) ~ ', namespaced resources=' ~ (live_support_parsed.must_gather_inventory.summary.namespaced_resource_file_count | default(0) | string)
        }] if (
          (live_support_parsed.must_gather_inventory.summary is defined)
          and (
            not (live_support_parsed.must_gather_inventory.summary.has_cluster_scoped_resources | default(false) | bool)
            or not (live_support_parsed.must_gather_inventory.summary.has_namespaces_tree | default(false) | bool)
          )
        ) else []))
      }}
    live_inspect_findings: >-
      {{
        ([{
          'issue': 'inspect-coverage-thin',
          'severity': 'warning',
          'detail': 'inspect collected only limited resource markers; nodes=' ~ (live_support_parsed.inspect.summary.resource_markers.nodes | default(0) | string) ~ ', operators=' ~ (live_support_parsed.inspect.summary.resource_markers.operators | default(0) | string) ~ ', routes=' ~ (live_support_parsed.inspect.summary.resource_markers.routes | default(0) | string)
        }] if (
          (live_support_parsed.inspect.summary is defined)
          and (
            ((live_support_parsed.inspect.summary.resource_markers.nodes | default(0) | int) == 0)
            or ((live_support_parsed.inspect.summary.resource_markers.operators | default(0) | int) == 0)
          )
        ) else [])
      }}
    live_sosreport_findings: >-
      {{
        ([] +
        ([{
          'issue': 'sosreport-node-coverage-missing',
          'severity': 'warning',
          'detail': 'node-level sosreport data was requested but no node reports were captured'
        }] if (
          (live_support_collect_sosreport_resolved | default(false) | bool)
          and ((live_support_parsed.sosreport.summary.count | default(0) | int) == 0)
          and ((node_debug_target_nodes | default([])) | length > 0)
        ) else []) +
        ([{
          'issue': 'sosreport-node-coverage-partial',
          'severity': 'warning',
          'detail': 'some sosreports are missing journal, kubelet, CRI-O, or network coverage'
        }] if (
          (live_support_parsed.sosreport.summary.count | default(0) | int) > 0
          and (
            (live_support_parsed.sosreport.summary.reports_with_journal | default(0) | int) < (live_support_parsed.sosreport.summary.count | default(0) | int)
            or (live_support_parsed.sosreport.summary.reports_with_kubelet_logs | default(0) | int) < (live_support_parsed.sosreport.summary.count | default(0) | int)
            or (live_support_parsed.sosreport.summary.reports_with_network_data | default(0) | int) < (live_support_parsed.sosreport.summary.count | default(0) | int)
          )
        ) else []))
      }}
  changed_when: false

- name: Build health summary
  vars:
    graph: "{{ analysis_graph | default({}) }}"
    assessment_collection: "{{ assessment_collection_summary | default({}) }}"
    assessment_collection_failure_list: "{{ assessment_collection_failures | default([]) }}"
    apiserver_readyz_failed: >-
      {{
        (apiserver_readyz_status | default('unavailable')) == 'failed'
        or (apiserver_readyz_failed_checks | default(0) | int) > 0
      }}
    high_impact_progressing_operators: >-
      {{
        (progressing_operators | default([]))
        | select('in', ['authentication', 'dns', 'etcd', 'ingress', 'kube-apiserver', 'network'])
        | list
      }}
    etcd_leader_unhealthy: >-
      {{
        (etcd_leader_count | default('') | string | length > 0)
        and ((etcd_leader_count | float) != 1)
      }}
    apiserver_runtime_degraded: >-
      {{
        ((apiserver_request_5xx_rate | default('') | string | length > 0) and ((apiserver_request_5xx_rate | float) > 0))
        or ((apiserver_request_p99_seconds | default('') | string | length > 0) and ((apiserver_request_p99_seconds | float) > (apiserver_latency_p99_warn_seconds | default(1) | float)))
      }}
    etcd_runtime_degraded: >-
      {{
        ((etcd_wal_fsync_p99_ms | default('') | string | length > 0) and ((etcd_wal_fsync_p99_ms | float) > (etcd_wal_fsync_p99_warn_ms | default(10) | float)))
        or ((etcd_peer_rtt_p99_ms | default('') | string | length > 0) and ((etcd_peer_rtt_p99_ms | float) > (etcd_peer_rtt_p99_warn_ms | default(50) | float)))
        or ((etcd_leader_changes_5m | default('') | string | length > 0) and ((etcd_leader_changes_5m | float) > 0))
      }}
    core_platform_runtime_reason_summary: >-
      {{
        (
          []
          + (['API /readyz failed'] if apiserver_readyz_failed else [])
          + (['API runtime degraded'] if apiserver_runtime_degraded else [])
          + (['etcd leader unhealthy'] if etcd_leader_unhealthy else [])
          + (['etcd runtime degraded'] if etcd_runtime_degraded else [])
          + (
            ['high-impact operators progressing: ' ~ (high_impact_progressing_operators | join(', '))]
            if (high_impact_progressing_operators | length) > 0
            else []
          )
        ) | join('; ')
      }}
  ansible.builtin.set_fact:
    health_summary:
      status: >-
        {{
          'CRITICAL'
          if (
            cv_failing == 'True'
            or (cv_available == 'False' and cv_progressing != 'True')
            or (degraded_operators | default([]) | length > 0)
            or (unavailable_operators | default([]) | length > 0)
            or (not_ready_nodes | default([]) | length > 0)
            or (degraded_mcps | default([]) | length > 0)
            or (route_issues | default([]) | length > 0)
            or (ingress_issues | default([]) | length > 0)
            or (route_host_conflicts | default([]) | length > 0)
            or (ingress_host_conflicts | default([]) | length > 0)
            or (ingresscontroller_issues | default([]) | length > 0)
            or (infrastructure_component_issues | default([]) | length > 0)
            or (apiservice_issues | default([]) | length > 0)
            or apiserver_readyz_failed
            or etcd_leader_unhealthy
            or (critical_pod_density_nodes | default([]) | length > 0)
            or (expiring_certificates_critical | default([]) | length > 0)
            or (live_cluster_compare_findings | default([]) | selectattr('severity', 'equalto', 'critical') | list | length > 0)
            or (live_managed_gate_findings | default([]) | selectattr('severity', 'equalto', 'critical') | list | length > 0)
            or (assessment_collection.core_failed_commands | default(0) | int > 0)
          )
          else (
            'WARNING'
            if (
              cv_progressing == 'True'
              or cv_available == 'Unknown'
              or (high_impact_progressing_operators | length > 0)
              or (pressure_nodes | default([]) | length > 0)
              or apiserver_runtime_degraded
              or etcd_runtime_degraded
              or (platform_pod_issues | default([]) | length > 0)
              or (namespace_issue_summary | default([]) | length > 0)
              or (pvc_issues | default([]) | length > 0)
              or (pv_issues | default([]) | length > 0)
              or (quota_pressure_findings | default([]) | length > 0)
              or (security_findings | default([]) | length > 0)
              or (scored_workload_practice_findings | default([]) | length > 0)
              or (empty_user_namespaces | default([]) | length > 0)
              or (likely_unused_serviceaccounts | default([]) | length > 0)
              or (likely_unused_configmaps | default([]) | length > 0)
              or (likely_unused_secrets | default([]) | length > 0)
              or (likely_unused_crds | default([]) | length > 0)
              or (image_registry_findings | default([]) | length > 0)
              or (feature_findings | default([]) | length > 0)
              or (scc_grant_findings | default([]) | length > 0)
              or (compliance_suite_findings | default([]) | length > 0)
              or (backup_posture_findings | default([]) | length > 0)
              or (machine_healthcheck_findings | default([]) | length > 0)
              or (scored_day2_posture_findings | default([]) | length > 0)
              or (namespaces_without_limitrange | default([]) | length > 0)
              or (namespaces_without_resourcequota | default([]) | length > 0)
              or (deprecated_crd_findings | default([]) | length > 0)
              or (deprecated_api_lines | default([]) | length > 0)
              or (high_pod_density_nodes | default([]) | length > 0)
              or (expiring_certificates_warning | default([]) | length > 0)
              or (observability_findings | default([]) | length > 0)
              or (live_cluster_compare_findings | default([]) | length > 0)
              or (live_managed_gate_findings | default([]) | length > 0)
              or (live_advisor_findings | default([]) | length > 0)
              or (live_must_gather_findings | default([]) | length > 0)
              or (live_inspect_findings | default([]) | length > 0)
              or (live_sosreport_findings | default([]) | length > 0)
              or (recent_warning_events | default([]) | length > 0)
              or (assessment_collection_failure_list | length > 0)
            )
            else 'HEALTHY'
          )
        }}
      cluster_version: "{{ graph.clusterversion.status.desired.version | default('unknown') }}"
      operators_total: "{{ (graph.clusteroperators | default({})).get('items', []) | length }}"
      operators_degraded: "{{ degraded_operators | default([]) | length }}"
