---
- name: Initialize node facts
  ansible.builtin.set_fact:
    openshift_node_items: >-
      {{
        ((analysis_graph.nodes | default({})).get('items', []))
        | selectattr('kind', 'defined')
        | selectattr('kind', 'equalto', 'Node')
        | selectattr('metadata.name', 'defined')
        | rejectattr('metadata.name', 'equalto', 'cluster')
        | list
      }}
    not_ready_nodes: []
    pressure_nodes: []
    primary_node_role_counts: {}
    kubelet_version_counts: {}
    node_pod_counts: {}
    namespace_pod_counts: {}
    pod_object_counts:
      total: 0
      running: 0
      user_total: 0
      user_running: 0
    node_cpu_request_millicores: "{{ node_cpu_request_millicores | default({}) }}"
    openshift_control_plane_node_count: 0
    openshift_worker_node_count: 0
    openshift_infra_node_count: 0
  when: report_scope_requires_core_node_analysis | default(true) | bool

- name: Build pod count and restart hotspots
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_pod_restart_hotspots.py"
    stdin: "{{ {
      'pods': ((analysis_graph.pods | default({})).get('items', [])),
      'nodes': (openshift_node_items | default([])),
      'exclude_regex': (user_namespaces_exclude_regex | default('^$')),
      'operator_managed_namespace_names': (operator_managed_namespace_names | default([]))
    } | to_json }}"
  register: pod_restart_hotspots_cmd
  changed_when: false
  when: report_scope_requires_core_node_analysis | default(true) | bool

- name: Normalize pod count and restart hotspots
  ansible.builtin.set_fact:
    pod_restart_hotspots: "{{ (pod_restart_hotspots_cmd.stdout | from_json).pod_restart_hotspots | default([]) }}"
    pod_phase_counts: "{{ (pod_restart_hotspots_cmd.stdout | from_json).pod_phase_counts | default({}) }}"
    node_pod_counts: "{{ (pod_restart_hotspots_cmd.stdout | from_json).node_pod_counts | default({}) }}"
    namespace_pod_counts: "{{ (pod_restart_hotspots_cmd.stdout | from_json).namespace_pod_counts | default({}) }}"
    pod_object_counts: "{{ (pod_restart_hotspots_cmd.stdout | from_json).pod_object_counts | default({'total': 0, 'running': 0, 'user_total': 0, 'user_running': 0}) }}"
  changed_when: false
  when: report_scope_requires_core_node_analysis | default(true) | bool

- name: Build fallback node pod count map from must-gather node pod inventories
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_node_pod_count_map.py"
    stdin: "{{ {
      'must_gather_path': (must_gather_path | default('')),
      'nodes': (openshift_node_items | default([]))
    } | to_json }}"
  register: node_pod_count_fallback_cmd
  changed_when: false
  failed_when: false
  when:
    - report_scope_requires_core_node_analysis | default(true) | bool
    - must_gather_path | default('') | trim | length > 0
    - (openshift_node_items | default([]) | length) > 0

- name: Normalize fallback node pod count map
  ansible.builtin.set_fact:
    node_pod_counts_fallback: "{{ (node_pod_count_fallback_cmd.stdout | from_json).node_pod_counts if (node_pod_count_fallback_cmd.rc | default(1)) == 0 and (node_pod_count_fallback_cmd.stdout | default('') | length > 0) else {} }}"
  when:
    - report_scope_requires_core_node_analysis | default(true) | bool
    - node_pod_count_fallback_cmd is defined
  changed_when: false

- name: Build node health facts
  ansible.builtin.set_fact:
    not_ready_nodes: "{{ not_ready_nodes + ([item.metadata.name] if not node_is_ready else []) }}"
    pressure_nodes: "{{ pressure_nodes + ([{'name': item.metadata.name, 'pressures': pressure_types}] if pressure_types | length > 0 else []) }}"
    primary_node_role_counts: "{{ primary_node_role_counts | combine({primary_node_role: ((primary_node_role_counts[primary_node_role] | default(0)) + 1)}, recursive=True) }}"
    kubelet_version_counts: "{{ kubelet_version_counts | combine({kubelet_version: ((kubelet_version_counts[kubelet_version] | default(0)) + 1)}, recursive=True) }}"
    openshift_control_plane_node_count: "{{ (openshift_control_plane_node_count | int) + (1 if primary_node_role in ['master', 'control-plane'] else 0) }}"
    openshift_worker_node_count: "{{ (openshift_worker_node_count | int) + (1 if primary_node_role == 'worker' else 0) }}"
    openshift_infra_node_count: "{{ (openshift_infra_node_count | int) + (1 if primary_node_role == 'infra' else 0) }}"
  loop: "{{ openshift_node_items | default([]) }}"
  vars:
    ready_status: "{{ ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | first) | default('Unknown')) }}"
    node_is_ready: "{{ (ready_status | string | lower) in ['true', 'ready'] }}"
    pressure_types: "{{ item.status.conditions | default([]) | selectattr('status', 'equalto', 'True') | map(attribute='type') | select('in', ['MemoryPressure', 'DiskPressure', 'PIDPressure', 'OutOfDisk', 'NetworkUnavailable']) | list }}"
    node_roles: "{{ item.metadata.labels | default({}) | dict2items | map(attribute='key') | select('match', '^node-role.kubernetes.io/') | map('regex_replace', '^node-role.kubernetes.io/', '') | list }}"
    primary_node_role: >-
      {{
        'master'
        if 'master' in node_roles
        else (
          'control-plane'
          if 'control-plane' in node_roles
          else (
            'infra'
            if 'infra' in node_roles
            else (
              'worker'
              if 'worker' in node_roles
              else ((node_roles | sort | first) | default('worker'))
            )
          )
        )
      }}
    kubelet_version: "{{ item.status.nodeInfo.kubeletVersion | default('unknown') }}"
  changed_when: false
  when: report_scope_requires_core_node_analysis | default(true) | bool
