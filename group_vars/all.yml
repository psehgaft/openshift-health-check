---
# Shared repo-local runtime paths. These are consumed by the playbooks for
# temp-file creation, artifact staging, and script environment injection.
repo_root_dir: "{{ playbook_dir }}/.."
repo_runtime_root_dir: "{{ repo_root_dir }}/.runtime"
repo_ansible_root_dir: "{{ repo_runtime_root_dir }}/ansible"
repo_tmp_root_dir: "{{ repo_runtime_root_dir }}/tmp"
repo_ansible_local_tmp_dir: "{{ repo_ansible_root_dir }}/tmp"
repo_ansible_remote_tmp_dir: "{{ repo_ansible_root_dir }}/remote_tmp"
node_debug_remote_tmp_dir: "/var/lib/openshift-health-check/sos"

# Shared process environment for helper scripts launched through Ansible.
repo_script_environment:
  TMPDIR: "{{ repo_tmp_root_dir }}"
  TMP: "{{ repo_tmp_root_dir }}"
  TEMP: "{{ repo_tmp_root_dir }}"
  OHC_REPO_TMPDIR: "{{ repo_tmp_root_dir }}"
  OHC_REMOTE_TMPDIR: "{{ repo_ansible_remote_tmp_dir }}"
  OHC_NODE_DEBUG_REMOTE_TMPDIR: "{{ node_debug_remote_tmp_dir }}"
  ANSIBLE_LOCAL_TEMP: "{{ repo_ansible_local_tmp_dir }}"
  ANSIBLE_REMOTE_TEMP: "{{ repo_ansible_remote_tmp_dir }}"

# Default fallback for node pod capacity when a node does not report
# status.allocatable.pods. Real allocatable pod capacity still takes
# precedence wherever it is available.
cluster_max_pods_per_node_default: 250

# Default controller-side local resource budget. These values bound the
# effective collection and analysis worker counts based on detected CPU and
# memory on the VM running the report.
local_resource_budget_cpu_pct: 75
local_resource_budget_mem_pct: 75

# Report-facing list and table limits. Keep these high enough to show the
# dominant patterns for larger production clusters, but low enough to avoid
# turning the report into a raw data dump.
top_restart_pod_limit: 30
top_restart_pod_table_limit: 50
top_restart_pod_table_threshold: 3
top_pvc_issue_limit: 30
top_event_reason_limit: 15
top_alert_group_limit: 15
top_namespace_issue_limit: 30
top_workload_issue_limit: 30
top_security_issue_limit: 30
top_deprecated_api_limit: 15
top_node_density_table_limit: 50
top_metadata_table_limit: 30
top_external_delivery_table_limit: 15
top_pod_usage_table_limit: 50
top_old_pod_table_limit: 50
top_release_table_limit: 15
top_capacity_summary_limit: 30
top_capacity_shape_summary_limit: 30
top_collection_failure_limit: 15
