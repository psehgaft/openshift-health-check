---
- name: Flush buffered OpenShift posture artifacts
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/write_json_artifact_map.py"
      - "{{ report_run_workspace_postures_dir }}"
      - --prefix
      - "postures/"
      - --mode
      - "0644"
    stdin: "{{ report_buffered_posture_artifacts | default({}) | to_json }}"
  register: report_buffered_posture_artifacts_flush_cmd
  changed_when: false
  when:
    - (report_artifact_persistence_mode | default('buffered')) == 'buffered'
    - (report_buffered_posture_artifacts | default({}) | length) > 0

- name: Record flushed OpenShift posture artifacts and clear buffer
  vars:
    posture_flush_result: "{{ (report_buffered_posture_artifacts_flush_cmd.stdout | from_json) if (report_buffered_posture_artifacts_flush_cmd.stdout | default('') | length > 0) else {'completed': []} }}"
    posture_completed_artifacts: "{{ posture_flush_result.completed | default([]) }}"
  ansible.builtin.set_fact:
    openshift_posture_artifacts: "{{ (openshift_posture_artifacts | default({})) | combine((report_buffered_posture_artifacts | default({})), recursive=False) }}"
    report_workspace_completed_artifacts: "{{ (report_workspace_completed_artifacts | default([])) + posture_completed_artifacts }}"
    report_workspace_failed_artifacts: "{{ (report_workspace_failed_artifacts | default([])) | difference(posture_completed_artifacts) }}"
    report_buffered_posture_artifacts: {}
  when:
    - (report_artifact_persistence_mode | default('buffered')) == 'buffered'
    - report_buffered_posture_artifacts_flush_cmd is defined
