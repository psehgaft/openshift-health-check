---
- name: Build Kubernetes aggregate lists
  ansible.builtin.set_fact:
    resolved_profile_mode: "{{ resolved_cluster_profile_mode | default(cluster_profile_mode | default('production')) }}"
    profile_is_lightweight: "{{ ((resolved_cluster_profile_mode | default(cluster_profile_mode | default('production'))) == 'lightweight') | bool }}"
    profile_is_development: "{{ ((resolved_cluster_profile_mode | default(cluster_profile_mode | default('production'))) == 'development') | bool }}"
    profile_is_non_production: "{{ ((resolved_cluster_profile_mode | default(cluster_profile_mode | default('production'))) in ['development', 'lightweight']) | bool }}"
    top_pod_restart_hotspots: "{{ (pod_restart_hotspots | default([]) | sort(attribute='restarts', reverse=true) | list)[:top_restart_pod_limit] }}"
    high_restart_pods: "{{ (pod_restart_hotspots | default([]) | selectattr('restarts', 'ge', (pod_restart_warning_threshold | default(5) | int)) | sort(attribute='restarts', reverse=true) | list) }}"
    top_high_restart_pods: "{{ ((pod_restart_hotspots | default([]) | selectattr('restarts', 'ge', (pod_restart_warning_threshold | default(5) | int)) | sort(attribute='restarts', reverse=true) | list)[:top_restart_pod_limit]) }}"
    top_pvc_issues: "{{ (pvc_issues | default([]))[:top_pvc_issue_limit] }}"
    top_pv_issues: "{{ (pv_issues | default([]))[:top_pvc_issue_limit] }}"
    top_namespace_issue_summary: "{{ (namespace_issue_summary | default([]))[:top_namespace_issue_limit] }}"
    top_workload_health_issues: "{{ (workload_health_issues | default([]))[:top_workload_issue_limit] }}"
    top_workload_probe_findings: "{{ (workload_probe_findings | default([]))[:top_workload_issue_limit] }}"
    top_security_findings: "{{ (security_findings | default([]))[:top_security_issue_limit] }}"
    top_workload_practice_findings: "{{ (workload_practice_findings | default([]))[:top_security_issue_limit] }}"
    top_deprecated_crd_findings: "{{ (deprecated_crd_findings | default([]))[:top_deprecated_api_limit] }}"
    top_deprecated_api_lines: "{{ (deprecated_api_lines | default([]))[:top_deprecated_api_limit] }}"
    top_services_without_endpoints: "{{ (services_without_endpoints | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_serviceaccounts: "{{ (likely_unused_serviceaccounts | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_configmaps: "{{ (likely_unused_configmaps | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_secrets: "{{ (likely_unused_secrets | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_crds: "{{ (likely_unused_crds | default([]))[:top_deprecated_api_limit] }}"
    top_provider_specific_findings: "{{ (provider_specific_findings | default([]))[:top_workload_issue_limit] }}"
  changed_when: false

- name: Build Kubernetes health summary
  ansible.builtin.set_fact:
    health_summary:
      status: >-
        {{
          'CRITICAL'
          if (
            (not_ready_nodes | default([]) | length > 0)
            or (collection_summary.core_failed_commands | default(0) | int > 0)
          )
          else (
            'WARNING'
            if (
              (pressure_nodes | default([]) | length > 0)
              or (platform_pod_issues | default([]) | length > 0)
              or (high_restart_pods | default([]) | length > 0)
              or (namespace_issue_summary | default([]) | length > 0)
              or (pvc_issues | default([]) | length > 0)
              or (pv_issues | default([]) | length > 0)
              or (workload_health_issues | default([]) | length > 0)
              or (workload_probe_findings | default([]) | length > 0)
              or (security_findings | default([]) | length > 0)
              or (workload_practice_findings | default([]) | length > 0)
              or ((not profile_is_non_production | bool) and (empty_user_namespaces | default([]) | length > 0))
              or ((not profile_is_non_production | bool) and (services_without_endpoints | default([]) | length > 0))
              or ((not profile_is_non_production | bool) and (likely_unused_serviceaccounts | default([]) | length > 0))
              or ((not profile_is_non_production | bool) and (likely_unused_configmaps | default([]) | length > 0))
              or ((not profile_is_non_production | bool) and (likely_unused_secrets | default([]) | length > 0))
              or ((not profile_is_non_production | bool) and (likely_unused_crds | default([]) | length > 0))
              or ((not profile_is_non_production | bool) and (namespaces_without_networkpolicy | default([]) | length > 0))
              or ((not profile_is_non_production | bool) and (namespaces_missing_ingress_policies | default([]) | length > 0))
              or ((not profile_is_non_production | bool) and (namespaces_missing_egress_policies | default([]) | length > 0))
              or ((not profile_is_non_production | bool) and (namespaces_without_limitrange | default([]) | length > 0))
              or ((not profile_is_non_production | bool) and (namespaces_without_resourcequota | default([]) | length > 0))
              or (deprecated_crd_findings | default([]) | length > 0)
              or (deprecated_api_lines | default([]) | length > 0)
              or (certificate_expiry_findings | default([]) | length > 0)
              or ((provider_specific_findings | default([]) | rejectattr('issue', 'equalto', 'minikube-lightweight-profile') | list | length) > 0)
              or (collection_failures | default([]) | length > 0)
            )
            else 'HEALTHY'
          )
        }}
      kubernetes_version: "{{ (kubelet_version_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | map(attribute='key') | first) | default('unknown') }}"
      nodes_total: "{{ (nodes | default({})).get('items', []) | length }}"
      nodes_not_ready: "{{ not_ready_nodes | default([]) | length }}"
      node_pressure_count: "{{ pressure_nodes | default([]) | length }}"
      platform_pod_issues: "{{ platform_pod_issues | default([]) | length }}"
      high_restart_pods: "{{ high_restart_pods | default([]) | length }}"
      workload_health_issues: "{{ workload_health_issues | default([]) | length }}"
      workload_probe_findings: "{{ workload_probe_findings | default([]) | length }}"
      provider_specific_findings: "{{ (provider_specific_findings | default([]) | rejectattr('issue', 'equalto', 'minikube-lightweight-profile') | list | length) }}"
      security_findings: "{{ security_findings | default([]) | length }}"
      workload_practice_findings: "{{ workload_practice_findings | default([]) | length }}"
      empty_user_namespaces: "{{ 0 if (profile_is_non_production | bool) else (empty_user_namespaces | default([]) | length) }}"
      services_without_endpoints: "{{ 0 if (profile_is_non_production | bool) else (services_without_endpoints | default([]) | length) }}"
      likely_unused_serviceaccounts: "{{ 0 if (profile_is_non_production | bool) else (likely_unused_serviceaccounts | default([]) | length) }}"
      likely_unused_configmaps: "{{ 0 if (profile_is_non_production | bool) else (likely_unused_configmaps | default([]) | length) }}"
      likely_unused_secrets: "{{ 0 if (profile_is_non_production | bool) else (likely_unused_secrets | default([]) | length) }}"
      likely_unused_crds: "{{ 0 if (profile_is_non_production | bool) else (likely_unused_crds | default([]) | length) }}"
      deprecated_crd_findings: "{{ deprecated_crd_findings | default([]) | length }}"
      deprecated_api_lines: "{{ deprecated_api_lines | default([]) | length }}"
      namespaces_without_networkpolicy: "{{ 0 if (profile_is_non_production | bool) else (namespaces_without_networkpolicy | default([]) | length) }}"
      namespaces_missing_ingress_policies: "{{ 0 if (profile_is_non_production | bool) else (namespaces_missing_ingress_policies | default([]) | length) }}"
      namespaces_missing_egress_policies: "{{ 0 if (profile_is_non_production | bool) else (namespaces_missing_egress_policies | default([]) | length) }}"
      namespaces_without_resourcequota: "{{ 0 if (profile_is_non_production | bool) else (namespaces_without_resourcequota | default([]) | length) }}"
      namespaces_without_limitrange: "{{ 0 if (profile_is_non_production | bool) else (namespaces_without_limitrange | default([]) | length) }}"
      namespaces_non_active: "{{ namespace_issue_summary | default([]) | length }}"
      pv_issues: "{{ pv_issues | default([]) | length }}"
      pvc_issues: "{{ pvc_issues | default([]) | length }}"
      certificate_expiry_findings: "{{ certificate_expiry_findings | default([]) | length }}"
      collection_failed_commands: "{{ collection_summary.failed_commands | default(0) }}"
      collection_core_failed_commands: "{{ collection_summary.core_failed_commands | default(0) }}"
      collection_timed_out_commands: "{{ collection_summary.timed_out_commands | default(0) }}"
      cluster_profile_mode: "{{ resolved_profile_mode }}"

- name: Build Kubernetes current state
  ansible.builtin.shell: |
    python3 - <<'PY'
    import base64
    import json
    from collections import Counter, defaultdict

    data = json.loads(base64.b64decode(r'''{{ {
      "cluster_profile": cluster_profile | default({}),
      "nodes": (nodes | default({})).get('items', []),
      "pods": (pods | default({})).get('items', []),
      "deployments": (deployments | default({})).get('items', []),
      "statefulsets": (statefulsets | default({})).get('items', []),
      "daemonsets": (daemonsets | default({})).get('items', []),
      "ingresses": (ingresses | default({})).get('items', []),
      "namespaces": (namespaces | default({})).get('items', []),
      "storageclasses": (storageclasses | default({})).get('items', []),
      "node_pod_counts": node_pod_counts | default({})
    } | to_json | b64encode }}''').decode("utf-8"))

    def parse_cpu(value):
        if value in (None, ""):
            return 0.0
        s = str(value).strip()
        if s.endswith("m"):
            return float(s[:-1]) / 1000.0
        return float(s)

    def parse_binary_bytes(value):
        if value in (None, ""):
            return 0.0
        s = str(value).strip()
        multipliers = {
            "Ki": 1024,
            "Mi": 1024 ** 2,
            "Gi": 1024 ** 3,
            "Ti": 1024 ** 4,
            "Pi": 1024 ** 5,
            "Ei": 1024 ** 6,
            "K": 1000,
            "M": 1000 ** 2,
            "G": 1000 ** 3,
            "T": 1000 ** 4,
            "P": 1000 ** 5,
            "E": 1000 ** 6,
        }
        for suffix, mult in multipliers.items():
            if s.endswith(suffix):
                return float(s[:-len(suffix)]) * mult
        return float(s)

    def summarize_counter(counter, key_name, value_name="count", limit=10):
        return [
            {key_name: key, value_name: value}
            for key, value in sorted(counter.items(), key=lambda item: (-item[1], str(item[0])))
        ][:limit]

    def choose_primary_role(roles):
        if "master" in roles:
            return "master"
        if "control-plane" in roles:
            return "control-plane"
        if "infra" in roles:
            return "infra"
        if "worker" in roles:
            return "worker"
        return sorted(roles)[0] if roles else "worker"

    role_counts = Counter()
    arch_counts = Counter()
    os_image_counts = Counter()
    runtime_counts = Counter()
    kubelet_counts = Counter()
    provider_counts = Counter()
    total_cpu_cores = 0.0
    total_memory_bytes = 0.0
    total_disk_bytes = 0.0
    total_pods_scheduled = 0
    worker_pool_counts = defaultdict(int)
    worker_pool_zones = defaultdict(set)

    def classify_provider(provider_id):
        text = str(provider_id or "").lower()
        if text.startswith("aws://"):
            return "aws"
        if text.startswith("azure://"):
            return "azure"
        if text.startswith("gce://"):
            return "gcp"
        if text.startswith("vsphere://"):
            return "vsphere"
        if text.startswith("openstack://"):
            return "openstack"
        if text.startswith("ibm://"):
            return "ibmcloud"
        if text.startswith("nutanix://"):
            return "nutanix"
        if text.startswith("oirt://") or text.startswith("ovirt://"):
            return "ovirt"
        if text.startswith("libvirt://"):
            return "libvirt"
        return "unknown"

    for node in data["nodes"]:
        meta = node.get("metadata", {}) or {}
        labels = meta.get("labels", {}) or {}
        status = node.get("status", {}) or {}
        spec = node.get("spec", {}) or {}
        node_info = status.get("nodeInfo", {}) or {}
        roles = []
        for key in labels:
            if key.startswith("node-role.kubernetes.io/"):
                roles.append(key.replace("node-role.kubernetes.io/", "", 1) or "worker")
        primary_role = choose_primary_role(roles)
        role_counts[primary_role] += 1
        arch = node_info.get("architecture", "unknown")
        arch_counts[arch] += 1
        os_image_counts[node_info.get("osImage", "unknown")] += 1
        runtime_counts[node_info.get("containerRuntimeVersion", "unknown")] += 1
        kubelet_counts[node_info.get("kubeletVersion", "unknown")] += 1
        provider = classify_provider(spec.get("providerID"))
        provider_counts[provider] += 1

        allocatable = status.get("allocatable", {}) or {}
        total_cpu_cores += parse_cpu(allocatable.get("cpu", "0"))
        total_memory_bytes += parse_binary_bytes(allocatable.get("memory", "0"))
        total_disk_bytes += parse_binary_bytes(allocatable.get("ephemeral-storage", "0"))
        total_pods_scheduled += int(data["node_pod_counts"].get(meta.get("name", ""), 0) or 0)

        if primary_role == "worker":
            instance_type = (
                labels.get("node.kubernetes.io/instance-type")
                or labels.get("beta.kubernetes.io/instance-type")
                or "unknown"
            )
            zone = (
                labels.get("topology.kubernetes.io/zone")
                or labels.get("failure-domain.beta.kubernetes.io/zone")
                or "unknown"
            )
            pool_key = (instance_type, arch, provider)
            worker_pool_counts[pool_key] += 1
            worker_pool_zones[pool_key].add(zone)

    worker_pools = []
    for (instance_type, arch, provider), count in sorted(worker_pool_counts.items(), key=lambda item: (-item[1], item[0][0], item[0][1], item[0][2])):
        worker_pools.append({
            "type": instance_type,
            "architecture": arch,
            "provider": provider,
            "nodes": count,
            "zones": sorted(worker_pool_zones[(instance_type, arch, provider)]),
        })

    running_pods = 0
    for pod in data["pods"]:
        if ((pod.get("status", {}) or {}).get("phase", "Unknown")) == "Running":
            running_pods += 1

    result = {
        "kubernetes_version": (summarize_counter(kubelet_counts, "version", "count", limit=10)[0]["version"] if kubelet_counts else "unknown"),
        "cluster_visibility": "unknown",
        "api_visibility": "unknown",
        "ingress_visibility": "unknown",
        "installed_at": "unknown",
        "uptime_days": "unknown",
        "uptime_human": "unknown",
        "worker_pool_count": len(worker_pools),
        "node_counts": {
            "total": len(data["nodes"]),
            "control_plane": role_counts.get("master", 0) + role_counts.get("control-plane", 0),
            "worker": role_counts.get("worker", 0),
            "infra": role_counts.get("infra", 0),
            "other": sum(v for k, v in role_counts.items() if k not in {"master", "control-plane", "worker", "infra"}),
        },
        "object_counts": {
            "namespaces": len(data["namespaces"]),
            "pods": len(data["pods"]),
            "running_pods": running_pods,
            "deployments": len(data["deployments"]),
            "statefulsets": len(data["statefulsets"]),
            "daemonsets": len(data["daemonsets"]),
            "ingresses": len(data["ingresses"]),
            "storageclasses": len(data["storageclasses"]),
        },
        "resources": {
            "total_cpu_cores": round(total_cpu_cores, 1),
            "total_memory_gib": round(total_memory_bytes / (1024 ** 3), 1),
            "total_ephemeral_storage_gib": round(total_disk_bytes / (1024 ** 3), 1),
            "average_cpu_cores_per_node": round(total_cpu_cores / len(data["nodes"]), 1) if data["nodes"] else 0,
            "average_memory_gib_per_node": round((total_memory_bytes / (1024 ** 3)) / len(data["nodes"]), 1) if data["nodes"] else 0,
            "average_ephemeral_storage_gib_per_node": round((total_disk_bytes / (1024 ** 3)) / len(data["nodes"]), 1) if data["nodes"] else 0,
            "average_pods_per_node": round(total_pods_scheduled / len(data["nodes"]), 1) if data["nodes"] else 0,
        },
        "node_architectures": summarize_counter(arch_counts, "architecture", "count", limit=10),
        "provider_types": summarize_counter(provider_counts, "provider", "count", limit=10),
        "os_images": summarize_counter(os_image_counts, "os_image", "count", limit=10),
        "container_runtimes": summarize_counter(runtime_counts, "runtime", "count", limit=10),
        "node_roles": summarize_counter(role_counts, "role", "count", limit=10),
        "worker_pools": worker_pools[:15],
    }

    print(json.dumps(result))
    PY
  register: cluster_current_state_cmd
  changed_when: false

- name: Normalize Kubernetes current state
  ansible.builtin.set_fact:
    cluster_current_state_build_error: "{{ '' if (cluster_current_state_cmd.rc == 0 and (cluster_current_state_cmd.stdout | default('') | length > 0)) else (cluster_current_state_cmd.stderr | default(cluster_current_state_cmd.stdout | default('cluster current state builder returned no output')) | trim) }}"
    cluster_current_state: "{{ cluster_current_state_cmd.stdout | from_json if (cluster_current_state_cmd.rc == 0 and (cluster_current_state_cmd.stdout | default('') | length > 0)) else cluster_current_state_fallback }}"
  vars:
    cluster_current_state_fallback:
      kubernetes_version: "{{ (kubelet_version_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | map(attribute='key') | first) | default('unknown') }}"
      cluster_visibility: unknown
      api_visibility: unknown
      ingress_visibility: unknown
      installed_at: unknown
      uptime_days: unknown
      uptime_human: unknown
      worker_pool_count: 0
      node_counts:
        total: "{{ (nodes | default({})).get('items', []) | length }}"
        control_plane: "{{ (primary_node_role_counts | default({})).get('master', 0) | int + (primary_node_role_counts | default({})).get('control-plane', 0) | int }}"
        worker: "{{ ((primary_node_role_counts | default({})).get('worker', 0) | int) }}"
        infra: "{{ ((primary_node_role_counts | default({})).get('infra', 0) | int) }}"
        other: "{{ [0, ((nodes | default({})).get('items', []) | length) - (((primary_node_role_counts | default({})).get('master', 0) | int) + ((primary_node_role_counts | default({})).get('control-plane', 0) | int) + ((primary_node_role_counts | default({})).get('worker', 0) | int) + ((primary_node_role_counts | default({})).get('infra', 0) | int))] | max }}"
      object_counts:
        namespaces: "{{ (namespaces | default({})).get('items', []) | length }}"
        pods: "{{ (pods | default({})).get('items', []) | length }}"
        running_pods: "{{ (pods | default({})).get('items', []) | selectattr('status.phase', 'equalto', 'Running') | list | length }}"
        deployments: "{{ (deployments | default({})).get('items', []) | length }}"
        statefulsets: "{{ (statefulsets | default({})).get('items', []) | length }}"
        daemonsets: "{{ (daemonsets | default({})).get('items', []) | length }}"
        ingresses: "{{ (ingresses | default({})).get('items', []) | length }}"
        storageclasses: "{{ (storageclasses | default({})).get('items', []) | length }}"
      resources:
        total_cpu_cores: unknown
        total_memory_gib: unknown
        total_ephemeral_storage_gib: unknown
        average_cpu_cores_per_node: unknown
        average_memory_gib_per_node: unknown
        average_ephemeral_storage_gib_per_node: unknown
        average_pods_per_node: "{{ (((pods | default({})).get('items', []) | length) / ([1, ((nodes | default({})).get('items', []) | length)] | max)) | round(1) }}"
      node_architectures: []
      provider_types: []
      os_images: []
      container_runtimes: []
      node_roles: []
      worker_pools: []
