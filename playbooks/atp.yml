---
- name: "Acceptance Test Plan (ATP) Execution - Red Hat OpenShift Container Platform {{ expected_ocp_version | default('4.20') }}"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../toolkits/openshift-atp/vars/main.yml"

  pre_tasks:
    - name: "Initialize ATP execution facts and results repository"
      ansible.builtin.set_fact:
        atp_results: []
        atp_start_time: '{{ lookup("pipe", "date -u +%Y-%m-%dT%H:%M:%SZ") }}'
      tags: ['always', 'general', 'telco']

    - name: "Ensure output reports directory exists"
      ansible.builtin.file:
        path: "{{ atp_report_dir }}"
        state: directory
        mode: '0755'
      tags: ['always', 'general', 'telco']

    - name: "Verify oc CLI and cluster connectivity"
      ansible.builtin.command: oc whoami
      register: oc_whoami_check
      changed_when: false
      failed_when: false
      tags: ['always', 'general', 'telco']

    - name: "Fail if oc CLI is not authenticated"
      ansible.builtin.fail:
        msg: "The oc CLI is not logged into any cluster. Please run 'oc login' with cluster-admin privileges before executing the ATP."
      when: oc_whoami_check.rc != 0
      tags: ['always', 'general', 'telco']

    - name: "Check for the ATP test project"
      ansible.builtin.command: oc get project testproject -o name
      register: atp_testproject_check
      changed_when: false
      failed_when: false
      tags: ['always', 'general', 'telco']

    - name: "Create testproject before ATP cases when it is absent"
      ansible.builtin.command: oc new-project testproject --description="ATP Test Project"
      register: atp_testproject_create
      when: atp_testproject_check.rc != 0
      changed_when: atp_testproject_create.rc == 0
      tags: ['always', 'general', 'telco']

    - name: "Record ATP test project setup evidence"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'ATP-SETUP-01',
          'name': 'Ensure ATP test project exists',
          'category': 'ATP Setup',
          'expected': 'Project testproject exists before ATP test cases start',
          'status': 'Pass',
          'procedure': 'oc get project testproject -o name; if absent, oc new-project testproject --description="ATP Test Project"',
          'evidence': (('Existing project: ' ~ atp_testproject_check.stdout) if atp_testproject_check.rc == 0 else (atp_testproject_create.stdout | default('Project testproject created'))),
          'details': ('Project already existed: ' ~ atp_testproject_check.stdout) if atp_testproject_check.rc == 0 else 'Project created before ATP test cases.'
        }] }}"
      tags: ['always', 'general', 'telco']

  tasks:
    - name: "Execute ATP Main Task Loader"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../toolkits/openshift-atp/main.yml"
      tags: ['general', 'telco', 'atp']

  post_tasks:
    - name: "Record completion timestamp"
      ansible.builtin.set_fact:
        atp_end_time: '{{ lookup("pipe", "date -u +%Y-%m-%dT%H:%M:%SZ") }}'
      tags: ['always', 'general', 'telco']

    - name: "Render final ATP Markdown Report"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../toolkits/openshift-atp/templates/atp_report.md.j2"
        dest: "{{ atp_report_file }}"
        mode: '0644'
      tags: ['always', 'general', 'telco']

    - name: "Render final ATP HTML Report"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../toolkits/openshift-atp/templates/atp_report.html.j2"
        dest: "{{ atp_report_html_file }}"
        mode: '0644'
      tags: ['always', 'general', 'telco']

    - name: "Display Execution Summary"
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "               ATP EXECUTION COMPLETED                    "
          - "=========================================================="
          - "Total Test Cases Evaluated: {{ atp_results | length }}"
          - "Pass: {{ atp_results | selectattr('status', 'equalto', 'Pass') | list | length }}"
          - "Fail: {{ atp_results | selectattr('status', 'equalto', 'Fail') | list | length }}"
          - "Skipped: {{ atp_results | selectattr('status', 'equalto', 'Skipped') | list | length }}"
          - "Markdown Report: {{ atp_report_file }}"
          - "HTML Report: {{ atp_report_html_file }}"
          - "=========================================================="
      tags: ['always', 'general', 'telco']
