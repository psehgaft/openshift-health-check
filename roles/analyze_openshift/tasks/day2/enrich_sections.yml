        {%- elif (not capability_assessment_completed) and (section.key | default('') == 'openshift_data_foundation') -%}
          {%- set odf_operator_subscription_present = ('odf-operator' in (subscription_packages | default([]))) or ('ocs-operator' in (subscription_packages | default([]))) -%}
