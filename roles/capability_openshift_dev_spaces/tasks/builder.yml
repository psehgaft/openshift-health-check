---
- name: Build OpenShift Dev Spaces capability artifact facts
  vars:
    day2_openshift_dev_spaces_section_current: "{{ (day2_capability_sections_by_key | default({})).get('openshift_dev_spaces', {}) }}"
    openshift_dev_spaces_present_current: "{{ ((day2_posture_summary | default({})).get('openshift_dev_spaces_present', false)) | bool }}"
    openshift_dev_spaces_healthy_current: "{{ ((day2_posture_summary | default({})).get('openshift_dev_spaces_healthy', false)) | bool }}"
    openshift_dev_spaces_subscription_present_current: "{{ ((day2_posture_summary | default({})).get('openshift_dev_spaces_subscription_present', false)) | bool }}"
    openshift_dev_spaces_namespace_present_current: "{{ ((day2_posture_summary | default({})).get('openshift_dev_spaces_namespace_present', false)) | bool }}"
    openshift_dev_spaces_checluster_present_current: "{{ ((day2_posture_summary | default({})).get('openshift_dev_spaces_checluster_present', false)) | bool }}"
    openshift_dev_spaces_devworkspace_present_current: "{{ ((day2_posture_summary | default({})).get('openshift_dev_spaces_devworkspace_present', false)) | bool }}"
    openshift_dev_spaces_workspace_operator_config_present_current: "{{ ((day2_posture_summary | default({})).get('openshift_dev_spaces_workspace_operator_config_present', false)) | bool }}"
    openshift_dev_spaces_routing_present_current: "{{ ((day2_posture_summary | default({})).get('openshift_dev_spaces_routing_present', false)) | bool }}"
    openshift_developer_hub_present_current: "{{ ((day2_posture_summary | default({})).get('openshift_developer_hub_present', false)) | bool }}"
    openshift_dev_spaces_reason_summary_current: >-
      {{
        (
          day2_openshift_dev_spaces_section_current.top_detail
          | default('')
          | string
          | trim
        )
        or (
          'subscriptionPresent=' ~ (openshift_dev_spaces_subscription_present_current | string)
          ~ ' namespacePresent=' ~ (openshift_dev_spaces_namespace_present_current | string)
          ~ ' cheClusterPresent=' ~ (openshift_dev_spaces_checluster_present_current | string)
          ~ ' devWorkspacePresent=' ~ (openshift_dev_spaces_devworkspace_present_current | string)
          ~ ' workspaceOperatorConfigPresent=' ~ (openshift_dev_spaces_workspace_operator_config_present_current | string)
          ~ ' routingPresent=' ~ (openshift_dev_spaces_routing_present_current | string)
        )
      }}
    openshift_dev_spaces_linkage_note_current: >-
      {{
        ' If Red Hat Developer Hub is also expected, confirm the portal-to-workspace integration path remains aligned with Dev Spaces.'
        if (openshift_developer_hub_present_current | bool)
        else ''
      }}
    openshift_dev_spaces_recommended_action_current: >-
      {{
        (
          'Confirm the intended OpenShift Dev Spaces operator, CheCluster control plane, routing, and Dev Workspace footprint remain healthy for the teams that depend on hosted workspaces.'
          if openshift_dev_spaces_present_current
          else 'If OpenShift Dev Spaces is intended, deploy or confirm the operator, openshift-devspaces namespace, CheCluster control plane, and Dev Workspace footprint.'
        )
        ~ openshift_dev_spaces_linkage_note_current
      }}
    openshift_dev_spaces_checks_current:
      - name: Operator subscription footprint present
        status: >-
          {{
            'OK'
            if (openshift_dev_spaces_subscription_present_current | bool)
            else ('WARN' if (openshift_dev_spaces_present_current | bool) else 'INFO')
          }}
        detail: "subscriptionPresent={{ (openshift_dev_spaces_subscription_present_current | bool) | string }}"
      - name: Operator namespace footprint present
        status: >-
          {{
            'OK'
            if (openshift_dev_spaces_namespace_present_current | bool)
            else ('WARN' if (openshift_dev_spaces_present_current | bool) else 'INFO')
          }}
        detail: "namespacePresent={{ (openshift_dev_spaces_namespace_present_current | bool) | string }}"
      - name: CheCluster control plane footprint present
        status: >-
          {{
            'OK'
            if (openshift_dev_spaces_checluster_present_current | bool)
            else ('WARN' if (openshift_dev_spaces_present_current | bool) else 'INFO')
          }}
        detail: "cheClusterPresent={{ (openshift_dev_spaces_checluster_present_current | bool) | string }}"
      - name: Dev Workspace footprint present
        status: >-
          {{
            'OK'
            if (openshift_dev_spaces_devworkspace_present_current | bool)
            else ('WARN' if (openshift_dev_spaces_present_current | bool) else 'INFO')
          }}
        detail: "devWorkspacePresent={{ (openshift_dev_spaces_devworkspace_present_current | bool) | string }}"
      - name: Workspace routing or operator config footprint present
        status: >-
          {{
            'OK'
            if ((openshift_dev_spaces_workspace_operator_config_present_current | bool) or (openshift_dev_spaces_routing_present_current | bool))
            else ('WARN' if (openshift_dev_spaces_present_current | bool) else 'INFO')
          }}
        detail: >-
          {{
            'workspaceOperatorConfigPresent=' ~ (openshift_dev_spaces_workspace_operator_config_present_current | string)
            ~ ' routingPresent=' ~ (openshift_dev_spaces_routing_present_current | string)
          }}
    openshift_dev_spaces_findings_current: >-
      {{
        ([] +
        ([{
          'capability': 'openshift_dev_spaces',
          'issue': 'prod-day2-openshift-dev-spaces-subscription-missing',
          'severity': ('warning' if (openshift_dev_spaces_present_current | bool) else 'info'),
          'source': 'OpenShift Dev Spaces operator and workspace inventory',
          'detail': 'No OpenShift Dev Spaces or Dev Workspace operator subscription footprint was detected.',
          'recommended_action': openshift_dev_spaces_recommended_action_current,
          'docs': ((day2_openshift_dev_spaces_section_current.docs | default([])) | string)
        }] if not (openshift_dev_spaces_subscription_present_current | bool) else []) +
        ([{
          'capability': 'openshift_dev_spaces',
          'issue': 'prod-day2-openshift-dev-spaces-namespace-missing',
          'severity': ('warning' if (openshift_dev_spaces_present_current | bool) else 'info'),
          'source': 'OpenShift Dev Spaces operator and workspace inventory',
          'detail': 'No openshift-devspaces namespace footprint was detected.',
          'recommended_action': openshift_dev_spaces_recommended_action_current,
          'docs': ((day2_openshift_dev_spaces_section_current.docs | default([])) | string)
        }] if not (openshift_dev_spaces_namespace_present_current | bool) else []) +
        ([{
          'capability': 'openshift_dev_spaces',
          'issue': 'prod-day2-openshift-dev-spaces-checluster-missing',
          'severity': ('warning' if (openshift_dev_spaces_present_current | bool) else 'info'),
          'source': 'OpenShift Dev Spaces operator and workspace inventory',
          'detail': 'No CheCluster control-plane footprint was detected.',
          'recommended_action': openshift_dev_spaces_recommended_action_current,
          'docs': ((day2_openshift_dev_spaces_section_current.docs | default([])) | string)
        }] if not (openshift_dev_spaces_checluster_present_current | bool) else []) +
        ([{
          'capability': 'openshift_dev_spaces',
          'issue': 'prod-day2-openshift-dev-spaces-devworkspace-missing',
          'severity': ('warning' if (openshift_dev_spaces_present_current | bool) else 'info'),
          'source': 'OpenShift Dev Spaces operator and workspace inventory',
          'detail': 'No Dev Workspace footprint was detected.',
          'recommended_action': openshift_dev_spaces_recommended_action_current,
          'docs': ((day2_openshift_dev_spaces_section_current.docs | default([])) | string)
        }] if not (openshift_dev_spaces_devworkspace_present_current | bool) else []) +
        ([{
          'capability': 'openshift_dev_spaces',
          'issue': 'prod-day2-openshift-dev-spaces-routing-config-missing',
          'severity': ('warning' if (openshift_dev_spaces_present_current | bool) else 'info'),
          'source': 'OpenShift Dev Spaces operator and workspace inventory',
          'detail': 'No Dev Workspace routing or operator configuration footprint was detected.',
          'recommended_action': openshift_dev_spaces_recommended_action_current,
          'docs': ((day2_openshift_dev_spaces_section_current.docs | default([])) | string)
        }] if not ((openshift_dev_spaces_workspace_operator_config_present_current | bool) or (openshift_dev_spaces_routing_present_current | bool)) else []))
      }}
    openshift_dev_spaces_section_override_current: >-
      {{
        (day2_openshift_dev_spaces_section_current | default({}))
        | combine(
            {
              'accounting_state': 'assessed',
              'check_count': (openshift_dev_spaces_checks_current | length),
              'finding_count': (openshift_dev_spaces_findings_current | length),
              'checks': openshift_dev_spaces_checks_current,
              'findings': openshift_dev_spaces_findings_current,
              'status': (
                'OK'
                if openshift_dev_spaces_healthy_current
                else ('WARNING' if openshift_dev_spaces_present_current else 'INFO')
              ),
              'top_detail': (
                openshift_dev_spaces_reason_summary_current
                if openshift_dev_spaces_present_current
                else 'no OpenShift Dev Spaces operator, CheCluster, DevWorkspace, namespace, or routing footprint was detected'
              ),
              'recommended_action': openshift_dev_spaces_recommended_action_current
            },
            recursive=True
          )
      }}
  ansible.builtin.set_fact:
    capability_artifact_key: openshift_dev_spaces
    capability_artifact_section_override: "{{ openshift_dev_spaces_section_override_current }}"
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      accounting_state: assessed
      check_count: "{{ (openshift_dev_spaces_checks_current | length) | int }}"
      finding_count: "{{ (openshift_dev_spaces_findings_current | length) | int }}"
      openshift_dev_spaces_present: "{{ openshift_dev_spaces_present_current | bool }}"
      openshift_dev_spaces_healthy: "{{ openshift_dev_spaces_healthy_current | bool }}"
      openshift_dev_spaces_subscription_present: "{{ openshift_dev_spaces_subscription_present_current | bool }}"
      openshift_dev_spaces_namespace_present: "{{ openshift_dev_spaces_namespace_present_current | bool }}"
      openshift_dev_spaces_checluster_present: "{{ openshift_dev_spaces_checluster_present_current | bool }}"
      openshift_dev_spaces_devworkspace_present: "{{ openshift_dev_spaces_devworkspace_present_current | bool }}"
      openshift_dev_spaces_workspace_operator_config_present: "{{ openshift_dev_spaces_workspace_operator_config_present_current | bool }}"
      openshift_dev_spaces_routing_present: "{{ openshift_dev_spaces_routing_present_current | bool }}"
      status_summary: "{{ openshift_dev_spaces_section_override_current.status }}"
      reason_summary: "{{ openshift_dev_spaces_section_override_current.top_detail }}"
    capability_artifact_render_inputs:
      day2_openshift_dev_spaces_section: "{{ openshift_dev_spaces_section_override_current }}"
    capability_artifact_collection_inputs:
      openshift_dev_spaces_present: "{{ openshift_dev_spaces_present_current | bool }}"
      openshift_dev_spaces_healthy: "{{ openshift_dev_spaces_healthy_current | bool }}"
      openshift_dev_spaces_subscription_present: "{{ openshift_dev_spaces_subscription_present_current | bool }}"
      openshift_dev_spaces_namespace_present: "{{ openshift_dev_spaces_namespace_present_current | bool }}"
      openshift_dev_spaces_checluster_present: "{{ openshift_dev_spaces_checluster_present_current | bool }}"
      openshift_dev_spaces_devworkspace_present: "{{ openshift_dev_spaces_devworkspace_present_current | bool }}"
      openshift_dev_spaces_workspace_operator_config_present: "{{ openshift_dev_spaces_workspace_operator_config_present_current | bool }}"
      openshift_dev_spaces_routing_present: "{{ openshift_dev_spaces_routing_present_current | bool }}"
