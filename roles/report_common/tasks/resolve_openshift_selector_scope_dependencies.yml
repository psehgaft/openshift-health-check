- name: Resolve selector-scope dependency tags
  vars:
    effective_selected_postures: "{{ report_execution_selected_postures | default(report_effective_selected_postures | default([])) }}"
    effective_selected_capabilities: "{{ report_effective_selected_capabilities | default([]) }}"
  ansible.builtin.set_fact:
    report_scope_selected_dependency_tags: >-
      {%- set ns = namespace(tags=[]) -%}
      {%- for key in effective_selected_postures -%}
        {%- for tag in (report_scope_posture_dependency_map.get(key, [])) -%}
          {%- if tag not in ns.tags -%}
            {%- set _ = ns.tags.append(tag) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {%- for key in effective_selected_capabilities -%}
        {%- for tag in (report_scope_capability_dependency_map.get(key, [])) -%}
          {%- if tag not in ns.tags -%}
            {%- set _ = ns.tags.append(tag) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.tags }}

- name: Resolve selector-scope shared inputs used
  vars:
    selected_dependency_tags: "{{ report_scope_selected_dependency_tags | default([]) }}"
  ansible.builtin.set_fact:
    report_scope_selected_shared_inputs_used: >-
      {%- set ns = namespace(inputs=[]) -%}
      {%- for tag in selected_dependency_tags -%}
        {%- for input_name in (report_scope_tag_shared_inputs_map.get(tag, [])) -%}
          {%- if input_name not in ns.inputs -%}
            {%- set _ = ns.inputs.append(input_name) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.inputs }}

- name: Resolve selector-scope activity locally
  vars:
    requested_postures: "{{ report_requested_postures | default(report_effective_selected_postures | default([])) }}"
    requested_capabilities: "{{ report_requested_capabilities | default(report_effective_selected_capabilities | default([])) }}"
    effective_selected_postures: "{{ report_execution_selected_postures | default(report_effective_selected_postures | default([])) }}"
    effective_selected_capabilities: "{{ report_effective_selected_capabilities | default([]) }}"
  ansible.builtin.set_fact:
    report_scope_selector_active_local: >-
      {{
        (
          (requested_postures | default([]) | length)
          + (requested_capabilities | default([]) | length)
          + (effective_selected_postures | default([]) | length)
          + (effective_selected_capabilities | default([]) | length)
        ) > 0
      }}

- name: Resolve selector-scope product evidence families
  vars:
    requested_postures: "{{ report_requested_postures | default(report_effective_selected_postures | default([])) }}"
    selected_capabilities: "{{ report_effective_selected_capabilities | default([]) }}"
  ansible.builtin.set_fact:
    report_scope_selected_product_evidence_families: >-
      {%- set ns = namespace(families=[]) -%}
      {%- if not (report_scope_selector_active_local | default(report_selector_scope_active | default(false)) | bool) -%}
        {%- set ns.families = ['pipelines', 'logging', 'gitops', 'odf', 'virtualization', 'ai'] -%}
      {%- else -%}
        {%- if 'evidence_and_supportability' in requested_postures or 'day2_production_readiness' in requested_postures -%}
          {%- set ns.families = ['pipelines', 'logging', 'gitops', 'odf', 'virtualization', 'ai'] -%}
        {%- else -%}
          {%- if 'container_platform_adoption_and_release_engineering' in requested_postures -%}
            {%- set _ = ns.families.append('pipelines') -%}
          {%- endif -%}
          {%- if 'declarative_gitops_operations' in selected_capabilities -%}
            {%- set _ = ns.families.append('gitops') -%}
          {%- endif -%}
          {%- if 'openshift_data_foundation' in selected_capabilities -%}
            {%- set _ = ns.families.append('odf') -%}
          {%- endif -%}
        {%- endif -%}
      {%- endif -%}
      {{ ns.families | unique | list }}

- name: Resolve selector-scope dependency contract
  ansible.builtin.set_fact:
    report_scope_dependency_contract:
      effective_section_scope: "{{ report_effective_section_scope | default({'postures': [], 'capabilities': []}) }}"
      selected_dependency_tags: "{{ report_scope_selected_dependency_tags | default([]) }}"
      selected_shared_inputs_used: "{{ report_scope_selected_shared_inputs_used | default([]) }}"
      selected_product_evidence_families: "{{ report_scope_selected_product_evidence_families | default([]) }}"
      posture_dependency_map: "{{ report_scope_posture_dependency_map | default({}) }}"
      capability_dependency_map: "{{ report_scope_capability_dependency_map | default({}) }}"
      tag_shared_inputs_map: "{{ report_scope_tag_shared_inputs_map | default({}) }}"

