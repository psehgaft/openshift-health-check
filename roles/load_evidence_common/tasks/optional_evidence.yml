---
- name: Parse optional cluster-compare evidence
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/parse_cluster_compare.py"
      - "{{ cluster_compare_path }}"
  register: cluster_compare_parse_cmd
  changed_when: false
  when:
    - cluster_compare_path | default('') | trim | length > 0
    - report_scope_requires_cluster_compare_evidence | default(true) | bool

- name: Merge optional cluster-compare evidence
  vars:
    cluster_compare_payload: "{{ (cluster_compare_parse_cmd.stdout | from_json) if (cluster_compare_parse_cmd.stdout | default('') | trim | length > 0) else {} }}"
    cluster_compare_source:
      name: cluster-compare
      type: report-file
      mode: offline
      path: "{{ cluster_compare_path }}"
      parser: parse_cluster_compare.py
  ansible.builtin.set_fact:
    cluster_compare_data: "{{ cluster_compare_payload }}"
    evidence_sources: "{{ evidence_sources + ([cluster_compare_source] if (cluster_compare_parse_cmd.rc == 0 and (cluster_compare_parse_cmd.stdout | default('') | trim | length > 0)) else []) }}"
    evidence_summary: "{{ evidence_summary | combine({'source_count': ((evidence_summary.source_count | default(0) | int) + (1 if (cluster_compare_parse_cmd.rc == 0 and (cluster_compare_parse_cmd.stdout | default('') | trim | length > 0)) else 0)), 'source_labels': ((evidence_summary.source_labels | default([])) + (['cluster-compare'] if (cluster_compare_parse_cmd.rc == 0 and (cluster_compare_parse_cmd.stdout | default('') | trim | length > 0)) else [])), 'cluster_compare_path': cluster_compare_path}, recursive=True) }}"
    evidence_limitations: "{{ evidence_limitations | default([]) }}"
  when:
    - cluster_compare_path | default('') | trim | length > 0
    - report_scope_requires_cluster_compare_evidence | default(true) | bool

- name: Parse optional inspect evidence
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/parse_inspect.py"
      - "{{ inspect_path }}"
  register: inspect_parse_cmd
  changed_when: false
  when:
    - inspect_path | default('') | trim | length > 0
    - report_scope_requires_inspect_evidence | default(true) | bool

- name: Merge optional inspect evidence
  vars:
    inspect_payload: "{{ (inspect_parse_cmd.stdout | from_json) if (inspect_parse_cmd.stdout | default('') | trim | length > 0) else {} }}"
    inspect_source:
      name: inspect
      type: resource-directory
      mode: offline
      path: "{{ inspect_path }}"
      parser: parse_inspect.py
  ansible.builtin.set_fact:
    inspect_data: "{{ inspect_payload }}"
    evidence_sources: "{{ evidence_sources + ([inspect_source] if (inspect_parse_cmd.rc == 0 and (inspect_parse_cmd.stdout | default('') | trim | length > 0)) else []) }}"
    evidence_summary: "{{ evidence_summary | combine({'source_count': ((evidence_summary.source_count | default(0) | int) + (1 if (inspect_parse_cmd.rc == 0 and (inspect_parse_cmd.stdout | default('') | trim | length > 0)) else 0)), 'source_labels': ((evidence_summary.source_labels | default([])) + (['inspect'] if (inspect_parse_cmd.rc == 0 and (inspect_parse_cmd.stdout | default('') | trim | length > 0)) else [])), 'inspect_path': inspect_path}, recursive=True) }}"
    evidence_limitations: "{{ evidence_limitations | default([]) }}"
  when:
    - inspect_path | default('') | trim | length > 0
    - report_scope_requires_inspect_evidence | default(true) | bool

- name: Resolve evidence mode
  ansible.builtin.set_fact:
    evidence_mode_resolved: "{{ resolved_mode }}"
    evidence_summary: "{{ evidence_summary | combine({'mode': resolved_mode}, recursive=True) }}"
  vars:
    resolved_mode: >-
      {{
        (
          'hybrid'
          if ((must_gather_path | default('') | trim | length > 0) and (inspect_path | default('') | trim | length > 0))
          else ('must_gather' if (must_gather_path | default('') | trim | length > 0) else 'inspect')
        )
        if (evidence_mode | default('auto')) == 'auto'
        else (evidence_mode | default('auto'))
      }}

