---
- name: Build observability posture summary
  vars:
    monitoring_operator_evidence_present: >-
      {{
        ((clusteroperator_status_map | default({})).get('monitoring', {}) | length) > 0
        and (((clusteroperator_status_map | default({})).get('monitoring', {})).get('available', 'Unknown')) != 'Unknown'
        and (((clusteroperator_status_map | default({})).get('monitoring', {})).get('degraded', 'Unknown')) != 'Unknown'
      }}
    monitoring_operator_healthy: >-
      {{
        (monitoring_operator_evidence_present | bool)
        and
        (((clusteroperator_status_map | default({})).get('monitoring', {})).get('available', 'Unknown')) == 'True'
        and (((clusteroperator_status_map | default({})).get('monitoring', {})).get('degraded', 'False')) != 'True'
      }}
    vendor_managed_observability_vendors: "{{ ((observability_forwarding_summary.metrics_forwarding_vendor_names | default([])) + (observability_forwarding_summary.log_forwarding_vendor_names | default([]))) | unique }}"
    vendor_managed_observability_present: >-
      {{
        (observability_forwarding_summary.vendor_managed_log_forwarding_present | default(false))
        or (observability_forwarding_summary.vendor_managed_metrics_forwarding_present | default(false))
      }}
    vendor_managed_observability_configured: >-
      {{
        (
          (observability_forwarding_summary.vendor_managed_log_forwarding_present | default(false))
          and (
            (observability_forwarding_summary.logs_delivery_verification_status | default('not-configured')) != 'not-configured'
            or (observability_forwarding_summary.application_logs_collected | default(false))
            or (observability_forwarding_summary.infrastructure_logs_collected | default(false))
            or (observability_forwarding_summary.audit_logs_collected | default(false))
          )
        )
        or
        (
          (observability_forwarding_summary.vendor_managed_metrics_forwarding_present | default(false))
          and (
            (observability_forwarding_summary.metrics_delivery_verification_status | default('not-configured')) != 'not-configured'
            or (observability_forwarding_summary.cluster_metrics_delivery_state | default('not-configured')) != 'not-configured'
            or (observability_forwarding_summary.user_workload_metrics_delivery_state | default('not-configured')) != 'not-configured'
          )
        )
      }}
    dynatrace_vendor_context_present: >-
      {{
        (
          ('dynatrace' in (vendor_managed_observability_vendors | default([])))
          or ('dynatrace-operator' in (subscription_packages | default([])))
          or ('dynatrace' in (namespace_names | default([])))
          or (
            (
              ((analysis_graph.crds | default({})).get('items', []) | default([]))
              | selectattr('metadata', 'defined')
              | selectattr('metadata.name', 'defined')
              | map(attribute='metadata.name')
              | map('string')
              | map('lower')
              | select('in', ['dynakubes.dynatrace.com', 'dynakube.dynatrace.com', 'edgeconnects.dynatrace.com', 'edgeconnect.dynatrace.com'])
              | list
              | length
            ) > 0
          )
          or (((analysis_graph.edgeconnects | default({})).get('items', []) | length) > 0)
          or (
            (all_workload_blobs | default([]))
            | map('string')
            | map('lower')
            | select('search', 'dynatrace-operator|dynatrace-webhook')
            | list
            | length
          ) > 0
        ) | bool
      }}
    dynatrace_vendor_healthy: >-
      {{
        (
          not (dynatrace_vendor_context_present | bool)
        ) or (
          (((analysis_graph.dynakubes | default({})).get('items', []) | length) > 0)
          or (((analysis_graph.edgeconnects | default({})).get('items', []) | length) > 0)
          or (
            (all_workload_blobs | default([]))
            | map('string')
            | map('lower')
            | select('search', 'dynakube|oneagent|activegate|dynatrace-otel-collector|dynatrace-logmonitoring|dynatrace-extension-controller|dynatrace-extensions-collector|dynatrace-node-config-collector|dynatrace-oneagent-csi-driver')
            | list
            | length
          ) > 0
        )
      }}
    datadog_vendor_context_present: >-
      {{
        (
          ('datadog' in (vendor_managed_observability_vendors | default([])))
          or ('datadog-operator' in (subscription_packages | default([])))
          or ('datadog' in (namespace_names | default([])))
          or (
            (
              ((analysis_graph.crds | default({})).get('items', []) | default([]))
              | selectattr('metadata', 'defined')
              | selectattr('metadata.name', 'defined')
              | map(attribute='metadata.name')
              | map('string')
              | map('lower')
              | select('in', ['datadogagents.datadoghq.com', 'datadogmetrics.datadoghq.com'])
              | list
              | length
            ) > 0
          )
        ) | bool
      }}
    datadog_vendor_healthy: >-
      {{
        (
          not (datadog_vendor_context_present | bool)
        ) or (
          (((analysis_graph.datadogagents | default({})).get('items', []) | length) > 0)
          or (
            (all_workload_blobs | default([]))
            | map('string')
            | map('lower')
            | select('search', 'datadog-agent|cluster-agent|datadog-cluster-agent|datadog-operator')
            | list
            | length
          ) > 0
        )
      }}
    appdynamics_vendor_context_present: >-
      {{
        (
          ('appdynamics' in (vendor_managed_observability_vendors | default([])))
          or ('appdynamics-operator' in (subscription_packages | default([])))
          or ('appdynamics' in (namespace_names | default([])))
          or (
            (
              ((analysis_graph.crds | default({})).get('items', []) | default([]))
              | selectattr('metadata', 'defined')
              | selectattr('metadata.name', 'defined')
              | map(attribute='metadata.name')
              | map('string')
              | map('lower')
              | select('in', ['clusteragents.appdynamics.com', 'infravizs.appdynamics.com', 'appdynamics.com'])
              | list
              | length
            ) > 0
          )
        ) | bool
      }}
    appdynamics_vendor_healthy: >-
      {{
        (
          not (appdynamics_vendor_context_present | bool)
        ) or (
          (((analysis_graph.clusteragents | default({})).get('items', []) | length) > 0)
          or (((analysis_graph.infravizs | default({})).get('items', []) | length) > 0)
          or (
            (all_workload_blobs | default([]))
            | map('string')
            | map('lower')
            | select('search', 'appdynamics|cluster-agent|infraviz')
            | list
            | length
          ) > 0
        )
      }}
    splunk_vendor_context_present: >-
      {{
        (
          ('splunk' in (vendor_managed_observability_vendors | default([])))
          or ('splunk' in (namespace_names | default([])))
          or (
            (
              ((analysis_graph.crds | default({})).get('items', []) | default([]))
              | selectattr('metadata', 'defined')
              | selectattr('metadata.name', 'defined')
              | map(attribute='metadata.name')
              | map('string')
              | map('lower')
              | select('in', ['splunk.com', 'otelcollectors.opentelemetry.io', 'opentelemetrycollectors.opentelemetry.io'])
              | list
              | length
            ) > 0
          )
        ) | bool
      }}
    splunk_vendor_healthy: >-
      {{
        (
          not (splunk_vendor_context_present | bool)
        ) or (
          (all_workload_blobs | default([]))
          | map('string')
          | map('lower')
          | select('search', 'splunk|otel-collector|opentelemetry-collector')
          | list
          | length
        ) > 0
      }}
    loki_vendor_context_present: >-
      {{
        (
          ('loki' in (vendor_managed_observability_vendors | default([])))
          or ('openshift-logging' in (namespace_names | default([])))
          or ('loki' in (namespace_names | default([])))
          or (
            (
              ((analysis_graph.crds | default({})).get('items', []) | default([]))
              | selectattr('metadata', 'defined')
              | selectattr('metadata.name', 'defined')
              | map(attribute='metadata.name')
              | map('string')
              | map('lower')
              | select('in', ['lokistacks.loki.grafana.com', 'lokis.loki.grafana.com'])
              | list
              | length
            ) > 0
          )
        ) | bool
      }}
    loki_vendor_healthy: >-
      {{
        (
          not (loki_vendor_context_present | bool)
        ) or (
          (((analysis_graph.lokistacks | default({})).get('items', []) | length) > 0)
          or (
            (all_workload_blobs | default([]))
            | map('string')
            | map('lower')
            | select('search', 'loki|promtail|log-collector|vector')
            | list
            | length
          ) > 0
        )
      }}
    vendor_managed_observability_health_entries:
      - name: dynatrace
        present: "{{ dynatrace_vendor_context_present | bool }}"
        healthy: "{{ dynatrace_vendor_healthy | bool }}"
      - name: datadog
        present: "{{ datadog_vendor_context_present | bool }}"
        healthy: "{{ datadog_vendor_healthy | bool }}"
      - name: appdynamics
        present: "{{ appdynamics_vendor_context_present | bool }}"
        healthy: "{{ appdynamics_vendor_healthy | bool }}"
      - name: splunk
        present: "{{ splunk_vendor_context_present | bool }}"
        healthy: "{{ splunk_vendor_healthy | bool }}"
      - name: loki
        present: "{{ loki_vendor_context_present | bool }}"
        healthy: "{{ loki_vendor_healthy | bool }}"
    vendor_managed_observability_unhealthy_vendors: >-
      {{
        []
        + (['dynatrace'] if ((dynatrace_vendor_context_present | bool) and not (dynatrace_vendor_healthy | bool)) else [])
        + (['datadog'] if ((datadog_vendor_context_present | bool) and not (datadog_vendor_healthy | bool)) else [])
        + (['appdynamics'] if ((appdynamics_vendor_context_present | bool) and not (appdynamics_vendor_healthy | bool)) else [])
        + (['splunk'] if ((splunk_vendor_context_present | bool) and not (splunk_vendor_healthy | bool)) else [])
        + (['loki'] if ((loki_vendor_context_present | bool) and not (loki_vendor_healthy | bool)) else [])
      }}
    vendor_managed_observability_all_healthy: "{{ (vendor_managed_observability_unhealthy_vendors | default([]) | length) == 0 }}"
    firing_critical_alert_count: "{{ (firing_alerts_by_severity | default({})).critical | default(0) }}"
    firing_warning_alert_count: >-
      {{
        (firing_alerts | default([]) | length)
        - ((firing_alerts_by_severity | default({})).critical | default(0) | int)
      }}
    warning_event_count: "{{ recent_warning_events | default([]) | length }}"
    warning_event_posture_threshold: "{{ observability_warning_event_threshold | default(10) | int }}"
    log_gap_count: >-
      {{
        (
          (1 if not (observability_forwarding_summary.application_logs_collected | default(false)) else 0)
          + (1 if not (observability_forwarding_summary.infrastructure_logs_collected | default(false)) else 0)
          + (1 if not (observability_forwarding_summary.audit_logs_collected | default(false)) else 0)
          + (1 if (observability_forwarding_summary.application_logs_collected | default(false)) and not (observability_forwarding_summary.application_logs_exported_external | default(false)) else 0)
          + (1 if (observability_forwarding_summary.infrastructure_logs_collected | default(false)) and not (observability_forwarding_summary.infrastructure_logs_exported_external | default(false)) else 0)
          + (1 if (observability_forwarding_summary.audit_logs_collected | default(false)) and not (observability_forwarding_summary.audit_logs_exported_external | default(false)) else 0)
        )
        if (require_cluster_log_forwarder | default(false) | bool)
        else 0
      }}
    metrics_gap_count: >-
      {{
        (1 if ((observability_forwarding_summary.cluster_metrics_remote_write_count | default(0) | int) > 0 and (observability_forwarding_summary.external_cluster_metrics_remote_write_count | default(0) | int) == 0) else 0)
        + (1 if ((observability_forwarding_summary.user_workload_metrics_remote_write_count | default(0) | int) > 0 and (observability_forwarding_summary.external_user_workload_metrics_remote_write_count | default(0) | int) == 0) else 0)
        + (1 if ((observability_forwarding_summary.cluster_metrics_remote_write_count | default(0) | int) == 0 and (require_external_metrics_remote_write | default(false) | bool)) else 0)
      }}
    alerting_gap_count: >-
      {{
        (1 if ((observability_forwarding_summary.alertmanagerconfigs_without_route_receivers | default(0) | int) > 0) else 0)
        + (1 if ((observability_forwarding_summary.external_alert_receiver_count | default(0) | int) > 0 and not (observability_forwarding_summary.alert_routing_to_external_receiver_configured | default(false))) else 0)
        + (1 if ((observability_forwarding_summary.alert_delivery_source_count | default(0) | int) > 0 and (observability_forwarding_summary.external_alert_receiver_count | default(0) | int) == 0) else 0)
        + (1 if (
            ((
              require_external_alert_delivery
              if require_external_alert_delivery is defined
              else ((cluster_health_profile | default({})).get('capabilities', {}).get('external_alert_delivery', {}).get('required', false))
            ) | bool)
            and ((observability_forwarding_summary.alert_delivery_verification_status | default('not-configured')) in ['not-configured', 'missing', 'failed'])
            and not (observability_forwarding_summary.vendor_managed_alerting_present | default(false))
          ) else 0)
      }}
    prometheus_query_applicable: "{{ prometheus_evidence_summary.applicable | default((report_mode_resolved | default('live')) == 'live') | bool }}"
    prometheus_query_collected: "{{ prometheus_evidence_summary.collected | default(false) | bool }}"
    metric_evidence_gap_count: "{{ 1 if (prometheus_query_applicable | bool) and not (prometheus_query_collected | bool) else 0 }}"
    observability_status: >-
      {{
        'CRITICAL'
        if (
          (
            monitoring_operator_evidence_present
            and
            not monitoring_operator_healthy
            and (
              not vendor_managed_observability_configured
              or not (vendor_managed_observability_all_healthy | bool)
            )
          )
          or (firing_critical_alert_count | int) > 0
        )
        else (
          'WARNING'
          if (
            not (monitoring_operator_evidence_present | bool)
            or
            ((not monitoring_operator_healthy) and (monitoring_operator_evidence_present | bool) and vendor_managed_observability_configured)
            or
            (log_gap_count | int) > 0
            or (metrics_gap_count | int) > 0
            or (alerting_gap_count | int) > 0
            or (metric_evidence_gap_count | int) > 0
            or ((insights_archive_findings | default([]) | length) > 0)
            or ((warning_event_count | int) >= (warning_event_posture_threshold | int))
            or (firing_warning_alert_count | int) > 0
          )
          else 'HEALTHY'
        )
      }}
    observability_reason_summary: >-
      {{
        (
          []
          + (['monitoring operator evidence was not collected'] if not (monitoring_operator_evidence_present | bool) else [])
          + (['monitoring operator not healthy and no configured vendor-managed observability telemetry path was identified'] if ((monitoring_operator_evidence_present | bool) and not monitoring_operator_healthy and not vendor_managed_observability_configured) else [])
          + (['monitoring operator not healthy and the configured vendor-managed observability path is not healthy'] if ((monitoring_operator_evidence_present | bool) and not monitoring_operator_healthy and vendor_managed_observability_configured and not (vendor_managed_observability_all_healthy | bool)) else [])
          + (['monitoring operator not healthy but a vendor-managed observability telemetry path is configured'] if ((monitoring_operator_evidence_present | bool) and not monitoring_operator_healthy and vendor_managed_observability_configured and (vendor_managed_observability_all_healthy | bool)) else [])
          + (['vendor-managed observability=' ~ ((vendor_managed_observability_vendors | default([])) | join(','))] if vendor_managed_observability_present else [])
          + (['vendor-managed observability unhealthy=' ~ ((vendor_managed_observability_unhealthy_vendors | default([])) | join(','))] if ((vendor_managed_observability_unhealthy_vendors | default([]) | length) > 0) else [])
          + (['critical firing alerts=' ~ ((firing_critical_alert_count | int) | string)] if (firing_critical_alert_count | int) > 0 else [])
          + (['non-critical firing alerts=' ~ ((firing_warning_alert_count | int) | string)] if (firing_warning_alert_count | int) > 0 else [])
          + (['warning events over threshold=' ~ ((recent_warning_events | default([]) | length) | string)] if (warning_event_count | int) >= (warning_event_posture_threshold | int) else [])
          + (['log forwarding gaps=' ~ ((log_gap_count | int) | string)] if (log_gap_count | int) > 0 else [])
          + (['metrics forwarding gaps=' ~ ((metrics_gap_count | int) | string)] if (metrics_gap_count | int) > 0 else [])
          + (['alert delivery gaps=' ~ ((alerting_gap_count | int) | string)] if (alerting_gap_count | int) > 0 else [])
          + (['prometheus/thanos metric evidence unavailable'] if (metric_evidence_gap_count | int) > 0 else [])
          + (['insights archive findings=' ~ ((insights_archive_findings | default([]) | length) | string)] if ((insights_archive_findings | default([]) | length) > 0) else [])
        ) | join('; ')
      }}
    observability_recommendation: >-
      {{
        (
          'Stabilize observability first: restore the monitoring operator, triage active firing alerts, and treat configured telemetry paths as unverified until alerting, logging, and metrics delivery are confirmed end to end.'
          if observability_status == 'CRITICAL'
          else (
            'Reduce observability risk next: close log, alert-routing, metrics-forwarding, and Prometheus/Thanos evidence gaps, and distinguish externally configured telemetry from actually verified delivery before treating the platform as operationally observable.'
            if observability_status == 'WARNING'
            else 'Observability posture looks acceptable for this run. Keep monitoring healthy, preserve alerting and forwarding configuration, and periodically verify that configured telemetry paths are still delivering as intended.'
          )
        )
      }}
  ansible.builtin.set_fact:
    observability_summary:
      status: "{{ observability_status }}"
      reason_summary: "{{ observability_reason_summary }}"
      recommendation: "{{ observability_recommendation }}"
      monitoring_operator_evidence_present: "{{ monitoring_operator_evidence_present }}"
      monitoring_operator_healthy: "{{ monitoring_operator_healthy }}"
      vendor_managed_observability_present: "{{ vendor_managed_observability_present }}"
      vendor_managed_observability_configured: "{{ vendor_managed_observability_configured }}"
      vendor_managed_observability_vendors: "{{ vendor_managed_observability_vendors }}"
      vendor_managed_observability_all_healthy: "{{ vendor_managed_observability_all_healthy }}"
      vendor_managed_observability_unhealthy_vendors: "{{ vendor_managed_observability_unhealthy_vendors }}"
      vendor_managed_observability_health_entries: "{{ vendor_managed_observability_health_entries }}"
      vendor_managed_log_forwarding_present: "{{ observability_forwarding_summary.vendor_managed_log_forwarding_present | default(false) }}"
      vendor_managed_metrics_forwarding_present: "{{ observability_forwarding_summary.vendor_managed_metrics_forwarding_present | default(false) }}"
      log_forwarding_vendor_names: "{{ observability_forwarding_summary.log_forwarding_vendor_names | default([]) }}"
      metrics_forwarding_vendor_names: "{{ observability_forwarding_summary.metrics_forwarding_vendor_names | default([]) }}"
      firing_alert_count: "{{ firing_alerts | default([]) | length }}"
      firing_critical_alert_count: "{{ firing_critical_alert_count }}"
      firing_noncritical_alert_count: "{{ firing_warning_alert_count }}"
      warning_event_count: "{{ recent_warning_events | default([]) | length }}"
      observability_findings: "{{ observability_findings | default([]) | length }}"
      log_gap_count: "{{ log_gap_count }}"
      metrics_gap_count: "{{ metrics_gap_count }}"
      alerting_gap_count: "{{ alerting_gap_count }}"
      metric_evidence_gap_count: "{{ metric_evidence_gap_count }}"
      prometheus_query_applicable: "{{ prometheus_query_applicable }}"
      prometheus_query_collected: "{{ prometheus_query_collected }}"
      prometheus_query_status: "{{ prometheus_evidence_summary.status | default('not-collected') }}"
      prometheus_query_transport: "{{ prometheus_evidence_summary.transport | default('unavailable') }}"
      prometheus_query_count: "{{ prometheus_evidence_summary.query_count | default(0) }}"
      prometheus_non_empty_query_count: "{{ prometheus_evidence_summary.non_empty_result_count | default(0) }}"
      application_logs_delivery_state: "{{ observability_forwarding_summary.application_logs_delivery_state | default('not-collected') }}"
      infrastructure_logs_delivery_state: "{{ observability_forwarding_summary.infrastructure_logs_delivery_state | default('not-collected') }}"
      audit_logs_delivery_state: "{{ observability_forwarding_summary.audit_logs_delivery_state | default('not-collected') }}"
      logs_delivery_verification_status: "{{ observability_forwarding_summary.logs_delivery_verification_status | default('not-configured') }}"
      cluster_metrics_delivery_state: "{{ observability_forwarding_summary.cluster_metrics_delivery_state | default('not-configured') }}"
      user_workload_metrics_delivery_state: "{{ observability_forwarding_summary.user_workload_metrics_delivery_state | default('not-configured') }}"
      metrics_delivery_verification_status: "{{ observability_forwarding_summary.metrics_delivery_verification_status | default('not-configured') }}"
      alert_delivery_state: "{{ observability_forwarding_summary.alert_delivery_state | default('not-configured') }}"
      alert_delivery_verification_status: "{{ observability_forwarding_summary.alert_delivery_verification_status | default('not-configured') }}"
      alert_delivery_source_count: "{{ observability_forwarding_summary.alert_delivery_source_count | default(0) }}"
      external_alert_receiver_count: "{{ observability_forwarding_summary.external_alert_receiver_count | default(0) }}"
      external_log_output_count: "{{ observability_forwarding_summary.external_log_forwarding_outputs | default([]) | length }}"
      insights_archive_findings: "{{ insights_archive_findings | default([]) | length }}"
