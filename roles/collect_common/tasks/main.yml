---
- name: Define common collection commands
  ansible.builtin.set_fact:
    collection_core_command_names:
      - nodes
      - pods
      - deployments
      - statefulsets
      - daemonsets
      - ingresses
      - persistentvolumes
      - persistentvolumeclaims
    collection_optional_forbidden_command_names:
      - poddisruptionbudgets
      - ingresses
      - serviceaccounts
      - rolebindings
      - clusterrolebindings
      - services
      - endpoints
      - crds
      - namespaces
      - networkpolicies
      - resourcequotas
      - limitranges
      - api_resources
      - secrets
      - configmaps
      - storageclasses
      - warning_events
      - horizontalpodautoscalers
      - servicemonitors
      - podmonitors
    collection_optional_missing_resource_command_names:
      - servicemonitors
      - podmonitors
    collection_commands:
      - name: nodes
        argv: ["{{ kube_cli | default('oc') }}", "get", "nodes", "-o", "json"]
      - name: pods
        argv: ["{{ kube_cli | default('oc') }}", "get", "pods", "-A", "-o", "json"]
      - name: deployments
        argv: ["{{ kube_cli | default('oc') }}", "get", "deployments", "-A", "-o", "json"]
      - name: statefulsets
        argv: ["{{ kube_cli | default('oc') }}", "get", "statefulsets", "-A", "-o", "json"]
      - name: daemonsets
        argv: ["{{ kube_cli | default('oc') }}", "get", "daemonsets", "-A", "-o", "json"]
      - name: poddisruptionbudgets
        argv: ["{{ kube_cli | default('oc') }}", "get", "poddisruptionbudgets.policy", "-A", "-o", "json"]
      - name: ingresses
        argv: ["{{ kube_cli | default('oc') }}", "get", "ingresses.networking.k8s.io", "-A", "-o", "json"]
      - name: serviceaccounts
        argv: ["{{ kube_cli | default('oc') }}", "get", "serviceaccounts", "-A", "-o", "json"]
      - name: rolebindings
        argv: ["{{ kube_cli | default('oc') }}", "get", "rolebindings.rbac.authorization.k8s.io", "-A", "-o", "json"]
      - name: clusterrolebindings
        argv: ["{{ kube_cli | default('oc') }}", "get", "clusterrolebindings.rbac.authorization.k8s.io", "-o", "json"]
      - name: services
        argv: ["{{ kube_cli | default('oc') }}", "get", "services", "-A", "-o", "json"]
      - name: endpoints
        argv: ["{{ kube_cli | default('oc') }}", "get", "endpoints", "-A", "-o", "json"]
      - name: crds
        argv: ["{{ kube_cli | default('oc') }}", "get", "crd", "-o", "json"]
      - name: namespaces
        argv: ["{{ kube_cli | default('oc') }}", "get", "namespaces", "-o", "json"]
      - name: networkpolicies
        argv: ["{{ kube_cli | default('oc') }}", "get", "networkpolicies", "-A", "-o", "json"]
      - name: resourcequotas
        argv: ["{{ kube_cli | default('oc') }}", "get", "resourcequotas", "-A", "-o", "json"]
      - name: limitranges
        argv: ["{{ kube_cli | default('oc') }}", "get", "limitranges", "-A", "-o", "json"]
      - name: api_resources
        argv: ["{{ kube_cli | default('oc') }}", "api-resources", "-o", "wide"]
      - name: secrets
        argv: ["{{ kube_cli | default('oc') }}", "get", "secrets", "-A", "-o", "json"]
      - name: configmaps
        argv: ["{{ kube_cli | default('oc') }}", "get", "configmaps", "-A", "-o", "json"]
      - name: storageclasses
        argv: ["{{ kube_cli | default('oc') }}", "get", "storageclass", "-o", "json"]
      - name: persistentvolumes
        argv: ["{{ kube_cli | default('oc') }}", "get", "pv", "-o", "json"]
      - name: persistentvolumeclaims
        argv: ["{{ kube_cli | default('oc') }}", "get", "pvc", "-A", "-o", "json"]
      - name: warning_events
        argv: ["{{ kube_cli | default('oc') }}", "get", "events", "-A", "--field-selector", "type=Warning", "-o", "json"]
      - name: horizontalpodautoscalers
        argv: ["{{ kube_cli | default('oc') }}", "get", "horizontalpodautoscalers.autoscaling", "-A", "-o", "json"]
      - name: servicemonitors
        argv: ["{{ kube_cli | default('oc') }}", "get", "servicemonitors.monitoring.coreos.com", "-A", "-o", "json", "--ignore-not-found"]
      - name: podmonitors
        argv: ["{{ kube_cli | default('oc') }}", "get", "podmonitors.monitoring.coreos.com", "-A", "-o", "json", "--ignore-not-found"]

- name: Collect common cluster data in parallel
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import os
    import subprocess
    import tempfile
    from concurrent.futures import ThreadPoolExecutor, as_completed

    commands = json.loads(r'''{{ collection_commands | to_json }}''')
    timeout_seconds = int({{ collection_command_timeout_seconds | int }})
    max_workers = min(
        max(1, int({{ effective_collection_parallelism | default(collection_parallelism) | int }})),
        max(1, len(commands)),
    )

    def run_command(spec):
        try:
            proc = subprocess.run(
                spec["argv"],
                capture_output=True,
                text=True,
                timeout=timeout_seconds,
                check=False,
            )
            return {
                "name": spec["name"],
                "rc": proc.returncode,
                "stdout": proc.stdout,
                "stderr": proc.stderr,
                "stdout_lines": proc.stdout.splitlines(),
                "timed_out": False,
            }
        except subprocess.TimeoutExpired as exc:
            return {
                "name": spec["name"],
                "rc": 124,
                "stdout": exc.stdout or "",
                "stderr": f"timed out after {timeout_seconds} seconds",
                "stdout_lines": (exc.stdout or "").splitlines(),
                "timed_out": True,
            }
        except Exception as exc:
            return {
                "name": spec["name"],
                "rc": 1,
                "stdout": "",
                "stderr": str(exc),
                "stdout_lines": [],
                "timed_out": False,
            }

    results = {}
    with ThreadPoolExecutor(max_workers=max_workers) as pool:
        futures = {pool.submit(run_command, spec): spec["name"] for spec in commands}
        for future in as_completed(futures):
            result = future.result()
            results[result["name"]] = result

    output_dir = tempfile.mkdtemp(prefix="cluster-health-collect-common-")
    output_path = os.path.join(output_dir, "collected-commands.json")
    status_path = os.path.join(output_dir, "collected-command-status.json")
    with open(output_path, "w", encoding="utf-8") as handle:
        json.dump(results, handle)
    with open(status_path, "w", encoding="utf-8") as handle:
        json.dump(
            {
                name: {
                    "rc": result.get("rc", 1),
                    "stderr": result.get("stderr", ""),
                    "timed_out": result.get("timed_out", False),
                }
                for name, result in results.items()
            },
            handle,
        )
    print(json.dumps({
        "results_path": output_path,
        "status_path": status_path,
        "command_count": len(commands),
        "max_workers": max_workers,
        "timeout_seconds": timeout_seconds
    }))
    PY
  register: collected_commands_cmd
  changed_when: false
  failed_when: false

- name: Normalize common collection metadata
  ansible.builtin.set_fact:
    collection_run_metadata: "{{ collected_commands_cmd.stdout | from_json if (collected_commands_cmd.rc == 0 and (collected_commands_cmd.stdout | default('') | length > 0)) else {} }}"

- name: Build common collection wrapper failure
  ansible.builtin.set_fact:
    collection_wrapper_failure:
      name: collector-wrapper
      rc: "{{ collected_commands_cmd.rc | default(1) }}"
      timed_out: false
      stderr: >-
        {{
          (
            collected_commands_cmd.stderr
            | default('parallel collector task failed before command results could be loaded', true)
          ) | trim
        }}
  when: collected_commands_cmd.rc | default(1) != 0 or (collection_run_metadata.results_path | default('') | length == 0)

- name: Load common collected command results
  ansible.builtin.set_fact:
    collected_commands: "{{ lookup('file', collection_run_metadata.results_path) | from_json if (collection_run_metadata.results_path | default('') | length > 0) else {} }}"

- name: Load common collected command status
  ansible.builtin.set_fact:
    collected_command_status: "{{ lookup('file', collection_run_metadata.status_path) | from_json if (collection_run_metadata.status_path | default('') | length > 0) else {} }}"

- name: Seed common collection failures with wrapper failure
  ansible.builtin.set_fact:
    assessment_collection_failures: "{{ [collection_wrapper_failure] }}"
  when: collection_wrapper_failure is defined

- name: Build common collection failure list
  ansible.builtin.set_fact:
    assessment_collection_failures: "{{ (assessment_collection_failures | default([])) + [collection_failure_entry] }}"
  loop: "{{ collected_command_status | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    collection_result: "{{ item.value if (item.value is mapping) else {} }}"
    collection_failure_stderr: "{{ collection_result.stderr | default('') | trim }}"
    collection_failure_stderr_lower: "{{ collection_failure_stderr | lower }}"
    optional_forbidden_failure: >-
      {{
        (item.key in (collection_optional_forbidden_command_names | default([])))
        and (
          'forbidden' in collection_failure_stderr_lower
          or 'unauthorized' in collection_failure_stderr_lower
        )
      }}
    optional_missing_resource_failure: >-
      {{
        (item.key in (collection_optional_missing_resource_command_names | default([])))
        and (
          'the server doesn' in collection_failure_stderr_lower
          or 'no matches for kind' in collection_failure_stderr_lower
          or 'not found' in collection_failure_stderr_lower
        )
      }}
    collection_failure_entry:
      name: "{{ item.key }}"
      rc: "{{ collection_result.rc | default(1) }}"
      timed_out: "{{ collection_result.timed_out | default(false) }}"
      stderr: "{{ collection_failure_stderr }}"
  when:
    - (collection_result.rc | default(1) | int) != 0
    - not optional_forbidden_failure
    - not optional_missing_resource_failure
  changed_when: false

- name: Capture common optional permission skips
  ansible.builtin.set_fact:
    assessment_collection_skipped_optional_commands: "{{ existing_optional_skip_entries + [collection_skip_entry] }}"
  loop: "{{ collected_command_status | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    existing_optional_skip_entries: >-
      {{
        assessment_collection_skipped_optional_commands
        if (
          assessment_collection_skipped_optional_commands is defined
          and assessment_collection_skipped_optional_commands is sequence
          and assessment_collection_skipped_optional_commands is not string
        )
        else []
      }}
    collection_result: "{{ item.value if (item.value is mapping) else {} }}"
    collection_failure_stderr: "{{ collection_result.stderr | default('') | trim }}"
    collection_failure_stderr_lower: "{{ collection_failure_stderr | lower }}"
    optional_forbidden_failure: >-
      {{
        (item.key in (collection_optional_forbidden_command_names | default([])))
        and (
          'forbidden' in collection_failure_stderr_lower
          or 'unauthorized' in collection_failure_stderr_lower
        )
      }}
    optional_missing_resource_failure: >-
      {{
        (item.key in (collection_optional_missing_resource_command_names | default([])))
        and (
          'the server doesn' in collection_failure_stderr_lower
          or 'no matches for kind' in collection_failure_stderr_lower
          or 'not found' in collection_failure_stderr_lower
        )
      }}
    collection_skip_entry:
      name: "{{ item.key }}"
      rc: "{{ collection_result.rc | default(1) }}"
      category: "{{ 'optional-not-installed' if optional_missing_resource_failure else 'optional-access-denied' }}"
      detail: "{{ collection_failure_stderr }}"
  when:
    - (collection_result.rc | default(1) | int) != 0
    - optional_forbidden_failure or optional_missing_resource_failure
  changed_when: false

- name: Build common collection summary
  ansible.builtin.set_fact:
    assessment_collection_summary:
      command_count: "{{ collection_run_metadata.command_count | default(collection_commands | length) }}"
      parallelism: "{{ collection_run_metadata.max_workers | default(collection_parallelism | int) }}"
      timeout_seconds: "{{ collection_run_metadata.timeout_seconds | default(collection_command_timeout_seconds | int) }}"
      applicable_command_count: "{{ [0, ((collection_commands | length) - (assessment_collection_skipped_optional_commands | default([]) | length))] | max }}"
      failed_commands: "{{ (collection_commands | length) if collection_wrapper_failure is defined else (assessment_collection_failures | default([]) | length) }}"
      optional_skipped_commands: "{{ assessment_collection_skipped_optional_commands | default([]) | length }}"
      timed_out_commands: "{{ assessment_collection_failures | default([]) | selectattr('timed_out', 'equalto', true) | list | length }}"
      succeeded_commands: "{{ 0 if collection_wrapper_failure is defined else ([0, (collection_commands | length) - (assessment_collection_failures | default([]) | length) - (assessment_collection_skipped_optional_commands | default([]) | length)] | max) }}"
      core_failed_commands: "{{ (collection_core_command_names | length) if collection_wrapper_failure is defined else ((assessment_collection_failures | default([]) | selectattr('name', 'in', collection_core_command_names) | list | length)) }}"

- name: Parse common collected JSON
  ansible.builtin.set_fact:
    api_resources_cmd:
      stdout_lines: "{{ collected_commands.api_resources.stdout_lines | default([]) }}"
      stdout: "{{ collected_commands.api_resources.stdout | default('') }}"
      stderr: "{{ collected_commands.api_resources.stderr | default('') }}"
      rc: "{{ collected_commands.api_resources.rc | default(1) }}"
    nodes: "{{ collected_commands.nodes.stdout | from_json if (collected_commands.nodes.rc | default(1)) == 0 else {'items': []} }}"
    pods: "{{ collected_commands.pods.stdout | from_json if (collected_commands.pods.rc | default(1)) == 0 else {'items': []} }}"
    deployments: "{{ collected_commands.deployments.stdout | from_json if (collected_commands.deployments.rc | default(1)) == 0 else {'items': []} }}"
    statefulsets: "{{ collected_commands.statefulsets.stdout | from_json if (collected_commands.statefulsets.rc | default(1)) == 0 else {'items': []} }}"
    daemonsets: "{{ collected_commands.daemonsets.stdout | from_json if (collected_commands.daemonsets.rc | default(1)) == 0 else {'items': []} }}"
    poddisruptionbudgets: "{{ collected_commands.poddisruptionbudgets.stdout | from_json if (collected_commands.poddisruptionbudgets.rc | default(1)) == 0 else {'items': []} }}"
    ingresses: "{{ collected_commands.ingresses.stdout | from_json if (collected_commands.ingresses.rc | default(1)) == 0 else {'items': []} }}"
    serviceaccounts: "{{ collected_commands.serviceaccounts.stdout | from_json if (collected_commands.serviceaccounts.rc | default(1)) == 0 else {'items': []} }}"
    rolebindings: "{{ collected_commands.rolebindings.stdout | from_json if (collected_commands.rolebindings.rc | default(1)) == 0 else {'items': []} }}"
    clusterrolebindings: "{{ collected_commands.clusterrolebindings.stdout | from_json if (collected_commands.clusterrolebindings.rc | default(1)) == 0 else {'items': []} }}"
    services: "{{ collected_commands.services.stdout | from_json if (collected_commands.services.rc | default(1)) == 0 else {'items': []} }}"
    endpoints: "{{ collected_commands.endpoints.stdout | from_json if (collected_commands.endpoints.rc | default(1)) == 0 else {'items': []} }}"
    crds: "{{ collected_commands.crds.stdout | from_json if (collected_commands.crds.rc | default(1)) == 0 else {'items': []} }}"
    namespaces: "{{ collected_commands.namespaces.stdout | from_json if (collected_commands.namespaces.rc | default(1)) == 0 else {'items': []} }}"
    networkpolicies: "{{ collected_commands.networkpolicies.stdout | from_json if (collected_commands.networkpolicies.rc | default(1)) == 0 else {'items': []} }}"
    resourcequotas: "{{ collected_commands.resourcequotas.stdout | from_json if (collected_commands.resourcequotas.rc | default(1)) == 0 else {'items': []} }}"
    limitranges: "{{ collected_commands.limitranges.stdout | from_json if (collected_commands.limitranges.rc | default(1)) == 0 else {'items': []} }}"
    secrets: "{{ collected_commands.secrets.stdout | from_json if (collected_commands.secrets.rc | default(1)) == 0 else {'items': []} }}"
    configmaps: "{{ collected_commands.configmaps.stdout | from_json if (collected_commands.configmaps.rc | default(1)) == 0 else {'items': []} }}"
    storageclasses: "{{ collected_commands.storageclasses.stdout | from_json if (collected_commands.storageclasses.rc | default(1)) == 0 else {'items': []} }}"
    persistentvolumes: "{{ collected_commands.persistentvolumes.stdout | from_json if (collected_commands.persistentvolumes.rc | default(1)) == 0 else {'items': []} }}"
    persistentvolumeclaims: "{{ collected_commands.persistentvolumeclaims.stdout | from_json if (collected_commands.persistentvolumeclaims.rc | default(1)) == 0 else {'items': []} }}"
    warning_events: "{{ collected_commands.warning_events.stdout | from_json if (collected_commands.warning_events.rc | default(1)) == 0 else {'items': []} }}"
    horizontalpodautoscalers: "{{ collected_commands.horizontalpodautoscalers.stdout | from_json if ((collected_commands.horizontalpodautoscalers.rc | default(1)) == 0 and (collected_commands.horizontalpodautoscalers.stdout | default('') | trim | length > 0)) else {'items': []} }}"
    servicemonitors: "{{ collected_commands.servicemonitors.stdout | from_json if ((collected_commands.servicemonitors.rc | default(1)) == 0 and (collected_commands.servicemonitors.stdout | default('') | trim | length > 0)) else {'items': []} }}"
    podmonitors: "{{ collected_commands.podmonitors.stdout | from_json if ((collected_commands.podmonitors.rc | default(1)) == 0 and (collected_commands.podmonitors.stdout | default('') | trim | length > 0)) else {'items': []} }}"
    routes:
      items: []
    clusteroperators:
      items: []
    clusterversion: {}
    infrastructure: {}
    network_config: {}
    apiserver_config: {}
    proxy_config: {}
    ingress_config: {}
    image_config: {}
    image_registry_config: {}
    image_pruner_config: {}
    dns_config: {}
    oauth_config: {}
    project_config: {}
    imagedigestmirrorsets:
      items: []
    imagetagmirrorsets:
      items: []
    imagecontentsourcepolicies:
      items: []
    catalogsources:
      items: []
    clustercatalogs:
      items: []
    updateservices:
      items: []
    machineconfigpools:
      items: []
    ingresscontrollers:
      items: []
    clusterlogforwarders:
      items: []
    templates:
      items: []
    cluster_monitoring_config: {}
    user_workload_monitoring_config: {}
