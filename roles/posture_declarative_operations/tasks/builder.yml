---
- name: Build declarative operations posture artifact facts
  ansible.builtin.set_fact:
    posture_artifact_key: declarative_operations
    posture_artifact_analysis_summary: "{{ declarative_operations_summary | default({}) }}"
    posture_artifact_findings:
      declarative_operations_summary: "{{ declarative_operations_summary | default({}) }}"
    posture_artifact_render_inputs:
      declarative_operations_summary: "{{ declarative_operations_summary | default({}) }}"
    posture_artifact_collection_inputs:
      gitops_present: "{{ (declarative_operations_summary | default({})).get('gitops_present', false) }}"
      argocd_count: "{{ (declarative_operations_summary | default({})).get('argocd_count', 0) }}"
      gitops_application_count: "{{ (declarative_operations_summary | default({})).get('gitops_application_count', 0) }}"
      gitops_repo_backed_application_count: "{{ (declarative_operations_summary | default({})).get('gitops_repo_backed_application_count', 0) }}"
      gitops_automated_sync_application_count: "{{ (declarative_operations_summary | default({})).get('gitops_automated_sync_application_count', 0) }}"
      gitops_appproject_count: "{{ (declarative_operations_summary | default({})).get('gitops_appproject_count', 0) }}"
      identity_provider_count: "{{ (declarative_operations_summary | default({})).get('identity_provider_count', 0) }}"
      backup_schedule_count: "{{ (declarative_operations_summary | default({})).get('backup_schedule_count', 0) }}"
      successful_backup_count: "{{ (declarative_operations_summary | default({})).get('successful_backup_count', 0) }}"
      machinehealthcheck_count: "{{ (declarative_operations_summary | default({})).get('machinehealthcheck_count', 0) }}"
      day2_check_count: "{{ (declarative_operations_summary | default({})).get('day2_check_count', 0) }}"
      capability_check_warning_count: "{{ (declarative_operations_summary | default({})).get('capability_check_warning_count', 0) }}"
    posture_artifact_section_fields:
      summary: "{{ declarative_operations_summary | default({}) }}"
      recommendations: "{{ (declarative_operations_summary | default({})).get('recommendation', 'Review declarative operations evidence, managed-cluster registration, and supporting identity, backup, machine-remediation, and lifecycle context before treating declarative operations as strong.') }}"
      declarative_operations_summary: "{{ declarative_operations_summary | default({}) }}"
