---
- name: Check for optional local ATP overrides
  ansible.builtin.stat:
    path: "{{ role_path }}/vars/main.yaml"
  register: atp_local_overrides_file
  tags: [always]

- name: Load optional local ATP overrides
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/main.yaml"
  when: atp_local_overrides_file.stat.exists
  tags: [always]


- name: Initialize ATP execution facts and results
  ansible.builtin.set_fact:
    atp_results: []
    atp_start_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
  tags: [always, general, telco]

- name: Ensure the ATP report directory exists
  ansible.builtin.file:
    path: "{{ atp_report_dir }}"
    state: directory
    mode: "0755"
  tags: [always, general, telco]

- name: Verify oc CLI authentication
  ansible.builtin.command: oc whoami
  register: oc_whoami_check
  changed_when: false
  failed_when: false
  tags: [always, general, telco]

- name: Require an authenticated oc CLI session
  ansible.builtin.fail:
    msg: "The oc CLI is not logged into a cluster. Run oc login with the required privileges before executing the ATP."
  when: oc_whoami_check.rc != 0
  tags: [always, general, telco]

- name: Execute the ATP case loader
  ansible.builtin.include_tasks: main_cases.yml
  tags: [general, telco, atp]

- name: Record ATP completion timestamp
  ansible.builtin.set_fact:
    atp_end_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
  tags: [always, general, telco]

- name: Render the ATP Markdown report
  ansible.builtin.template:
    src: atp_report.md.j2
    dest: "{{ atp_report_file }}"
    mode: "0644"
  tags: [always, general, telco]

- name: Render the ATP HTML report
  ansible.builtin.template:
    src: atp_report.html.j2
    dest: "{{ atp_report_html_file }}"
    mode: "0644"
  tags: [always, general, telco]

- name: Display the ATP execution summary
  ansible.builtin.debug:
    msg:
      - "ATP execution completed"
      - "Total test cases: {{ atp_results | length }}"
      - "Pass: {{ atp_results | selectattr('status', 'equalto', 'Pass') | list | length }}"
      - "Fail: {{ atp_results | selectattr('status', 'equalto', 'Fail') | list | length }}"
      - "Skipped: {{ atp_results | selectattr('status', 'equalto', 'Skipped') | list | length }}"
      - "Markdown report: {{ atp_report_file }}"
      - "HTML report: {{ atp_report_html_file }}"
  tags: [always, general, telco]
