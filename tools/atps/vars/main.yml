---
# Directorio de salida del reporte
atp_report_dir: "{{ playbook_dir }}/../reports"
atp_report_file: "{{ atp_report_dir }}/ATP-Report-{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}.md"
cluster_domain: "TBD"

# Switches para omitir o habilitar casos de prueba (Día 1 / Disruptivos apagados por defecto si se desea)
# Por defecto todos activos:
atp_run_all: true

# Control individual para casos destructivos/reboots
run_tc26_sanity_reboot: false        # Sanity Reboot del cluster completo
run_tc27_reboot_worker: false        # Reboot de nodo worker
run_tc62_etcd_restore: false         # Restauración destructiva de ETCD

# Casos que requieren interacción manual o insumos externos (pueden ser skipped con tags o variables)
run_tc28_install_operator: true
run_tc49_create_htpasswd_user: true
run_tc52_ldap_access: true
