            {%- endif -%}
          {%- endfor -%}
          {%- set conjur_workload_present = false -%}
          {%- for blob in (all_workload_blobs | default([])) -%}
            {%- set lowered = blob | string | lower -%}
            {%- if 'conjur' in lowered or 'conjur-oss' in lowered or 'conjur-follower' in lowered or 'conjur-appliance' in lowered or 'authn-k8s' in lowered or 'conjur-authn' in lowered or 'secretless' in lowered or 'secrets-provider-for-k8s' in lowered or 'conjur-csi-provider' in lowered -%}
              {%- set conjur_workload_present = true -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set conjur_secretproviderclass_count = 0 -%}
          {%- for item in ((analysis_graph.secretproviderclasses | default({})).get('items', []) | default([])) -%}
            {%- set spec = item.get('spec') or {} -%}
            {%- set provider = ((spec.get('provider') or '') | string | lower | trim) -%}
            {%- set params_blob = (((spec.get('parameters') or {}) | to_json) | lower) -%}
            {%- if provider == 'conjur' or 'conjur.org' in params_blob or 'cyberark' in params_blob -%}
              {%- set conjur_secretproviderclass_count = conjur_secretproviderclass_count + 1 -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set conjur_secretproviderclass_present = conjur_secretproviderclass_count > 0 -%}
          {%- set cyberark_conjur_present = conjur_workload_present or conjur_secretproviderclass_present or conjur_namespace_present -%}
          {%- set cyberark_conjur_healthy = conjur_workload_present or conjur_secretproviderclass_present -%}
          {%- set capability_status = (
                'OK'
                if cyberark_conjur_healthy
                else ('WARNING' if (cyberark_conjur_present or (section.required | default(false))) else 'INFO')
              ) -%}
          {%- set top_detail = (
                'conjurNamespaces=' ~ (conjur_namespace_present | string)
                ~ ' conjurWorkloadPresent=' ~ (conjur_workload_present | string)
                ~ ' conjurSecretProviderClasses=' ~ (conjur_secretproviderclass_count | string)
              ) -%}
          {%- set recommended_action = (
                'No CyberArk Conjur remediation is required for this capability.'
                if capability_status == 'OK'
                else (
                  'Partial CyberArk Conjur context was found, but no Conjur workload footprint or Conjur-backed SecretProviderClass was detected to demonstrate an active secrets-management path. Review Conjur server, authenticator, Secretless, or CSI provider rollout.'
                  if cyberark_conjur_present
                  else 'No CyberArk Conjur namespace, workload, or Conjur-backed SecretProviderClass footprint was detected. If Conjur is the intended secrets-management path, review namespace, workload, and Secrets Store CSI integration evidence.'
                )
              ) -%}
          {%- set findings = (
                []
                if capability_status == 'OK'
                else [{
                  'severity': ('warning' if capability_status == 'WARNING' else 'info'),
                  'issue': (
                    'Partial CyberArk Conjur signals found without active secret-delivery footprint'
                    if cyberark_conjur_present
