---
- name: Build kubelet configuration governance capability artifact facts
  vars:
    day2_kubelet_configuration_governance_section_current: "{{ (day2_capability_sections_by_key | default({})).get('kubelet_configuration_governance', {}) }}"
    kubelet_configuration_governance_required_current: "{{ (day2_kubelet_configuration_governance_section_current.required | default(false)) | bool }}"
    kubelet_configuration_governance_present_current: "{{ ((day2_posture_summary | default({})).get('kubelet_configuration_governance_present', false)) | bool }}"
    kubelet_configuration_governance_healthy_current: "{{ ((day2_posture_summary | default({})).get('kubelet_configuration_governance_healthy', false)) | bool }}"
    kubeletconfig_count_current: "{{ ((day2_posture_summary | default({})).get('kubeletconfig_count', 0)) | int }}"
    kubeletconfig_targeted_count_current: "{{ ((day2_posture_summary | default({})).get('kubeletconfig_targeted_count', 0)) | int }}"
    kubeletconfig_density_tuned_count_current: "{{ ((day2_posture_summary | default({})).get('kubeletconfig_density_tuned_count', 0)) | int }}"
    kubeletconfig_reservation_tuned_count_current: "{{ ((day2_posture_summary | default({})).get('kubeletconfig_reservation_tuned_count', 0)) | int }}"
    kubeletconfig_eviction_tuned_count_current: "{{ ((day2_posture_summary | default({})).get('kubeletconfig_eviction_tuned_count', 0)) | int }}"
    kubeletconfig_runtime_policy_tuned_count_current: "{{ ((day2_posture_summary | default({})).get('kubeletconfig_runtime_policy_tuned_count', 0)) | int }}"
    kubelet_configuration_governance_reason_summary_current: >-
      {{
        (
          day2_kubelet_configuration_governance_section_current.top_detail
          | default('')
          | string
          | trim
        )
        or (
          'kubeletConfigs=' ~ (kubeletconfig_count_current | string)
          ~ ' targetedConfigs=' ~ (kubeletconfig_targeted_count_current | string)
          ~ ' densityTuned=' ~ (kubeletconfig_density_tuned_count_current | string)
          ~ ' reservationTuned=' ~ (kubeletconfig_reservation_tuned_count_current | string)
          ~ ' evictionTuned=' ~ (kubeletconfig_eviction_tuned_count_current | string)
          ~ ' runtimePolicyTuned=' ~ (kubeletconfig_runtime_policy_tuned_count_current | string)
        )
      }}
    kubelet_configuration_governance_recommended_action_current: >-
      {{
        'Confirm the intended kubelet pod-density, reservation, eviction, and runtime-policy controls remain targeted to the right node pools.'
        if kubelet_configuration_governance_present_current
        else 'If explicit kubelet tuning is expected, define and target KubeletConfig resources for the intended MachineConfigPools.'
      }}
    kubelet_configuration_governance_partial_signal_current: >-
      {{
        (kubeletconfig_targeted_count_current | int) > 0
        or (kubeletconfig_density_tuned_count_current | int) > 0
        or (kubeletconfig_reservation_tuned_count_current | int) > 0
        or (kubeletconfig_eviction_tuned_count_current | int) > 0
        or (kubeletconfig_runtime_policy_tuned_count_current | int) > 0
      }}
    kubelet_configuration_governance_checks_current:
      - name: KubeletConfig resources present
        status: "{{ 'OK' if (kubelet_configuration_governance_present_current | bool) else ('WARN' if (kubelet_configuration_governance_required_current | bool) else 'INFO') }}"
        detail: "kubeletConfigs={{ kubeletconfig_count_current | int }}"
      - name: MachineConfigPool targeting present
        status: >-
          {{
            'OK'
            if (kubeletconfig_targeted_count_current | int) > 0
            else ('WARN' if (kubelet_configuration_governance_present_current | bool) else 'INFO')
          }}
        detail: "targetedConfigs={{ kubeletconfig_targeted_count_current | int }}"
      - name: Pod-density settings explicitly configured
        status: >-
          {{
            'OK'
            if (kubeletconfig_density_tuned_count_current | int) > 0
            else ('WARN' if (kubelet_configuration_governance_present_current | bool) else 'INFO')
          }}
        detail: "densityTuned={{ kubeletconfig_density_tuned_count_current | int }}"
      - name: Node reservation settings explicitly configured
        status: >-
          {{
            'OK'
            if (kubeletconfig_reservation_tuned_count_current | int) > 0
            else ('WARN' if (kubelet_configuration_governance_present_current | bool) else 'INFO')
          }}
        detail: "reservationTuned={{ kubeletconfig_reservation_tuned_count_current | int }}"
      - name: Eviction or runtime policy settings explicitly configured
        status: >-
          {{
            'OK'
            if ((kubeletconfig_eviction_tuned_count_current | int) > 0 or (kubeletconfig_runtime_policy_tuned_count_current | int) > 0)
            else ('WARN' if (kubelet_configuration_governance_present_current | bool) else 'INFO')
          }}
        detail: >-
          {{
            'evictionTuned=' ~ (kubeletconfig_eviction_tuned_count_current | string)
            ~ ' runtimePolicyTuned=' ~ (kubeletconfig_runtime_policy_tuned_count_current | string)
          }}
    kubelet_configuration_governance_findings_current: >-
      {{
        ([] +
        ([{
          'capability': 'kubelet_configuration_governance',
          'issue': 'prod-day2-kubelet-configuration-governance-missing',
          'severity': 'warning',
          'source': 'KubeletConfig resource inventory',
          'detail': 'No KubeletConfig resource footprint was detected for explicit kubelet tuning governance.',
          'recommended_action': kubelet_configuration_governance_recommended_action_current,
          'docs': ((day2_kubelet_configuration_governance_section_current.docs | default([])) | string)
        }] if (kubelet_configuration_governance_required_current | bool) and not (kubelet_configuration_governance_present_current | bool) else []) +
        ([{
          'capability': 'kubelet_configuration_governance',
          'issue': 'prod-day2-kubelet-configuration-governance-targeting-missing',
          'severity': ('warning' if (kubelet_configuration_governance_present_current | bool) else 'info'),
          'source': 'KubeletConfig resource inventory',
          'detail': 'No MachineConfigPool targeting signal was found for KubeletConfig resources.',
          'recommended_action': kubelet_configuration_governance_recommended_action_current,
          'docs': ((day2_kubelet_configuration_governance_section_current.docs | default([])) | string)
        }] if (kubelet_configuration_governance_present_current | bool) and (kubeletconfig_targeted_count_current | int) == 0 else []) +
        ([{
          'capability': 'kubelet_configuration_governance',
          'issue': 'prod-day2-kubelet-configuration-governance-density-missing',
          'severity': ('warning' if (kubelet_configuration_governance_partial_signal_current | bool) else 'info'),
          'source': 'KubeletConfig resource inventory',
          'detail': 'No explicit maxPods or podsPerCore setting was found in KubeletConfig resources.',
          'recommended_action': kubelet_configuration_governance_recommended_action_current,
          'docs': ((day2_kubelet_configuration_governance_section_current.docs | default([])) | string)
        }] if (kubelet_configuration_governance_present_current | bool) and (kubeletconfig_density_tuned_count_current | int) == 0 else []) +
        ([{
          'capability': 'kubelet_configuration_governance',
          'issue': 'prod-day2-kubelet-configuration-governance-reservation-missing',
          'severity': ('warning' if (kubelet_configuration_governance_partial_signal_current | bool) else 'info'),
          'source': 'KubeletConfig resource inventory',
          'detail': 'No explicit kubeReserved, systemReserved, or reservedSystemCPUs setting was found in KubeletConfig resources.',
          'recommended_action': kubelet_configuration_governance_recommended_action_current,
          'docs': ((day2_kubelet_configuration_governance_section_current.docs | default([])) | string)
        }] if (kubelet_configuration_governance_present_current | bool) and (kubeletconfig_reservation_tuned_count_current | int) == 0 else []) +
        ([{
          'capability': 'kubelet_configuration_governance',
          'issue': 'prod-day2-kubelet-configuration-governance-eviction-runtime-missing',
          'severity': ('warning' if (kubelet_configuration_governance_partial_signal_current | bool) else 'info'),
          'source': 'KubeletConfig resource inventory',
          'detail': 'No explicit eviction or runtime policy setting was found in KubeletConfig resources.',
          'recommended_action': kubelet_configuration_governance_recommended_action_current,
          'docs': ((day2_kubelet_configuration_governance_section_current.docs | default([])) | string)
        }] if (kubelet_configuration_governance_present_current | bool) and (kubeletconfig_eviction_tuned_count_current | int) == 0 and (kubeletconfig_runtime_policy_tuned_count_current | int) == 0 else []))
      }}
    kubelet_configuration_governance_section_override_current: >-
      {{
        (day2_kubelet_configuration_governance_section_current | default({}))
        | combine(
            {
              'accounting_state': 'assessed',
              'check_count': (kubelet_configuration_governance_checks_current | length),
              'finding_count': (kubelet_configuration_governance_findings_current | length),
              'checks': kubelet_configuration_governance_checks_current,
              'findings': kubelet_configuration_governance_findings_current,
              'status': (
                'OK'
                if kubelet_configuration_governance_healthy_current
                else ('WARNING' if ((kubelet_configuration_governance_present_current | bool) or (kubelet_configuration_governance_required_current | bool)) else 'INFO')
              ),
              'top_detail': (
                kubelet_configuration_governance_reason_summary_current
                if kubelet_configuration_governance_present_current
                else 'no KubeletConfig resource footprint was detected for explicit kubelet tuning governance'
              ),
              'recommended_action': kubelet_configuration_governance_recommended_action_current
            },
            recursive=True
          )
      }}
  ansible.builtin.set_fact:
    capability_artifact_key: kubelet_configuration_governance
    capability_artifact_section_override: "{{ kubelet_configuration_governance_section_override_current }}"
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      accounting_state: assessed
      check_count: "{{ (kubelet_configuration_governance_checks_current | length) | int }}"
      finding_count: "{{ (kubelet_configuration_governance_findings_current | length) | int }}"
      kubelet_configuration_governance_present: "{{ kubelet_configuration_governance_present_current | bool }}"
      kubelet_configuration_governance_healthy: "{{ kubelet_configuration_governance_healthy_current | bool }}"
      kubeletconfig_count: "{{ kubeletconfig_count_current | int }}"
      kubeletconfig_targeted_count: "{{ kubeletconfig_targeted_count_current | int }}"
      kubeletconfig_density_tuned_count: "{{ kubeletconfig_density_tuned_count_current | int }}"
      kubeletconfig_reservation_tuned_count: "{{ kubeletconfig_reservation_tuned_count_current | int }}"
      kubeletconfig_eviction_tuned_count: "{{ kubeletconfig_eviction_tuned_count_current | int }}"
      kubeletconfig_runtime_policy_tuned_count: "{{ kubeletconfig_runtime_policy_tuned_count_current | int }}"
      status_summary: "{{ kubelet_configuration_governance_section_override_current.status }}"
      reason_summary: "{{ kubelet_configuration_governance_section_override_current.top_detail }}"
    capability_artifact_render_inputs:
      day2_kubelet_configuration_governance_section: "{{ kubelet_configuration_governance_section_override_current }}"
    capability_artifact_collection_inputs:
      kubelet_configuration_governance_present: "{{ kubelet_configuration_governance_present_current | bool }}"
      kubelet_configuration_governance_healthy: "{{ kubelet_configuration_governance_healthy_current | bool }}"
      kubeletconfig_count: "{{ kubeletconfig_count_current | int }}"
      kubeletconfig_targeted_count: "{{ kubeletconfig_targeted_count_current | int }}"
      kubeletconfig_density_tuned_count: "{{ kubeletconfig_density_tuned_count_current | int }}"
      kubeletconfig_reservation_tuned_count: "{{ kubeletconfig_reservation_tuned_count_current | int }}"
      kubeletconfig_eviction_tuned_count: "{{ kubeletconfig_eviction_tuned_count_current | int }}"
      kubeletconfig_runtime_policy_tuned_count: "{{ kubeletconfig_runtime_policy_tuned_count_current | int }}"
