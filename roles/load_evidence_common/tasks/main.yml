---
- name: Stat optional case bundle path
  ansible.builtin.stat:
    path: "{{ case_bundle_path }}"
  register: case_bundle_path_stat
  when: case_bundle_path | default('') | trim | length > 0

- name: Fail when case bundle path is missing
  ansible.builtin.assert:
    that:
      - case_bundle_path_stat.stat.exists
      - case_bundle_path_stat.stat.isdir
    fail_msg: "case_bundle_path does not exist or is not a directory."
  when: case_bundle_path | default('') | trim | length > 0

- name: Discover case bundle files
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/discover_case_bundle.py"
      - "{{ case_bundle_path }}"
  register: case_bundle_discovery
  changed_when: false
  when: case_bundle_path | default('') | trim | length > 0

- name: Parse case bundle discovery JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_json_payload.py"
      - --stdin
    stdin: "{{ case_bundle_discovery.stdout | default('') }}"
  register: case_bundle_discovery_parse_cmd
  changed_when: false
  when: case_bundle_path | default('') | trim | length > 0

- name: Resolve evidence paths from case bundle
  ansible.builtin.set_fact:
    must_gather_path: "{{ resolved_must_gather_path }}"
    cluster_compare_path: "{{ resolved_cluster_compare_path }}"
    managed_gates_path: "{{ resolved_managed_gates_path }}"
    inspect_path: "{{ resolved_inspect_path }}"
    advisor_export_path: "{{ resolved_advisor_export_path }}"
    insights_archive_path: "{{ resolved_insights_archive_path }}"
    sosreport_paths: "{{ resolved_sosreport_paths }}"
  vars:
    case_bundle_discovery_payload: "{{ (case_bundle_discovery_parse_cmd.stdout | from_json) if (case_bundle_discovery_parse_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'case bundle discovery parser returned no output'} }}"
    bundle_data: "{{ case_bundle_discovery_payload.data if (case_bundle_discovery_payload.ok | default(false)) else {} }}"
    resolved_must_gather_path: "{{ must_gather_path if (must_gather_path | default('') | trim | length > 0) else (bundle_data.must_gather_path | default('')) }}"
    resolved_cluster_compare_path: "{{ cluster_compare_path if (cluster_compare_path | default('') | trim | length > 0) else (bundle_data.cluster_compare_path | default('')) }}"
    resolved_managed_gates_path: "{{ managed_gates_path if (managed_gates_path | default('') | trim | length > 0) else (bundle_data.managed_gates_path | default('')) }}"
    resolved_inspect_path: "{{ inspect_path if (inspect_path | default('') | trim | length > 0) else (bundle_data.inspect_path | default('')) }}"
    resolved_advisor_export_path: "{{ advisor_export_path if (advisor_export_path | default('') | trim | length > 0) else (bundle_data.advisor_export_path | default('')) }}"
    resolved_insights_archive_path: "{{ insights_archive_path if (insights_archive_path | default('') | trim | length > 0) else (bundle_data.insights_archive_path | default('')) }}"
    resolved_sosreport_paths: "{{ sosreport_paths if (sosreport_paths | default([]) | length > 0) else (bundle_data.sosreport_paths | default([])) }}"
  when: case_bundle_path | default('') | trim | length > 0

- name: Validate case bundle discovery JSON
  vars:
    case_bundle_discovery_payload: "{{ (case_bundle_discovery_parse_cmd.stdout | from_json) if (case_bundle_discovery_parse_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'case bundle discovery parser returned no output'} }}"
  ansible.builtin.assert:
    that:
      - case_bundle_discovery_payload.ok | default(false)
    fail_msg: "Case bundle discovery returned invalid JSON. {{ case_bundle_discovery_payload.error | default('Unknown parse error.') }}"
  when: case_bundle_path | default('') | trim | length > 0

- name: Record case bundle in evidence summary
  ansible.builtin.set_fact:
    evidence_summary: "{{ (evidence_summary | default({'source_count': 0, 'source_labels': []})) | combine({'case_bundle_path': case_bundle_path}, recursive=True) }}"
  when: case_bundle_path | default('') | trim | length > 0

- name: Normalize sosreport paths input
  ansible.builtin.set_fact:
    sosreport_paths: >-
      {{
        normalized_sosreport_paths
      }}
  vars:
    raw_sosreport_paths: >-
      {{
        ((sosreport_paths | default('[]')) | from_yaml)
        if (sosreport_paths is string)
        else (sosreport_paths | default([]))
      }}
    normalized_sosreport_paths: >-
      {{
        []
        if (raw_sosreport_paths is none)
        else (
          [raw_sosreport_paths]
          if (raw_sosreport_paths is string)
          else raw_sosreport_paths
        )
      }}
  when: sosreport_paths is defined

- name: Validate evidence mode
  ansible.builtin.assert:
    that:
      - evidence_mode | default('auto') in ['auto', 'must_gather', 'inspect', 'hybrid']
    fail_msg: "Set evidence_mode to one of: auto, must_gather, inspect, hybrid."

- name: Validate evidence input presence
  ansible.builtin.assert:
    that:
      - (must_gather_path | default('') | trim | length > 0) or (inspect_path | default('') | trim | length > 0)
    fail_msg: "Set must_gather_path, inspect_path, or both."

- name: Stat must-gather path
  ansible.builtin.stat:
    path: "{{ must_gather_path }}"
  register: must_gather_path_stat
  when: must_gather_path | default('') | trim | length > 0

- name: Stat optional cluster-compare path
  ansible.builtin.stat:
    path: "{{ cluster_compare_path }}"
  register: cluster_compare_path_stat
  when: cluster_compare_path | default('') | trim | length > 0

- name: Stat optional inspect path
  ansible.builtin.stat:
    path: "{{ inspect_path }}"
  register: inspect_path_stat
  when: inspect_path | default('') | trim | length > 0

- name: Stat optional managed gates path
  ansible.builtin.stat:
    path: "{{ managed_gates_path }}"
  register: managed_gates_path_stat
  when: managed_gates_path | default('') | trim | length > 0

- name: Stat optional sosreport paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ sosreport_paths | default([]) }}"
  register: sosreport_path_stats
  when: (sosreport_paths | default([]) | length) > 0

- name: Stat optional advisor export path
  ansible.builtin.stat:
    path: "{{ advisor_export_path }}"
  register: advisor_export_path_stat
  when: advisor_export_path | default('') | trim | length > 0

- name: Stat optional insights archive path
  ansible.builtin.stat:
    path: "{{ insights_archive_path }}"
  register: insights_archive_path_stat
  when: insights_archive_path | default('') | trim | length > 0

- name: Fail when must-gather path is missing
  ansible.builtin.assert:
    that:
      - must_gather_path_stat.stat.exists
      - must_gather_path_stat.stat.isdir
    fail_msg: "must_gather_path does not exist or is not a directory."
  when: must_gather_path | default('') | trim | length > 0

- name: Fail when cluster-compare path is missing
  ansible.builtin.assert:
    that:
      - cluster_compare_path_stat.stat.exists
      - cluster_compare_path_stat.stat.isreg
    fail_msg: "cluster_compare_path does not exist or is not a file."
  when: cluster_compare_path | default('') | trim | length > 0

- name: Fail when inspect path is missing
  ansible.builtin.assert:
    that:
      - inspect_path_stat.stat.exists
      - inspect_path_stat.stat.isdir
    fail_msg: "inspect_path does not exist or is not a directory."
  when: inspect_path | default('') | trim | length > 0

- name: Fail when managed gates path is missing
  ansible.builtin.assert:
    that:
      - managed_gates_path_stat.stat.exists
      - managed_gates_path_stat.stat.isreg
    fail_msg: "managed_gates_path does not exist or is not a file."
  when: managed_gates_path | default('') | trim | length > 0

- name: Fail when any sosreport path is missing
  ansible.builtin.assert:
    that:
      - (sosreport_path_stats.results | selectattr('stat.exists', 'equalto', false) | list | length) == 0
    fail_msg: "One or more sosreport_paths do not exist."
  when: (sosreport_paths | default([]) | length) > 0

- name: Fail when advisor export path is missing
  ansible.builtin.assert:
    that:
      - advisor_export_path_stat.stat.exists
      - advisor_export_path_stat.stat.isreg
    fail_msg: "advisor_export_path does not exist or is not a file."
  when: advisor_export_path | default('') | trim | length > 0

- name: Fail when insights archive path is missing
  ansible.builtin.assert:
    that:
      - insights_archive_path_stat.stat.exists
      - insights_archive_path_stat.stat.isdir
    fail_msg: "insights_archive_path does not exist or is not a directory."
  when: insights_archive_path | default('') | trim | length > 0

- name: Parse must-gather evidence summary
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/parse_must_gather.py"
      - "{{ must_gather_path }}"
  register: must_gather_parse_cmd
  changed_when: false
  when: must_gather_path | default('') | trim | length > 0

- name: Parse must-gather evidence JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_json_payload.py"
      - --stdin
    stdin: "{{ must_gather_parse_cmd.stdout | default('') }}"
  register: must_gather_parse_json_cmd
  changed_when: false
  when: must_gather_path | default('') | trim | length > 0

- name: Normalize must-gather evidence data
  vars:
    must_gather_payload: "{{ (must_gather_parse_json_cmd.stdout | from_json) if (must_gather_parse_json_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'must-gather parser returned no output'} }}"
  ansible.builtin.set_fact:
    must_gather_inventory: "{{ must_gather_payload.data if (must_gather_payload.ok | default(false)) else {} }}"
    evidence_sources: "{{ (evidence_sources | default([])) + [{'name': 'must-gather', 'type': 'archive-directory', 'mode': 'offline', 'path': must_gather_path, 'parser': 'parse_must_gather.py'}] }}"
  when: must_gather_path | default('') | trim | length > 0

- name: Merge must-gather evidence summary facts
  ansible.builtin.set_fact:
    evidence_summary: "{{ (evidence_summary | default({'source_count': 0, 'source_labels': []})) | combine({'source_count': ((evidence_summary.source_count | default(0) | int) + 1), 'source_labels': ((evidence_summary.source_labels | default([])) + ['must-gather']), 'must_gather_path': must_gather_path, 'must_gather_root_entries': (must_gather_inventory.summary.root_entry_count | default(0)), 'namespaced_resource_files': (must_gather_inventory.summary.namespaced_resource_file_count | default(0)), 'cluster_resource_files': (must_gather_inventory.summary.cluster_resource_file_count | default(0)), 'event_files': (must_gather_inventory.summary.event_file_count | default(0)), 'log_files': (must_gather_inventory.summary.log_file_count | default(0)), 'has_cluster_scoped_resources': (must_gather_inventory.summary.has_cluster_scoped_resources | default(false)), 'has_namespaces_tree': (must_gather_inventory.summary.has_namespaces_tree | default(false)), 'parser_version': (must_gather_inventory.summary.parser_version | default('1'))}, recursive=True) }}"
  when: must_gather_path | default('') | trim | length > 0

- name: Validate must-gather evidence JSON
  vars:
    must_gather_payload: "{{ (must_gather_parse_json_cmd.stdout | from_json) if (must_gather_parse_json_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'must-gather parser returned no output'} }}"
  ansible.builtin.assert:
    that:
      - must_gather_payload.ok | default(false)
    fail_msg: "Must-gather parser returned invalid JSON. {{ must_gather_payload.error | default('Unknown parse error.') }}"
  when: must_gather_path | default('') | trim | length > 0

- name: Parse optional etcd-ocp-diag evidence from must-gather
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/parse_etcd_ocp_diag.py"
      - "{{ must_gather_path }}"
  register: etcd_ocp_diag_parse_cmd
  changed_when: false
  when: must_gather_path | default('') | trim | length > 0

- name: Parse optional etcd-ocp-diag JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_json_payload.py"
      - --stdin
    stdin: "{{ etcd_ocp_diag_parse_cmd.stdout | default('') }}"
  register: etcd_ocp_diag_parse_json_cmd
  changed_when: false
  when: must_gather_path | default('') | trim | length > 0

- name: Merge optional etcd-ocp-diag evidence facts
  vars:
    etcd_ocp_diag_payload: "{{ (etcd_ocp_diag_parse_json_cmd.stdout | from_json) if (etcd_ocp_diag_parse_json_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'etcd-ocp-diag parser returned no output'} }}"
  ansible.builtin.set_fact:
    etcd_ocp_diag_data: "{{ etcd_ocp_diag_payload.data if (etcd_ocp_diag_payload.ok | default(false)) else {} }}"
  when: must_gather_path | default('') | trim | length > 0

- name: Merge optional etcd-ocp-diag evidence summary
  ansible.builtin.set_fact:
    evidence_summary: "{{ evidence_summary | combine({'etcd_ocp_diag_present': (etcd_ocp_diag_data.summary.present | default(false)), 'etcd_ocp_diag_verdict': (etcd_ocp_diag_data.summary.verdict | default('not-collected'))}, recursive=True) }}"
  when: must_gather_path | default('') | trim | length > 0

- name: Parse optional omc evidence from must-gather
  ansible.builtin.command:
    argv: >-
      {{
        ['python3', playbook_dir ~ '/../scripts/parse_omc.py', must_gather_path]
        + (['--omc-bin', omc_binary_path] if (omc_binary_path | default('') | trim | length > 0) else [])
      }}
  register: omc_parse_cmd
  changed_when: false
  when: must_gather_path | default('') | trim | length > 0

- name: Parse optional omc JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_json_payload.py"
      - --stdin
    stdin: "{{ omc_parse_cmd.stdout | default('') }}"
  register: omc_parse_json_cmd
  changed_when: false
  when: must_gather_path | default('') | trim | length > 0

- name: Merge optional omc evidence facts
  vars:
    omc_payload: "{{ (omc_parse_json_cmd.stdout | from_json) if (omc_parse_json_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'omc parser returned no output'} }}"
  ansible.builtin.set_fact:
    omc_data: "{{ omc_payload.data if (omc_payload.ok | default(false)) else {} }}"
  when: must_gather_path | default('') | trim | length > 0

- name: Merge optional omc evidence summary
  ansible.builtin.set_fact:
    evidence_summary: "{{ evidence_summary | combine({'omc_present': (omc_data.summary.present | default(false)), 'omc_verdict': (omc_data.summary.verdict | default('not-collected'))}, recursive=True) }}"
  when: must_gather_path | default('') | trim | length > 0

- name: Initialize empty must-gather inventory when absent
  ansible.builtin.set_fact:
    must_gather_inventory: "{{ must_gather_inventory | default({}) }}"
    etcd_ocp_diag_data: "{{ etcd_ocp_diag_data | default({}) }}"
    omc_data: "{{ omc_data | default({}) }}"
    evidence_sources: "{{ evidence_sources | default([]) }}"
    evidence_summary: "{{ evidence_summary | default({'source_count': 0, 'source_labels': []}) }}"
  when: must_gather_path | default('') | trim | length == 0

- name: Parse optional cluster-compare evidence
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/parse_cluster_compare.py"
      - "{{ cluster_compare_path }}"
  register: cluster_compare_parse_cmd
  changed_when: false
  when: cluster_compare_path | default('') | trim | length > 0

- name: Parse optional cluster-compare JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_json_payload.py"
      - --stdin
    stdin: "{{ cluster_compare_parse_cmd.stdout | default('') }}"
  register: cluster_compare_parse_json_cmd
  changed_when: false
  when: cluster_compare_path | default('') | trim | length > 0

- name: Merge optional cluster-compare evidence
  vars:
    cluster_compare_payload: "{{ (cluster_compare_parse_json_cmd.stdout | from_json) if (cluster_compare_parse_json_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'cluster-compare parser returned no output'} }}"
  ansible.builtin.set_fact:
    cluster_compare_data: "{{ cluster_compare_payload.data if (cluster_compare_payload.ok | default(false)) else {} }}"
    evidence_sources: "{{ evidence_sources + ([cluster_compare_source] if (cluster_compare_payload.ok | default(false)) else []) }}"
    evidence_summary: "{{ evidence_summary | combine({'source_count': ((evidence_summary.source_count | default(0) | int) + (1 if (cluster_compare_payload.ok | default(false)) else 0)), 'source_labels': ((evidence_summary.source_labels | default([])) + (['cluster-compare'] if (cluster_compare_payload.ok | default(false)) else [])), 'cluster_compare_path': cluster_compare_path}, recursive=True) }}"
    evidence_limitations: "{{ (evidence_limitations | default([])) + ([{'area': 'cluster-compare', 'detail': 'cluster-compare evidence was provided but its parser output was not valid JSON: ' ~ (cluster_compare_payload.error | default('unknown parse error'))}] if not (cluster_compare_payload.ok | default(false)) else []) }}"
  vars:
    cluster_compare_source:
      name: cluster-compare
      type: report-file
      mode: offline
      path: "{{ cluster_compare_path }}"
      parser: parse_cluster_compare.py
  when: cluster_compare_path | default('') | trim | length > 0

- name: Parse optional inspect evidence
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/parse_inspect.py"
      - "{{ inspect_path }}"
  register: inspect_parse_cmd
  changed_when: false
  when: inspect_path | default('') | trim | length > 0

- name: Parse optional inspect JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_json_payload.py"
      - --stdin
    stdin: "{{ inspect_parse_cmd.stdout | default('') }}"
  register: inspect_parse_json_cmd
  changed_when: false
  when: inspect_path | default('') | trim | length > 0

- name: Merge optional inspect evidence
  vars:
    inspect_payload: "{{ (inspect_parse_json_cmd.stdout | from_json) if (inspect_parse_json_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'inspect parser returned no output'} }}"
  ansible.builtin.set_fact:
    inspect_data: "{{ inspect_payload.data if (inspect_payload.ok | default(false)) else {} }}"
    evidence_sources: "{{ evidence_sources + ([inspect_source] if (inspect_payload.ok | default(false)) else []) }}"
    evidence_summary: "{{ evidence_summary | combine({'source_count': ((evidence_summary.source_count | default(0) | int) + (1 if (inspect_payload.ok | default(false)) else 0)), 'source_labels': ((evidence_summary.source_labels | default([])) + (['inspect'] if (inspect_payload.ok | default(false)) else [])), 'inspect_path': inspect_path}, recursive=True) }}"
    evidence_limitations: "{{ (evidence_limitations | default([])) + ([{'area': 'inspect parsing', 'detail': 'inspect evidence was provided but its parser output was not valid JSON: ' ~ (inspect_payload.error | default('unknown parse error'))}] if not (inspect_payload.ok | default(false)) else []) }}"
  vars:
    inspect_source:
      name: inspect
      type: resource-directory
      mode: offline
      path: "{{ inspect_path }}"
      parser: parse_inspect.py
  when: inspect_path | default('') | trim | length > 0

- name: Resolve evidence mode
  ansible.builtin.set_fact:
    evidence_mode_resolved: "{{ resolved_mode }}"
    evidence_summary: "{{ evidence_summary | combine({'mode': resolved_mode}, recursive=True) }}"
  vars:
    resolved_mode: >-
      {{
        (
          'hybrid'
          if ((must_gather_path | default('') | trim | length > 0) and (inspect_path | default('') | trim | length > 0))
          else ('must_gather' if (must_gather_path | default('') | trim | length > 0) else 'inspect')
        )
        if (evidence_mode | default('auto')) == 'auto'
        else (evidence_mode | default('auto'))
      }}

- name: Parse optional managed gates evidence
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/parse_managed_gates.py"
      - "{{ managed_gates_path }}"
  register: managed_gates_parse_cmd
  changed_when: false
  when: managed_gates_path | default('') | trim | length > 0

- name: Parse optional managed gates JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_json_payload.py"
      - --stdin
    stdin: "{{ managed_gates_parse_cmd.stdout | default('') }}"
  register: managed_gates_parse_json_cmd
  changed_when: false
  when: managed_gates_path | default('') | trim | length > 0

- name: Merge optional managed gates evidence
  vars:
    managed_gates_payload: "{{ (managed_gates_parse_json_cmd.stdout | from_json) if (managed_gates_parse_json_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'managed gates parser returned no output'} }}"
  ansible.builtin.set_fact:
    managed_gates_data: "{{ managed_gates_payload.data if (managed_gates_payload.ok | default(false)) else {} }}"
    evidence_sources: "{{ evidence_sources + ([managed_gates_source] if (managed_gates_payload.ok | default(false)) else []) }}"
    evidence_summary: "{{ evidence_summary | combine({'source_count': ((evidence_summary.source_count | default(0) | int) + (1 if (managed_gates_payload.ok | default(false)) else 0)), 'source_labels': ((evidence_summary.source_labels | default([])) + (['managed-gates'] if (managed_gates_payload.ok | default(false)) else [])), 'managed_gates_path': managed_gates_path}, recursive=True) }}"
    evidence_limitations: "{{ (evidence_limitations | default([])) + ([{'area': 'managed-gates', 'detail': 'managed gates evidence was provided but its parser output was not valid JSON: ' ~ (managed_gates_payload.error | default('unknown parse error'))}] if not (managed_gates_payload.ok | default(false)) else []) }}"
  vars:
    managed_gates_source:
      name: managed-gates
      type: report-file
      mode: offline
      path: "{{ managed_gates_path }}"
      parser: parse_managed_gates.py
  when: managed_gates_path | default('') | trim | length > 0

- name: Parse optional sosreport evidence
  ansible.builtin.command:
    argv: >-
      {{
        ['python3', playbook_dir ~ '/../scripts/parse_sosreport.py']
        + (sosreport_paths | default([]))
      }}
  register: sosreport_parse_cmd
  changed_when: false
  when: (sosreport_paths | default([]) | length) > 0

- name: Parse optional sosreport JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_json_payload.py"
      - --stdin
    stdin: "{{ sosreport_parse_cmd.stdout | default('') }}"
  register: sosreport_parse_json_cmd
  changed_when: false
  when: (sosreport_paths | default([]) | length) > 0

- name: Merge optional sosreport evidence
  vars:
    sosreport_payload: "{{ (sosreport_parse_json_cmd.stdout | from_json) if (sosreport_parse_json_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'sosreport parser returned no output'} }}"
    parsed_sosreport_data: "{{ sosreport_payload.data if (sosreport_payload.ok | default(false)) else {} }}"
    sosreport_sources: >-
      {{
        (parsed_sosreport_data.reports | default([]))
        | map('combine', {'name': 'sosreport', 'type': 'node-archive', 'mode': 'offline', 'parser': 'parse_sosreport.py'})
        | list
      }}
  ansible.builtin.set_fact:
    sosreport_data: "{{ parsed_sosreport_data }}"
    evidence_sources: "{{ evidence_sources + (sosreport_sources if (sosreport_payload.ok | default(false)) else []) }}"
    evidence_summary: "{{ evidence_summary | combine({'source_count': ((evidence_summary.source_count | default(0) | int) + ((sosreport_sources | length) if (sosreport_payload.ok | default(false)) else 0)), 'source_labels': ((evidence_summary.source_labels | default([])) + (['sosreport'] if ((sosreport_payload.ok | default(false)) and ((sosreport_sources | length) > 0)) else [])), 'sosreport_count': (parsed_sosreport_data.summary.count | default(0))}, recursive=True) }}"
    evidence_limitations: "{{ (evidence_limitations | default([])) + ([{'area': 'sosreport', 'detail': 'sosreport evidence was provided but its parser output was not valid JSON: ' ~ (sosreport_payload.error | default('unknown parse error'))}] if not (sosreport_payload.ok | default(false)) else []) }}"
  when: (sosreport_paths | default([]) | length) > 0

- name: Parse optional advisor export evidence
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/parse_advisor_export.py"
      - "{{ advisor_export_path }}"
  register: advisor_export_parse_cmd
  changed_when: false
  when: advisor_export_path | default('') | trim | length > 0

- name: Parse optional advisor export JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_json_payload.py"
      - --stdin
    stdin: "{{ advisor_export_parse_cmd.stdout | default('') }}"
  register: advisor_export_parse_json_cmd
  changed_when: false
  when: advisor_export_path | default('') | trim | length > 0

- name: Merge optional advisor export evidence
  vars:
    advisor_export_payload: "{{ (advisor_export_parse_json_cmd.stdout | from_json) if (advisor_export_parse_json_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'advisor export parser returned no output'} }}"
  ansible.builtin.set_fact:
    advisor_export_data: "{{ advisor_export_payload.data if (advisor_export_payload.ok | default(false)) else {} }}"
    evidence_sources: "{{ evidence_sources + ([advisor_source] if (advisor_export_payload.ok | default(false)) else []) }}"
    evidence_summary: "{{ evidence_summary | combine({'source_count': ((evidence_summary.source_count | default(0) | int) + (1 if (advisor_export_payload.ok | default(false)) else 0)), 'source_labels': ((evidence_summary.source_labels | default([])) + (['advisor-export'] if (advisor_export_payload.ok | default(false)) else [])), 'advisor_export_path': advisor_export_path}, recursive=True) }}"
    evidence_limitations: "{{ (evidence_limitations | default([])) + ([{'area': 'advisor-export', 'detail': 'advisor export evidence was provided but its parser output was not valid JSON: ' ~ (advisor_export_payload.error | default('unknown parse error'))}] if not (advisor_export_payload.ok | default(false)) else []) }}"
  vars:
    advisor_source:
      name: advisor-export
      type: report-file
      mode: offline
      path: "{{ advisor_export_path }}"
      parser: parse_advisor_export.py
  when: advisor_export_path | default('') | trim | length > 0

- name: Parse optional insights archive evidence
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/parse_insights_archive.py"
      - "{{ insights_archive_path }}"
  register: insights_archive_parse_cmd
  changed_when: false
  when: insights_archive_path | default('') | trim | length > 0

- name: Parse optional insights archive JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_json_payload.py"
      - --stdin
    stdin: "{{ insights_archive_parse_cmd.stdout | default('') }}"
  register: insights_archive_parse_json_cmd
  changed_when: false
  when: insights_archive_path | default('') | trim | length > 0

- name: Merge optional insights archive evidence
  vars:
    insights_archive_payload: "{{ (insights_archive_parse_json_cmd.stdout | from_json) if (insights_archive_parse_json_cmd.stdout | default('') | length > 0) else {'ok': false, 'data': {}, 'error': 'insights archive parser returned no output'} }}"
  ansible.builtin.set_fact:
    insights_archive_data: "{{ insights_archive_payload.data if (insights_archive_payload.ok | default(false)) else {} }}"
    evidence_sources: "{{ evidence_sources + ([insights_archive_source] if (insights_archive_payload.ok | default(false)) else []) }}"
    evidence_summary: "{{ evidence_summary | combine({'source_count': ((evidence_summary.source_count | default(0) | int) + (1 if (insights_archive_payload.ok | default(false)) else 0)), 'source_labels': ((evidence_summary.source_labels | default([])) + (['insights-archive'] if (insights_archive_payload.ok | default(false)) else [])), 'insights_archive_path': insights_archive_path}, recursive=True) }}"
    evidence_limitations: "{{ (evidence_limitations | default([])) + ([{'area': 'insights-archive', 'detail': 'insights archive evidence was provided but its parser output was not valid JSON: ' ~ (insights_archive_payload.error | default('unknown parse error'))}] if not (insights_archive_payload.ok | default(false)) else []) }}"
  vars:
    insights_archive_source:
      name: insights-archive
      type: archive-directory
      mode: offline
      path: "{{ insights_archive_path }}"
      parser: parse_insights_archive.py
  when: insights_archive_path | default('') | trim | length > 0

- name: Build evidence coverage facts
  ansible.builtin.set_fact:
    evidence_coverage:
      cluster_configuration: >-
        {{
          'present'
          if ((must_gather_inventory | default({})).summary.has_cluster_scoped_resources | default(false))
          else ('partial' if (((inspect_data | default({})).summary.file_count | default(0) | int) > 0) else 'missing')
        }}
      namespaced_resources: >-
        {{
          'present'
          if ((must_gather_inventory | default({})).summary.has_namespaces_tree | default(false))
          else ('partial' if (((inspect_data | default({})).summary.namespace_count | default(0) | int) > 0) else 'missing')
        }}
      cluster_events: "{{ 'present' if (((must_gather_inventory | default({})).summary.event_file_count | default(0) | int) > 0) else ('partial' if (((inspect_data | default({})).summary.resource_markers.events | default(0) | int) > 0) else 'missing') }}"
      service_logs: "{{ 'partial' if (((must_gather_inventory | default({})).summary.log_file_count | default(0) | int) > 0) else ('partial' if (((inspect_data | default({})).summary.text_file_count | default(0) | int) > 0) else 'missing') }}"
      node_diagnostics: "{{ 'present' if (((sosreport_data | default({})).summary.count | default(0) | int) > 0) else 'missing' }}"
      inspect: "{{ 'present' if (((inspect_data | default({})).summary.file_count | default(0) | int) > 0) else 'missing' }}"
      advisor_data: "{{ 'present' if ((advisor_export_data | default({})).summary is defined) else 'missing' }}"
      control_plane_backup: missing
      cluster_compare: "{{ 'present' if ((cluster_compare_data | default({})).summary is defined) else 'missing' }}"
      managed_gates: "{{ 'present' if ((managed_gates_data | default({})).summary is defined) else 'missing' }}"
      insights_archive: "{{ 'present' if (((insights_archive_data | default({})).summary.present | default(false) | bool)) else 'missing' }}"

- name: Build evidence limitations
  ansible.builtin.set_fact:
    evidence_limitations: >-
      {{
        (evidence_limitations | default([]))
        + ([{'area': 'node diagnostics', 'detail': 'No sosreport or node-level archive input was provided.'}] if (evidence_coverage.node_diagnostics == 'missing') else [])
        + ([{'area': 'targeted inspect evidence', 'detail': 'No oc adm inspect directory was provided for partial targeted diagnostics.'}] if (evidence_coverage.inspect == 'missing') else [])
        + ([{'area': 'control-plane backup evidence', 'detail': 'No live etcd snapshot or static_kuberesources artifact collection was provided. This capability requires live cluster evidence from control plane nodes.'}] if (evidence_coverage.control_plane_backup == 'missing') else [])
        + ([{'area': 'reference compliance', 'detail': 'No cluster-compare output or baseline reference was provided.'}] if (evidence_coverage.cluster_compare == 'missing') else [])
        + ([{'area': 'managed-service gates', 'detail': 'No provider-managed gate export such as rosa list gates output was provided.'}] if (evidence_coverage.managed_gates == 'missing') else [])
        + ([{'area': 'advisor posture', 'detail': 'No Insights Advisor export or offline Advisor evidence was provided.'}] if (evidence_coverage.advisor_data == 'missing') else [])
        + ([{'area': 'insights archive', 'detail': 'No Insights archive directory was provided for collected-state support evidence.'}] if (evidence_coverage.insights_archive == 'missing') else [])
      }}

- name: Build evidence hygiene scanner arguments
  ansible.builtin.set_fact:
    evidence_hygiene_scan_args: >-
      {{
        (
          ['--root', 'case-bundle', case_bundle_path]
          if (case_bundle_path | default('') | trim | length > 0)
          else (
            []
            + (['--root', 'must-gather', must_gather_path] if (must_gather_path | default('') | trim | length > 0) else [])
            + (['--root', 'inspect', inspect_path] if (inspect_path | default('') | trim | length > 0) else [])
            + (['--root', 'cluster-compare', cluster_compare_path] if (cluster_compare_path | default('') | trim | length > 0) else [])
            + (['--root', 'managed-gates', managed_gates_path] if (managed_gates_path | default('') | trim | length > 0) else [])
            + (['--root', 'advisor-export', advisor_export_path] if (advisor_export_path | default('') | trim | length > 0) else [])
            + (['--root', 'insights-archive', insights_archive_path] if (insights_archive_path | default('') | trim | length > 0) else [])
          )
        )
      }}

- name: Add sosreport roots to evidence hygiene scan arguments
  ansible.builtin.set_fact:
    evidence_hygiene_scan_args: "{{ (evidence_hygiene_scan_args | default([])) + ['--root', 'sosreport', item] }}"
  loop: "{{ sosreport_paths | default([]) }}"
  when:
    - (case_bundle_path | default('') | trim | length) == 0
    - (sosreport_paths | default([]) | length) > 0

- name: Analyze evidence hygiene and redaction candidates
  ansible.builtin.command:
    argv: "{{ ['python3', playbook_dir ~ '/../scripts/analyze_evidence_hygiene.py'] + evidence_hygiene_scan_args }}"
  register: evidence_hygiene_cmd
  changed_when: false
  when: (evidence_hygiene_scan_args | default([]) | length) > 0

- name: Merge evidence hygiene facts
  ansible.builtin.set_fact:
    evidence_hygiene_data: "{{ evidence_hygiene_payload }}"
    evidence_summary: "{{ evidence_summary | combine({'evidence_hygiene_verdict': (evidence_hygiene_payload.summary.verdict | default('unknown')), 'evidence_hygiene_candidate_count': (evidence_hygiene_payload.summary.candidate_count | default(0)), 'evidence_hygiene_scanned_files': (evidence_hygiene_payload.summary.scanned_file_count | default(0))}, recursive=True) }}"
    evidence_limitations: >-
      {{
        (evidence_limitations | default([]))
        + ([{'area': 'evidence hygiene', 'detail': 'Potentially sensitive evidence files were detected; review or redact the bundle before sharing it beyond core support workflows.'}] if ((evidence_hygiene_payload.summary.candidate_count | default(0) | int) > 0) else [])
      }}
  vars:
    evidence_hygiene_payload: >-
      {{
        (evidence_hygiene_cmd.stdout | from_json)
        if (evidence_hygiene_cmd.stdout | default('') | trim | length > 0)
        else {'summary': {'verdict': 'unknown', 'candidate_count': 0, 'scanned_file_count': 0}}
      }}
  when: (evidence_hygiene_scan_args | default([]) | length) > 0

- name: Initialize empty evidence hygiene facts when scan is skipped
  ansible.builtin.set_fact:
    evidence_hygiene_data: "{{ evidence_hygiene_data | default({'summary': {'verdict': 'unknown', 'present': false, 'scanned_root_count': 0, 'scanned_file_count': 0, 'scanned_directory_count': 0, 'candidate_count': 0}, 'roots': [], 'findings': [], 'sensitive_candidates': [], 'redaction_guidance': []}) }}"
  when: (evidence_hygiene_scan_args | default([]) | length) == 0

- name: Resolve redaction artifact paths
  ansible.builtin.set_fact:
    resolved_redaction_manifest_path: >-
      {{
        redaction_manifest_path
        if (redaction_manifest_path | default('') | trim | length > 0)
        else (
          report_output_dir
          ~ '/redaction-manifest-'
          ~ platform_family
          ~ '-'
          ~ ansible_date_time.iso8601_basic_short
          ~ '.json'
        )
      }}
    resolved_redacted_bundle_output_dir: >-
      {{
        redacted_bundle_output_dir
        if (redacted_bundle_output_dir | default('') | trim | length > 0)
        else (
          report_output_dir
          ~ '/redacted-case-bundle-'
          ~ platform_family
          ~ '-'
          ~ ansible_date_time.iso8601_basic_short
        )
      }}
  when:
    - (case_bundle_path | default('') | trim | length) > 0
    - (write_redaction_manifest | default(false) | bool) or (write_redacted_bundle | default(false) | bool)

- name: Materialize redaction manifest and optional sanitized bundle
  ansible.builtin.command:
    argv: >-
      {{
        ['python3', playbook_dir ~ '/../scripts/materialize_redaction_outputs.py',
         '--source-root', case_bundle_path,
         '--manifest-path', resolved_redaction_manifest_path]
        + (['--redacted-root', resolved_redacted_bundle_output_dir] if (write_redacted_bundle | default(false) | bool) else [])
      }}
  register: redaction_materialization_cmd
  changed_when: true
  when:
    - (case_bundle_path | default('') | trim | length) > 0
    - (write_redaction_manifest | default(false) | bool) or (write_redacted_bundle | default(false) | bool)

- name: Merge redaction output facts
  ansible.builtin.set_fact:
    evidence_redaction_outputs: "{{ redaction_result }}"
    evidence_summary: "{{ evidence_summary | combine({'redaction_manifest_path': (redaction_result.manifest_path | default('')), 'redacted_bundle_path': resolved_redacted_bundle_path, 'redacted_bundle_written': (redaction_result.redacted_bundle_written | default(false) | bool)}, recursive=True) }}"
  vars:
    redaction_result: "{{ redaction_materialization_cmd.stdout | from_json }}"
    resolved_redacted_bundle_path: >-
      {{
        ((redaction_result.redacted_bundle | default({})).path | default(''))
        if (redaction_result.redacted_bundle_written | default(false) | bool)
        else ''
      }}
  when:
    - redaction_materialization_cmd is defined
    - (redaction_materialization_cmd.stdout | default('') | trim | length) > 0

- name: Initialize empty redaction output facts when materialization is skipped
  ansible.builtin.set_fact:
    evidence_redaction_outputs: "{{ evidence_redaction_outputs | default({'manifest_path': '', 'manifest_written': false, 'redacted_bundle_written': false}) }}"
  when: evidence_redaction_outputs is not defined
