---
- name: Build external secrets operator capability artifact facts
  vars:
    day2_external_secrets_operator_section_current: "{{ (day2_capability_sections_by_key | default({})).get('external_secrets_operator', {}) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: external_secrets_operator
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      external_secret_store_count: "{{ ((day2_posture_summary | default({})).get('external_secret_store_count', 0)) | int }}"
      external_secret_count: "{{ ((day2_posture_summary | default({})).get('external_secret_count', 0)) | int }}"
      external_secret_ready_store_count: "{{ ((day2_posture_summary | default({})).get('external_secret_ready_store_count', 0)) | int }}"
      external_secret_ready_count: "{{ ((day2_posture_summary | default({})).get('external_secret_ready_count', 0)) | int }}"
      external_secrets_namespace_present: "{{ ((day2_posture_summary | default({})).get('external_secrets_namespace_present', false)) | bool }}"
      external_secrets_healthy: "{{ ((day2_posture_summary | default({})).get('external_secrets_healthy', false)) | bool }}"
      status_summary: "{{ day2_external_secrets_operator_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_external_secrets_operator_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_external_secrets_operator_section: "{{ day2_external_secrets_operator_section_current }}"
    capability_artifact_collection_inputs:
      external_secret_store_count: "{{ ((day2_posture_summary | default({})).get('external_secret_store_count', 0)) | int }}"
      external_secret_count: "{{ ((day2_posture_summary | default({})).get('external_secret_count', 0)) | int }}"
      external_secret_ready_store_count: "{{ ((day2_posture_summary | default({})).get('external_secret_ready_store_count', 0)) | int }}"
      external_secret_ready_count: "{{ ((day2_posture_summary | default({})).get('external_secret_ready_count', 0)) | int }}"
      external_secrets_namespace_present: "{{ ((day2_posture_summary | default({})).get('external_secrets_namespace_present', false)) | bool }}"
      external_secrets_healthy: "{{ ((day2_posture_summary | default({})).get('external_secrets_healthy', false)) | bool }}"
