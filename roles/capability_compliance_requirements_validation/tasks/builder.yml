---
- name: Build compliance requirements validation capability artifact facts
  ansible.builtin.set_fact:
    capability_artifact_key: compliance_requirements_validation
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      compliancesuite_count: "{{ ((day2_posture_summary | default({})).get('compliancesuite_count', 0)) | int }}"
      compliance_operator_present: "{{ ((compliance_operator_summary | default({})).get('present', false)) | bool }}"
      compliance_scan_count: "{{ ((compliance_operator_summary | default({})).get('scan_count', 0)) | int }}"
      compliance_scan_setting_binding_count: "{{ ((compliance_operator_summary | default({})).get('scan_setting_binding_count', 0)) | int }}"
      compliance_invalid_profilebundle_count: "{{ ((compliance_operator_summary | default({})).get('invalid_profilebundle_count', 0)) | int }}"
    capability_artifact_render_inputs:
      compliance_operator_summary: "{{ compliance_operator_summary | default({}) }}"
    capability_artifact_collection_inputs:
      compliancesuite_count: "{{ ((day2_posture_summary | default({})).get('compliancesuite_count', 0)) | int }}"
      compliance_operator_present: "{{ ((compliance_operator_summary | default({})).get('present', false)) | bool }}"
      compliance_scan_count: "{{ ((compliance_operator_summary | default({})).get('scan_count', 0)) | int }}"
      compliance_scan_setting_binding_count: "{{ ((compliance_operator_summary | default({})).get('scan_setting_binding_count', 0)) | int }}"
      compliance_invalid_profilebundle_count: "{{ ((compliance_operator_summary | default({})).get('invalid_profilebundle_count', 0)) | int }}"
