---
- name: Build cost management operator capability artifact facts
  vars:
    day2_cost_management_operator_section_current: "{{ (((day2_capability_sections | default([])) | selectattr('key', 'equalto', 'cost_management_operator') | list | first) | default({})) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: cost_management_operator
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      cost_management_operator_present: "{{ ((day2_posture_summary | default({})).get('cost_management_operator_present', false)) | bool }}"
      cost_management_operator_healthy: "{{ ((day2_posture_summary | default({})).get('cost_management_operator_healthy', false)) | bool }}"
      status_summary: "{{ day2_cost_management_operator_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_cost_management_operator_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_cost_management_operator_section: "{{ day2_cost_management_operator_section_current }}"
    capability_artifact_collection_inputs:
      cost_management_operator_present: "{{ ((day2_posture_summary | default({})).get('cost_management_operator_present', false)) | bool }}"
      cost_management_operator_healthy: "{{ ((day2_posture_summary | default({})).get('cost_management_operator_healthy', false)) | bool }}"
