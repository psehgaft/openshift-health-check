---
- name: Build ingress controller topology and sharding capability artifact facts
  vars:
    day2_ingress_controller_topology_and_sharding_section_current: "{{ (((day2_capability_sections | default([])) | selectattr('key', 'equalto', 'ingress_controller_topology_and_sharding') | list | first) | default({})) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: ingress_controller_topology_and_sharding
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      network_status: "{{ day2_ingress_controller_topology_and_sharding_section_current.status | default('unknown') }}"
      network_reason_summary: "{{ day2_ingress_controller_topology_and_sharding_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_ingress_controller_topology_and_sharding_section: "{{ day2_ingress_controller_topology_and_sharding_section_current }}"
    capability_artifact_collection_inputs:
      ingresscontroller_count: "{{ ((day2_posture_summary | default({})).get('ingresscontroller_count', 0)) | int }}"
      nondefault_ingresscontroller_count: "{{ ((day2_posture_summary | default({})).get('nondefault_ingresscontroller_count', 0)) | int }}"
      ingress_topology_signal_count: "{{ ((day2_posture_summary | default({})).get('ingress_topology_signal_count', 0)) | int }}"
      ingress_topology_healthy: "{{ ((day2_posture_summary | default({})).get('ingress_topology_healthy', false)) | bool }}"
      default_ingresscontroller_issue_count: "{{ ((network_architecture_summary | default({})).get('default_ingresscontroller_issue_count', 0)) | int }}"
      ingresscontroller_issue_count: "{{ ((network_architecture_summary | default({})).get('ingresscontroller_issue_count', 0)) | int }}"
