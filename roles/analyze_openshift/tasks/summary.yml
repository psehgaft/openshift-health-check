---
- name: Build aggregate lists
  ansible.builtin.set_fact:
    scored_workload_practice_findings: "{{ workload_practice_findings | default([]) | rejectattr('issue', 'equalto', 'missing-pod-disruption-budget') | list }}"
    default_storageclasses: "{{ storageclass_summary | default([]) | selectattr('is_default', 'equalto', true) | list }}"
    top_pod_restart_hotspots: "{{ (pod_restart_hotspots | default([]) | sort(attribute='restarts', reverse=true) | list)[:top_restart_pod_limit] }}"
    high_restart_pods: "{{ (pod_restart_hotspots | default([]) | selectattr('restarts', 'ge', (pod_restart_warning_threshold | default(5) | int)) | sort(attribute='restarts', reverse=true) | list) }}"
    top_high_restart_pods: "{{ ((pod_restart_hotspots | default([]) | selectattr('restarts', 'ge', (pod_restart_warning_threshold | default(5) | int)) | sort(attribute='restarts', reverse=true) | list)[:top_restart_pod_limit]) }}"
    top_pvc_issues: "{{ (pvc_issues | default([]))[:top_pvc_issue_limit] }}"
    top_pv_issues: "{{ (pv_issues | default([]))[:top_pvc_issue_limit] }}"
    top_event_reasons: "{{ (warning_event_reason_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | list)[:top_event_reason_limit] }}"
    top_alert_groups: "{{ (firing_alert_name_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | list)[:top_alert_group_limit] }}"
    top_alert_namespaces: "{{ (firing_alert_namespace_counts | default({}) | dict2items | sort(attribute='value', reverse=true) | list)[:top_namespace_issue_limit] }}"
    top_namespace_issue_summary: "{{ (namespace_issue_summary | default([]))[:top_namespace_issue_limit] }}"
    top_workload_health_issues: "{{ (workload_health_issues | default([]))[:top_workload_issue_limit] }}"
    top_unhealthy_user_pods: "{{ (unhealthy_user_pods | default([]))[:top_workload_issue_limit] }}"
    top_high_replica_workloads: "{{ (high_replica_workloads | default([]) | sort(attribute='replicas', reverse=true) | list)[:top_workload_issue_limit] }}"
    top_orphan_pods: "{{ (orphan_pods | default([]))[:top_workload_issue_limit] }}"
    top_workload_label_governance_findings: "{{ (workload_label_governance_findings | default([]))[:top_workload_issue_limit] }}"
    top_workload_resource_findings: "{{ (workload_resource_findings | default([]))[:top_workload_issue_limit] }}"
    top_workload_probe_findings: "{{ (workload_probe_findings | default([]))[:top_workload_issue_limit] }}"
    top_overprovisioned_pods: "{{ (overprovisioned_pods | default([]))[:top_workload_issue_limit] }}"
    top_quota_pressure_findings: "{{ (quota_pressure_findings | default([]))[:top_workload_issue_limit] }}"
    top_security_findings: "{{ (security_findings | default([]))[:top_security_issue_limit] }}"
    top_workload_practice_findings: "{{ (workload_practice_findings | default([]))[:top_security_issue_limit] }}"
    top_route_issues: "{{ (route_issues | default([]))[:top_workload_issue_limit] }}"
    top_ingress_issues: "{{ (ingress_issues | default([]))[:top_workload_issue_limit] }}"
    top_route_host_conflicts: "{{ (route_host_conflicts | default([]))[:top_workload_issue_limit] }}"
    top_ingress_host_conflicts: "{{ (ingress_host_conflicts | default([]))[:top_workload_issue_limit] }}"
    top_deprecated_crd_findings: "{{ (deprecated_crd_findings | default([]))[:top_deprecated_api_limit] }}"
    top_deprecated_api_lines: "{{ (deprecated_api_lines | default([]))[:top_deprecated_api_limit] }}"
    top_services_without_endpoints: "{{ (services_without_endpoints | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_serviceaccounts: "{{ (likely_unused_serviceaccounts | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_configmaps: "{{ (likely_unused_configmaps | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_secrets: "{{ (likely_unused_secrets | default([]))[:top_workload_issue_limit] }}"
    top_likely_unused_crds: "{{ (likely_unused_crds | default([]))[:top_deprecated_api_limit] }}"
    top_image_registry_findings: "{{ (image_registry_findings | default([]))[:top_security_issue_limit] }}"
    top_internal_registry_workloads: "{{ (internal_registry_workloads | default([]))[:top_workload_issue_limit] }}"
    top_feature_findings: "{{ (feature_findings | default([]))[:top_security_issue_limit] }}"
    top_observability_findings: "{{ (observability_findings | default([]))[:top_security_issue_limit] }}"
    top_apiservice_issues: "{{ (apiservice_issues | default([]))[:top_security_issue_limit] }}"
    top_failed_pipelineruns: "{{ (failed_pipelineruns | default([]))[:top_workload_issue_limit] }}"
    top_buildconfigs_without_triggers: "{{ (buildconfigs_without_triggers | default([]))[:top_workload_issue_limit] }}"
    top_compliance_suite_findings: "{{ (compliance_suite_findings | default([]))[:top_security_issue_limit] }}"
    top_backup_posture_findings: "{{ (backup_posture_findings | default([]))[:top_security_issue_limit] }}"
    top_machine_healthcheck_findings: "{{ (machine_healthcheck_findings | default([]))[:top_security_issue_limit] }}"
    top_scc_grant_findings: "{{ (scc_grant_findings | default([]))[:top_security_issue_limit] }}"
    top_privileged_serviceaccount_access: "{{ (privileged_serviceaccount_access | default([]) | sort(attribute='namespace') | sort(attribute='name'))[:top_security_issue_limit] }}"
    top_privileged_user_access: "{{ (privileged_user_access | default([]) | sort(attribute='name'))[:top_security_issue_limit] }}"
    top_privileged_group_access: "{{ (privileged_group_access | default([]) | sort(attribute='name'))[:top_security_issue_limit] }}"
    top_stale_access_review_serviceaccounts: "{{ (stale_access_review_serviceaccounts | default([]) | sort(attribute='namespace') | sort(attribute='name'))[:top_security_issue_limit] }}"
    top_stale_access_review_users: "{{ (stale_access_review_users | default([]) | unique(attribute='name') | sort(attribute='name'))[:top_security_issue_limit] }}"
    top_stale_access_review_groups: "{{ (stale_access_review_groups | default([]) | unique(attribute='name') | sort(attribute='name'))[:top_security_issue_limit] }}"
  changed_when: false

- name: Build security issue type counts
  ansible.builtin.set_fact:
    security_issue_type_counts: "{{ security_issue_type_counts | default({}) | combine({item.issue: ((((security_issue_type_counts | default({}))[item.issue] | default(0)) + 1))}, recursive=True) }}"
  loop: "{{ security_findings | default([]) }}"
  changed_when: false

- name: Build workload practice issue type counts
  ansible.builtin.set_fact:
    workload_practice_issue_type_counts: "{{ workload_practice_issue_type_counts | default({}) | combine({item.issue: ((((workload_practice_issue_type_counts | default({}))[item.issue] | default(0)) + 1))}, recursive=True) }}"
  loop: "{{ workload_practice_findings | default([]) }}"
  changed_when: false

- name: Build workload probe issue type counts
  ansible.builtin.set_fact:
    workload_probe_issue_type_counts: "{{ workload_probe_issue_type_counts | default({}) | combine({item.issue: ((((workload_probe_issue_type_counts | default({}))[item.issue] | default(0)) + 1))}, recursive=True) }}"
  loop: "{{ workload_probe_findings | default([]) }}"
  changed_when: false

- name: Build cluster operator version mismatch list
  ansible.builtin.set_fact:
    cluster_operator_version_mismatches: "{{ cluster_operator_version_mismatches | default([]) + mismatch_entry }}"
  loop: "{{ (clusteroperators | default({})).get('items', []) }}"
  vars:
    desired_version: "{{ clusterversion.status.desired.version | default('unknown') }}"
    operator_version: "{{ item.status.versions[0].version | default('unknown') if (item.status.versions | default([]) | length > 0) else 'unknown' }}"
    mismatch_entry: >-
      {{
        [{
          'name': item.metadata.name | default('unknown'),
          'operator_version': operator_version,
          'cluster_version': desired_version,
          'available': ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first) | default('Unknown')),
          'progressing': ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Progressing') | map(attribute='status') | first) | default('Unknown')),
          'degraded': ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Degraded') | map(attribute='status') | first) | default('Unknown'))
        }]
        if (
          desired_version not in ['unknown', '']
          and operator_version not in ['unknown', '']
          and operator_version != desired_version
        ) else []
      }}
  changed_when: false

- name: Build health summary
  ansible.builtin.set_fact:
    health_summary:
      status: >-
        {{
          'CRITICAL'
          if (
            cv_available != 'True'
            or cv_failing == 'True'
            or (degraded_operators | default([]) | length > 0)
            or (unavailable_operators | default([]) | length > 0)
            or (not_ready_nodes | default([]) | length > 0)
            or (degraded_mcps | default([]) | length > 0)
            or (route_issues | default([]) | length > 0)
            or (ingress_issues | default([]) | length > 0)
            or (route_host_conflicts | default([]) | length > 0)
            or (ingress_host_conflicts | default([]) | length > 0)
            or (auth_findings | default([]) | length > 0)
            or (ingresscontroller_issues | default([]) | length > 0)
            or (infrastructure_component_issues | default([]) | length > 0)
            or (apiservice_issues | default([]) | length > 0)
            or (critical_pod_density_nodes | default([]) | length > 0)
            or (expiring_certificates_critical | default([]) | length > 0)
            or (collection_summary.core_failed_commands | default(0) | int > 0)
          )
          else (
            'WARNING'
            if (
              (progressing_operators | default([]) | length > 0)
              or (pressure_nodes | default([]) | length > 0)
              or (platform_pod_issues | default([]) | length > 0)
              or (unhealthy_user_pods | default([]) | length > 0)
              or (high_restart_pods | default([]) | length > 0)
              or (namespace_issue_summary | default([]) | length > 0)
              or (pvc_issues | default([]) | length > 0)
              or (pv_issues | default([]) | length > 0)
              or (workload_health_issues | default([]) | length > 0)
              or (high_replica_workloads | default([]) | length > 0)
              or (orphan_pods | default([]) | length > 0)
              or (workload_label_governance_findings | default([]) | length > 0)
              or (workload_resource_findings | default([]) | length > 0)
              or (workload_probe_findings | default([]) | length > 0)
              or (overprovisioned_pods | default([]) | length > 0)
              or (quota_pressure_findings | default([]) | length > 0)
              or (security_findings | default([]) | length > 0)
              or (scored_workload_practice_findings | default([]) | length > 0)
              or (empty_user_namespaces | default([]) | length > 0)
              or (services_without_endpoints | default([]) | length > 0)
              or (likely_unused_serviceaccounts | default([]) | length > 0)
              or (likely_unused_configmaps | default([]) | length > 0)
              or (likely_unused_secrets | default([]) | length > 0)
              or (likely_unused_crds | default([]) | length > 0)
              or (image_registry_findings | default([]) | length > 0)
              or (feature_findings | default([]) | length > 0)
              or (failed_pipelineruns | default([]) | length > 0)
              or (scc_grant_findings | default([]) | length > 0)
              or (compliance_suite_findings | default([]) | length > 0)
              or (backup_posture_findings | default([]) | length > 0)
              or (machine_healthcheck_findings | default([]) | length > 0)
              or (namespaces_without_networkpolicy | default([]) | length > 0)
              or (namespaces_missing_ingress_policies | default([]) | length > 0)
              or (namespaces_missing_egress_policies | default([]) | length > 0)
              or (namespaces_without_limitrange | default([]) | length > 0)
              or (namespaces_without_resourcequota | default([]) | length > 0)
              or (topology_resilience.single_zone_worker_pool_count | default(0) | int > 0)
              or (topology_resilience.worker_nodes_without_zone_label | default(0) | int > 0)
              or (topology_resilience.worker_zone_spread_unbalanced | default(false) | bool)
              or (topology_resilience.machinesets_without_zone_label | default(0) | int > 0)
              or (topology_resilience.machineset_replica_unbalanced | default(false) | bool)
              or not (storage_posture_summary.has_external_storage_provider | default(false) | bool)
              or (storage_posture_summary.local_or_ephemeral_only_risk | default(false) | bool)
              or (conditional_updates | default([]) | length > 0)
              or (deprecated_crd_findings | default([]) | length > 0)
              or (deprecated_api_lines | default([]) | length > 0)
              or (high_pod_density_nodes | default([]) | length > 0)
              or (expiring_certificates_warning | default([]) | length > 0)
              or (observability_findings | default([]) | length > 0)
              or (recent_warning_events | default([]) | length > 0)
              or (collection_failures | default([]) | length > 0)
            )
            else 'HEALTHY'
          )
        }}
      cluster_version: "{{ clusterversion.status.desired.version | default('unknown') }}"
      operators_total: "{{ (clusteroperators | default({})).get('items', []) | length }}"
      operators_degraded: "{{ degraded_operators | default([]) | length }}"
      operators_progressing: "{{ progressing_operators | default([]) | length }}"
      operators_unavailable: "{{ unavailable_operators | default([]) | length }}"
      operator_version_mismatches: "{{ cluster_operator_version_mismatches | default([]) | length }}"
      nodes_total: "{{ (nodes | default({})).get('items', []) | length }}"
      nodes_not_ready: "{{ not_ready_nodes | default([]) | length }}"
      node_pressure_count: "{{ pressure_nodes | default([]) | length }}"
      mcps_degraded: "{{ degraded_mcps | default([]) | length }}"
      platform_pod_issues: "{{ platform_pod_issues | default([]) | length }}"
      unhealthy_user_pods: "{{ unhealthy_user_pods | default([]) | length }}"
      high_restart_pods: "{{ high_restart_pods | default([]) | length }}"
      workload_health_issues: "{{ workload_health_issues | default([]) | length }}"
      high_replica_workloads: "{{ high_replica_workloads | default([]) | length }}"
      orphan_pods: "{{ orphan_pods | default([]) | length }}"
      workload_label_governance_findings: "{{ workload_label_governance_findings | default([]) | length }}"
      workload_resource_findings: "{{ workload_resource_findings | default([]) | length }}"
      workload_probe_findings: "{{ workload_probe_findings | default([]) | length }}"
      multi_replica_workloads_checked: "{{ workload_resilience_data.multi_replica_workload_count | default(0) }}"
      multi_replica_workloads_without_pdb: "{{ workload_resilience_data.multi_replica_workloads_without_pdb | default(0) }}"
      multi_replica_workloads_without_spread_policy: "{{ workload_resilience_data.multi_replica_workloads_without_spread_policy | default(0) }}"
      overprovisioned_pods: "{{ overprovisioned_pods | default([]) | length }}"
      quota_pressure_findings: "{{ quota_pressure_findings | default([]) | length }}"
      route_issues: "{{ route_issues | default([]) | length }}"
      ingress_issues: "{{ ingress_issues | default([]) | length }}"
      route_host_conflicts: "{{ route_host_conflicts | default([]) | length }}"
      ingress_host_conflicts: "{{ ingress_host_conflicts | default([]) | length }}"
      auth_findings: "{{ auth_findings | default([]) | length }}"
      ingresscontroller_issues: "{{ ingresscontroller_issues | default([]) | length }}"
      infrastructure_component_issues: "{{ infrastructure_component_issues | default([]) | length }}"
      apiservice_issues: "{{ apiservice_issues | default([]) | length }}"
      security_findings: "{{ security_findings | default([]) | length }}"
      scc_grant_findings: "{{ scc_grant_findings | default([]) | length }}"
      privileged_serviceaccount_access: "{{ privileged_serviceaccount_access | default([]) | length }}"
      privileged_user_access: "{{ privileged_user_access | default([]) | length }}"
      privileged_group_access: "{{ privileged_group_access | default([]) | length }}"
      workload_practice_findings: "{{ scored_workload_practice_findings | default([]) | length }}"
      empty_user_namespaces: "{{ empty_user_namespaces | default([]) | length }}"
      services_without_endpoints: "{{ services_without_endpoints | default([]) | length }}"
      likely_unused_serviceaccounts: "{{ likely_unused_serviceaccounts | default([]) | length }}"
      likely_unused_configmaps: "{{ likely_unused_configmaps | default([]) | length }}"
      likely_unused_secrets: "{{ likely_unused_secrets | default([]) | length }}"
      likely_unused_crds: "{{ likely_unused_crds | default([]) | length }}"
      image_registry_findings: "{{ image_registry_findings | default([]) | length }}"
      internal_registry_workloads: "{{ internal_registry_workloads | default([]) | length }}"
      feature_findings: "{{ feature_findings | default([]) | length }}"
      buildconfigs: "{{ (buildconfigs | default({})).get('items', []) | length }}"
      builds: "{{ (builds | default({})).get('items', []) | length }}"
      imagestreams: "{{ (imagestreams | default({})).get('items', []) | length }}"
      pipelines: "{{ (pipelines | default({})).get('items', []) | length }}"
      pipelineruns: "{{ (pipelineruns | default({})).get('items', []) | length }}"
      failed_pipelineruns: "{{ failed_pipelineruns | default([]) | length }}"
      buildconfigs_without_triggers: "{{ buildconfigs_without_triggers | default([]) | length }}"
      securitycontextconstraints: "{{ (securitycontextconstraints | default({})).get('items', []) | length }}"
      volumesnapshotclasses: "{{ (volumesnapshotclasses | default({})).get('items', []) | length }}"
      dataprotectionapplications: "{{ (dataprotectionapplications | default({})).get('items', []) | length }}"
      compliancesuites: "{{ (compliancesuites | default({})).get('items', []) | length }}"
      compliance_suite_findings: "{{ compliance_suite_findings | default([]) | length }}"
      backupstoragelocations: "{{ (backupstoragelocations | default({})).get('items', []) | length }}"
      velero_schedules: "{{ (schedules | default({})).get('items', []) | length }}"
      successful_backups: "{{ backup_posture_data.successful_backup_count | default(0) }}"
      completed_restores: "{{ backup_posture_data.completed_restore_count | default(0) }}"
      backup_posture_findings: "{{ backup_posture_findings | default([]) | length }}"
      machinehealthchecks: "{{ (machinehealthchecks | default({})).get('items', []) | length }}"
      machine_healthcheck_findings: "{{ machine_healthcheck_findings | default([]) | length }}"
