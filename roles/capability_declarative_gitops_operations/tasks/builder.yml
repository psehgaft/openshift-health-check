---
- name: Build declarative GitOps operations capability artifact facts
  vars:
    declarative_gitops_day2_section_current: "{{ (day2_capability_sections_by_key | default({})).get('declarative_gitops_operations', {}) }}"
    declarative_gitops_present_current: "{{ ((day2_posture_summary | default({})).get('gitops_present', false)) | bool }}"
    declarative_gitops_operational_current: "{{ ((day2_posture_summary | default({})).get('gitops_operational', false)) | bool }}"
    declarative_gitops_automated_sync_present_current: "{{ ((day2_posture_summary | default({})).get('gitops_automated_sync_present', false)) | bool }}"
    declarative_gitops_argocd_count_current: "{{ ((day2_posture_summary | default({})).get('argocd_count', 0)) | int }}"
    declarative_gitops_application_count_current: "{{ ((day2_posture_summary | default({})).get('gitops_application_count', 0)) | int }}"
    declarative_gitops_repo_backed_application_count_current: "{{ ((day2_posture_summary | default({})).get('gitops_repo_backed_application_count', 0)) | int }}"
    declarative_gitops_automated_sync_application_count_current: "{{ ((day2_posture_summary | default({})).get('gitops_automated_sync_application_count', 0)) | int }}"
    declarative_gitops_appproject_count_current: "{{ ((day2_posture_summary | default({})).get('gitops_appproject_count', 0)) | int }}"
    declarative_gitops_status_current: >-
      {{
        'INFO'
        if (not declarative_gitops_present_current)
        else (
          'WARNING'
          if (
            (declarative_gitops_application_count_current == 0)
            or (not declarative_gitops_operational_current)
            or (
              (declarative_gitops_application_count_current > 0)
              and (not declarative_gitops_automated_sync_present_current)
            )
          )
          else 'OK'
        )
      }}
    declarative_gitops_reason_current: >-
      {{
        (
          declarative_gitops_day2_section_current.top_detail
          | default('')
          | string
          | trim
        )
        or (
          'present=' ~ (declarative_gitops_present_current | string)
          ~ ', operational=' ~ (declarative_gitops_operational_current | string)
          ~ ', argocds=' ~ (declarative_gitops_argocd_count_current | string)
          ~ ', applications=' ~ (declarative_gitops_application_count_current | string)
          ~ ', repoBacked=' ~ (declarative_gitops_repo_backed_application_count_current | string)
          ~ ', automatedSync=' ~ (declarative_gitops_automated_sync_application_count_current | string)
          ~ ', appProjects=' ~ (declarative_gitops_appproject_count_current | string)
        )
      }}
  ansible.builtin.set_fact:
    capability_artifact_key: declarative_gitops_operations
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      declarative_operations_status: "{{ declarative_gitops_status_current }}"
      declarative_operations_reason_summary: "{{ declarative_gitops_reason_current }}"
    capability_artifact_render_inputs:
      day2_declarative_gitops_operations_section: "{{ declarative_gitops_day2_section_current }}"
    capability_artifact_collection_inputs:
      gitops_present: "{{ declarative_gitops_present_current | bool }}"
      gitops_operational: "{{ declarative_gitops_operational_current | bool }}"
      gitops_automated_sync_present: "{{ declarative_gitops_automated_sync_present_current | bool }}"
      argocd_count: "{{ declarative_gitops_argocd_count_current | int }}"
      gitops_application_count: "{{ declarative_gitops_application_count_current | int }}"
      gitops_repo_backed_application_count: "{{ declarative_gitops_repo_backed_application_count_current | int }}"
      gitops_automated_sync_application_count: "{{ declarative_gitops_automated_sync_application_count_current | int }}"
      gitops_appproject_count: "{{ declarative_gitops_appproject_count_current | int }}"
