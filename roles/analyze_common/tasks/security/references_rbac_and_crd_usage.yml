- name: Build reference, RBAC, and CRD target analysis bundle
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helpers_from_stdin.py"
    stdin: "{{ {
      'fail_on_error': false,
      'helpers': [
        {
          'name': 'reference_usage_findings',
          'script': 'scripts/build_reference_usage_findings.py',
          'input': {
            'user_namespaces_exclude_regex': (user_namespaces_exclude_regex | default('^$')),
            'pods': ((analysis_graph.pods | default({})).get('items', [])),
            'deployments': ((analysis_graph.deployments | default({})).get('items', [])),
            'statefulsets': ((analysis_graph.statefulsets | default({})).get('items', [])),
            'daemonsets': ((analysis_graph.daemonsets | default({})).get('items', [])),
            'configmaps': ((analysis_graph.configmaps | default({})).get('items', [])),
            'serviceaccounts': ((analysis_graph.serviceaccounts | default({})).get('items', [])),
            'secrets': ((analysis_graph.secrets | default({})).get('items', [])),
            'clusterrolebindings': ((analysis_graph.clusterrolebindings | default({})).get('items', [])),
            'rolebindings': ((analysis_graph.rolebindings | default({})).get('items', []))
          }
        },
        {
          'name': 'crd_usage_targets',
          'script': 'scripts/build_crd_usage_facts.py',
          'input': {
            'crds': ((analysis_graph.crds | default({})).get('items', []))
          }
        }
      ]
    } | to_json }}"
  register: reference_rbac_crd_targets_bundle_cmd
  changed_when: false
  failed_when: false

- name: Normalize reference usage and privileged RBAC findings
  vars:
    reference_rbac_crd_targets_bundle_results: >-
      {{
        (reference_rbac_crd_targets_bundle_cmd.stdout | from_json).results
        if (reference_rbac_crd_targets_bundle_cmd.rc == 0 and (reference_rbac_crd_targets_bundle_cmd.stdout | default('') | length > 0))
        else {}
      }}
  ansible.builtin.set_fact:
    reference_usage_findings_data: >-
      {{
        reference_rbac_crd_targets_bundle_results.reference_usage_findings.output | default({
          'referenced_configmaps': {},
          'referenced_secrets': {},
          'referenced_serviceaccounts': {},
          'likely_unused_configmaps': [],
          'likely_unused_serviceaccounts': [],
          'likely_unused_secrets': [],
          'privileged_serviceaccount_access': [],
          'privileged_user_access': [],
          'privileged_group_access': []
        })
      }}
    crd_usage_targets_data: "{{ reference_rbac_crd_targets_bundle_results.crd_usage_targets.output | default({}) }}"

- name: Expand reference usage and privileged RBAC findings
  ansible.builtin.set_fact:
    referenced_configmaps: "{{ reference_usage_findings_data.referenced_configmaps | default({}) }}"
    referenced_secrets: "{{ reference_usage_findings_data.referenced_secrets | default({}) }}"
    referenced_serviceaccounts: "{{ reference_usage_findings_data.referenced_serviceaccounts | default({}) }}"
    likely_unused_configmaps: "{{ reference_usage_findings_data.likely_unused_configmaps | default([]) }}"
    likely_unused_serviceaccounts: "{{ reference_usage_findings_data.likely_unused_serviceaccounts | default([]) }}"
    likely_unused_secrets: "{{ reference_usage_findings_data.likely_unused_secrets | default([]) }}"
    privileged_serviceaccount_access: "{{ reference_usage_findings_data.privileged_serviceaccount_access | default([]) }}"
    privileged_user_access: "{{ reference_usage_findings_data.privileged_user_access | default([]) }}"
    privileged_group_access: "{{ reference_usage_findings_data.privileged_group_access | default([]) }}"

- name: Normalize namespaced CRD count targets
  ansible.builtin.set_fact:
    namespaced_crd_count_targets: "{{ crd_usage_targets_data.namespaced_crd_count_targets | default([]) }}"
  changed_when: false

- name: Check CRD instance counts
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/batch_crd_instance_counts.py"
    stdin: >-
      {{
        {
          "kube_cli": kube_cli | default('oc'),
          "timeout_seconds": collection_command_timeout_seconds | default(300),
          "parallelism": effective_analysis_parallelism | default(analysis_parallelism | default(collection_parallelism | default(4))),
          "crds": namespaced_crd_count_targets | default([])
        } | to_json
      }}
  register: crd_instance_count_cmd
  changed_when: false
  failed_when: false

- name: Build likely unused custom resource definitions
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_crd_usage_facts.py"
    stdin: "{{ {
      'results': ((crd_instance_count_cmd.stdout | from_json).results if (crd_instance_count_cmd.rc == 0 and (crd_instance_count_cmd.stdout | default('') | length > 0)) else [])
    } | to_json }}"
  register: crd_usage_findings_cmd
  changed_when: false
  failed_when: false

- name: Normalize likely unused custom resource definitions
  ansible.builtin.set_fact:
    likely_unused_crds: "{{ (crd_usage_findings_cmd.stdout | from_json).likely_unused_crds if (crd_usage_findings_cmd.rc == 0 and (crd_usage_findings_cmd.stdout | default('') | length > 0)) else [] }}"
  changed_when: false
