---
- name: Generate an OpenShift cluster health report
  hosts: local
  gather_facts: true
  vars:
    platform_family: openshift
    provider_family: generic
    cluster_profile_mode: production
    kube_cli: oc
    report_mode: auto
    report_output_dir: "{{ playbook_dir }}/../reports"
    report_basename: "cluster-report"
    report_generate_html: true
    report_generate_pdf: true
    report_run_mode: fresh
    collection_parallelism: 4
    local_resource_budget_cpu_pct: 50
    local_resource_budget_mem_pct: 50
    collection_command_timeout_seconds: 300
    keep_collection_artifacts: false
    warning_event_limit: 20
    top_restart_pod_limit: 15
    top_alert_group_limit: 15
    top_event_reason_limit: 15
    top_namespace_issue_limit: 15
    top_pvc_issue_limit: 25
    top_workload_issue_limit: 25
    top_security_issue_limit: 25
    top_certificate_issue_limit: 20
    require_cluster_log_forwarder: false
    require_external_metrics_remote_write: false
    warn_on_ingress_without_class: false
    openshift_report_capability_profile:
      declarative_gitops_operations:
        required: true
        criticality: high
        expected_state: healthy
        owner: operations
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Declarative operations are expected for most production OpenShift environments, including Git-backed Argo CD Application inventory that represents the intended reconciliation model."
        docs: "https://docs.redhat.com/en/documentation/red_hat_openshift_gitops/1.20/html/declarative_cluster_configuration/index"
      openshift_pipeline_workflows:
        required: false
        criticality: medium
        expected_state: present
        owner: delivery
        evidence_required: [must-gather, oc-get]
        notes: "Show when OpenShift Pipelines or PipelineRuns exist, have findings, or the customer requires cluster-hosted pipeline execution."
        docs: "https://docs.redhat.com/en/documentation/red_hat_openshift_pipelines/latest"
      cluster_hosted_cicd_runners:
        required: false
        criticality: medium
        expected_state: present
        owner: delivery
        evidence_required: [must-gather, oc-get, prometheus]
        notes: "Show only when runner pods are detected, have findings, or the customer hosts CI/CD runners on the cluster."
        docs: "https://docs.gitlab.com/runner/executors/kubernetes/"
      application_backup_and_restore_readiness:
        required: true
        criticality: critical
        expected_state: healthy
        owner: operations
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Production clusters should have OADP application backup schedules plus successful backup and restore evidence."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/backup_and_restore/oadp-application-backup-and-restore"
      control_plane_backup_and_recovery_readiness:
        required: false
        criticality: critical
        expected_state: healthy
        owner: operations
        evidence_required: [must-gather, inspect, oc-get, oc-debug-node]
        notes: "Self-managed OpenShift clusters should have recurring etcd snapshot backups, off-cluster retention of snapshot and static pod resources, and tested control-plane recovery procedures."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/etcd/backing-up-and-restoring-etcd-data"
      cluster_log_forwarding:
        required: true
        criticality: high
        expected_state: healthy
        owner: observability
        evidence_required: [must-gather, oc-get]
        notes: "Application, infrastructure, and audit log collection should be configured and forwarded to the intended external destination when centralized log retention is part of the operating model."
        docs: "https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.4/html/configuring_logging/configuring-log-forwarding"
      cluster_metrics_remote_write:
        required: false
        criticality: medium
        expected_state: healthy
        owner: observability
        evidence_required: [must-gather, oc-get, prometheus]
        notes: "Require this when the customer expects platform cluster metrics from prometheusK8s to be exported to an external observability platform through external remoteWrite targets."
        docs: "https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html-single/configuring_core_platform_monitoring/configuring_core_platform_monitoring"
      external_alert_delivery:
        required: true
        criticality: high
        expected_state: healthy
        owner: observability
        evidence_required: [must-gather, oc-get]
        notes: "Production alerts should have accountable external receivers configured and referenced by alert routing so notifications can leave the cluster through the intended path."
        docs: "https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/configuring_core_platform_monitoring/configuring-alerts-and-notifications"
      user_workload_metrics_monitoring:
        required: true
        criticality: high
        expected_state: configured
        owner: observability
        evidence_required: [must-gather, oc-get]
        notes: "Most production clusters need user workload metrics enabled or an approved alternate monitoring path."
        docs: "https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/configuring_user_workload_monitoring/index"
      grafana_metrics_dashboards:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [must-gather, oc-get]
        notes: "Require when in-cluster Grafana dashboards are expected for platform or application metrics."
        docs: "https://grafana.github.io/grafana-operator/docs/"
      persistent_monitoring_storage:
        required: true
        criticality: high
        expected_state: healthy
        owner: observability
        evidence_required: [must-gather, oc-get]
        notes: "Persistent storage is expected for Prometheus and Alertmanager, and for Thanos Ruler on multi-node clusters, to preserve monitoring continuity and high availability."
        docs: "https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html-single/configuring_core_platform_monitoring/configuring_core_platform_monitoring"
      oauth_external_identity_provider:
        required: true
        criticality: high
        expected_state: healthy
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Production OpenShift clusters should have at least one configured external OAuth identity provider rather than relying only on local identity providers or kubeadmin fallback."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/authentication_and_authorization/configuring-identity-providers"
      compliance_requirements_validation:
        required: false
        criticality: medium
        expected_state: healthy
        owner: security
        evidence_required: [must-gather, oc-get, insights]
        notes: "Require when the customer has formal compliance obligations. Use standards to request specific programs. FIPS is validated as install-time runtime state from node evidence, while FedRAMP, HIPAA, PCI-DSS, SOC, SOX, NIST, and CIS are validated from Compliance Operator content, bindings, suites, scans, and results."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.19/html/security_and_compliance/security_and_compliance"
        standards: []
      advanced_cluster_security:
        required: false
        criticality: high
        expected_state: present
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when Red Hat Advanced Cluster Security for Kubernetes is part of the customer security baseline and RHACS operator or secured-cluster services are expected on the cluster."
        docs: "https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_security_for_kubernetes/latest"
      workload_vulnerability_scanning:
        required: false
        criticality: high
        expected_state: present
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when live workload security or vulnerability scanning software is expected on the cluster, such as Aqua, Qualys, Prisma Defender, Sysdig, Trivy Operator, or another approved scanner agent footprint."
        docs: "https://aquasecurity.github.io/trivy-operator/latest/"
      dynatrace_observability:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [must-gather, oc-get, prometheus]
        notes: "Require when Dynatrace Operator, DynaKube, OneAgent, ActiveGate, or related Dynatrace-managed observability components are expected on the cluster."
        docs: "https://docs.dynatrace.com/docs/ingest-from/setup-on-k8s"
      qualys_scanning_agents:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when Qualys Container Security sensors, Qualys Cloud Agent, or related Qualys scanning agents are expected to run on cluster nodes or workloads."
        docs: "https://docs.qualys.com/en/cs-sensor/latest/deploying_sensor_in_k8s/deploying_sensor_in_kubernetes.htm"
      prisma_twistlock_defenders:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when Prisma Cloud Compute or legacy Twistlock Defender agents are expected to protect cluster nodes or workloads."
        docs: "https://pan.dev/prisma-cloud/docs/cwpp/deploy-defenders/"
      aqua_security_platform:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when Aqua platform components such as Aqua Console, Aqua Gateway, Aqua Enforcer, kube-enforcer, or related Aqua-managed security services are expected on the cluster."
        docs: "https://github.com/aquasecurity/deployments"
      splunk_observability:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [must-gather, oc-get, prometheus]
        notes: "Require when Splunk OpenTelemetry Collector, Splunk Connect for Kubernetes, or other Splunk-managed telemetry components are expected on the cluster."
        docs: "https://help.splunk.com/en/splunk-enterprise/get-started/get-data-in/9.2/get-other-kinds-of-data-in/overview-of-the-splunk-opentelemetry-collector-for-kubernetes"
      loki_stack_logging:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [must-gather, oc-get]
        notes: "Require when LokiStack is the intended in-cluster logging backend and LokiStack resources or Loki workloads should exist on the cluster."
        docs: "https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.4/html/configuring_logging/configuring-lokistack-storage"
      datadog_observability:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [must-gather, oc-get, prometheus]
        notes: "Require when Datadog Operator, DatadogAgent custom resources, or Datadog agents are expected to collect cluster telemetry."
        docs: "https://docs.datadoghq.com/containers/kubernetes/installation/"
      appdynamics_observability:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [must-gather, oc-get, prometheus]
        notes: "Require when AppDynamics Cluster Agent, InfraViz, or related AppDynamics observability components are expected on the cluster."
        docs: "https://docs.appdynamics.com/appd/24.x/latest/en/infrastructure-visibility/monitor-kubernetes-with-the-cluster-agent/install-the-cluster-agent"
      openshift_aap:
        required: false
        criticality: medium
        expected_state: present
        owner: operations
        evidence_required: [must-gather, oc-get]
        notes: "Require when Red Hat Ansible Automation Platform is expected on the cluster, with validation based on AnsibleAutomationPlatform, AutomationController, AutomationHub, EDA, or AAP-managed workloads rather than operator footprint alone."
        docs: "https://docs.redhat.com/en/documentation/red_hat_ansible_automation_platform/2.5/html-single/installing_on_openshift_container_platform/index"
      openshift_custom_metrics_autoscaler:
        required: false
        criticality: medium
        expected_state: present
        owner: platform
        evidence_required: [must-gather, oc-get, prometheus]
        notes: "Require when Red Hat build of KEDA or the OpenShift custom metrics autoscaler capability is expected on the cluster, with validation based on KedaController, ScaledObject, ScaledJob, trigger authentication resources, or KEDA-managed workloads rather than operator footprint alone."
        docs: "https://docs.redhat.com/en/documentation/red_hat_build_of_keda/latest/html-single/installing_and_using_red_hat_build_of_keda_on_openshift/index"
      cert_manager_operator:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when certificate lifecycle automation is expected on-cluster."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/security_and_compliance/cert-manager-operator-for-red-hat-openshift"
      cost_management_operator:
        required: false
        criticality: low
        expected_state: healthy
        owner: operations
        evidence_required: [must-gather, oc-get]
        notes: "Require when chargeback, showback, or cost allocation is part of the operating model, with validation based on actual Cost Management Metrics Operator deployment plus CostManagementMetricsConfig resources rather than operator footprint alone."
        docs: "https://docs.redhat.com/en/documentation/cost_management_service/latest/html/integrating_openshift_container_platform_clusters_to_cost_management/index"
      advanced_cluster_management:
        required: false
        criticality: medium
        expected_state: present
        owner: operations
        evidence_required: [must-gather, oc-get]
        notes: "Require when the cluster should be managed by ACM or a fleet-management hub."
        docs: "https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_management_for_kubernetes/latest"
      openshift_data_foundation:
        required: false
        criticality: high
        expected_state: healthy
        owner: storage
        evidence_required: [must-gather, oc-get]
        notes: "Show when ODF resources exist, have findings, or ODF is required by the customer profile."
        docs: "https://docs.redhat.com/en/documentation/red_hat_openshift_data_foundation/latest"
      openshift_virtualization:
        required: false
        criticality: high
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Show when OpenShift Virtualization resources such as KubeVirt, HyperConverged, VM, or VMI objects exist, have findings, or are required."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/virtualization/index"
      openshift_ai:
        required: false
        criticality: medium
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Show when AI or model-serving resources exist, have findings, or are required."
        docs: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/latest"
      external_secrets_operator:
        required: false
        criticality: medium
        expected_state: healthy
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when secrets are expected to be synchronized from an external secret manager through configured SecretStore or ClusterSecretStore resources plus ExternalSecret objects."
        docs: "https://external-secrets.io/latest/"
      cluster_autoscaler_configuration:
        required: false
        criticality: medium
        expected_state: present
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "For standalone clusters, require when the cluster runs on a public-cloud platform or is otherwise confirmed to be IPI-based, Machine API-managed worker pools are in use, and worker autoscaling is expected for workload elasticity. For hosted control plane clusters, validate autoscaling through HostedCluster or NodePool autoscaling configuration instead of assuming a standalone ClusterAutoscaler object will exist. Do not assume this applies to self-managed UPI-style clusters."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/machine_management/applying-autoscaling"
      machine_health_check_remediation:
        required: true
        criticality: high
        expected_state: present
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Worker auto-remediation is expected for most production clusters that use Machine API-managed worker pools, except where the customer intentionally does not use MachineHealthCheck remediation."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/machine_management/index"
      image_registry_policy_governance:
        required: true
        criticality: medium
        expected_state: healthy
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Image registry exposure, import filters, insecure registry configuration, internal-registry workload use, and pruning posture should be intentionally governed with no outstanding registry-policy findings."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/registry/index"
      disconnected_cluster_image_sources:
        required: false
        criticality: critical
        expected_state: configured
        owner: platform
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Require for restricted-network or air-gapped clusters that must use mirrored release, operator, and workload image sources."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/disconnected_environments/disconnected_environments"
      cluster_image_mirror_configuration:
        required: false
        criticality: high
        expected_state: configured
        owner: platform
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Required when release, operator, or workload image pulls should use cluster-level mirror resources that point to internal registries, even when the cluster is not fully disconnected."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/disconnected_environments/configuring-a-cluster-to-use-mirror-registry-images"
      workloads_using_external_private_registries:
        required: false
        criticality: medium
        expected_state: healthy
        owner: delivery
        evidence_required: [must-gather, oc-get]
        notes: "Require when application workloads are expected to pull from external private registries or credentialed public registries, with corresponding workload or service-account pull-credential evidence."
        docs: "https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/"
      cluster_proxy_configuration:
        required: false
        criticality: high
        expected_state: configured
        owner: network
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Require when outbound traffic must traverse a corporate proxy and the cluster-wide proxy must include correct internal noProxy exclusions for cluster traffic."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/configuring_network_settings/enable-cluster-wide-proxy"
      custom_ca_trust_bundle:
        required: false
        criticality: high
        expected_state: configured
        owner: security
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Require when internal registries, proxies, or endpoints use private trust roots."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/security_and_compliance/configuring-certificates"
      ovn_ipsec_encryption:
        required: false
        criticality: high
        expected_state: configured
        owner: network
        evidence_required: [must-gather, oc-get]
        notes: "Require when the cluster uses OVN-Kubernetes and the customer expects OVN IPsec encryption for pod-to-pod or external traffic."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/network_security/configuring-ipsec-ovn"
      etcd_encryption:
        required: true
        criticality: high
        expected_state: healthy
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when OpenShift API resources stored in etcd must be encrypted at rest and the encryption rollout is completed across the API server components that report encryption status."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/etcd/etcd#enabling-etcd-encryption_encrypting-etcd"
      platform_encryption_at_rest:
        required: true
        criticality: high
        expected_state: healthy
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Production clusters should have an explicit data-at-rest encryption posture with completed etcd encryption rollout across the API server components that report encryption status."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/etcd/etcd#enabling-etcd-encryption_encrypting-etcd"
      namespace_network_policy_baseline:
        required: true
        criticality: medium
        expected_state: healthy
        owner: network
        evidence_required: [must-gather, oc-get]
        notes: "Multi-tenant production clusters should have NetworkPolicy baseline coverage across observed user namespaces, or documented exceptions where tenant isolation is intentionally not enforced."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/network_security/network-policy"
      namespace_egress_controls:
        required: false
        criticality: medium
        expected_state: healthy
        owner: network
        evidence_required: [must-gather, oc-get]
        notes: "Require when shared-cluster user namespaces are expected to enforce outbound restrictions, with coverage validated from namespace-scoped NetworkPolicy egress rules and OpenShift EgressFirewall resources."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/network_security/egress-firewall"
      multi_tenant_namespace_governance:
        required: true
        criticality: medium
        expected_state: healthy
        owner: operations
        evidence_required: [must-gather, oc-get]
        notes: "Shared clusters should have an intentional team onboarding path for projects or namespaces, and non-admin users should not be able to self-provision namespaces directly. Validate disabled self-provisioning plus baseline tenant guardrails, including project request controls, team RBAC, NetworkPolicy coverage, namespace egress control coverage, ResourceQuota coverage, and LimitRange coverage or documented exceptions."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/building_applications/projects"
      service_mesh_control_plane:
        required: false
        criticality: medium
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Require when OpenShift Service Mesh is expected on the cluster, with validation based on actual ServiceMeshControlPlane deployment and readiness rather than operator footprint alone."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/service_mesh/index"
      openshift_serverless:
        required: false
        criticality: medium
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Require when OpenShift Serverless is expected on the cluster, with validation based on actual KnativeServing or KnativeEventing control-plane deployment and readiness rather than operator footprint alone."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/serverless/index"
      windows_container_workloads:
        required: false
        criticality: medium
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Require when Windows container support is expected on the cluster, with validation based on actual Windows nodes or Windows-targeted workloads rather than Windows Machine Config Operator footprint alone."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/windows_container_support_for_openshift/index"
      gpu_accelerated_workloads:
        required: false
        criticality: medium
        expected_state: healthy
        owner: platform
        evidence_required: [must-gather, oc-get, prometheus]
        notes: "Require when GPU-accelerated workloads are expected on the cluster, with validation based on actual GPU node capacity or GPU-requesting workloads rather than GPU operator footprint alone."
        docs: "https://docs.nvidia.com/datacenter/cloud-native/openshift/latest/index.html"
      sandboxed_container_workloads:
        required: false
        criticality: medium
        expected_state: healthy
        owner: security
        evidence_required: [must-gather, oc-get]
        notes: "Require when sandboxed containers are expected on the cluster, with validation based on actual KataConfig deployment or workloads using a kata runtime class rather than operator footprint alone."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/openshift_sandboxed_containers/index"
      node_tuning_operator:
        required: false
        criticality: medium
        expected_state: configured
        owner: platform
        evidence_required: [must-gather, oc-get]
        notes: "Require when node performance or custom kernel or runtime tuning is part of the baseline, with validation based on actual Tuned or tuned Profile custom resources rather than operator footprint alone."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/scalability_and_performance/using-node-tuning-operator"
      kubernetes_nmstate_networking:
        required: false
        criticality: medium
        expected_state: configured
        owner: network
        evidence_required: [must-gather, oc-get]
        notes: "Require when node network configuration is managed through NMState, with validation based on actual NMState or NodeNetworkConfigurationPolicy resources rather than operator footprint or node-state inventory alone."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/kubernetes_nmstate/index"
      descheduler_operator:
        required: false
        criticality: low
        expected_state: configured
        owner: operations
        evidence_required: [must-gather, oc-get]
        notes: "Require when workload rebalancing is part of the operations model, with validation based on an actual Descheduler custom resource rather than operator footprint alone."
        docs: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/nodes/nodes#nodes-descheduler"
      secondary_site_disaster_recovery:
        required: false
        criticality: critical
        expected_state: healthy
        owner: operations
        evidence_required: [must-gather, inspect, oc-get]
        notes: "Require when the customer expects secondary-site, Metro-DR, Regional-DR, or stretch-cluster recovery for OpenShift workloads, including two-cluster policy topology, protected applications, and replication evidence."
        docs: "https://docs.redhat.com/en/documentation/red_hat_openshift_data_foundation/4.21/html/configuring_openshift_data_foundation_disaster_recovery_for_openshift_workloads"
    evidence_mode: auto
    collect_live_support_artifacts: true
    live_support_collection_profile: all
    live_support_artifact_output_dir: ""
    live_support_artifact_parallelism: 2
    live_support_artifact_timeout_seconds: 1800
    collect_live_must_gather: false
    collect_live_inspect: false
    collect_live_cluster_compare: false
    collect_live_managed_gates: false
    collect_live_advisor_export: false
    collect_live_insights_archive: false
    collect_live_sosreport: true
    live_support_sosreport_nodes: []
    live_support_sosreport_node_selector: ""
    live_support_sosreport_node_limit: 3
    live_support_sosreport_args:
      - "-k"
      - "crio.all=on"
      - "-k"
      - "crio.logs=on"
      - "-k"
      - "podman.all=on"
      - "-k"
      - "podman.logs=on"
    live_support_cluster_compare_command_argv: []
    live_support_managed_gates_command_argv: []
    live_support_advisor_export_command_argv: []
    live_support_sosreport_command_argv: []
    case_bundle_path: ""
    must_gather_path: ""
    cluster_compare_path: ""
    managed_gates_path: ""
    inspect_path: ""
    control_plane_backup_search_paths:
      - "/home/core/assets/backup"
      - "/var/lib/etcd-backup"
      - "/var/backups/etcd"
      - "/opt/backups/etcd"
    sosreport_paths: []
    advisor_export_path: ""
    insights_archive_path: ""
    write_redaction_manifest: false
    redaction_manifest_path: ""
    write_redacted_bundle: false
    redacted_bundle_output_dir: ""
    platform_namespaces_regex: "^(default|openshift|openshift-.*|kube-system|kube-public|kube-node-lease|kube-.*|kubernetes-.*)$"
    user_namespaces_exclude_regex: "^(default|openshift|openshift-.*|kube-system|kube-public|kube-node-lease|kube-.*|kubernetes-.*)$"
    etcd_wal_fsync_p99_warn_ms: 10
    etcd_peer_rtt_p99_warn_ms: 50
    controlplane_to_worker_latency_warn_ms: 20
    worker_to_worker_latency_warn_ms: 20
    apiserver_latency_p99_warn_seconds: 1
    pod_density_warn_pct: 80
    pod_density_critical_pct: 90
    certificate_expiry_warn_days: 30
    certificate_expiry_critical_days: 7
    prom_queries:
      firing_alerts: 'ALERTS{alertstate="firing"}'
      etcd_wal_fsync_p99_ms: 'histogram_quantile(0.99, sum by (le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))) * 1000'
      etcd_backend_commit_p99_ms: 'histogram_quantile(0.99, sum by (le) (rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))) * 1000'
      etcd_leader_changes_5m: 'sum(increase(etcd_server_leader_changes_seen_total[5m]))'
      etcd_members_reporting_leader: 'sum(etcd_server_has_leader)'
      etcd_leader_count: 'sum(etcd_server_is_leader)'
      etcd_peer_rtt_p99_ms: 'histogram_quantile(0.99, sum by (le) (rate(etcd_network_peer_round_trip_time_seconds_bucket[5m]))) * 1000'
      controlplane_to_worker_network_latency_ms: ''
      worker_to_worker_network_latency_ms: ''
      apiserver_request_p99_seconds: 'histogram_quantile(0.99, sum by (le) (rate(apiserver_request_duration_seconds_bucket{verb!~"WATCH|LIST"}[5m])))'
      apiserver_request_5xx_rate: 'sum(rate(apiserver_request_total{code=~"5.."}[5m]))'
      apiserver_request_read_rate: 'sum(rate(apiserver_request_total{verb=~"GET|LIST|WATCH"}[5m]))'
      apiserver_request_write_rate: 'sum(rate(apiserver_request_total{verb!~"GET|LIST|WATCH"}[5m]))'
      apiserver_current_read_inflight: 'sum(apiserver_current_inflight_requests{request_kind="read"})'
      apiserver_current_write_inflight: 'sum(apiserver_current_inflight_requests{request_kind="mutating"})'
      apiserver_storage_objects_total: 'sum(apiserver_storage_objects)'
      node_cpu_utilization: '100 * (1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m]) * on(instance) group_left(node) label_replace(node_uname_info, "node", "$1", "nodename", "(.*)")))'
      node_memory_utilization: '100 * (1 - (sum by (node) (node_memory_MemAvailable_bytes * on(instance) group_left(node) label_replace(node_uname_info, "node", "$1", "nodename", "(.*)")) / sum by (node) (node_memory_MemTotal_bytes * on(instance) group_left(node) label_replace(node_uname_info, "node", "$1", "nodename", "(.*)"))))'
      node_disk_utilization: 'max by (node) (100 * (1 - ((node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|nsfs|squashfs"} * on(instance) group_left(node) label_replace(node_uname_info, "node", "$1", "nodename", "(.*)")) / (node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|nsfs|squashfs"} * on(instance) group_left(node) label_replace(node_uname_info, "node", "$1", "nodename", "(.*)")))))'
      kubelet_pod_density: '100 * (sum by (node) (kubelet_running_pods) / sum by (node) (kube_node_status_allocatable{resource="pods"}))'
      top_pod_cpu_usage: 'topk(20, sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!="",pod!="",namespace!~"openshift-.*"}[5m])))'
      top_pod_memory_usage: 'topk(20, sum by (namespace,pod) (container_memory_working_set_bytes{container!="",pod!="",namespace!~"openshift-.*"}))'
      pod_cpu_usage_all: 'sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!="",pod!="",namespace!~"openshift-.*"}[5m]))'
      pod_memory_usage_all: 'sum by (namespace,pod) (container_memory_working_set_bytes{container!="",pod!="",namespace!~"openshift-.*"})'
  tasks:
    - name: Resolve unified OpenShift report mode
      ansible.builtin.set_fact:
        report_mode_resolved: >-
          {{
            ('collected' if report_mode == 'offline' else report_mode)
            if (report_mode | default('auto')) != 'auto'
            else (
              'collected'
              if (
                (case_bundle_path | default('') | trim | length > 0)
                or (must_gather_path | default('') | trim | length > 0)
                or (inspect_path | default('') | trim | length > 0)
                or (cluster_compare_path | default('') | trim | length > 0)
                or (managed_gates_path | default('') | trim | length > 0)
                or (advisor_export_path | default('') | trim | length > 0)
                or ((sosreport_paths | default([])) | length > 0)
              )
              else 'live'
            )
          }}

    - name: Validate unified OpenShift report mode
      ansible.builtin.assert:
        that:
          - report_mode_resolved in ['live', 'collected']
        fail_msg: "Set report_mode to auto, live, collected, or offline."

    - name: Define run checkpoint paths
      ansible.builtin.set_fact:
        report_resume_state_dir: "{{ report_output_dir }}/.run-state/{{ platform_family }}"
        report_resume_manifest_path: "{{ report_output_dir }}/.run-state/{{ platform_family }}/{{ report_mode_resolved }}-latest.json"

    - name: Reset prior run checkpoint state for fresh run
      ansible.builtin.file:
        path: "{{ report_resume_state_dir }}"
        state: absent
      when: report_run_mode | default('fresh') == 'fresh'

    - name: Validate supported run mode
      ansible.builtin.assert:
        that:
          - (report_run_mode | default('fresh')) in ['fresh', 'resume_last_failure']
        fail_msg: "Set report_run_mode to fresh or resume_last_failure."

    - name: Check for resumable manifest
      ansible.builtin.stat:
        path: "{{ report_resume_manifest_path }}"
      register: report_resume_manifest_stat
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Fail when resume manifest is missing
      ansible.builtin.assert:
        that:
          - report_resume_manifest_stat.stat.exists
        fail_msg: "No resumable checkpoint manifest was found. Use report_run_mode=fresh first."
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Load resume manifest
      ansible.builtin.slurp:
        path: "{{ report_resume_manifest_path }}"
      register: report_resume_manifest_raw
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Decode resume manifest
      ansible.builtin.set_fact:
        report_resume_manifest: "{{ (report_resume_manifest_raw.content | b64decode | from_json) if (report_resume_manifest_raw is defined and (report_resume_manifest_raw.content | default('') | length > 0)) else {} }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Validate resume manifest content
      ansible.builtin.assert:
        that:
          - (report_resume_manifest.status | default('')) == 'failed'
          - (report_resume_manifest.report_mode | default('')) == report_mode_resolved
          - (report_resume_manifest.snapshot_path | default('') | length) > 0
          - (report_resume_manifest.resume_next_stage | default('') | length) > 0
        fail_msg: "The last saved checkpoint is not resumable for this report mode. Use report_run_mode=fresh."
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Load resume checkpoint snapshot
      ansible.builtin.include_vars:
        file: "{{ report_resume_manifest.snapshot_path }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Restore checkpoint pointers from manifest
      ansible.builtin.set_fact:
        report_resume_last_snapshot_path: "{{ report_resume_manifest.snapshot_path | default('') }}"
        report_resume_last_completed_stage: "{{ report_resume_manifest.last_completed_stage | default('') }}"
        report_resume_last_resume_next_stage: "{{ report_resume_manifest.resume_next_stage | default('') }}"
      when: report_run_mode | default('fresh') == 'resume_last_failure'

    - name: Run live OpenShift health workflow
      when:
        - report_mode_resolved == 'live'
        - report_run_mode | default('fresh') == 'fresh'
      block:
        - name: Run preflight checks
          ansible.builtin.include_role:
            name: preflight_common

        - name: Run OpenShift preflight checks
          ansible.builtin.include_role:
            name: preflight_openshift

        - name: Collect common cluster data
          ansible.builtin.include_role:
            name: collect_common

        - name: Collect OpenShift cluster data
          ansible.builtin.include_role:
            name: collect_openshift

        - name: Build preliminary OpenShift analysis graph
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: build_analysis_graph.yml

        - name: Project preliminary OpenShift analysis graph
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: project_analysis_graph.yml

        - name: Run preliminary core analysis for node debug targets
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: core.yml

        - name: Derive targeted node debug candidates
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: node_debug_targets.yml

        - name: Collect live support artifacts
          ansible.builtin.include_role:
            name: collect_live_support_evidence

        - name: Save live collection checkpoint
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: collection
            run_checkpoint_resume_next_stage: analysis
            run_checkpoint_status: completed
            run_checkpoint_write_snapshot: true

        - name: Run common analysis
          ansible.builtin.include_role:
            name: analyze_common

        - name: Analyze OpenShift-specific data
          ansible.builtin.include_role:
            name: analyze_openshift

        - name: Save live analysis checkpoint
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: analysis
            run_checkpoint_resume_next_stage: report
            run_checkpoint_status: completed
            run_checkpoint_write_snapshot: true

        - name: Build live OpenShift report
          ansible.builtin.include_role:
            name: report_openshift
        - name: Mark live run checkpoint as completed
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: render
            run_checkpoint_resume_next_stage: ""
            run_checkpoint_status: completed
            run_checkpoint_write_snapshot: false
      rescue:
        - name: Record failed live run checkpoint
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: "{{ report_resume_last_resume_next_stage | default('collection') }}"
            run_checkpoint_resume_next_stage: "{{ report_resume_last_resume_next_stage | default('') }}"
            run_checkpoint_status: failed
            run_checkpoint_write_snapshot: false
        - name: Re-raise live workflow failure
          ansible.builtin.fail:
            msg: "Live OpenShift workflow failed. Re-run with report_run_mode=resume_last_failure to continue from the last saved checkpoint."
      always:
        - name: Ensure temporary collection artifacts are removed
          ansible.builtin.file:
            path: "{{ collection_run_metadata.results_path | dirname }}"
            state: absent
          when:
            - report_mode_resolved == 'live'
            - not (keep_collection_artifacts | bool)
            - collection_run_metadata is defined
            - collection_run_metadata.results_path | default('') | length > 0
          failed_when: false

    - name: Resume live OpenShift health workflow from checkpoint
      when:
        - report_mode_resolved == 'live'
        - report_run_mode | default('fresh') == 'resume_last_failure'
      block:
        - name: Resume live analysis and report stages
          when: (report_resume_manifest.resume_next_stage | default('')) == 'analysis'
          block:
            - name: Run common analysis
              ansible.builtin.include_role:
                name: analyze_common
            - name: Analyze OpenShift-specific data
              ansible.builtin.include_role:
                name: analyze_openshift
            - name: Save resumed live analysis checkpoint
              ansible.builtin.include_role:
                name: report_common
                tasks_from: save_run_checkpoint.yml
              vars:
                run_checkpoint_stage: analysis
                run_checkpoint_resume_next_stage: report
                run_checkpoint_status: completed
                run_checkpoint_write_snapshot: true
            - name: Build live OpenShift report
              ansible.builtin.include_role:
                name: report_openshift
        - name: Resume live report stage only
          when: (report_resume_manifest.resume_next_stage | default('')) == 'report'
          ansible.builtin.include_role:
            name: report_openshift
        - name: Mark resumed live run checkpoint as completed
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: render
            run_checkpoint_resume_next_stage: ""
            run_checkpoint_status: completed
            run_checkpoint_write_snapshot: false
      rescue:
        - name: Record failed resumed live run checkpoint
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: "{{ report_resume_manifest.resume_next_stage | default('report') }}"
            run_checkpoint_resume_next_stage: "{{ report_resume_manifest.resume_next_stage | default('') }}"
            run_checkpoint_status: failed
            run_checkpoint_write_snapshot: false
        - name: Re-raise resumed live workflow failure
          ansible.builtin.fail:
            msg: "Resumed live OpenShift workflow failed again. Fix the reported issue and rerun with report_run_mode=resume_last_failure or use report_run_mode=fresh for a clean restart."

    - name: Run collected-state OpenShift evidence workflow
      when:
        - report_mode_resolved == 'collected'
        - report_run_mode | default('fresh') == 'fresh'
      block:
        - name: Load common evidence
          ansible.builtin.include_role:
            name: load_evidence_common

        - name: Load OpenShift evidence
          ansible.builtin.include_role:
            name: load_evidence_openshift

        - name: Prepare collected-state OpenShift analysis
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: prepare_collected_state.yml

        - name: Run common analysis against collected-state inputs
          ansible.builtin.include_role:
            name: analyze_common

        - name: Run unified OpenShift analysis against collected-state inputs
          ansible.builtin.include_role:
            name: analyze_openshift

        - name: Build collected-state OpenShift health synthesis
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: collected_state_health.yml

        - name: Finalize collected-state supportability rollup
          ansible.builtin.include_role:
            name: analyze_openshift
            tasks_from: finalize_collected_supportability.yml

        - name: Save collected analysis checkpoint
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: analysis
            run_checkpoint_resume_next_stage: report
            run_checkpoint_status: completed
            run_checkpoint_write_snapshot: true

        - name: Build collected-state OpenShift report
          ansible.builtin.include_role:
            name: report_openshift
            tasks_from: render_collected_state_report.yml
        - name: Mark collected run checkpoint as completed
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: render
            run_checkpoint_resume_next_stage: ""
            run_checkpoint_status: completed
            run_checkpoint_write_snapshot: false
      rescue:
        - name: Record failed collected run checkpoint
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: "{{ report_resume_last_resume_next_stage | default('analysis') }}"
            run_checkpoint_resume_next_stage: "{{ report_resume_last_resume_next_stage | default('') }}"
            run_checkpoint_status: failed
            run_checkpoint_write_snapshot: false
        - name: Re-raise collected workflow failure
          ansible.builtin.fail:
            msg: "Collected-state OpenShift workflow failed. Re-run with report_run_mode=resume_last_failure to continue from the last saved checkpoint."

    - name: Resume collected-state OpenShift workflow from checkpoint
      when:
        - report_mode_resolved == 'collected'
        - report_run_mode | default('fresh') == 'resume_last_failure'
      block:
        - name: Resume collected analysis and report stages
          when: (report_resume_manifest.resume_next_stage | default('')) == 'analysis'
          block:
            - name: Run common analysis against collected-state inputs
              ansible.builtin.include_role:
                name: analyze_common
            - name: Run unified OpenShift analysis against collected-state inputs
              ansible.builtin.include_role:
                name: analyze_openshift
            - name: Build collected-state OpenShift health synthesis
              ansible.builtin.include_role:
                name: analyze_openshift
                tasks_from: collected_state_health.yml
            - name: Finalize collected-state supportability rollup
              ansible.builtin.include_role:
                name: analyze_openshift
                tasks_from: finalize_collected_supportability.yml
            - name: Save resumed collected analysis checkpoint
              ansible.builtin.include_role:
                name: report_common
                tasks_from: save_run_checkpoint.yml
              vars:
                run_checkpoint_stage: analysis
                run_checkpoint_resume_next_stage: report
                run_checkpoint_status: completed
                run_checkpoint_write_snapshot: true
            - name: Build collected-state OpenShift report
              ansible.builtin.include_role:
                name: report_openshift
                tasks_from: render_collected_state_report.yml
        - name: Resume collected report stage only
          when: (report_resume_manifest.resume_next_stage | default('')) == 'report'
          ansible.builtin.include_role:
            name: report_openshift
            tasks_from: render_collected_state_report.yml
        - name: Mark resumed collected run checkpoint as completed
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: render
            run_checkpoint_resume_next_stage: ""
            run_checkpoint_status: completed
            run_checkpoint_write_snapshot: false
      rescue:
        - name: Record failed resumed collected run checkpoint
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: "{{ report_resume_manifest.resume_next_stage | default('report') }}"
            run_checkpoint_resume_next_stage: "{{ report_resume_manifest.resume_next_stage | default('') }}"
            run_checkpoint_status: failed
            run_checkpoint_write_snapshot: false
        - name: Re-raise resumed collected workflow failure
          ansible.builtin.fail:
            msg: "Resumed collected-state OpenShift workflow failed again. Fix the reported issue and rerun with report_run_mode=resume_last_failure or use report_run_mode=fresh for a clean restart."
