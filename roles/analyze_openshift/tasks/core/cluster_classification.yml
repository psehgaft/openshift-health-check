---
- name: Classify OpenShift cluster shape and service model
  vars:
    cluster_config_v1_map: >-
      {{
        (
          (analysis_graph.configmaps | default({})).get('items', [])
          | selectattr('metadata.namespace', 'equalto', 'kube-system')
          | selectattr('metadata.name', 'equalto', 'cluster-config-v1')
          | list
          | first
        ) | default({})
      }}
    openshift_install_manifests_map: >-
      {{
        (
          (analysis_graph.configmaps | default({})).get('items', [])
          | selectattr('metadata.namespace', 'equalto', 'openshift-config')
          | selectattr('metadata.name', 'equalto', 'openshift-install-manifests')
          | list
          | first
        ) | default({})
      }}
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_openshift_cluster_classification.py"
    stdin: "{{ {
      'cluster_profile': (cluster_profile | default({})),
      'cluster_config_v1_data': (cluster_config_v1_map.data | default({})),
      'openshift_install_manifests_data': (openshift_install_manifests_map.data | default({})),
      'namespace_names': ((analysis_graph.namespaces | default({})).get('items', []) | map(attribute='metadata.name') | list),
      'machineset_count': ((analysis_graph.machinesets | default({})).get('items', []) | length),
      'node_count': (openshift_node_items | default([]) | length),
      'control_plane_node_count': (openshift_control_plane_node_count | default(0) | int),
      'worker_node_count': (openshift_worker_node_count | default(0) | int),
      'infra_node_count': (openshift_infra_node_count | default(0) | int)
    } | to_json }}"
  register: openshift_cluster_classification_cmd
  changed_when: false
  failed_when: false

- name: Normalize OpenShift cluster classification
  ansible.builtin.set_fact:
    openshift_cluster_classification: "{{ (openshift_cluster_classification_cmd.stdout | from_json) if (openshift_cluster_classification_cmd.rc == 0 and (openshift_cluster_classification_cmd.stdout | default('') | length > 0)) else {'platform_category': 'unknown', 'public_cloud': false, 'service_model': 'unknown', 'service_model_source': 'not-derived', 'service_model_confidence': 'low', 'service_variant': 'unknown', 'install_model': 'unknown', 'install_model_source': 'not-derived', 'install_model_confidence': 'low', 'control_plane_model': 'unknown', 'control_plane_model_source': 'not-derived', 'control_plane_model_confidence': 'low', 'cluster_classification_label': 'openshift', 'cluster_classification_source': 'default-openshift-fallback', 'cluster_classification_confidence': 'low', 'deployment_type': 'openshift', 'deployment_type_source': 'default-openshift-fallback', 'deployment_type_confidence': 'low', 'is_sno': false, 'is_hosted_control_plane': false, 'machine_api_worker_pool_count': 0, 'machine_api_managed_worker_pools': false, 'control_plane_node_count': (openshift_control_plane_node_count | default(0) | int), 'worker_node_count': (openshift_worker_node_count | default(0) | int), 'infra_node_count': (openshift_infra_node_count | default(0) | int)} }}"

- name: Extend cluster profile with deployment type
  ansible.builtin.set_fact:
    cluster_profile: "{{ cluster_profile | combine({'platform_category': (openshift_cluster_classification.platform_category | default('unknown')), 'public_cloud': (openshift_cluster_classification.public_cloud | default(false) | bool), 'service_model': (openshift_cluster_classification.service_model | default('unknown')), 'service_model_source': (openshift_cluster_classification.service_model_source | default('not-derived')), 'service_model_confidence': (openshift_cluster_classification.service_model_confidence | default('low')), 'service_variant': (openshift_cluster_classification.service_variant | default('unknown')), 'install_model': (openshift_cluster_classification.install_model | default('unknown')), 'install_model_source': (openshift_cluster_classification.install_model_source | default('not-derived')), 'install_model_confidence': (openshift_cluster_classification.install_model_confidence | default('low')), 'control_plane_model': (openshift_cluster_classification.control_plane_model | default('unknown')), 'control_plane_model_source': (openshift_cluster_classification.control_plane_model_source | default('not-derived')), 'control_plane_model_confidence': (openshift_cluster_classification.control_plane_model_confidence | default('low')), 'cluster_classification_label': (openshift_cluster_classification.cluster_classification_label | default('openshift')), 'cluster_classification_source': (openshift_cluster_classification.cluster_classification_source | default('default-openshift-fallback')), 'cluster_classification_confidence': (openshift_cluster_classification.cluster_classification_confidence | default('low')), 'deployment_type': (openshift_cluster_classification.deployment_type | default('openshift')), 'deployment_type_source': (openshift_cluster_classification.deployment_type_source | default('default-openshift-fallback')), 'deployment_type_confidence': (openshift_cluster_classification.deployment_type_confidence | default('low')), 'is_sno': (openshift_cluster_classification.is_sno | default(false) | bool), 'is_hosted_control_plane': (openshift_cluster_classification.is_hosted_control_plane | default(false) | bool), 'machine_api_worker_pool_count': (openshift_cluster_classification.machine_api_worker_pool_count | default(0) | int), 'machine_api_managed_worker_pools': (openshift_cluster_classification.machine_api_managed_worker_pools | default(false) | bool), 'control_plane_node_count': (openshift_cluster_classification.control_plane_node_count | default(openshift_control_plane_node_count | default(0) | int) | int), 'worker_node_count': (openshift_cluster_classification.worker_node_count | default(openshift_worker_node_count | default(0) | int) | int), 'infra_node_count': (openshift_cluster_classification.infra_node_count | default(openshift_infra_node_count | default(0) | int) | int)}, recursive=True) }}"

- name: Resolve OpenShift cluster profile mode
  vars:
    openshift_mode_signal_text: >-
      {{
        (
          (cluster_profile.infrastructure_name | default(''))
          ~ ' '
          ~ (cluster_profile.base_domain | default(''))
          ~ ' '
          ~ (oc_context_cmd.stdout | default(''))
        ) | lower
      }}
  ansible.builtin.set_fact:
    resolved_cluster_profile_mode: >-
      {{
        cluster_profile_mode
        if (cluster_profile_mode | default('auto')) in ['production', 'development', 'lightweight']
        else (
          'development'
          if (openshift_mode_signal_text | regex_search('(^|[^a-z0-9])(dev|development|lab|sandbox|demo|poc|test|qa|nonprod|non-prod)([^a-z0-9]|$)'))
          else 'production'
        )
      }}
    resolved_cluster_profile_mode_source: >-
      {{
        'manual-override'
        if (cluster_profile_mode | default('auto')) in ['production', 'development', 'lightweight']
        else (
          'name-context-keyword-heuristic'
          if (openshift_mode_signal_text | regex_search('(^|[^a-z0-9])(dev|development|lab|sandbox|demo|poc|test|qa|nonprod|non-prod)([^a-z0-9]|$)'))
          else 'default-production'
        )
      }}
