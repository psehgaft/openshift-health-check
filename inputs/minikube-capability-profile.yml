---
# Minikube or local lightweight cluster capability profile.
# Use with:
#   ansible-playbook playbooks/minikube_cluster_health_report.yml -e @inputs/minikube-capability-profile.yml
kubernetes_report_capability_profile:
  deprecated_api_review:
    required: true
    criticality: medium
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "Deprecated API use should still be visible before upgrading local tooling."
  network_policy_baseline:
    required: false
    criticality: low
    expected_state: configured
    owner: security
    evidence_required: [kubectl-get]
    notes: "Optional for local single-user clusters."
  resource_quota_governance:
    required: false
    criticality: low
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "Optional for local single-user clusters."
  limit_range_defaults:
    required: false
    criticality: low
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "Optional for local single-user clusters."
  workload_resilience:
    required: false
    criticality: low
    expected_state: configured
    owner: app
    evidence_required: [kubectl-get]
    notes: "Optional for local testing unless resilience behavior is the test target."
  resource_requests_limits:
    required: false
    criticality: low
    expected_state: configured
    owner: app
    evidence_required: [kubectl-get]
    notes: "Recommended for realistic tests, but not required for local experiments."
  external_storage:
    required: false
    criticality: low
    expected_state: present
    owner: storage
    evidence_required: [kubectl-get]
    notes: "Optional for local clusters unless persistent data tests are in scope."
  ingress_exposure:
    required: false
    criticality: low
    expected_state: configured
    owner: network
    evidence_required: [kubectl-get]
    notes: "Optional unless local ingress behavior is being tested."
  tls_certificate_hygiene:
    required: false
    criticality: low
    expected_state: configured
    owner: security
    evidence_required: [kubectl-get]
    notes: "Optional for local clusters."
  backup:
    required: false
    criticality: low
    expected_state: healthy
    owner: operations
    evidence_required: [kubectl-get]
    notes: "Optional for local clusters."
  external_logging:
    required: false
    criticality: low
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get]
    notes: "Optional for local clusters."
  external_monitoring:
    required: false
    criticality: low
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Optional for local clusters."
  user_workload_monitoring:
    required: false
    criticality: low
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Optional for local clusters."
  grafana_dashboards:
    required: false
    criticality: low
    expected_state: present
    owner: observability
    evidence_required: [kubectl-get]
    notes: "Optional for local clusters."
  external_private_registry:
    required: false
    criticality: low
    expected_state: configured
    owner: delivery
    evidence_required: [kubectl-get]
    notes: "Optional unless local workloads pull images from an external private registry."
  autoscaling:
    required: false
    criticality: low
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get, metrics]
    notes: "Optional for local clusters."
  policy_engine:
    required: false
    criticality: low
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Optional unless policy behavior is being tested."
  secrets_management:
    required: false
    criticality: low
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Optional unless secret workflow behavior is being tested."
  workload_vulnerability_scanner:
    required: false
    criticality: low
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Optional unless scanner behavior is being tested."
  cicd_runners:
    required: false
    criticality: low
    expected_state: present
    owner: delivery
    evidence_required: [kubectl-get, metrics]
    notes: "Show when local runner pods are detected or required."
  service_mesh:
    required: false
    criticality: low
    expected_state: present
    owner: network
    evidence_required: [kubectl-get]
    notes: "Optional unless service mesh behavior is being tested."
  provider_node_pools:
    required: false
    criticality: low
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get, provider-api]
    notes: "Not expected for Minikube or local lightweight clusters."
