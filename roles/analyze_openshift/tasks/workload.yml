---
- name: Build platform pod issue list
  ansible.builtin.set_fact:
    platform_pod_issues: "{{ platform_pod_issues | default([]) + pod_issue }}"
  loop: "{{ (analysis_graph.pods | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    phase: "{{ item.status.phase | default('Unknown') }}"
    ready_container_count: "{{ item.status.containerStatuses | default([]) | selectattr('ready', 'equalto', true) | list | length | int }}"
    total_container_count: "{{ item.status.containerStatuses | default([]) | length | int }}"
    pod_issue: >-
      {{
        [{
          'namespace': ns_name,
          'name': item.metadata.name,
          'phase': phase,
          'ready': (ready_container_count | int) ~ '/' ~ (total_container_count | int)
        }]
        if (
          ((ns_name is match(platform_namespaces_regex)) and (phase not in ['Running', 'Succeeded', 'Completed']))
          or
          ((ns_name is match(platform_namespaces_regex)) and phase == 'Running' and (total_container_count | int) > 0 and (ready_container_count | int) < (total_container_count | int))
        ) else []
      }}
  changed_when: false

- name: Build deployment health findings
  ansible.builtin.set_fact:
    deployment_issues: "{{ deployment_issues | default([]) + issue_entry }}"
  loop: "{{ (analysis_graph.deployments | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    desired: "{{ item.spec.replicas | default(1) | int }}"
    available: "{{ item.status.availableReplicas | default(0) | int }}"
    ready: "{{ item.status.readyReplicas | default(0) | int }}"
    updated: "{{ item.status.updatedReplicas | default(0) | int }}"
    issue_entry: "{{ [{'kind': 'Deployment', 'namespace': ns_name, 'name': item.metadata.name, 'desired': (desired | int), 'available': (available | int), 'ready': (ready | int), 'updated': (updated | int)}] if (is_user_namespace and (desired | int) > 0 and ((available | int) < (desired | int) or (ready | int) < (desired | int) or (updated | int) < (desired | int))) else [] }}"
  changed_when: false

- name: Build statefulset health findings
  ansible.builtin.set_fact:
    statefulset_issues: "{{ statefulset_issues | default([]) + issue_entry }}"
  loop: "{{ (analysis_graph.statefulsets | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    desired: "{{ item.spec.replicas | default(1) | int }}"
    available: "{{ item.status.currentReplicas | default(0) | int }}"
    ready: "{{ item.status.readyReplicas | default(0) | int }}"
    updated: "{{ item.status.updatedReplicas | default(0) | int }}"
    issue_entry: "{{ [{'kind': 'StatefulSet', 'namespace': ns_name, 'name': item.metadata.name, 'desired': (desired | int), 'available': (available | int), 'ready': (ready | int), 'updated': (updated | int)}] if (is_user_namespace and (desired | int) > 0 and ((ready | int) < (desired | int) or (updated | int) < (desired | int))) else [] }}"
  changed_when: false

- name: Build daemonset health findings
  ansible.builtin.set_fact:
    daemonset_issues: "{{ daemonset_issues | default([]) + issue_entry }}"
  loop: "{{ (analysis_graph.daemonsets | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    desired: "{{ item.status.desiredNumberScheduled | default(0) | int }}"
    available: "{{ item.status.numberReady | default(0) | int }}"
    updated: "{{ item.status.updatedNumberScheduled | default(0) | int }}"
    issue_entry: "{{ [{'kind': 'DaemonSet', 'namespace': ns_name, 'name': item.metadata.name, 'desired': (desired | int), 'available': (available | int), 'ready': (available | int), 'updated': (updated | int)}] if (is_user_namespace and (desired | int) > 0 and ((available | int) < (desired | int) or (updated | int) < (desired | int))) else [] }}"
  changed_when: false

- name: Combine workload health findings
  ansible.builtin.set_fact:
    workload_health_issues: "{{ (deployment_issues | default([])) + (statefulset_issues | default([])) + (daemonset_issues | default([])) }}"

- name: Build deploymentconfig health findings
  ansible.builtin.set_fact:
    deploymentconfig_issues: "{{ deploymentconfig_issues | default([]) + issue_entry }}"
  loop: "{{ (analysis_graph.deploymentconfigs | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    desired: "{{ item.spec.replicas | default(1) | int }}"
    available: "{{ item.status.availableReplicas | default(0) | int }}"
    ready: "{{ item.status.readyReplicas | default(0) | int }}"
    updated: "{{ item.status.updatedReplicas | default(0) | int }}"
    issue_entry: "{{ [{'kind': 'DeploymentConfig', 'namespace': ns_name, 'name': item.metadata.name, 'desired': (desired | int), 'available': (available | int), 'ready': (ready | int), 'updated': (updated | int)}] if (is_user_namespace and (desired | int) > 0 and ((available | int) < (desired | int) or (ready | int) < (desired | int) or (updated | int) < (desired | int))) else [] }}"
  changed_when: false

- name: Merge deploymentconfig health findings
  ansible.builtin.set_fact:
    workload_health_issues: "{{ (workload_health_issues | default([])) + (deploymentconfig_issues | default([])) }}"

- name: Build deploymentconfig high replica review findings
  ansible.builtin.set_fact:
    high_replica_workloads: "{{ (high_replica_workloads | default([])) + replica_review_entry }}"
  loop: "{{ (analysis_graph.deploymentconfigs | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    desired_replicas: "{{ item.spec.replicas | default(1) | int }}"
    replica_review_entry: >-
      {{
        [{
          'kind': 'DeploymentConfig',
          'namespace': ns_name,
          'name': item.metadata.name | default('unknown'),
          'replicas': desired_replicas
        }]
        if ((is_user_namespace | bool) and (desired_replicas | int) > 10) else []
      }}
  changed_when: false

- name: Create workload label governance input file
  ansible.builtin.tempfile:
    state: file
    suffix: workload-label-governance.json
  register: workload_label_governance_input_file
  changed_when: false

- name: Write workload label governance input
  ansible.builtin.copy:
    dest: "{{ workload_label_governance_input_file.path }}"
    mode: "0600"
    content: "{{ {
      'user_namespaces_exclude_regex': user_namespaces_exclude_regex,
      'namespaces': ((analysis_graph.namespaces | default({})).get('items', [])),
      'pods': ((analysis_graph.pods | default({})).get('items', [])),
      'deployments': ((analysis_graph.deployments | default({})).get('items', [])),
      'statefulsets': ((analysis_graph.statefulsets | default({})).get('items', [])),
      'daemonsets': ((analysis_graph.daemonsets | default({})).get('items', [])),
      'deploymentconfigs': ((analysis_graph.deploymentconfigs | default({})).get('items', [])),
      'serviceaccounts': ((analysis_graph.serviceaccounts | default({})).get('items', [])),
      'gitops_applications': ((analysis_graph.gitops_applications | default({})).get('items', []))
    } | to_json }}"
  changed_when: false

- name: Build pod team ownership label review findings
  ansible.builtin.shell: |
    python3 - <<'PY' "{{ workload_label_governance_input_file.path }}"
    import json
    import re
    import sys
    from collections import defaultdict

    with open(sys.argv[1], "r", encoding="utf-8") as handle:
        data = json.load(handle)

    workload_owner_label_keys = [
        "team", "owner", "owner.team", "team-name", "team_name",
        "app.kubernetes.io/team", "app.kubernetes.io/owner", "ops.team", "ops.owner",
    ]
    cost_label_keys = [
        "cost-center", "cost_center", "costcenter", "billing-code",
        "billing_code", "chargeback", "chargeback-code", "chargeback_code",
        "business-unit", "business_unit", "department",
    ]

    exclude_regex = str(data.get("user_namespaces_exclude_regex") or "")
    namespace_map = {}
    namespace_objects = defaultdict(list)

    def namespace_of(obj):
        return str(((obj.get("metadata") or {}).get("namespace")) or "").strip()

    def destination_namespace_of(app):
        return str(((((app.get("spec") or {}).get("destination")) or {}).get("namespace")) or "").strip()

    def labels_of(obj):
        return (((obj.get("metadata") or {}).get("labels")) or {})

    def annotations_of(obj):
        return (((obj.get("metadata") or {}).get("annotations")) or {})

    def first_present_value(keys, labels, annotations, related_objects):
        for key in keys:
            value = str(labels.get(key, "")).strip()
            if value:
                return value
            value = str(annotations.get(key, "")).strip()
            if value:
                return value
        for obj in related_objects:
            obj_labels = labels_of(obj)
            obj_annotations = annotations_of(obj)
            for key in keys:
                value = str(obj_labels.get(key, "")).strip()
                if value:
                    return value
                value = str(obj_annotations.get(key, "")).strip()
                if value:
                    return value
        return ""

    def present_owner_keys(labels):
        keys = []
        for key in workload_owner_label_keys:
            if str(labels.get(key, "")).strip():
                keys.append(key)
        return keys

    for namespace_obj in data.get("namespaces") or []:
        ns_name = str((((namespace_obj.get("metadata") or {}).get("name")) or "")).strip()
        if ns_name:
            namespace_map[ns_name] = namespace_obj

    for collection_name in [
        "deployments", "statefulsets", "daemonsets", "deploymentconfigs", "serviceaccounts",
    ]:
        for obj in data.get(collection_name) or []:
            ns = namespace_of(obj)
            if ns:
                namespace_objects[ns].append(obj)

    for app in data.get("gitops_applications") or []:
        ns = destination_namespace_of(app)
        if ns:
            namespace_objects[ns].append(app)

    findings = []
    for pod in data.get("pods") or []:
        ns_name = namespace_of(pod)
        if not ns_name or re.match(exclude_regex, ns_name):
            continue

        pod_phase = str((((pod.get("status") or {}).get("phase")) or "Unknown")).strip()
        if pod_phase in {"Succeeded", "Completed"}:
            continue

        labels = labels_of(pod)
        present_keys = present_owner_keys(labels)
        if present_keys:
            continue

        pod_name = str((((pod.get("metadata") or {}).get("name")) or "unknown")).strip() or "unknown"
        workload_name_hint = str(labels.get("app.kubernetes.io/name", labels.get("app", pod_name))).strip() or pod_name

        namespace_obj = namespace_map.get(ns_name) or {}
        namespace_labels = labels_of(namespace_obj)
        namespace_annotations = annotations_of(namespace_obj)
        related_objects = namespace_objects.get(ns_name, [])

        namespace_owner_value = (
            first_present_value(workload_owner_label_keys, namespace_labels, namespace_annotations, related_objects)
            or ns_name
        )
        namespace_owner_email = first_present_value(["owner.email"], namespace_labels, namespace_annotations, related_objects)
        namespace_owner_contact = first_present_value(["contact"], namespace_labels, namespace_annotations, related_objects)
        namespace_cost_value = first_present_value(cost_label_keys, namespace_labels, namespace_annotations, related_objects)

        findings.append({
            "kind": "Pod",
            "namespace": ns_name,
            "name": pod_name,
            "recommended_label_values": [
                f"team={namespace_owner_value}",
                f"app.kubernetes.io/owner={namespace_owner_value}",
                (
                    f"cost-center={namespace_cost_value}"
                    if namespace_cost_value
                    else f"cost-center=<set-cost-center-for-{ns_name}>"
                ),
            ],
            "recommended_annotation_values": [
                (
                    f"owner.email={namespace_owner_email}"
                    if namespace_owner_email
                    else f"owner.email=<set-email-for-{namespace_owner_value}>"
                ),
                (
                    f"owner.contact={namespace_owner_contact}"
                    if namespace_owner_contact
                    else f"owner.contact=<set-contact-for-{workload_name_hint}>"
                ),
            ],
            "present_label_keys": present_keys,
        })

    print(json.dumps({"workload_label_governance_findings": findings}))
    PY
  register: workload_label_governance_cmd
  changed_when: false

- name: Remove workload label governance input file
  ansible.builtin.file:
    path: "{{ workload_label_governance_input_file.path }}"
    state: absent
  when: workload_label_governance_input_file is defined and (workload_label_governance_input_file.path | default('') | length > 0)
  changed_when: false

- name: Normalize pod team ownership label review findings
  ansible.builtin.set_fact:
    workload_label_governance_findings: >-
      {{
        ((workload_label_governance_cmd.stdout | default('{}') | from_json).workload_label_governance_findings | default([]))
      }}
  changed_when: false

- name: Build deploymentconfig resource requirement findings
  ansible.builtin.set_fact:
    workload_resource_findings: "{{ (workload_resource_findings | default([])) + resource_entries }}"
  loop: "{{ (analysis_graph.deploymentconfigs | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    pod_spec: "{{ item.spec.template.spec | default({}) }}"
    containers: "{{ (pod_spec.containers | default([])) + (pod_spec.initContainers | default([])) }}"
    containers_without_requests: "{{ containers | rejectattr('resources.requests', 'defined') | map(attribute='name') | list }}"
    containers_without_limits: "{{ containers | rejectattr('resources.limits', 'defined') | map(attribute='name') | list }}"
    resource_entries: >-
      {{
        ([] +
        ([{
          'kind': 'DeploymentConfig',
          'namespace': ns_name,
          'name': item.metadata.name | default('unknown'),
          'issue': 'workload-missing-resource-requests',
          'detail': containers_without_requests | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and containers_without_requests | length > 0 else []) +
        ([{
          'kind': 'DeploymentConfig',
          'namespace': ns_name,
          'name': item.metadata.name | default('unknown'),
          'issue': 'workload-missing-resource-limits',
          'detail': containers_without_limits | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and containers_without_limits | length > 0 else []))
      }}
  changed_when: false

- name: Build deployment probe coverage findings
  ansible.builtin.set_fact:
    workload_probe_findings: "{{ workload_probe_findings | default([]) + probe_findings }}"
  loop: "{{ (analysis_graph.deployments | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    workload_name: "{{ item.metadata.name | default('') }}"
    containers: "{{ item.spec.template.spec.containers | default([]) }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    missing_liveness_containers: "{{ containers | rejectattr('livenessProbe', 'defined') | map(attribute='name') | list }}"
    missing_readiness_containers: "{{ containers | rejectattr('readinessProbe', 'defined') | map(attribute='name') | list }}"
    missing_startup_containers: "{{ containers | rejectattr('startupProbe', 'defined') | map(attribute='name') | list }}"
    probe_findings: >-
      {{
        ([] +
        ([{
          'kind': 'Deployment',
          'namespace': ns_name,
          'name': workload_name,
          'issue': 'missing-liveness-probe',
          'containers': missing_liveness_containers,
          'detail': missing_liveness_containers | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and missing_liveness_containers | length > 0 else []) +
        ([{
          'kind': 'Deployment',
          'namespace': ns_name,
          'name': workload_name,
          'issue': 'missing-readiness-probe',
          'containers': missing_readiness_containers,
          'detail': missing_readiness_containers | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and missing_readiness_containers | length > 0 else []) +
        ([{
          'kind': 'Deployment',
          'namespace': ns_name,
          'name': workload_name,
          'issue': 'missing-startup-probe',
          'containers': missing_startup_containers,
          'detail': missing_startup_containers | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and missing_startup_containers | length > 0 else []))
      }}
  changed_when: false

- name: Build statefulset probe coverage findings
  ansible.builtin.set_fact:
    workload_probe_findings: "{{ workload_probe_findings | default([]) + probe_findings }}"
