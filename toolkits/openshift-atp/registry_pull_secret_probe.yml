---
- name: "Pull-secret registry discovery: enumerate registry host keys only"
  ansible.builtin.shell:
    cmd: |
      set -uo pipefail
      encoded="$(oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}' 2>/dev/null)"
      if [[ -z "$encoded" ]]; then
        echo "PULL_SECRET_REGISTRY_INVENTORY=UNAVAILABLE"
        exit 2
      fi
      decoded="$(printf '%s' "$encoded" | base64 -d 2>/dev/null)" || {
        echo "PULL_SECRET_REGISTRY_INVENTORY=INVALID"
        exit 2
      }
      hosts="$(jq -r '.auths | keys[]' <<< "$decoded" 2>/dev/null)" || {
        echo "PULL_SECRET_REGISTRY_INVENTORY=INVALID"
        exit 2
      }
      if [[ -z "$hosts" ]]; then
        echo "PULL_SECRET_REGISTRY_INVENTORY=EMPTY"
        exit 0
      fi
      while IFS= read -r host; do
        [[ -n "$host" ]] && echo "PULL_SECRET_REGISTRY_HOST=$host"
      done <<< "$hosts"
      echo "PULL_SECRET_REGISTRY_INVENTORY=AVAILABLE"
    executable: /bin/bash
  register: atp_pullsecret_inventory_cmd
  changed_when: false
  failed_when: false
  no_log: true

- name: "Pull-secret registry discovery: summarize host inventory"
  ansible.builtin.set_fact:
    atp_pullsecret_registry_hosts: "{{ atp_pullsecret_inventory_cmd.stdout_lines | default([]) | select('match', '^PULL_SECRET_REGISTRY_HOST=') | map('regex_replace', '^PULL_SECRET_REGISTRY_HOST=', '') | list }}"

- name: "Pull-secret registry discovery: authenticate candidate registries with Podman"
  ansible.builtin.shell:
    cmd: |
      set -uo pipefail
      registry_ca_path={{ atp_external_registry_ca_path | default('') | quote }}
      if ! command -v podman >/dev/null 2>&1; then
        echo "PULL_SECRET_LOGIN_ERROR=podman is not installed on the Ansible execution host."
        exit 2
      fi
      encoded="$(oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}' 2>/dev/null)"
      if [[ -z "$encoded" ]]; then
        echo "PULL_SECRET_LOGIN_ERROR=OpenShift pull-secret is unavailable."
        exit 2
      fi
      workdir="$(mktemp -d)"
      chmod 700 "$workdir"
      trap 'rm -rf "$workdir"' EXIT
      auth_json="$workdir/pull-secret.json"
      auth_file="$workdir/podman-auth.json"
      cert_dir="$workdir/certs"
      umask 077
      if ! printf '%s' "$encoded" | base64 -d > "$auth_json"; then
        echo "PULL_SECRET_LOGIN_ERROR=Could not decode OpenShift pull-secret."
        exit 2
      fi
      printf '{"auths":{}}\n' > "$auth_file"
      chmod 600 "$auth_json" "$auth_file"
      login_args=(login --authfile "$auth_file" --tls-verify=true)
      if [[ -n "$registry_ca_path" ]]; then
        if [[ ! -r "$registry_ca_path" ]]; then
          echo "PULL_SECRET_LOGIN_ERROR=Configured registry CA file is not readable."
          exit 2
        fi
        mkdir -p "$cert_dir"
        cp "$registry_ca_path" "$cert_dir/ca.crt"
        login_args+=(--cert-dir "$cert_dir")
      fi

      candidate_count=0
      success_count=0
      declare -A seen_registries=()
      while IFS= read -r encoded_entry; do
        [[ -n "$encoded_entry" ]] || continue
        entry="$(printf '%s' "$encoded_entry" | base64 -d 2>/dev/null)" || continue
        raw_registry="$(jq -r '.key // empty' <<< "$entry")"
        username="$(jq -r '.value.username // empty' <<< "$entry")"
        password="$(jq -r '.value.password // empty' <<< "$entry")"
        auth="$(jq -r '.value.auth // empty' <<< "$entry")"
        if [[ ( -z "$username" || -z "$password" ) && -n "$auth" ]]; then
          decoded_auth="$(printf '%s' "$auth" | base64 -d 2>/dev/null || true)"
          if [[ "$decoded_auth" == *:* ]]; then
            username="${decoded_auth%%:*}"
            password="${decoded_auth#*:}"
          fi
        fi
        [[ -n "$username" && -n "$password" && -n "$raw_registry" ]] || continue

        registry="${raw_registry#https://}"
        registry="${registry#http://}"
        registry="${registry%%/*}"
        [[ "$registry" == "index.docker.io" ]] && registry="docker.io"
        [[ -n "$registry" && "$registry" != *[[:space:]]* ]] || continue
        [[ -z "${seen_registries[$registry]:-}" ]] || continue
        seen_registries["$registry"]=1
        candidate_count=$((candidate_count + 1))

        if printf '%s' "$password" | podman "${login_args[@]}" --username "$username" --password-stdin "$registry" >/dev/null 2>&1; then
          echo "PULL_SECRET_LOGIN_PASS=$registry"
          success_count=$((success_count + 1))
        else
          echo "PULL_SECRET_LOGIN_FAIL=$registry (login, network, or TLS validation failed)"
        fi
      done < <(jq -r '.auths | to_entries[] | @base64' "$auth_json" 2>/dev/null)

      echo "PULL_SECRET_LOGIN_CANDIDATES=$candidate_count"
      if [[ "$success_count" -gt 0 ]]; then
        echo "PULL_SECRET_LOGIN_RESULT=PASS"
        exit 0
      fi
      if [[ "$candidate_count" -eq 0 ]]; then
        echo "PULL_SECRET_LOGIN_RESULT=NO_CREDENTIALS"
        exit 2
      fi
      echo "PULL_SECRET_LOGIN_RESULT=FAIL"
      exit 1
    executable: /bin/bash
  register: atp_pullsecret_login_cmd
  changed_when: false
  failed_when: false
  no_log: true
  when: atp_registry_probe_pull_secret | default(false) | bool

- name: "Pull-secret registry discovery: summarize safe login evidence"
  ansible.builtin.set_fact:
    atp_pullsecret_login_success_hosts: "{{ atp_pullsecret_login_cmd.stdout_lines | default([]) | select('match', '^PULL_SECRET_LOGIN_PASS=') | map('regex_replace', '^PULL_SECRET_LOGIN_PASS=', '') | list }}"
    atp_pullsecret_login_failure_hosts: "{{ atp_pullsecret_login_cmd.stdout_lines | default([]) | select('match', '^PULL_SECRET_LOGIN_FAIL=') | map('regex_replace', '^PULL_SECRET_LOGIN_FAIL=', '') | list }}"
    atp_pullsecret_login_ok: "{{ (atp_pullsecret_login_cmd.rc | default(2) | int) == 0 and ('PULL_SECRET_LOGIN_RESULT=PASS' in (atp_pullsecret_login_cmd.stdout | default(''))) }}"
    atp_pullsecret_login_summary: >-
      {% if not (atp_registry_probe_pull_secret | default(false) | bool) %}
      Pull-secret Podman login was not run because an internal or configured external registry already passed; discovered entries: {{ atp_pullsecret_registry_hosts | default([]) | join(', ') if atp_pullsecret_registry_hosts | default([]) | length > 0 else 'none' }}.
      {% elif atp_pullsecret_login_ok | default(false) | bool %}
      Podman login succeeded for pull-secret registry host(s): {{ atp_pullsecret_login_success_hosts | default([]) | join(', ') }}.
      {% else %}
      No usable pull-secret registry login was confirmed. Candidate hosts: {{ atp_pullsecret_registry_hosts | default([]) | join(', ') if atp_pullsecret_registry_hosts | default([]) | length > 0 else 'none' }}. Details: {{ atp_pullsecret_login_cmd.stdout | default('Podman login not completed') | truncate(300) }}.
      {% endif %}
