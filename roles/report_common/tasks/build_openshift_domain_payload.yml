- name: Resolve shared OpenShift artifact facts
  vars:
    openshift_shared_collection_artifact: "{{ (openshift_shared_artifacts | default({})).get('collection', {}) }}"
    openshift_shared_analysis_graph_artifact: "{{ (openshift_shared_artifacts | default({})).get('analysis_graph', {}) }}"
  ansible.builtin.set_fact:
    openshift_shared_collection_artifact: "{{ openshift_shared_collection_artifact }}"
    openshift_shared_analysis_graph_artifact: "{{ openshift_shared_analysis_graph_artifact }}"
    openshift_artifact_backed_cluster_profile: >-
      {{
        (openshift_shared_analysis_graph_artifact.cluster_profile | default({}))
        if ((openshift_shared_analysis_graph_artifact.cluster_profile | default({})) | length > 0)
        else (
          (openshift_shared_collection_artifact.cluster_profile | default({}))
          if ((openshift_shared_collection_artifact.cluster_profile | default({})) | length > 0)
          else (cluster_profile | default({}))
        )
      }}

