---
- name: Build LokiStack logging capability artifact facts
  vars:
    day2_loki_stack_logging_section_current: "{{ (day2_capability_sections_by_key | default({})).get('loki_stack_logging', {}) }}"
    loki_crd_present_current: >-
      {{
        (
          ((analysis_graph.crds | default({})).get('items', []) | default([]))
          | selectattr('metadata', 'defined')
          | selectattr('metadata.name', 'defined')
          | map(attribute='metadata.name')
          | map('string')
          | map('lower')
          | select('in', ['lokistacks.loki.grafana.com', 'lokis.loki.grafana.com'])
          | list
          | length
        ) > 0
      }}
    lokistack_count_current: "{{ (((analysis_graph.lokistacks | default({})).get('items', []) | length) | int) }}"
    loki_namespace_present_current: "{{ ('openshift-logging' in (namespace_names | default([])) or 'loki' in (namespace_names | default([]))) | bool }}"
    loki_context_present_current: "{{ (loki_namespace_present_current | bool) or (loki_crd_present_current | bool) }}"
    loki_configuration_present_current: "{{ (lokistack_count_current | int) > 0 }}"
    loki_workload_present_current: >-
      {{
        (
          (all_workload_blobs | default([]))
          | map('string')
          | map('lower')
          | select('search', 'lokistack|/loki|loki:|loki@|loki-|[-.]loki|promtail|logcli|loki-distributor|loki-gateway|loki-querier|loki-compactor|loki-ingester|loki-ruler|loki-canary')
          | list
          | length
        ) > 0
      }}
    loki_stack_logging_present_current: "{{ (loki_configuration_present_current | bool) or (loki_workload_present_current | bool) }}"
    loki_missing_status_current: "{{ 'WARNING' if ((loki_context_present_current | bool) or (day2_loki_stack_logging_section_current.required | default(false) | bool)) else 'INFO' }}"
    loki_missing_check_status_current: "{{ 'WARN' if ((loki_context_present_current | bool) or (day2_loki_stack_logging_section_current.required | default(false) | bool)) else 'INFO' }}"
    loki_missing_severity_current: "{{ 'warning' if ((loki_context_present_current | bool) or (day2_loki_stack_logging_section_current.required | default(false) | bool)) else 'info' }}"
    loki_reason_summary_current: >-
      {{
        'lokistacks=' ~ ((lokistack_count_current | int) | string)
        ~ ' namespace_present=' ~ ((loki_namespace_present_current | bool) | string)
        ~ ' crd_present=' ~ ((loki_crd_present_current | bool) | string)
        ~ ' workload_present=' ~ ((loki_workload_present_current | bool) | string)
      }}
    loki_recommended_action_current: >-
      {{
        'Validate that expected log streams are reaching Loki through the intended forwarding path.'
        if (loki_stack_logging_present_current | bool)
        else (
          'Loki operator or chart context was detected, but no LokiStack custom resource configuration was found. Create and validate lokistacks.loki.grafana.com resources, then confirm the managed Loki workload footprint.'
          if (loki_context_present_current | bool)
          else 'If LokiStack-based centralized logging is intended, confirm the LokiStack custom resource configuration or managed Loki workload footprint.'
        )
      }}
    loki_findings_current: >-
      {{
        []
        if (loki_stack_logging_present_current | bool)
        else [
          {
            'capability': 'loki_stack_logging',
            'issue': 'prod-day2-loki-stack-logging-missing',
            'severity': loki_missing_severity_current,
            'source': 'LokiStack and Loki workload inventory',
            'detail': (
              'Loki operator or chart context was detected, but no LokiStack custom resource configuration was found and no Loki-managed workload footprint was detected'
              if (loki_context_present_current | bool)
              else 'no LokiStack custom resource configuration or Loki-managed workload footprint was detected'
            ),
            'recommended_action': loki_recommended_action_current,
            'docs': ((day2_loki_stack_logging_section_current.docs | default([])) | string)
          }
        ]
      }}
    loki_checks_current: >-
      {{
        [
          {
            'capability': 'Loki operator or chart context',
            'capability_key': 'loki_stack_logging',
            'detail': (
              'namespace_present=' ~ ((loki_namespace_present_current | bool) | string)
              ~ ' crd_present=' ~ ((loki_crd_present_current | bool) | string)
            ),
            'level': ((day2_loki_stack_logging_section_current.criticality | default('low')) | string),
            'scored': false,
            'source': 'LokiStack and Loki workload inventory',
            'status': ('OK' if (loki_context_present_current | bool) else ('WARN' if (day2_loki_stack_logging_section_current.required | default(false) | bool) else 'INFO'))
          },
          {
            'capability': 'LokiStack custom resource configuration',
            'capability_key': 'loki_stack_logging',
            'detail': 'lokistacks=' ~ ((lokistack_count_current | int) | string),
            'level': ((day2_loki_stack_logging_section_current.criticality | default('low')) | string),
            'scored': false,
            'source': 'LokiStack and Loki workload inventory',
            'status': ('OK' if (loki_configuration_present_current | bool) else loki_missing_check_status_current)
          },
          {
            'capability': 'Loki managed workload footprint',
            'capability_key': 'loki_stack_logging',
            'detail': 'workload_present=' ~ ((loki_workload_present_current | bool) | string),
            'level': ((day2_loki_stack_logging_section_current.criticality | default('low')) | string),
            'scored': false,
            'source': 'LokiStack and Loki workload inventory',
            'status': ('OK' if (loki_workload_present_current | bool) else loki_missing_check_status_current)
          }
        ]
      }}
    loki_section_override_current: >-
      {{
        (day2_loki_stack_logging_section_current | default({}))
        | combine(
            {
              'accounting_state': 'assessed',
              'check_count': (loki_checks_current | length),
              'finding_count': (0 if (loki_stack_logging_present_current | bool) else 1),
              'checks': loki_checks_current,
              'findings': loki_findings_current,
              'status': ('OK' if (loki_stack_logging_present_current | bool) else loki_missing_status_current),
              'top_detail': (
                loki_reason_summary_current
                if (loki_stack_logging_present_current | bool)
                else (
                  'Loki operator or chart context was detected, but no LokiStack custom resource configuration was found and no Loki-managed workload footprint was detected'
                  if (loki_context_present_current | bool)
                  else 'no LokiStack custom resource configuration or Loki-managed workload footprint was detected'
                )
              ),
              'recommended_action': loki_recommended_action_current
            },
            recursive=True
          )
      }}
  ansible.builtin.set_fact:
    capability_artifact_key: loki_stack_logging
    capability_artifact_section_override: "{{ loki_section_override_current }}"
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      accounting_state: assessed
      check_count: "{{ (loki_checks_current | length) | int }}"
      finding_count: "{{ (0 if (loki_stack_logging_present_current | bool) else 1) | int }}"
      status: "{{ 'OK' if (loki_stack_logging_present_current | bool) else loki_missing_status_current }}"
      status_summary: "{{ 'OK' if (loki_stack_logging_present_current | bool) else loki_missing_status_current }}"
      top_detail: "{{ loki_section_override_current.top_detail }}"
      reason_summary: "{{ loki_section_override_current.top_detail }}"
    capability_artifact_render_inputs:
      day2_loki_stack_logging_section: "{{ loki_section_override_current }}"
    capability_artifact_collection_inputs:
      lokistack_count: "{{ lokistack_count_current | int }}"
      loki_namespace_present: "{{ loki_namespace_present_current | bool }}"
      loki_crd_present: "{{ loki_crd_present_current | bool }}"
      loki_workload_present: "{{ loki_workload_present_current | bool }}"
