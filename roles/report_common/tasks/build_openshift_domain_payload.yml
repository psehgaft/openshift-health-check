- name: Resolve capability artifact backed Day 2 sections
  ansible.builtin.set_fact:
    capability_artifact_sections_by_key: >-
      {%- set resolved = {} -%}
      {%- for key, value in (openshift_capability_artifacts | default({})).items() -%}
      {%- set section = (value | default({})).get('section', {}) -%}
      {%- if (section | length) > 0 -%}
      {%- set _ = resolved.update({key: section}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ resolved }}

- name: Apply capability artifact sections to Day 2 capability list
  ansible.builtin.set_fact:
    day2_capability_sections_artifact_resolved: >-
      {%- set resolved = [] -%}
      {%- set artifact_sections = capability_artifact_sections_by_key | default({}) -%}
      {%- for section in (day2_capability_sections | default([])) -%}
      {%- set section_key = section.key | default('') -%}
      {%- if section_key and (artifact_sections.get(section_key, {}) | length) > 0 -%}
      {%- set _ = resolved.append(artifact_sections.get(section_key)) -%}
      {%- else -%}
      {%- set _ = resolved.append(section) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ resolved }}

