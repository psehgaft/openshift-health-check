  loop: "{{ (statefulsets | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    workload_name: "{{ item.metadata.name | default('') }}"
    containers: "{{ item.spec.template.spec.containers | default([]) }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    missing_liveness_containers: "{{ containers | rejectattr('livenessProbe', 'defined') | map(attribute='name') | list }}"
    missing_readiness_containers: "{{ containers | rejectattr('readinessProbe', 'defined') | map(attribute='name') | list }}"
    missing_startup_containers: "{{ containers | rejectattr('startupProbe', 'defined') | map(attribute='name') | list }}"
    probe_findings: >-
      {{
        ([] +
        ([{
          'kind': 'StatefulSet',
          'namespace': ns_name,
          'name': workload_name,
          'issue': 'missing-liveness-probe',
          'containers': missing_liveness_containers,
          'detail': missing_liveness_containers | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and missing_liveness_containers | length > 0 else []) +
        ([{
          'kind': 'StatefulSet',
          'namespace': ns_name,
          'name': workload_name,
          'issue': 'missing-readiness-probe',
          'containers': missing_readiness_containers,
          'detail': missing_readiness_containers | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and missing_readiness_containers | length > 0 else []) +
        ([{
          'kind': 'StatefulSet',
          'namespace': ns_name,
          'name': workload_name,
          'issue': 'missing-startup-probe',
          'containers': missing_startup_containers,
          'detail': missing_startup_containers | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and missing_startup_containers | length > 0 else []))
      }}
  changed_when: false

- name: Build daemonset probe coverage findings
  ansible.builtin.set_fact:
    workload_probe_findings: "{{ workload_probe_findings | default([]) + probe_findings }}"
  loop: "{{ (daemonsets | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    workload_name: "{{ item.metadata.name | default('') }}"
    containers: "{{ item.spec.template.spec.containers | default([]) }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    missing_liveness_containers: "{{ containers | rejectattr('livenessProbe', 'defined') | map(attribute='name') | list }}"
    missing_readiness_containers: "{{ containers | rejectattr('readinessProbe', 'defined') | map(attribute='name') | list }}"
    missing_startup_containers: "{{ containers | rejectattr('startupProbe', 'defined') | map(attribute='name') | list }}"
    probe_findings: >-
      {{
        ([] +
        ([{
          'kind': 'DaemonSet',
          'namespace': ns_name,
          'name': workload_name,
          'issue': 'missing-liveness-probe',
          'containers': missing_liveness_containers,
          'detail': missing_liveness_containers | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and missing_liveness_containers | length > 0 else []) +
        ([{
          'kind': 'DaemonSet',
          'namespace': ns_name,
          'name': workload_name,
          'issue': 'missing-readiness-probe',
          'containers': missing_readiness_containers,
          'detail': missing_readiness_containers | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and missing_readiness_containers | length > 0 else []) +
        ([{
          'kind': 'DaemonSet',
          'namespace': ns_name,
          'name': workload_name,
          'issue': 'missing-startup-probe',
          'containers': missing_startup_containers,
          'detail': missing_startup_containers | join(', ')
        }] if (is_user_namespace | bool) and containers | length > 0 and missing_startup_containers | length > 0 else []))
      }}
  changed_when: false

- name: Build route admission findings
  ansible.builtin.set_fact:
    service_names_by_namespace: "{{ service_names_by_namespace | default({}) | combine({ns_name: ((((service_names_by_namespace | default({}))[ns_name] | default([])) + [svc_name]) | unique)}, recursive=True) }}"
  loop: "{{ (services | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    svc_name: "{{ item.metadata.name | default('') }}"
  changed_when: false

- name: Build route issue findings
  ansible.builtin.set_fact:
    route_issues: "{{ route_issues | default([]) + route_issue_entry }}"
  loop: "{{ (routes | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    route_name: "{{ item.metadata.name | default('') }}"
    route_host: "{{ item.spec.host | default('') }}"
    admitted_status: "{{ ((item.status.ingress | default([]) | map(attribute='conditions') | list | flatten | selectattr('type', 'equalto', 'Admitted') | map(attribute='status') | first) | default('Unknown')) }}"
    target_kind: "{{ item.spec.to.kind | default('Service') }}"
    target_service_name: "{{ item.spec.to.name | default('') }}"
    missing_target_service: "{{ (target_kind == 'Service') and (target_service_name != '') and (target_service_name not in (((service_names_by_namespace | default({}))[ns_name] | default([])))) }}"
    route_issue_entry: >-
      {{
        ([] +
        ([{
          'kind': 'Route',
          'namespace': ns_name,
          'name': route_name,
          'host': route_host,
          'issue': 'route-not-admitted',
          'detail': 'admitted=' ~ admitted_status
        }] if admitted_status != 'True' else []) +
        ([{
          'kind': 'Route',
          'namespace': ns_name,
          'name': route_name,
          'host': route_host,
          'issue': 'route-missing-service',
          'detail': target_service_name
        }] if missing_target_service else []))
      }}
  changed_when: false

- name: Build ingress issue findings
  ansible.builtin.set_fact:
    ingress_issues: "{{ ingress_issues | default([]) + ingress_issue_entries }}"
  loop: "{{ (ingresses | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    ingress_name: "{{ item.metadata.name | default('') }}"
    ingress_class: "{{ item.spec.ingressClassName | default(item.metadata.annotations['kubernetes.io/ingress.class'] | default('')) }}"
    rule_hosts: "{{ item.spec.rules | default([]) | map(attribute='host') | select('defined') | reject('equalto', '') | list }}"
    path_backends: "{{ item.spec.rules | default([]) | map(attribute='http.paths') | select('defined') | list | flatten }}"
    rule_backend_services: "{{ path_backends | map(attribute='backend.service.name') | select('defined') | list }}"
    default_backend_service: "{{ item.spec.defaultBackend.service.name | default('') }}"
    backend_service_names: "{{ (rule_backend_services + ([default_backend_service] if default_backend_service != '' else [])) | unique }}"
    missing_backend_services: "{{ backend_service_names | difference(((service_names_by_namespace | default({}))[ns_name] | default([]))) }}"
    ingress_issue_entries: >-
      {{
        ([] +
        ([{
          'kind': 'Ingress',
          'namespace': ns_name,
          'name': ingress_name,
          'host': (rule_hosts | join(', ')),
          'issue': 'ingress-no-rules-or-default-backend',
          'detail': 'no rules and no default backend'
        }] if (rule_hosts | length == 0 and backend_service_names | length == 0) else []) +
        ([{
          'kind': 'Ingress',
          'namespace': ns_name,
          'name': ingress_name,
          'host': (rule_hosts | join(', ')),
          'issue': 'ingress-missing-service',
          'detail': missing_backend_services | join(', ')
        }] if missing_backend_services | length > 0 else []) +
        ([{
          'kind': 'Ingress',
          'namespace': ns_name,
          'name': ingress_name,
          'host': (rule_hosts | join(', ')),
          'issue': 'ingress-without-class',
          'detail': 'ingressClassName and ingress.class annotation are unset'
        }] if (warn_on_ingress_without_class | bool) and (rule_hosts | length > 0 or backend_service_names | length > 0) and ingress_class == '' else []))
      }}
  changed_when: false

- name: Build route host owner map
  ansible.builtin.set_fact:
    route_host_owners: "{{ route_host_owners | default({}) | combine({item.spec.host: ((route_host_owners[item.spec.host] | default([])) + [item.metadata.namespace ~ '/' ~ item.metadata.name]) | unique}, recursive=True) }}"
  loop: "{{ (routes | default({})).get('items', []) }}"
  when: (item.spec.host | default('')) != ''
  changed_when: false

- name: Build ingress host owner map
  ansible.builtin.set_fact:
    ingress_host_records: "{{ ingress_host_records | default([]) + host_records }}"
  loop: "{{ (ingresses | default({})).get('items', []) }}"
  vars:
    ingress_hosts: "{{ item.spec.rules | default([]) | map(attribute='host') | select('defined') | reject('equalto', '') | list }}"
    host_records: "{{ ingress_hosts | map('regex_replace', '^(.*)$', item.metadata.namespace ~ '/' ~ item.metadata.name ~ '|' ~ '\\1') | list }}"
  changed_when: false

- name: Normalize ingress host owner map
  ansible.builtin.set_fact:
    ingress_host_owners: "{{ ingress_host_owners | default({}) | combine({host_name: ((ingress_host_owners[host_name] | default([])) + [host_owner]) | unique}, recursive=True) }}"
  loop: "{{ ingress_host_records | default([]) }}"
  vars:
    host_name: "{{ (item.split('|', 1) | first) | default('') }}"
    host_owner: "{{ (item.split('|', 1) | last) | default('') }}"
  when: host_name != '' and host_owner != ''
  changed_when: false

- name: Build route host conflict findings
  ansible.builtin.set_fact:
    route_host_conflicts: "{{ route_host_conflicts | default([]) + [{'host': item.key, 'owners': item.value, 'issue': 'duplicate-route-host'}] }}"
  loop: "{{ route_host_owners | default({}) | dict2items }}"
  when: (item.value | default([]) | length) > 1
  changed_when: false

- name: Build ingress host conflict findings
  ansible.builtin.set_fact:
    ingress_host_conflicts: "{{ ingress_host_conflicts | default([]) + [{'host': item.key, 'owners': item.value, 'issue': 'duplicate-ingress-host'}] }}"
  loop: "{{ ingress_host_owners | default({}) | dict2items }}"
  when: (item.value | default([]) | length) > 1
  changed_when: false
