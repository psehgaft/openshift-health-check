---
- name: Build cluster profile
  vars:
    graph: "{{ analysis_graph | default({}) }}"
  ansible.builtin.set_fact:
    cluster_profile:
      infrastructure_name: "{{ graph.infrastructure.status.infrastructureName | default('unknown') }}"
      infrastructure_creation_timestamp: "{{ graph.infrastructure.metadata.creationTimestamp | default('') }}"
      platform: "{{ graph.infrastructure.status.platformStatus.type | default(graph.infrastructure.status.platform | default('unknown')) }}"
      control_plane_topology: "{{ graph.infrastructure.status.controlPlaneTopology | default('unknown') }}"
      infrastructure_topology: "{{ graph.infrastructure.status.infrastructureTopology | default('unknown') }}"
      api_url: "{{ graph.infrastructure.status.apiServerURL | default('unknown') }}"
      api_internal_url: "{{ graph.infrastructure.status.apiServerInternalURL | default('unknown') }}"
      base_domain: "{{ graph.dns_config.spec.baseDomain | default(graph.ingress_config.spec.domain | default('unknown')) }}"
      ingress_domain: "{{ graph.ingress_config.spec.domain | default('unknown') }}"
      network_type: "{{ graph.network_config.status.networkType | default('unknown') }}"
      service_networks: "{{ graph.network_config.spec.serviceNetwork | default([]) }}"
      cluster_networks: "{{ graph.network_config.spec.clusterNetwork | default([]) }}"
      machine_networks: []
      machine_networks_source: not-exposed-via-cluster-api
      identity_provider_count: "{{ graph.oauth_config.spec.identityProviders | default([]) | length }}"
      identity_provider_names: "{{ graph.oauth_config.spec.identityProviders | default([]) | map(attribute='name') | list }}"
      platform_category: unknown
      public_cloud: false
      service_model: unknown
      service_model_source: not-derived
      service_model_confidence: low
      service_variant: unknown
      install_model: unknown
      install_model_source: not-derived
      install_model_confidence: low
      control_plane_model: unknown
      control_plane_model_source: not-derived
      control_plane_model_confidence: low
      machine_api_worker_pool_count: 0
      machine_api_managed_worker_pools: false
      cluster_classification_label: openshift
      cluster_classification_source: default-openshift-fallback
      cluster_classification_confidence: low
      deployment_type: openshift
      deployment_type_source: default-openshift-fallback
      deployment_type_confidence: low
      is_sno: false
      is_hosted_control_plane: false
      control_plane_node_count: 0
      worker_node_count: 0
      infra_node_count: 0

- name: Build authentication findings
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json

    data = json.loads(r'''{{ {
      "oauth_config": analysis_graph.oauth_config | default({}),
      "secrets": (analysis_graph.secrets | default({})).get('items', [])
    } | to_json }}''')

    idps = (((data.get("oauth_config") or {}).get("spec") or {}).get("identityProviders") or [])
    secrets = data.get("secrets") or []

    local_types = {"htpasswd", "basicAuth"}
    generic_keys = {"name", "mappingMethod", "type", "challenge", "login"}
    provider_types = []
    provider_names = []
    external_provider_count = 0
    local_provider_count = 0

    for item in idps:
        if not isinstance(item, dict):
            continue
        provider_names.append(str(item.get("name") or "unnamed"))
        typed_keys = [key for key in item.keys() if key not in generic_keys and item.get(key) is not None]
        provider_type = typed_keys[0] if typed_keys else str(item.get("type") or "unknown")
        provider_types.append(provider_type)
        if provider_type in local_types:
            local_provider_count += 1
        else:
            external_provider_count += 1

    kubeadmin_secret_present = any(
        ((item.get("metadata") or {}).get("name") == "kubeadmin")
        and ((item.get("metadata") or {}).get("namespace") == "kube-system")
        for item in secrets
        if isinstance(item, dict)
    )

    findings = []
    if len(idps) == 0:
        detail = "oauth/cluster has no configured identityProviders"
        if kubeadmin_secret_present:
            detail += "; kubeadmin secret is still present"
        findings.append({"issue": "missing-identity-provider", "detail": detail})
        status = "warning"
        reason_summary = "no configured identity providers"
    elif external_provider_count == 0 and local_provider_count > 0:
        detail = "only local identity providers are configured: " + ", ".join(sorted(set(provider_types)))
        if kubeadmin_secret_present:
            detail += "; kubeadmin secret is still present"
        findings.append({"issue": "local-only-identity-provider", "detail": detail})
        status = "warning"
        reason_summary = "only local identity providers are configured"
    elif kubeadmin_secret_present:
        findings.append({
            "issue": "kubeadmin-secret-still-present",
            "detail": "kubeadmin secret is still present while identity providers are configured",
        })
        status = "review"
        reason_summary = "external identity providers are configured, but kubeadmin fallback is still present"
    elif external_provider_count == 1 and len(idps) == 1:
        status = "healthy"
        reason_summary = "single external identity provider configured"
    else:
        status = "healthy"
        reason_summary = "external identity providers are configured"

    print(json.dumps({
        "auth_findings": findings,
        "auth_posture_summary": {
            "status": status,
            "identity_provider_count": len(idps),
            "provider_names": provider_names,
            "provider_types": provider_types,
            "external_identity_provider_count": external_provider_count,
            "local_identity_provider_count": local_provider_count,
            "kubeadmin_secret_present": kubeadmin_secret_present,
            "reason_summary": reason_summary,
        },
    }))
    PY
  register: auth_posture_cmd
  changed_when: false
  failed_when: false

- name: Normalize authentication findings
  vars:
    auth_fallback_idps: "{{ analysis_graph.oauth_config.spec.identityProviders | default([]) }}"
    auth_fallback_identity_provider_count: "{{ auth_fallback_idps | length }}"
    auth_fallback_provider_names: "{{ auth_fallback_idps | map(attribute='name') | list }}"
    auth_fallback_local_identity_provider_count: >-
      {{
        (auth_fallback_idps | selectattr('htpasswd', 'defined') | list | length)
        + (auth_fallback_idps | selectattr('basicAuth', 'defined') | list | length)
      }}
    auth_fallback_external_identity_provider_count: >-
      {{
        (auth_fallback_identity_provider_count | int)
        - (auth_fallback_local_identity_provider_count | int)
      }}
    auth_fallback_provider_types: >-
      {%- set provider_types = [] -%}
      {%- for item in auth_fallback_idps -%}
      {%- if item.htpasswd is defined -%}
      {%- set _ = provider_types.append('htpasswd') -%}
      {%- elif item.basicAuth is defined -%}
      {%- set _ = provider_types.append('basicAuth') -%}
      {%- elif item.github is defined -%}
      {%- set _ = provider_types.append('github') -%}
      {%- elif item.gitlab is defined -%}
      {%- set _ = provider_types.append('gitlab') -%}
      {%- elif item.google is defined -%}
      {%- set _ = provider_types.append('google') -%}
      {%- elif item.ldap is defined -%}
      {%- set _ = provider_types.append('ldap') -%}
      {%- elif item.keystone is defined -%}
      {%- set _ = provider_types.append('keystone') -%}
      {%- elif item.openID is defined -%}
      {%- set _ = provider_types.append('openID') -%}
      {%- elif item.requestHeader is defined -%}
      {%- set _ = provider_types.append('requestHeader') -%}
      {%- else -%}
      {%- set _ = provider_types.append(item.type | default('unknown')) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ provider_types }}
    auth_fallback_kubeadmin_secret_present: >-
      {{
        (
          (analysis_graph.secrets | default({'items': []})).get('items', [])
          | selectattr('metadata.namespace', 'equalto', 'kube-system')
          | selectattr('metadata.name', 'equalto', 'kubeadmin')
          | list
          | length
        ) > 0
      }}
    auth_fallback_status: >-
      {{
        'warning'
        if (auth_fallback_identity_provider_count | int) == 0 or (auth_fallback_external_identity_provider_count | int) == 0
        else (
          'review'
          if auth_fallback_kubeadmin_secret_present
          else 'healthy'
        )
      }}
    auth_fallback_reason_summary: >-
      {{
        'no configured identity providers'
        if (auth_fallback_identity_provider_count | int) == 0
        else (
          'only local identity providers are configured'
          if (auth_fallback_external_identity_provider_count | int) == 0
          else (
            'external identity providers are configured, but kubeadmin fallback is still present'
            if auth_fallback_kubeadmin_secret_present
            else (
              'single external identity provider configured'
              if (auth_fallback_external_identity_provider_count | int) == 1 and (auth_fallback_identity_provider_count | int) == 1
              else 'external identity providers are configured'
            )
          )
        )
      }}
    auth_fallback_findings: >-
      {{
        [{'issue': 'missing-identity-provider', 'detail': 'oauth/cluster has no configured identityProviders' ~ ('; kubeadmin secret is still present' if auth_fallback_kubeadmin_secret_present else '')}]
        if (auth_fallback_identity_provider_count | int) == 0
        else (
          [{'issue': 'local-only-identity-provider', 'detail': 'only local identity providers are configured: ' ~ ((auth_fallback_provider_types | unique | list | join(', ')) or 'unknown') ~ ('; kubeadmin secret is still present' if auth_fallback_kubeadmin_secret_present else '')}]
          if (auth_fallback_external_identity_provider_count | int) == 0
          else (
            [{'issue': 'kubeadmin-secret-still-present', 'detail': 'kubeadmin secret is still present while identity providers are configured'}]
            if auth_fallback_kubeadmin_secret_present
            else []
          )
        )
      }}
  ansible.builtin.set_fact:
    auth_findings: "{{ ((auth_posture_cmd.stdout | from_json).auth_findings) if (auth_posture_cmd.rc == 0 and (auth_posture_cmd.stdout | default('') | length > 0)) else auth_fallback_findings }}"
    auth_posture_summary: "{{ ((auth_posture_cmd.stdout | from_json).auth_posture_summary) if (auth_posture_cmd.rc == 0 and (auth_posture_cmd.stdout | default('') | length > 0)) else {'status': auth_fallback_status, 'identity_provider_count': (auth_fallback_identity_provider_count | int), 'provider_names': auth_fallback_provider_names, 'provider_types': auth_fallback_provider_types, 'external_identity_provider_count': (auth_fallback_external_identity_provider_count | int), 'local_identity_provider_count': (auth_fallback_local_identity_provider_count | int), 'kubeadmin_secret_present': auth_fallback_kubeadmin_secret_present, 'reason_summary': auth_fallback_reason_summary} }}"

- name: Capture cluster version history and updates
  ansible.builtin.set_fact:
    cluster_update_history: "{{ analysis_graph.clusterversion.status.history | default([]) }}"
    available_updates: "{{ analysis_graph.clusterversion.status.availableUpdates | default([]) }}"
    conditional_updates: "{{ analysis_graph.clusterversion.status.conditionalUpdates | default([]) }}"

- name: Extract cluster version conditions
  ansible.builtin.set_fact:
    cv_available: "{{ ((analysis_graph.clusterversion.status.conditions | default([]) | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first) | default('Unknown')) }}"
    cv_progressing: "{{ ((analysis_graph.clusterversion.status.conditions | default([]) | selectattr('type', 'equalto', 'Progressing') | map(attribute='status') | first) | default('Unknown')) }}"
    cv_failing: "{{ ((analysis_graph.clusterversion.status.conditions | default([]) | selectattr('type', 'equalto', 'Failing') | map(attribute='status') | first) | default('Unknown')) }}"

- name: Initialize operator facts
  ansible.builtin.set_fact:
    degraded_operators: []
    unavailable_operators: []
    progressing_operators: []
    clusteroperator_status_map: {}

- name: Build operator facts
  ansible.builtin.set_fact:
    degraded_operators: "{{ degraded_operators + ([item.metadata.name] if degraded_status == 'True' else []) }}"
    unavailable_operators: "{{ unavailable_operators + ([item.metadata.name] if available_status == 'False' else []) }}"
    progressing_operators: "{{ progressing_operators + ([item.metadata.name] if progressing_status == 'True' else []) }}"
    clusteroperator_status_map: "{{ clusteroperator_status_map | combine({item.metadata.name: {'available': available_status, 'degraded': degraded_status, 'progressing': progressing_status, 'version': operator_version}}, recursive=True) }}"
  loop: "{{ (analysis_graph.clusteroperators | default({'items': []})).get('items', []) }}"
  vars:
    available_status: "{{ ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first) | default('Unknown')) }}"
    degraded_status: "{{ ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Degraded') | map(attribute='status') | first) | default('Unknown')) }}"
    progressing_status: "{{ ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Progressing') | map(attribute='status') | first) | default('Unknown')) }}"
    operator_version: "{{ item.status.versions[0].version | default('unknown') if (item.status.versions | default([]) | length > 0) else 'unknown' }}"
  changed_when: false

- name: Build ingress controller summary
  ansible.builtin.set_fact:
    ingresscontroller_summary: "{{ ingresscontroller_summary | default([]) + [summary_entry] }}"
    ingresscontroller_issues: "{{ ingresscontroller_issues | default([]) + issue_entries }}"
  loop: "{{ (analysis_graph.ingresscontrollers | default({'items': []})).get('items', []) }}"
  vars:
    desired_replicas: "{{ item.spec.replicas | default((1 if (cluster_profile.control_plane_topology | default('unknown')) == 'SingleReplica' else 2)) | int }}"
    available_replicas: "{{ item.status.availableReplicas | default(0) | int }}"
    unavailable_replicas: "{{ item.status.unavailableReplicas | default(0) | int }}"
    ic_available_status: "{{ ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first) | default('Unknown')) }}"
    ic_progressing_status: "{{ ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Progressing') | map(attribute='status') | first) | default('Unknown')) }}"
    ic_degraded_status: "{{ ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Degraded') | map(attribute='status') | first) | default('Unknown')) }}"
    summary_entry:
      name: "{{ item.metadata.name | default('unknown') }}"
      domain: "{{ item.status.domain | default(item.spec.domain | default('unknown')) }}"
      available: "{{ ic_available_status }}"
      progressing: "{{ ic_progressing_status }}"
      degraded: "{{ ic_degraded_status }}"
      desired_replicas: "{{ desired_replicas }}"
      available_replicas: "{{ available_replicas }}"
      unavailable_replicas: "{{ unavailable_replicas }}"
    issue_entries: >-
      {{
        ([] +
        ([{
          'component': 'ingresscontroller/' ~ (item.metadata.name | default('unknown')),
          'issue': 'ingresscontroller-unavailable',
          'detail': 'available=' ~ ic_available_status ~ ' availableReplicas=' ~ (available_replicas | string) ~ '/' ~ (desired_replicas | string)
        }] if ic_available_status == 'False' or available_replicas < desired_replicas else []) +
        ([{
          'component': 'ingresscontroller/' ~ (item.metadata.name | default('unknown')),
          'issue': 'ingresscontroller-degraded',
          'detail': 'degraded=' ~ ic_degraded_status
        }] if ic_degraded_status == 'True' else []))
      }}
  changed_when: false

- name: Build infrastructure component summary
  ansible.builtin.set_fact:
    infrastructure_component_summary:
      - component: authentication
        available: "{{ clusteroperator_status_map.authentication.available | default('Unknown') }}"
        progressing: "{{ clusteroperator_status_map.authentication.progressing | default('Unknown') }}"
        degraded: "{{ clusteroperator_status_map.authentication.degraded | default('Unknown') }}"
        version: "{{ clusteroperator_status_map.authentication.version | default('unknown') }}"
        detail: "identityProviders={{ analysis_graph.oauth_config.spec.identityProviders | default([]) | length }}"
      - component: console
        available: "{{ clusteroperator_status_map.console.available | default('Unknown') }}"
        progressing: "{{ clusteroperator_status_map.console.progressing | default('Unknown') }}"
        degraded: "{{ clusteroperator_status_map.console.degraded | default('Unknown') }}"
        version: "{{ clusteroperator_status_map.console.version | default('unknown') }}"
        detail: "console operator health"
      - component: dns
        available: "{{ clusteroperator_status_map.dns.available | default('Unknown') }}"
        progressing: "{{ clusteroperator_status_map.dns.progressing | default('Unknown') }}"
        degraded: "{{ clusteroperator_status_map.dns.degraded | default('Unknown') }}"
        version: "{{ clusteroperator_status_map.dns.version | default('unknown') }}"
        detail: "baseDomain={{ analysis_graph.dns_config.spec.baseDomain | default('unknown') }}"
      - component: etcd
        available: "{{ clusteroperator_status_map.etcd.available | default('Unknown') }}"
        progressing: "{{ clusteroperator_status_map.etcd.progressing | default('Unknown') }}"
        degraded: "{{ clusteroperator_status_map.etcd.degraded | default('Unknown') }}"
        version: "{{ clusteroperator_status_map.etcd.version | default('unknown') }}"
        detail: "etcd operator health"
      - component: image-registry
        available: "{{ clusteroperator_status_map['image-registry'].available | default('Unknown') }}"
        progressing: "{{ clusteroperator_status_map['image-registry'].progressing | default('Unknown') }}"
        degraded: "{{ clusteroperator_status_map['image-registry'].degraded | default('Unknown') }}"
        version: "{{ clusteroperator_status_map['image-registry'].version | default('unknown') }}"
        detail: "managementState={{ analysis_graph.image_registry_config.spec.managementState | default('unknown') }} defaultRoute={{ analysis_graph.image_registry_config.spec.defaultRoute | default(false) }}"
      - component: ingress
        available: "{{ clusteroperator_status_map.ingress.available | default('Unknown') }}"
        progressing: "{{ clusteroperator_status_map.ingress.progressing | default('Unknown') }}"
        degraded: "{{ clusteroperator_status_map.ingress.degraded | default('Unknown') }}"
        version: "{{ clusteroperator_status_map.ingress.version | default('unknown') }}"
        detail: "ingressControllers={{ (analysis_graph.ingresscontrollers | default({})).get('items', []) | length }}"
      - component: insights
        available: "{{ clusteroperator_status_map.insights.available | default('Unknown') }}"
        progressing: "{{ clusteroperator_status_map.insights.progressing | default('Unknown') }}"
        degraded: "{{ clusteroperator_status_map.insights.degraded | default('Unknown') }}"
        version: "{{ clusteroperator_status_map.insights.version | default('unknown') }}"
        detail: "insights operator health"
      - component: kube-apiserver
        available: "{{ clusteroperator_status_map['kube-apiserver'].available | default('Unknown') }}"
        progressing: "{{ clusteroperator_status_map['kube-apiserver'].progressing | default('Unknown') }}"
        degraded: "{{ clusteroperator_status_map['kube-apiserver'].degraded | default('Unknown') }}"
        version: "{{ clusteroperator_status_map['kube-apiserver'].version | default('unknown') }}"
        detail: "API server operator health"
      - component: monitoring
        available: "{{ clusteroperator_status_map.monitoring.available | default('Unknown') }}"
        progressing: "{{ clusteroperator_status_map.monitoring.progressing | default('Unknown') }}"
        degraded: "{{ clusteroperator_status_map.monitoring.degraded | default('Unknown') }}"
        version: "{{ clusteroperator_status_map.monitoring.version | default('unknown') }}"
        detail: "monitoring operator health"
      - component: network
        available: "{{ clusteroperator_status_map.network.available | default('Unknown') }}"
        progressing: "{{ clusteroperator_status_map.network.progressing | default('Unknown') }}"
        degraded: "{{ clusteroperator_status_map.network.degraded | default('Unknown') }}"
        version: "{{ clusteroperator_status_map.network.version | default('unknown') }}"
        detail: "networkType={{ analysis_graph.network_config.status.networkType | default('unknown') }}"

- name: Build infrastructure component issues
  ansible.builtin.set_fact:
    infrastructure_component_issues: "{{ infrastructure_component_issues | default([]) + issue_entries }}"
  loop: "{{ infrastructure_component_summary | default([]) }}"
  vars:
    issue_entries: >-
      {{
        ([] +
        ([{
          'component': item.component,
          'issue': 'component-unavailable',
          'detail': 'available=' ~ (item.available | string)
        }] if item.available == 'False' else []) +
        ([{
          'component': item.component,
          'issue': 'component-degraded',
          'detail': 'degraded=' ~ (item.degraded | string)
        }] if item.degraded == 'True' else []))
      }}
  changed_when: false

- name: Initialize node facts
  ansible.builtin.set_fact:
    not_ready_nodes: []
    pressure_nodes: []
    primary_node_role_counts: {}
    kubelet_version_counts: {}
    node_pod_counts: {}
    namespace_pod_counts: {}
    pod_object_counts:
      total: 0
      running: 0
      user_total: 0
      user_running: 0
    node_cpu_request_millicores: "{{ node_cpu_request_millicores | default({}) }}"
    openshift_control_plane_node_count: 0
    openshift_worker_node_count: 0
    openshift_infra_node_count: 0

- name: Build pod count and restart hotspots
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import re

    data = json.loads(r'''{{ {
      "pods": (analysis_graph.pods | default({})).get('items', []),
      "exclude_regex": user_namespaces_exclude_regex
    } | to_json }}''')

    exclude_re = re.compile(data.get("exclude_regex") or r"^$")
    pod_restart_hotspots = []
    pod_phase_counts = {}
    node_pod_counts = {}
    namespace_pod_counts = {}
    pod_object_counts = {
        "total": 0,
        "running": 0,
        "user_total": 0,
        "user_running": 0,
    }

    for item in data.get("pods") or []:
        status = item.get("status") or {}
        spec = item.get("spec") or {}
        metadata = item.get("metadata") or {}
        phase = str(status.get("phase") or "Unknown")
        node_name = str(spec.get("nodeName") or "unscheduled")
        namespace_name = str(metadata.get("namespace") or "")
        pod_name = str(metadata.get("name") or "unknown")
        is_user_namespace = not exclude_re.search(namespace_name or "")

        pod_phase_counts[phase] = pod_phase_counts.get(phase, 0) + 1
        node_pod_counts[node_name] = node_pod_counts.get(node_name, 0) + 1
        namespace_pod_counts[namespace_name] = namespace_pod_counts.get(namespace_name, 0) + 1

        pod_object_counts["total"] += 1
        if phase == "Running":
            pod_object_counts["running"] += 1
        if is_user_namespace:
            pod_object_counts["user_total"] += 1
            if phase == "Running":
                pod_object_counts["user_running"] += 1

        restart_count = sum(
            int(container.get("restartCount") or 0)
            for container in (status.get("containerStatuses") or [])
        )
        if is_user_namespace and restart_count > 0:
            pod_restart_hotspots.append({
                "namespace": namespace_name,
                "name": pod_name,
                "phase": phase,
                "restarts": restart_count,
                "node": node_name,
            })

    print(json.dumps({
        "pod_restart_hotspots": pod_restart_hotspots,
        "pod_phase_counts": pod_phase_counts,
        "node_pod_counts": node_pod_counts,
        "namespace_pod_counts": namespace_pod_counts,
        "pod_object_counts": pod_object_counts,
    }))
    PY
  register: pod_restart_hotspots_cmd
  changed_when: false

- name: Normalize pod count and restart hotspots
  ansible.builtin.set_fact:
    pod_restart_hotspots: "{{ (pod_restart_hotspots_cmd.stdout | from_json).pod_restart_hotspots | default([]) }}"
    pod_phase_counts: "{{ (pod_restart_hotspots_cmd.stdout | from_json).pod_phase_counts | default({}) }}"
    node_pod_counts: "{{ (pod_restart_hotspots_cmd.stdout | from_json).node_pod_counts | default({}) }}"
    namespace_pod_counts: "{{ (pod_restart_hotspots_cmd.stdout | from_json).namespace_pod_counts | default({}) }}"
    pod_object_counts: "{{ (pod_restart_hotspots_cmd.stdout | from_json).pod_object_counts | default({'total': 0, 'running': 0, 'user_total': 0, 'user_running': 0}) }}"
  changed_when: false

- name: Build node health facts
  ansible.builtin.set_fact:
    not_ready_nodes: "{{ not_ready_nodes + ([item.metadata.name] if not node_is_ready else []) }}"
    pressure_nodes: "{{ pressure_nodes + ([{'name': item.metadata.name, 'pressures': pressure_types}] if pressure_types | length > 0 else []) }}"
    primary_node_role_counts: "{{ primary_node_role_counts | combine({primary_node_role: ((primary_node_role_counts[primary_node_role] | default(0)) + 1)}, recursive=True) }}"
    kubelet_version_counts: "{{ kubelet_version_counts | combine({kubelet_version: ((kubelet_version_counts[kubelet_version] | default(0)) + 1)}, recursive=True) }}"
    openshift_control_plane_node_count: "{{ (openshift_control_plane_node_count | int) + (1 if primary_node_role in ['master', 'control-plane'] else 0) }}"
    openshift_worker_node_count: "{{ (openshift_worker_node_count | int) + (1 if primary_node_role == 'worker' else 0) }}"
    openshift_infra_node_count: "{{ (openshift_infra_node_count | int) + (1 if primary_node_role == 'infra' else 0) }}"
  loop: "{{ (analysis_graph.nodes | default({'items': []})).get('items', []) }}"
  vars:
    ready_status: "{{ ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | first) | default('Unknown')) }}"
    node_is_ready: "{{ (ready_status | string | lower) in ['true', 'ready'] }}"
    pressure_types: "{{ item.status.conditions | default([]) | selectattr('status', 'equalto', 'True') | map(attribute='type') | select('in', ['MemoryPressure', 'DiskPressure', 'PIDPressure', 'OutOfDisk', 'NetworkUnavailable']) | list }}"
    node_roles: "{{ item.metadata.labels | default({}) | dict2items | map(attribute='key') | select('match', '^node-role.kubernetes.io/') | map('regex_replace', '^node-role.kubernetes.io/', '') | list }}"
    primary_node_role: >-
      {{
