# TC 17: Check Cluster logs via API
- name: "TC-17: Check Cluster logs via API"
  when: run_tc17_check_cluster_logs_api | default(true) | bool
  block:
    - name: "TC-17: Fetch API server and control-plane logs through the API"
      ansible.builtin.shell: |
        set -euo pipefail
        for component in \
          "openshift-kube-apiserver kube-apiserver" \
          "openshift-kube-controller-manager kube-controller-manager" \
          "openshift-kube-scheduler openshift-kube-scheduler"; do
          read -r namespace pod_prefix <<< "$component"
          pod="$(oc get pods -n "$namespace" --field-selector=status.phase=Running \
            -o custom-columns=NAME:.metadata.name --no-headers \
            | awk -v prefix="$pod_prefix" 'index($1, prefix) == 1 { print $1; exit }')"
          if [[ -z "$pod" ]]; then
            echo "No running $pod_prefix control-plane pod found in $namespace" >&2
            exit 1
          fi
          echo "===== $namespace/$pod ====="
          oc logs -n "$namespace" "$pod" --all-containers=true --since=1h --tail=20
        done
      args:
        executable: /bin/bash
      register: tc17_cmd
      changed_when: false
      failed_when: false

    - name: "TC-17: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-17',
          'name': 'Check Cluster logs via API',
          'category': 'Services Check',
          'expected': 'Logs from the last hour are retrievable through the Kubernetes API for the API server, controller manager, and scheduler',
          'status': ('Pass' if tc17_cmd.rc == 0 else 'Fail'),
          'procedure': (tc17_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc17_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc17_cmd.stderr | default(''))) if (tc17_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc17_cmd.rc | string) if tc17_cmd.rc is defined else '')),
          'details': tc17_cmd.stdout | default(tc17_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc17', 'logs_api']

# TC 18: Check Configured Registry API
- name: "TC-18: Check Configured Registry API"
  when: run_tc18_check_internal_registry_api | default(true) | bool
  block:
    - name: "TC-18: Discover configured external registry"
      ansible.builtin.include_tasks: registry_discovery.yml

    - name: "TC-18: Inspect internal registry operator, managementState, and service"
      ansible.builtin.include_tasks: registry_control_state.yml

    - name: "TC-18: Reset external probe result for this case"
      ansible.builtin.set_fact:
        atp_external_registry_probe_ok: false
        atp_external_registry_probe_summary: "Not run"

    - name: "TC-18: Probe configured external registry only when internal is unavailable"
      ansible.builtin.include_tasks: external_registry_probe.yml
      when: not (atp_registry_internal_available | bool)

    - name: "TC-18: Decide whether pull-secret authentication fallback is required"
      ansible.builtin.set_fact:
        atp_registry_probe_pull_secret: "{{ not (atp_registry_internal_available | bool or atp_external_registry_probe_ok | default(false) | bool) }}"

    - name: "TC-18: Discover and authenticate registries from the cluster pull-secret"
      ansible.builtin.include_tasks: registry_pull_secret_probe.yml

    - name: "TC-18: Classify available registry endpoints"
      ansible.builtin.set_fact:
        tc18_internal_available: "{{ atp_registry_internal_available | bool }}"
        tc18_pullsecret_external_available: "{{ atp_pullsecret_login_ok | default(false) | bool }}"
        tc18_external_available: "{{ atp_external_registry_probe_ok | default(false) | bool or atp_pullsecret_login_ok | default(false) | bool }}"
        tc18_external_configured: "{{ atp_external_registry_effective_url | default('') | length > 0 or atp_pullsecret_registry_hosts | default([]) | length > 0 }}"
        tc18_status: "{{ 'Pass' if (atp_registry_internal_available | bool or atp_external_registry_probe_ok | default(false) | bool or atp_pullsecret_login_ok | default(false) | bool) else 'Fail' }}"
        tc18_registry_mode: >-
          {% if atp_registry_internal_available | bool and (atp_external_registry_effective_url | default('') | length > 0 or atp_pullsecret_registry_hosts | default([]) | length > 0) %}
          Internal registry passed; external registry references were also discovered
          {% elif atp_registry_internal_available | bool %}
          Internal registry only is available and passed
          {% elif atp_external_registry_probe_ok | default(false) | bool %}
          External registry passed the configured OCI API probe
          {% elif atp_pullsecret_login_ok | default(false) | bool %}
          External registry passed Podman login using pull-secret credentials
          {% else %}
          No usable registry API was validated
          {% endif %}
        tc18_registry_notes: >-
          {% if atp_registry_internal_available | bool and (atp_external_registry_effective_url | default('') | length > 0 or atp_pullsecret_registry_hosts | default([]) | length > 0) %}
          The internal registry is available: managementState={{ atp_registry_management_state }}, ClusterOperator Available={{ atp_registry_operator_available }}, and the image-registry service exists. External registry references were also discovered (configured endpoint: {{ atp_external_registry_effective_url | regex_replace('^https?://', '') if atp_external_registry_effective_url | default('') | length > 0 else 'none' }}; pull-secret entries: {{ atp_pullsecret_registry_hosts | default([]) | join(', ') if atp_pullsecret_registry_hosts | default([]) | length > 0 else 'none' }}). External credentials were not tested because the internal registry passed.
          {% elif atp_registry_internal_available | bool %}
          The internal registry passed: managementState={{ atp_registry_management_state }}, ClusterOperator Available={{ atp_registry_operator_available }}, and the image-registry service exists. No external registry reference was discovered.
          {% elif atp_pullsecret_login_ok | default(false) | bool %}
          The internal registry is unavailable (managementState={{ atp_registry_management_state }}; service present={{ atp_registry_service_present }}). Podman authenticated successfully to pull-secret registry host(s): {{ atp_pullsecret_login_success_hosts | default([]) | join(', ') }}. This external registry satisfies TC-18.
          {% elif atp_external_registry_probe_ok | default(false) | bool %}
          The internal registry is unavailable (managementState={{ atp_registry_management_state }}; service present={{ atp_registry_service_present }}). The configured external registry passed its OCI API probe: {{ atp_external_registry_effective_url | regex_replace('^https?://', '') }}.
          {% else %}
          No usable registry API was validated. Internal registry state: managementState={{ atp_registry_management_state }}, ClusterOperator Available={{ atp_registry_operator_available }}, service present={{ atp_registry_service_present }}. Configured external probe: {{ atp_external_registry_probe_summary | default('not successful') }}. Pull-secret fallback: {{ atp_pullsecret_login_summary | default('not successful') | trim }}.
          {% endif %}
        tc18_remediation: >-
          {% if not (atp_registry_internal_available | bool or atp_external_registry_probe_ok | default(false) | bool or atp_pullsecret_login_ok | default(false) | bool) %}
          Configure at least one usable registry. If managementState is Removed, ensure the OpenShift pull-secret contains credentials for a reachable external registry and install Podman on the Ansible execution host. For private registry TLS, set atp_external_registry_ca_path to the issuing PEM CA file and keep verification enabled. Never print or commit the pull-secret credentials.
          {% else %}
          No remediation is required for the TC-18 pass condition. The report notes whether an external endpoint was discovered but not probed because the internal registry passed.
          {% endif %}

    - name: "TC-18: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-18',
          'name': 'Check Configured Registry API',
          'category': 'Services Check',
          'expected': 'Pass when the internal registry is healthy or an external registry authenticates successfully. If the internal registry is Removed/unavailable, discover registry hosts from openshift-config/pull-secret and verify credentials with Podman login.',
          'status': tc18_status | trim,
          'procedure': 'Inspect clusteroperator image-registry, Image Registry Operator managementState, and the internal service. When internal is unavailable, probe the configured OCI endpoint and iterate pull-secret auth hosts with podman login.',
          'evidence': ((atp_registry_control_state_cmd.stdout | default('')) ~ ('\nExternal endpoint: ' ~ (atp_external_registry_effective_url | regex_replace('^https?://', '') if atp_external_registry_effective_url | default('') | length > 0 else 'not configured/discovered')) ~ ('\nExternal OCI probe: ' ~ (atp_external_registry_probe_summary | default('not run'))) ~ ('\nPull-secret registry hosts: ' ~ (atp_pullsecret_registry_hosts | default([]) | join(', ') if atp_pullsecret_registry_hosts | default([]) | length > 0 else 'none')) ~ ('\nPull-secret authentication: ' ~ (atp_pullsecret_login_summary | default('not run') | trim)) ~ ('\nRegistry evaluation: ' ~ (tc18_registry_mode | trim)),
          'details': tc18_registry_notes | trim,
          'additional_comments': tc18_registry_notes | trim,
          'remediation': tc18_remediation | trim
        }] }}"
  tags: ['general', 'telco', 'tc18', 'registry']

# TC 19: Check Internal and External Registry Status
- name: "TC-19: Check Internal and External Registry Status"
  when: run_tc19_check_internal_registry_status | default(true) | bool
  block:
    - name: "TC-19: Discover configured external registry"
      ansible.builtin.include_tasks: registry_discovery.yml

    - name: "TC-19: Inspect internal registry operator, managementState, and service"
      ansible.builtin.include_tasks: registry_control_state.yml

    - name: "TC-19: Query internal registry pods when the internal registry is available"
      ansible.builtin.command: oc get pods -n openshift-image-registry -o json
      register: tc19_cmd
      changed_when: false
      failed_when: false
      when: atp_registry_internal_available | bool

    - name: "TC-19: Verify internal registry pods are Running and ready"
      ansible.builtin.shell: |
        set -o pipefail
        oc get pods -n openshift-image-registry -o json | jq -e '.items | length > 0 and all(.[]; .status.phase == "Running" and (.status.containerStatuses | length > 0) and (.status.containerStatuses | all(.[]; .ready == true)))'
      args:
        executable: /bin/bash
      register: tc19_pods_ready_cmd
      changed_when: false
      failed_when: false
      when: atp_registry_internal_available | bool

    - name: "TC-19: Capture internal registry placement and logs"
      ansible.builtin.shell: |
        set -euo pipefail
        echo "== Registry pod placement =="
        oc get pods -n openshift-image-registry -o wide
        echo "== Infra nodes =="
        oc get nodes -l node-role.kubernetes.io/infra -o wide
        echo "== Registry logs (last hour) =="
        logs="$(oc logs deployments/image-registry -n openshift-image-registry --since=1h --tail=20)"
        echo "$logs"
        if ! grep -q 'level=info' <<< "$logs"; then
          echo "No level=info registry activity was found in the last hour." >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      register: tc19_details_cmd
      changed_when: false
      failed_when: false
      when: atp_registry_internal_available | bool

    - name: "TC-19: Parse internal registry pod inventory"
      ansible.builtin.set_fact:
        tc19_reg_pods: "{{ ((tc19_cmd.stdout | from_json)['items']) if (tc19_cmd.rc | default(1) | int) == 0 else [] }}"
        tc19_running_pods: "{{ ((tc19_cmd.stdout | from_json)['items'] | selectattr('status.phase', 'equalto', 'Running') | map(attribute='metadata.name') | list) if (tc19_cmd.rc | default(1) | int) == 0 else [] }}"

    - name: "TC-19: Classify internal registry test outcome"
      ansible.builtin.set_fact:
        tc19_internal_test_ok: "{{ atp_registry_internal_available | bool and (tc19_cmd.rc | default(1) | int) == 0 and (tc19_pods_ready_cmd.rc | default(1) | int) == 0 and (tc19_details_cmd.rc | default(1) | int) == 0 }}"

    - name: "TC-19: Reset external probe result for this case"
      ansible.builtin.set_fact:
        atp_external_registry_probe_ok: false
        atp_external_registry_probe_summary: "Not run"

    - name: "TC-19: Probe configured external registry if internal registry checks fail"
      ansible.builtin.include_tasks: external_registry_probe.yml
      when: not (tc19_internal_test_ok | bool)

    - name: "TC-19: Decide whether pull-secret authentication fallback is required"
      ansible.builtin.set_fact:
        atp_registry_probe_pull_secret: "{{ not (tc19_internal_test_ok | bool or atp_external_registry_probe_ok | default(false) | bool) }}"

    - name: "TC-19: Discover and authenticate registries from the cluster pull-secret"
      ansible.builtin.include_tasks: registry_pull_secret_probe.yml

    - name: "TC-19: Classify result and registry notes"
      ansible.builtin.set_fact:
        tc19_external_available: "{{ atp_external_registry_probe_ok | default(false) | bool or atp_pullsecret_login_ok | default(false) | bool }}"
        tc19_registry_status: "{{ 'Pass' if (tc19_internal_test_ok | bool or atp_external_registry_probe_ok | default(false) | bool or atp_pullsecret_login_ok | default(false) | bool) else 'Fail' }}"
        tc19_registry_notes: >-
          {% if tc19_internal_test_ok | bool and (atp_external_registry_effective_url | default('') | length > 0 or atp_pullsecret_registry_hosts | default([]) | length > 0) %}
          Internal registry pod, readiness, and log checks passed. External registry references were also found (configured endpoint: {{ atp_external_registry_effective_url | regex_replace('^https?://', '') if atp_external_registry_effective_url | default('') | length > 0 else 'none' }}; pull-secret entries: {{ atp_pullsecret_registry_hosts | default([]) | join(', ') if atp_pullsecret_registry_hosts | default([]) | length > 0 else 'none' }}). External login was not run because the internal registry passed.
          {% elif tc19_internal_test_ok | bool %}
          Internal registry pod, readiness, and log checks passed. No external registry reference was discovered.
          {% elif atp_pullsecret_login_ok | default(false) | bool %}
          The internal registry is Removed, absent, or unhealthy (managementState={{ atp_registry_management_state }}). Podman authenticated successfully to external pull-secret registry host(s): {{ atp_pullsecret_login_success_hosts | default([]) | join(', ') }}. This external registry satisfies TC-19.
          {% elif atp_external_registry_probe_ok | default(false) | bool %}
          The internal registry is Removed, absent, or unhealthy (managementState={{ atp_registry_management_state }}). The configured external registry passed its OCI API probe: {{ atp_external_registry_effective_url | regex_replace('^https?://', '') }}.
          {% else %}
          Neither registry passed its health/authentication check. Internal managementState={{ atp_registry_management_state }}, ClusterOperator Available={{ atp_registry_operator_available }}, internal service present={{ atp_registry_service_present }}. Internal command errors: {{ tc19_details_cmd.stderr | default('not run') | truncate(200) }}. External OCI probe: {{ atp_external_registry_probe_summary | default('not run') }}. Pull-secret probe: {{ atp_pullsecret_login_summary | default('not successful') | trim }}.
          {% endif %}

    - name: "TC-19: Record Result"
      vars:
        tc19_internal_pod_json: "{{ (tc19_cmd.stdout | default('{}') | from_json) if (tc19_cmd.rc | default(1) | int) == 0 else {'items': []} }}"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-19',
          'name': 'Check Internal and External Registry Status',
          'category': 'Services Check',
          'expected': 'Pass when internal registry pods are Running, ready, and emitting level=info logs, or when an external registry authenticates successfully. If both exist, run the internal checks and report the external registry references.',
          'status': tc19_registry_status | trim,
          'procedure': 'Inspect Image Registry Operator state. If internal registry is active, validate its pods, placement, readiness, and logs. If internal validation is unavailable or fails, probe the configured external OCI endpoint and authenticate candidate registries from the cluster pull-secret.',
          'evidence': ((atp_registry_control_state_cmd.stdout | default('')) ~ ('\nInternal registry pods: ' ~ (tc19_cmd.stdout | default('not queried because internal registry is unavailable'))) ~ ('\nInternal pod readiness exit code: ' ~ (tc19_pods_ready_cmd.rc | default('not run') | string)) ~ ('\nInternal placement/log evidence: ' ~ (tc19_details_cmd.stdout | default(tc19_details_cmd.stderr | default('not run'))) ) ~ ('\nExternal endpoint: ' ~ (atp_external_registry_effective_url | regex_replace('^https?://', '') if atp_external_registry_effective_url | default('') | length > 0 else 'not configured/discovered')) ~ ('\nExternal OCI probe: ' ~ (atp_external_registry_probe_summary | default('not run'))) ~ ('\nPull-secret registry hosts: ' ~ (atp_pullsecret_registry_hosts | default([]) | join(', ') if atp_pullsecret_registry_hosts | default([]) | length > 0 else 'none')) ~ ('\nPull-secret authentication: ' ~ (atp_pullsecret_login_summary | default('not run') | trim)),
          'details': tc19_registry_notes | trim ~ '; Running internal registry pods: ' ~ ((tc19_internal_pod_json['items'] | selectattr('status.phase', 'equalto', 'Running') | map(attribute='metadata.name') | list | join(', ')) if (tc19_internal_pod_json['items'] | length > 0) else 'None'),
          'additional_comments': tc19_registry_notes | trim,
          'remediation': 'If neither internal validation nor external authentication passes, restore the Image Registry Operator or correct external pull-secret credentials, registry DNS/network reachability, and trusted CA configuration. Pull-secret values are never emitted in task output or reports.'
        }] }}"
  tags: ['general', 'telco', 'tc19', 'registry']

# TC 20: Check Internal Registry Storage
- name: "TC-20: Check Internal Registry Storage"
  when: run_tc20_check_internal_registry_storage | default(true) | bool
  block:
    - name: "TC-20: Discover configured external registry"
      ansible.builtin.include_tasks: registry_discovery.yml

    - name: "TC-20: Query registry storage configuration"
      ansible.builtin.shell: |
        set -euo pipefail
        if oc get svc image-registry -n openshift-image-registry -o name >/dev/null 2>&1; then
          storage="$(oc get configs.imageregistry.operator.openshift.io/cluster -o jsonpath='{.spec.storage}' | jq .)"
          if [[ -z "$storage" || "$storage" == "{}" || "$storage" == "null" ]]; then
            echo "Internal registry service exists, but Image Registry Operator has no storage backend configured: $storage" >&2
            exit 1
          fi
          if [[ "$storage" == *emptyDir* ]]; then
            echo "Internal registry uses ephemeral emptyDir storage; persistent storage is not configured: $storage" >&2
            exit 1
          fi
          echo "Internal registry storage backend: $storage"
        else
          echo "TC20_RESULT=SKIPPED_EXTERNAL_ONLY: No internal image-registry service is configured; internal registry storage validation is not applicable. External registry storage is managed by its provider and cannot be inspected through the OpenShift Image Registry Operator. Validate persistence with the registry owner's storage health checks or an authenticated push/pull test."
          exit 0
        fi
      args:
        executable: /bin/bash
      register: tc20_cmd
      changed_when: false
      failed_when: false

    - name: "TC-20: Classify registry storage result"
      ansible.builtin.set_fact:
        tc20_status: "{{ 'Pass' if tc20_cmd.rc == 0 and 'Internal registry storage backend:' in (tc20_cmd.stdout | default('')) else 'Skipped' if (tc20_cmd.rc == 0 and 'TC20_RESULT=SKIPPED_EXTERNAL_ONLY' in (tc20_cmd.stdout | default(''))) or (tc20_cmd.rc == 2 and 'no external registry URL' in (tc20_cmd.stdout | default('') | lower)) else 'Fail' }}"

    - name: "TC-20: Build Result Record"
      ansible.builtin.set_fact:
        tc20_result_record:
          id: "TC-20"
          name: "Check Configured Registry Storage"
          category: "Services Check"
          expected: "The registry storage configuration is returned as JSON; internal storage is persistent, while external storage persistence requires verification by its owner"
          status: "{{ tc20_status | trim }}"
          procedure: "{{ tc20_cmd.cmd | default('See ATP task source; command metadata unavailable') }}"
          evidence: "{{ (tc20_cmd.stdout | default('')) ~ (('\\nSTDERR:\\n' ~ (tc20_cmd.stderr | default(''))) if (tc20_cmd.stderr | default('') | length > 0) else '') ~ ('\\nExit code: ' ~ (tc20_cmd.rc | string) if tc20_cmd.rc is defined else '') }}"
          details: "{{ tc20_cmd.stdout | default(tc20_cmd.stderr) | truncate(150) }}"

    - name: "TC-20: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [tc20_result_record] }}"
  tags: ['general', 'telco', 'tc20', 'registry_storage']

# TC 21: Monitoring Stack Status
- name: "TC-21: Monitoring Stack Status"
  when: run_tc21_monitoring_stack_status | default(true) | bool
  block:
    - name: "TC-21: Check monitoring clusteroperator"
      ansible.builtin.command: oc get co monitoring -o json
      register: tc21_cmd
      changed_when: false
      failed_when: false

    - name: "TC-21: List monitoring pods and node placement"
      ansible.builtin.command: oc get pods -n openshift-monitoring -o wide
      register: tc21_pods_cmd
      changed_when: false
      failed_when: false

    - name: "TC-21: Verify all monitoring pods are Running and ready"
      ansible.builtin.shell: |
        set -euo pipefail
        oc get pods -n openshift-monitoring -o json | jq -e '(.items | length > 0) and (.items | all(.[]; .status.phase == "Running" and (.status.containerStatuses | length > 0) and (.status.containerStatuses | all(.[]; .ready == true))))'
      args:
        executable: /bin/bash
      register: tc21_ready_cmd
      changed_when: false
      failed_when: false

    - name: "TC-21: Record Result"
      vars:
        mon_conditions: "{{ ((tc21_cmd.stdout | from_json).status.conditions) if tc21_cmd.rc == 0 else [] }}"
        mon_avail: "{{ (mon_conditions | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first) | default('Unknown') }}"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-21',
          'name': 'Monitoring Stack Status',
          'category': 'Services Check',
          'expected': 'Monitoring Operator Available=True with pods Running',
          'status': ('Pass' if (tc21_cmd.rc == 0 and tc21_pods_cmd.rc == 0 and tc21_ready_cmd.rc == 0 and mon_avail == 'True') else 'Fail'),
          'procedure': (tc21_cmd.cmd | default('See ATP task source; command metadata unavailable')) ~ '\n' ~ (tc21_pods_cmd.cmd | default('Pod placement command unavailable')) ~ '\n' ~ (tc21_ready_cmd.cmd | default('Pod readiness command unavailable')),
          'evidence': ((tc21_cmd.stdout | default('')) ~ '\n' ~ (tc21_pods_cmd.stdout | default('')) ~ '\n' ~ (tc21_ready_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc21_cmd.stderr | default(''))) if (tc21_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc21_cmd.rc | string) if tc21_cmd.rc is defined else '')),
          'details': 'Available: ' ~ mon_avail ~ '\nMonitoring pods and placement:\n' ~ (tc21_pods_cmd.stdout | default(tc21_pods_cmd.stderr) | truncate(250))
        }] }}"
  tags: ['general', 'telco', 'tc21', 'monitoring']

# TC 22: Logging Stack Status
- name: "TC-22: Logging Stack Status"
  when: run_tc22_logging_stack_status | default(true) | bool
  block:
    - name: "TC-22: Detect OpenShift release"
      ansible.builtin.command: oc get clusterversion version -o jsonpath='{.status.desired.version}'
      register: tc22_version_cmd
      changed_when: false
      failed_when: false

    - name: "TC-22: Classify OpenShift logging API policy"
      ansible.builtin.set_fact:
        tc22_detected_ocp_version: "{{ tc22_version_cmd.stdout | default('') | trim }}"
        tc22_ocp_version_valid: "{{ (tc22_version_cmd.rc | default(1) | int == 0) and ((tc22_version_cmd.stdout | default('') | trim) is match('^[0-9]+[.][0-9]+[.][0-9]+([+-].*)?$')) }}"
        tc22_use_modern_logging_api: false
        tc22_logging_api_policy: "Unknown: unable to detect a valid OpenShift version"
      when: tc22_version_cmd is defined

    - name: "TC-22: Select logging API generation from detected release"
      ansible.builtin.set_fact:
        tc22_use_modern_logging_api: "{{ tc22_detected_ocp_version is version('4.19.0', '>=') }}"
        tc22_logging_api_policy: "{{ 'OCP 4.19+: validate only ClusterLogForwarder (observability.openshift.io)' if (tc22_detected_ocp_version is version('4.19.0', '>=')) else 'OCP before 4.19: validate legacy Logging APIs with ClusterLogForwarder fallback' }}"
      when: tc22_ocp_version_valid | bool

    - name: "TC-22: Check legacy ClusterLogging configuration (pre-4.19 only)"
      ansible.builtin.command: oc get clusterloggings.logging.openshift.io/instance -n openshift-logging -o yaml
      register: tc22_legacy_cmd
      changed_when: false
      failed_when: false
      when:
        - tc22_ocp_version_valid | bool
        - not (tc22_use_modern_logging_api | bool)

    - name: "TC-22: Check legacy ClusterLogForwarder configuration (pre-4.19 only)"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          oc get clusterlogforwarders.logging.openshift.io -n openshift-logging -o json | jq -e '.items | length > 0' >/dev/null
          oc get clusterlogforwarders.logging.openshift.io -n openshift-logging -o yaml
        executable: /bin/bash
      register: tc22_legacy_forwarder_cmd
      changed_when: false
      failed_when: false
      when:
        - tc22_ocp_version_valid | bool
        - not (tc22_use_modern_logging_api | bool)

    - name: "TC-22: Check ClusterLogForwarder observability API (4.19+)"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          oc get clusterlogforwarders.observability.openshift.io -n openshift-logging -o json | jq -e '.items | length > 0' >/dev/null
          oc get clusterlogforwarders.observability.openshift.io -n openshift-logging -o yaml
        executable: /bin/bash
      register: tc22_modern_forwarder_cmd
      changed_when: false
      failed_when: false
      when:
        - tc22_ocp_version_valid | bool
        - tc22_use_modern_logging_api | bool

    - name: "TC-22: List logging pods and node placement"
      ansible.builtin.command: oc get pods -n openshift-logging -o wide
      register: tc22_pods_cmd
      changed_when: false
      failed_when: false

    - name: "TC-22: Verify all logging pods are Running and ready"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          oc get pods -n openshift-logging -o json | python3 -c '
          import json
          import sys
          data = json.load(sys.stdin)
          pods = data.get("items") or []
          failures = []
          for pod in pods:
            metadata = pod.get("metadata") or {}
            status = pod.get("status") or {}
            containers = status.get("containerStatuses") or []
            unready = [container.get("name", "<unknown>") for container in containers if container.get("ready") is not True]
            if status.get("phase") != "Running" or not containers or unready:
              failures.append((metadata.get("name", "<unknown>"), status.get("phase", "Unknown"), unready))
          if not pods:
            print("FAIL: no pods found in openshift-logging.", file=sys.stderr)
            sys.exit(1)
          if failures:
            for name, phase, unready in failures:
              print("NOT_READY pod=%s phase=%s unready_containers=%s" % (name, phase, ",".join(unready) or "none"), file=sys.stderr)
            sys.exit(1)
          print("PASS: all %s pods in openshift-logging are Running and every container is ready." % len(pods))
          '
        executable: /bin/bash
      register: tc22_ready_cmd
      changed_when: false
      failed_when: false

    - name: "TC-22: Evaluate selected logging API"
      ansible.builtin.set_fact:
        tc22_supported_api_available: "{{ ((tc22_modern_forwarder_cmd.rc | default(1) | int) == 0) if (tc22_use_modern_logging_api | bool) else (((tc22_legacy_cmd.rc | default(1) | int) == 0) or ((tc22_legacy_forwarder_cmd.rc | default(1) | int) == 0) or ((tc22_modern_forwarder_cmd.rc | default(1) | int) == 0)) }}"

    - name: "TC-22: Record Result"
      ansible.builtin.set_fact:
        tc22_result:
          id: "TC-22"
          name: "Logging Stack Status"
          category: "Services Check"
          expected: "OCP 4.19 and later: a configured ClusterLogForwarder in observability.openshift.io is available. Earlier releases: a supported legacy Logging API or ClusterLogForwarder is available. Logging pods are Running and ready."
          status: "{{ 'Pass' if (tc22_ocp_version_valid | default(false) | bool) and (tc22_supported_api_available | default(false) | bool) and (tc22_pods_cmd.rc | default(1) | int == 0) and (tc22_ready_cmd.rc | default(1) | int == 0) else 'Fail' }}"
          procedure: >-
            Detect the OpenShift release, query the logging API selected for that release, and verify all logging pods are Running and ready.
            Detected release={{ tc22_detected_ocp_version | default('unknown') }};
            API policy={{ tc22_logging_api_policy | default('unknown') }}.
          evidence: |
            == OpenShift version ==
            {{ tc22_version_cmd.stdout | default('') }}
            == Selected API policy ==
            {{ tc22_logging_api_policy | default('unknown') }}
            == Legacy ClusterLogging ==
            {{ tc22_legacy_cmd.stdout | default('Not queried') }}
            == Legacy ClusterLogForwarder ==
            {{ tc22_legacy_forwarder_cmd.stdout | default('Not queried') }}
            == Observability ClusterLogForwarder ==
            {{ tc22_modern_forwarder_cmd.stdout | default('Not queried') }}
            == Logging pods and placement ==
            {{ tc22_pods_cmd.stdout | default(tc22_pods_cmd.stderr | default('')) }}
            == Pod readiness check ==
            {{ tc22_ready_cmd.stdout | default(tc22_ready_cmd.stderr | default(''), true) }}
            Exit code: {{ tc22_ready_cmd.rc | default('unknown') }}
          details: >-
            OCP={{ tc22_detected_ocp_version | default('unknown') }};
            selected policy={{ tc22_logging_api_policy | default('unknown') }};
            supported logging API={{ tc22_supported_api_available | default(false) }};
            readiness rc={{ tc22_ready_cmd.rc | default('unknown') }}.
          remediation: >-
            Confirm the detected OpenShift release and configure the supported logging API for that release.
            For OCP 4.19+, use ClusterLogForwarder in observability.openshift.io; do not require the legacy ClusterLogging API.
            For earlier releases, inspect legacy Logging APIs or the Logging 6 ClusterLogForwarder fallback.
            Verify the Logging Operator and that all logging pods are Running and Ready.

    - name: "TC-22: Append Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [tc22_result] }}"
  tags: ['general', 'telco', 'tc22', 'logging']
