            'openshift_virtualization_healthy': false,
            'openshift_ai_present': false,
            'service_mesh_control_plane_present': false,
            'service_mesh_control_plane_healthy': false,
            'openshift_serverless_present': false,
            'openshift_serverless_healthy': false,
            'windows_container_workloads_present': false,
            'windows_container_workloads_healthy': false,
            'gpu_accelerated_workloads_present': false,
            'gpu_accelerated_workloads_healthy': false,
            'sandboxed_container_workloads_present': false,
            'sandboxed_container_workloads_healthy': false,
            'node_tuning_operator_present': false,
            'node_tuning_operator_healthy': false,
            'kubernetes_nmstate_networking_present': false,
            'kubernetes_nmstate_networking_healthy': false,
            'cost_management_operator_present': false,
            'cost_management_operator_healthy': false,
            'descheduler_operator_present': false,
            'descheduler_operator_healthy': false,
            'namespace_network_policy_baseline_present': false,
            'namespace_egress_controls_present': false,
            'namespace_egress_controls_healthy': false,
            'compliancesuite_count': 0,
            'identity_provider_count': 0,
            'insights_healthy': false
          }
        }
      }}
  ansible.builtin.set_fact:
    day2_posture_data: "{{ day2_posture_payload }}"
    day2_capability_sections_fallback: >-
      {%- set sections = [] -%}
      {%- set resolved_capability_profile = ((cluster_health_profile | default({})).get('capabilities', {})) -%}
      {%- for item in (resolved_capability_profile | dict2items) -%}
        {%- set cap = item.value if item.value is mapping else {} -%}
        {%- if (cap.get('enabled', true) | bool) and (cap.get('required', false) | bool) -%}
        {%- set _ = sections.append({
          'key': item.key,
          'title': (item.key | replace('_', ' ') | trim),
          'required': (cap.get('required', false) | bool),
          'criticality': (cap.get('criticality', 'medium') | string | lower | trim),
          'expected_state': (cap.get('expected_state', 'present') | string | lower | trim),
          'owner': (cap.get('owner', 'platform') | string | trim or 'platform'),
          'evidence_required': ((cap.get('evidence_required', []) or []) | map('string') | map('trim') | reject('equalto', '') | list),
          'notes': (cap.get('notes', '') | string | trim),
          'docs': (
            (cap.get('docs', []) or [])
            if (cap.get('docs', []) is sequence and cap.get('docs', []) is not string and cap.get('docs', []) is not mapping)
            else ([cap.get('docs', '') | string | trim] if (cap.get('docs', '') | string | trim | length > 0) else [])
          ),
          'verification': (
            (cap.get('verification', []) or [])
            if (cap.get('verification', []) is sequence and cap.get('verification', []) is not string and cap.get('verification', []) is not mapping)
            else ([cap.get('verification', '') | string | trim] if (cap.get('verification', '') | string | trim | length > 0) else [])
          ),
          'status': 'not-assessed',
          'check_count': 0,
          'finding_count': 0,
          'checks': [],
          'findings': [],
          'recommended_action': 'Collect or review the expected evidence for this capability and remediate any gaps.',
          'top_detail': 'No collected capability check was produced in this run. Review the expected evidence sources and rerun the report.'
        }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ sections }}

- name: Resolve production Day 2 capability sections
  vars:
    day2_posture_payload: "{{ day2_posture_data | default({}) }}"
  ansible.builtin.set_fact:
    day2_capability_sections_resolved: >-
      {{
        (day2_posture_payload.capability_sections | default([]))
        if (
          (day2_posture_payload.assessment_state | default('completed')) == 'completed'
          and ((day2_posture_payload.capability_sections | default([])) | length > 0)
        )
        else (day2_capability_sections_fallback | default([]))
      }}

- name: Resolve production Day 2 posture summary aggregate
  vars:
    day2_posture_payload: "{{ day2_posture_data | default({}) }}"
  ansible.builtin.set_fact:
    day2_posture_summary_resolved: >-
      {{
        (day2_posture_payload.day2_posture_summary | default({}))
        | combine(
            {
              'capability_assessment_state': (
                'completed'
                if (
                  (day2_posture_payload.assessment_state | default('completed')) == 'completed'
                  and ((day2_posture_payload.capability_sections | default([])) | length > 0)
                )
                else 'failed'
              ),
              'capability_assessment_error': (
                ''
                if (
                  (day2_posture_payload.assessment_state | default('completed')) == 'completed'
                  and ((day2_posture_payload.capability_sections | default([])) | length > 0)
                )
                else (
                  day2_posture_payload.day2_posture_summary.capability_assessment_error
                  | default(day2_posture_payload.assessment_error | default('production Day 2 capability assessment did not produce mapped capability sections'))
                )
              ),
              'checks_total': (day2_posture_payload.day2_posture_summary.checks_total | default(0) | int)
            },
            recursive=True
          )
      }}

- name: Publish production Day 2 posture facts
  vars:
    day2_posture_payload: "{{ day2_posture_data | default({}) }}"
  ansible.builtin.set_fact:
    day2_posture_checks: "{{ day2_posture_payload.day2_posture_checks | default([]) }}"
    day2_posture_findings: "{{ day2_posture_payload.day2_posture_findings | default([]) }}"
    scored_day2_posture_findings: "{{ day2_posture_payload.scored_day2_posture_findings | default([]) }}"
    day2_capability_sections: "{{ day2_capability_sections_resolved }}"
    day2_posture_summary: "{{ day2_posture_summary_resolved }}"
