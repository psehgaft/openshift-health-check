          'dataprotectionapplication_summary': (dataprotectionapplication_summary | default([])),
          'apiserver_readyz_status': (apiserver_readyz_status | default('unavailable')),
          'apiserver_readyz_failed_checks': (apiserver_readyz_failed_checks | default(0)),
          'etcd_wal_fsync_p99_ms': (etcd_wal_fsync_p99_ms | default('')),
          'etcd_backend_commit_p99_ms': (etcd_backend_commit_p99_ms | default('')),
          'etcd_leader_changes_5m': (etcd_leader_changes_5m | default('')),
          'etcd_members_reporting_leader': (etcd_members_reporting_leader | default('')),
          'etcd_leader_count': (etcd_leader_count | default('')),
          'etcd_peer_rtt_p99_ms': (etcd_peer_rtt_p99_ms | default('')),
          'apiserver_request_p99_seconds': (apiserver_request_p99_seconds | default('')),
          'apiserver_request_5xx_rate': (apiserver_request_5xx_rate | default('')),
          'apiserver_request_read_rate': (apiserver_request_read_rate | default('')),
          'apiserver_request_write_rate': (apiserver_request_write_rate | default('')),
          'apiserver_current_read_inflight': (apiserver_current_read_inflight | default('')),
          'apiserver_current_write_inflight': (apiserver_current_write_inflight | default('')),
          'apiserver_storage_objects_total': (apiserver_storage_objects_total | default('')),
          'top_alert_groups': (top_alert_groups | default([])),
          'top_event_reasons': (top_event_reasons | default([])),
          'top_pod_cpu_usage_summary': (top_pod_cpu_usage_summary | default([])),
          'top_pod_memory_usage_summary': (top_pod_memory_usage_summary | default([])),
          'node_capacity_summary_by_density_desc': (node_capacity_summary_by_density_desc | default([]))
        } | to_json
      }}
  register: openshift_live_report_payload_cmd
  changed_when: false
  when:
    - report_mode_resolved | default('live') != 'collected'
    - report_run_mode | default('fresh') != 'resume_last_failure'

- name: Normalize shared OpenShift report payload
  vars:
    openshift_report_payload_result: >-
      {{
        openshift_collected_report_payload_cmd
        if (
          openshift_collected_report_payload_cmd is defined
          and not (openshift_collected_report_payload_cmd.skipped | default(false))
        )
        else (
          openshift_live_resume_report_payload_cmd
          if (
            openshift_live_resume_report_payload_cmd is defined
            and not (openshift_live_resume_report_payload_cmd.skipped | default(false))
          )
          else (openshift_live_report_payload_cmd | default({}))
        )
      }}
  ansible.builtin.set_fact:
    openshift_report_payload_common: "{{ openshift_report_payload_result.stdout | from_json }}"
    openshift_collected_report_payload_pre_written: >-
      {{
        (
          openshift_collected_report_payload_cmd is defined
          and not (openshift_collected_report_payload_cmd.skipped | default(false))
          and ((openshift_collected_report_payload_cmd.stdout | default('') | from_json)._payload_written_paths | default([]) | length > 0)
        )
      }}
  when:
    - openshift_report_payload_result is defined
    - not (openshift_report_payload_result.skipped | default(false))
    - (openshift_report_payload_result.stdout | default('') | length) > 0
