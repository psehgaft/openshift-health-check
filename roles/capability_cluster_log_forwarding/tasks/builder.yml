---
- name: Build cluster log forwarding capability artifact facts
  vars:
    day2_cluster_log_forwarding_section_current: "{{ (day2_capability_sections_by_key | default({})).get('cluster_log_forwarding', {}) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: cluster_log_forwarding
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      observability_status: "{{ day2_cluster_log_forwarding_section_current.status | default('unknown') }}"
      observability_reason_summary: "{{ day2_cluster_log_forwarding_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_cluster_log_forwarding_section: "{{ day2_cluster_log_forwarding_section_current }}"
    capability_artifact_collection_inputs:
      cluster_log_forwarding_healthy: "{{ ((day2_posture_summary | default({})).get('cluster_log_forwarding_healthy', false)) | bool }}"
      vendor_managed_log_forwarding_present: "{{ ((day2_posture_summary | default({})).get('vendor_managed_log_forwarding_present', false)) | bool }}"
