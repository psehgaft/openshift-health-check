---
- name: Build Grafana metrics dashboards capability artifact facts
  vars:
    day2_grafana_metrics_dashboards_section_current: "{{ (day2_capability_sections_by_key | default({})).get('grafana_metrics_dashboards', {}) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: grafana_metrics_dashboards
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      observability_status: "{{ day2_grafana_metrics_dashboards_section_current.status | default('unknown') }}"
      observability_reason_summary: "{{ day2_grafana_metrics_dashboards_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_grafana_metrics_dashboards_section: "{{ day2_grafana_metrics_dashboards_section_current }}"
    capability_artifact_collection_inputs:
      grafana_dashboard_present: "{{ ((day2_posture_summary | default({})).get('grafana_dashboard_present', false)) | bool }}"
      grafana_dashboard_configmap_count: "{{ ((day2_posture_summary | default({})).get('grafana_dashboard_configmap_count', 0)) | int }}"
      grafana_dashboard_resource_count: "{{ ((day2_posture_summary | default({})).get('grafana_dashboard_resource_count', 0)) | int }}"
      grafana_present: "{{ ((day2_posture_summary | default({})).get('grafana_present', false)) | bool }}"
