---
# ==============================================================================
# Section 1: OpenShift Services Check (TC 01 to TC 22)
# ==============================================================================

# TC 01: Cluster Version
- name: "TC-01: Verify Cluster Version"
  when: run_tc01_cluster_version | default(true) | bool
  block:
    - name: "TC-01: Query clusterversion"
      ansible.builtin.command: oc get clusterversion version -o json
      register: tc01_cmd
      changed_when: false
      failed_when: false

    - name: "TC-01: Record Result"
      vars:
        cv_data: "{{ (tc01_cmd.stdout | from_json) if tc01_cmd.rc == 0 else {} }}"
        cur_version: "{{ cv_data.status.history[0].version | default('Unknown') }}"
        target_version: "{{ expected_ocp_version | default('4.20') }}"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-01',
          'name': 'Cluster Version',
          'category': 'Services Check',
          'expected': 'OpenShift version ' ~ target_version ~ ' detected and Available=True',
          'status': ('Pass' if (tc01_cmd.rc == 0 and target_version in cur_version) else 'Fail'),
          'procedure': (tc01_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc01_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc01_cmd.stderr | default(''))) if (tc01_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc01_cmd.rc | string) if tc01_cmd.rc is defined else '')),
          'details': 'Detected OCP Version: ' ~ cur_version ~ ' (Expected: ' ~ target_version ~ ')'
        }] }}"
  tags: ['general', 'telco', 'tc01', 'clusterversion']

# TC 02: Cluster and nodes Status
- name: "TC-02: Verify Cluster and Nodes Status"
  when: run_tc02_cluster_nodes_status | default(true) | bool
  block:
    - name: "TC-02: Query unready nodes"
      ansible.builtin.command: oc get nodes --no-headers
      register: tc02_cmd
      changed_when: false
      failed_when: false

    - name: "TC-02: Record Result"
      vars:
        all_lines: "{{ tc02_cmd.stdout_lines | default([]) }}"
        unready_lines: "{{ all_lines | reject('search', ' Ready') | list }}"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-02',
          'name': 'Cluster and nodes Status',
          'category': 'Services Check',
          'expected': 'Cluster Available and all nodes in Ready state',
          'status': ('Pass' if (tc02_cmd.rc == 0 and unready_lines | length == 0 and all_lines | length > 0) else 'Fail'),
          'procedure': (tc02_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc02_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc02_cmd.stderr | default(''))) if (tc02_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc02_cmd.rc | string) if tc02_cmd.rc is defined else '')),
          'details': 'Total Nodes: ' ~ (all_lines | length) ~ ', Unready: ' ~ (unready_lines | length)
        }] }}"
  tags: ['general', 'telco', 'tc02', 'nodes']

# TC 03: Check DNS Resolution
- name: "TC-03: Check DNS Resolution in cluster"
  when: run_tc03_dns_resolution | default(true) | bool
  block:
    - name: "TC-03: Execute DNS test query inside cluster"
      ansible.builtin.command: oc get svc -n openshift-dns
      register: tc03_cmd
      changed_when: false
      failed_when: false

    - name: "TC-03: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-03',
          'name': 'Check DNS Resolution',
          'category': 'Services Check',
          'expected': 'Internal cluster DNS service active and resolving',
          'status': ('Pass' if tc03_cmd.rc == 0 else 'Fail'),
          'procedure': (tc03_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc03_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc03_cmd.stderr | default(''))) if (tc03_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc03_cmd.rc | string) if tc03_cmd.rc is defined else '')),
          'details': tc03_cmd.stdout | default(tc03_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc03', 'dns']

# TC 04: Check DNS Operator
- name: "TC-04: Check DNS Operator"
  when: run_tc04_dns_operator | default(true) | bool
  block:
    - name: "TC-04: Query DNS Operator status"
      ansible.builtin.command: oc get clusteroperator dns -o json
      register: tc04_cmd
      changed_when: false
      failed_when: false

    - name: "TC-04: Record Result"
      vars:
        dns_conditions: "{{ ((tc04_cmd.stdout | from_json).status.conditions) if tc04_cmd.rc == 0 else [] }}"
        avail_cond: "{{ (dns_conditions | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first) | default('Unknown') }}"
        deg_cond: "{{ (dns_conditions | selectattr('type', 'equalto', 'Degraded') | map(attribute='status') | first) | default('Unknown') }}"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-04',
          'name': 'Check DNS Operator',
          'category': 'Services Check',
          'expected': 'DNS Operator Available=True and Degraded=False',
          'status': ('Pass' if (tc04_cmd.rc == 0 and avail_cond == 'True' and deg_cond == 'False') else 'Fail'),
          'procedure': (tc04_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc04_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc04_cmd.stderr | default(''))) if (tc04_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc04_cmd.rc | string) if tc04_cmd.rc is defined else '')),
          'details': 'Available: ' ~ avail_cond ~ ', Degraded: ' ~ deg_cond
        }] }}"
  tags: ['general', 'telco', 'tc04', 'dns']

# TC 05: Check NTP Synchronization
- name: "TC-05: Check NTP Synchronization"
  when: run_tc05_ntp_synchronization | default(true) | bool
  block:
    - name: "TC-05: Query chronyd status on first node"
      ansible.builtin.shell: >
        NODE=$(oc get nodes -l node-role.kubernetes.io/worker -o jsonpath='{.items[0].metadata.name}');
        oc debug node/${NODE} -- chroot /host chronyc sources
      register: tc05_cmd
      changed_when: false
      failed_when: false

    - name: "TC-05: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-05',
          'name': 'Check NTP Synchronization',
          'category': 'Services Check',
          'expected': 'NTP synchronized with upstream reference sources',
          'status': ('Pass' if (tc05_cmd.rc == 0 and ('^*' in tc05_cmd.stdout or '^+' in tc05_cmd.stdout)) else 'Fail'),
          'procedure': (tc05_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc05_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc05_cmd.stderr | default(''))) if (tc05_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc05_cmd.rc | string) if tc05_cmd.rc is defined else '')),
          'details': tc05_cmd.stdout | default(tc05_cmd.stderr) | truncate(150)
