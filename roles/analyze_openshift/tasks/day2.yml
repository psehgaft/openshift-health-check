  register: day2_posture_cmd
  changed_when: false
  failed_when: false

- name: Remove production Day 2 posture input file
  ansible.builtin.file:
    path: "{{ day2_posture_input_file.path }}"
    state: absent
  when: day2_posture_input_file is defined and (day2_posture_input_file.path | default('') | length > 0)
  changed_when: false

- name: Normalize production Day 2 posture summary
  vars:
    day2_posture_payload: >-
      {{
        day2_posture_cmd.stdout | from_json
        if (day2_posture_cmd.rc == 0 and (day2_posture_cmd.stdout | default('') | length > 0))
        else {
          'assessment_state': 'failed',
          'assessment_error': (
            day2_posture_cmd.stderr | default('') | trim
            or ('production Day 2 posture analyzer returned rc=' ~ (day2_posture_cmd.rc | default(-1) | string) ~ ' without JSON output')
          ),
          'day2_posture_checks': [],
          'day2_posture_findings': [],
          'scored_day2_posture_findings': [],
          'capability_sections': [],
          'day2_posture_summary': {
            'capability_assessment_state': 'failed',
            'capability_assessment_error': (
              day2_posture_cmd.stderr | default('') | trim
              or ('production Day 2 posture analyzer returned rc=' ~ (day2_posture_cmd.rc | default(-1) | string) ~ ' without JSON output')
            ),
            'checks_total': 0,
            'checks_warn': 0,
            'scored_findings_count': 0,
            'baseline_profile': {},
            'gitops_present': false,
            'gitops_operational': false,
            'gitops_automated_sync_present': false,
            'argocd_count': 0,
            'gitops_application_count': 0,
            'gitops_repo_backed_application_count': 0,
            'gitops_automated_sync_application_count': 0,
            'gitops_appproject_count': 0,
            'namespace_onboarding_controls_present': false,
            'project_request_template_name': '',
            'project_request_template_present': false,
            'project_request_template_guardrail_count': 0,
            'project_request_message_configured': false,
            'self_provisioning_restricted': false,
            'self_provisioner_autoupdate_false': false,
            'onboarding_gitops_application_count': 0,
            'team_rbac_namespace_count': 0,
            'team_rbac_group_count': 0,
            'known_team_group_count': 0,
            'namespaces_with_all_baseline_guardrails': 0,
            'namespaces_with_all_namespace_governance_guardrails': 0,
            'external_secret_store_count': 0,
            'external_secret_count': 0,
            'clusterautoscaler_count': 0,
            'clusterautoscaler_expected': false,
            'hostedcluster_count': 0,
            'nodepool_count': 0,
            'hostedcluster_autoscaling_present': false,
            'nodepool_autoscaling_present': false,
            'machinehealthcheck_count': 0,
            'machinehealthcheck_expected': false,
            'acm_managed': false,
            'acm_klusterlet_count': 0,
            'acm_managedclusteraddon_count': 0,
            'acm_agent_namespace_count': 0,
            'enable_user_workload_monitoring': false,
            'servicemonitor_count': 0,
            'podmonitor_count': 0,
            'grafana_present': false,
            'grafana_dashboard_configmap_count': 0,
            'grafana_dashboard_present': false,
            'workloads_using_external_private_registries_present': false,
            'external_private_registry_count': 0,
            'credentialed_public_registry_count': 0,
            'workloads_with_image_pull_secret': 0,
            'cluster_image_mirror_configuration_present': false,
            'image_mirror_resource_count': 0,
            'disconnected_cluster_image_sources_present': false,
            'disconnected_catalogsource_count': 0,
            'ovn_ipsec_encryption': false,
            'ipsec_mode': 'Disabled',
            'etcd_encryption': false,
            'etcd_encryption_type': 'unknown',
            'etcd_encryption_complete': false,
            'etcd_encryption_reported_component_count': 0,
            'etcd_encryption_completed_component_count': 0,
            'cluster_proxy_configured': false,
            'custom_ca_trust_configured': false,
            'workload_vulnerability_scanning_present': false,
            'monitoring_persistent_storage_configured': false,
            'external_log_forwarding_output_count': 0,
            'external_alert_delivery_configured': false,
            'external_alert_receiver_count': 0,
            'external_cluster_metrics_remote_write_count': 0,
            'external_user_workload_metrics_remote_write_count': 0,
            'backup_schedule_count': 0,
            'successful_backup_count': 0,
            'secondary_site_disaster_recovery_present': false,
            'secondary_site_disaster_recovery_healthy': false,
            'drpolicy_count': 0,
            'valid_drpolicy_count': 0,
            'drcluster_count': 0,
            'drplacementcontrol_count': 0,
            'volumereplicationgroup_count': 0,
            'volumereplicationclass_count': 0,
            'secondary_site_dr_problem_drcluster_count': 0,
            'secondary_site_dr_problem_drpc_count': 0,
