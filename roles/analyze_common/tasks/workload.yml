---
- name: Build platform pod issue list
  ansible.builtin.set_fact:
    platform_pod_issues: "{{ platform_pod_issues | default([]) + pod_issue }}"
  loop: "{{ pods.items | default([]) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    phase: "{{ item.status.phase | default('Unknown') }}"
    ready_container_count: "{{ item.status.containerStatuses | default([]) | selectattr('ready', 'equalto', true) | list | length }}"
    total_container_count: "{{ item.status.containerStatuses | default([]) | length }}"
    pod_issue: >-
      {{
        [{
          'namespace': ns_name,
          'name': item.metadata.name,
          'phase': phase,
          'ready': ready_container_count ~ '/' ~ total_container_count
        }]
        if (
          ((ns_name is match(platform_namespaces_regex)) and (phase not in ['Running', 'Succeeded', 'Completed']))
          or
          ((ns_name is match(platform_namespaces_regex)) and phase == 'Running' and total_container_count > 0 and ready_container_count < total_container_count)
        ) else []
      }}
  changed_when: false

- name: Build deployment health findings
  ansible.builtin.set_fact:
    deployment_issues: "{{ deployment_issues | default([]) + issue_entry }}"
  loop: "{{ deployments.items | default([]) }}"
  vars:
    desired: "{{ item.spec.replicas | default(1) | int }}"
    available: "{{ item.status.availableReplicas | default(0) | int }}"
    ready: "{{ item.status.readyReplicas | default(0) | int }}"
    updated: "{{ item.status.updatedReplicas | default(0) | int }}"
    issue_entry: "{{ [{'kind': 'Deployment', 'namespace': item.metadata.namespace | default(''), 'name': item.metadata.name, 'desired': desired, 'available': available, 'ready': ready, 'updated': updated}] if desired > 0 and (available < desired or ready < desired or updated < desired) else [] }}"
  changed_when: false

- name: Build statefulset health findings
  ansible.builtin.set_fact:
    statefulset_issues: "{{ statefulset_issues | default([]) + issue_entry }}"
  loop: "{{ statefulsets.items | default([]) }}"
  vars:
    desired: "{{ item.spec.replicas | default(1) | int }}"
    available: "{{ item.status.currentReplicas | default(0) | int }}"
    ready: "{{ item.status.readyReplicas | default(0) | int }}"
    updated: "{{ item.status.updatedReplicas | default(0) | int }}"
    issue_entry: "{{ [{'kind': 'StatefulSet', 'namespace': item.metadata.namespace | default(''), 'name': item.metadata.name, 'desired': desired, 'available': available, 'ready': ready, 'updated': updated}] if desired > 0 and (ready < desired or updated < desired) else [] }}"
  changed_when: false

- name: Build daemonset health findings
  ansible.builtin.set_fact:
    daemonset_issues: "{{ daemonset_issues | default([]) + issue_entry }}"
  loop: "{{ daemonsets.items | default([]) }}"
  vars:
    desired: "{{ item.status.desiredNumberScheduled | default(0) | int }}"
    available: "{{ item.status.numberReady | default(0) | int }}"
    updated: "{{ item.status.updatedNumberScheduled | default(0) | int }}"
    issue_entry: "{{ [{'kind': 'DaemonSet', 'namespace': item.metadata.namespace | default(''), 'name': item.metadata.name, 'desired': desired, 'available': available, 'ready': available, 'updated': updated}] if desired > 0 and (available < desired or updated < desired) else [] }}"
  changed_when: false

- name: Combine workload health findings
  ansible.builtin.set_fact:
    workload_health_issues: "{{ (deployment_issues | default([])) + (statefulset_issues | default([])) + (daemonset_issues | default([])) }}"

- name: Build deployment probe coverage findings
  ansible.builtin.set_fact:
    workload_probe_findings: "{{ workload_probe_findings | default([]) + probe_findings }}"
  loop: "{{ deployments.items | default([]) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    workload_name: "{{ item.metadata.name | default('') }}"
    containers: "{{ item.spec.template.spec.containers | default([]) }}"
    is_user_namespace: "{{ not (ns_name is match(user_namespaces_exclude_regex)) }}"
    missing_liveness_containers: "{{ containers | rejectattr('livenessProbe', 'defined') | map(attribute='name') | list }}"
    missing_readiness_containers: "{{ containers | rejectattr('readinessProbe', 'defined') | map(attribute='name') | list }}"
    missing_startup_containers: "{{ containers | rejectattr('startupProbe', 'defined') | map(attribute='name') | list }}"
    probe_findings: >-
      {{
        ([] +
        ([{'kind': 'Deployment', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-liveness-probe', 'containers': missing_liveness_containers, 'detail': missing_liveness_containers | join(', ')}] if is_user_namespace and containers | length > 0 and missing_liveness_containers | length > 0 else []) +
        ([{'kind': 'Deployment', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-readiness-probe', 'containers': missing_readiness_containers, 'detail': missing_readiness_containers | join(', ')}] if is_user_namespace and containers | length > 0 and missing_readiness_containers | length > 0 else []) +
        ([{'kind': 'Deployment', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-startup-probe', 'containers': missing_startup_containers, 'detail': missing_startup_containers | join(', ')}] if is_user_namespace and containers | length > 0 and missing_startup_containers | length > 0 else []))
      }}
  changed_when: false

- name: Build statefulset probe coverage findings
  ansible.builtin.set_fact:
    workload_probe_findings: "{{ workload_probe_findings | default([]) + probe_findings }}"
  loop: "{{ statefulsets.items | default([]) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    workload_name: "{{ item.metadata.name | default('') }}"
    containers: "{{ item.spec.template.spec.containers | default([]) }}"
    is_user_namespace: "{{ not (ns_name is match(user_namespaces_exclude_regex)) }}"
    missing_liveness_containers: "{{ containers | rejectattr('livenessProbe', 'defined') | map(attribute='name') | list }}"
    missing_readiness_containers: "{{ containers | rejectattr('readinessProbe', 'defined') | map(attribute='name') | list }}"
    missing_startup_containers: "{{ containers | rejectattr('startupProbe', 'defined') | map(attribute='name') | list }}"
    probe_findings: >-
      {{
        ([] +
        ([{'kind': 'StatefulSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-liveness-probe', 'containers': missing_liveness_containers, 'detail': missing_liveness_containers | join(', ')}] if is_user_namespace and containers | length > 0 and missing_liveness_containers | length > 0 else []) +
        ([{'kind': 'StatefulSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-readiness-probe', 'containers': missing_readiness_containers, 'detail': missing_readiness_containers | join(', ')}] if is_user_namespace and containers | length > 0 and missing_readiness_containers | length > 0 else []) +
        ([{'kind': 'StatefulSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-startup-probe', 'containers': missing_startup_containers, 'detail': missing_startup_containers | join(', ')}] if is_user_namespace and containers | length > 0 and missing_startup_containers | length > 0 else []))
      }}
  changed_when: false

- name: Build daemonset probe coverage findings
  ansible.builtin.set_fact:
    workload_probe_findings: "{{ workload_probe_findings | default([]) + probe_findings }}"
  loop: "{{ daemonsets.items | default([]) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    workload_name: "{{ item.metadata.name | default('') }}"
    containers: "{{ item.spec.template.spec.containers | default([]) }}"
    is_user_namespace: "{{ not (ns_name is match(user_namespaces_exclude_regex)) }}"
    missing_liveness_containers: "{{ containers | rejectattr('livenessProbe', 'defined') | map(attribute='name') | list }}"
    missing_readiness_containers: "{{ containers | rejectattr('readinessProbe', 'defined') | map(attribute='name') | list }}"
    missing_startup_containers: "{{ containers | rejectattr('startupProbe', 'defined') | map(attribute='name') | list }}"
    probe_findings: >-
      {{
        ([] +
        ([{'kind': 'DaemonSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-liveness-probe', 'containers': missing_liveness_containers, 'detail': missing_liveness_containers | join(', ')}] if is_user_namespace and containers | length > 0 and missing_liveness_containers | length > 0 else []) +
        ([{'kind': 'DaemonSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-readiness-probe', 'containers': missing_readiness_containers, 'detail': missing_readiness_containers | join(', ')}] if is_user_namespace and containers | length > 0 and missing_readiness_containers | length > 0 else []) +
        ([{'kind': 'DaemonSet', 'namespace': ns_name, 'name': workload_name, 'issue': 'missing-startup-probe', 'containers': missing_startup_containers, 'detail': missing_startup_containers | join(', ')}] if is_user_namespace and containers | length > 0 and missing_startup_containers | length > 0 else []))
      }}
  changed_when: false
