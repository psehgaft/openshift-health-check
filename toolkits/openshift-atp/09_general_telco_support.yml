---
# ==============================================================================
# Section 9: General Support & Telco 5G Profile (TC 63 to TC 73)
# ==============================================================================

# TC 63: Quay Registry
- name: "TC-63: Quay Registry"
  when: run_tc63_quay_registry | default(true) | bool
  block:
    - name: "TC-63: Verify Quay registry endpoint reachability"
      ansible.builtin.command: curl -s -k -I https://quay.io
      register: tc63_cmd
      changed_when: false
      failed_when: false

    - name: "TC-63: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-63',
          'name': 'Quay Registry',
          'category': 'General Support / Telco',
          'expected': 'Quay enterprise/upstream registry reachable for container images',
          'status': ('Pass' if (tc63_cmd.rc == 0 and ('HTTP' in tc63_cmd.stdout or '200' in tc63_cmd.stdout or '301' in tc63_cmd.stdout)) else 'Fail'),
          'procedure': (tc63_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc63_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc63_cmd.stderr | default(''))) if (tc63_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc63_cmd.rc | string) if tc63_cmd.rc is defined else '')),
          'details': tc63_cmd.stdout | default(tc63_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc63', 'quay']

# TC 64: Must-gather, SSH y sosreport
- name: "TC-64: Must-gather, SSH y sosreport"
  when: run_tc64_must_gather_sosreport | default(true) | bool
  block:
    - name: "TC-64: Collect and verify must-gather and sosreport archives"
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          dest_dir="{{ atp_report_dir }}/{{ atp_report_basename }}-TC64-diagnostics"
          mkdir -p "$dest_dir"
          dest_dir="$(cd "$dest_dir" && pwd -P)"
          must_gather_dir="$dest_dir/must-gather"
          must_gather_archive="$dest_dir/must-gather.tar.gz"
          must_gather_log="$dest_dir/must-gather.log"
          sos_log="$dest_dir/sosreport.log"
          must_gather_rc=1
          root_rc=1
          sos_rc=1
          copy_rc=1
          node="{{ tc64_node_target | default('') }}"
          support_tools_image="{{ tc64_support_tools_image | default('registry.redhat.io/rhel9/support-tools:latest') }}"

          echo "== Collect OpenShift must-gather =="
          if timeout 45m oc adm must-gather --dest-dir="$must_gather_dir" --timeout=45m >"$must_gather_log" 2>&1; then
            must_gather_rc=0
          else
            must_gather_rc=$?
          fi

          must_gather_files="$(find "$must_gather_dir" -type f 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$must_gather_rc" -eq 0 && "$must_gather_files" -gt 0 ]]; then
            if tar -czf "$must_gather_archive" -C "$dest_dir" must-gather >>"$must_gather_log" 2>&1 &&
               [[ -s "$must_gather_archive" ]] &&
               gzip -t "$must_gather_archive" >/dev/null 2>&1 &&
               tar -tzf "$must_gather_archive" >/dev/null 2>&1; then
              echo "MUST_GATHER_RESULT=PASS"
              echo "Must-gather archive: $must_gather_archive"
            else
              echo "MUST_GATHER_RESULT=FAIL"
              echo "Must-gather files were collected, but archive creation or integrity validation failed."
              echo "Must-gather directory: $must_gather_dir"
              echo "Must-gather command log: $must_gather_log"
              must_gather_rc=1
            fi
          else
            echo "MUST_GATHER_RESULT=FAIL"
            echo "Must-gather did not produce a successful non-empty collection (command rc=$must_gather_rc, files=$must_gather_files)."
            echo "Must-gather command log: $must_gather_log"
            must_gather_rc=1
          fi

          echo "== Select a worker node for host diagnostics =="
          if [[ -z "$node" ]]; then
            node="$(oc get nodes -l node-role.kubernetes.io/worker -o jsonpath='{.items[0].metadata.name}' 2>&1)"
            node_lookup_rc=$?
            if [[ "$node_lookup_rc" -ne 0 || -z "$node" ]]; then
              echo "Could not discover a worker node: $node" >&2
              node=""
            fi
          fi

          if [[ -n "$node" ]]; then
            echo "Selected node: $node"
            root_output="$(oc debug -q "node/$node" -- chroot /host id -u 2>&1)"
            root_rc=$?
            echo "Host root access: output=$root_output exit_code=$root_rc"

            echo "== Generate sosreport using the support-tools image run label =="
            toolbox_name="atp-sosreport-$(date +%s)-$$"
            if timeout 45m oc debug -q "node/$node" -- chroot /host podman container runlabel --name "$toolbox_name" run "$support_tools_image" sos report -e openshift -e openshift_ovn -e openvswitch -e podman -e crio -k crio.all=on -k crio.logs=on -k podman.all=on -k podman.logs=on -k networking.ethtool-namespaces=off --batch --all-logs --plugin-timeout=600 >"$sos_log" 2>&1; then
              sos_rc=0
            else
              sos_rc=$?
            fi
            oc debug -q "node/$node" -- chroot /host podman rm "$toolbox_name" >/dev/null 2>&1 || true
            archive_name="$(grep -Eo 'sosreport-[^/[:space:]]+\.tar\.(xz|gz|bz2|zst)' "$sos_log" | tail -n 1)"
            if [[ -z "$archive_name" ]]; then
              archive_name="$(oc debug -q "node/$node" -- chroot /host find /var/tmp -maxdepth 1 -type f -name 'sosreport-*.tar.*' -mmin -90 -printf '%f\n' 2>/dev/null | sort | tail -n 1)"
            fi

            if [[ -n "$archive_name" ]]; then
              node_sos_path="/var/tmp/$archive_name"
              local_sos_path="$dest_dir/$archive_name"
              if oc debug -q "node/$node" -- cat "/host$node_sos_path" >"$local_sos_path" 2>"$dest_dir/sosreport-copy.log" && [[ -s "$local_sos_path" ]]; then
                archive_valid=0
                case "$archive_name" in
                  *.tar.xz) xz -t "$local_sos_path" >/dev/null 2>&1 || archive_valid=1 ;;
                  *.tar.gz) gzip -t "$local_sos_path" >/dev/null 2>&1 || archive_valid=1 ;;
                  *.tar.bz2) bzip2 -t "$local_sos_path" >/dev/null 2>&1 || archive_valid=1 ;;
                  *.tar.zst) zstd -t "$local_sos_path" >/dev/null 2>&1 || archive_valid=1 ;;
                  *) archive_valid=1 ;;
                esac
                if [[ "$archive_valid" -eq 0 ]]; then
                  copy_rc=0
                  echo "SOSREPORT_RESULT=PASS"
                  echo "Node sosreport archive: $node_sos_path"
                  echo "Saved sosreport archive: $local_sos_path"
                  echo "sosreport archive size: $(du -h "$local_sos_path" | awk '{print $1}')"
                  echo "sosreport SHA256: $(sha256sum "$local_sos_path" | awk '{print $1}')"
                else
                  echo "SOSREPORT_RESULT=FAIL"
                  echo "Copied sosreport archive failed format/integrity validation: $local_sos_path"
                fi
              else
                echo "SOSREPORT_RESULT=FAIL"
                echo "Could not copy a non-empty sosreport archive from $node_sos_path."
              fi
            else
              echo "SOSREPORT_RESULT=FAIL"
              echo "No sosreport archive was found in /var/tmp on node $node."
            fi
            echo "sosreport command log: $sos_log"
          else
            echo "SOSREPORT_RESULT=FAIL"
            echo "No worker node was available for sosreport collection."
          fi

          echo "TC64_ARTIFACTS_DIR=$dest_dir"
          if [[ "$must_gather_rc" -eq 0 && "$root_rc" -eq 0 && "$sos_rc" -eq 0 && "$copy_rc" -eq 0 ]]; then
            echo "TC64_RESULT=PASS"
            exit 0
          fi
          echo "TC64_RESULT=FAIL (must-gather=$must_gather_rc root-access=$root_rc sosreport-command=$sos_rc sosreport-copy-and-validation=$copy_rc)" >&2
          exit 1
        executable: /bin/bash
      register: tc64_cmd
      changed_when: false
      failed_when: false
      async: 5400
      poll: 10

    - name: "TC-64: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-64',
          'name': 'Must-gather, SSH y sosreport',
          'category': 'General Support / Telco',
          'expected': 'Must-gather and sosreport archives are successfully generated, integrity-checked, and saved in the TC-64 diagnostics directory; debug access reaches host root',
          'status': ('Pass' if (tc64_cmd.rc == 0 and 'TC64_RESULT=PASS' in (tc64_cmd.stdout | default(''))) else 'Fail'),
          'procedure': 'Generate and validate the must-gather archive; verify root access through oc debug; generate sosreport using the Red Hat support-tools image run label; copy and validate the sosreport archive.',
          'evidence': ((tc64_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc64_cmd.stderr | default(''))) if (tc64_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc64_cmd.rc | string) if tc64_cmd.rc is defined else '')),
          'details': 'Must-gather result and archive path, sosreport result and archive path, and the diagnostics directory are printed in the concise execution evidence.',
          'remediation': 'For must-gather, verify oc authentication/RBAC, plugin image pull access, disk space, and the saved must-gather.log; Pass requires a successful command plus a non-empty archive that passes gzip and tar integrity checks. For sosreport, verify node debug access, access to registry.redhat.io/rhel9/support-tools (or a configured mirror), Podman run-label support, sufficient node/controller disk space, and the saved sosreport.log; Pass also requires host-root access and a copied, non-empty, valid sosreport archive.'
        }] }}"
  tags: ['general', 'telco', 'tc64', 'must_gather']

# TC 65: Snapshots
- name: "TC-65: Snapshots"
  when: run_tc65_volume_snapshots | default(true) | bool
  block:
    - name: "TC-65: Query VolumeSnapshotClasses"
      ansible.builtin.command: oc get volumesnapshotclasses -o json
      register: tc65_cmd
      changed_when: false
      failed_when: false

    - name: "TC-65: Record Result"
      vars:
        vsc_items: "{{ ((tc65_cmd.stdout | from_json)['items']) if tc65_cmd.rc == 0 else [] }}"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-65',
          'name': 'Snapshots',
          'category': 'General Support / Telco',
          'expected': 'VolumeSnapshotClass available for persistent volume snapshots',
          'status': ('Pass' if (tc65_cmd.rc == 0 and vsc_items | length > 0) else 'Fail'),
          'procedure': (tc65_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc65_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc65_cmd.stderr | default(''))) if (tc65_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc65_cmd.rc | string) if tc65_cmd.rc is defined else '')),
          'details': 'VolumeSnapshotClasses configured: ' ~ (vsc_items | length)
        }] }}"
  tags: ['general', 'telco', 'tc65', 'snapshots']

