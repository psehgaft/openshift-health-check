---
- name: Build OpenShift virtualization capability artifact facts
  vars:
    day2_openshift_virtualization_section_current: "{{ (day2_capability_sections_by_key | default({})).get('openshift_virtualization', {}) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: openshift_virtualization
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      openshift_virtualization_present: "{{ ((day2_posture_summary | default({})).get('openshift_virtualization_present', false)) | bool }}"
      openshift_virtualization_healthy: "{{ ((day2_posture_summary | default({})).get('openshift_virtualization_healthy', false)) | bool }}"
      status_summary: "{{ day2_openshift_virtualization_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_openshift_virtualization_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_openshift_virtualization_section: "{{ day2_openshift_virtualization_section_current }}"
    capability_artifact_collection_inputs:
      openshift_virtualization_present: "{{ ((day2_posture_summary | default({})).get('openshift_virtualization_present', false)) | bool }}"
      openshift_virtualization_healthy: "{{ ((day2_posture_summary | default({})).get('openshift_virtualization_healthy', false)) | bool }}"
