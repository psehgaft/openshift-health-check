---
- name: Resolve capability artifact resume decision
  ansible.builtin.set_fact:
    capability_artifact_resume_decision: "{{ ((report_resume_artifact_plan | default({})).get('capabilities', {})).get((capability_artifact_key_hint | default(role_name | regex_replace('^capability_', ''))), {'should_build': true, 'reusable': false}) }}"
  when: report_run_mode | default('fresh') == 'resume_last_failure'

- name: Build capability artifact facts from local builder task
  ansible.builtin.include_tasks: "{{ capability_artifact_builder_tasks_from }}"
  when: >
    (report_run_mode | default('fresh')) != 'resume_last_failure'
    or (capability_artifact_resume_decision.should_build | default(true) | bool)

- name: Persist capability artifact from immediate shared writer
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/report_common/tasks/persist_openshift_capability_artifact_immediate.yml"
  when: >
    (report_run_mode | default('fresh')) != 'resume_last_failure'
    or (capability_artifact_resume_decision.should_build | default(true) | bool)
