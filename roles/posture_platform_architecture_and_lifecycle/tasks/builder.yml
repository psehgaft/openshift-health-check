---
- name: Build platform architecture and lifecycle posture artifact facts
  ansible.builtin.set_fact:
    posture_artifact_key: platform_architecture_and_lifecycle
    posture_artifact_analysis_summary: "{{ architecture_lifecycle_summary | default({}) }}"
    posture_artifact_findings:
      reference_compliance: "{{ reference_compliance_findings | default(top_live_cluster_compare_findings | default([])) }}"
      managed_gate: "{{ managed_gate_findings | default(top_live_managed_gate_findings | default([])) }}"
      deprecated_crds: "{{ top_deprecated_crd_findings | default([]) }}"
      deprecated_api_lines: "{{ top_deprecated_api_lines | default([]) }}"
      upgrade_blockers: "{{ (upgrade_readiness_summary | default({})).get('blocker_findings', []) }}"
      upgrade_warnings: "{{ (upgrade_readiness_summary | default({})).get('warning_findings', []) }}"
    posture_artifact_render_inputs:
      upgrade_readiness_summary: "{{ upgrade_readiness_summary | default({}) }}"
      reference_compliance_summary: "{{ reference_compliance_summary | default({}) }}"
      reference_compliance_findings: "{{ reference_compliance_findings | default(top_live_cluster_compare_findings | default([])) }}"
      managed_gate_summary: "{{ managed_gate_summary | default({}) }}"
      managed_gate_findings: "{{ managed_gate_findings | default(top_live_managed_gate_findings | default([])) }}"
      topology_resilience: "{{ topology_resilience | default({}) }}"
      available_updates: "{{ available_updates | default([]) }}"
      conditional_updates: "{{ conditional_updates | default([]) }}"
      cluster_update_history: "{{ cluster_update_history | default([]) }}"
      deprecated_crd_findings: "{{ top_deprecated_crd_findings | default([]) }}"
      deprecated_api_lines: "{{ top_deprecated_api_lines | default([]) }}"
      cluster_compare_findings: "{{ top_live_cluster_compare_findings | default([]) }}"
      managed_gate_top_findings: "{{ top_live_managed_gate_findings | default([]) }}"
    posture_artifact_collection_inputs:
      upgrade_blocker_count: "{{ (upgrade_readiness_summary | default({})).get('blocker_count', 0) }}"
      upgrade_warning_count: "{{ (upgrade_readiness_summary | default({})).get('warning_count', 0) }}"
      conditional_update_count: "{{ (architecture_lifecycle_summary | default({})).get('conditional_update_count', 0) }}"
      topology_warning_count: "{{ (architecture_lifecycle_summary | default({})).get('topology_warning_count', 0) }}"
      deprecated_crd_count: "{{ (top_deprecated_crd_findings | default([])) | length }}"
      deprecated_api_count: "{{ (top_deprecated_api_lines | default([])) | length }}"
    posture_artifact_section_fields:
      summary: "{{ architecture_lifecycle_summary | default({}) }}"
      recommendations: "{{ (architecture_lifecycle_summary | default({})).get('recommendation', 'Review lifecycle support status, upgrade readiness, failure-domain spread, and network-boundary evidence before treating architecture posture as production-ready.') }}"
      upgrade_readiness_summary: "{{ upgrade_readiness_summary | default({}) }}"
      reference_compliance_summary: "{{ reference_compliance_summary | default({}) }}"
      reference_compliance_findings: "{{ reference_compliance_findings | default(top_live_cluster_compare_findings | default([])) }}"
      managed_gate_summary: "{{ managed_gate_summary | default({}) }}"
      managed_gate_findings: "{{ managed_gate_findings | default(top_live_managed_gate_findings | default([])) }}"
      topology_resilience: "{{ topology_resilience | default({}) }}"
      available_updates: "{{ available_updates | default([]) }}"
      conditional_updates: "{{ conditional_updates | default([]) }}"
      cluster_update_history: "{{ cluster_update_history | default([]) }}"
      deprecated_crd_findings: "{{ top_deprecated_crd_findings | default([]) }}"
      deprecated_api_lines: "{{ top_deprecated_api_lines | default([]) }}"
      cluster_compare_findings: "{{ top_live_cluster_compare_findings | default([]) }}"
      managed_gate_top_findings: "{{ top_live_managed_gate_findings | default([]) }}"
