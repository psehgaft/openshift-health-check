- name: Build observability forwarding evidence bundle
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_observability_forwarding_bundle.py"
    stdin: "{{ {
      'analysis_graph': (analysis_graph | default({})),
      'cluster_monitoring_config_parsed': (cluster_monitoring_config_parsed | default({})),
      'user_workload_monitoring_config_parsed': (user_workload_monitoring_config_parsed | default({})),
      'require_cluster_log_forwarder': (require_cluster_log_forwarder | bool),
      'require_external_metrics_remote_write': (require_external_metrics_remote_write | bool)
    } | to_json }}"
  register: observability_forwarding_bundle_cmd
  changed_when: false
  failed_when: false

- name: Normalize observability forwarding evidence bundle
  ansible.builtin.set_fact:
    observability_forwarding_bundle_data: "{{ observability_forwarding_bundle_cmd.stdout | from_json if (observability_forwarding_bundle_cmd.rc == 0 and (observability_forwarding_bundle_cmd.stdout | default('') | length > 0)) else {} }}"

- name: Apply observability forwarding evidence bundle
  ansible.builtin.set_fact:
    observability_vendor_telemetry_data: "{{ observability_forwarding_bundle_data.vendor | default({'vendor_managed_metrics_forwarding_present': false, 'vendor_managed_log_forwarding_present': false, 'metrics_vendor_names': [], 'log_vendor_names': []}) }}"
    observability_log_forwarding_data: "{{ observability_forwarding_bundle_data.log_forwarding | default({'findings': [], 'outputs': [], 'external_outputs': [], 'pipeline_counts': {'application': 0, 'infrastructure': 0, 'audit': 0}, 'external_pipeline_counts': {'application': 0, 'infrastructure': 0, 'audit': 0}}) }}"
    observability_metrics_forwarding_data: "{{ observability_forwarding_bundle_data.metrics_forwarding | default({'findings': [], 'cluster_external_count': 0, 'user_external_count': 0}) }}"
    observability_alert_delivery_data: "{{ observability_forwarding_bundle_data.alert_delivery | default({'findings': [], 'receivers': [], 'config_sources': [], 'alert_delivery_source_count': 0, 'external_alert_receiver_count': 0, 'external_alert_delivery_configured': false, 'alert_routing_to_external_receiver_configured': false, 'alertmanagerconfigs_with_external_routes': 0, 'alertmanagerconfigs_without_route_receivers': 0}) }}"

- name: Build observability findings and summary
  ansible.builtin.set_fact:
    observability_findings: "{{ (observability_log_forwarding_data.findings | default([])) + (observability_metrics_forwarding_data.findings | default([])) + (observability_alert_delivery_data.findings | default([])) + observability_platform_findings }}"
    observability_forwarding_summary: "{{ observability_forwarding_summary | combine(observability_forwarding_updates, recursive=True) }}"
  vars:
    observability_platform_findings: >-
      {{
        ([] +
        ([{'issue': 'monitoring-operator-not-healthy', 'detail': 'monitoring cluster operator is unavailable or degraded'}] if (clusteroperator_status_map.monitoring.available | default('Unknown')) != 'True' or (clusteroperator_status_map.monitoring.degraded | default('False')) == 'True' else []))
      }}
    observability_forwarding_updates:
      vendor_managed_log_forwarding_present: "{{ observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false) }}"
      vendor_managed_metrics_forwarding_present: "{{ observability_vendor_telemetry_data.vendor_managed_metrics_forwarding_present | default(false) }}"
      log_forwarding_vendor_names: "{{ observability_vendor_telemetry_data.log_vendor_names | default([]) }}"
      metrics_forwarding_vendor_names: "{{ observability_vendor_telemetry_data.metrics_vendor_names | default([]) }}"
      log_forwarding_outputs: "{{ observability_log_forwarding_data.outputs | default([]) }}"
      external_log_forwarding_outputs: "{{ observability_log_forwarding_data.external_outputs | default([]) }}"
      application_log_pipeline_count: "{{ (observability_log_forwarding_data.pipeline_counts | default({})).application | default(0) }}"
      infrastructure_log_pipeline_count: "{{ (observability_log_forwarding_data.pipeline_counts | default({})).infrastructure | default(0) }}"
      audit_log_pipeline_count: "{{ (observability_log_forwarding_data.pipeline_counts | default({})).audit | default(0) }}"
      application_logs_collected: "{{ ((((observability_log_forwarding_data.pipeline_counts | default({})).application | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      infrastructure_logs_collected: "{{ ((((observability_log_forwarding_data.pipeline_counts | default({})).infrastructure | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      audit_logs_collected: "{{ ((((observability_log_forwarding_data.pipeline_counts | default({})).audit | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      application_logs_exported_external: "{{ ((((observability_log_forwarding_data.external_pipeline_counts | default({})).application | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      infrastructure_logs_exported_external: "{{ ((((observability_log_forwarding_data.external_pipeline_counts | default({})).infrastructure | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      audit_logs_exported_external: "{{ ((((observability_log_forwarding_data.external_pipeline_counts | default({})).audit | default(0)) | int) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)) }}"
      application_logs_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((((observability_log_forwarding_data.external_pipeline_counts | default({})).application | default(0)) | int) > 0)
          else (
            'vendor-managed-not-verified'
            if (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false))
            else (
            'cluster-local-only'
            if ((((observability_log_forwarding_data.pipeline_counts | default({})).application | default(0)) | int) > 0)
            else 'not-collected'
            )
          )
        }}
      infrastructure_logs_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((((observability_log_forwarding_data.external_pipeline_counts | default({})).infrastructure | default(0)) | int) > 0)
          else (
            'vendor-managed-not-verified'
            if (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false))
            else (
            'cluster-local-only'
            if ((((observability_log_forwarding_data.pipeline_counts | default({})).infrastructure | default(0)) | int) > 0)
            else 'not-collected'
            )
          )
        }}
      audit_logs_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((((observability_log_forwarding_data.external_pipeline_counts | default({})).audit | default(0)) | int) > 0)
          else (
            'vendor-managed-not-verified'
            if (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false))
            else (
            'cluster-local-only'
            if ((((observability_log_forwarding_data.pipeline_counts | default({})).audit | default(0)) | int) > 0)
            else 'not-collected'
            )
          )
        }}
      logs_delivery_verification_status: >-
        {{
          'not-verified'
          if (((observability_log_forwarding_data.outputs | default([]) | length) > 0) or (observability_vendor_telemetry_data.vendor_managed_log_forwarding_present | default(false)))
          else 'not-configured'
        }}
      external_alert_receivers: "{{ observability_alert_delivery_data.receivers | default([]) }}"
      alert_delivery_config_sources: "{{ observability_alert_delivery_data.config_sources | default([]) }}"
      alert_delivery_source_count: "{{ observability_alert_delivery_data.alert_delivery_source_count | default(0) }}"
      external_alert_receiver_count: "{{ observability_alert_delivery_data.external_alert_receiver_count | default(0) }}"
      external_alert_delivery_configured: "{{ observability_alert_delivery_data.external_alert_delivery_configured | default(false) }}"
      alert_routing_to_external_receiver_configured: "{{ observability_alert_delivery_data.alert_routing_to_external_receiver_configured | default(false) }}"
      alertmanagerconfigs_with_external_routes: "{{ observability_alert_delivery_data.alertmanagerconfigs_with_external_routes | default(0) }}"
      alertmanagerconfigs_without_route_receivers: "{{ observability_alert_delivery_data.alertmanagerconfigs_without_route_receivers | default(0) }}"
      external_cluster_metrics_remote_write_count: "{{ observability_metrics_forwarding_data.cluster_external_count | default(0) }}"
      external_user_workload_metrics_remote_write_count: "{{ observability_metrics_forwarding_data.user_external_count | default(0) }}"
      alert_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if (
            (observability_alert_delivery_data.external_alert_receiver_count | default(0) | int) > 0
            and (observability_alert_delivery_data.alert_routing_to_external_receiver_configured | default(false))
          )
          else (
            'configuration-present-external-not-proven'
            if ((observability_alert_delivery_data.alert_delivery_source_count | default(0) | int) > 0)
            else 'not-configured'
          )
        }}
      alert_delivery_verification_status: >-
        {{
          'not-verified'
          if ((observability_alert_delivery_data.alert_delivery_source_count | default(0) | int) > 0)
          else 'not-configured'
        }}
      cluster_metrics_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((observability_metrics_forwarding_data.cluster_external_count | default(0) | int) > 0)
          else (
            'vendor-managed-not-verified'
            if (observability_vendor_telemetry_data.vendor_managed_metrics_forwarding_present | default(false))
            else (
            'cluster-local-only'
            if ((observability_forwarding_summary.cluster_metrics_remote_write_count | default(0) | int) > 0)
            else 'not-configured'
            )
          )
        }}
      user_workload_metrics_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((observability_metrics_forwarding_data.user_external_count | default(0) | int) > 0)
          else (
            'vendor-managed-not-verified'
            if (observability_vendor_telemetry_data.vendor_managed_metrics_forwarding_present | default(false))
            else (
            'cluster-local-only'
            if ((observability_forwarding_summary.user_workload_metrics_remote_write_count | default(0) | int) > 0)
            else 'not-configured'
            )
          )
        }}
      metrics_delivery_verification_status: >-
        {{
          'not-verified'
          if (
            (observability_forwarding_summary.cluster_metrics_remote_write_count | default(0) | int) > 0
            or (observability_forwarding_summary.user_workload_metrics_remote_write_count | default(0) | int) > 0
            or (observability_vendor_telemetry_data.vendor_managed_metrics_forwarding_present | default(false))
          )
          else 'not-configured'
        }}
