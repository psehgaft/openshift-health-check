---
- name: Restore compact OpenShift shared artifact facts for fresh live run
  ansible.builtin.set_fact:
    openshift_shared_artifacts: >-
      {{
        (openshift_shared_artifacts | default({}))
        | combine({
            'collection': {
              'kind': 'shared-collection',
              'status': 'collected',
              'collection_summary': (assessment_collection_summary | default({})),
              'collection_failures': (assessment_collection_failures | default([])),
              'collection_skipped_optional_commands': (assessment_collection_skipped_optional_commands | default([])),
              'cluster_profile': (cluster_profile | default({})),
              'evidence_summary': (evidence_summary | default({})),
              'live_support_data': (live_support_data | default({}))
            },
            'analysis_graph': {
              'kind': 'shared-analysis-graph',
              'status': 'analyzed',
              'analysis_graph_summary': (openshift_analysis_graph_summary | default({})),
              'cluster_profile': (cluster_profile | default({}))
            }
          }, recursive=True)
      }}
  when:
    - report_mode_resolved | default('live') == 'live'
    - report_run_mode | default('fresh') != 'resume_last_failure'

- name: Load OpenShift shared artifacts in bulk
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/load_openshift_shared_artifacts.py"
      - "{{ report_run_workspace_shared_dir }}"
  register: openshift_shared_artifacts_cmd
  changed_when: false
  when: >-
    not (
      report_mode_resolved | default('live') == 'live'
      and report_run_mode | default('fresh') != 'resume_last_failure'
    )

- name: Merge OpenShift shared artifacts and restore canonical facts
  vars:
    openshift_shared_artifacts_loaded: "{{ (openshift_shared_artifacts_cmd.stdout | from_json) if (openshift_shared_artifacts_cmd.stdout | default('') | length > 0) else {} }}"
    openshift_shared_artifacts_merged: "{{ (openshift_shared_artifacts | default({})) | combine(openshift_shared_artifacts_loaded, recursive=True) }}"
    openshift_shared_collection_artifact: "{{ openshift_shared_artifacts_merged.get('collection', {}) }}"
    openshift_shared_analysis_graph_artifact: "{{ openshift_shared_artifacts_merged.get('analysis_graph', {}) }}"
  ansible.builtin.set_fact:
    openshift_shared_artifacts: "{{ openshift_shared_artifacts_merged }}"
    collected_resource_graph: >-
      {{
        openshift_shared_collection_artifact.collected_resource_graph
        | default(collected_resource_graph | default({}))
      }}
    analysis_graph: >-
      {{
        openshift_shared_analysis_graph_artifact.analysis_graph
        | default(analysis_graph | default({}))
      }}
    cluster_profile: >-
      {{
        openshift_shared_analysis_graph_artifact.cluster_profile
        | default(
            openshift_shared_collection_artifact.cluster_profile
            | default(cluster_profile | default({}))
          )
      }}
    evidence_summary: >-
      {{
        openshift_shared_collection_artifact.evidence_summary
        | default(evidence_summary | default({}))
      }}
    assessment_collection_summary: >-
      {{
        openshift_shared_collection_artifact.collection_summary
        | default(assessment_collection_summary | default({}))
      }}
    assessment_collection_failures: >-
      {{
        openshift_shared_collection_artifact.collection_failures
        | default(assessment_collection_failures | default([]))
      }}
    assessment_collection_skipped_optional_commands: >-
      {{
        openshift_shared_collection_artifact.collection_skipped_optional_commands
        | default(assessment_collection_skipped_optional_commands | default([]))
      }}
    live_support_data: >-
      {{
        openshift_shared_collection_artifact.live_support_data
        | default(live_support_data | default({}))
      }}
  when:
    - openshift_shared_artifacts_cmd is defined
    - not (openshift_shared_artifacts_cmd.skipped | default(false))
    - (openshift_shared_artifacts_cmd.rc | default(1)) == 0
