---
- name: Generate a Kubernetes cluster health report
  hosts: local
  gather_facts: true
  vars:
    platform_family: kubernetes
    provider_family: generic
    cluster_profile_mode: production
    kube_cli: kubectl
    report_output_dir: "{{ playbook_dir }}/../reports"
    report_basename: "k8s-cluster-health"
    report_generate_html: true
    report_generate_pdf: true
    collection_parallelism: 8
    collection_command_timeout_seconds: 300
    keep_collection_artifacts: false
    warning_event_limit: 20
    top_restart_pod_limit: 15
    top_alert_group_limit: 15
    top_event_reason_limit: 15
    top_namespace_issue_limit: 15
    top_pvc_issue_limit: 20
    top_workload_issue_limit: 25
    top_security_issue_limit: 25
    top_certificate_issue_limit: 20
    top_deprecated_api_limit: 25
    platform_namespaces_regex: "^(default|openshift|openshift-.*|kube-system|kube-public|kube-node-lease|kube-.*|kubernetes-.*)$"
    user_namespaces_exclude_regex: "^(default|openshift|openshift-.*|kube-system|kube-public|kube-node-lease|kube-.*|kubernetes-.*)$"
    kubernetes_report_capability_profile:
      network_policy_baseline:
        required: true
        criticality: high
        expected_state: configured
        owner: security
        evidence_required: [kubectl-get]
        notes: "Production namespaces should have NetworkPolicy coverage unless the cluster has an approved alternate segmentation control."
      resource_quota_governance:
        required: true
        criticality: high
        expected_state: configured
        owner: platform
        evidence_required: [kubectl-get]
        notes: "User namespaces should have ResourceQuota coverage to prevent noisy-neighbor resource exhaustion."
      limit_range_defaults:
        required: true
        criticality: medium
        expected_state: configured
        owner: platform
        evidence_required: [kubectl-get]
        notes: "User namespaces should have LimitRange defaults so workloads have predictable resource boundaries."
      workload_resilience:
        required: true
        criticality: high
        expected_state: configured
        owner: app
        evidence_required: [kubectl-get]
        notes: "Production multi-replica workloads should use PodDisruptionBudgets and spread controls."
      resource_requests_limits:
        required: true
        criticality: high
        expected_state: configured
        owner: app
        evidence_required: [kubectl-get]
        notes: "Workloads should set resource requests and limits for scheduling accuracy, quota enforcement, and capacity planning."
      external_storage:
        required: true
        criticality: high
        expected_state: present
        owner: storage
        evidence_required: [kubectl-get]
        notes: "Production clusters normally need external persistent storage instead of only local, hostPath, or ephemeral storage."
      ingress_exposure:
        required: true
        criticality: medium
        expected_state: configured
        owner: network
        evidence_required: [kubectl-get]
        notes: "Ingress usage should be intentionally configured and reviewed for exposure, TLS, and ownership."
      tls_certificate_hygiene:
        required: true
        criticality: medium
        expected_state: configured
        owner: security
        evidence_required: [kubectl-get]
        notes: "TLS certificates exposed through Kubernetes secrets should be inventoried and reviewed for expiry."
      deprecated_api_review:
        required: true
        criticality: high
        expected_state: configured
        owner: platform
        evidence_required: [kubectl-get]
        notes: "Deprecated APIs and deprecated CRDs should be reviewed before upgrades."
      backup:
        required: true
        criticality: critical
        expected_state: healthy
        owner: operations
        evidence_required: [kubectl-get]
        notes: "Production clusters should have backup tooling plus evidence of successful backup and restore processes."
      external_logging:
        required: true
        criticality: high
        expected_state: configured
        owner: observability
        evidence_required: [kubectl-get]
        notes: "Cluster and application logs should have an intentional collection or forwarding path."
      external_monitoring:
        required: true
        criticality: high
        expected_state: configured
        owner: observability
        evidence_required: [kubectl-get, metrics]
        notes: "Production clusters should have monitoring and alerting coverage through in-cluster or external systems."
      user_workload_monitoring:
        required: true
        criticality: high
        expected_state: configured
        owner: observability
        evidence_required: [kubectl-get, metrics]
        notes: "Application teams should expose scrape configuration through ServiceMonitor, PodMonitor, or an approved equivalent."
      grafana_dashboards:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [kubectl-get]
        notes: "Require when the customer expects in-cluster Grafana dashboards for application or platform metrics."
      external_private_registry:
        required: false
        criticality: medium
        expected_state: configured
        owner: delivery
        evidence_required: [kubectl-get]
        notes: "Require when workloads are expected to pull application images from an external private registry."
      autoscaling:
        required: false
        criticality: medium
        expected_state: configured
        owner: platform
        evidence_required: [kubectl-get, metrics]
        notes: "Require this when workload or node autoscaling is part of the customer operating model."
      policy_engine:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [kubectl-get]
        notes: "Require this when Gatekeeper, Kyverno, or another admission-policy engine is part of the security baseline."
      secrets_management:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [kubectl-get]
        notes: "Require this when external secret synchronization or sealed-secret workflows are part of the customer baseline."
      workload_vulnerability_scanner:
        required: false
        criticality: high
        expected_state: present
        owner: security
        evidence_required: [kubectl-get]
        notes: "Require when workload image vulnerability scanning or secured-cluster scanner agents are part of the security baseline."
      cicd_runners:
        required: false
        criticality: medium
        expected_state: present
        owner: delivery
        evidence_required: [kubectl-get, metrics]
        notes: "Show when GitLab, Jenkins, GitHub Actions, Azure DevOps, or generic runner pods are detected or required."
      service_mesh:
        required: false
        criticality: low
        expected_state: present
        owner: network
        evidence_required: [kubectl-get]
        notes: "Require this only when service mesh is part of the application platform baseline."
      provider_node_pools:
        required: true
        criticality: medium
        expected_state: configured
        owner: platform
        evidence_required: [kubectl-get, provider-api]
        notes: "Managed or provider-backed clusters should expose enough node-pool, zone, and provider metadata for capacity and resilience review."
  tasks:
    - name: Run Kubernetes cluster health report scaffold
      block:
        - name: Run common preflight
          ansible.builtin.include_role:
            name: preflight_common

        - name: Run Kubernetes preflight
          ansible.builtin.include_role:
            name: preflight_kubernetes

        - name: Run common collection scaffold
          ansible.builtin.include_role:
            name: collect_common

        - name: Run Kubernetes collection extension
          ansible.builtin.include_role:
            name: collect_kubernetes

        - name: Run common analysis
          ansible.builtin.include_role:
            name: analyze_common

        - name: Run Kubernetes analysis extension
          ansible.builtin.include_role:
            name: analyze_kubernetes

        - name: Run common reporting scaffold
          ansible.builtin.include_role:
            name: report_common

      always:
        - name: Ensure temporary collection artifacts are removed
          ansible.builtin.file:
            path: "{{ collection_run_metadata.results_path | dirname }}"
            state: absent
          when:
            - not (keep_collection_artifacts | default(false) | bool)
            - collection_run_metadata is defined
            - collection_run_metadata.results_path | default('') | length > 0
          failed_when: false
