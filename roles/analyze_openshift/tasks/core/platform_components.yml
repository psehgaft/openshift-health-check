---
- name: Build platform component facts
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_platform_component_facts.py"
    stdin: "{{ {'analysis_graph': (analysis_graph | default({})), 'cluster_profile': (cluster_profile | default({}))} | to_json }}"
  register: platform_component_facts_cmd
  changed_when: false
  when: report_scope_requires_core_platform_component_analysis | default(true) | bool

- name: Normalize platform component facts
  vars:
    platform_component_facts: "{{ (platform_component_facts_cmd.stdout | from_json) if (platform_component_facts_cmd.stdout | default('') | length > 0) else {} }}"
  ansible.builtin.set_fact:
    cluster_update_history: "{{ platform_component_facts.cluster_update_history | default([]) }}"
    available_updates: "{{ platform_component_facts.available_updates | default([]) }}"
    conditional_updates: "{{ platform_component_facts.conditional_updates | default([]) }}"
    cv_available: "{{ platform_component_facts.cv_available | default('Unknown') }}"
    cv_progressing: "{{ platform_component_facts.cv_progressing | default('Unknown') }}"
    cv_failing: "{{ platform_component_facts.cv_failing | default('Unknown') }}"
    degraded_operators: "{{ platform_component_facts.degraded_operators | default([]) }}"
    unavailable_operators: "{{ platform_component_facts.unavailable_operators | default([]) }}"
    progressing_operators: "{{ platform_component_facts.progressing_operators | default([]) }}"
    clusteroperator_status_map: "{{ platform_component_facts.clusteroperator_status_map | default({}) }}"
    cluster_operator_version_mismatches: "{{ platform_component_facts.cluster_operator_version_mismatches | default([]) }}"
    ingresscontroller_summary: "{{ platform_component_facts.ingresscontroller_summary | default([]) }}"
    ingresscontroller_issues: "{{ platform_component_facts.ingresscontroller_issues | default([]) }}"
    infrastructure_component_summary: "{{ platform_component_facts.infrastructure_component_summary | default([]) }}"
    infrastructure_component_issues: "{{ platform_component_facts.infrastructure_component_issues | default([]) }}"
  when: report_scope_requires_core_platform_component_analysis | default(true) | bool
