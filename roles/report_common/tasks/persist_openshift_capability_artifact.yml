---
- name: Resolve requested OpenShift capability section
  vars:
    capability_artifact_section_current: >-
      {{
        (
          day2_capability_sections | default([])
          | selectattr('key', 'equalto', capability_artifact_key)
          | list
          | first
        ) | default({})
      }}
  ansible.builtin.set_fact:
    capability_artifact_section_resolved: "{{ capability_artifact_section_current }}"

- name: Ensure capability artifact workspace exists
  ansible.builtin.file:
    path: "{{ report_run_workspace_capabilities_dir }}"
    state: directory
    mode: "0755"

- name: Write OpenShift capability artifact
  vars:
    capability_artifact_dependency_keys_resolved: >-
      {{
        capability_artifact_dependency_keys
        if (capability_artifact_dependency_keys is defined)
        else ((report_scope_capability_dependency_map | default({})).get(capability_artifact_key, []))
      }}
    capability_artifact_shared_inputs_used_resolved: >-
      {%- set ns = namespace(inputs=[]) -%}
      {%- for tag in capability_artifact_dependency_keys_resolved -%}
        {%- for input_name in ((report_scope_tag_shared_inputs_map | default({})).get(tag, [])) -%}
          {%- if input_name not in ns.inputs -%}
            {%- set _ = ns.inputs.append(input_name) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ capability_artifact_shared_inputs_used if (capability_artifact_shared_inputs_used is defined) else ns.inputs }}
    capability_artifact_section_current: "{{ capability_artifact_section_resolved | default({}) }}"
  ansible.builtin.copy:
    dest: "{{ report_run_workspace_capabilities_dir }}/{{ capability_artifact_key }}.json"
    mode: "0644"
    content: >-
      {{
        {
          'schema_version': (report_artifact_schema_version | default('1')),
          'repo_contract_version': (report_repo_contract_version | default('openshift-artifact-workspace-v1')),
          'run_id': (report_run_id | default('')),
          'platform_family': (platform_family | default('openshift')),
          'report_mode': (report_mode_resolved | default('live')),
          'key': capability_artifact_key,
          'kind': 'capability',
          'requested_by_selector': ((report_requested_capabilities | default([])) | length > 0) and (capability_artifact_key in (report_requested_capabilities | default([]))),
          'dependency_keys': capability_artifact_dependency_keys_resolved,
          'shared_inputs_used': capability_artifact_shared_inputs_used_resolved,
          'upstream_shared_artifact_hashes': (report_current_shared_artifact_hashes | default({})),
          'section_scope': {
            'postures': (report_effective_selected_postures | default([])),
            'capabilities': (report_effective_selected_capabilities | default([]))
          },
          'enabled': (((cluster_health_profile | default({})).get('capabilities', {})).get(capability_artifact_key, {}).get('enabled', true)),
          'required': (((cluster_health_profile | default({})).get('capabilities', {})).get(capability_artifact_key, {}).get('required', false)),
          'generated_at': (report_generated_at | default(ansible_date_time.iso8601)),
          'status': 'render-ready',
          'errors': [],
          'analysis_summary': (
            {
              'assessment_state': ((day2_posture_summary | default({})).get('capability_assessment_state', 'unknown')),
              'status': (capability_artifact_section_current.status | default('UNKNOWN')),
              'accounting_state': (capability_artifact_section_current.accounting_state | default('unknown')),
              'finding_count': ((capability_artifact_section_current.finding_count | default(0)) | int),
              'check_count': ((capability_artifact_section_current.check_count | default(0)) | int),
              'top_detail': (capability_artifact_section_current.top_detail | default(''))
            }
            | combine((capability_artifact_analysis_summary | default({})), recursive=True)
          ),
          'findings': (capability_artifact_section_current.findings | default([])),
          'render_inputs': (
            (capability_artifact_render_inputs | default({}))
            | combine({'section': capability_artifact_section_current}, recursive=True)
          ),
          'section': capability_artifact_section_current,
          'collection_inputs': (capability_artifact_collection_inputs | default({}))
        }
        | to_nice_json
      }}

- name: Record completed OpenShift capability artifact
  ansible.builtin.set_fact:
    report_workspace_completed_artifacts: >-
      {{
        (
          report_workspace_completed_artifacts | default([])
        )
        + [
            'capabilities/' ~ capability_artifact_key ~ '.json'
          ]
      }}
    report_workspace_failed_artifacts: "{{ (report_workspace_failed_artifacts | default([])) | reject('equalto', 'capabilities/' ~ capability_artifact_key ~ '.json') | list }}"
