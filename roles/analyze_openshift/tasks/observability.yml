---
- name: Build warning event summaries
  ansible.builtin.set_fact:
    warning_event_reason_counts: "{{ warning_event_reason_counts | default({}) | combine({event_reason: ((warning_event_reason_counts[event_reason] | default(0)) + 1)}, recursive=True) }}"
  loop: "{{ (warning_events | default({})).get('items', []) }}"
  vars:
    event_reason: "{{ item.reason | default('Unknown') }}"
  changed_when: false

- name: Parse monitoring config YAML
  ansible.builtin.set_fact:
    cluster_monitoring_config_parsed: "{{ ((cluster_monitoring_config.data['config.yaml'] | default('')) | from_yaml) if (cluster_monitoring_config.data is defined and cluster_monitoring_config.data['config.yaml'] is defined) else {} }}"
    user_workload_monitoring_config_parsed: "{{ ((user_workload_monitoring_config.data['config.yaml'] | default('')) | from_yaml) if (user_workload_monitoring_config.data is defined and user_workload_monitoring_config.data['config.yaml'] is defined) else {} }}"

- name: Attempt to discover thanos querier route
  ansible.builtin.command: oc -n openshift-monitoring get route thanos-querier -o jsonpath={.spec.host}
  register: thanos_route_cmd
  changed_when: false
  failed_when: false

- name: Capture bearer token
  ansible.builtin.command: oc whoami -t
  register: oc_token_cmd
  changed_when: false
  failed_when: false

- name: Attempt API server readyz check
  ansible.builtin.command: oc get --raw=/readyz?verbose
  register: apiserver_readyz_cmd
  changed_when: false
  failed_when: false

- name: Build observability forwarding summary
  ansible.builtin.set_fact:
    observability_forwarding_summary:
      monitoring_operator_available: "{{ clusteroperator_status_map.monitoring.available | default('Unknown') }}"
      monitoring_operator_degraded: "{{ clusteroperator_status_map.monitoring.degraded | default('Unknown') }}"
      thanos_querier_route_found: false
      cluster_log_forwarder_count: "{{ (clusterlogforwarders | default({})).get('items', []) | length }}"
      log_forwarding_outputs: []
      external_log_forwarding_outputs: []
      cluster_metrics_remote_write_count: "{{ (((cluster_monitoring_config_parsed.prometheusK8s | default({})).remoteWrite | default([])) | length) }}"
      user_workload_metrics_remote_write_count: "{{ (((user_workload_monitoring_config_parsed.prometheus | default({})).remoteWrite | default([])) | length) }}"
      external_cluster_metrics_remote_write_count: 0
      external_user_workload_metrics_remote_write_count: 0

- name: Update thanos route capability in observability summary
  ansible.builtin.set_fact:
    observability_forwarding_summary: "{{ observability_forwarding_summary | combine({'thanos_querier_route_found': (thanos_route_cmd.rc == 0 and (thanos_route_cmd.stdout | default('') | trim | length > 0))}, recursive=True) }}"

- name: Build log forwarding findings
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json

    data = json.loads(r'''{{ {
      "items": (clusterlogforwarders | default({})).get('items', [])
    } | to_json }}''')

    findings = []
    outputs = []
    external_outputs = []

    def is_external_url(url):
        if not url:
            return False
        s = str(url).lower()
        return not (".svc" in s or ".cluster.local" in s or s.startswith("http://localhost") or s.startswith("https://localhost"))

    def output_is_external(output):
        otype = str(output.get("type", "")).lower()
        url = output.get("url") or output.get("endpoint") or output.get("host") or ""
        if is_external_url(url):
            return True
        if otype in {"cloudwatch", "azuremonitor", "googlecloudlogging"}:
            return True
        return False

    for clf in data["items"]:
        ns = clf.get("metadata", {}).get("namespace", "")
        name = clf.get("metadata", {}).get("name", "")
        spec = clf.get("spec", {}) or {}
        pipelines = spec.get("pipelines", []) or []
        output_refs = set()
        for pipeline in pipelines:
            for ref in pipeline.get("outputRefs", []) or []:
                output_refs.add(ref)
        current_outputs = spec.get("outputs", []) or []
        if not current_outputs:
            findings.append({
                "issue": "clusterlogforwarder-without-outputs",
                "detail": f"{ns}/{name} has no outputs"
            })
        for output in current_outputs:
            output_name = output.get("name", "")
            record = {
                "namespace": ns,
                "clusterlogforwarder": name,
                "name": output_name,
                "type": output.get("type", "unknown"),
                "target": output.get("url") or output.get("endpoint") or output.get("host") or ""
            }
            outputs.append(record)
            if output_is_external(output):
                external_outputs.append(record)
        if current_outputs and not any(output_is_external(o) for o in current_outputs):
            findings.append({
                "issue": "logs-not-forwarded-to-external-destination",
                "detail": f"{ns}/{name} outputs appear cluster-local only"
            })
        if pipelines and not output_refs:
            findings.append({
                "issue": "clusterlogforwarder-pipelines-without-outputrefs",
                "detail": f"{ns}/{name} has pipelines with no outputRefs"
            })

    if not data["items"] and {{ require_cluster_log_forwarder | bool | to_json }}:
        findings.append({
            "issue": "missing-clusterlogforwarder",
            "detail": "no ClusterLogForwarder resource found"
        })

    print(json.dumps({
        "findings": findings,
        "outputs": outputs,
        "external_outputs": external_outputs
    }))
    PY
  register: observability_log_forwarding_cmd
  changed_when: false
  failed_when: false

- name: Normalize log forwarding findings
  ansible.builtin.set_fact:
    observability_log_forwarding_data: "{{ observability_log_forwarding_cmd.stdout | from_json if (observability_log_forwarding_cmd.rc == 0 and (observability_log_forwarding_cmd.stdout | default('') | length > 0)) else {'findings': [], 'outputs': [], 'external_outputs': []} }}"

- name: Build metrics forwarding findings
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json

    data = json.loads(r'''{{ {
      "cluster_remote_write": ((cluster_monitoring_config_parsed.prometheusK8s | default({})).remoteWrite | default([])),
      "user_remote_write": ((user_workload_monitoring_config_parsed.prometheus | default({})).remoteWrite | default([]))
    } | to_json }}''')

    findings = []

    def is_external_url(url):
        if not url:
            return False
        s = str(url).lower()
        return not (".svc" in s or ".cluster.local" in s or s.startswith("http://localhost") or s.startswith("https://localhost"))

    cluster_external = [item for item in data["cluster_remote_write"] if is_external_url(item.get("url", ""))]
    user_external = [item for item in data["user_remote_write"] if is_external_url(item.get("url", ""))]

    if {{ require_external_metrics_remote_write | bool | to_json }}:
        if not data["cluster_remote_write"]:
            findings.append({
                "issue": "cluster-metrics-remote-write-missing",
                "detail": "cluster-monitoring-config has no prometheusK8s.remoteWrite target"
            })
        elif not cluster_external:
            findings.append({
                "issue": "cluster-metrics-not-forwarded-external",
                "detail": "prometheusK8s.remoteWrite targets appear cluster-local only"
            })

        if not data["user_remote_write"]:
            findings.append({
                "issue": "user-workload-metrics-remote-write-missing",
                "detail": "user-workload-monitoring-config has no prometheus.remoteWrite target"
            })
        elif not user_external:
            findings.append({
                "issue": "user-workload-metrics-not-forwarded-external",
                "detail": "user workload remoteWrite targets appear cluster-local only"
            })

    print(json.dumps({
        "findings": findings,
        "cluster_external_count": len(cluster_external),
        "user_external_count": len(user_external)
    }))
    PY
  register: observability_metrics_forwarding_cmd
  changed_when: false
  failed_when: false

- name: Normalize metrics forwarding findings
  ansible.builtin.set_fact:
    observability_metrics_forwarding_data: "{{ observability_metrics_forwarding_cmd.stdout | from_json if (observability_metrics_forwarding_cmd.rc == 0 and (observability_metrics_forwarding_cmd.stdout | default('') | length > 0)) else {'findings': [], 'cluster_external_count': 0, 'user_external_count': 0} }}"

- name: Build observability findings and summary
  ansible.builtin.set_fact:
    observability_findings: "{{ (observability_log_forwarding_data.findings | default([])) + (observability_metrics_forwarding_data.findings | default([])) + observability_platform_findings }}"
    observability_forwarding_summary: "{{ observability_forwarding_summary | combine(observability_forwarding_updates, recursive=True) }}"
  vars:
    observability_platform_findings: >-
      {{
        ([] +
        ([{'issue': 'monitoring-operator-not-healthy', 'detail': 'monitoring cluster operator is unavailable or degraded'}] if (clusteroperator_status_map.monitoring.available | default('Unknown')) != 'True' or (clusteroperator_status_map.monitoring.degraded | default('False')) == 'True' else []) +
        ([{'issue': 'thanos-querier-route-unavailable', 'detail': 'thanos-querier route could not be discovered'}] if not (thanos_route_cmd.rc == 0 and (thanos_route_cmd.stdout | default('') | trim | length > 0)) else []))
      }}
    observability_forwarding_updates:
      log_forwarding_outputs: "{{ observability_log_forwarding_data.outputs | default([]) }}"
      external_log_forwarding_outputs: "{{ observability_log_forwarding_data.external_outputs | default([]) }}"
      external_cluster_metrics_remote_write_count: "{{ observability_metrics_forwarding_data.cluster_external_count | default(0) }}"
      external_user_workload_metrics_remote_write_count: "{{ observability_metrics_forwarding_data.user_external_count | default(0) }}"

- name: Normalize warning event timestamps
  ansible.builtin.set_fact:
    warning_event_items_unsorted: "{{ warning_event_items_unsorted | default([]) + [item | combine({'_sort_timestamp': ((item.lastTimestamp | default(item.eventTime | default(item.metadata.creationTimestamp | default('')))) | string)})] }}"
  loop: "{{ (warning_events | default({})).get('items', []) }}"
  changed_when: false

- name: Sort warning events
  ansible.builtin.set_fact:
    warning_event_items: "{{ (warning_event_items_unsorted | default([])) | sort(attribute='_sort_timestamp', reverse=true) | map('combine', {}) | list }}"
    recent_warning_events: "{{ ((warning_event_items_unsorted | default([])) | sort(attribute='_sort_timestamp', reverse=true) | map('combine', {}) | list)[:warning_event_limit] }}"

- name: Mark Prometheus capability
  ansible.builtin.set_fact:
    prom_available: "{{ (thanos_route_cmd.rc == 0 and oc_token_cmd.rc == 0 and (thanos_route_cmd.stdout | trim | length > 0)) | bool }}"
    prom_base_url: "https://{{ thanos_route_cmd.stdout | trim }}"

- name: Query Prometheus signals
  ansible.builtin.uri:
    url: "{{ prom_base_url }}/api/v1/query"
    method: POST
    validate_certs: false
    headers:
      Authorization: "Bearer {{ oc_token_cmd.stdout | trim }}"
    body_format: form-urlencoded
    body:
      query: "{{ item.query }}"
    return_content: true
  register: prom_query_results
  failed_when: false
  when: prom_available | bool
  loop:
    - { name: "firing_alerts", query: "{{ prom_queries.firing_alerts }}" }
    - { name: "etcd_wal_fsync", query: "{{ prom_queries.etcd_wal_fsync_p99_ms }}" }
    - { name: "etcd_backend_commit", query: "{{ prom_queries.etcd_backend_commit_p99_ms }}" }
    - { name: "etcd_leader_changes", query: "{{ prom_queries.etcd_leader_changes_5m }}" }
    - { name: "etcd_peer_rtt", query: "{{ prom_queries.etcd_peer_rtt_p99_ms }}" }
    - { name: "apiserver_latency", query: "{{ prom_queries.apiserver_request_p99_seconds }}" }
    - { name: "apiserver_5xx_rate", query: "{{ prom_queries.apiserver_request_5xx_rate }}" }
    - { name: "node_cpu_utilization", query: "{{ prom_queries.node_cpu_utilization }}" }
    - { name: "node_memory_utilization", query: "{{ prom_queries.node_memory_utilization }}" }
    - { name: "node_disk_utilization", query: "{{ prom_queries.node_disk_utilization }}" }
    - { name: "kubelet_pod_density", query: "{{ prom_queries.kubelet_pod_density }}" }
    - { name: "top_pod_cpu_usage", query: "{{ prom_queries.top_pod_cpu_usage }}" }
    - { name: "top_pod_memory_usage", query: "{{ prom_queries.top_pod_memory_usage }}" }
    - { name: "pod_cpu_usage_all", query: "{{ prom_queries.pod_cpu_usage_all }}" }
    - { name: "pod_memory_usage_all", query: "{{ prom_queries.pod_memory_usage_all }}" }

- name: Normalize Prometheus payloads
  ansible.builtin.set_fact:
    prom_result_map: "{{ prom_result_map | default({}) | combine({item.item.name: (item.json.data.result | default([]))}, recursive=True) }}"
  loop: "{{ prom_query_results.results | default([]) }}"
  when: item.status | default(0) == 200
  changed_when: false

- name: Extract Prometheus summaries
  ansible.builtin.set_fact:
    firing_alerts: "{{ prom_result_map.firing_alerts | default([]) }}"
    etcd_wal_fsync_p99_ms: "{{ (prom_result_map.etcd_wal_fsync[0].value[1]) if (prom_result_map.etcd_wal_fsync | default([]) | length > 0) else '' }}"
    etcd_backend_commit_p99_ms: "{{ (prom_result_map.etcd_backend_commit[0].value[1]) if (prom_result_map.etcd_backend_commit | default([]) | length > 0) else '' }}"
    etcd_leader_changes_5m: "{{ (prom_result_map.etcd_leader_changes[0].value[1]) if (prom_result_map.etcd_leader_changes | default([]) | length > 0) else '' }}"
    etcd_peer_rtt_p99_ms: "{{ (prom_result_map.etcd_peer_rtt[0].value[1]) if (prom_result_map.etcd_peer_rtt | default([]) | length > 0) else '' }}"
    apiserver_request_p99_seconds: "{{ (prom_result_map.apiserver_latency[0].value[1]) if (prom_result_map.apiserver_latency | default([]) | length > 0) else '' }}"
    apiserver_request_5xx_rate: "{{ (prom_result_map.apiserver_5xx_rate[0].value[1]) if (prom_result_map.apiserver_5xx_rate | default([]) | length > 0) else '' }}"
    apiserver_readyz_status: "{{ 'ok' if (apiserver_readyz_cmd.rc | default(1)) == 0 else ('failed' if (apiserver_readyz_cmd.stdout | default('') | trim | length > 0 or apiserver_readyz_cmd.stderr | default('') | trim | length > 0) else 'unavailable') }}"
    apiserver_readyz_failed_checks: "{{ ((apiserver_readyz_cmd.stdout | default('')) ~ '\n' ~ (apiserver_readyz_cmd.stderr | default(''))) | regex_findall('(?im)\\bfailed\\b') | length }}"
    node_cpu_utilization_results: "{{ prom_result_map.node_cpu_utilization | default([]) }}"
    node_memory_utilization_results: "{{ prom_result_map.node_memory_utilization | default([]) }}"
    node_disk_utilization_results: "{{ prom_result_map.node_disk_utilization | default([]) }}"
    kubelet_pod_density_results: "{{ prom_result_map.kubelet_pod_density | default([]) }}"
    top_pod_cpu_usage_summary: "{{ prom_result_map.top_pod_cpu_usage | default([]) }}"
    top_pod_memory_usage_summary: "{{ prom_result_map.top_pod_memory_usage | default([]) }}"
    pod_cpu_usage_all_results: "{{ prom_result_map.pod_cpu_usage_all | default([]) }}"
    pod_memory_usage_all_results: "{{ prom_result_map.pod_memory_usage_all | default([]) }}"

- name: Build Prometheus alert summaries
  ansible.builtin.set_fact:
    firing_alerts_by_severity: "{{ firing_alerts_by_severity | default({}) | combine({severity: ((((firing_alerts_by_severity | default({}))[severity] | default(0)) + 1))}, recursive=True) }}"
    firing_alert_name_counts: "{{ firing_alert_name_counts | default({}) | combine({alert_name: ((((firing_alert_name_counts | default({}))[alert_name] | default(0)) + 1))}, recursive=True) }}"
    firing_alert_namespace_counts: "{{ firing_alert_namespace_counts | default({}) | combine({alert_namespace: ((((firing_alert_namespace_counts | default({}))[alert_namespace] | default(0)) + 1))}, recursive=True) }}"
  loop: "{{ firing_alerts | default([]) }}"
  vars:
    severity: "{{ item.metric.severity | default('unknown') }}"
    alert_name: "{{ item.metric.alertname | default('unknown') }}"
    alert_namespace: "{{ item.metric.namespace | default('cluster') }}"
  changed_when: false

- name: Build utilization summaries
  ansible.builtin.set_fact:
    low_cpu_nodes: "{{ low_cpu_nodes | default([]) + ([{'instance': item.metric.instance | default('unknown'), 'value': (cpu_value | float)}] if (cpu_value | float) < 20 else []) }}"
    high_cpu_nodes: "{{ high_cpu_nodes | default([]) + ([{'instance': item.metric.instance | default('unknown'), 'value': (cpu_value | float)}] if (cpu_value | float) > 85 else []) }}"
  loop: "{{ node_cpu_utilization_results | default([]) }}"
  vars:
    cpu_value: "{{ (item.value[1] | float | round(1)) }}"
  changed_when: false

- name: Build memory summaries
  ansible.builtin.set_fact:
    low_memory_nodes: "{{ low_memory_nodes | default([]) + ([{'instance': item.metric.instance | default('unknown'), 'value': (mem_value | float)}] if (mem_value | float) < 30 else []) }}"
    high_memory_nodes: "{{ high_memory_nodes | default([]) + ([{'instance': item.metric.instance | default('unknown'), 'value': (mem_value | float)}] if (mem_value | float) > 85 else []) }}"
  loop: "{{ node_memory_utilization_results | default([]) }}"
  vars:
    mem_value: "{{ (item.value[1] | float | round(1)) }}"
  changed_when: false

- name: Build pod density summaries
  ansible.builtin.set_fact:
    high_pod_density_nodes: "{{ high_pod_density_nodes | default([]) + ([{'node': item.metric.node | default('unknown'), 'value': (density_value | float)}] if (density_value | float) > (pod_density_warn_pct | float) else []) }}"
    critical_pod_density_nodes: "{{ critical_pod_density_nodes | default([]) + ([{'node': item.metric.node | default('unknown'), 'value': (density_value | float)}] if (density_value | float) > (pod_density_critical_pct | float) else []) }}"
  loop: "{{ kubelet_pod_density_results | default([]) }}"
  vars:
    density_value: "{{ (item.value[1] | float | round(1)) }}"
  changed_when: false

- name: Build certificate expiry severity buckets
  ansible.builtin.set_fact:
    expiring_certificates_warning: "{{ expiring_certificates_warning | default([]) + ([item | combine({'days_remaining': (expiry_days | float)})] if (expiry_days | float) <= (certificate_expiry_warn_days | float) else []) }}"
    expiring_certificates_critical: "{{ expiring_certificates_critical | default([]) + ([item | combine({'days_remaining': (expiry_days | float)})] if (expiry_days | float) <= (certificate_expiry_critical_days | float) else []) }}"
  loop: "{{ certificate_expiry_findings | default([]) }}"
  vars:
    expiry_days: "{{ (((item.not_after | to_datetime('%b %d %H:%M:%S %Y %Z')) - (report_generated_at | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).total_seconds() / 86400) | round(1) }}"
  changed_when: false

- name: Build overprovisioned pod findings from Prometheus usage
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import math

    data = json.loads(r'''{{ {
      "pods": (pods | default({})).get('items', []),
      "cpu_usage": pod_cpu_usage_all_results | default([]),
      "memory_usage": pod_memory_usage_all_results | default([]),
      "exclude_regex": user_namespaces_exclude_regex
    } | to_json }}''')

    def parse_cpu(value):
        if not value:
            return 0.0
        s = str(value)
        if s.endswith("m"):
            return float(s[:-1])
        try:
            return float(s) * 1000.0
        except Exception:
            return 0.0

    def parse_mem(value):
        if not value:
            return 0.0
        s = str(value)
        table = {
            "Ki": 1024, "Mi": 1024**2, "Gi": 1024**3, "Ti": 1024**4,
            "Pi": 1024**5, "Ei": 1024**6, "K": 1000, "M": 1000**2,
            "G": 1000**3, "T": 1000**4, "P": 1000**5, "E": 1000**6,
        }
        for suf, mult in table.items():
            if s.endswith(suf):
                try:
                    return float(s[:-len(suf)]) * mult
                except Exception:
                    return 0.0
        try:
            return float(s)
        except Exception:
            return 0.0

    cpu_usage = {}
    for item in data["cpu_usage"]:
        key = f'{item.get("metric", {}).get("namespace","")}/{item.get("metric", {}).get("pod","")}'
        try:
            cpu_usage[key] = float(item["value"][1]) * 1000.0
        except Exception:
            cpu_usage[key] = 0.0

    mem_usage = {}
    for item in data["memory_usage"]:
        key = f'{item.get("metric", {}).get("namespace","")}/{item.get("metric", {}).get("pod","")}'
        try:
            mem_usage[key] = float(item["value"][1])
        except Exception:
            mem_usage[key] = 0.0

    findings = []
    import re
    exclude_re = re.compile(data["exclude_regex"])
    for pod in data["pods"]:
        ns = pod.get("metadata", {}).get("namespace", "")
        if exclude_re.match(ns):
            continue
        if pod.get("status", {}).get("phase") != "Running":
            continue
        key = f'{ns}/{pod.get("metadata", {}).get("name","")}'
        containers = pod.get("spec", {}).get("containers", []) or []
        cpu_req = sum(parse_cpu((c.get("resources", {}).get("requests", {}) or {}).get("cpu")) for c in containers)
        mem_req = sum(parse_mem((c.get("resources", {}).get("requests", {}) or {}).get("memory")) for c in containers)
        cpu_use = cpu_usage.get(key, 0.0)
        mem_use = mem_usage.get(key, 0.0)
        cpu_ratio = (cpu_use / cpu_req) if cpu_req > 0 else None
        mem_ratio = (mem_use / mem_req) if mem_req > 0 else None

        reasons = []
        if cpu_req >= 200 and cpu_ratio is not None and cpu_ratio < 0.20:
            reasons.append(("cpu", round(cpu_ratio, 3)))
        if mem_req >= 512 * 1024 * 1024 and mem_ratio is not None and mem_ratio < 0.30:
            reasons.append(("memory", round(mem_ratio, 3)))
        if reasons:
            findings.append({
                "namespace": ns,
                "pod": pod.get("metadata", {}).get("name", ""),
                "cpu_request_millicores": round(cpu_req, 1),
                "cpu_usage_millicores": round(cpu_use, 1),
                "memory_request_mib": round(mem_req / 1048576, 1),
                "memory_usage_mib": round(mem_use / 1048576, 1),
                "reasons": reasons,
            })

    findings.sort(key=lambda x: (
        min([r[1] for r in x["reasons"]]) if x["reasons"] else 1.0,
        -(x["cpu_request_millicores"] + x["memory_request_mib"])
    ))
    print(json.dumps(findings[:50]))
    PY
  register: overprovisioned_pods_cmd
  changed_when: false
  failed_when: false
  when: prom_available | bool

- name: Normalize overprovisioned pod findings
  ansible.builtin.set_fact:
    overprovisioned_pods: "{{ overprovisioned_pods_cmd.stdout | from_json if (overprovisioned_pods_cmd is defined and overprovisioned_pods_cmd.rc == 0 and (overprovisioned_pods_cmd.stdout | default('') | length > 0)) else [] }}"

- name: Build quota pressure findings
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json

    quotas = json.loads(r'''{{ (resourcequotas | default({})).get('items', []) | to_json }}''')

    def parse_qty(val):
        if val is None:
            return None
        s = str(val)
        units = {
            "Ki": 1024, "Mi": 1024**2, "Gi": 1024**3, "Ti": 1024**4,
            "Pi": 1024**5, "Ei": 1024**6, "K": 1000, "M": 1000**2,
            "G": 1000**3, "T": 1000**4, "P": 1000**5, "E": 1000**6,
        }
        if s.endswith("m"):
            try:
                return float(s[:-1]) / 1000.0
            except Exception:
                return None
        for suf, mult in units.items():
            if s.endswith(suf):
                try:
                    return float(s[:-len(suf)]) * mult
                except Exception:
                    return None
        try:
            return float(s)
        except Exception:
            return None

    findings = []
    interesting = {
        "pods", "persistentvolumeclaims", "requests.cpu", "requests.memory",
        "limits.cpu", "limits.memory", "requests.storage"
    }
    for quota in quotas:
        ns = quota.get("metadata", {}).get("namespace", "")
        qn = quota.get("metadata", {}).get("name", "")
        hard = (quota.get("status", {}) or {}).get("hard", {}) or {}
        used = (quota.get("status", {}) or {}).get("used", {}) or {}
        for key, hard_val in hard.items():
            if key not in interesting:
                continue
            used_val = used.get(key)
            h = parse_qty(hard_val)
            u = parse_qty(used_val)
            if h and h > 0 and u is not None:
                pct = round((u / h) * 100, 1)
                if pct >= 80:
                    findings.append({
                        "namespace": ns,
                        "quota": qn,
                        "resource": key,
                        "used": str(used_val),
                        "hard": str(hard_val),
                        "pct": pct,
                    })
    findings.sort(key=lambda x: (-x["pct"], x["namespace"], x["resource"]))
    print(json.dumps(findings[:50]))
    PY
  register: quota_pressure_cmd
  changed_when: false
  failed_when: false

- name: Normalize quota pressure findings
  ansible.builtin.set_fact:
    quota_pressure_findings: "{{ quota_pressure_cmd.stdout | from_json if (quota_pressure_cmd.rc == 0 and (quota_pressure_cmd.stdout | default('') | length > 0)) else [] }}"
