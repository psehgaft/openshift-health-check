- name: Build shared OpenShift domain payload for collected-state reporting
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/build_collected_openshift_domain_payload_fast.py"
    stdin: >-
      {{
        {
          'postures_dir': report_run_workspace_postures_dir,
          'buildconfig_strategy_counts': (buildconfig_strategy_counts | default({})),
          'pipelinerun_status_counts': (pipelinerun_status_counts | default({})),
          'top_failed_pipelineruns': (top_failed_pipelineruns | default([])),
          'top_buildconfigs_without_triggers': (top_buildconfigs_without_triggers | default([])),
          'buildconfigs_without_triggers': (buildconfigs_without_triggers | default([])),
          'failed_pipelineruns': (failed_pipelineruns | default([]))
        } | to_json
      }}
  register: collected_openshift_domain_payload_cmd
  changed_when: false
  when: report_mode_resolved | default('live') == 'collected'

- name: Normalize shared OpenShift domain payload for collected-state reporting
  ansible.builtin.set_fact:
    openshift_report_domain_payload: "{{ (collected_openshift_domain_payload_cmd.stdout | from_json) if (collected_openshift_domain_payload_cmd.stdout | default('') | length > 0) else {} }}"
  when: report_mode_resolved | default('live') == 'collected'

