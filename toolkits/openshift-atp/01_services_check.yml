# TC 17: Check Cluster logs via API
- name: "TC-17: Check Cluster logs via API"
  when: run_tc17_check_cluster_logs_api | default(true) | bool
  block:
    - name: "TC-17: Fetch API server and control-plane logs through the API"
      ansible.builtin.shell: |
        set -euo pipefail
        for component in \
          "openshift-kube-apiserver kube-apiserver" \
          "openshift-kube-controller-manager kube-controller-manager" \
          "openshift-kube-scheduler openshift-kube-scheduler"; do
          read -r namespace pod_prefix <<< "$component"
          pod="$(oc get pods -n "$namespace" --field-selector=status.phase=Running \
            -o custom-columns=NAME:.metadata.name --no-headers \
            | awk -v prefix="$pod_prefix" 'index($1, prefix) == 1 { print $1; exit }')"
          if [[ -z "$pod" ]]; then
            echo "No running $pod_prefix control-plane pod found in $namespace" >&2
            exit 1
          fi
          echo "===== $namespace/$pod ====="
          oc logs -n "$namespace" "$pod" --all-containers=true --since=1h --tail=20
        done
      args:
        executable: /bin/bash
      register: tc17_cmd
      changed_when: false
      failed_when: false

    - name: "TC-17: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-17',
          'name': 'Check Cluster logs via API',
          'category': 'Services Check',
          'expected': 'Logs from the last hour are retrievable through the Kubernetes API for the API server, controller manager, and scheduler',
          'status': ('Pass' if tc17_cmd.rc == 0 else 'Fail'),
          'procedure': (tc17_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc17_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc17_cmd.stderr | default(''))) if (tc17_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc17_cmd.rc | string) if tc17_cmd.rc is defined else '')),
          'details': tc17_cmd.stdout | default(tc17_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc17', 'logs_api']

# TC 18: Check Internal Registry API
- name: "TC-18: Check Internal Registry API"
  when: run_tc18_check_internal_registry_api | default(true) | bool
  block:
    - name: "TC-18: Discover configured external registry"
      ansible.builtin.include_tasks: registry_discovery.yml

    - name: "TC-18: Check internal registry service through the API"
      ansible.builtin.shell: |
        set -euo pipefail
        if oc get svc image-registry -n openshift-image-registry -o name >/dev/null 2>&1; then
          echo "Selected registry: internal OpenShift image registry"
          oc get svc image-registry -n openshift-image-registry -o jsonpath='{.metadata.name}.{.metadata.namespace}.svc{"\\n"}'
          oc get svc image-registry -n openshift-image-registry -o wide
        else
          echo "Internal image-registry service is not configured."
          exit 2
        fi
      args:
        executable: /bin/bash
      register: tc18_cmd
      changed_when: false
      failed_when: false

    - name: "TC-18: Probe optional external registry API"
      ansible.builtin.include_tasks: external_registry_probe.yml

    - name: "TC-18: Classify registry API checks"
      ansible.builtin.set_fact:
        tc18_status: "{{ 'Skipped' if tc18_cmd.rc == 2 and atp_external_registry_effective_url | length == 0 else 'Pass' if (tc18_cmd.rc == 0 or (atp_external_registry_probe_ok | bool)) and (atp_external_registry_effective_url | length == 0 or (atp_external_registry_probe_ok | bool)) else 'Fail' }}"

    - name: "TC-18: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-18',
          'name': 'Check Configured Registry API',
          'category': 'Services Check',
          'expected': 'The internal registry service is available through the API, and the configured external registry API is reachable and authenticates when robot credentials are supplied',
          'status': tc18_status | trim,
          'procedure': 'Query the internal registry service and, when configured or discovered, request the external registry OCI v2 API endpoint',
          'evidence': ((tc18_cmd.stdout | default('')) ~ (('\\nSTDERR:\\n' ~ (tc18_cmd.stderr | default(''))) if (tc18_cmd.stderr | default('') | length > 0) else '') ~ ('\\nExternal registry discovery: ' ~ atp_external_registry_discovery_source) ~ ('\\nExternal registry: ' ~ atp_external_registry_probe_summary) ~ ('\\nExternal registry URL: ' ~ atp_external_registry_effective_url if atp_external_registry_effective_url | length > 0 else '') ~ ('\\nInternal command exit code: ' ~ (tc18_cmd.rc | string) if tc18_cmd.rc is defined else '')),
          'details': 'Internal service exit code: ' ~ (tc18_cmd.rc | default('unknown') | string) ~ '; external registry discovery: ' ~ atp_external_registry_discovery_source ~ '; probe: ' ~ atp_external_registry_probe_summary
        }] }}"
  tags: ['general', 'telco', 'tc18', 'registry']



# TC 19: Check Internal Registry Status
- name: "TC-19: Check Internal Registry Status"
  when: run_tc19_check_internal_registry_status | default(true) | bool
  block:
    - name: "TC-19: Discover configured external registry"
      ansible.builtin.include_tasks: registry_discovery.yml

    - name: "TC-19: Query internal registry pods"
      ansible.builtin.command: oc get pods -n openshift-image-registry -o json
      register: tc19_cmd
      changed_when: false
      failed_when: false

    - name: "TC-19: Capture internal registry pod placement and logs"
      ansible.builtin.shell: |
        set -euo pipefail
        if ! oc get svc image-registry -n openshift-image-registry -o name >/dev/null 2>&1; then
          echo "Internal registry is not configured; internal pod placement and logs are not applicable."
          exit 2
        fi
        echo "== Registry pod placement =="
        oc get pods -n openshift-image-registry -o wide
        echo "== Infra nodes =="
        oc get nodes -l node-role.kubernetes.io/infra -o wide
        echo "== Registry logs (last hour) =="
        logs="$(oc logs deployments/image-registry -n openshift-image-registry --since=1h --tail=20)"
        echo "$logs"
        if ! grep -q 'level=info' <<< "$logs"; then
          echo "No level=info registry activity was found in the last hour." >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      register: tc19_details_cmd
      changed_when: false
      failed_when: false

    - name: "TC-19: Probe optional external registry API"
      ansible.builtin.include_tasks: external_registry_probe.yml

    - name: "TC-19: Record Result"
      vars:
        reg_pods: "{{ ((tc19_cmd.stdout | from_json)['items']) if tc19_cmd.rc == 0 else [] }}"
        running_pods: "{{ reg_pods | selectattr('status.phase', 'equalto', 'Running') | map(attribute='metadata.name') | list }}"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-19',
          'name': 'Check Internal and External Registry Status',
          'category': 'Services Check',
          'expected': 'Internal registry pods are Running with placement and logs available; when an external registry is configured, its OCI v2 API is reachable and robot credentials authenticate successfully',
          'status': ('Skipped' if tc19_details_cmd.rc == 2 and atp_external_registry_effective_url | length == 0 else 'Pass' if ((tc19_details_cmd.rc == 2 and atp_external_registry_effective_url | length > 0 and atp_external_registry_probe_ok | bool) or (tc19_cmd.rc == 0 and tc19_details_cmd.rc == 0 and running_pods | length > 0 and (atp_external_registry_effective_url | length == 0 or atp_external_registry_probe_ok | bool))) else 'Fail'),
          'procedure': (tc19_cmd.cmd | default('Query internal registry pods')) ~ '\\n' ~ (tc19_details_cmd.cmd | default('Inspect internal registry placement and logs')) ~ '\\nProbe configured external registry OCI v2 endpoint when available',
          'evidence': ((tc19_cmd.stdout | default('')) ~ '\\n' ~ (tc19_details_cmd.stdout | default('')) ~ (('\\nSTDERR:\\n' ~ (tc19_details_cmd.stderr | default(''))) if (tc19_details_cmd.stderr | default('') | length > 0) else '') ~ ('\\nExternal registry: ' ~ atp_external_registry_probe_summary) ~ ('\\nExternal registry URL: ' ~ atp_external_registry_effective_url if atp_external_registry_effective_url | length > 0 else '') ~ ('\\nInternal command exit code: ' ~ (tc19_details_cmd.rc | string) if tc19_details_cmd.rc is defined else '')),
          'details': 'Running internal registry pods: ' ~ (running_pods | join(', ') if running_pods | length > 0 else 'None') ~ '; internal details exit code: ' ~ (tc19_details_cmd.rc | default('unknown') | string) ~ '; external registry discovery: ' ~ atp_external_registry_discovery_source ~ '; probe: ' ~ atp_external_registry_probe_summary
        }] }}"
  tags: ['general', 'telco', 'tc19', 'registry']



# TC 20: Check Internal Registry Storage
- name: "TC-20: Check Internal Registry Storage"
  when: run_tc20_check_internal_registry_storage | default(true) | bool
  block:
    - name: "TC-20: Discover configured external registry"
      ansible.builtin.include_tasks: registry_discovery.yml

    - name: "TC-20: Query registry storage configuration"
      ansible.builtin.shell: |
        set -euo pipefail
        if oc get svc image-registry -n openshift-image-registry -o name >/dev/null 2>&1; then
          storage="$(oc get configs.imageregistry.operator.openshift.io/cluster -o jsonpath='{.spec.storage}' | jq .)"
          if [[ -z "$storage" || "$storage" == "{}" || "$storage" == "null" ]]; then
            echo "Internal registry service exists, but Image Registry Operator has no storage backend configured: $storage" >&2
            exit 1
          fi
          if [[ "$storage" == *emptyDir* ]]; then
            echo "Internal registry uses ephemeral emptyDir storage; persistent storage is not configured: $storage" >&2
            exit 1
          fi
          echo "Internal registry storage backend: $storage"
        else
          if [[ -z "{{ atp_external_registry_effective_url }}" ]]; then
            echo "Internal storage is not configured and no external registry URL was configured or discovered. Set atp_external_registry_url to check an external registry."
            exit 2
          fi
          node="$(oc get nodes -l node-role.kubernetes.io/worker -o jsonpath='{.items[0].metadata.name}')"
          if [[ -z "$node" ]]; then
            echo "No worker node found to check the configured external registry" >&2
            exit 1
          fi
          echo "Internal registry is absent; checking {{ atp_external_registry_effective_url }} from worker $node."
          echo "External registry API availability does not expose its storage backend. Verify persistence with an authenticated push and pull or the registry provider's storage health check."
          status="$(oc debug -q "node/$node" -- chroot /host curl --connect-timeout 10 --max-time 20 -sS -o /dev/null -w '%{http_code}' "{{ atp_external_registry_effective_url }}/v2/")"
          echo "External registry API HTTP status: $status"
          [[ "$status" == "200" || "$status" == "401" ]]
        fi
      args:
        executable: /bin/bash
      register: tc20_cmd
      changed_when: false
      failed_when: false

    - name: "TC-20: Classify registry storage result"
      ansible.builtin.set_fact:
        tc20_status: "{{ 'Pass' if tc20_cmd.rc == 0 and 'Internal registry storage backend:' in (tc20_cmd.stdout | default('')) else 'Skipped' if (tc20_cmd.rc == 0 and 'External registry API availability does not expose its storage backend' in (tc20_cmd.stdout | default(''))) or (tc20_cmd.rc == 2 and 'no external registry URL' in (tc20_cmd.stdout | default('') | lower)) else 'Fail' }}"

    - name: "TC-20: Build Result Record"
      ansible.builtin.set_fact:
        tc20_result_record:
          id: "TC-20"
          name: "Check Configured Registry Storage"
          category: "Services Check"
          expected: "The registry storage configuration is returned as JSON; internal storage is persistent, while external storage persistence requires verification by its owner"
          status: "{{ tc20_status | trim }}"
          procedure: "{{ tc20_cmd.cmd | default('See ATP task source; command metadata unavailable') }}"
          evidence: "{{ (tc20_cmd.stdout | default('')) ~ (('\\nSTDERR:\\n' ~ (tc20_cmd.stderr | default(''))) if (tc20_cmd.stderr | default('') | length > 0) else '') ~ ('\\nExit code: ' ~ (tc20_cmd.rc | string) if tc20_cmd.rc is defined else '') }}"
          details: "{{ tc20_cmd.stdout | default(tc20_cmd.stderr) | truncate(150) }}"

    - name: "TC-20: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [tc20_result_record] }}"
  tags: ['general', 'telco', 'tc20', 'registry_storage']

# TC 21: Monitoring Stack Status
- name: "TC-21: Monitoring Stack Status"
  when: run_tc21_monitoring_stack_status | default(true) | bool
  block:
    - name: "TC-21: Check monitoring clusteroperator"
      ansible.builtin.command: oc get co monitoring -o json
      register: tc21_cmd
      changed_when: false
      failed_when: false

    - name: "TC-21: List monitoring pods and node placement"
      ansible.builtin.command: oc get pods -n openshift-monitoring -o wide
      register: tc21_pods_cmd
      changed_when: false
      failed_when: false

    - name: "TC-21: Verify all monitoring pods are Running and ready"
      ansible.builtin.shell: |
        set -euo pipefail
        oc get pods -n openshift-monitoring -o json | jq -e '.items | length > 0 and all(.[]; .status.phase == "Running" and ([.status.containerStatuses[]?.ready] | all))'
      args:
        executable: /bin/bash
      register: tc21_ready_cmd
      changed_when: false
      failed_when: false

    - name: "TC-21: Record Result"
      vars:
        mon_conditions: "{{ ((tc21_cmd.stdout | from_json).status.conditions) if tc21_cmd.rc == 0 else [] }}"
        mon_avail: "{{ (mon_conditions | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first) | default('Unknown') }}"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-21',
          'name': 'Monitoring Stack Status',
          'category': 'Services Check',
          'expected': 'Monitoring Operator Available=True with pods Running',
          'status': ('Pass' if (tc21_cmd.rc == 0 and tc21_pods_cmd.rc == 0 and tc21_ready_cmd.rc == 0 and mon_avail == 'True') else 'Fail'),
          'procedure': (tc21_cmd.cmd | default('See ATP task source; command metadata unavailable')) ~ '\n' ~ (tc21_pods_cmd.cmd | default('Pod placement command unavailable')) ~ '\n' ~ (tc21_ready_cmd.cmd | default('Pod readiness command unavailable')),
          'evidence': ((tc21_cmd.stdout | default('')) ~ '\n' ~ (tc21_pods_cmd.stdout | default('')) ~ '\n' ~ (tc21_ready_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc21_cmd.stderr | default(''))) if (tc21_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc21_cmd.rc | string) if tc21_cmd.rc is defined else '')),
          'details': 'Available: ' ~ mon_avail ~ '\nMonitoring pods and placement:\n' ~ (tc21_pods_cmd.stdout | default(tc21_pods_cmd.stderr) | truncate(250))
        }] }}"
  tags: ['general', 'telco', 'tc21', 'monitoring']

