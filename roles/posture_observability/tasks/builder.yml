---
- name: Build observability posture artifact facts
  ansible.builtin.set_fact:
    posture_artifact_key: observability
    posture_artifact_analysis_summary: "{{ observability_summary | default({}) }}"
    posture_artifact_findings:
      observability: "{{ observability_findings | default(top_observability_findings | default([])) }}"
      advisor: "{{ advisor_findings | default(top_live_advisor_findings | default([])) }}"
      insights_archive: "{{ insights_archive_findings | default([]) }}"
      connected_cluster: "{{ assessment_connected_cluster_findings | default(connected_cluster_findings | default([])) }}"
    posture_artifact_render_inputs:
      forwarding_summary: "{{ observability_forwarding_summary | default({}) }}"
      prometheus_query: "{{ prometheus_evidence_summary | default({}) }}"
      findings: "{{ top_observability_findings | default(observability_findings | default([])) }}"
      connected_cluster_posture: "{{ assessment_connected_cluster_posture | default(connected_cluster_posture | default({})) }}"
      connected_cluster_findings: "{{ assessment_connected_cluster_findings | default(connected_cluster_findings | default([])) }}"
      advisor_summary: "{{ advisor_summary | default(live_support_data.parsed.advisor_export.summary | default({})) }}"
      advisor_findings: "{{ advisor_findings | default(top_live_advisor_findings | default([])) }}"
      insights_archive_summary: "{{ insights_archive_summary | default({}) }}"
      insights_archive_findings: "{{ insights_archive_findings | default([]) }}"
    posture_artifact_collection_inputs:
      observability_finding_count: "{{ (observability_findings | default(top_observability_findings | default([]))) | length }}"
      advisor_finding_count: "{{ (advisor_findings | default(top_live_advisor_findings | default([]))) | length }}"
      insights_archive_finding_count: "{{ (insights_archive_findings | default([])) | length }}"
      connected_cluster_finding_count: "{{ (assessment_connected_cluster_findings | default(connected_cluster_findings | default([]))) | length }}"
      prometheus_query_count: "{{ (prometheus_evidence_summary | default({})).get('query_count', 0) }}"
      prometheus_non_empty_query_count: "{{ (prometheus_evidence_summary | default({})).get('non_empty_result_count', 0) }}"
    posture_artifact_section_fields:
      summary: "{{ observability_summary | default({}) }}"
      recommendations: "{{ (observability_summary | default({})).get('recommendation', 'Review monitoring health, alert-routing, log forwarding, and metrics forwarding before treating observability as production-ready.') }}"
      forwarding_summary: "{{ observability_forwarding_summary | default({}) }}"
      prometheus_query: "{{ prometheus_evidence_summary | default({}) }}"
      findings: "{{ top_observability_findings | default(observability_findings | default([])) }}"
      connected_cluster_posture: "{{ assessment_connected_cluster_posture | default(connected_cluster_posture | default({})) }}"
      connected_cluster_findings: "{{ assessment_connected_cluster_findings | default(connected_cluster_findings | default([])) }}"
      advisor_summary: "{{ advisor_summary | default(live_support_data.parsed.advisor_export.summary | default({})) }}"
      advisor_findings: "{{ advisor_findings | default(top_live_advisor_findings | default([])) }}"
      insights_archive_summary: "{{ insights_archive_summary | default({}) }}"
      insights_archive_findings: "{{ insights_archive_findings | default([]) }}"
