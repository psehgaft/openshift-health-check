                ~ 'rc=' ~ ((ansible_failed_result.rc | default('unknown')) | string)
                ~ ', changed=' ~ ((ansible_failed_result.changed | default(false)) | string)
                ~ ', stderr_lines=' ~ (((ansible_failed_result.stderr_lines | default([])) | length) | string)
                ~ ', stdout_lines=' ~ (((ansible_failed_result.stdout_lines | default([])) | length) | string)
              }}
            run_checkpoint_write_snapshot: false
        - name: Re-raise collected workflow failure
          ansible.builtin.fail:
            msg: >-
              Collected-state OpenShift workflow failed in task
              '{{ ansible_failed_task.name | default("unknown-task") }}'.
              {{
                'Raw failure output was omitted from the rescue message because collected cluster data can contain literal template markers. '
                ~ 'rc=' ~ ((ansible_failed_result.rc | default('unknown')) | string)
                ~ ', changed=' ~ ((ansible_failed_result.changed | default(false)) | string)
              }}
              Re-run with report_run_mode=resume_last_failure to continue from the last saved checkpoint.

    - name: Resume collected-state OpenShift workflow from checkpoint
      when:
        - report_mode_resolved == 'collected'
        - report_run_mode | default('fresh') == 'resume_last_failure'
      block:
        - name: Resume collected analysis and report stages
          when: (report_resume_manifest.resume_next_stage | default('')) == 'analysis'
          block:
            - name: Load OpenShift shared artifacts for resumed collected analysis
              ansible.builtin.include_role:
                name: report_common
                tasks_from: load_openshift_shared_artifacts.yml
            - name: Re-prepare collected-state OpenShift analysis from checkpointed collection state
              ansible.builtin.include_role:
                name: analyze_openshift
                tasks_from: prepare_collected_state.yml
            - name: Run common analysis against collected-state inputs
              ansible.builtin.include_role:
                name: analyze_common
            - name: Run unified OpenShift analysis against collected-state inputs
              ansible.builtin.include_role:
                name: analyze_openshift
            - name: Build collected-state OpenShift health synthesis
              ansible.builtin.include_role:
                name: analyze_openshift
                tasks_from: collected_state_health.yml
            - name: Finalize collected-state supportability rollup
              ansible.builtin.include_role:
                name: analyze_openshift
                tasks_from: finalize_collected_supportability.yml

            - name: Prepare OpenShift artifact persistence context for resumed collected run
              ansible.builtin.include_role:
                name: report_common
                tasks_from: prepare_openshift_artifact_persistence_context.yml

            - name: Build and persist enabled posture artifacts for resumed collected run
              ansible.builtin.include_role:
                name: "{{ item.role }}"
              loop: "{{ openshift_enabled_posture_artifact_roles }}"
              loop_control:
                label: "{{ item.key }}"
            - name: Build and persist enabled capability artifacts for resumed collected run
              ansible.builtin.include_role:
                name: "{{ item.role }}"
              loop: "{{ openshift_enabled_capability_artifact_roles }}"
              loop_control:
                label: "{{ item.key }}"
            - name: Persist shared collection and analysis artifacts for resumed collected run
              ansible.builtin.include_role:
                name: report_common
                tasks_from: persist_openshift_shared_artifacts.yml
            - name: Save resumed collected analysis checkpoint
              ansible.builtin.include_role:
                name: report_common
                tasks_from: save_run_checkpoint.yml
              vars:
                run_checkpoint_stage: analysis
                run_checkpoint_resume_next_stage: report
                run_checkpoint_status: completed
                run_checkpoint_write_snapshot: true
                run_checkpoint_snapshot_payload:
                  platform_family: "{{ platform_family }}"
                  provider_family: "{{ provider_family }}"
                  kube_cli: "{{ kube_cli }}"
                  report_mode_resolved: "{{ report_mode_resolved }}"
                  report_run_mode: "{{ report_run_mode | default('fresh') }}"
                  report_output_dir: "{{ report_output_dir }}"
                  report_basename: "{{ report_basename }}"
                  report_generate_html: "{{ report_generate_html | default(false) }}"
                  report_generate_pdf: "{{ report_generate_pdf | default(false) }}"
                  report_timestamp: "{{ report_timestamp | default('') }}"
                  report_generated_at: "{{ report_generated_at | default('') }}"
                  cluster_profile_mode: "{{ cluster_profile_mode | default('auto') }}"
                  cluster_health_profile: "{{ cluster_health_profile | default({}) }}"
                  cluster_profile: "{{ cluster_profile | default({}) }}"
                  resolved_cluster_profile_mode: "{{ resolved_cluster_profile_mode | default(cluster_profile_mode | default('auto')) }}"
                  evidence_summary: "{{ evidence_summary | default({}) }}"
                  assessment_collection_summary: "{{ assessment_collection_summary | default({}) }}"
                  assessment_collection_failures: "{{ assessment_collection_failures | default([]) }}"
                  assessment_collection_skipped_optional_commands: "{{ assessment_collection_skipped_optional_commands | default([]) }}"
            - name: Build collected-state OpenShift report
              ansible.builtin.include_role:
                name: report_openshift
                tasks_from: render_collected_state_report.yml
        - name: Resume collected report stage only
          when: (report_resume_manifest.resume_next_stage | default('')) == 'report'
          ansible.builtin.include_role:
            name: report_openshift
            tasks_from: render_collected_state_report.yml
        - name: Mark resumed collected run checkpoint as completed
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: render
            run_checkpoint_resume_next_stage: ""
            run_checkpoint_status: completed
            run_checkpoint_write_snapshot: false
      rescue:
        - name: Record failed resumed collected run checkpoint
          ansible.builtin.include_role:
            name: report_common
            tasks_from: save_run_checkpoint.yml
          vars:
            run_checkpoint_stage: "{{ report_resume_manifest.resume_next_stage or 'report' }}"
            run_checkpoint_resume_next_stage: "{{ report_resume_manifest.resume_next_stage or 'report' }}"
            run_checkpoint_status: failed
            run_checkpoint_failed_task: "{{ ansible_failed_task.name | default('unknown-task') }}"
            run_checkpoint_failed_message: >-
              {{
                'Task failed during resumed collected-state render stage. '
                ~ 'rc=' ~ ((ansible_failed_result.rc | default('unknown')) | string)
                ~ ', changed=' ~ ((ansible_failed_result.changed | default(false)) | string)
                ~ ', stderr_lines=' ~ (((ansible_failed_result.stderr_lines | default([])) | length) | string)
                ~ ', stdout_lines=' ~ (((ansible_failed_result.stdout_lines | default([])) | length) | string)
              }}
            run_checkpoint_write_snapshot: false
        - name: Re-raise resumed collected workflow failure
          ansible.builtin.fail:
            msg: >-
              Resumed collected-state OpenShift workflow failed again in task
              '{{ ansible_failed_task.name | default("unknown-task") }}'.
              {{
                'Raw failure output was omitted from the rescue message because collected cluster data can contain literal template markers. '
                ~ 'rc=' ~ ((ansible_failed_result.rc | default('unknown')) | string)
                ~ ', changed=' ~ ((ansible_failed_result.changed | default(false)) | string)
              }}
              Fix the reported issue and rerun with report_run_mode=resume_last_failure or use report_run_mode=fresh for a clean restart.
