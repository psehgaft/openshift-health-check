---
- name: Generate a development Kubernetes cluster health report
  import_playbook: k8s_cluster_health_report.yml
  vars:
    cluster_profile_mode: development
    report_basename: "development-k8s-cluster-health"
    report_generate_html: false
    report_generate_pdf: false
    collection_parallelism: 6
    collection_command_timeout_seconds: 180
    warning_event_limit: 10
    top_restart_pod_limit: 10
    top_namespace_issue_limit: 10
    top_pvc_issue_limit: 10
    top_workload_issue_limit: 15
    top_security_issue_limit: 15
    top_deprecated_api_limit: 15
