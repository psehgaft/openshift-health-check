---
- name: Define report paths
  ansible.builtin.set_fact:
    report_cluster_type: "{{ cluster_profile.deployment_type | default(provider_family if (provider_family | default('generic')) != 'generic' else (platform_family | default('openshift'))) }}"
    report_cluster_name_source: "{{ cluster_profile.infrastructure_name if (cluster_profile.infrastructure_name | default('') not in ['', 'unknown']) else (oc_context_cmd.stdout | default('cluster') | trim) }}"
    report_cluster_name: "{{ ((cluster_profile.infrastructure_name if (cluster_profile.infrastructure_name | default('') not in ['', 'unknown']) else (oc_context_cmd.stdout | default('cluster') | trim)) | lower | regex_replace('[^a-z0-9._-]+', '-') | regex_replace('^-+', '') | regex_replace('-+$', '')) or 'cluster' }}"
    report_file_prefix: "{{ report_basename }}-{{ (cluster_profile.deployment_type | default(provider_family if (provider_family | default('generic')) != 'generic' else (platform_family | default('openshift')))) }}-{{ ((cluster_profile.infrastructure_name if (cluster_profile.infrastructure_name | default('') not in ['', 'unknown']) else (oc_context_cmd.stdout | default('cluster') | trim)) | lower | regex_replace('[^a-z0-9._-]+', '-') | regex_replace('^-+', '') | regex_replace('-+$', '')) or 'cluster' }}-{{ report_timestamp }}"

- name: Define report output files
  ansible.builtin.set_fact:
    report_path: "{{ report_output_dir }}/{{ report_file_prefix }}.md"
    report_json_path: "{{ report_output_dir }}/{{ report_file_prefix }}.json"
    report_html_path: "{{ report_output_dir }}/{{ report_file_prefix }}.html"
    report_pdf_path: "{{ report_output_dir }}/{{ report_file_prefix }}.pdf"
    report_css_path: "{{ playbook_dir }}/../templates/report.css"

- name: Build base execution stats
  ansible.builtin.set_fact:
    execution_stats:
      started_at: "{{ report_generated_at }}"
      completed_at: "{{ report_generated_at }}"
      duration_seconds: 0
      duration_minutes: 0
      ocp_user: "{{ oc_user_cmd.stdout | default('unknown') | trim }}"
      local_user: "{{ ansible_env.USER | default(ansible_user_id | default('unknown')) }}"
      local_hostname: "{{ ansible_hostname | default('unknown') }}"
      local_fqdn: "{{ ansible_fqdn | default(ansible_hostname | default('unknown')) }}"
      local_os: "{{ ansible_distribution | default('unknown') }} {{ ansible_distribution_version | default('') | trim }}"
      local_python: "{{ ansible_python_version | default('unknown') }}"
      ansible_version: "{{ ansible_version.full | default('unknown') }}"
      context: "{{ oc_context_cmd.stdout | default('unknown') | trim }}"
      api_server: "{{ oc_server_cmd.stdout | default('unknown') | trim }}"
      report_formats_generated:
        markdown: true
        json: true
        html: false
        pdf: false
      collection:
        command_count: "{{ collection_summary.command_count | default(0) }}"
        parallelism: "{{ collection_summary.parallelism | default(0) }}"
        timeout_seconds: "{{ collection_summary.timeout_seconds | default(0) }}"
        failed_commands: "{{ collection_summary.failed_commands | default(0) }}"
        timed_out_commands: "{{ collection_summary.timed_out_commands | default(0) }}"
        core_failed_commands: "{{ collection_summary.core_failed_commands | default(0) }}"

- name: Build audit rubric
  ansible.builtin.set_fact:
    audit_checks:
      - id: cluster_version
        title: Cluster Version State
        severity: "{{ 'critical' if cv_available != 'True' or cv_failing == 'True' else ('warning' if cv_progressing == 'True' else 'pass') }}"
        score: "{{ 0 if cv_available != 'True' or cv_failing == 'True' else (6 if cv_progressing == 'True' else 10) }}"
        max_score: 10
        findings_count: "{{ (1 if cv_available != 'True' or cv_failing == 'True' else 0) + (1 if cv_progressing == 'True' else 0) }}"
      - id: operators
        title: Cluster Operators
        severity: "{{ 'critical' if (degraded_operators | default([]) | length > 0 or unavailable_operators | default([]) | length > 0) else ('warning' if progressing_operators | default([]) | length > 0 else 'pass') }}"
        score: "{{ 0 if (degraded_operators | default([]) | length > 0 or unavailable_operators | default([]) | length > 0) else (8 if progressing_operators | default([]) | length > 0 else 12) }}"
        max_score: 12
        findings_count: "{{ (degraded_operators | default([]) | length) + (unavailable_operators | default([]) | length) + (progressing_operators | default([]) | length) }}"
      - id: nodes
        title: Node Health
        severity: "{{ 'critical' if not_ready_nodes | default([]) | length > 0 else ('warning' if pressure_nodes | default([]) | length > 0 else 'pass') }}"
        score: "{{ 0 if not_ready_nodes | default([]) | length > 0 else (7 if pressure_nodes | default([]) | length > 0 else 10) }}"
        max_score: 10
        findings_count: "{{ (not_ready_nodes | default([]) | length) + (pressure_nodes | default([]) | length) }}"
      - id: workloads
        title: Workload Health
        severity: "{{ 'warning' if workload_health_issues | default([]) | length > 0 or workload_probe_findings | default([]) | length > 0 or platform_pod_issues | default([]) | length > 0 or high_restart_pods | default([]) | length > 0 or overprovisioned_pods | default([]) | length > 0 else 'pass' }}"
        score: "{{ 5 if workload_health_issues | default([]) | length > 0 or workload_probe_findings | default([]) | length > 0 or platform_pod_issues | default([]) | length > 0 or high_restart_pods | default([]) | length > 0 or overprovisioned_pods | default([]) | length > 0 else 8 }}"
        max_score: 8
        findings_count: "{{ (workload_health_issues | default([]) | length) + (workload_probe_findings | default([]) | length) + (platform_pod_issues | default([]) | length) + (high_restart_pods | default([]) | length) + (overprovisioned_pods | default([]) | length) }}"
      - id: routes_network
        title: Network And Routes
        severity: "{{ 'critical' if route_issues | default([]) | length > 0 or ingress_issues | default([]) | length > 0 or route_host_conflicts | default([]) | length > 0 or ingress_host_conflicts | default([]) | length > 0 else 'pass' }}"
        score: "{{ 0 if route_issues | default([]) | length > 0 or ingress_issues | default([]) | length > 0 or route_host_conflicts | default([]) | length > 0 or ingress_host_conflicts | default([]) | length > 0 else 8 }}"
        max_score: 8
        findings_count: "{{ (route_issues | default([]) | length) + (ingress_issues | default([]) | length) + (route_host_conflicts | default([]) | length) + (ingress_host_conflicts | default([]) | length) }}"
      - id: security_practices
        title: Security And Best Practices
        severity: "{{ 'warning' if (auth_findings | default([]) | length > 0 or security_findings | default([]) | length > 0 or privileged_serviceaccount_access | default([]) | length > 0 or privileged_user_access | default([]) | length > 0 or privileged_group_access | default([]) | length > 0 or workload_practice_findings | default([]) | length > 0 or namespaces_without_networkpolicy | default([]) | length > 0 or namespaces_missing_ingress_policies | default([]) | length > 0 or namespaces_missing_egress_policies | default([]) | length > 0 or namespaces_without_resourcequota | default([]) | length > 0 or namespaces_without_limitrange | default([]) | length > 0 or image_registry_findings | default([]) | length > 0 or feature_findings | default([]) | length > 0) else 'pass' }}"
        score: "{{ 6 if (auth_findings | default([]) | length > 0 or security_findings | default([]) | length > 0 or privileged_serviceaccount_access | default([]) | length > 0 or privileged_user_access | default([]) | length > 0 or privileged_group_access | default([]) | length > 0 or workload_practice_findings | default([]) | length > 0 or namespaces_without_networkpolicy | default([]) | length > 0 or namespaces_missing_ingress_policies | default([]) | length > 0 or namespaces_missing_egress_policies | default([]) | length > 0 or namespaces_without_resourcequota | default([]) | length > 0 or namespaces_without_limitrange | default([]) | length > 0 or image_registry_findings | default([]) | length > 0 or feature_findings | default([]) | length > 0) else 14 }}"
        max_score: 14
        findings_count: "{{ (auth_findings | default([]) | length) + (security_findings | default([]) | length) + (privileged_serviceaccount_access | default([]) | length) + (privileged_user_access | default([]) | length) + (privileged_group_access | default([]) | length) + (workload_practice_findings | default([]) | length) + (namespaces_without_networkpolicy | default([]) | length) + (namespaces_missing_ingress_policies | default([]) | length) + (namespaces_missing_egress_policies | default([]) | length) + (namespaces_without_resourcequota | default([]) | length) + (namespaces_without_limitrange | default([]) | length) + (image_registry_findings | default([]) | length) + (feature_findings | default([]) | length) }}"
      - id: unused_resources
        title: Unused Resource Heuristics
        severity: "{{ 'warning' if (empty_user_namespaces | default([]) | length > 0 or services_without_endpoints | default([]) | length > 0 or likely_unused_serviceaccounts | default([]) | length > 0 or likely_unused_configmaps | default([]) | length > 0 or likely_unused_secrets | default([]) | length > 0 or likely_unused_crds | default([]) | length > 0) else 'pass' }}"
        score: "{{ 5 if (empty_user_namespaces | default([]) | length > 0 or services_without_endpoints | default([]) | length > 0 or likely_unused_serviceaccounts | default([]) | length > 0 or likely_unused_configmaps | default([]) | length > 0 or likely_unused_secrets | default([]) | length > 0 or likely_unused_crds | default([]) | length > 0) else 8 }}"
        max_score: 8
        findings_count: "{{ (empty_user_namespaces | default([]) | length) + (services_without_endpoints | default([]) | length) + (likely_unused_serviceaccounts | default([]) | length) + (likely_unused_configmaps | default([]) | length) + (likely_unused_secrets | default([]) | length) + (likely_unused_crds | default([]) | length) }}"
      - id: storage
        title: Storage Health
        severity: "{{ 'warning' if (pv_issues | default([]) | length > 0 or pvc_issues | default([]) | length > 0 or quota_pressure_findings | default([]) | length > 0) else 'pass' }}"
        score: "{{ 5 if (pv_issues | default([]) | length > 0 or pvc_issues | default([]) | length > 0 or quota_pressure_findings | default([]) | length > 0) else 8 }}"
        max_score: 8
        findings_count: "{{ (pv_issues | default([]) | length) + (pvc_issues | default([]) | length) + (quota_pressure_findings | default([]) | length) }}"
      - id: lifecycle
        title: Upgrade, API, And Certificate Lifecycle
        severity: "{{ 'critical' if expiring_certificates_critical | default([]) | length > 0 else ('warning' if (conditional_updates | default([]) | length > 0 or deprecated_crd_findings | default([]) | length > 0 or deprecated_api_lines | default([]) | length > 0 or expiring_certificates_warning | default([]) | length > 0) else 'pass') }}"
        score: "{{ 0 if expiring_certificates_critical | default([]) | length > 0 else (6 if (conditional_updates | default([]) | length > 0 or deprecated_crd_findings | default([]) | length > 0 or deprecated_api_lines | default([]) | length > 0 or expiring_certificates_warning | default([]) | length > 0) else 14) }}"
        max_score: 14
        findings_count: "{{ (conditional_updates | default([]) | length) + (deprecated_crd_findings | default([]) | length) + (deprecated_api_lines | default([]) | length) + (expiring_certificates_warning | default([]) | length) }}"
      - id: performance_density
        title: Performance And Density
        severity: "{{ 'critical' if critical_pod_density_nodes | default([]) | length > 0 else ('warning' if (high_pod_density_nodes | default([]) | length > 0 or high_cpu_nodes | default([]) | length > 0 or high_memory_nodes | default([]) | length > 0) else 'pass') }}"
        score: "{{ 0 if critical_pod_density_nodes | default([]) | length > 0 else (6 if (high_pod_density_nodes | default([]) | length > 0 or high_cpu_nodes | default([]) | length > 0 or high_memory_nodes | default([]) | length > 0) else 10) }}"
        max_score: 10
        findings_count: "{{ (critical_pod_density_nodes | default([]) | length) + (high_pod_density_nodes | default([]) | length) + (high_cpu_nodes | default([]) | length) + (high_memory_nodes | default([]) | length) }}"
      - id: alerts_events
        title: Alerts And Warning Events
        severity: "{{ 'warning' if (firing_alerts | default([]) | length > 0 or recent_warning_events | default([]) | length > 0) else 'pass' }}"
        score: "{{ 4 if (firing_alerts | default([]) | length > 0 or recent_warning_events | default([]) | length > 0) else 6 }}"
        max_score: 6
        findings_count: "{{ (firing_alerts | default([]) | length) + (recent_warning_events | default([]) | length) }}"
      - id: observability_posture
        title: Observability And External Forwarding
        severity: "{{ 'warning' if (observability_findings | default([]) | length > 0) else 'pass' }}"
        score: "{{ 4 if (observability_findings | default([]) | length > 0) else 8 }}"
        max_score: 8
        findings_count: "{{ observability_findings | default([]) | length }}"
      - id: collection_completeness
        title: Data Collection Completeness
        severity: "{{ 'critical' if (collection_summary.core_failed_commands | default(0) | int > 0) else ('warning' if (collection_summary.failed_commands | default(0) | int > 0) else 'pass') }}"
        score: "{{ 0 if (collection_summary.core_failed_commands | default(0) | int > 0) else (4 if (collection_summary.failed_commands | default(0) | int > 0) else 8) }}"
        max_score: 8
        findings_count: "{{ collection_summary.failed_commands | default(0) }}"

- name: Build audit score summary
  ansible.builtin.set_fact:
    audit_score_total: "{{ audit_checks | map(attribute='score') | map('int') | list | sum }}"
    audit_score_max: "{{ audit_checks | map(attribute='max_score') | map('int') | list | sum }}"
    audit_critical_checks: "{{ audit_checks | selectattr('severity', 'equalto', 'critical') | map(attribute='id') | list }}"
    audit_warning_checks: "{{ audit_checks | selectattr('severity', 'equalto', 'warning') | map(attribute='id') | list }}"

- name: Build normalized cluster health score
  ansible.builtin.set_fact:
    cluster_health_score: "{{ (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) | round(1) }}"
    cluster_health_score_label: >-
      {{
        'Excellent'
        if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 95 )
        else (
          'Good'
          if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 85 )
          else (
            'Fair'
            if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 70 )
            else (
              'Poor'
              if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 50 )
              else 'Critical'
            )
          )
        )
      }}
    cluster_health_score_legend:
      - min: 95
        max: 100
        label: Excellent
        meaning: Stable cluster with no material health risks detected.
      - min: 85
        max: 94.9
        label: Good
        meaning: Healthy overall with only limited warnings or hygiene issues.
      - min: 70
        max: 84.9
        label: Fair
        meaning: Noticeable operational debt or warning signals that should be scheduled for remediation.
      - min: 50
        max: 69.9
        label: Poor
        meaning: Multiple risks or degraded areas that require active remediation.
      - min: 0
        max: 49.9
        label: Critical
        meaning: Serious cluster health problems or blocking risks are present.

- name: Build report confidence facts
  ansible.builtin.set_fact:
    collection_success_rate_pct: "{{ ((((collection_summary.succeeded_commands | default(0) | float) / ((collection_summary.command_count | default(0) | float) if (collection_summary.command_count | default(0) | float) > 0 else 1.0)) * 100) | round(1)) }}"
    report_confidence: >-
      {{
        'low'
        if (
          (collection_summary.core_failed_commands | default(0) | int) > 0
          or (cluster_current_state_build_error | default('') | trim | length > 0)
        )
        else (
          'medium'
          if (
            (collection_summary.failed_commands | default(0) | int) > 0
            or (collection_summary.timed_out_commands | default(0) | int) > 0
          )
          else 'high'
        )
      }}
    report_confidence_detail: >-
      {{
        'core collection commands failed or the detailed state summarizer fell back to direct fact counts'
        if (
          (collection_summary.core_failed_commands | default(0) | int) > 0
          or (cluster_current_state_build_error | default('') | trim | length > 0)
        )
        else (
          'some non-core collection commands failed or timed out, but the main health signals were collected'
          if (
            (collection_summary.failed_commands | default(0) | int) > 0
            or (collection_summary.timed_out_commands | default(0) | int) > 0
          )
          else 'all planned collection commands completed and the synthesized state data was built successfully'
        )
      }}

- name: Build suggested next steps
  ansible.builtin.set_fact:
    suggested_next_steps: >-
      {{
        (
          []
          + ([{
              'priority': 'immediate',
              'summary': 'Fix collection failures and rerun the report.',
              'detail': 'Start with failed or timed out commands in Data Collection, confirm `oc` access and permissions, then rerun so later sections reflect complete data.'
            }] if (collection_summary.failed_commands | default(0) | int) > 0 else [])
          + ([{
              'priority': 'immediate',
              'summary': 'Stabilize degraded, unavailable, or progressing operators first.',
              'detail': 'Review Cluster Operators and related operand namespaces, clear degraded conditions, and wait for operators to return to `Available=True`, `Progressing=False`, and `Degraded=False` before lower-priority cleanup.'
            }] if (degraded_operators | default([]) | length > 0 or unavailable_operators | default([]) | length > 0) else [])
          + ([{
              'priority': 'immediate',
              'summary': 'Restore node readiness and remove node pressure.',
              'detail': 'Drain or repair NotReady nodes, investigate kubelet/runtime/storage causes, and clear sustained MemoryPressure, DiskPressure, or PIDPressure before workload changes.'
            }] if (not_ready_nodes | default([]) | length > 0 or pressure_nodes | default([]) | length > 0) else [])
          + ([{
              'priority': 'immediate',
              'summary': 'Repair traffic path issues in route, ingress, and service backends.',
              'detail': 'Resolve unadmitted routes, ingress misconfiguration, host conflicts, and missing backend services/endpoints, then verify application reachability from both cluster and external paths.'
            }] if (route_issues | default([]) | length > 0 or ingress_issues | default([]) | length > 0 or route_host_conflicts | default([]) | length > 0 or ingress_host_conflicts | default([]) | length > 0) else [])
          + ([{
              'priority': 'immediate',
              'summary': 'Resolve certificate expiry and upgrade-blocking risks.',
              'detail': 'Renew secrets nearing expiry, review conditional update risks, and confirm the cluster is upgrade-ready before scheduling version changes.'
            }] if (expiring_certificates_critical | default([]) | length > 0 or conditional_updates | default([]) | length > 0) else [])
          + ([{
              'priority': 'next',
              'summary': 'Harden workload rollout health and probe coverage.',
              'detail': 'Fix rollout gaps, add missing liveness/readiness/startup probes, and investigate restart hotspots so workloads fail fast and recover predictably.'
            }] if (workload_health_issues | default([]) | length > 0 or workload_probe_findings | default([]) | length > 0 or high_restart_pods | default([]) | length > 0) else [])
          + ([{
              'priority': 'next',
              'summary': 'Review storage health and namespace quota pressure.',
              'detail': 'Resolve PV/PVC phase problems, confirm storage class behavior, and raise or rebalance quotas for namespaces approaching hard limits.'
            }] if (pv_issues | default([]) | length > 0 or pvc_issues | default([]) | length > 0 or quota_pressure_findings | default([]) | length > 0) else [])
          + ([{
              'priority': 'planned',
              'summary': 'Use the report for hygiene, rightsizing, and policy cleanup.',
              'detail': 'After platform health is stable, review overprovisioned workloads, unused-resource heuristics, privileged RBAC grants, and other security/best-practice findings to reduce risk, waste, and operational drift.'
            }] if (overprovisioned_pods | default([]) | length > 0 or empty_user_namespaces | default([]) | length > 0 or likely_unused_serviceaccounts | default([]) | length > 0 or likely_unused_configmaps | default([]) | length > 0 or likely_unused_secrets | default([]) | length > 0 or likely_unused_crds | default([]) | length > 0 or security_findings | default([]) | length > 0 or privileged_serviceaccount_access | default([]) | length > 0 or privileged_user_access | default([]) | length > 0 or privileged_group_access | default([]) | length > 0 or workload_practice_findings | default([]) | length > 0) else [])
          + ([{
              'priority': 'planned',
              'summary': 'Improve observability coverage and external forwarding posture.',
              'detail': 'Confirm monitoring health, log forwarding outputs, and remote-write targets so operational data is retained outside the cluster and available during incidents.'
            }] if (observability_findings | default([]) | length > 0) else [])
          + ([{
              'priority': 'steady-state',
              'summary': 'Continue steady-state review and trend tracking.',
              'detail': 'No major health risks were detected in this run; keep periodic reviews, compare future reports, and investigate meaningful score or signal drift early.'
            }] if (
              (collection_summary.failed_commands | default(0) | int) == 0
              and health_summary.status == 'HEALTHY'
              and (cluster_health_score | float) >= 85
            ) else [])
          + ([{
              'priority': 'summary',
              'summary': 'Treat this run as critical and work top-down from platform health.',
              'detail': 'Use this order of operations: collection completeness, operators, nodes, traffic path, certificates and upgrade blockers, then workload and hygiene remediation.'
            }] if (health_summary.status == 'CRITICAL' and (collection_summary.failed_commands | default(0) | int) == 0 and (degraded_operators | default([]) | length) == 0 and (unavailable_operators | default([]) | length) == 0 and (not_ready_nodes | default([]) | length) == 0 and (pressure_nodes | default([]) | length) == 0 and (route_issues | default([]) | length) == 0 and (ingress_issues | default([]) | length) == 0 and (route_host_conflicts | default([]) | length) == 0 and (ingress_host_conflicts | default([]) | length) == 0 and (expiring_certificates_critical | default([]) | length) == 0 and (conditional_updates | default([]) | length) == 0) else [])
          + ([{
              'priority': 'summary',
              'summary': 'Plan near-term remediation from the warning findings.',
              'detail': 'The cluster is currently usable, but warning items should be assigned, tracked to closure, and revisited in the next report run.'
            }] if (health_summary.status == 'WARNING' and (collection_summary.failed_commands | default(0) | int) == 0 and (workload_health_issues | default([]) | length) == 0 and (workload_probe_findings | default([]) | length) == 0 and (high_restart_pods | default([]) | length) == 0 and (pv_issues | default([]) | length) == 0 and (pvc_issues | default([]) | length) == 0 and (quota_pressure_findings | default([]) | length) == 0 and (overprovisioned_pods | default([]) | length) == 0 and (empty_user_namespaces | default([]) | length) == 0 and (likely_unused_serviceaccounts | default([]) | length) == 0 and (likely_unused_configmaps | default([]) | length) == 0 and (likely_unused_secrets | default([]) | length) == 0 and (likely_unused_crds | default([]) | length) == 0 and (security_findings | default([]) | length) == 0 and (workload_practice_findings | default([]) | length) == 0 and (observability_findings | default([]) | length) == 0) else [])
        )
      }}

- name: Build audit report payload
  ansible.builtin.set_fact:
    audit_report:
      metadata:
        generated_at: "{{ report_generated_at }}"
        completed_at: "{{ report_generated_at }}"
        context: "{{ oc_context_cmd.stdout | default('unknown') | trim }}"
        api_server: "{{ oc_server_cmd.stdout | default('unknown') | trim }}"
        user: "{{ oc_user_cmd.stdout | default('unknown') | trim }}"
        cluster_type: "{{ report_cluster_type }}"
        report_confidence: "{{ report_confidence }}"
        local_user: "{{ ansible_env.USER | default(ansible_user_id | default('unknown')) }}"
        local_hostname: "{{ ansible_hostname | default('unknown') }}"
      cluster_profile: "{{ cluster_profile }}"
      cluster_current_state: "{{ cluster_current_state | default({}) }}"
      health_summary: "{{ health_summary }}"
      execution_stats: {}
      suggested_next_steps: "{{ suggested_next_steps }}"
      audit:
        score_total: "{{ audit_score_total }}"
        score_max: "{{ audit_score_max }}"
        cluster_health_score: "{{ cluster_health_score }}"
        cluster_health_score_label: "{{ cluster_health_score_label }}"
        cluster_health_score_legend: "{{ cluster_health_score_legend }}"
        critical_checks: "{{ audit_critical_checks }}"
        warning_checks: "{{ audit_warning_checks }}"
        checks: "{{ audit_checks }}"
      findings:
        collection_failures: "{{ collection_failures | default([]) }}"
        degraded_operators: "{{ degraded_operators | default([]) }}"
        unavailable_operators: "{{ unavailable_operators | default([]) }}"
        not_ready_nodes: "{{ not_ready_nodes | default([]) }}"
        pressure_nodes: "{{ pressure_nodes | default([]) }}"
        infrastructure_component_issues: "{{ infrastructure_component_issues | default([]) }}"
        ingresscontroller_issues: "{{ ingresscontroller_issues | default([]) }}"
        workload_health_issues: "{{ top_workload_health_issues | default([]) }}"
