---
- name: Build disconnected cluster image sources capability artifact facts
  vars:
    day2_disconnected_cluster_image_sources_section_current: "{{ (((day2_capability_sections | default([])) | selectattr('key', 'equalto', 'disconnected_cluster_image_sources') | list | first) | default({})) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: disconnected_cluster_image_sources
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      operations_status: "{{ day2_disconnected_cluster_image_sources_section_current.status | default('unknown') }}"
      operations_reason_summary: "{{ day2_disconnected_cluster_image_sources_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_disconnected_cluster_image_sources_section: "{{ day2_disconnected_cluster_image_sources_section_current }}"
    capability_artifact_collection_inputs:
      disconnected_cluster_image_sources_present: "{{ ((day2_posture_summary | default({})).get('disconnected_cluster_image_sources_present', false)) | bool }}"
