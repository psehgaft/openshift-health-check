---
- name: Build cluster image mirror configuration capability artifact facts
  vars:
    day2_cluster_image_mirror_configuration_section_current: "{{ (day2_capability_sections_by_key | default({})).get('cluster_image_mirror_configuration', {}) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: cluster_image_mirror_configuration
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      operations_status: "{{ day2_cluster_image_mirror_configuration_section_current.status | default('unknown') }}"
      operations_reason_summary: "{{ day2_cluster_image_mirror_configuration_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_cluster_image_mirror_configuration_section: "{{ day2_cluster_image_mirror_configuration_section_current }}"
    capability_artifact_collection_inputs:
      cluster_image_mirror_configuration_present: "{{ ((day2_posture_summary | default({})).get('cluster_image_mirror_configuration_present', false)) | bool }}"
