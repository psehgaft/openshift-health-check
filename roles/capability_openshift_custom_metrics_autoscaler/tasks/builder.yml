---
- name: Build OpenShift custom metrics autoscaler capability artifact facts
  vars:
    day2_openshift_custom_metrics_autoscaler_section_current: "{{ (day2_capability_sections_by_key | default({})).get('openshift_custom_metrics_autoscaler', {}) }}"
    openshift_custom_metrics_autoscaler_present_current: "{{ ((day2_posture_summary | default({})).get('openshift_custom_metrics_autoscaler_present', false)) | bool }}"
  ansible.builtin.set_fact:
    capability_artifact_key: openshift_custom_metrics_autoscaler
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      openshift_custom_metrics_autoscaler_present: "{{ openshift_custom_metrics_autoscaler_present_current | bool }}"
      status_summary: "{{ day2_openshift_custom_metrics_autoscaler_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_openshift_custom_metrics_autoscaler_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_openshift_custom_metrics_autoscaler_section: "{{ day2_openshift_custom_metrics_autoscaler_section_current }}"
    capability_artifact_collection_inputs:
      openshift_custom_metrics_autoscaler_present: "{{ openshift_custom_metrics_autoscaler_present_current | bool }}"
