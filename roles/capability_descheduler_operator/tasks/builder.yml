---
- name: Build descheduler operator capability artifact facts
  vars:
    day2_descheduler_operator_section_current: "{{ (day2_capability_sections_by_key | default({})).get('descheduler_operator', {}) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: descheduler_operator
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      descheduler_operator_present: "{{ ((day2_posture_summary | default({})).get('descheduler_operator_present', false)) | bool }}"
      descheduler_operator_healthy: "{{ ((day2_posture_summary | default({})).get('descheduler_operator_healthy', false)) | bool }}"
      descheduler_operator_context_present: "{{ ((day2_posture_summary | default({})).get('descheduler_operator_context_present', false)) | bool }}"
      status_summary: "{{ day2_descheduler_operator_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_descheduler_operator_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_descheduler_operator_section: "{{ day2_descheduler_operator_section_current }}"
    capability_artifact_collection_inputs:
      descheduler_operator_present: "{{ ((day2_posture_summary | default({})).get('descheduler_operator_present', false)) | bool }}"
      descheduler_operator_healthy: "{{ ((day2_posture_summary | default({})).get('descheduler_operator_healthy', false)) | bool }}"
      descheduler_operator_context_present: "{{ ((day2_posture_summary | default({})).get('descheduler_operator_context_present', false)) | bool }}"
