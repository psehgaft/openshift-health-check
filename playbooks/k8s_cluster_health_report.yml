---
- name: Generate a Kubernetes cluster health report
  hosts: local
  gather_facts: true
  vars:
    platform_family: kubernetes
    provider_family: generic
    cluster_profile_mode: production
    kube_cli: kubectl
    report_output_dir: "{{ playbook_dir }}/../reports"
    report_basename: "k8s-cluster-health"
    report_generate_html: true
    report_generate_pdf: true
    report_run_mode: fresh
    collection_parallelism: 4
    local_resource_budget_cpu_pct: 50
    local_resource_budget_mem_pct: 50
    collection_command_timeout_seconds: 300
    keep_collection_artifacts: false
    warning_event_limit: 20
    top_restart_pod_limit: 15
    top_alert_group_limit: 15
    top_event_reason_limit: 15
    top_namespace_issue_limit: 15
    top_pvc_issue_limit: 20
    top_workload_issue_limit: 25
    top_security_issue_limit: 25
    top_certificate_issue_limit: 20
    top_deprecated_api_limit: 25
    platform_namespaces_regex: "^(default|openshift|openshift-.*|kube-system|kube-public|kube-node-lease|kube-.*|kubernetes-.*)$"
    user_namespaces_exclude_regex: "^(default|openshift|openshift-.*|kube-system|kube-public|kube-node-lease|kube-.*|kubernetes-.*)$"
    kubernetes_cluster_health_profile_source_path: >-
      {{
        playbook_dir ~ '/../inputs/' ~ (
          'aks-cluster-health-profile.yml'
          if (provider_family | default('generic')) == 'aks'
          else (
            'eks-cluster-health-profile.yml'
            if (provider_family | default('generic')) == 'eks'
            else (
              'gke-cluster-health-profile.yml'
              if (provider_family | default('generic')) == 'gke'
              else (
                'rancher-cluster-health-profile.yml'
                if (provider_family | default('generic')) == 'rancher'
                else (
                  'minikube-cluster-health-profile.yml'
                  if (provider_family | default('generic')) == 'minikube'
                  else (
                    'development-k8s-cluster-health-profile.yml'
                    if (cluster_profile_mode | default('production')) == 'development'
                    else 'kubernetes-cluster-health-profile.yml'
                  )
                )
              )
            )
          )
        )
      }}
    kubernetes_report_capability_profile:
      namespace_network_policy_baseline:
        required: true
        criticality: high
        expected_state: configured
        owner: security
        evidence_required: [kubectl-get]
        notes: "Production namespaces should have NetworkPolicy coverage unless the cluster has an approved alternate segmentation control."
        docs: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"
      namespace_resource_quota_governance:
        required: true
        criticality: high
        expected_state: configured
        owner: platform
        evidence_required: [kubectl-get]
        notes: "User namespaces should have ResourceQuota coverage to prevent noisy-neighbor resource exhaustion."
        docs: "https://kubernetes.io/docs/concepts/policy/resource-quotas/"
      namespace_limit_range_defaults:
        required: true
        criticality: medium
        expected_state: configured
        owner: platform
        evidence_required: [kubectl-get]
        notes: "User namespaces should have LimitRange defaults so workloads have predictable resource boundaries."
        docs: "https://kubernetes.io/docs/concepts/policy/limit-range/"
      workload_resilience_controls:
        required: true
        criticality: high
        expected_state: configured
        owner: app
        evidence_required: [kubectl-get]
        notes: "Production multi-replica workloads should use PodDisruptionBudgets and spread controls."
        docs: "https://kubernetes.io/docs/tasks/run-application/configure-pdb/"
      workload_resource_requests_limits:
        required: true
        criticality: high
        expected_state: configured
        owner: app
        evidence_required: [kubectl-get]
        notes: "Workloads should set resource requests and limits for scheduling accuracy, quota enforcement, and capacity planning."
        docs: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
      persistent_storage_integration:
        required: true
        criticality: high
        expected_state: present
        owner: storage
        evidence_required: [kubectl-get]
        notes: "Production clusters normally need external persistent storage instead of only local, hostPath, or ephemeral storage."
        docs: "https://kubernetes.io/docs/concepts/storage/storage-classes/"
      ingress_external_exposure:
        required: true
        criticality: medium
        expected_state: configured
        owner: network
        evidence_required: [kubectl-get]
        notes: "Ingress usage should be intentionally configured and reviewed for exposure, TLS, and ownership."
        docs: "https://kubernetes.io/docs/concepts/services-networking/ingress/"
      tls_certificate_lifecycle_hygiene:
        required: true
        criticality: medium
        expected_state: configured
        owner: security
        evidence_required: [kubectl-get]
        notes: "TLS certificates exposed through Kubernetes secrets should be inventoried and reviewed for expiry."
        docs: "https://kubernetes.io/docs/concepts/configuration/secret/#tls-secrets"
      deprecated_api_upgrade_review:
        required: true
        criticality: high
        expected_state: configured
        owner: platform
        evidence_required: [kubectl-get]
        notes: "Deprecated APIs and deprecated CRDs should be reviewed before upgrades."
        docs: "https://kubernetes.io/docs/reference/using-api/deprecation-guide/"
      backup_and_restore_readiness:
        required: true
        criticality: critical
        expected_state: healthy
        owner: operations
        evidence_required: [kubectl-get]
        notes: "Production clusters should have backup tooling plus evidence of successful backup and restore processes."
        docs: "https://velero.io/docs/latest/"
      external_log_forwarding:
        required: true
        criticality: high
        expected_state: configured
        owner: observability
        evidence_required: [kubectl-get]
        notes: "Cluster and application logs should have an intentional collection or forwarding path."
        docs: "https://kubernetes.io/docs/concepts/cluster-administration/logging/"
      external_monitoring_integration:
        required: true
        criticality: high
        expected_state: configured
        owner: observability
        evidence_required: [kubectl-get, metrics]
        notes: "Production clusters should have monitoring and alerting coverage through in-cluster or external systems."
        docs: "https://prometheus-operator.dev/docs/developer/getting-started/"
      user_workload_metrics_monitoring:
        required: true
        criticality: high
        expected_state: configured
        owner: observability
        evidence_required: [kubectl-get, metrics]
        notes: "Application teams should expose scrape configuration through ServiceMonitor, PodMonitor, or an approved equivalent."
        docs: "https://prometheus-operator.dev/docs/developer/getting-started/"
      grafana_metrics_dashboards:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [kubectl-get]
        notes: "Require when the customer expects in-cluster Grafana dashboards for application or platform metrics."
        docs: "https://grafana.github.io/grafana-operator/docs/"
      dynatrace_observability:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [kubectl-get, metrics]
        notes: "Require when Dynatrace Operator, DynaKube, OneAgent, ActiveGate, or related Dynatrace-managed observability components are expected on the cluster."
        docs: "https://docs.dynatrace.com/docs/ingest-from/setup-on-k8s"
      qualys_scanning_agents:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [kubectl-get]
        notes: "Require when Qualys Container Security sensors, Qualys Cloud Agent, or related Qualys scanning agents are expected to run on cluster nodes or workloads."
        docs: "https://docs.qualys.com/en/cs-sensor/latest/deploying_sensor_in_k8s/deploying_sensor_in_kubernetes.htm"
      prisma_twistlock_defenders:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [kubectl-get]
        notes: "Require when Prisma Cloud Compute or legacy Twistlock Defender agents are expected to protect cluster nodes or workloads."
        docs: "https://pan.dev/prisma-cloud/docs/cwpp/deploy-defenders/"
      aqua_security_platform:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [kubectl-get]
        notes: "Require when Aqua platform components such as Aqua Console, Aqua Gateway, Aqua Enforcer, kube-enforcer, or related Aqua-managed security services are expected on the cluster."
        docs: "https://github.com/aquasecurity/deployments"
      splunk_observability:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [kubectl-get, metrics]
        notes: "Require when Splunk OpenTelemetry Collector, Splunk Connect for Kubernetes, or other Splunk-managed telemetry components are expected on the cluster."
        docs: "https://help.splunk.com/en/splunk-enterprise/get-started/get-data-in/9.2/get-other-kinds-of-data-in/overview-of-the-splunk-opentelemetry-collector-for-kubernetes"
      loki_stack_logging:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [kubectl-get]
        notes: "Require when LokiStack or Loki-based in-cluster log storage is expected on the cluster."
        docs: "https://grafana.com/docs/loki/latest/setup/install/"
      datadog_observability:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [kubectl-get, metrics]
        notes: "Require when Datadog Operator, DatadogAgent custom resources, or Datadog agents are expected to collect cluster telemetry."
        docs: "https://docs.datadoghq.com/containers/kubernetes/installation/"
      appdynamics_observability:
        required: false
        criticality: medium
        expected_state: present
        owner: observability
        evidence_required: [kubectl-get, metrics]
        notes: "Require when AppDynamics Cluster Agent, InfraViz, or related AppDynamics observability components are expected on the cluster."
        docs: "https://docs.appdynamics.com/appd/24.x/latest/en/infrastructure-visibility/monitor-kubernetes-with-the-cluster-agent/install-the-cluster-agent"
      workloads_using_external_private_registries:
        required: false
        criticality: medium
        expected_state: configured
        owner: delivery
        evidence_required: [kubectl-get]
        notes: "Require when workloads are expected to pull application images from an external private registry."
        docs: "https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/"
      workload_autoscaling:
        required: false
        criticality: medium
        expected_state: configured
        owner: platform
        evidence_required: [kubectl-get, metrics]
        notes: "Require this when workload or node autoscaling is part of the customer operating model."
        docs: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"
      admission_policy_engine:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [kubectl-get]
        notes: "Require this when Gatekeeper, Kyverno, or another admission-policy engine is part of the security baseline."
        docs: "https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/"
      external_or_sealed_secrets_management:
        required: false
        criticality: medium
        expected_state: present
        owner: security
        evidence_required: [kubectl-get]
        notes: "Require this when external secret synchronization or sealed-secret workflows are part of the customer baseline."
        docs: "https://external-secrets.io/latest/"
      workload_vulnerability_scanning:
        required: false
        criticality: high
        expected_state: present
        owner: security
        evidence_required: [kubectl-get]
        notes: "Require when workload image vulnerability scanning or secured-cluster scanner agents are part of the security baseline."
        docs: "https://aquasecurity.github.io/trivy-operator/latest/"
      cluster_hosted_cicd_runners:
        required: false
        criticality: medium
        expected_state: present
        owner: delivery
        evidence_required: [kubectl-get, metrics]
        notes: "Show when GitLab, Jenkins, GitHub Actions, Azure DevOps, or generic runner pods are detected or required."
        docs: "https://docs.gitlab.com/runner/executors/kubernetes/"
      service_mesh_control_plane:
        required: false
        criticality: low
        expected_state: present
        owner: network
        evidence_required: [kubectl-get]
        notes: "Require this only when service mesh is part of the application platform baseline."
        docs: "https://istio.io/latest/docs/setup/install/"
      provider_node_pool_inventory:
        required: true
        criticality: medium
        expected_state: configured
        owner: platform
        evidence_required: [kubectl-get, provider-api]
        notes: "Managed or provider-backed clusters should expose enough node-pool, zone, and provider metadata for capacity and resilience review."
        docs: "https://kubernetes.io/docs/reference/labels-annotations-taints/"
  tasks:
    - name: Load canonical Kubernetes cluster health profile
      ansible.builtin.include_vars:
        file: "{{ kubernetes_cluster_health_profile_source_path }}"
        name: canonical_kubernetes_cluster_health_profile

    - name: Apply canonical Kubernetes cluster health profile
      ansible.builtin.set_fact:
        kubernetes_report_capability_profile: "{{ canonical_kubernetes_cluster_health_profile.kubernetes_report_capability_profile }}"

    - name: Run Kubernetes cluster health report scaffold
      block:
        - name: Define Kubernetes run checkpoint paths
          ansible.builtin.set_fact:
            report_resume_state_dir: "{{ report_output_dir }}/.run-state/{{ platform_family }}"
            report_resume_manifest_path: "{{ report_output_dir }}/.run-state/{{ platform_family }}/latest.json"

        - name: Reset prior Kubernetes run checkpoint state for fresh run
          ansible.builtin.file:
            path: "{{ report_resume_state_dir }}"
            state: absent
          when: report_run_mode | default('fresh') == 'fresh'

        - name: Validate Kubernetes run mode
          ansible.builtin.assert:
            that:
              - (report_run_mode | default('fresh')) in ['fresh', 'resume_last_failure']
            fail_msg: "Set report_run_mode to fresh or resume_last_failure."

        - name: Check for resumable Kubernetes manifest
          ansible.builtin.stat:
            path: "{{ report_resume_manifest_path }}"
          register: report_resume_manifest_stat
          when: report_run_mode | default('fresh') == 'resume_last_failure'

        - name: Fail when Kubernetes resume manifest is missing
          ansible.builtin.assert:
            that:
              - report_resume_manifest_stat.stat.exists
            fail_msg: "No resumable checkpoint manifest was found. Use report_run_mode=fresh first."
          when: report_run_mode | default('fresh') == 'resume_last_failure'

        - name: Load Kubernetes resume manifest
          ansible.builtin.slurp:
            path: "{{ report_resume_manifest_path }}"
          register: report_resume_manifest_raw
          when: report_run_mode | default('fresh') == 'resume_last_failure'

        - name: Decode Kubernetes resume manifest
          ansible.builtin.set_fact:
            report_resume_manifest_parse:
              ok: true
              data: "{{ report_resume_manifest_raw.content | b64decode | from_yaml }}"
              error: ""
          when: report_run_mode | default('fresh') == 'resume_last_failure'

        - name: Set Kubernetes resume manifest data
          ansible.builtin.set_fact:
            report_resume_manifest: "{{ report_resume_manifest_parse.data if (report_resume_manifest_parse.ok | default(false)) else {} }}"
          when: report_run_mode | default('fresh') == 'resume_last_failure'

        - name: Validate Kubernetes resume manifest JSON
          ansible.builtin.assert:
            that:
              - report_resume_manifest_parse.ok | default(false)
            fail_msg: "The resume manifest exists but could not be parsed. {{ report_resume_manifest_parse.error | default('Unknown parse error.') }}"
          when: report_run_mode | default('fresh') == 'resume_last_failure'

        - name: Validate Kubernetes resume manifest content
          ansible.builtin.assert:
            that:
              - (report_resume_manifest.status | default('')) in ['failed', 'completed']
              - (report_resume_manifest.snapshot_path | default('') | length) > 0
              - (report_resume_manifest.resume_next_stage | default('') | length) > 0
            fail_msg: "The last saved Kubernetes checkpoint is not resumable. Use report_run_mode=fresh."
          when: report_run_mode | default('fresh') == 'resume_last_failure'

        - name: Load Kubernetes resume checkpoint snapshot
          ansible.builtin.include_vars:
            file: "{{ report_resume_manifest.snapshot_path }}"
          when: report_run_mode | default('fresh') == 'resume_last_failure'

        - name: Restore Kubernetes checkpoint pointers from manifest
          ansible.builtin.set_fact:
            report_resume_last_snapshot_path: "{{ report_resume_manifest.snapshot_path | default('') }}"
            report_resume_last_completed_stage: "{{ report_resume_manifest.last_completed_stage | default('') }}"
            report_resume_last_resume_next_stage: "{{ report_resume_manifest.resume_next_stage | default('') }}"
          when: report_run_mode | default('fresh') == 'resume_last_failure'

        - name: Run fresh Kubernetes workflow
          when: report_run_mode | default('fresh') == 'fresh'
          block:
            - name: Run common preflight
              ansible.builtin.include_role:
                name: preflight_common

            - name: Run Kubernetes preflight
              ansible.builtin.include_role:
                name: preflight_kubernetes

            - name: Run common collection scaffold
              ansible.builtin.include_role:
                name: collect_common

            - name: Run Kubernetes collection extension
              ansible.builtin.include_role:
                name: collect_kubernetes

            - name: Save Kubernetes collection checkpoint
              ansible.builtin.include_role:
                name: report_common
                tasks_from: save_run_checkpoint.yml
              vars:
                run_checkpoint_stage: collection
                run_checkpoint_resume_next_stage: analysis
                run_checkpoint_status: completed
                run_checkpoint_write_snapshot: true

            - name: Run common analysis
              ansible.builtin.include_role:
                name: analyze_common

            - name: Run Kubernetes analysis extension
              ansible.builtin.include_role:
                name: analyze_kubernetes

            - name: Save Kubernetes analysis checkpoint
              ansible.builtin.include_role:
                name: report_common
                tasks_from: save_run_checkpoint.yml
              vars:
                run_checkpoint_stage: analysis
                run_checkpoint_resume_next_stage: report
                run_checkpoint_status: completed
                run_checkpoint_write_snapshot: true

            - name: Run common reporting scaffold
              ansible.builtin.include_role:
                name: report_common

            - name: Mark Kubernetes run checkpoint as completed
              ansible.builtin.include_role:
                name: report_common
                tasks_from: save_run_checkpoint.yml
              vars:
                run_checkpoint_stage: render
                run_checkpoint_resume_next_stage: ""
                run_checkpoint_status: completed
                run_checkpoint_write_snapshot: false
          rescue:
            - name: Record failed fresh Kubernetes run checkpoint
              ansible.builtin.include_role:
                name: report_common
                tasks_from: save_run_checkpoint.yml
              vars:
                run_checkpoint_stage: "{{ report_resume_last_resume_next_stage or 'collection' }}"
                run_checkpoint_resume_next_stage: "{{ report_resume_last_resume_next_stage or 'collection' }}"
                run_checkpoint_status: failed
                run_checkpoint_failed_task: "{{ ansible_failed_task.name | default('unknown-task') }}"
                run_checkpoint_failed_message: >-
                  {{
                    ansible_failed_result.msg
                    | default(ansible_failed_result.stderr)
                    | default(ansible_failed_result.stdout)
                    | default(ansible_failed_result | string)
                  }}
                run_checkpoint_write_snapshot: false
            - name: Re-raise fresh Kubernetes workflow failure
              ansible.builtin.fail:
                msg: >-
                  Kubernetes workflow failed in task
                  '{{ ansible_failed_task.name | default("unknown-task") }}'.
                  {{
                    ansible_failed_result.msg
                    | default(ansible_failed_result.stderr)
                    | default(ansible_failed_result.stdout)
                    | default(ansible_failed_result | string)
                  }}
                  Re-run with report_run_mode=resume_last_failure to continue from the last saved checkpoint.

        - name: Resume Kubernetes workflow from checkpoint
          when: report_run_mode | default('fresh') == 'resume_last_failure'
          block:
            - name: Resume Kubernetes analysis and report stages
              when: (report_resume_manifest.resume_next_stage | default('')) == 'analysis'
              block:
                - name: Run common analysis
                  ansible.builtin.include_role:
                    name: analyze_common

                - name: Run Kubernetes analysis extension
                  ansible.builtin.include_role:
                    name: analyze_kubernetes

                - name: Save resumed Kubernetes analysis checkpoint
                  ansible.builtin.include_role:
                    name: report_common
                    tasks_from: save_run_checkpoint.yml
                  vars:
                    run_checkpoint_stage: analysis
                    run_checkpoint_resume_next_stage: report
                    run_checkpoint_status: completed
                    run_checkpoint_write_snapshot: true

                - name: Run common reporting scaffold
                  ansible.builtin.include_role:
                    name: report_common

            - name: Resume Kubernetes report stage only
              when: (report_resume_manifest.resume_next_stage | default('')) == 'report'
              ansible.builtin.include_role:
                name: report_common

            - name: Mark resumed Kubernetes run checkpoint as completed
              ansible.builtin.include_role:
                name: report_common
                tasks_from: save_run_checkpoint.yml
              vars:
                run_checkpoint_stage: render
                run_checkpoint_resume_next_stage: ""
                run_checkpoint_status: completed
                run_checkpoint_write_snapshot: false
          rescue:
            - name: Record failed resumed Kubernetes run checkpoint
              ansible.builtin.include_role:
                name: report_common
                tasks_from: save_run_checkpoint.yml
              vars:
                run_checkpoint_stage: "{{ report_resume_manifest.resume_next_stage or 'report' }}"
                run_checkpoint_resume_next_stage: "{{ report_resume_manifest.resume_next_stage or 'report' }}"
                run_checkpoint_status: failed
                run_checkpoint_failed_task: "{{ ansible_failed_task.name | default('unknown-task') }}"
                run_checkpoint_failed_message: >-
                  {{
                    ansible_failed_result.msg
                    | default(ansible_failed_result.stderr)
                    | default(ansible_failed_result.stdout)
                    | default(ansible_failed_result | string)
                  }}
                run_checkpoint_write_snapshot: false
            - name: Re-raise resumed Kubernetes workflow failure
              ansible.builtin.fail:
                msg: >-
                  Resumed Kubernetes workflow failed again in task
                  '{{ ansible_failed_task.name | default("unknown-task") }}'.
                  {{
                    ansible_failed_result.msg
                    | default(ansible_failed_result.stderr)
                    | default(ansible_failed_result.stdout)
                    | default(ansible_failed_result | string)
                  }}
                  Fix the reported issue and rerun with report_run_mode=resume_last_failure or use report_run_mode=fresh for a clean restart.

      always:
        - name: Ensure temporary collection artifacts are removed
          ansible.builtin.file:
            path: "{{ collection_run_metadata.results_path | dirname }}"
            state: absent
          when:
            - not (keep_collection_artifacts | default(false) | bool)
            - collection_run_metadata is defined
            - collection_run_metadata.results_path | default('') | length > 0
          failed_when: false
