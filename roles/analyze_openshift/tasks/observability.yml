---
- name: Build warning event summaries
  ansible.builtin.set_fact:
    warning_event_reason_counts: "{{ warning_event_reason_counts | default({}) | combine({event_reason: ((warning_event_reason_counts[event_reason] | default(0)) + 1)}, recursive=True) }}"
  loop: "{{ (analysis_graph.events | default({})).get('items', []) }}"
  vars:
    event_reason: "{{ item.reason | default('Unknown') }}"
  changed_when: false

- name: Parse monitoring config YAML
  vars:
    graph_configmaps: "{{ (analysis_graph.configmaps | default({'items': []})).get('items', []) }}"
    cluster_monitoring_config_obj: "{{ (graph_configmaps | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring') | selectattr('metadata.name', 'equalto', 'cluster-monitoring-config') | list | first) | default({}) }}"
    user_workload_monitoring_config_obj: "{{ (graph_configmaps | selectattr('metadata.namespace', 'equalto', 'openshift-user-workload-monitoring') | selectattr('metadata.name', 'equalto', 'user-workload-monitoring-config') | list | first) | default({}) }}"
  ansible.builtin.set_fact:
    cluster_monitoring_config_parsed: "{{ ((cluster_monitoring_config_obj.data['config.yaml'] | default('')) | from_yaml) if (cluster_monitoring_config_obj.data is defined and cluster_monitoring_config_obj.data['config.yaml'] is defined) else {} }}"
    user_workload_monitoring_config_parsed: "{{ ((user_workload_monitoring_config_obj.data['config.yaml'] | default('')) | from_yaml) if (user_workload_monitoring_config_obj.data is defined and user_workload_monitoring_config_obj.data['config.yaml'] is defined) else {} }}"

- name: Attempt to discover thanos querier route
  ansible.builtin.command: oc -n openshift-monitoring get route thanos-querier -o jsonpath={.spec.host}
  register: thanos_route_cmd
  changed_when: false
  failed_when: false
  when: (report_mode_resolved | default('live')) == 'live'

- name: Capture bearer token
  ansible.builtin.command: oc whoami -t
  register: oc_token_cmd
  changed_when: false
  failed_when: false
  when: (report_mode_resolved | default('live')) == 'live'

- name: Attempt API server readyz check
  ansible.builtin.command: oc get --raw=/readyz?verbose
  register: apiserver_readyz_cmd
  changed_when: false
  failed_when: false
  when: (report_mode_resolved | default('live')) == 'live'

- name: Build observability forwarding summary
  ansible.builtin.set_fact:
    observability_forwarding_summary:
      monitoring_operator_available: >-
        {{
          clusteroperator_status_map.monitoring.available
          if ((clusteroperator_status_map | default({})).get('monitoring', {}) | length) > 0
          else (
            'True'
            if (
              (
                (analysis_graph.namespaces | default({'items': []})).get('items', [])
                | selectattr('metadata.name', 'equalto', 'openshift-monitoring')
                | list
                | length
              ) > 0
              and (
                (
                  (analysis_graph.pods | default({'items': []})).get('items', [])
                  | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring')
                  | list
                  | length
                ) > 0
                or (
                  (analysis_graph.deployments | default({'items': []})).get('items', [])
                  | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring')
                  | list
                  | length
                ) > 0
              )
            )
            else 'Unknown'
          )
        }}
      monitoring_operator_degraded: >-
        {{
          clusteroperator_status_map.monitoring.degraded
          if ((clusteroperator_status_map | default({})).get('monitoring', {}) | length) > 0
          else (
            'False'
            if (
              (
                (analysis_graph.namespaces | default({'items': []})).get('items', [])
                | selectattr('metadata.name', 'equalto', 'openshift-monitoring')
                | list
                | length
              ) > 0
              and (
                (
                  (analysis_graph.pods | default({'items': []})).get('items', [])
                  | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring')
                  | list
                  | length
                ) > 0
                or (
                  (analysis_graph.deployments | default({'items': []})).get('items', [])
                  | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring')
                  | list
                  | length
                ) > 0
              )
            )
            else 'Unknown'
          )
        }}
      thanos_querier_route_found: >-
        {{
          (
            (analysis_graph.routes | default({'items': []})).get('items', [])
            | selectattr('metadata.namespace', 'equalto', 'openshift-monitoring')
            | selectattr('metadata.name', 'equalto', 'thanos-querier')
            | list
            | length
          ) > 0
        }}
      cluster_log_forwarder_count: "{{ (analysis_graph.clusterlogforwarders | default({})).get('items', []) | length }}"
      alertmanagerconfig_count: "{{ (analysis_graph.alertmanagerconfigs | default({})).get('items', []) | length }}"
      cluster_alertmanager_additional_config_count: "{{ ((((cluster_monitoring_config_parsed.alertmanagerMain | default({})).additionalAlertmanagerConfigs | default([])) | length)) }}"
      user_workload_alertmanager_additional_config_count: "{{ ((((user_workload_monitoring_config_parsed.alertmanager | default({})).additionalAlertmanagerConfigs | default([])) | length)) }}"
      log_forwarding_outputs: []
      external_log_forwarding_outputs: []
      external_alert_receivers: []
      alert_delivery_config_sources: []
      alert_delivery_source_count: 0
      external_alert_receiver_count: 0
      external_alert_delivery_configured: false
      alert_routing_to_external_receiver_configured: false
      alertmanagerconfigs_with_external_routes: 0
      alertmanagerconfigs_without_route_receivers: 0
      application_log_pipeline_count: 0
      infrastructure_log_pipeline_count: 0
      audit_log_pipeline_count: 0
      application_logs_collected: false
      infrastructure_logs_collected: false
      audit_logs_collected: false
      application_logs_exported_external: false
      infrastructure_logs_exported_external: false
      audit_logs_exported_external: false
      application_logs_delivery_state: not-collected
      infrastructure_logs_delivery_state: not-collected
      audit_logs_delivery_state: not-collected
      logs_delivery_verification_status: not-configured
      cluster_metrics_remote_write_count: "{{ (((cluster_monitoring_config_parsed.prometheusK8s | default({})).remoteWrite | default([])) | length) }}"
      user_workload_metrics_remote_write_count: "{{ (((user_workload_monitoring_config_parsed.prometheus | default({})).remoteWrite | default([])) | length) }}"
      external_cluster_metrics_remote_write_count: 0
      external_user_workload_metrics_remote_write_count: 0
      cluster_metrics_delivery_state: not-configured
      user_workload_metrics_delivery_state: not-configured
      metrics_delivery_verification_status: not-configured
      alert_delivery_state: not-configured
      alert_delivery_verification_status: not-configured

- name: Update thanos route capability in observability summary
  ansible.builtin.set_fact:
    observability_forwarding_summary: "{{ observability_forwarding_summary | combine({'thanos_querier_route_found': (((thanos_route_cmd.rc | default(1)) == 0 and (thanos_route_cmd.stdout | default('') | trim | length > 0)) or (observability_forwarding_summary.thanos_querier_route_found | default(false)))}, recursive=True) }}"

- name: Build log forwarding findings
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json

    data = json.loads(r'''{{ {
      "items": (analysis_graph.clusterlogforwarders | default({})).get('items', [])
    } | to_json }}''')

    findings = []
    outputs = []
    external_outputs = []
    pipeline_counts = {"application": 0, "infrastructure": 0, "audit": 0}
    external_pipeline_counts = {"application": 0, "infrastructure": 0, "audit": 0}

    def is_external_url(url):
        if not url:
            return False
        s = str(url).lower()
        return not (".svc" in s or ".cluster.local" in s or s.startswith("http://localhost") or s.startswith("https://localhost"))

    def output_is_external(output):
        otype = str(output.get("type", "")).lower()
        url = output.get("url") or output.get("endpoint") or output.get("host") or ""
        if is_external_url(url):
            return True
        if otype in {"cloudwatch", "azuremonitor", "googlecloudlogging"}:
            return True
        return False

    def normalize_inputs(pipeline):
        refs = pipeline.get("inputRefs")
        if isinstance(refs, list):
            return [str(item).lower() for item in refs if item not in (None, "")]
        if refs not in (None, ""):
            return [str(refs).lower()]
        input_ref = pipeline.get("inputRef")
        if input_ref not in (None, ""):
            return [str(input_ref).lower()]
        return []

    for clf in data["items"]:
        ns = clf.get("metadata", {}).get("namespace", "")
        name = clf.get("metadata", {}).get("name", "")
        spec = clf.get("spec", {}) or {}
        pipelines = spec.get("pipelines", []) or []
        output_refs = set()
        for pipeline in pipelines:
            for ref in pipeline.get("outputRefs", []) or []:
                output_refs.add(ref)
        current_outputs = spec.get("outputs", []) or []
        output_by_name = {str(item.get("name", "")): item for item in current_outputs if item.get("name")}
        if not current_outputs:
            findings.append({
                "issue": "clusterlogforwarder-without-outputs",
                "detail": f"{ns}/{name} has no outputs"
            })
        for output in current_outputs:
            output_name = output.get("name", "")
            record = {
                "namespace": ns,
                "clusterlogforwarder": name,
                "name": output_name,
                "type": output.get("type", "unknown"),
                "target": output.get("url") or output.get("endpoint") or output.get("host") or ""
            }
            outputs.append(record)
            if output_is_external(output):
                external_outputs.append(record)
        for pipeline in pipelines:
            input_refs = normalize_inputs(pipeline)
            pipeline_output_refs = [str(ref) for ref in (pipeline.get("outputRefs", []) or []) if ref not in (None, "")]
            pipeline_external = any(output_is_external(output_by_name.get(ref, {})) for ref in pipeline_output_refs)
            for log_type in ("application", "infrastructure", "audit"):
                if log_type in input_refs:
                    pipeline_counts[log_type] += 1
                    if pipeline_external:
                        external_pipeline_counts[log_type] += 1
        if current_outputs and not any(output_is_external(o) for o in current_outputs):
            findings.append({
                "issue": "logs-not-forwarded-to-external-destination",
                "detail": f"{ns}/{name} outputs appear cluster-local only"
            })
        if pipelines and not output_refs:
            findings.append({
                "issue": "clusterlogforwarder-pipelines-without-outputrefs",
                "detail": f"{ns}/{name} has pipelines with no outputRefs"
            })

    if not data["items"] and {{ require_cluster_log_forwarder | bool | to_json }}:
        findings.append({
            "issue": "missing-clusterlogforwarder",
            "detail": "no ClusterLogForwarder resource found"
        })

    for log_type in ("application", "infrastructure", "audit"):
        if {{ require_cluster_log_forwarder | bool | to_json }}:
            if pipeline_counts[log_type] == 0:
                findings.append({
                    "issue": f"{log_type}-logs-not-collected",
                    "detail": f"no ClusterLogForwarder pipeline was found for {log_type} logs"
                })
            elif external_pipeline_counts[log_type] == 0:
                findings.append({
                    "issue": f"{log_type}-logs-not-exported-external",
                    "detail": f"{log_type} logs appear to be collected but not forwarded to an external destination"
                })

    print(json.dumps({
        "findings": findings,
        "outputs": outputs,
        "external_outputs": external_outputs,
        "pipeline_counts": pipeline_counts,
        "external_pipeline_counts": external_pipeline_counts
    }))
    PY
  register: observability_log_forwarding_cmd
  changed_when: false
  failed_when: false

- name: Normalize log forwarding findings
  ansible.builtin.set_fact:
    observability_log_forwarding_data: "{{ observability_log_forwarding_cmd.stdout | from_json if (observability_log_forwarding_cmd.rc == 0 and (observability_log_forwarding_cmd.stdout | default('') | length > 0)) else {'findings': [], 'outputs': [], 'external_outputs': [], 'pipeline_counts': {'application': 0, 'infrastructure': 0, 'audit': 0}, 'external_pipeline_counts': {'application': 0, 'infrastructure': 0, 'audit': 0}} }}"

- name: Build metrics forwarding findings
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json

    data = json.loads(r'''{{ {
      "cluster_remote_write": ((cluster_monitoring_config_parsed.prometheusK8s | default({})).remoteWrite | default([])),
      "user_remote_write": ((user_workload_monitoring_config_parsed.prometheus | default({})).remoteWrite | default([]))
    } | to_json }}''')

    findings = []

    def is_external_url(url):
        if not url:
            return False
        s = str(url).lower()
        return not (".svc" in s or ".cluster.local" in s or s.startswith("http://localhost") or s.startswith("https://localhost"))

    cluster_external = [item for item in data["cluster_remote_write"] if is_external_url(item.get("url", ""))]
    user_external = [item for item in data["user_remote_write"] if is_external_url(item.get("url", ""))]

    if {{ require_external_metrics_remote_write | bool | to_json }}:
        if not data["cluster_remote_write"]:
            findings.append({
                "issue": "cluster-metrics-remote-write-missing",
                "detail": "cluster-monitoring-config has no prometheusK8s.remoteWrite target"
            })
        elif not cluster_external:
            findings.append({
                "issue": "cluster-metrics-not-forwarded-external",
                "detail": "prometheusK8s.remoteWrite targets appear cluster-local only"
            })

        if not data["user_remote_write"]:
            findings.append({
                "issue": "user-workload-metrics-remote-write-missing",
                "detail": "user-workload-monitoring-config has no prometheus.remoteWrite target"
            })
        elif not user_external:
            findings.append({
                "issue": "user-workload-metrics-not-forwarded-external",
                "detail": "user workload remoteWrite targets appear cluster-local only"
            })

    print(json.dumps({
        "findings": findings,
        "cluster_external_count": len(cluster_external),
        "user_external_count": len(user_external)
    }))
    PY
  register: observability_metrics_forwarding_cmd
  changed_when: false
  failed_when: false

- name: Normalize metrics forwarding findings
  ansible.builtin.set_fact:
    observability_metrics_forwarding_data: "{{ observability_metrics_forwarding_cmd.stdout | from_json if (observability_metrics_forwarding_cmd.rc == 0 and (observability_metrics_forwarding_cmd.stdout | default('') | length > 0)) else {'findings': [], 'cluster_external_count': 0, 'user_external_count': 0} }}"

- name: Build external alert delivery findings
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json

    data = json.loads(r'''{{ {
      "items": (analysis_graph.alertmanagerconfigs | default({})).get('items', []),
      "cluster_alertmanager_additional_configs": (((cluster_monitoring_config_parsed.alertmanagerMain | default({})).additionalAlertmanagerConfigs | default([]))),
      "user_workload_alertmanager_additional_configs": (((user_workload_monitoring_config_parsed.alertmanager | default({})).additionalAlertmanagerConfigs | default([])))
    } | to_json }}''')

    findings = []
    receivers = []
    config_sources = []
    supported_receiver_keys = [
        ("slackConfigs", "slack"),
        ("pagerdutyConfigs", "pagerduty"),
        ("opsgenieConfigs", "opsgenie"),
        ("victorOpsConfigs", "victorops"),
        ("webhookConfigs", "webhook"),
        ("wechatConfigs", "wechat"),
        ("emailConfigs", "email"),
    ]

    def describe_target(receiver_type, cfg):
        if receiver_type == "slack":
            return cfg.get("channel") or "configured"
        if receiver_type == "webhook":
            return cfg.get("url") or "secret-or-config-ref"
        if receiver_type == "email":
            return cfg.get("to") or "configured"
        if receiver_type in {"pagerduty", "opsgenie", "victorops", "wechat"}:
            return "configured"
        return "configured"

    def collect_route_receivers(route_obj, result):
        route_obj = route_obj or {}
        receiver = route_obj.get("receiver")
        if receiver:
            result.add(str(receiver))
        for child in route_obj.get("routes", []) or []:
            collect_route_receivers(child, result)

    configs_with_external_routes = 0
    configs_without_route_receivers = 0
    for item in data.get("items", []):
        meta = item.get("metadata", {}) or {}
        namespace = meta.get("namespace", "")
        config_name = meta.get("name", "")
        external_receiver_names = set()
        for receiver in (item.get("spec", {}) or {}).get("receivers", []) or []:
            receiver_name = receiver.get("name", "unnamed")
            for key, receiver_type in supported_receiver_keys:
                for cfg in receiver.get(key, []) or []:
                    external_receiver_names.add(receiver_name)
                    receivers.append({
                        "namespace": namespace,
                        "alertmanagerconfig": config_name,
                        "receiver": receiver_name,
                        "type": receiver_type,
                        "target": describe_target(receiver_type, cfg),
                    })
        if external_receiver_names:
            config_sources.append({
                "source": "AlertmanagerConfig",
                "namespace": namespace,
                "name": config_name,
            })

        route_receivers = set()
        collect_route_receivers((item.get("spec", {}) or {}).get("route") or {}, route_receivers)
        routed_external_receivers = sorted(route_receivers.intersection(external_receiver_names))
        if external_receiver_names and routed_external_receivers:
            configs_with_external_routes += 1
        elif external_receiver_names and not route_receivers:
            configs_without_route_receivers += 1
            findings.append({
                "issue": "alertmanagerconfig-route-missing",
                "detail": f"{namespace}/{config_name} defines external receivers but no route receiver was configured"
            })
        elif external_receiver_names and not routed_external_receivers:
            findings.append({
                "issue": "external-alert-receiver-not-routed",
                "detail": f"{namespace}/{config_name} defines external receivers that are not referenced by any route"
            })

    cluster_additional_count = len(data.get("cluster_alertmanager_additional_configs") or [])
    user_additional_count = len(data.get("user_workload_alertmanager_additional_configs") or [])
    if cluster_additional_count > 0:
        config_sources.append({
            "source": "cluster-monitoring-config",
            "namespace": "openshift-monitoring",
            "name": "alertmanagerMain.additionalAlertmanagerConfigs",
        })
    if user_additional_count > 0:
        config_sources.append({
            "source": "user-workload-monitoring-config",
            "namespace": "openshift-user-workload-monitoring",
            "name": "alertmanager.additionalAlertmanagerConfigs",
        })

    if not receivers and not config_sources:
        findings.append({
            "issue": "external-alert-delivery-not-configured",
            "detail": "no AlertmanagerConfig receiver was found for supported external channels such as email, Slack, PagerDuty, Opsgenie, VictorOps, webhook, or WeChat"
        })
    elif not receivers and config_sources:
        findings.append({
            "issue": "external-alert-delivery-not-verifiable",
            "detail": "additional Alertmanager configuration was detected, but no explicit externally routed receivers were visible in AlertmanagerConfig resources"
        })

    print(json.dumps({
        "findings": findings,
        "receivers": receivers,
        "config_sources": config_sources,
        "alert_delivery_source_count": len(config_sources),
        "external_alert_receiver_count": len(receivers),
        "external_alert_delivery_configured": len(receivers) > 0,
        "alert_routing_to_external_receiver_configured": configs_with_external_routes > 0,
        "alertmanagerconfigs_with_external_routes": configs_with_external_routes,
        "alertmanagerconfigs_without_route_receivers": configs_without_route_receivers
    }))
    PY
  register: observability_alert_delivery_cmd
  changed_when: false
  failed_when: false

- name: Normalize external alert delivery findings
  ansible.builtin.set_fact:
    observability_alert_delivery_data: "{{ observability_alert_delivery_cmd.stdout | from_json if (observability_alert_delivery_cmd.rc == 0 and (observability_alert_delivery_cmd.stdout | default('') | length > 0)) else {'findings': [], 'receivers': [], 'config_sources': [], 'alert_delivery_source_count': 0, 'external_alert_receiver_count': 0, 'external_alert_delivery_configured': false, 'alert_routing_to_external_receiver_configured': false, 'alertmanagerconfigs_with_external_routes': 0, 'alertmanagerconfigs_without_route_receivers': 0} }}"

- name: Build observability findings and summary
  ansible.builtin.set_fact:
    observability_findings: "{{ (observability_log_forwarding_data.findings | default([])) + (observability_metrics_forwarding_data.findings | default([])) + (observability_alert_delivery_data.findings | default([])) + observability_platform_findings }}"
    observability_forwarding_summary: "{{ observability_forwarding_summary | combine(observability_forwarding_updates, recursive=True) }}"
  vars:
    observability_platform_findings: >-
      {{
        ([] +
        ([{'issue': 'monitoring-operator-not-healthy', 'detail': 'monitoring cluster operator is unavailable or degraded'}] if (clusteroperator_status_map.monitoring.available | default('Unknown')) != 'True' or (clusteroperator_status_map.monitoring.degraded | default('False')) == 'True' else []))
      }}
    observability_forwarding_updates:
      log_forwarding_outputs: "{{ observability_log_forwarding_data.outputs | default([]) }}"
      external_log_forwarding_outputs: "{{ observability_log_forwarding_data.external_outputs | default([]) }}"
      application_log_pipeline_count: "{{ (observability_log_forwarding_data.pipeline_counts | default({})).application | default(0) }}"
      infrastructure_log_pipeline_count: "{{ (observability_log_forwarding_data.pipeline_counts | default({})).infrastructure | default(0) }}"
      audit_log_pipeline_count: "{{ (observability_log_forwarding_data.pipeline_counts | default({})).audit | default(0) }}"
      application_logs_collected: "{{ (((observability_log_forwarding_data.pipeline_counts | default({})).application | default(0)) | int) > 0 }}"
      infrastructure_logs_collected: "{{ (((observability_log_forwarding_data.pipeline_counts | default({})).infrastructure | default(0)) | int) > 0 }}"
      audit_logs_collected: "{{ (((observability_log_forwarding_data.pipeline_counts | default({})).audit | default(0)) | int) > 0 }}"
      application_logs_exported_external: "{{ (((observability_log_forwarding_data.external_pipeline_counts | default({})).application | default(0)) | int) > 0 }}"
      infrastructure_logs_exported_external: "{{ (((observability_log_forwarding_data.external_pipeline_counts | default({})).infrastructure | default(0)) | int) > 0 }}"
      audit_logs_exported_external: "{{ (((observability_log_forwarding_data.external_pipeline_counts | default({})).audit | default(0)) | int) > 0 }}"
      application_logs_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((((observability_log_forwarding_data.external_pipeline_counts | default({})).application | default(0)) | int) > 0)
          else (
            'cluster-local-only'
            if ((((observability_log_forwarding_data.pipeline_counts | default({})).application | default(0)) | int) > 0)
            else 'not-collected'
          )
        }}
      infrastructure_logs_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((((observability_log_forwarding_data.external_pipeline_counts | default({})).infrastructure | default(0)) | int) > 0)
          else (
            'cluster-local-only'
            if ((((observability_log_forwarding_data.pipeline_counts | default({})).infrastructure | default(0)) | int) > 0)
            else 'not-collected'
          )
        }}
      audit_logs_delivery_state: >-
        {{
          'externally-configured-not-verified'
          if ((((observability_log_forwarding_data.external_pipeline_counts | default({})).audit | default(0)) | int) > 0)
          else (
            'cluster-local-only'
            if ((((observability_log_forwarding_data.pipeline_counts | default({})).audit | default(0)) | int) > 0)
            else 'not-collected'
          )
        }}
      logs_delivery_verification_status: >-
        {{
          'not-verified'
          if ((observability_log_forwarding_data.outputs | default([]) | length) > 0)
          else 'not-configured'
        }}
      external_alert_receivers: "{{ observability_alert_delivery_data.receivers | default([]) }}"
      alert_delivery_config_sources: "{{ observability_alert_delivery_data.config_sources | default([]) }}"
      alert_delivery_source_count: "{{ observability_alert_delivery_data.alert_delivery_source_count | default(0) }}"
      external_alert_receiver_count: "{{ observability_alert_delivery_data.external_alert_receiver_count | default(0) }}"
