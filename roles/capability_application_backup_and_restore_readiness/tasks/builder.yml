---
- name: Build application backup and restore readiness capability artifact facts
  vars:
    day2_application_backup_and_restore_readiness_section_current: "{{ (((day2_capability_sections | default([])) | selectattr('key', 'equalto', 'application_backup_and_restore_readiness') | list | first) | default({})) }}"
  ansible.builtin.set_fact:
    capability_artifact_key: application_backup_and_restore_readiness
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      application_backup_ready: "{{ ((day2_posture_summary | default({})).get('application_backup_ready', false)) | bool }}"
      data_protection_application_count: "{{ ((day2_posture_summary | default({})).get('data_protection_application_count', 0)) | int }}"
      backup_storage_location_count: "{{ ((day2_posture_summary | default({})).get('backup_storage_location_count', 0)) | int }}"
      backup_schedule_count: "{{ ((day2_posture_summary | default({})).get('backup_schedule_count', 0)) | int }}"
      successful_backup_count: "{{ ((day2_posture_summary | default({})).get('successful_backup_count', 0)) | int }}"
      clean_successful_backup_count: "{{ ((day2_posture_summary | default({})).get('clean_successful_backup_count', 0)) | int }}"
      clean_completed_restore_count: "{{ ((day2_posture_summary | default({})).get('clean_completed_restore_count', 0)) | int }}"
      status_summary: "{{ day2_application_backup_and_restore_readiness_section_current.status | default('unknown') }}"
      reason_summary: "{{ day2_application_backup_and_restore_readiness_section_current.top_detail | default('unknown') }}"
    capability_artifact_render_inputs:
      day2_application_backup_and_restore_readiness_section: "{{ day2_application_backup_and_restore_readiness_section_current }}"
    capability_artifact_collection_inputs:
      application_backup_ready: "{{ ((day2_posture_summary | default({})).get('application_backup_ready', false)) | bool }}"
      data_protection_application_count: "{{ ((day2_posture_summary | default({})).get('data_protection_application_count', 0)) | int }}"
      backup_storage_location_count: "{{ ((day2_posture_summary | default({})).get('backup_storage_location_count', 0)) | int }}"
      backup_schedule_count: "{{ ((day2_posture_summary | default({})).get('backup_schedule_count', 0)) | int }}"
      successful_backup_count: "{{ ((day2_posture_summary | default({})).get('successful_backup_count', 0)) | int }}"
      clean_successful_backup_count: "{{ ((day2_posture_summary | default({})).get('clean_successful_backup_count', 0)) | int }}"
      clean_completed_restore_count: "{{ ((day2_posture_summary | default({})).get('clean_completed_restore_count', 0)) | int }}"
