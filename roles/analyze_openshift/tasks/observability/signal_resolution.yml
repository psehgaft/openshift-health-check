  ansible.builtin.set_fact:
    observability_signal_resolution_map: >-
      {%- set resolved = {} -%}
      {%- set prom_statuses = prom_query_status_map | default({}) -%}
      {%- set final_statuses = control_plane_query_status_map | default({}) -%}
      {%- set cap_data = capability_profile_data | default({}) -%}
      {%- for spec in observability_signal_specs -%}
        {%- set name = spec.name -%}
        {%- set prom_status = prom_statuses.get(spec.prom_status_name, 'not-collected') -%}
        {%- set final_status = final_statuses.get(spec.prom_status_name, prom_status) -%}
        {%- set expected_live = false -%}
        {%- for cap_name in (spec.related_capabilities | default([])) -%}
          {%- set cap_value = cap_data.get(cap_name, {}) if (cap_data.get(cap_name) is mapping) else {} -%}
          {%- set evidence = cap_value.get('evidence_required', []) -%}
          {%- set expected_state = (cap_value.get('expected_state', 'present') | string | lower) -%}
          {%- if ('prometheus' in evidence) and expected_state != 'not_applicable' and (cap_value.get('required', false) or expected_state in ['configured', 'healthy', 'present']) -%}
            {%- set expected_live = true -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if prom_status == 'collected' -%}
          {%- set entry = {
            'value': spec.value,
            'status': 'observed',
            'source': 'prometheus',
            'method': 'prometheus-query',
            'confidence': 'high',
            'is_approximation': false,
            'units': spec.units,
            'collected_from': 'openshift-monitoring/thanos-querier',
            'reason': '',
            'capability_profile_related_capabilities': (spec.related_capabilities | default([])),
            'capability_profile_expected_live': expected_live
          } -%}
        {%- elif final_status in ['collected', 'derived'] and (spec.offline_method is defined) -%}
          {%- set entry = {
            'value': spec.value,
            'status': 'derived',
            'source': (spec.offline_source | default('must-gather')),
            'method': spec.offline_method,
            'evidence_type': (
              controlplane_to_worker_network_latency_offline_meta.evidence_type
              if name == 'controlplane_to_worker_network_latency'
              else (
                worker_to_worker_network_latency_offline_meta.evidence_type
                if name == 'worker_to_worker_network_latency'
                else 'offline-derived'
              )
            ),
            'confidence': ('low' if (spec.approximation | default(false)) else 'high'),
            'is_approximation': (spec.approximation | default(false)),
            'units': spec.units,
            'collected_from': (spec.offline_source | default('must-gather')),
            'reason': (
              'offline-fallback-used-live-metrics-expected-by-capability-profile'
              if expected_live
              else ('prometheus-' ~ prom_status if prom_status not in ['not-collected', 'not-configured'] else 'offline-fallback-used')
            ),
            'coverage': (
              controlplane_to_worker_network_latency_offline_meta
              if name == 'controlplane_to_worker_network_latency'
              else (
                worker_to_worker_network_latency_offline_meta
                if name == 'worker_to_worker_network_latency'
                else {}
              )
            ),
            'capability_profile_related_capabilities': (spec.related_capabilities | default([])),
            'capability_profile_expected_live': expected_live
          } -%}
        {%- else -%}
          {%- set entry = {
            'value': spec.value,
            'status': final_status,
            'source': ('prometheus' if final_status in ['query-failed', 'no-data', 'not-configured', 'not-collected'] else 'unavailable'),
            'method': ('prometheus-query' if final_status in ['query-failed', 'no-data', 'not-configured', 'not-collected'] else 'not-collected'),
            'evidence_type': 'not-collected',
            'confidence': 'low',
            'is_approximation': false,
            'units': spec.units,
            'collected_from': '',
            'reason': final_status,
            'capability_profile_related_capabilities': (spec.related_capabilities | default([])),
            'capability_profile_expected_live': expected_live
          } -%}
        {%- endif -%}
        {%- set _ = resolved.update({name: entry}) -%}
      {%- endfor -%}
      {{ resolved }}
  changed_when: false

