---
- name: Build supportability evidence summaries
  vars:
    live_support_parsed: "{{ (live_support_data | default({})).get('parsed', {}) }}"
    support_evidence_parsed: >-
      {{
        {
          'etcd_ocp_diag': live_support_parsed.etcd_ocp_diag if ((live_support_parsed.etcd_ocp_diag | default({})) | length) > 0 else (etcd_ocp_diag_data | default({})),
          'omc': live_support_parsed.omc if ((live_support_parsed.omc | default({})) | length) > 0 else (omc_data | default({})),
          'cluster_compare': live_support_parsed.cluster_compare if ((live_support_parsed.cluster_compare | default({})) | length) > 0 else (cluster_compare_data | default({})),
          'inspect': live_support_parsed.inspect if ((live_support_parsed.inspect | default({})) | length) > 0 else (inspect_data | default({})),
          'managed_gates': live_support_parsed.managed_gates if ((live_support_parsed.managed_gates | default({})) | length) > 0 else (managed_gates_data | default({})),
          'advisor_export': live_support_parsed.advisor_export if ((live_support_parsed.advisor_export | default({})) | length) > 0 else (advisor_export_data | default({})),
          'insights_archive': live_support_parsed.insights_archive if ((live_support_parsed.insights_archive | default({})) | length) > 0 else (insights_archive_data | default({})),
          'sosreport': live_support_parsed.sosreport if ((live_support_parsed.sosreport | default({})) | length) > 0 else (sosreport_data | default({}))
        }
      }}
    support_evidence_coverage: "{{ live_evidence_coverage | default(evidence_coverage | default({})) }}"
    inspect_coverage_value: "{{ support_evidence_coverage.inspect | default('missing') }}"
    sosreport_coverage_value: "{{ support_evidence_coverage.sosreport | default(support_evidence_coverage.node_diagnostics | default('missing')) }}"
    inspect_file_count_value: "{{ support_evidence_parsed.inspect.summary.file_count | default(0) | int }}"
    inspect_node_marker_count_value: "{{ support_evidence_parsed.inspect.summary.resource_markers.nodes | default(0) | int }}"
    inspect_present_value: "{{ (inspect_file_count_value | int) > 0 }}"
    sosreport_count_value: "{{ support_evidence_parsed.sosreport.summary.count | default(0) | int }}"
    sosreport_present_value: "{{ (sosreport_count_value | int) > 0 }}"
    sosreport_target_count_value: "{{ sosreport_coverage_value.target_nodes | default([]) | length if (sosreport_coverage_value is mapping) else 0 }}"
    sosreport_status_value: "{{ sosreport_coverage_value.status | default('unknown') if (sosreport_coverage_value is mapping) else 'unknown' }}"
    etcd_clusteroperator_status: "{{ (clusteroperator_status_map | default({})).get('etcd', {}) }}"
    omc_etcd_operator_available_raw: "{{ support_evidence_parsed.omc.summary.etcd_operator_available | default('unknown') }}"
    omc_etcd_operator_degraded_raw: "{{ support_evidence_parsed.omc.summary.etcd_operator_degraded | default('unknown') }}"
    omc_etcd_operator_progressing_raw: "{{ support_evidence_parsed.omc.summary.etcd_operator_progressing | default('unknown') }}"
    sosreport_complete_coverage: >-
      {{
        (sosreport_present_value | bool)
        and ((support_evidence_parsed.sosreport.summary.reports_with_kubelet_logs | default(0) | int) >= (sosreport_count_value | int))
        and ((support_evidence_parsed.sosreport.summary.reports_with_crio_logs | default(0) | int) >= (sosreport_count_value | int))
        and ((support_evidence_parsed.sosreport.summary.reports_with_journal | default(0) | int) >= (sosreport_count_value | int))
        and ((support_evidence_parsed.sosreport.summary.reports_with_network_data | default(0) | int) >= (sosreport_count_value | int))
      }}
    sosreport_core_coverage: >-
      {{
        (sosreport_present_value | bool)
        and ((support_evidence_parsed.sosreport.summary.reports_with_kubelet_logs | default(0) | int) >= (sosreport_count_value | int))
        and ((support_evidence_parsed.sosreport.summary.reports_with_crio_logs | default(0) | int) >= (sosreport_count_value | int))
        and ((support_evidence_parsed.sosreport.summary.reports_with_journal | default(0) | int) >= (sosreport_count_value | int))
      }}
    inspect_expected: >-
      {{
        (
          ((inspect_coverage_value.requested | default(false)) | bool)
          and ((inspect_coverage_value.applicable | default(false)) | bool)
        )
        if (inspect_coverage_value is mapping)
        else (inspect_coverage_value not in ['missing', 'unknown', 'not-requested', 'not-applicable', 'disabled'])
      }}
    sosreport_expected: >-
      {{
        (
          ((sosreport_coverage_value.requested | default(false)) | bool)
          and ((sosreport_coverage_value.applicable | default(false)) | bool)
          and (
            ((sosreport_coverage_value.collected | default(false)) | bool)
            or ((sosreport_coverage_value.target_nodes | default([])) | length > 0)
            or ((sosreport_coverage_value.status | default('')) in ['failed', 'timed-out'])
          )
        )
        if (sosreport_coverage_value is mapping)
        else (sosreport_coverage_value not in ['missing', 'unknown', 'not-requested', 'not-applicable', 'disabled'])
      }}
    sosreport_required_for_targeted_diagnostics: >-
      {{
        (sosreport_expected | bool)
        and (
          (sosreport_target_count_value | int) > 0
          or sosreport_status_value in ['failed', 'timed-out']
        )
      }}
  ansible.builtin.set_fact:
    reference_compliance_summary:
      evidence_present: "{{ (support_evidence_parsed.cluster_compare | default({}) | length) > 0 }}"
      format: "{{ support_evidence_parsed.cluster_compare.summary.format | default('missing') }}"
      comparison_count: "{{ support_evidence_parsed.cluster_compare.summary.comparison_count | default(0) }}"
      diff_count: "{{ support_evidence_parsed.cluster_compare.summary.diff_count | default(0) }}"
      missing_count: "{{ support_evidence_parsed.cluster_compare.summary.missing_count | default(0) }}"
      error_count: "{{ support_evidence_parsed.cluster_compare.summary.error_count | default(0) }}"
      warning_count: "{{ support_evidence_parsed.cluster_compare.summary.warning_count | default(0) }}"
      verdict: >-
        {{
          'insufficient-evidence'
          if (support_evidence_parsed.cluster_compare | default({}) | length) == 0
          else (
            'unsupported-risk'
            if ((support_evidence_parsed.cluster_compare.summary.error_count | default(0) | int) > 0 or (support_evidence_parsed.cluster_compare.summary.missing_count | default(0) | int) > 0)
            else 'supported'
          )
        }}
    etcd_ocp_diag_summary:
      present: "{{ support_evidence_parsed.etcd_ocp_diag.summary.present | default(false) }}"
      verdict: "{{ support_evidence_parsed.etcd_ocp_diag.summary.verdict | default('not-collected') }}"
      pod_count: "{{ support_evidence_parsed.etcd_ocp_diag.summary.pod_count | default(0) }}"
      log_file_count: "{{ support_evidence_parsed.etcd_ocp_diag.summary.log_file_count | default(0) }}"
      rotated_log_count: "{{ support_evidence_parsed.etcd_ocp_diag.summary.rotated_log_count | default(0) }}"
      error_count_total: "{{ support_evidence_parsed.etcd_ocp_diag.summary.error_count_total | default(0) }}"
      slow_fsync_count: "{{ support_evidence_parsed.etcd_ocp_diag.summary.slow_fsync_count | default(0) }}"
      apply_took_too_long_count: "{{ support_evidence_parsed.etcd_ocp_diag.summary.apply_took_too_long_count | default(0) }}"
      request_timeout_count: "{{ support_evidence_parsed.etcd_ocp_diag.summary.request_timeout_count | default(0) }}"
      leader_election_count: "{{ support_evidence_parsed.etcd_ocp_diag.summary.leader_election_count | default(0) }}"
      lost_leader_count: "{{ support_evidence_parsed.etcd_ocp_diag.summary.lost_leader_count | default(0) }}"
      heartbeat_failure_count: "{{ support_evidence_parsed.etcd_ocp_diag.summary.heartbeat_failure_count | default(0) }}"
      buffer_full_count: "{{ support_evidence_parsed.etcd_ocp_diag.summary.buffer_full_count | default(0) }}"
      overloaded_count: "{{ support_evidence_parsed.etcd_ocp_diag.summary.overloaded_count | default(0) }}"
      apply_took_too_long_stats: "{{ support_evidence_parsed.etcd_ocp_diag.summary.apply_took_too_long_stats | default({}) }}"
      apply_took_too_long_expected_stats: "{{ support_evidence_parsed.etcd_ocp_diag.summary.apply_took_too_long_expected_stats | default({}) }}"
      slow_fsync_stats: "{{ support_evidence_parsed.etcd_ocp_diag.summary.slow_fsync_stats | default({}) }}"
      slow_fsync_expected_stats: "{{ support_evidence_parsed.etcd_ocp_diag.summary.slow_fsync_expected_stats | default({}) }}"
    omc_summary:
      present: "{{ support_evidence_parsed.omc.summary.present | default(false) }}"
      verdict: "{{ support_evidence_parsed.omc.summary.verdict | default('not-collected') }}"
      tool_available: "{{ support_evidence_parsed.omc.summary.tool_available | default(false) }}"
      source: "{{ support_evidence_parsed.omc.summary.source | default('omc' if (support_evidence_parsed.omc.summary.tool_available | default(false) | bool) else 'not-collected') }}"
      detail: "{{ support_evidence_parsed.omc.summary.detail | default('') }}"
      etcd_status_present: "{{ support_evidence_parsed.omc.summary.etcd_status_present | default(false) }}"
      endpoint_count: "{{ support_evidence_parsed.omc.summary.endpoint_count | default(0) }}"
      leader_count: "{{ support_evidence_parsed.omc.summary.leader_count | default(0) }}"
      leader_status_collected: "{{ support_evidence_parsed.omc.summary.leader_status_collected | default(false) }}"
      learner_count: "{{ support_evidence_parsed.omc.summary.learner_count | default(0) }}"
      endpoint_error_count: "{{ support_evidence_parsed.omc.summary.endpoint_error_count | default(0) }}"
      etcd_db_size_total: "{{ support_evidence_parsed.omc.summary.etcd_db_size_total | default('not-collected') }}"
      etcd_db_in_use_total: "{{ support_evidence_parsed.omc.summary.etcd_db_in_use_total | default('not-collected') }}"
      etcd_db_size_max: "{{ support_evidence_parsed.omc.summary.etcd_db_size_max | default('not-collected') }}"
      etcd_db_in_use_max: "{{ support_evidence_parsed.omc.summary.etcd_db_in_use_max | default('not-collected') }}"
      etcd_db_size_total_bytes: "{{ support_evidence_parsed.omc.summary.etcd_db_size_total_bytes | default('not-collected') }}"
      etcd_db_in_use_total_bytes: "{{ support_evidence_parsed.omc.summary.etcd_db_in_use_total_bytes | default('not-collected') }}"
      etcd_db_size_max_bytes: "{{ support_evidence_parsed.omc.summary.etcd_db_size_max_bytes | default('not-collected') }}"
      etcd_db_in_use_max_bytes: "{{ support_evidence_parsed.omc.summary.etcd_db_in_use_max_bytes | default('not-collected') }}"
      etcd_db_not_used_max_pct: "{{ support_evidence_parsed.omc.summary.etcd_db_not_used_max_pct | default('not-collected') }}"
      etcd_db_status_rows: "{{ support_evidence_parsed.omc.summary.etcd_db_status_rows | default([]) }}"
      etcd_operator_available: >-
        {{
          etcd_clusteroperator_status.available | default('unknown')
          if (omc_etcd_operator_available_raw | string | lower) in ['unknown', 'not-assessed', 'not-collected', '']
          else omc_etcd_operator_available_raw
        }}
      etcd_operator_degraded: >-
        {{
          etcd_clusteroperator_status.degraded | default('unknown')
          if (omc_etcd_operator_degraded_raw | string | lower) in ['unknown', 'not-assessed', 'not-collected', '']
          else omc_etcd_operator_degraded_raw
        }}
      etcd_operator_progressing: >-
        {{
          etcd_clusteroperator_status.progressing | default('unknown')
          if (omc_etcd_operator_progressing_raw | string | lower) in ['unknown', 'not-assessed', 'not-collected', '']
          else omc_etcd_operator_progressing_raw
        }}
      prom_rules_present: "{{ support_evidence_parsed.omc.summary.prom_rules_present | default(false) }}"
      prometheus_rule_alert_count: "{{ support_evidence_parsed.omc.summary.prometheus_rule_alert_count | default(0) }}"
      alert_count: "{{ support_evidence_parsed.omc.summary.alert_count | default(0) }}"
      firing_alert_count: "{{ support_evidence_parsed.omc.summary.firing_alert_count | default(0) }}"
      pending_alert_count: "{{ support_evidence_parsed.omc.summary.pending_alert_count | default(0) }}"
      sample_alert_rules: "{{ support_evidence_parsed.omc.summary.sample_alert_rules | default([]) }}"
    node_diagnostics_summary:
      inspect_present: "{{ inspect_present_value }}"
      inspect_file_count: "{{ inspect_file_count_value }}"
      inspect_namespace_count: "{{ support_evidence_parsed.inspect.summary.namespace_count | default(0) }}"
      inspect_resource_markers: "{{ support_evidence_parsed.inspect.summary.resource_markers | default({}) }}"
      sosreport_present: "{{ sosreport_present_value }}"
      sosreport_count: "{{ sosreport_count_value }}"
      sosreport_node_names: "{{ support_evidence_parsed.sosreport.summary.node_names | default([]) }}"
      sosreport_with_journal: "{{ support_evidence_parsed.sosreport.summary.reports_with_journal | default(0) }}"
      sosreport_with_crio_logs: "{{ support_evidence_parsed.sosreport.summary.reports_with_crio_logs | default(0) }}"
      sosreport_with_kubelet_logs: "{{ support_evidence_parsed.sosreport.summary.reports_with_kubelet_logs | default(0) }}"
      sosreport_with_network_data: "{{ support_evidence_parsed.sosreport.summary.reports_with_network_data | default(0) }}"
      target_nodes: "{{ sosreport_coverage_value.target_nodes | default([]) if (sosreport_coverage_value is mapping) else [] }}"
      target_reasons: "{{ sosreport_coverage_value.target_reasons | default({}) if (sosreport_coverage_value is mapping) else {} }}"
      targeted_diagnostics_required: "{{ sosreport_required_for_targeted_diagnostics }}"
      verdict: >-
        {{
          'supported'
          if ((sosreport_complete_coverage | bool) or (sosreport_core_coverage | bool))
          else (
            'review-required'
            if ((sosreport_present_value | bool) and (sosreport_required_for_targeted_diagnostics | bool))
            else (
              'basic-supported'
              if (
                (
                  (sosreport_present_value | bool)
                  or (
                    (inspect_present_value | bool)
                    and ((inspect_node_marker_count_value | int) > 0)
                  )
                )
                and not (sosreport_required_for_targeted_diagnostics | bool)
              )
              else (
                'node-level-no-targets'
                if (
                  (sosreport_coverage_value is mapping)
                  and ((sosreport_coverage_value.requested | default(false)) | bool)
                  and ((sosreport_coverage_value.target_nodes | default([])) | length == 0)
                  and not ((sosreport_coverage_value.collected | default(false)) | bool)
                )
                else (
                  'node-level-not-requested'
                  if not (sosreport_expected | bool)
                  else 'insufficient-evidence'
                )
              )
            )
          )
        }}
    advisor_summary:
      present: "{{ (support_evidence_parsed.advisor_export | default({}) | length) > 0 }}"
      item_count: "{{ support_evidence_parsed.advisor_export.summary.item_count | default(0) }}"
      critical_count: "{{ support_evidence_parsed.advisor_export.summary.critical_count | default(0) }}"
      high_count: "{{ support_evidence_parsed.advisor_export.summary.high_count | default(0) }}"
      moderate_count: "{{ support_evidence_parsed.advisor_export.summary.moderate_count | default(0) }}"
      low_count: "{{ support_evidence_parsed.advisor_export.summary.low_count | default(0) }}"
      top_categories: "{{ support_evidence_parsed.advisor_export.summary.top_categories | default([]) }}"
      verdict: >-
        {{
          'insufficient-evidence'
          if (support_evidence_parsed.advisor_export | default({}) | length) == 0
          else (
            'unsupported-risk'
            if ((support_evidence_parsed.advisor_export.summary.critical_count | default(0) | int) > 0)
            else (
              'review-required'
              if ((support_evidence_parsed.advisor_export.summary.high_count | default(0) | int) > 0 or (support_evidence_parsed.advisor_export.summary.moderate_count | default(0) | int) > 0)
              else 'supported'
            )
          )
        }}
    insights_archive_summary:
      present: "{{ support_evidence_parsed.insights_archive.summary.present | default(false) }}"
      verdict: "{{ support_evidence_parsed.insights_archive.summary.verdict | default('not-collected') }}"
      archive_count: "{{ support_evidence_parsed.insights_archive.summary.archive_count | default(0) }}"
      gather_count: "{{ support_evidence_parsed.insights_archive.summary.gather_count | default(0) }}"
      failed_gather_count: "{{ support_evidence_parsed.insights_archive.summary.failed_gather_count | default(0) }}"
      error_count: "{{ support_evidence_parsed.insights_archive.summary.error_count | default(0) }}"
      panic_count: "{{ support_evidence_parsed.insights_archive.summary.panic_count | default(0) }}"
      sample_archives: "{{ support_evidence_parsed.insights_archive.summary.sample_archives | default([]) }}"
    managed_gate_summary:
      present: "{{ (support_evidence_parsed.managed_gates | default({}) | length) > 0 }}"
      item_count: "{{ support_evidence_parsed.managed_gates.summary.item_count | default(0) }}"
      blocked_count: "{{ support_evidence_parsed.managed_gates.summary.blocked_count | default(0) }}"
      pending_count: "{{ support_evidence_parsed.managed_gates.summary.pending_count | default(0) }}"
      warning_count: "{{ support_evidence_parsed.managed_gates.summary.warning_count | default(0) }}"
      allowed_count: "{{ support_evidence_parsed.managed_gates.summary.allowed_count | default(0) }}"
      top_categories: "{{ support_evidence_parsed.managed_gates.summary.top_categories | default([]) }}"
      verdict: >-
        {{
          'insufficient-evidence'
          if (support_evidence_parsed.managed_gates | default({}) | length) == 0
          else (
            'unsupported-risk'
            if ((support_evidence_parsed.managed_gates.summary.blocked_count | default(0) | int) > 0)
            else (
              'review-required'
              if (((support_evidence_parsed.managed_gates.summary.pending_count | default(0) | int) > 0) or ((support_evidence_parsed.managed_gates.summary.warning_count | default(0) | int) > 0))
              else 'supported'
            )
          )
        }}
