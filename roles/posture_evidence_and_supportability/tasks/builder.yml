---
- name: Build evidence and supportability posture artifact facts
  ansible.builtin.set_fact:
    posture_artifact_key: evidence_and_supportability
    posture_artifact_analysis_summary: "{{ supportability_summary | default({}) }}"
    posture_artifact_findings:
      product_evidence_findings: "{{ assessment_product_evidence_findings | default([]) }}"
      connected_cluster_findings: "{{ assessment_connected_cluster_findings | default(connected_cluster_findings | default([])) }}"
      node_diagnostics_findings: "{{ node_diagnostics_findings | default([]) }}"
      advisor_findings: "{{ advisor_findings | default([]) }}"
      insights_archive_findings: "{{ insights_archive_findings | default([]) }}"
      managed_gate_findings: "{{ managed_gate_findings | default([]) }}"
      reference_compliance_findings: "{{ reference_compliance_findings | default([]) }}"
      etcd_ocp_diag_findings: "{{ etcd_ocp_diag_findings | default([]) }}"
      omc_findings: "{{ omc_findings | default([]) }}"
    posture_artifact_render_inputs:
      supportability_summary: "{{ supportability_summary | default({}) }}"
      diagnostics_coverage: "{{ diagnostics_coverage | default({}) }}"
      product_evidence: "{{ assessment_product_evidence | default({}) }}"
      product_evidence_findings: "{{ assessment_product_evidence_findings | default([]) }}"
      connected_cluster_posture: "{{ assessment_connected_cluster_posture | default(connected_cluster_posture | default({})) }}"
      connected_cluster_findings: "{{ assessment_connected_cluster_findings | default(connected_cluster_findings | default([])) }}"
      node_diagnostics_summary: "{{ node_diagnostics_summary | default({}) }}"
      node_diagnostics_findings: "{{ node_diagnostics_findings | default([]) }}"
      advisor_summary: "{{ advisor_summary | default({}) }}"
      advisor_findings: "{{ advisor_findings | default([]) }}"
      insights_archive_summary: "{{ insights_archive_summary | default({}) }}"
      insights_archive_findings: "{{ insights_archive_findings | default([]) }}"
      managed_gate_summary: "{{ managed_gate_summary | default({}) }}"
      managed_gate_findings: "{{ managed_gate_findings | default([]) }}"
      reference_compliance_summary: "{{ reference_compliance_summary | default({}) }}"
      reference_compliance_findings: "{{ reference_compliance_findings | default([]) }}"
      etcd_ocp_diag_summary: "{{ etcd_ocp_diag_summary | default({}) }}"
      etcd_ocp_diag_findings: "{{ etcd_ocp_diag_findings | default([]) }}"
      omc_summary: "{{ omc_summary | default({}) }}"
      omc_findings: "{{ omc_findings | default([]) }}"
      evidence_coverage: "{{ evidence_coverage | default({}) }}"
    posture_artifact_collection_inputs:
      evidence_confidence: "{{ (supportability_summary | default({})).get('evidence_confidence', report_confidence | default('not-derived')) }}"
      node_diagnostics_verdict: "{{ (supportability_summary | default({})).get('node_diagnostics_verdict', 'not-derived') }}"
      remote_health_posture: "{{ (assessment_connected_cluster_posture | default(connected_cluster_posture | default({}))).get('remote_health_posture', 'not-derived') }}"
      advisor_critical_count: "{{ (advisor_summary | default({})).get('critical_count', 0) }}"
      advisor_high_count: "{{ (advisor_summary | default({})).get('high_count', 0) }}"
    posture_artifact_section_fields:
      summary: "{{ supportability_summary | default({}) }}"
      recommendations: >-
        {{
          'Resolve the named unsupported, review-required, or incomplete supportability conditions before using lower-priority sections for final sign-off.'
          if (
            (supportability_summary | default({})).get('verdict', 'not-derived') not in ['supported', 'healthy']
            or (supportability_summary | default({})).get('evidence_confidence', report_confidence | default('not-derived')) in ['low', 'unknown', 'not-derived']
          )
          else 'No supportability remediation is required for this posture.'
        }}
      supportability_summary: "{{ supportability_summary | default({}) }}"
      diagnostics_coverage: "{{ diagnostics_coverage | default({}) }}"
      product_evidence: "{{ assessment_product_evidence | default({}) }}"
      product_evidence_findings: "{{ assessment_product_evidence_findings | default([]) }}"
      connected_cluster_posture: "{{ assessment_connected_cluster_posture | default(connected_cluster_posture | default({})) }}"
      connected_cluster_findings: "{{ assessment_connected_cluster_findings | default(connected_cluster_findings | default([])) }}"
      connected_cluster_advisor_summary: "{{ advisor_summary | default({}) }}"
      node_diagnostics_summary: "{{ node_diagnostics_summary | default({}) }}"
      node_diagnostics_findings: "{{ node_diagnostics_findings | default([]) }}"
      advisor_summary: "{{ advisor_summary | default({}) }}"
      advisor_findings: "{{ advisor_findings | default([]) }}"
      insights_archive_summary: "{{ insights_archive_summary | default({}) }}"
      insights_archive_findings: "{{ insights_archive_findings | default([]) }}"
      managed_gate_summary: "{{ managed_gate_summary | default({}) }}"
      managed_gate_findings: "{{ managed_gate_findings | default([]) }}"
      reference_compliance_summary: "{{ reference_compliance_summary | default({}) }}"
      reference_compliance_findings: "{{ reference_compliance_findings | default([]) }}"
      etcd_ocp_diag_summary: "{{ etcd_ocp_diag_summary | default({}) }}"
      etcd_ocp_diag_findings: "{{ etcd_ocp_diag_findings | default([]) }}"
      omc_summary: "{{ omc_summary | default({}) }}"
      omc_findings: "{{ omc_findings | default([]) }}"
      evidence_coverage: "{{ evidence_coverage | default({}) }}"
