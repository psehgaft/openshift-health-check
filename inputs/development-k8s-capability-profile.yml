---
# Development or lab Kubernetes capability profile.
# Use with:
#   ansible-playbook playbooks/development_k8s_cluster_health_report.yml -e @inputs/development-k8s-capability-profile.yml
kubernetes_report_capability_profile:
  network_policy_baseline:
    required: false
    criticality: medium
    expected_state: configured
    owner: security
    evidence_required: [kubectl-get]
    notes: "Recommended for shared development namespaces; optional for isolated throwaway labs."
  resource_quota_governance:
    required: true
    criticality: medium
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "Shared development namespaces should still have ResourceQuota coverage."
  limit_range_defaults:
    required: true
    criticality: medium
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "Shared development namespaces should have LimitRange defaults."
  workload_resilience:
    required: false
    criticality: medium
    expected_state: configured
    owner: app
    evidence_required: [kubectl-get]
    notes: "Recommended for shared or long-lived development applications; optional for short-lived tests."
  resource_requests_limits:
    required: true
    criticality: medium
    expected_state: configured
    owner: app
    evidence_required: [kubectl-get]
    notes: "Development workloads should set requests and limits to protect shared capacity."
  external_storage:
    required: false
    criticality: medium
    expected_state: present
    owner: storage
    evidence_required: [kubectl-get]
    notes: "Require only when development workloads depend on durable persistent data."
  ingress_exposure:
    required: false
    criticality: medium
    expected_state: configured
    owner: network
    evidence_required: [kubectl-get]
    notes: "Require only when development applications need external ingress."
  tls_certificate_hygiene:
    required: false
    criticality: medium
    expected_state: configured
    owner: security
    evidence_required: [kubectl-get]
    notes: "Recommended for shared development ingress; optional for isolated labs."
  deprecated_api_review:
    required: true
    criticality: medium
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get]
    notes: "Deprecated APIs should still be reviewed before upgrades."
  backup:
    required: false
    criticality: medium
    expected_state: healthy
    owner: operations
    evidence_required: [kubectl-get]
    notes: "Require only when development state must be recoverable."
  external_logging:
    required: false
    criticality: medium
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get]
    notes: "Recommended for shared development clusters; optional for isolated labs."
  external_monitoring:
    required: true
    criticality: medium
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Shared development clusters still need basic monitoring and alerting."
  user_workload_monitoring:
    required: false
    criticality: medium
    expected_state: configured
    owner: observability
    evidence_required: [kubectl-get, metrics]
    notes: "Recommended for shared development applications that expose metrics; optional for isolated labs."
  workload_vulnerability_scanner:
    required: false
    criticality: medium
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Recommended for shared development clusters; optional for isolated labs."
  grafana_dashboards:
    required: false
    criticality: low
    expected_state: present
    owner: observability
    evidence_required: [kubectl-get]
    notes: "Optional unless in-cluster dashboards are part of the development observability workflow."
  external_private_registry:
    required: false
    criticality: low
    expected_state: configured
    owner: delivery
    evidence_required: [kubectl-get]
    notes: "Require only when development workloads are expected to pull application images from an external private registry."
  autoscaling:
    required: false
    criticality: low
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get, metrics]
    notes: "Require only when elasticity is intentionally tested."
  policy_engine:
    required: false
    criticality: low
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Optional unless admission policy testing is part of the lab purpose."
  secrets_management:
    required: false
    criticality: low
    expected_state: present
    owner: security
    evidence_required: [kubectl-get]
    notes: "Optional unless external secret workflows are being tested."
  cicd_runners:
    required: false
    criticality: low
    expected_state: present
    owner: delivery
    evidence_required: [kubectl-get, metrics]
    notes: "Show when cluster-hosted CI/CD runners are detected or required."
  service_mesh:
    required: false
    criticality: low
    expected_state: present
    owner: network
    evidence_required: [kubectl-get]
    notes: "Optional unless service mesh behavior is being tested."
  provider_node_pools:
    required: false
    criticality: low
    expected_state: configured
    owner: platform
    evidence_required: [kubectl-get, provider-api]
    notes: "Optional for development clusters, but useful for capacity review when available."
