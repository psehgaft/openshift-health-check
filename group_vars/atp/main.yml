---
# ATP-only non-secret site settings. The playbook entry point loads this file.
# Set the external OCI endpoint when it cannot be discovered from cluster mirror APIs.
# Use the registry origin only; the ATP appends /v2/ for its OCI API probe.
atp_external_registry_url: ""
atp_external_registry_host: ""
atp_external_registry_auto_discover: true
atp_external_registry_validate_certs: true
# PEM CA bundle on the Ansible execution host. Leave empty for a public trusted CA.
atp_external_registry_ca_path: ""

# Certificate policy exceptions (default false keeps validation enabled).
# Set true only if the corresponding API/Ingress endpoint intentionally uses self-signed TLS.
atp_api_cert_self_signed: false
atp_ingress_cert_self_signed: false
