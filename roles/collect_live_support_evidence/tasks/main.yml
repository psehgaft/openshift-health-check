- name: Build normalized collected-support evidence facts for live scans
  ansible.builtin.set_fact:
    must_gather_inventory: "{{ live_support_must_gather_inventory | default({}) }}"
    inspect_data: "{{ live_support_inspect_data | default({}) }}"
    cluster_compare_data: "{{ live_support_cluster_compare_data | default({}) }}"
    managed_gates_data: "{{ live_support_managed_gates_data | default({}) }}"
    advisor_export_data: "{{ live_support_advisor_export_data | default({}) }}"
    control_plane_backup_evidence_data: "{{ live_support_control_plane_backup_evidence_data | default({}) }}"
    insights_archive_data: "{{ live_support_insights_archive_data | default({}) }}"
    sosreport_data: "{{ live_support_sosreport_data | default({}) }}"
    etcd_ocp_diag_data: "{{ live_support_etcd_ocp_diag_data | default({}) }}"
    omc_data: "{{ live_support_omc_data | default({}) }}"
    evidence_mode_resolved: live
    evidence_sources: "{{ live_collected_evidence_sources }}"
    evidence_summary:
      source_count: "{{ live_collected_evidence_sources | length }}"
      source_labels: "{{ live_collected_evidence_sources | map(attribute='name') | list }}"
      mode: live
      must_gather_path: "{{ live_support_collected_must_gather_path | default('') }}"
      must_gather_root_entries: "{{ live_support_must_gather_inventory.summary.root_entry_count | default(0) }}"
      namespaced_resource_files: "{{ live_support_must_gather_inventory.summary.namespaced_resource_file_count | default(0) }}"
      cluster_resource_files: "{{ live_support_must_gather_inventory.summary.cluster_resource_file_count | default(0) }}"
      event_files: "{{ live_support_must_gather_inventory.summary.event_file_count | default(0) }}"
      log_files: "{{ live_support_must_gather_inventory.summary.log_file_count | default(0) }}"
      has_cluster_scoped_resources: "{{ live_support_must_gather_inventory.summary.has_cluster_scoped_resources | default(false) }}"
      has_namespaces_tree: "{{ live_support_must_gather_inventory.summary.has_namespaces_tree | default(false) }}"
      omc_present: "{{ live_support_omc_data.summary.present | default(false) }}"
      omc_verdict: "{{ live_support_omc_data.summary.verdict | default('not-collected') }}"
      inspect_path: "{{ live_support_collected_inspect_path | default('') }}"
      cluster_compare_path: "{{ live_support_collected_cluster_compare_path | default('') }}"
      managed_gates_path: "{{ live_support_collected_managed_gates_path | default('') }}"
      advisor_export_path: "{{ live_support_collected_advisor_export_path | default('') }}"
      control_plane_backup_evidence_path: "{{ live_support_collected_control_plane_backup_evidence_path | default('') }}"
      insights_archive_path: "{{ live_support_collected_insights_archive_path | default('') }}"
      sosreport_count: "{{ live_support_sosreport_data.summary.count | default(0) }}"
      artifact_root: "{{ live_support_artifact_root }}"
      collector_count: "{{ live_support_artifact_summary.collector_count | default(0) }}"
      parallelism: "{{ live_support_artifact_summary.parallelism | default(0) }}"
      success_count: "{{ live_support_artifact_summary.success_count | default(0) }}"
      failed_count: "{{ live_support_artifact_summary.failed_count | default(0) }}"
      timed_out_count: "{{ live_support_artifact_summary.timed_out_count | default(0) }}"
    evidence_coverage:
      cluster_configuration: >-
        {{ 'present' if (live_support_must_gather_inventory.summary.has_cluster_scoped_resources | default(false)) else ('partial' if ((live_support_inspect_data.summary.file_count | default(0) | int) > 0) else 'missing') }}
      namespaced_resources: >-
        {{ 'present' if (live_support_must_gather_inventory.summary.has_namespaces_tree | default(false)) else ('partial' if ((live_support_inspect_data.summary.namespace_count | default(0) | int) > 0) else 'missing') }}
      cluster_events: "{{ 'present' if ((live_support_must_gather_inventory.summary.event_file_count | default(0) | int) > 0) else ('partial' if ((live_support_inspect_data.summary.resource_markers.events | default(0) | int) > 0) else 'missing') }}"
      service_logs: "{{ 'partial' if ((live_support_must_gather_inventory.summary.log_file_count | default(0) | int) > 0) else ('partial' if ((live_support_inspect_data.summary.text_file_count | default(0) | int) > 0) else 'unknown') }}"
      node_diagnostics: "{{ 'present' if ((live_support_sosreport_data.summary.count | default(0) | int) > 0) else 'missing' }}"
      inspect: "{{ 'present' if ((live_support_inspect_data.summary.file_count | default(0) | int) > 0) else 'missing' }}"
      advisor_data: "{{ 'present' if (live_support_advisor_export_data.summary is defined) else 'unknown' }}"
      control_plane_backup: "{{ 'present' if (live_support_control_plane_backup_evidence_data.summary is defined) else 'missing' }}"
      insights_archive: "{{ 'present' if (live_support_insights_archive_data.summary is defined and (live_support_insights_archive_data.summary.present | default(false) | bool)) else 'missing' }}"
      cluster_compare: "{{ 'present' if (live_support_cluster_compare_data.summary is defined) else 'missing' }}"
      managed_gates: "{{ 'present' if (live_support_managed_gates_data.summary is defined) else 'missing' }}"
    evidence_limitations: >-
      {{
        []
        + ([{'area': 'node diagnostics', 'detail': 'No symptom-based node targets were derived for oc debug node/<node> sosreport collection; no arbitrary node sosreport was collected.'}] if ((live_support_sosreport_data.summary.count | default(0) | int) == 0 and ((node_debug_target_nodes | default([])) | length == 0)) else [])
        + ([{'area': 'node diagnostics', 'detail': 'Targeted oc debug node/<node> sosreport collection was requested but no node-level archive was collected.'}] if ((live_support_sosreport_data.summary.count | default(0) | int) == 0 and ((node_debug_target_nodes | default([])) | length > 0)) else [])
        + ([{'area': 'targeted inspect evidence', 'detail': 'No oc adm inspect directory was collected during this scan.'}] if ((live_support_inspect_data.summary.file_count | default(0) | int) == 0) else [])
        + ([{'area': 'reference compliance', 'detail': 'No cluster-compare output or baseline reference was collected during this scan.'}] if (live_support_cluster_compare_data.summary is not defined) else [])
        + ([{'area': 'managed-service gates', 'detail': 'No provider-managed gate export was collected during this scan.'}] if (live_support_managed_gates_data.summary is not defined) else [])
        + ([{'area': 'advisor posture', 'detail': 'No Advisor export was collected during this scan.'}] if (live_support_advisor_export_data.summary is not defined) else [])
        + ([{'area': 'control-plane backup evidence', 'detail': 'No live etcd snapshot or static_kuberesources artifact inventory was collected during this scan.'}] if (live_support_control_plane_backup_evidence_data.summary is not defined and not (cluster_profile.is_hosted_control_plane | default(false) | bool)) else [])
        + ([{'area': 'insights archive', 'detail': 'No live Insights Operator archive was collected during this scan.'}] if (live_support_insights_archive_data.summary is not defined or not (live_support_insights_archive_data.summary.present | default(false) | bool)) else [])
      }}
  vars:
    live_collected_evidence_sources: >-
      {{
        []
        + ([{'name': 'must-gather', 'type': 'archive-directory', 'mode': 'live', 'path': live_support_collected_must_gather_path, 'parser': 'parse_must_gather.py'}] if (live_support_collected_must_gather_path | default('') | length > 0) else [])
        + ([{'name': 'inspect', 'type': 'resource-directory', 'mode': 'live', 'path': live_support_collected_inspect_path, 'parser': 'parse_inspect.py'}] if (live_support_collected_inspect_path | default('') | length > 0) else [])
        + ([{'name': 'cluster-compare', 'type': 'report-file', 'mode': 'live', 'path': live_support_collected_cluster_compare_path, 'parser': 'parse_cluster_compare.py'}] if (live_support_collected_cluster_compare_path | default('') | length > 0) else [])
        + ([{'name': 'managed-gates', 'type': 'report-file', 'mode': 'live', 'path': live_support_collected_managed_gates_path, 'parser': 'parse_managed_gates.py'}] if (live_support_collected_managed_gates_path | default('') | length > 0) else [])
        + ([{'name': 'advisor-export', 'type': 'report-file', 'mode': 'live', 'path': live_support_collected_advisor_export_path, 'parser': 'parse_advisor_export.py'}] if (live_support_collected_advisor_export_path | default('') | length > 0) else [])
        + ([{'name': 'control-plane-backup-evidence', 'type': 'report-file', 'mode': 'live', 'path': live_support_collected_control_plane_backup_evidence_path, 'parser': 'parse_control_plane_backup_evidence.py'}] if (live_support_collected_control_plane_backup_evidence_path | default('') | length > 0) else [])
        + ([{'name': 'insights-archive', 'type': 'archive-directory', 'mode': 'live', 'path': live_support_collected_insights_archive_path, 'parser': 'parse_insights_archive.py'}] if (live_support_collected_insights_archive_path | default('') | length > 0) else [])
        + (
          (live_support_sosreport_data.reports | default([]))
          | map('combine', {'name': 'oc-debug-node-sosreport', 'type': 'node-archive', 'mode': 'live', 'parser': 'parse_sosreport.py'})
          | list
        )
      }}

