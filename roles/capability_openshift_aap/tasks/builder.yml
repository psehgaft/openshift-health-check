---
- name: Build OpenShift AAP capability artifact facts
  vars:
    day2_openshift_aap_section_current: "{{ (((day2_capability_sections | default([])) | selectattr('key', 'equalto', 'openshift_aap') | list | first) | default({})) }}"
    openshift_aap_present_current: "{{ ((day2_posture_summary | default({})).get('openshift_aap_present', false)) | bool }}"
    openshift_aap_recommended_action_current: >-
      {{
        'Confirm the Ansible Automation Platform footprint remains healthy and aligned with the intended automation control-plane design.'
        if openshift_aap_present_current
        else 'If OpenShift AAP is intended, deploy or confirm the operator, custom resources, and managed workload footprint.'
      }}
    openshift_aap_findings_current: >-
      {{
        []
        if openshift_aap_present_current
        else [
          {
            'capability': 'openshift_aap',
            'issue': 'prod-day2-openshift-aap-missing',
            'severity': 'info',
            'source': 'Ansible Automation Platform operator and custom resource inventory',
            'detail': 'no Ansible Automation Platform custom resource or AAP-managed workload footprint was detected',
            'recommended_action': openshift_aap_recommended_action_current,
            'docs': ((day2_openshift_aap_section_current.docs | default([])) | string)
          }
        ]
      }}
    openshift_aap_section_override_current: >-
      {{
        (day2_openshift_aap_section_current | default({}))
        | combine(
            {
              'accounting_state': 'assessed',
              'check_count': 1,
              'finding_count': (0 if openshift_aap_present_current else 1),
              'findings': openshift_aap_findings_current,
              'status': ('OK' if openshift_aap_present_current else 'INFO'),
              'top_detail': (
                (day2_openshift_aap_section_current.top_detail | default('') | string | trim)
                if openshift_aap_present_current
                else 'no Ansible Automation Platform custom resource or AAP-managed workload footprint was detected'
              ),
              'recommended_action': openshift_aap_recommended_action_current
            },
            recursive=True
          )
      }}
  ansible.builtin.set_fact:
    capability_artifact_key: openshift_aap
    capability_artifact_section_override: "{{ openshift_aap_section_override_current }}"
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      accounting_state: assessed
      openshift_aap_present: "{{ openshift_aap_present_current | bool }}"
      status_summary: "{{ openshift_aap_section_override_current.status }}"
      reason_summary: "{{ openshift_aap_section_override_current.top_detail }}"
    capability_artifact_render_inputs:
      day2_openshift_aap_section: "{{ openshift_aap_section_override_current }}"
    capability_artifact_collection_inputs:
      openshift_aap_present: "{{ openshift_aap_present_current | bool }}"
