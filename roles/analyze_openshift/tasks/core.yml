uster_classification.is_sno | default(false) | bool), 'is_hosted_control_plane': (openshift_cluster_classification.is_hosted_control_plane | default(false) | bool), 'machine_api_worker_pool_count': (openshift_cluster_classification.machine_api_worker_pool_count | default(0) | int), 'machine_api_managed_worker_pools': (openshift_cluster_classification.machine_api_managed_worker_pools | default(false) | bool), 'control_plane_node_count': (openshift_cluster_classification.control_plane_node_count | default(openshift_control_plane_node_count | int) | int), 'worker_node_count': (openshift_cluster_classification.worker_node_count | default(openshift_worker_node_count | int) | int), 'infra_node_count': (openshift_cluster_classification.infra_node_count | default(openshift_infra_node_count | int) | int)}, recursive=True) }}"

