---
- name: Build cluster network observability capability artifact facts
  vars:
    day2_cluster_network_observability_section_current: "{{ (day2_capability_sections_by_key | default({})).get('cluster_network_observability', {}) }}"
    cluster_network_observability_present_current: "{{ ((day2_posture_summary | default({})).get('cluster_network_observability_present', false)) | bool }}"
    cluster_network_observability_healthy_current: "{{ ((day2_posture_summary | default({})).get('cluster_network_observability_healthy', false)) | bool }}"
    cluster_network_observability_subscription_present_current: "{{ ((day2_posture_summary | default({})).get('cluster_network_observability_subscription_present', false)) | bool }}"
    cluster_network_observability_namespace_present_current: "{{ ((day2_posture_summary | default({})).get('cluster_network_observability_namespace_present', false)) | bool }}"
    cluster_network_observability_crd_present_current: "{{ ((day2_posture_summary | default({})).get('cluster_network_observability_crd_present', false)) | bool }}"
    cluster_network_observability_flowcollector_count_current: "{{ ((day2_posture_summary | default({})).get('cluster_network_observability_flowcollector_count', 0)) | int }}"
    cluster_network_observability_flowcollector_present_current: "{{ ((day2_posture_summary | default({})).get('cluster_network_observability_flowcollector_present', false)) | bool }}"
    cluster_network_observability_workload_present_current: "{{ ((day2_posture_summary | default({})).get('cluster_network_observability_workload_present', false)) | bool }}"
    cluster_network_observability_reason_summary_current: >-
      {{
        (
          day2_cluster_network_observability_section_current.top_detail
          | default('')
          | string
          | trim
        )
        or (
          'subscriptionPresent=' ~ (cluster_network_observability_subscription_present_current | string)
          ~ ' namespacePresent=' ~ (cluster_network_observability_namespace_present_current | string)
          ~ ' crdPresent=' ~ (cluster_network_observability_crd_present_current | string)
          ~ ' flowCollectors=' ~ (cluster_network_observability_flowcollector_count_current | string)
          ~ ' workloadPresent=' ~ (cluster_network_observability_workload_present_current | string)
        )
      }}
    cluster_network_observability_recommended_action_current: >-
      {{
        'Confirm the network observability control plane and flow visibility path remain healthy and aligned with the intended incident-response model.'
        if cluster_network_observability_present_current
        else 'If cluster network observability is intended, deploy or confirm the NetObserv operator, CRDs, namespace, and flow-visibility workload footprint.'
      }}
    cluster_network_observability_checks_current:
      - name: Cluster network observability operator subscription
        status: >-
          {{
            'OK'
            if (cluster_network_observability_subscription_present_current | bool)
            else ('WARN' if (cluster_network_observability_present_current | bool) else 'INFO')
          }}
        detail: "subscriptionPresent={{ (cluster_network_observability_subscription_present_current | bool) | string }}"
      - name: Cluster network observability namespace
        status: >-
          {{
            'OK'
            if (cluster_network_observability_namespace_present_current | bool)
            else ('WARN' if (cluster_network_observability_present_current | bool) else 'INFO')
          }}
        detail: "namespacePresent={{ (cluster_network_observability_namespace_present_current | bool) | string }}"
      - name: Cluster network observability CRD inventory
        status: >-
          {{
            'OK'
            if (cluster_network_observability_crd_present_current | bool)
            else ('WARN' if (cluster_network_observability_present_current | bool) else 'INFO')
          }}
        detail: "crdPresent={{ (cluster_network_observability_crd_present_current | bool) | string }}"
      - name: Cluster network observability FlowCollector or workload footprint
        status: >-
          {{
            'OK'
            if (cluster_network_observability_flowcollector_present_current | bool) or (cluster_network_observability_workload_present_current | bool)
            else ('WARN' if (cluster_network_observability_present_current | bool) else 'INFO')
          }}
        detail: "flowCollectors={{ cluster_network_observability_flowcollector_count_current | int }} workloadPresent={{ (cluster_network_observability_workload_present_current | bool) | string }}"
    cluster_network_observability_findings_current: >-
      {{
        ([] +
        ([{
          'capability': 'cluster_network_observability',
          'issue': 'prod-day2-cluster-network-observability-subscription-missing',
          'severity': ('warning' if (cluster_network_observability_present_current | bool) else 'info'),
          'source': 'OpenShift network observability operator and workload inventory',
          'detail': 'No network observability operator subscription footprint was detected.',
          'recommended_action': cluster_network_observability_recommended_action_current,
          'docs': ((day2_cluster_network_observability_section_current.docs | default([])) | string)
        }] if not (cluster_network_observability_subscription_present_current | bool) else []) +
        ([{
          'capability': 'cluster_network_observability',
          'issue': 'prod-day2-cluster-network-observability-namespace-missing',
          'severity': ('warning' if (cluster_network_observability_present_current | bool) else 'info'),
          'source': 'OpenShift network observability operator and workload inventory',
          'detail': 'No network observability namespace footprint was detected.',
          'recommended_action': cluster_network_observability_recommended_action_current,
          'docs': ((day2_cluster_network_observability_section_current.docs | default([])) | string)
        }] if not (cluster_network_observability_namespace_present_current | bool) else []) +
        ([{
          'capability': 'cluster_network_observability',
          'issue': 'prod-day2-cluster-network-observability-crd-missing',
          'severity': ('warning' if (cluster_network_observability_present_current | bool) else 'info'),
          'source': 'OpenShift network observability operator and workload inventory',
          'detail': 'No network observability CRD footprint was detected.',
          'recommended_action': cluster_network_observability_recommended_action_current,
          'docs': ((day2_cluster_network_observability_section_current.docs | default([])) | string)
        }] if not (cluster_network_observability_crd_present_current | bool) else []) +
        ([{
          'capability': 'cluster_network_observability',
          'issue': 'prod-day2-cluster-network-observability-workload-missing',
          'severity': ('warning' if (cluster_network_observability_present_current | bool) else 'info'),
          'source': 'OpenShift network observability operator and workload inventory',
          'detail': 'No FlowCollector resource or network observability workload footprint was detected.',
          'recommended_action': cluster_network_observability_recommended_action_current,
          'docs': ((day2_cluster_network_observability_section_current.docs | default([])) | string)
        }] if not ((cluster_network_observability_flowcollector_present_current | bool) or (cluster_network_observability_workload_present_current | bool)) else []))
      }}
    cluster_network_observability_section_override_current: >-
      {{
        (day2_cluster_network_observability_section_current | default({}))
        | combine(
            {
              'accounting_state': 'assessed',
              'check_count': (cluster_network_observability_checks_current | length),
              'finding_count': (cluster_network_observability_findings_current | length),
              'checks': cluster_network_observability_checks_current,
              'findings': cluster_network_observability_findings_current,
              'status': (
                'OK'
                if cluster_network_observability_healthy_current
                else ('WARNING' if cluster_network_observability_present_current else 'INFO')
              ),
              'top_detail': (
                cluster_network_observability_reason_summary_current
                if cluster_network_observability_present_current
                else 'no network observability operator, CRD, FlowCollector, namespace, or workload footprint was detected'
              ),
              'recommended_action': cluster_network_observability_recommended_action_current
            },
            recursive=True
          )
      }}
  ansible.builtin.set_fact:
    capability_artifact_key: cluster_network_observability
    capability_artifact_section_override: "{{ cluster_network_observability_section_override_current }}"
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      accounting_state: assessed
      check_count: "{{ (cluster_network_observability_checks_current | length) | int }}"
      finding_count: "{{ (cluster_network_observability_findings_current | length) | int }}"
      cluster_network_observability_present: "{{ cluster_network_observability_present_current | bool }}"
      cluster_network_observability_healthy: "{{ cluster_network_observability_healthy_current | bool }}"
      cluster_network_observability_subscription_present: "{{ cluster_network_observability_subscription_present_current | bool }}"
      cluster_network_observability_namespace_present: "{{ cluster_network_observability_namespace_present_current | bool }}"
      cluster_network_observability_crd_present: "{{ cluster_network_observability_crd_present_current | bool }}"
      cluster_network_observability_flowcollector_count: "{{ cluster_network_observability_flowcollector_count_current | int }}"
      cluster_network_observability_flowcollector_present: "{{ cluster_network_observability_flowcollector_present_current | bool }}"
      cluster_network_observability_workload_present: "{{ cluster_network_observability_workload_present_current | bool }}"
      status_summary: "{{ cluster_network_observability_section_override_current.status }}"
      reason_summary: "{{ cluster_network_observability_section_override_current.top_detail }}"
    capability_artifact_render_inputs:
      day2_cluster_network_observability_section: "{{ cluster_network_observability_section_override_current }}"
    capability_artifact_collection_inputs:
      cluster_network_observability_present: "{{ cluster_network_observability_present_current | bool }}"
      cluster_network_observability_healthy: "{{ cluster_network_observability_healthy_current | bool }}"
      cluster_network_observability_subscription_present: "{{ cluster_network_observability_subscription_present_current | bool }}"
      cluster_network_observability_namespace_present: "{{ cluster_network_observability_namespace_present_current | bool }}"
      cluster_network_observability_crd_present: "{{ cluster_network_observability_crd_present_current | bool }}"
      cluster_network_observability_flowcollector_count: "{{ cluster_network_observability_flowcollector_count_current | int }}"
      cluster_network_observability_flowcollector_present: "{{ cluster_network_observability_flowcollector_present_current | bool }}"
      cluster_network_observability_workload_present: "{{ cluster_network_observability_workload_present_current | bool }}"
