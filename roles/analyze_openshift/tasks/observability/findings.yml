- name: Build observability metric summaries
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_observability_metric_summaries.py"
    stdin: "{{ {
      'firing_alerts': (firing_alerts | default([])),
      'node_cpu_utilization_results': (node_cpu_utilization_results | default([])),
      'node_memory_utilization_results': (node_memory_utilization_results | default([])),
      'node_disk_utilization_results': (node_disk_utilization_results | default([])),
      'kubelet_pod_density_results': (kubelet_pod_density_results | default([])),
      'runtime_signal_resolution_map': (runtime_signal_resolution_map | default({})),
      'pod_density_warn_pct': (pod_density_warn_pct | default(0)),
      'pod_density_critical_pct': (pod_density_critical_pct | default(0))
    } | to_json }}"
  register: observability_metric_summaries_cmd
  changed_when: false
  failed_when: observability_metric_summaries_cmd.rc != 0

- name: Normalize observability metric summaries
  vars:
    observability_metric_summaries_default:
      firing_alerts_by_severity: {}
      firing_alert_name_counts: {}
      firing_alert_namespace_counts: {}
      low_cpu_nodes: []
      high_cpu_nodes: []
      low_memory_nodes: []
      high_memory_nodes: []
      high_disk_nodes: []
      high_pod_density_nodes: []
      critical_pod_density_nodes: []
  ansible.builtin.set_fact:
    observability_metric_summaries: >-
      {{
        (observability_metric_summaries_cmd.stdout | from_json)
        if (observability_metric_summaries_cmd.stdout | default('') | trim | length > 0)
        else observability_metric_summaries_default
      }}
  changed_when: false

- name: Apply observability metric summaries
  ansible.builtin.set_fact:
    firing_alerts_by_severity: "{{ observability_metric_summaries.firing_alerts_by_severity | default({}) }}"
    firing_alert_name_counts: "{{ observability_metric_summaries.firing_alert_name_counts | default({}) }}"
    firing_alert_namespace_counts: "{{ observability_metric_summaries.firing_alert_namespace_counts | default({}) }}"
    low_cpu_nodes: "{{ observability_metric_summaries.low_cpu_nodes | default([]) }}"
    high_cpu_nodes: "{{ observability_metric_summaries.high_cpu_nodes | default([]) }}"
    low_memory_nodes: "{{ observability_metric_summaries.low_memory_nodes | default([]) }}"
    high_memory_nodes: "{{ observability_metric_summaries.high_memory_nodes | default([]) }}"
    high_disk_nodes: "{{ observability_metric_summaries.high_disk_nodes | default([]) }}"
    high_pod_density_nodes: "{{ observability_metric_summaries.high_pod_density_nodes | default([]) }}"
    critical_pod_density_nodes: "{{ observability_metric_summaries.critical_pod_density_nodes | default([]) }}"
  changed_when: false

- name: Build certificate expiry severity buckets
  ansible.builtin.set_fact:
    expiring_certificates_warning: "{{ expiring_certificates_warning | default([]) + ([item | combine({'days_remaining': (expiry_days | float)})] if (expiry_days | float) <= (certificate_expiry_warn_days | float) else []) }}"
    expiring_certificates_critical: "{{ expiring_certificates_critical | default([]) + ([item | combine({'days_remaining': (expiry_days | float)})] if (expiry_days | float) <= (certificate_expiry_critical_days | float) else []) }}"
  loop: "{{ certificate_expiry_findings | default([]) }}"
  vars:
    expiry_days: "{{ (((item.not_after | to_datetime('%b %d %H:%M:%S %Y %Z')) - (report_generated_at | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).total_seconds() / 86400) | round(1) }}"
  changed_when: false

- name: Build overprovisioned pod findings from Prometheus usage
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_overprovisioned_pods.py"
    stdin: "{{ {
      'pods': ((analysis_graph.pods | default({})).get('items', [])),
      'cpu_usage': (pod_cpu_usage_all_results | default([])),
      'memory_usage': (pod_memory_usage_all_results | default([])),
      'exclude_regex': user_namespaces_exclude_regex,
      'operator_managed_namespace_names': (operator_managed_namespace_names | default([])),
      'cpu_usage_status': (((runtime_signal_resolution_map.pod_cpu_usage_all | default({})).get('status', 'not-collected'))),
      'memory_usage_status': (((runtime_signal_resolution_map.pod_memory_usage_all | default({})).get('status', 'not-collected')))
    } | to_json }}"
  register: overprovisioned_pods_cmd
  changed_when: false
  failed_when: false
  when: prom_available | bool

- name: Normalize overprovisioned pod findings
  ansible.builtin.set_fact:
    overprovisioned_pods: "{{ overprovisioned_pods_cmd.stdout | from_json if (overprovisioned_pods_cmd is defined and overprovisioned_pods_cmd.rc is defined and overprovisioned_pods_cmd.rc == 0 and (overprovisioned_pods_cmd.stdout | default('') | length > 0)) else [] }}"

- name: Build quota pressure findings
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_quota_pressure_findings.py"
    stdin: "{{ ((analysis_graph.resourcequotas | default({})).get('items', [])) | to_json }}"
  register: quota_pressure_cmd
  changed_when: false
  failed_when: false

- name: Normalize quota pressure findings
  ansible.builtin.set_fact:
    quota_pressure_findings: "{{ quota_pressure_cmd.stdout | from_json if (quota_pressure_cmd.rc == 0 and (quota_pressure_cmd.stdout | default('') | length > 0)) else [] }}"
