---
- name: Build bundled workload and node governance findings
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_common_workload_governance_bundle.py"
    stdin: "{{ {
      'analysis_graph': (analysis_graph | default({})),
      'nodes': (nodes | default({})),
      'collected_resource_graph': (collected_resource_graph | default({})),
      'operator_managed_namespace_names': (operator_managed_namespace_names | default([])),
      'user_namespaces_exclude_regex': (user_namespaces_exclude_regex | default('^$'))
    } | to_json }}"
  register: workload_governance_bundle_cmd
  changed_when: false
  failed_when: workload_governance_bundle_cmd.rc != 0 or (workload_governance_bundle_cmd.stdout | default('') | length == 0)

- name: Normalize bundled workload and node governance findings
  ansible.builtin.set_fact:
    workload_governance_bundle: "{{ workload_governance_bundle_cmd.stdout | from_json }}"

- name: Apply bundled workload and node governance findings
  ansible.builtin.set_fact:
    workload_governance_facts: "{{ workload_governance_bundle.workload_governance_facts | default({}) }}"
    orphan_pods: "{{ workload_governance_bundle.orphan_pods | default([]) }}"
    workload_label_governance_findings: "{{ workload_governance_bundle.workload_label_governance_findings | default([]) }}"
    workload_resource_findings: "{{ workload_governance_bundle.workload_resource_findings | default([]) }}"
    node_label_governance_source_nodes: "{{ workload_governance_bundle.node_label_governance_source_nodes | default([]) }}"
    node_label_governance_findings: "{{ workload_governance_bundle.node_label_governance_findings | default([]) }}"
  changed_when: false
