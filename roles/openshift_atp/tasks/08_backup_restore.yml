---
# ==============================================================================
# Section 8: Cluster Backup and Restore (TC 61 to TC 62)
# ==============================================================================

# TC 61: etcd backup
- name: "TC-61: etcd backup"
  when: run_tc61_etcd_backup | default(true) | bool
  block:
    - name: "TC-61: Verify cluster-backup.sh script existence on master node"
      ansible.builtin.shell: >
        MASTER=$(oc get nodes -l node-role.kubernetes.io/master -o jsonpath='{.items[0].metadata.name}');
        oc debug node/${MASTER} -- chroot /host test -f /usr/local/bin/cluster-backup.sh
      register: tc61_cmd
      changed_when: false
      failed_when: false

    - name: "TC-61: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-61',
          'name': 'etcd backup',
          'category': 'Cluster Backup & Restore',
          'expected': 'cluster-backup.sh script available on control-plane nodes',
          'status': ('Pass' if tc61_cmd.rc == 0 else 'Fail'),
          'procedure': (tc61_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc61_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc61_cmd.stderr | default(''))) if (tc61_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc61_cmd.rc | string) if tc61_cmd.rc is defined else '')),
          'details': 'cluster-backup.sh verified on master host'
        }] }}"
  tags: ['general', 'telco', 'tc61', 'etcd_backup']

# TC 62: etcd restore (destructive recovery; opt-in)
- name: "TC-62: etcd restore"
  block:
    - name: "TC-62: Resolve manual execution mode"
      ansible.builtin.set_fact:
        tc62_manual_execution_enabled: "{{ tc62_manual_execution | default(false) | bool }}"

    - name: "TC-62: Execute guarded etcd restore and verify recovery"
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ role_path }}/files/tc62_etcd_restore.sh"
      environment:
        TC62_CONTROL_PLANE_HOSTS_JSON: "{{ tc62_control_plane_hosts | default([]) | to_json }}"
        TC62_RECOVERY_HOST: "{{ tc62_recovery_host | default('') | string }}"
        TC62_BACKUP_DIR: "{{ tc62_backup_dir | default('') | string }}"
        TC62_SSH_USER: "{{ tc62_ssh_user | default('core') | string }}"
        TC62_SSH_KEY_PATH: "{{ tc62_ssh_key_path | default('') | string }}"
        TC62_EXPECTED_RELEASE: "{{ tc62_expected_release | default('') | string }}"
        TC62_BACKUP_RELEASE: "{{ tc62_backup_release | default('') | string }}"
        TC62_RESTORE_TIMEOUT_SECONDS: "{{ tc62_restore_timeout_seconds | default(5400) | string }}"
        TC62_TWO_NODE_FENCING: "{{ tc62_two_node_fencing | default(false) | bool | ternary('true', 'false') }}"
        TC62_STANDARD_HA_TOPOLOGY_CONFIRMED: "{{ tc62_standard_ha_topology_confirmed | default(false) | bool | ternary('true', 'false') }}"
      register: tc62_cmd
      changed_when: tc62_cmd.rc == 0
      failed_when: false
      when:
        - tc62_restore_enabled | default(false) | bool
        - (tc62_restore_confirmation | default('')) == ('RESTORE-ETCD-' ~ (cluster_name | default('')))
        - not (tc62_manual_execution_enabled | bool)
      async: 7200
      poll: 10

    - name: "TC-62: Verify cluster health after manual etcd restore"
      ansible.builtin.shell: |
        set -uo pipefail
        nodes_json="$(oc get nodes -o json 2>&1)"; nodes_rc=$?
        operators_json="$(oc get co -o json 2>&1)"; operators_rc=$?
        etcd_pods_json="$(oc get pods -n openshift-etcd -o json 2>&1)"; etcd_pods_rc=$?
        echo "COMMAND: oc get nodes -o json"
        printf '%s\n' "$nodes_json"
        echo "COMMAND: oc get co -o json"
        printf '%s\n' "$operators_json"
        echo "COMMAND: oc get pods -n openshift-etcd -o json"
        printf '%s\n' "$etcd_pods_json"
        nodes_health_rc=1
        operators_health_rc=1
        etcd_health_rc=1
        if [[ "$nodes_rc" -eq 0 ]]; then
          jq -e '.items | length > 0 and all(.[]; any(.status.conditions[]; .type == "Ready" and .status == "True"))' <<< "$nodes_json" >/dev/null 2>&1
          nodes_health_rc=$?
        fi
        if [[ "$operators_rc" -eq 0 ]]; then
          jq -e '.items | length > 0 and all(.[]; any(.status.conditions[]; .type == "Available" and .status == "True") and all([.status.conditions[] | select(.type == "Degraded")]; .status == "False") and all([.status.conditions[] | select(.type == "Progressing")]; .status == "False"))' <<< "$operators_json" >/dev/null 2>&1
          operators_health_rc=$?
        fi
        if [[ "$etcd_pods_rc" -eq 0 ]]; then
          jq -e '[.items[] | select(.metadata.name | startswith("etcd-")) | select(.metadata.name | contains("quorum-guard") | not)] as $pods | ($pods | length) > 0 and all($pods[]; .status.phase == "Running" and ([.status.containerStatuses[]?.ready] | length > 0 and all))' <<< "$etcd_pods_json" >/dev/null 2>&1
          etcd_health_rc=$?
        fi
        echo "Node readiness check exit code: $nodes_health_rc"
        echo "ClusterOperator health check exit code: $operators_health_rc"
        echo "etcd pod readiness check exit code: $etcd_health_rc"
        if [[ "$nodes_health_rc" -eq 0 && "$operators_health_rc" -eq 0 && "$etcd_health_rc" -eq 0 ]]; then
          echo "TC62_MANUAL_RESULT=PASS"
          exit 0
        fi
        echo "TC62_MANUAL_RESULT=FAIL: node, ClusterOperator, or etcd pod health validation failed after the declared manual restore." >&2
        exit 1
      args:
        executable: /bin/bash
      register: tc62_manual_cmd
      changed_when: false
      failed_when: false
      when: tc62_manual_execution_enabled | bool
    - name: "TC-62: Classify restore result"
      ansible.builtin.set_fact:
        tc62_status: >-
          {% if tc62_manual_execution_enabled | bool %}
          {{ 'Pass' if (tc62_manual_cmd.rc | default(1) | int) == 0 and 'TC62_MANUAL_RESULT=PASS' in (tc62_manual_cmd.stdout | default('')) else 'Fail' }}
          {% elif not (tc62_restore_enabled | default(false) | bool) %}
          Skipped
          {% elif (tc62_restore_confirmation | default('')) != ('RESTORE-ETCD-' ~ (cluster_name | default(''))) %}
          Fail
          {% elif (tc62_cmd.rc | default(1) | int) == 0 %}
          Pass
          {% else %}
          Fail
          {% endif %}

    - name: "TC-62: Build Result Record"
      ansible.builtin.set_fact:
        tc62_result:
          id: "TC-62"
          name: "etcd restore"
          category: "Cluster Backup & Restore"
          expected: "Restore from the matching z-stream snapshot and verify API, node, ClusterOperator, and etcd health"
          status: "{{ tc62_status | trim }}"
          procedure: "{{ 'Manual execution attested by tc62_manual_execution=true; the playbook only checks oc get nodes, oc get co, and etcd pod readiness.' if (tc62_manual_execution_enabled | bool) else 'Opt-in destructive recovery with preflight, snapshot restore, and post-restore API, node, ClusterOperator, and etcd validation.' }}"
          evidence: |
            {% if tc62_manual_execution_enabled | bool %}
            {{ tc62_manual_cmd.stdout | default('') }}
            {% if tc62_manual_cmd.stderr | default('') | length > 0 %}
            STDERR:
            {{ tc62_manual_cmd.stderr }}
            {% endif %}
            Exit code: {{ tc62_manual_cmd.rc | default('unknown') }}
            {% elif tc62_cmd is defined %}
            {{ tc62_cmd.stdout | default('') }}
            {% if tc62_cmd.stderr | default('') | length > 0 %}
            STDERR:
            {{ tc62_cmd.stderr }}
            {% endif %}
            Exit code: {{ tc62_cmd.rc | default('unknown') }}
            {% else %}
            No restore execution: the destructive case is disabled or its exact confirmation is missing.
            {% endif %}
          details: "{{ 'Manual restore execution was declared. ATP validated node readiness, ClusterOperator health, and etcd pod readiness only; it did not independently verify that the restore procedure was performed.' if (tc62_manual_execution_enabled | bool) else 'This recovery is destructive and remains Skipped unless tc62_restore_enabled=true and tc62_restore_confirmation=RESTORE-ETCD-<cluster_name>. A wrong confirmation is a Fail and no restore command runs.' }}"
          additional_comments: "{{ 'Manual execution was declared with tc62_manual_execution=true. Evidence is limited to oc get nodes, oc get co, and oc get pods -n openshift-etcd; the playbook did not execute an etcd restore.' if (tc62_manual_execution_enabled | bool) else '' }}"
          remediation: "{{ 'Review node readiness, ClusterOperator conditions, and etcd pod readiness from the captured evidence. Resolve any unhealthy state before declaring the manual recovery complete.' if (tc62_manual_execution_enabled | bool) else 'Never use this to validate routine health. Confirm a controlled recovery exercise, matching cluster/backup z-stream, working out-of-band access to every control-plane node, and matching snapshot/static_kuberesources files. If any restore step has started and fails, follow the Red Hat recovery runbook; do not rerun blindly.' }}"

    - name: "TC-62: Append Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [tc62_result] }}"
  tags: ['general', 'telco', 'tc62', 'etcd_restore']