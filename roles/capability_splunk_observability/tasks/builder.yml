---
- name: Build Splunk observability capability artifact facts
  vars:
    day2_splunk_observability_section_current: "{{ (day2_capability_sections_by_key | default({})).get('splunk_observability', {}) }}"
    splunk_namespace_present_current: "{{ ((day2_posture_summary | default({})).get('splunk_namespace_present', false)) | bool }}"
    splunk_crd_present_current: "{{ ((day2_posture_summary | default({})).get('splunk_crd_present', false)) | bool }}"
    splunk_operator_workload_present_current: "{{ ((day2_posture_summary | default({})).get('splunk_operator_workload_present', false)) | bool }}"
    splunk_workload_present_current: "{{ ((day2_posture_summary | default({})).get('splunk_workload_present', false)) | bool }}"
    splunk_cluster_name_config_present_current: "{{ ((day2_posture_summary | default({})).get('splunk_cluster_name_config_present', false)) | bool }}"
    splunk_destination_config_present_current: "{{ ((day2_posture_summary | default({})).get('splunk_destination_config_present', false)) | bool }}"
    splunk_required_deployment_configuration_present_current: "{{ ((day2_posture_summary | default({})).get('splunk_required_deployment_configuration_present', false)) | bool }}"
    splunk_context_present_current: "{{ ((day2_posture_summary | default({})).get('splunk_context_present', false) or splunk_namespace_present_current or splunk_crd_present_current or splunk_operator_workload_present_current or splunk_workload_present_current) | bool }}"
    splunk_observability_present_current: "{{ ((day2_posture_summary | default({})).get('splunk_observability_present', false) or splunk_workload_present_current) | bool }}"
    splunk_missing_status_current: "{{ 'WARNING' if (day2_splunk_observability_section_current.required | default(false) | bool) else 'INFO' }}"
    splunk_missing_check_status_current: "{{ 'WARN' if (day2_splunk_observability_section_current.required | default(false) | bool) else 'INFO' }}"
    splunk_missing_severity_current: "{{ 'warning' if (day2_splunk_observability_section_current.required | default(false) | bool) else 'info' }}"
    splunk_context_detail_current: >-
      {{
        'namespace_present=' ~ ((splunk_namespace_present_current | bool) | string)
        ~ ' crd_present=' ~ ((splunk_crd_present_current | bool) | string)
        ~ ' operator_workload_present=' ~ ((splunk_operator_workload_present_current | bool) | string)
      }}
    splunk_configuration_detail_current: >-
      {{
        'cluster_name_config_present=' ~ ((splunk_cluster_name_config_present_current | bool) | string)
        ~ ' destination_config_present=' ~ ((splunk_destination_config_present_current | bool) | string)
      }}
    splunk_workload_detail_current: "{{ 'workload_present=' ~ ((splunk_workload_present_current | bool) | string) }}"
    splunk_reason_summary_current: "{{ splunk_context_detail_current ~ ' ' ~ splunk_configuration_detail_current ~ ' ' ~ splunk_workload_detail_current }}"
    splunk_recommended_action_current: >-
      {{
        'Validate that cluster metrics, logs, and traces reach Splunk through the intended telemetry path.'
        if (splunk_observability_present_current | bool)
        else (
          'Splunk operator or chart context was detected, but the documented deployment configuration for Splunk OpenTelemetry on OpenShift could not be confirmed. Review the Helm or operator-backed deployment for clusterName and destination settings, then confirm active collector rollout.'
          if (splunk_context_present_current | bool)
          else 'If Splunk-managed observability is intended, deploy the documented Helm or operator-backed collector path with clusterName and destination settings, then confirm active managed collector workloads.'
        )
      }}
    splunk_findings_current: >-
      {{
        []
        if (splunk_observability_present_current | bool)
        else [
          {
            'capability': 'splunk_observability',
            'issue': 'prod-day2-splunk-observability-missing',
            'severity': splunk_missing_severity_current,
            'source': 'Splunk OpenTelemetry and logging inventory',
            'detail': (
              'Splunk operator or chart context was detected, but the documented deployment configuration for Splunk OpenTelemetry on OpenShift could not be confirmed and no managed collector workload footprint was detected'
              if (splunk_context_present_current | bool)
              else 'no Splunk documented deployment configuration or managed collector workload footprint was detected'
            ),
            'recommended_action': splunk_recommended_action_current,
            'docs': ((day2_splunk_observability_section_current.docs | default([])) | string)
          }
        ]
      }}
    splunk_section_override_current: >-
      {{
        (day2_splunk_observability_section_current | default({}))
        | combine(
            {
              'accounting_state': 'assessed',
              'check_count': 3,
              'finding_count': (0 if (splunk_observability_present_current | bool) else 1),
              'checks': [
                {
                  'capability': 'Splunk operator or chart context',
                  'capability_key': 'splunk_observability',
                  'detail': splunk_context_detail_current,
                  'level': ((day2_splunk_observability_section_current.criticality | default('medium')) | string),
                  'scored': false,
                  'source': 'Splunk OpenTelemetry and logging inventory',
                  'status': ('OK' if (splunk_context_present_current | bool) else splunk_missing_check_status_current)
                },
                {
                  'capability': 'Splunk required deployment configuration',
                  'capability_key': 'splunk_observability',
                  'detail': splunk_configuration_detail_current,
                  'level': ((day2_splunk_observability_section_current.criticality | default('medium')) | string),
                  'scored': false,
                  'source': 'Splunk OpenTelemetry and logging inventory',
                  'status': ('OK' if (splunk_required_deployment_configuration_present_current | bool) else ('WARN' if ((splunk_context_present_current | bool) or (day2_splunk_observability_section_current.required | default(false) | bool)) else 'INFO'))
                },
                {
                  'capability': 'Splunk managed workload footprint',
                  'capability_key': 'splunk_observability',
                  'detail': splunk_workload_detail_current,
                  'level': ((day2_splunk_observability_section_current.criticality | default('medium')) | string),
                  'scored': false,
                  'source': 'Splunk OpenTelemetry and logging inventory',
                  'status': ('OK' if (splunk_workload_present_current | bool) else ('WARN' if ((splunk_context_present_current | bool) or (day2_splunk_observability_section_current.required | default(false) | bool)) else 'INFO'))
                },
              ],
              'findings': splunk_findings_current,
              'status': ('OK' if (splunk_observability_present_current | bool) else splunk_missing_status_current),
              'top_detail': (
                splunk_reason_summary_current
                if (splunk_observability_present_current | bool)
                else (
                  'Splunk operator or chart context was detected, but the documented deployment configuration for Splunk OpenTelemetry on OpenShift could not be confirmed and no managed collector workload footprint was detected'
                  if (splunk_context_present_current | bool)
                  else 'no Splunk documented deployment configuration or managed collector workload footprint was detected'
                )
              ),
              'recommended_action': splunk_recommended_action_current
            },
            recursive=True
          )
      }}
  ansible.builtin.set_fact:
    capability_artifact_key: splunk_observability
    capability_artifact_section_override: "{{ splunk_section_override_current }}"
    capability_artifact_analysis_summary:
      assessment_state: "{{ (day2_posture_summary | default({})).get('capability_assessment_state', 'unknown') }}"
      accounting_state: assessed
      check_count: 3
      finding_count: "{{ (0 if (splunk_observability_present_current | bool) else 1) | int }}"
      status: "{{ 'OK' if (splunk_observability_present_current | bool) else splunk_missing_status_current }}"
      status_summary: "{{ 'OK' if (splunk_observability_present_current | bool) else splunk_missing_status_current }}"
      top_detail: "{{ splunk_section_override_current.top_detail }}"
      reason_summary: "{{ splunk_section_override_current.top_detail }}"
    capability_artifact_render_inputs:
      day2_splunk_observability_section: "{{ splunk_section_override_current }}"
    capability_artifact_collection_inputs:
      splunk_namespace_present: "{{ splunk_namespace_present_current | bool }}"
      splunk_crd_present: "{{ splunk_crd_present_current | bool }}"
      splunk_operator_workload_present: "{{ splunk_operator_workload_present_current | bool }}"
      splunk_workload_present: "{{ splunk_workload_present_current | bool }}"
      splunk_cluster_name_config_present: "{{ splunk_cluster_name_config_present_current | bool }}"
      splunk_destination_config_present: "{{ splunk_destination_config_present_current | bool }}"
      splunk_required_deployment_configuration_present: "{{ splunk_required_deployment_configuration_present_current | bool }}"
