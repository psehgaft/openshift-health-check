---
# Full user-facing OpenShift cluster health profile.
# Copy this file and toggle postures or capabilities to control what the repo evaluates.
# Use with:
#   ansible-playbook playbooks/openshift_cluster_health_report.yml -e cluster_health_profile_override_source_path=inputs/openshift-cluster-health-profile.yml
cluster_health_profile:
  postures:
    evidence_and_supportability:
      enabled: true
      required: true
      owner: supportability
      notes: Confirm the collected evidence is complete enough for triage, escalation,
        and final sign-off so the report is not hiding risk behind missing diagnostics.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/support/gathering-cluster-data
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/support/remote-health-monitoring-with-connected-clusters
      verification:
      - The next report run shows supportability in `supported` or `healthy` state.
      - Evidence confidence is `medium` or `high`.
      - Collection or diagnostic gaps are cleared or intentionally accepted.
      includes: []
      satisfied_by_all: []
    platform_health:
      enabled: true
      required: true
      owner: platform
      notes: Confirm the control plane, API path, ingress path, and core operators
        are stable before trusting lower-priority findings or planning remediation
        elsewhere.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/operators/index
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/etcd/index
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/networking/configuring-ingress-cluster-traffic
      verification:
      - The next report run shows no degraded or unavailable core operators.
      - There are no unresolved API, etcd, ingress, or APIService runtime issues.
      includes: []
      satisfied_by_all: []
    node_health_and_capacity:
      enabled: true
      required: true
      owner: node
      notes: Confirm worker stability, capacity headroom, and remediation readiness
        so node failure, pressure, or hotspot conditions do not turn into prolonged
        workload disruption.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/nodes/nodes
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/machine_management/index
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/scalability_and_performance/recommended-performance-and-scalability-practices-2
      verification:
      - The next report run shows no NotReady nodes.
      - There are no unresolved pressure or hotspot findings.
      - Machine remediation is configured when Machine API-managed worker pools are
        expected.
      includes:
      - machine_health_check_remediation
      satisfied_by_all:
      - node_tuning_operator
    backup_and_disaster_recovery:
      enabled: true
      required: true
      owner: backup
      notes: Confirm workload recovery and, where applicable, self-managed control-plane
        recovery with evidence, not tooling assumptions.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/backup_and_restore/oadp-application-backup-and-restore
      - https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/etcd/backing-up-and-restoring-etcd-data
      verification:
      - The next report run shows usable backup locations and active schedules.
      - Successful backup and restore evidence is present.
      - Control-plane backup evidence is present when the cluster is self-managed.
      includes:
      - control_plane_backup_and_recovery_readiness
      - openshift_data_foundation
      - secondary_site_disaster_recovery
      - acm_multicluster_disaster_recovery
      satisfied_by_all: []
    application_access_and_network_isolation:
      enabled: true
      required: true
      owner: network
      notes: Confirm routes, ingress, proxy exclusions, and namespace isolation align
        with the intended access design.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/networking/configuring-routes
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/network_security/network-policy
      verification:
      - The next report run shows clean route and ingress health.
      - Proxy exclusions and namespace isolation controls align with the intended
        access design.
      includes:
      - ingress_controller_topology_and_sharding
      - namespace_network_policy_baseline
      - namespace_egress_controls
      satisfied_by_all: []
    observability:
      enabled: true
      required: true
      owner: observability
      notes: Confirm the cluster can deliver metrics, alerts, and logs through the
        native stack or an approved alternate observability platform.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/monitoring/index
      - https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/latest/html/configuring_user_workload_monitoring/index
      - https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.4/html/configuring_logging/configuring-log-forwarding
      - https://docs.dynatrace.com/docs/ingest-from/setup-on-k8s
      - https://docs.datadoghq.com/containers/datadog_operator/
      - https://help.splunk.com/en/splunk-observability-cloud/manage-data/splunk-distribution-of-the-opentelemetry-collector/get-started-with-the-splunk-distribution-of-the-opentelemetry-collector/collector-for-kubernetes
      verification:
      - The next report run shows healthy monitoring.
      - Expected metrics, alert, and log export paths are configured.
      - The chosen observability platform is receiving cluster telemetry.
      includes:
      - cluster_log_forwarding
      - cluster_network_observability
      - external_alert_delivery
      - user_workload_metrics_monitoring
      - user_workload_alerting_and_slos
      - persistent_monitoring_storage
      - openshift_custom_metrics_autoscaler
      satisfied_by_all:
      - dynatrace_observability
    security_and_governance:
      enabled: true
      required: true
      owner: security
      notes: Confirm external identity provider integration, encryption, registry
        policy, tenant guardrails, workload vulnerability scanning, and the intended
        secret-management path are in place for production use.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/security_and_compliance/index
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/authentication_and_authorization/configuring-identity-providers
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/etcd/etcd#enabling-etcd-encryption_encrypting-etcd
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/building_applications/projects
      - https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_security_for_kubernetes
      - https://external-secrets.io/latest/api/externalsecret/
      verification:
      - The next report run shows external-identity-provider, encryption, registry,
        tenant-governance, workload-vulnerability-scanning, and secret-management
        findings reduced to accepted or healthy state.
      includes:
      - oauth_external_identity_provider
      - etcd_encryption
      - image_registry_policy_governance
      - multi_tenant_namespace_governance
      - cyberark_conjur_secrets_management
      - advanced_cluster_security
      - api_server_audit_and_log_retention
      - compliance_requirements_validation
      - custom_ca_trust_bundle
      - image_signature_and_admission_policy
      - ovn_ipsec_encryption
      - workload_vulnerability_scanning
      - workloads_using_external_private_registries
      satisfied_by_all: []
    workload_health:
      enabled: true
      required: true
      owner: workload
      notes: Separate immediate application instability from follow-on hygiene work
        such as probes, resources, ownership, and rightsizing so teams can address
        outages before optimization work.
      docs:
      - https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
      - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/building_applications/deployments
      verification:
      - The next report run shows no unresolved unhealthy pods or rollout blockers.
      - Probe, resource, and rollout hygiene findings are reduced to accepted or healthy
        state.
      includes: []
      satisfied_by_all: []
    platform_architecture_and_lifecycle:
      enabled: true
      required: true
      owner: lifecycle
      notes: Confirm the cluster is on a supported release path, upgrade-safe, and
        deployed across the expected failure domains so maintenance windows do not
        introduce avoidable platform risk.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/updating_clusters/index
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/installing_on_any_platform/installing-platform-agnostic
      verification:
      - The next report run shows supported lifecycle status.
      - There are no blocking upgrade risks.
      - Topology or failure-domain assumptions match the intended platform design.
      includes: []
      satisfied_by_all: []
    capacity_planning_snapshot:
      enabled: true
      required: true
      owner: capacity
      notes: Use this posture for sizing only when node inventory and allocatable
        capacity are complete enough to support scaling, headroom, and incident-response
        decisions.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/scalability_and_performance/scalability-and-performance-overview
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/scalability_and_performance/recommended-performance-and-scalability-practices-2
      verification:
      - The next report run includes complete node inventory plus allocatable CPU
        and memory values.
      - Sizing decisions no longer depend on partial or not-derived capacity values.
      includes: []
      satisfied_by_all:
      - cost_management_operator
    declarative_operations:
      enabled: true
      required: false
      owner: operations
      notes: Confirm the intended declarative operating model, especially Git-backed
        reconciliation for cluster and platform changes, so change control and recovery
        are repeatable.
      docs:
      - https://docs.redhat.com/en/documentation/red_hat_openshift_gitops/latest
      verification:
      - The next report run shows the intended GitOps operating model present with
        healthy, repo-backed, and appropriately synchronized application definitions.
      - Critical platform changes are represented in the declared reconciliation model.
      includes:
      - declarative_gitops_operations
      - advanced_cluster_management
      satisfied_by_all: []
    container_platform_adoption_and_release_engineering:
      enabled: false
      required: false
      owner: release
      notes: Confirm that cluster-hosted delivery tooling, pipeline execution, and
        build ownership are stable enough for repeatable releases and controlled change
        promotion.
      docs:
      - https://docs.redhat.com/en/documentation/red_hat_openshift_pipelines/latest
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/builds_using_buildconfig
      verification:
      - The next report run shows no unresolved failed pipeline or trigger-ownership
        findings.
      - Delivery tooling failures are no longer blocking normal release flow.
      includes: []
      satisfied_by_all: []
    day2_production_readiness:
      enabled: true
      required: true
      owner: operations
      notes: Use this synthesized posture as the final production-readiness decision
        after the owning postures and required capabilities have been reviewed.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/postinstallation_configuration/index
      verification:
      - The next report run shows no unresolved blocking posture or capability gaps.
      - Evidence confidence is acceptable for a production-readiness decision.
      includes: []
      satisfied_by_all: []
  capabilities:
    application_backup_and_restore_readiness:
      enabled: false
      required: false
      criticality: critical
      expected_state: healthy
      owner: operations
      evidence_required:
      - must-gather
      - inspect
      - oc-get
      notes: Production clusters should have a working application backup path with
        scheduled backups, usable storage locations, and evidence that backup and
        restore operations succeed for the workloads the team expects to recover.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/backup_and_restore/oadp-application-backup-and-restore
      verification:
      - Backup storage locations are reachable and usable.
      - Backup schedules are configured for the workloads in scope.
      - Successful backup and restore evidence exists for the expected recovery path.
    control_plane_backup_and_recovery_readiness:
      enabled: true
      required: true
      criticality: critical
      expected_state: healthy
      owner: operations
      evidence_required:
      - must-gather
      - inspect
      - oc-get
      - oc-debug-node
      notes: Self-managed OpenShift clusters should have a working control-plane recovery
        path with recurring etcd snapshots, retained static-pod resources, and a documented
        or tested procedure to recover the control plane.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/etcd/backing-up-and-restoring-etcd-data
      verification:
      - Recurring etcd snapshot evidence is present.
      - Static pod resource backup evidence is present and retained as intended.
      - A control-plane recovery procedure is documented or tested for the cluster.
    secondary_site_disaster_recovery:
      enabled: true
      required: true
      criticality: high
      expected_state: healthy
      owner: operations
      evidence_required:
      - must-gather
      - oc-get
      notes: Use this capability when the cluster is expected to participate in a
        secondary-site disaster-recovery design with replicated storage, topology-aware
        placement, and protected workload failover paths.
      docs:
      - https://docs.redhat.com/en/documentation/red_hat_openshift_data_foundation/4.21
      verification:
      - Disaster-recovery resources such as DRPolicy, DRCluster, or replication objects
        are present when this capability is enabled.
      - Topology, replication, and protected-workload evidence support the intended
        secondary-site recovery design.
    acm_multicluster_disaster_recovery:
      enabled: false
      required: true
      criticality: high
      expected_state: healthy
      owner: operations
      evidence_required:
      - must-gather
      - oc-get
      notes: Use this capability when Red Hat Advanced Cluster Management is expected
        to coordinate multicluster disaster recovery across registered clusters and
        protected application placements. The intended implementation path is the
        ACM + OpenShift Data Foundation DR solution, including managed-cluster registration,
        DRPolicy and DRCluster topology, storage replication, and protected workload
        failover orchestration.
      docs:
      - https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_management_for_kubernetes/latest/html/clusters/index
      - https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_management_for_kubernetes/latest/html/business_continuity/index
      - https://docs.redhat.com/en/documentation/red_hat_openshift_data_foundation/4.21/html/configuring_openshift_data_foundation_disaster_recovery_for_openshift_workloads/index
      verification:
      - ACM managed-cluster registration evidence is present for the clusters that
        participate in the DR design when this capability is enabled.
      - ACM + ODF DR resources such as DRPolicy, DRCluster, DRPlacementControl,
        VolumeReplicationClass, VolumeReplication, or VolumeReplicationGroup are
        present for the intended recovery path.
      - The intended multicluster DR topology, replication, and protected-workload
        coverage are healthy enough for the expected ACM + ODF recovery path.
    declarative_gitops_operations:
      enabled: true
      required: true
      criticality: high
      expected_state: present
      owner: operations
      evidence_required:
      - must-gather
      - inspect
      - oc-get
      notes: Most production OpenShift environments should manage critical platform
        and application configuration through a Git-backed reconciliation model so
        change intent, drift correction, and rollback paths are explicit.
      docs:
      - https://docs.redhat.com/en/documentation/red_hat_openshift_gitops/1.20/html/declarative_cluster_configuration/index
      verification:
      - Git-backed reconciliation objects are present for the resources the team expects
        to manage declaratively.
      - Application sync and health are acceptable for the declared GitOps operating
        model.
    cluster_log_forwarding:
      enabled: false
      required: false
      criticality: high
      expected_state: healthy
      owner: observability
      evidence_required:
      - must-gather
      - oc-get
      notes: Production clusters should have an intentional centralized logging path
        for the log classes the operating model depends on, especially application,
        infrastructure, and audit logs when those are expected to leave the cluster.
      docs:
      - https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.4/html/configuring_logging/configuring-log-forwarding
      verification:
      - Expected log collection paths are configured for the required log classes.
      - External or centralized log forwarding is configured for the intended destination.
    external_alert_delivery:
      enabled: true
      required: true
      criticality: high
      expected_state: healthy
      owner: observability
      evidence_required:
      - must-gather
      - oc-get
      notes: Production alerts should leave the cluster through an accountable notification
        path so incidents reach the teams that are expected to respond.
      docs:
      - https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/configuring_core_platform_monitoring/configuring-alerts-and-notifications
      verification:
      - External alert receivers are configured.
      - Alert routing references those receivers.
      - A test alert reaches the intended destination.
    user_workload_metrics_monitoring:
      enabled: false
      required: true
      criticality: high
      expected_state: configured
      owner: observability
      evidence_required:
      - must-gather
      - oc-get
      notes: Most production clusters need a workload-metrics path for tenant applications,
        either through OpenShift user workload monitoring or an approved alternate
        monitoring implementation.
      docs:
      - https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/latest/html/configuring_user_workload_monitoring/index
      verification:
      - A workload-metrics path is enabled for tenant or application workloads.
      - Prometheus or an approved alternate monitoring path covers the workload metrics
        the operating model depends on.
    persistent_monitoring_storage:
      enabled: false
      required: true
      criticality: high
      expected_state: healthy
      owner: observability
      evidence_required:
      - must-gather
      - oc-get
      notes: Monitoring components that the cluster relies on for continuity and incident
        response should use persistent storage where required, so metrics and alerting
        state survive routine restarts and disruption events.
      docs:
      - https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/latest/html-single/configuring_core_platform_monitoring/configuring_core_platform_monitoring
      verification:
      - Prometheus and Alertmanager persistence are configured where required by the
        operating model.
      - Thanos Ruler persistence is configured when the deployment topology requires
        it.
    grafana_metrics_dashboards:
      enabled: false
      required: false
      criticality: low
      expected_state: present
      owner: observability
      evidence_required:
      - must-gather
      - oc-get
      notes: Use this capability when Grafana dashboards are part of the intended
        operational workflow for cluster or workload metric visibility.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/4.13/html/monitoring/reviewing-monitoring-dashboards
      verification:
      - Grafana dashboard resources or equivalent dashboard inventory are present
        when this capability is enabled.
      - The expected dashboard path exists for the teams that depend on Grafana-based
        metric visualization.
    cluster_metrics_remote_write:
      enabled: false
      required: false
      criticality: medium
      expected_state: configured
      owner: observability
      evidence_required:
      - must-gather
      - oc-get
      - prometheus
      notes: Use this capability when cluster metrics are expected to leave the cluster
        through Prometheus remote write or an approved vendor forwarding path for
        external retention, alerting, or analytics.
      docs:
      - https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/latest/html-single/configuring_core_platform_monitoring/configuring_core_platform_monitoring
      - https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/latest/html/configuring_user_workload_monitoring/index
      verification:
      - Cluster metrics remote-write configuration or an equivalent vendor forwarding
        path is present when this capability is enabled.
      - The intended external metrics destination is configured for the operating
        model that depends on it.
    cluster_network_observability:
      enabled: false
      required: false
      criticality: medium
      expected_state: healthy
      owner: observability
      evidence_required:
      - must-gather
      - oc-get
      notes: Use this capability when the operating model depends on intentional
        network-flow, DNS, or service-path visibility for troubleshooting and service
        assurance, whether through OpenShift Network Observability or another approved
        network-observability path.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/network_observability/network_observability_overview
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/networking/ingress_and_load_balancing
      verification:
      - Network-observability resources or an equivalent approved implementation
        are present when this capability is enabled.
      - The expected network-flow or DNS-path visibility is available for the teams
        that depend on network observability during incident response.
    oauth_external_identity_provider:
      enabled: true
      required: true
      criticality: high
      expected_state: healthy
      owner: security
      evidence_required:
      - must-gather
      - oc-get
      notes: Production OpenShift clusters should rely on an external identity system
        for human access rather than depending only on local identities or kubeadmin-style
        fallback access.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/authentication_and_authorization/configuring-identity-providers
      verification:
      - At least one external OAuth identity provider is configured.
      - The cluster is not relying solely on local identity providers or emergency
        fallback credentials for normal access.
    cluster_proxy_configuration:
      enabled: false
      required: false
      criticality: medium
      expected_state: configured
      owner: network
      evidence_required:
      - must-gather
      - oc-get
      notes: Use this capability when the cluster is expected to operate behind an
        HTTP or HTTPS proxy and therefore needs an intentional proxy configuration
        with complete internal no-proxy coverage.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/networking/enable-cluster-wide-proxy
      verification:
      - Cluster proxy settings are configured when this capability is enabled.
      - Internal no-proxy coverage includes the service and cluster-local domains
        the platform depends on.
    custom_ca_trust_bundle:
      enabled: true
      required: true
      criticality: medium
      expected_state: configured
      owner: security
      evidence_required:
      - must-gather
      - oc-get
      notes: Use this capability when the cluster is expected to trust an additional
        certificate authority bundle for outbound access, mirrored registries, or
        internal enterprise TLS paths.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/security_and_compliance/security_and_compliance
      - https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/images/image-configuration-classic
      verification:
      - Additional trusted CA configuration is present when this capability is enabled.
      - The intended enterprise trust bundle path is configured for the workloads
        and platform components that depend on it.
    machine_health_check_remediation:
      enabled: true
      required: true
      criticality: high
      expected_state: configured
      owner: platform
      evidence_required:
      - must-gather
      - oc-get
      notes: Most production clusters that rely on Machine API-managed worker pools
        should have an intentional worker remediation path so failed nodes do not
        require purely manual recovery.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/machine_management/index
      verification:
      - MachineHealthCheck resources are configured for Machine API-managed worker
        pools, or a documented exception explains why they are intentionally not used.
    cluster_autoscaler_configuration:
      enabled: false
      required: false
      criticality: medium
      expected_state: configured
      owner: platform
      evidence_required:
      - must-gather
      - oc-get
      notes: Use this capability when the cluster is expected to scale Machine API-managed
        worker pools automatically through ClusterAutoscaler and MachineAutoscaler
        resources.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/machine_management/index
      verification:
      - Cluster autoscaler resources are present when this capability is enabled.
      - The intended autoscaling path is healthy for the worker pools that depend
        on it.
    etcd_encryption:
      enabled: true
      required: true
      criticality: high
      expected_state: healthy
      owner: security
      evidence_required:
      - must-gather
      - oc-get
      notes: OpenShift API resources stored in etcd should be encrypted at rest, and
        the encryption rollout should be complete across the reporting API server
        components.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/etcd/etcd#enabling-etcd-encryption_encrypting-etcd
      verification:
      - etcd encryption is enabled.
      - The encryption rollout is complete across reporting API server components.
    ovn_ipsec_encryption:
      enabled: true
      required: true
      criticality: medium
      expected_state: configured
      owner: network
      evidence_required:
      - must-gather
      - oc-get
      notes: Use this capability when the cluster is expected to protect pod-network
        traffic with OVN-Kubernetes IPsec encryption between nodes.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/4.17/html/network_security/configuring-ipsec-ovn
      verification:
      - OVN IPsec configuration is enabled when this capability is expected.
      - The cluster reports the intended network-encryption path for inter-node pod
        traffic.
    ingress_controller_topology_and_sharding:
      enabled: false
      required: false
      criticality: medium
      expected_state: configured
      owner: network
      evidence_required:
      - must-gather
      - oc-get
      notes: Use this capability when the cluster is expected to run a deliberate
        ingress-controller topology such as dedicated ingress domains, shard-specific
        routes, infrastructure-only ingress, or topology-aware separation for different
        workloads or tenants.
      docs:
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/networking/configuring-ingress-cluster-traffic
      - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/networking/ingress-sharding
