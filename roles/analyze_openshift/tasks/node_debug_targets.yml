---
- name: Build node debug target facts
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/run_json_helper_from_stdin.py"
      - "{{ playbook_dir }}/../scripts/build_node_debug_targets.py"
    stdin: >-
      {{
        {
          'not_ready_nodes': not_ready_nodes | default([]),
          'pressure_nodes': pressure_nodes | default([]),
          'high_pod_density_nodes': high_pod_density_nodes | default([]),
          'critical_pod_density_nodes': critical_pod_density_nodes | default([]),
          'top_high_restart_pods': top_high_restart_pods | default(high_restart_pods | default([])),
          'pod_restart_hotspots': pod_restart_hotspots | default([]),
          'pod_restart_warning_threshold': pod_restart_warning_threshold | default(5)
        } | to_json
      }}
  register: node_debug_targets_cmd
  changed_when: false
  failed_when: false

- name: Normalize node debug target facts
  vars:
    node_debug_target_data: "{{ node_debug_targets_cmd.stdout | from_json if (node_debug_targets_cmd.rc == 0 and (node_debug_targets_cmd.stdout | default('') | length > 0)) else {} }}"
  ansible.builtin.set_fact:
    node_debug_target_candidates: "{{ node_debug_target_data.node_debug_target_candidates | default([]) }}"
    node_debug_target_nodes: "{{ node_debug_target_data.node_debug_target_nodes | default([]) }}"
    node_debug_target_reason_map: "{{ node_debug_target_data.node_debug_target_reason_map | default({}) }}"
  changed_when: false
