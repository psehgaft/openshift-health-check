---
- name: Resolve canonical collected analysis graph
  ansible.builtin.set_fact:
    analysis_graph: "{{ collected_resource_graph | default({}) }}"

- name: Seed collected-state compatibility facts for reused analysis
  ansible.builtin.set_fact:
    cluster_profile: {}
    assessment_collection_summary:
      command_count: "{{ evidence_summary.source_count | default(0) | int }}"
      parallelism: 0
      timeout_seconds: "{{ collection_command_timeout_seconds | default(300) | int }}"
      applicable_command_count: "{{ evidence_summary.source_count | default(0) | int }}"
      failed_commands: 0
      timed_out_commands: 0
      core_failed_commands: 0
      succeeded_commands: "{{ evidence_summary.source_count | default(0) | int }}"
      optional_skipped_commands: 0
    assessment_collection_failures: []
    assessment_collection_skipped_optional_commands: []
