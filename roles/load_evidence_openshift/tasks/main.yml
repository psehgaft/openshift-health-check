---
- name: Build collected OpenShift resource graph
  ansible.builtin.include_tasks: resource_graph.yml

- name: Build OpenShift evidence scaffold facts
  ansible.builtin.include_tasks: scaffold.yml

- name: Optionally supplement missing or insufficient API evidence from live cluster
  ansible.builtin.include_tasks: live_api_fallback.yml
  when:
    - report_mode_resolved | default('live') == 'collected'
    - collect_live_missing_api_evidence | default(collect_live_missing_etcd_encryption_evidence | default(true)) | bool

- name: Load OpenShift product evidence
  ansible.builtin.include_tasks: product_evidence.yml
