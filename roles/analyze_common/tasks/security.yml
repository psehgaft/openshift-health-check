---
- name: Build namespace policy and quota counts
  ansible.builtin.set_fact:
    networkpolicy_namespace_counts: "{{ networkpolicy_namespace_counts | default({}) | combine({item.metadata.namespace | default(''): ((networkpolicy_namespace_counts[item.metadata.namespace | default('')] | default(0)) + 1)}, recursive=True) }}"
    ingress_policy_namespace_counts: "{{ ingress_policy_namespace_counts | default({}) | combine({item.metadata.namespace | default(''): ((ingress_policy_namespace_counts[item.metadata.namespace | default('')] | default(0)) + ingress_policy_increment)}, recursive=True) }}"
    egress_policy_namespace_counts: "{{ egress_policy_namespace_counts | default({}) | combine({item.metadata.namespace | default(''): ((egress_policy_namespace_counts[item.metadata.namespace | default('')] | default(0)) + egress_policy_increment)}, recursive=True) }}"
  loop: "{{ (networkpolicies | default({})).get('items', []) }}"
  vars:
    policy_types: "{{ item.spec.policyTypes | default(['Ingress']) }}"
    ingress_policy_increment: "{{ 1 if 'Ingress' in policy_types else 0 }}"
    egress_policy_increment: "{{ 1 if 'Egress' in policy_types else 0 }}"
  changed_when: false

- name: Build namespace resource quota counts
  ansible.builtin.set_fact:
    resourcequota_namespace_counts: "{{ resourcequota_namespace_counts | default({}) | combine({item.metadata.namespace | default(''): ((resourcequota_namespace_counts[item.metadata.namespace | default('')] | default(0)) + 1)}, recursive=True) }}"
  loop: "{{ (resourcequotas | default({})).get('items', []) }}"
  changed_when: false

- name: Build namespace limitrange counts
  ansible.builtin.set_fact:
    limitrange_namespace_counts: "{{ limitrange_namespace_counts | default({}) | combine({item.metadata.namespace | default(''): ((limitrange_namespace_counts[item.metadata.namespace | default('')] | default(0)) + 1)}, recursive=True) }}"
  loop: "{{ (limitranges | default({})).get('items', []) }}"
  changed_when: false

- name: Build namespace hygiene findings
  ansible.builtin.set_fact:
    namespaces_without_networkpolicy: "{{ namespaces_without_networkpolicy | default([]) + ([item] if (((networkpolicy_namespace_counts | default({}))[item] | default(0) | int) == 0) else []) }}"
    namespaces_without_resourcequota: "{{ namespaces_without_resourcequota | default([]) + ([item] if (((resourcequota_namespace_counts | default({}))[item] | default(0) | int) == 0) else []) }}"
    namespaces_without_limitrange: "{{ namespaces_without_limitrange | default([]) + ([item] if (((limitrange_namespace_counts | default({}))[item] | default(0) | int) == 0) else []) }}"
    empty_user_namespaces: "{{ empty_user_namespaces | default([]) + ([item] if (((namespace_pod_counts | default({}))[item] | default(0) | int) == 0) else []) }}"
    namespaces_missing_ingress_policies: "{{ namespaces_missing_ingress_policies | default([]) + ([item] if ((((networkpolicy_namespace_counts | default({}))[item] | default(0) | int) > 0) and (((ingress_policy_namespace_counts | default({}))[item] | default(0) | int) == 0) else []) }}"
    namespaces_missing_egress_policies: "{{ namespaces_missing_egress_policies | default([]) + ([item] if ((((networkpolicy_namespace_counts | default({}))[item] | default(0) | int) > 0) and (((egress_policy_namespace_counts | default({}))[item] | default(0) | int) == 0) else []) }}"
  loop: "{{ user_namespace_names | default([]) }}"
  changed_when: false

- name: Build pod CPU request map
  block:
    - name: Create temporary pod CPU request map input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-pod-cpu-
        suffix: .json
      register: pod_cpu_request_map_input_file

    - name: Write pod CPU request map input data
      ansible.builtin.copy:
        dest: "{{ pod_cpu_request_map_input_file.path }}"
        content: "{{ (pods | default({})).get('items', []) | to_json }}"
        mode: "0600"

    - name: Run pod CPU request map helper
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/build_pod_cpu_request_map.py"
          - "{{ pod_cpu_request_map_input_file.path }}"
      register: pod_cpu_request_map_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove temporary pod CPU request map input file
      ansible.builtin.file:
        path: "{{ pod_cpu_request_map_input_file.path }}"
        state: absent
      when: pod_cpu_request_map_input_file is defined and (pod_cpu_request_map_input_file.path | default('') | length > 0)

- name: Normalize pod CPU request map
  ansible.builtin.set_fact:
    pod_cpu_request_map: "{{ pod_cpu_request_map_cmd.stdout | from_json if (pod_cpu_request_map_cmd.rc == 0 and (pod_cpu_request_map_cmd.stdout | default('') | length > 0)) else {} }}"

- name: Build security and workload practice findings
  ansible.builtin.set_fact:
    security_findings: "{{ security_findings | default([]) + security_entries }}"
    workload_practice_findings: "{{ workload_practice_findings | default([]) + practice_entries }}"
    node_cpu_request_millicores: "{{ (node_cpu_request_millicores | default({})) | combine({node_name: (((node_cpu_request_millicores | default({}))[node_name] | default(0)) + cpu_request_total_millicores)}, recursive=True) }}"
  loop: "{{ (pods | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    node_name: "{{ item.spec.nodeName | default('unscheduled') }}"
    pod_key: "{{ ns_name ~ '/' ~ (item.metadata.name | default('')) }}"
    is_user_namespace: "{{ (not (ns_name is match(user_namespaces_exclude_regex))) | bool }}"
    containers: "{{ (item.spec.containers | default([])) + (item.spec.initContainers | default([])) }}"
    privileged_names: "{{ containers | selectattr('securityContext.privileged', 'defined') | selectattr('securityContext.privileged', 'equalto', true) | map(attribute='name') | list }}"
    hostpath_volume_names: "{{ item.spec.volumes | default([]) | selectattr('hostPath', 'defined') | map(attribute='name') | list }}"
    run_as_root_names: "{{ containers | selectattr('securityContext.runAsUser', 'defined') | selectattr('securityContext.runAsUser', 'equalto', 0) | map(attribute='name') | list }}"
    containers_without_requests: "{{ containers | rejectattr('resources.requests', 'defined') | map(attribute='name') | list }}"
    containers_without_limits: "{{ containers | rejectattr('resources.limits', 'defined') | map(attribute='name') | list }}"
    cpu_request_total_millicores: "{{ pod_cpu_request_map[pod_key] | default(0) | float }}"
    security_entries: >-
      {{
        ([] +
        ([{'namespace': ns_name, 'pod': item.metadata.name, 'issue': 'privileged-containers', 'detail': privileged_names | join(', ')}] if (is_user_namespace | bool) and privileged_names | length > 0 else []) +
        ([{'namespace': ns_name, 'pod': item.metadata.name, 'issue': 'host-network', 'detail': 'hostNetwork=true'}] if (is_user_namespace | bool) and (item.spec.hostNetwork | default(false)) else []) +
        ([{'namespace': ns_name, 'pod': item.metadata.name, 'issue': 'host-pid', 'detail': 'hostPID=true'}] if (is_user_namespace | bool) and (item.spec.hostPID | default(false)) else []) +
        ([{'namespace': ns_name, 'pod': item.metadata.name, 'issue': 'host-ipc', 'detail': 'hostIPC=true'}] if (is_user_namespace | bool) and (item.spec.hostIPC | default(false)) else []) +
        ([{'namespace': ns_name, 'pod': item.metadata.name, 'issue': 'hostpath-volume', 'detail': hostpath_volume_names | join(', ')}] if (is_user_namespace | bool) and hostpath_volume_names | length > 0 else []) +
        ([{'namespace': ns_name, 'pod': item.metadata.name, 'issue': 'run-as-root', 'detail': run_as_root_names | join(', ')}] if (is_user_namespace | bool) and run_as_root_names | length > 0 else []))
      }}
    practice_entries: >-
      {{
        ([] +
        ([{'namespace': ns_name, 'pod': item.metadata.name, 'issue': 'missing-resource-requests', 'detail': containers_without_requests | join(', ')}] if (is_user_namespace | bool) and containers_without_requests | length > 0 else []) +
        ([{'namespace': ns_name, 'pod': item.metadata.name, 'issue': 'missing-resource-limits', 'detail': containers_without_limits | join(', ')}] if (is_user_namespace | bool) and containers_without_limits | length > 0 else []))
      }}
  changed_when: false

- name: Build storage usage and literal sensitive string findings
  block:
    - name: Create temporary storage and sensitive findings input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-storage-sensitive-
        suffix: .json
      register: storage_and_sensitive_findings_input_file

    - name: Write storage and sensitive findings input data
      ansible.builtin.copy:
        dest: "{{ storage_and_sensitive_findings_input_file.path }}"
        content: >-
          {{
            {
              "pods": (pods | default({})).get('items', []),
              "exclude_regex": user_namespaces_exclude_regex | default('^$')
            } | to_json
          }}
        mode: "0600"

    - name: Run storage and sensitive findings helper
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/build_storage_and_sensitive_findings.py"
          - "{{ storage_and_sensitive_findings_input_file.path }}"
      register: storage_and_sensitive_findings_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove temporary storage and sensitive findings input file
      ansible.builtin.file:
        path: "{{ storage_and_sensitive_findings_input_file.path }}"
        state: absent
      when: storage_and_sensitive_findings_input_file is defined and (storage_and_sensitive_findings_input_file.path | default('') | length > 0)

- name: Normalize storage usage and literal sensitive string findings
  ansible.builtin.set_fact:
    security_findings: "{{ (security_findings | default([])) + (((storage_and_sensitive_findings_cmd.stdout | from_json).security_findings) if (storage_and_sensitive_findings_cmd.rc == 0 and (storage_and_sensitive_findings_cmd.stdout | default('') | length > 0)) else []) }}"
    workload_practice_findings: "{{ (workload_practice_findings | default([])) + (((storage_and_sensitive_findings_cmd.stdout | from_json).workload_practice_findings) if (storage_and_sensitive_findings_cmd.rc == 0 and (storage_and_sensitive_findings_cmd.stdout | default('') | length > 0)) else []) }}"

- name: Build CRD deprecation findings
  ansible.builtin.set_fact:
    deprecated_crd_findings: "{{ deprecated_crd_findings | default([]) + deprecated_entry }}"
  loop: "{{ (crds | default({})).get('items', []) }}"
  vars:
    deprecated_versions: "{{ item.spec.versions | default([]) | selectattr('deprecated', 'defined') | selectattr('deprecated', 'equalto', true) | map(attribute='name') | list }}"
    deprecated_entry: "{{ [{'name': item.metadata.name, 'group': item.spec.group | default(''), 'versions': deprecated_versions | join(', ')}] if deprecated_versions | length > 0 else [] }}"
  changed_when: false

- name: Build deprecated API resource findings
  ansible.builtin.set_fact:
    deprecated_api_lines: "{{ api_resources_cmd.stdout_lines | default([]) | select('search', 'DEPRECATED') | list }}"

- name: Build endpoint map
  ansible.builtin.set_fact:
    service_endpoint_address_counts: "{{ service_endpoint_address_counts | default({}) | combine({endpoint_key: endpoint_count}, recursive=True) }}"
  loop: "{{ (endpoints | default({})).get('items', []) }}"
  vars:
    endpoint_key: "{{ (item.metadata.namespace | default('')) ~ '/' ~ (item.metadata.name | default('')) }}"
    endpoint_count: "{{ item.subsets | default([]) | map(attribute='addresses') | list | flatten | length }}"
  changed_when: false

- name: Build service without endpoint findings
  ansible.builtin.set_fact:
    services_without_endpoints: "{{ services_without_endpoints | default([]) + service_issue_entry }}"
  loop: "{{ (services | default({})).get('items', []) }}"
  vars:
    service_ns: "{{ item.metadata.namespace | default('') }}"
    service_name: "{{ item.metadata.name | default('') }}"
    service_type: "{{ item.spec.type | default('ClusterIP') }}"
    endpoint_key: "{{ service_ns ~ '/' ~ service_name }}"
    endpoint_count: "{{ (service_endpoint_address_counts | default({}))[endpoint_key] | default(0) | int }}"
    service_issue_entry: >-
      {{
        [{
          'namespace': service_ns,
          'name': service_name,
          'type': service_type,
          'endpoint_count': endpoint_count
        }]
        if (
          not (service_ns is match(user_namespaces_exclude_regex))
          and service_name != 'kubernetes'
          and service_type != 'ExternalName'
          and (item.spec.selector | default({}) | length > 0)
          and endpoint_count == 0
        ) else []
      }}
  changed_when: false

- name: Build effective cluster profile for IP capacity analysis
  ansible.builtin.set_fact:
    ip_capacity_cluster_profile: >-
      {{
        (cluster_profile | default({})) | combine(
          {
            'service_networks': (
              ((cluster_profile | default({})).get('service_networks', []))
              if (((cluster_profile | default({})).get('service_networks', []) | length) > 0)
              else ((network_config | default({})).get('spec', {}).get('serviceNetwork', []))
            ),
            'cluster_networks': (
              ((cluster_profile | default({})).get('cluster_networks', []))
              if (((cluster_profile | default({})).get('cluster_networks', []) | length) > 0)
              else ((network_config | default({})).get('spec', {}).get('clusterNetwork', []))
            ),
            'machine_networks': (
              ((cluster_profile | default({})).get('machine_networks', []))
              if (((cluster_profile | default({})).get('machine_networks', []) | length) > 0)
              else []
            )
          },
          recursive=True
        )
      }}

- name: Build service and pod IP capacity summaries
  block:
    - name: Create temporary IP capacity summary input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-ip-capacity-
        suffix: .json
      register: ip_capacity_summary_input_file

    - name: Write IP capacity summary input data
      ansible.builtin.copy:
        dest: "{{ ip_capacity_summary_input_file.path }}"
        content: >-
          {{
            {
              "cluster_profile": ip_capacity_cluster_profile | default(cluster_profile | default({})),
              "services": (services | default({})).get('items', []),
              "pods": (pods | default({})).get('items', []),
              "nodes": (nodes | default({})).get('items', [])
            } | to_json
          }}
        mode: "0600"

    - name: Run IP capacity summary helper
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/build_ip_capacity_summary.py"
          - "{{ ip_capacity_summary_input_file.path }}"
      register: ip_capacity_summary_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove temporary IP capacity summary input file
      ansible.builtin.file:
        path: "{{ ip_capacity_summary_input_file.path }}"
        state: absent
      when: ip_capacity_summary_input_file is defined and (ip_capacity_summary_input_file.path | default('') | length > 0)

- name: Normalize service and pod IP capacity summaries
  ansible.builtin.set_fact:
    service_ip_capacity_summary: "{{ (ip_capacity_summary_cmd.stdout | from_json).service_ip_capacity_summary if (ip_capacity_summary_cmd.rc == 0 and (ip_capacity_summary_cmd.stdout | default('') | length > 0)) else {'ranges': [], 'range_count': 0, 'range_list': [], 'total_ips': 'unknown', 'taken_ips': 0, 'available_ips': 'unknown', 'observed_ips': 0, 'observed_out_of_range_count': 0, 'observed_out_of_range_sample': []} }}"
    pod_ip_capacity_summary: "{{ (ip_capacity_summary_cmd.stdout | from_json).pod_ip_capacity_summary if (ip_capacity_summary_cmd.rc == 0 and (ip_capacity_summary_cmd.stdout | default('') | length > 0)) else {'ranges': [], 'range_count': 0, 'range_list': [], 'total_ips': 'unknown', 'taken_ips': 0, 'available_ips': 'unknown', 'observed_ips': 0, 'observed_out_of_range_count': 0, 'observed_out_of_range_sample': []} }}"
    node_ip_capacity_summary: "{{ (ip_capacity_summary_cmd.stdout | from_json).node_ip_capacity_summary if (ip_capacity_summary_cmd.rc == 0 and (ip_capacity_summary_cmd.stdout | default('') | length > 0)) else {'ranges': [], 'range_count': 0, 'range_list': [], 'total_ips': 'unknown', 'taken_ips': 0, 'available_ips': 'unknown', 'observed_ips': 0, 'observed_out_of_range_count': 0, 'observed_out_of_range_sample': []} }}"

- name: Build referenced configmap and secret names from pods
  ansible.builtin.set_fact:
    referenced_configmaps: "{{ referenced_configmaps | default({}) | combine(referenced_configmap_update, recursive=True) }}"
    referenced_secrets: "{{ referenced_secrets | default({}) | combine(referenced_secret_update, recursive=True) }}"
    referenced_serviceaccounts: "{{ referenced_serviceaccounts | default({}) | combine(referenced_serviceaccount_update, recursive=True) }}"
  loop: "{{ (pods | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    volume_configmap_names: "{{ item.spec.volumes | default([]) | selectattr('configMap', 'defined') | map(attribute='configMap.name') | select('defined') | list }}"
    volume_secret_names: "{{ item.spec.volumes | default([]) | selectattr('secret', 'defined') | map(attribute='secret.secretName') | select('defined') | list }}"
    envfrom_configmap_names: "{{ ((item.spec.containers | default([])) + (item.spec.initContainers | default([]))) | map(attribute='envFrom') | select('defined') | list | flatten | selectattr('configMapRef', 'defined') | map(attribute='configMapRef.name') | select('defined') | list }}"
    envfrom_secret_names: "{{ ((item.spec.containers | default([])) + (item.spec.initContainers | default([]))) | map(attribute='envFrom') | select('defined') | list | flatten | selectattr('secretRef', 'defined') | map(attribute='secretRef.name') | select('defined') | list }}"
    env_configmap_names: "{{ ((item.spec.containers | default([])) + (item.spec.initContainers | default([]))) | map(attribute='env') | select('defined') | list | flatten | selectattr('valueFrom.configMapKeyRef', 'defined') | map(attribute='valueFrom.configMapKeyRef.name') | select('defined') | list }}"
    env_secret_names: "{{ ((item.spec.containers | default([])) + (item.spec.initContainers | default([]))) | map(attribute='env') | select('defined') | list | flatten | selectattr('valueFrom.secretKeyRef', 'defined') | map(attribute='valueFrom.secretKeyRef.name') | select('defined') | list }}"
    configmap_names: "{{ volume_configmap_names + envfrom_configmap_names + env_configmap_names }}"
    secret_names: "{{ volume_secret_names + envfrom_secret_names + env_secret_names }}"
    referenced_configmap_update: "{{ {ns_name: ((((referenced_configmaps | default({}))[ns_name] | default([])) + configmap_names) | unique)} }}"
    referenced_secret_update: "{{ {ns_name: ((((referenced_secrets | default({}))[ns_name] | default([])) + secret_names) | unique)} }}"
    referenced_serviceaccount_update: "{{ {ns_name: ((((referenced_serviceaccounts | default({}))[ns_name] | default([])) + [item.spec.serviceAccountName | default('default')]) | unique)} }}"
  changed_when: false

- name: Build references from deployment pod templates
  ansible.builtin.set_fact:
    referenced_configmaps: "{{ referenced_configmaps | default({}) | combine(referenced_configmap_update, recursive=True) }}"
    referenced_secrets: "{{ referenced_secrets | default({}) | combine(referenced_secret_update, recursive=True) }}"
    referenced_serviceaccounts: "{{ referenced_serviceaccounts | default({}) | combine(referenced_serviceaccount_update, recursive=True) }}"
  loop: "{{ (deployments | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    pod_spec: "{{ item.spec.template.spec | default({}) }}"
    all_containers: "{{ (pod_spec.containers | default([])) + (pod_spec.initContainers | default([])) }}"
    volume_configmap_names: "{{ pod_spec.volumes | default([]) | selectattr('configMap', 'defined') | map(attribute='configMap.name') | select('defined') | list }}"
    volume_secret_names: "{{ pod_spec.volumes | default([]) | selectattr('secret', 'defined') | map(attribute='secret.secretName') | select('defined') | list }}"
    envfrom_configmap_names: "{{ all_containers | map(attribute='envFrom') | select('defined') | list | flatten | selectattr('configMapRef', 'defined') | map(attribute='configMapRef.name') | select('defined') | list }}"
    envfrom_secret_names: "{{ all_containers | map(attribute='envFrom') | select('defined') | list | flatten | selectattr('secretRef', 'defined') | map(attribute='secretRef.name') | select('defined') | list }}"
    env_configmap_names: "{{ all_containers | map(attribute='env') | select('defined') | list | flatten | selectattr('valueFrom.configMapKeyRef', 'defined') | map(attribute='valueFrom.configMapKeyRef.name') | select('defined') | list }}"
    env_secret_names: "{{ all_containers | map(attribute='env') | select('defined') | list | flatten | selectattr('valueFrom.secretKeyRef', 'defined') | map(attribute='valueFrom.secretKeyRef.name') | select('defined') | list }}"
    referenced_configmap_update: "{{ {ns_name: ((((referenced_configmaps | default({}))[ns_name] | default([])) + volume_configmap_names + envfrom_configmap_names + env_configmap_names) | unique)} }}"
    referenced_secret_update: "{{ {ns_name: ((((referenced_secrets | default({}))[ns_name] | default([])) + volume_secret_names + envfrom_secret_names + env_secret_names) | unique)} }}"
    referenced_serviceaccount_update: "{{ {ns_name: ((((referenced_serviceaccounts | default({}))[ns_name] | default([])) + [pod_spec.serviceAccountName | default('default')]) | unique)} }}"
  changed_when: false

- name: Build references from statefulset pod templates
  ansible.builtin.set_fact:
    referenced_configmaps: "{{ referenced_configmaps | default({}) | combine(referenced_configmap_update, recursive=True) }}"
    referenced_secrets: "{{ referenced_secrets | default({}) | combine(referenced_secret_update, recursive=True) }}"
    referenced_serviceaccounts: "{{ referenced_serviceaccounts | default({}) | combine(referenced_serviceaccount_update, recursive=True) }}"
  loop: "{{ (statefulsets | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    pod_spec: "{{ item.spec.template.spec | default({}) }}"
    all_containers: "{{ (pod_spec.containers | default([])) + (pod_spec.initContainers | default([])) }}"
    volume_configmap_names: "{{ pod_spec.volumes | default([]) | selectattr('configMap', 'defined') | map(attribute='configMap.name') | select('defined') | list }}"
    volume_secret_names: "{{ pod_spec.volumes | default([]) | selectattr('secret', 'defined') | map(attribute='secret.secretName') | select('defined') | list }}"
    envfrom_configmap_names: "{{ all_containers | map(attribute='envFrom') | select('defined') | list | flatten | selectattr('configMapRef', 'defined') | map(attribute='configMapRef.name') | select('defined') | list }}"
    envfrom_secret_names: "{{ all_containers | map(attribute='envFrom') | select('defined') | list | flatten | selectattr('secretRef', 'defined') | map(attribute='secretRef.name') | select('defined') | list }}"
    env_configmap_names: "{{ all_containers | map(attribute='env') | select('defined') | list | flatten | selectattr('valueFrom.configMapKeyRef', 'defined') | map(attribute='valueFrom.configMapKeyRef.name') | select('defined') | list }}"
    env_secret_names: "{{ all_containers | map(attribute='env') | select('defined') | list | flatten | selectattr('valueFrom.secretKeyRef', 'defined') | map(attribute='valueFrom.secretKeyRef.name') | select('defined') | list }}"
    referenced_configmap_update: "{{ {ns_name: ((((referenced_configmaps | default({}))[ns_name] | default([])) + volume_configmap_names + envfrom_configmap_names + env_configmap_names) | unique)} }}"
    referenced_secret_update: "{{ {ns_name: ((((referenced_secrets | default({}))[ns_name] | default([])) + volume_secret_names + envfrom_secret_names + env_secret_names) | unique)} }}"
    referenced_serviceaccount_update: "{{ {ns_name: ((((referenced_serviceaccounts | default({}))[ns_name] | default([])) + [pod_spec.serviceAccountName | default('default')]) | unique)} }}"
  changed_when: false

- name: Build references from daemonset pod templates
  ansible.builtin.set_fact:
    referenced_configmaps: "{{ referenced_configmaps | default({}) | combine(referenced_configmap_update, recursive=True) }}"
    referenced_secrets: "{{ referenced_secrets | default({}) | combine(referenced_secret_update, recursive=True) }}"
    referenced_serviceaccounts: "{{ referenced_serviceaccounts | default({}) | combine(referenced_serviceaccount_update, recursive=True) }}"
  loop: "{{ (daemonsets | default({})).get('items', []) }}"
  vars:
    ns_name: "{{ item.metadata.namespace | default('') }}"
    pod_spec: "{{ item.spec.template.spec | default({}) }}"
    all_containers: "{{ (pod_spec.containers | default([])) + (pod_spec.initContainers | default([])) }}"
    volume_configmap_names: "{{ pod_spec.volumes | default([]) | selectattr('configMap', 'defined') | map(attribute='configMap.name') | select('defined') | list }}"
    volume_secret_names: "{{ pod_spec.volumes | default([]) | selectattr('secret', 'defined') | map(attribute='secret.secretName') | select('defined') | list }}"
    envfrom_configmap_names: "{{ all_containers | map(attribute='envFrom') | select('defined') | list | flatten | selectattr('configMapRef', 'defined') | map(attribute='configMapRef.name') | select('defined') | list }}"
    envfrom_secret_names: "{{ all_containers | map(attribute='envFrom') | select('defined') | list | flatten | selectattr('secretRef', 'defined') | map(attribute='secretRef.name') | select('defined') | list }}"
    env_configmap_names: "{{ all_containers | map(attribute='env') | select('defined') | list | flatten | selectattr('valueFrom.configMapKeyRef', 'defined') | map(attribute='valueFrom.configMapKeyRef.name') | select('defined') | list }}"
    env_secret_names: "{{ all_containers | map(attribute='env') | select('defined') | list | flatten | selectattr('valueFrom.secretKeyRef', 'defined') | map(attribute='valueFrom.secretKeyRef.name') | select('defined') | list }}"
    referenced_configmap_update: "{{ {ns_name: ((((referenced_configmaps | default({}))[ns_name] | default([])) + volume_configmap_names + envfrom_configmap_names + env_configmap_names) | unique)} }}"
    referenced_secret_update: "{{ {ns_name: ((((referenced_secrets | default({}))[ns_name] | default([])) + volume_secret_names + envfrom_secret_names + env_secret_names) | unique)} }}"
    referenced_serviceaccount_update: "{{ {ns_name: ((((referenced_serviceaccounts | default({}))[ns_name] | default([])) + [pod_spec.serviceAccountName | default('default')]) | unique)} }}"
  changed_when: false

- name: Build likely unused configmap findings
  ansible.builtin.set_fact:
    likely_unused_configmaps: "{{ likely_unused_configmaps | default([]) + configmap_issue_entry }}"
  loop: "{{ (configmaps | default({})).get('items', []) }}"
  vars:
    cm_ns: "{{ item.metadata.namespace | default('') }}"
    cm_name: "{{ item.metadata.name | default('') }}"
    configmap_issue_entry: >-
      {{
        [{'namespace': cm_ns, 'name': cm_name}]
        if (
          not (cm_ns is match(user_namespaces_exclude_regex))
          and cm_name not in (((referenced_configmaps | default({}))[cm_ns] | default([])))
        ) else []
      }}
  changed_when: false

- name: Build likely unused service account findings
  ansible.builtin.set_fact:
    likely_unused_serviceaccounts: "{{ likely_unused_serviceaccounts | default([]) + serviceaccount_issue_entry }}"
  loop: "{{ (serviceaccounts | default({})).get('items', []) }}"
  vars:
    sa_ns: "{{ item.metadata.namespace | default('') }}"
    sa_name: "{{ item.metadata.name | default('') }}"
    serviceaccount_issue_entry: >-
      {{
        [{'namespace': sa_ns, 'name': sa_name}]
        if (
          not (sa_ns is match(user_namespaces_exclude_regex))
          and sa_name not in ['default', 'builder', 'deployer']
          and sa_name not in (((referenced_serviceaccounts | default({}))[sa_ns] | default([])))
        ) else []
      }}
  changed_when: false

- name: Build likely unused secret findings
  ansible.builtin.set_fact:
    likely_unused_secrets: "{{ likely_unused_secrets | default([]) + secret_issue_entry }}"
  loop: "{{ (secrets | default({})).get('items', []) }}"
  vars:
    secret_ns: "{{ item.metadata.namespace | default('') }}"
    secret_name: "{{ item.metadata.name | default('') }}"
    secret_type: "{{ item.type | default('') }}"
    secret_issue_entry: >-
      {{
        [{'namespace': secret_ns, 'name': secret_name, 'type': secret_type}]
        if (
          not (secret_ns is match(user_namespaces_exclude_regex))
          and secret_type not in ['kubernetes.io/service-account-token', 'kubernetes.io/dockercfg', 'kubernetes.io/dockerconfigjson']
          and not (secret_name | regex_search('^builder-|^default-token-|^deployer-token-|^pipeline-|^sh.helm.release.v1\\.'))
          and secret_name not in (((referenced_secrets | default({}))[secret_ns] | default([])))
        ) else []
      }}
  changed_when: false

- name: Build privileged RBAC findings
  ansible.builtin.set_fact:
    privileged_serviceaccount_access: "{{ privileged_serviceaccount_access | default([]) + privileged_serviceaccount_entries }}"
    privileged_user_access: "{{ privileged_user_access | default([]) + privileged_user_entries }}"
    privileged_group_access: "{{ privileged_group_access | default([]) + privileged_group_entries }}"
  loop: "{{ ((clusterrolebindings | default({})).get('items', [])) + ((rolebindings | default({})).get('items', [])) }}"
  vars:
    binding_kind: "{{ item.kind | default('Binding') }}"
    binding_name: "{{ item.metadata.name | default('unknown') }}"
    binding_namespace: "{{ item.metadata.namespace | default('') }}"
    binding_scope: "{{ 'cluster-wide' if (binding_namespace | length == 0) else ('namespace ' ~ binding_namespace) }}"
    grant_source: "{{ (binding_kind ~ '/' ~ binding_name) if (binding_namespace | length == 0) else (binding_kind ~ '/' ~ binding_namespace ~ '/' ~ binding_name) }}"
    role_kind: "{{ item.roleRef.kind | default('') }}"
    role_name: "{{ item.roleRef.name | default('') }}"
    subjects: "{{ item.subjects | default([]) }}"
    privileged_subjects: "{{ subjects if (role_kind == 'ClusterRole' and role_name == 'cluster-admin') else [] }}"
    non_system_serviceaccounts: >-
      {{
        privileged_subjects
        | selectattr('kind', 'equalto', 'ServiceAccount')
        | rejectattr('namespace', 'undefined')
        | rejectattr('namespace', 'match', user_namespaces_exclude_regex)
        | list
      }}
    non_system_users: >-
      {{
        privileged_subjects
        | selectattr('kind', 'equalto', 'User')
        | rejectattr('name', 'match', '^(system:|kube:|openshift:)')
        | list
      }}
    non_system_groups: >-
      {{
        privileged_subjects
        | selectattr('kind', 'equalto', 'Group')
        | rejectattr('name', 'match', '^(system:|kube:|openshift:)')
        | list
      }}
    privileged_serviceaccount_entries: >-
      {{
        non_system_serviceaccounts
        | map('combine', {
          'binding_name': binding_name,
          'grant_source': grant_source,
          'binding_scope': binding_scope,
          'access_role': 'cluster-admin',
          'access_level': 'privileged'
        })
        | list
      }}
    privileged_user_entries: >-
      {{
        non_system_users
        | map('combine', {
          'binding_name': binding_name,
          'grant_source': grant_source,
          'binding_scope': binding_scope,
          'access_role': 'cluster-admin',
          'access_level': 'privileged'
        })
        | list
      }}
    privileged_group_entries: >-
      {{
        non_system_groups
        | map('combine', {
          'binding_name': binding_name,
          'grant_source': grant_source,
          'binding_scope': binding_scope,
          'access_role': 'cluster-admin',
          'access_level': 'privileged'
        })
        | list
      }}
  changed_when: false

- name: Build namespaced CRD count targets
  ansible.builtin.set_fact:
    namespaced_crd_count_targets: "{{ (namespaced_crd_count_targets | default([])) + [crd_count_target] }}"
  loop: "{{ (crds | default({})).get('items', []) }}"
  vars:
    crd_count_target:
      name: "{{ item.metadata.name | default('') }}"
      group: "{{ item.spec.group | default('') }}"
      plural: "{{ item.spec.names.plural | default('') }}"
  when:
    - item.spec is defined
    - item.spec.names is defined
    - item.spec.group is defined
    - item.spec.scope | default('Namespaced') == 'Namespaced'
  changed_when: false

- name: Check CRD instance counts
  block:
    - name: Create temporary CRD instance count input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-crd-counts-
        suffix: .json
      register: crd_instance_count_input_file

    - name: Write CRD instance count input data
      ansible.builtin.copy:
        dest: "{{ crd_instance_count_input_file.path }}"
        content: >-
          {{
            {
              "kube_cli": kube_cli | default('oc'),
              "timeout_seconds": collection_command_timeout_seconds | default(300),
              "parallelism": analysis_parallelism | default(collection_parallelism | default(8)),
              "crds": namespaced_crd_count_targets | default([])
            } | to_json
          }}
        mode: "0600"

    - name: Run batched CRD instance count helper
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/batch_crd_instance_counts.py"
          - "{{ crd_instance_count_input_file.path }}"
      register: crd_instance_count_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove temporary CRD instance count input file
      ansible.builtin.file:
        path: "{{ crd_instance_count_input_file.path }}"
        state: absent
      when: crd_instance_count_input_file is defined and (crd_instance_count_input_file.path | default('') | length > 0)

- name: Build likely unused custom resource definitions
  ansible.builtin.set_fact:
    likely_unused_crds: "{{ likely_unused_crds | default([]) + crd_issue_entry }}"
  loop: "{{ (crd_instance_count_cmd.stdout | from_json).results if (crd_instance_count_cmd.rc == 0 and (crd_instance_count_cmd.stdout | default('') | length > 0)) else [] }}"
  vars:
    crd_issue_entry: >-
      {{
        [{
          'name': item.name | default(''),
          'group': item.group | default(''),
          'plural': item.plural | default(''),
          'count': (item.count | default(0) | int)
        }]
        if (
          (item.rc | default(1) | int) == 0
          and (item.count | default(0) | int) == 0
          and not ((item.group | default('')) is match('^(openshift.io|operator.openshift.io|config.openshift.io|machine.openshift.io|monitoring.coreos.com|apiextensions.k8s.io|rbac.authorization.k8s.io|authorization.openshift.io|route.openshift.io|image.openshift.io|build.openshift.io|apps.openshift.io|project.openshift.io|template.openshift.io|k8s.io)$'))
        ) else []
      }}
  changed_when: false

- name: Build storage summaries
  ansible.builtin.set_fact:
    storageclass_summary: "{{ storageclass_summary | default([]) + [sc_entry] }}"
  loop: "{{ (storageclasses | default({})).get('items', []) }}"
  vars:
    sc_entry:
      name: "{{ item.metadata.name }}"
      provisioner: "{{ item.provisioner | default('unknown') }}"
      is_default: "{{ ((item.metadata.annotations['storageclass.kubernetes.io/is-default-class'] | default(item.metadata.annotations['storageclass.beta.kubernetes.io/is-default-class'] | default(false))) | string | lower) == 'true' }}"
      volume_binding_mode: "{{ item.volumeBindingMode | default('Immediate') }}"
      reclaim_policy: "{{ item.reclaimPolicy | default('Delete') }}"
  changed_when: false

- name: Build storage posture summary
  block:
    - name: Create temporary storage posture summary input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-storage-posture-
        suffix: .json
      register: storage_posture_summary_input_file

    - name: Write storage posture summary input data
      ansible.builtin.copy:
        dest: "{{ storage_posture_summary_input_file.path }}"
        content: >-
          {{
            {
              "storageclasses": storageclass_summary | default([]),
              "persistentvolumes": (persistentvolumes | default({})).get('items', []),
              "security_findings": security_findings | default([]),
              "workload_practice_findings": workload_practice_findings | default([])
            } | to_json
          }}
        mode: "0600"

    - name: Run storage posture summary helper
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/build_storage_posture_summary.py"
          - "{{ storage_posture_summary_input_file.path }}"
      register: storage_posture_summary_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove temporary storage posture summary input file
      ansible.builtin.file:
        path: "{{ storage_posture_summary_input_file.path }}"
        state: absent
      when: storage_posture_summary_input_file is defined and (storage_posture_summary_input_file.path | default('') | length > 0)

- name: Normalize storage posture summary
  ansible.builtin.set_fact:
    storage_posture_summary: "{{ storage_posture_summary_cmd.stdout | from_json if (storage_posture_summary_cmd.rc == 0 and (storage_posture_summary_cmd.stdout | default('') | length > 0)) else {'external_storageclass_count': 0, 'local_storageclass_count': 0, 'default_external_storageclass_count': 0, 'external_storageclass_names': [], 'local_storageclass_names': [], 'external_pv_count': 0, 'local_pv_count': 0, 'hostpath_workload_count': 0, 'ephemeral_workload_count': 0, 'has_external_storage_provider': false, 'local_or_ephemeral_only_risk': false, 'findings': []} }}"

- name: Build PV summary
  ansible.builtin.set_fact:
    pv_phase_counts: "{{ pv_phase_counts | default({}) | combine({pv_phase: ((pv_phase_counts[pv_phase] | default(0)) + 1)}, recursive=True) }}"
    pv_issues: "{{ pv_issues | default([]) + ([{'name': item.metadata.name, 'phase': pv_phase, 'storageClassName': item.spec.storageClassName | default(''), 'claimRef': ((item.spec.claimRef.namespace | default('')) ~ '/' ~ (item.spec.claimRef.name | default(''))) if (item.spec.claimRef is defined) else ''}] if pv_phase not in ['Bound', 'Available'] else []) }}"
  loop: "{{ (persistentvolumes | default({})).get('items', []) }}"
  vars:
    pv_phase: "{{ item.status.phase | default('Unknown') }}"
  changed_when: false

- name: Build PVC summary
  ansible.builtin.set_fact:
    pvc_phase_counts: "{{ pvc_phase_counts | default({}) | combine({pvc_phase: ((pvc_phase_counts[pvc_phase] | default(0)) + 1)}, recursive=True) }}"
    pvc_issues: "{{ pvc_issues | default([]) + ([{'namespace': item.metadata.namespace | default(''), 'name': item.metadata.name, 'phase': pvc_phase, 'storageClassName': item.spec.storageClassName | default(''), 'volumeName': item.spec.volumeName | default('')}] if pvc_phase != 'Bound' else []) }}"
  loop: "{{ (persistentvolumeclaims | default({})).get('items', []) }}"
  vars:
    pvc_phase: "{{ item.status.phase | default('Unknown') }}"
  changed_when: false

- name: Build TLS secret expiry targets
  ansible.builtin.set_fact:
    tls_secret_expiry_targets: "{{ (tls_secret_expiry_targets | default([])) + [tls_secret_expiry_target] }}"
  loop: "{{ (secrets | default({})).get('items', []) }}"
  vars:
    tls_secret_expiry_target:
      namespace: "{{ item.metadata.namespace | default('') }}"
      name: "{{ item.metadata.name | default('') }}"
      type: "{{ item.type | default('') }}"
      tls_crt: "{{ item.data['tls.crt'] | default('') }}"
  when:
    - (item.type | default('')) == 'kubernetes.io/tls'
    - item.data is defined
    - item.data['tls.crt'] is defined
  changed_when: false

- name: Collect TLS secret certificate expiry with openssl
  block:
    - name: Create temporary TLS secret expiry input file
      ansible.builtin.tempfile:
        state: file
        prefix: cluster-health-tls-expiry-
        suffix: .json
      register: tls_secret_cert_expiry_input_file

    - name: Write TLS secret expiry input data
      ansible.builtin.copy:
        dest: "{{ tls_secret_cert_expiry_input_file.path }}"
        content: >-
          {{
            {
              "timeout_seconds": 20,
              "parallelism": analysis_parallelism | default(collection_parallelism | default(8)),
              "secrets": tls_secret_expiry_targets | default([])
            } | to_json
          }}
        mode: "0600"

    - name: Run batched TLS secret expiry helper
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/batch_tls_secret_expiry.py"
          - "{{ tls_secret_cert_expiry_input_file.path }}"
      register: tls_secret_cert_expiry_cmd
      changed_when: false
      failed_when: false
  always:
    - name: Remove temporary TLS secret expiry input file
      ansible.builtin.file:
        path: "{{ tls_secret_cert_expiry_input_file.path }}"
        state: absent
      when: tls_secret_cert_expiry_input_file is defined and (tls_secret_cert_expiry_input_file.path | default('') | length > 0)

- name: Build certificate expiry findings
  ansible.builtin.set_fact:
    certificate_expiry_findings: "{{ certificate_expiry_findings | default([]) + ([{'namespace': item.namespace | default(''), 'name': item.name | default(''), 'type': item.type | default(''), 'not_after': item.not_after | default('')}] if (item.rc | default(1) | int) == 0 and (item.not_after | default('') | length > 0) else []) }}"
  loop: "{{ (tls_secret_cert_expiry_cmd.stdout | from_json).results if (tls_secret_cert_expiry_cmd.rc == 0 and (tls_secret_cert_expiry_cmd.stdout | default('') | length > 0)) else [] }}"
  changed_when: false
