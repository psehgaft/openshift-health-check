# TC 55: Check API Certificate
- name: "TC-55: Check API Certificate"
  when: run_tc55_api_certificate | default(true) | bool
  block:
    - name: "TC-55: Query API Server certificate validity and issuer"
      ansible.builtin.shell: >
        echo | openssl s_client -connect api.{{ cluster_name }}.{{ cluster_domain }}:6443 -servername api.{{ cluster_name }}.{{ cluster_domain }} 2>/dev/null | openssl x509 -noout -subject -issuer -dates
      register: tc55_cmd
      changed_when: false
      failed_when: false

    - name: "TC-55: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-55',
          'name': 'Check API Certificate',
          'category': 'User & Security',
          'expected': 'Valid API certificate issued by CA with matching SAN',
          'status': ('Pass' if (tc55_cmd.rc == 0 and 'CN=' in tc55_cmd.stdout) else 'Fail'),
          'procedure': (tc55_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc55_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc55_cmd.stderr | default(''))) if (tc55_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc55_cmd.rc | string) if tc55_cmd.rc is defined else '')),
          'details': tc55_cmd.stdout | default(tc55_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc55', 'certificates']

