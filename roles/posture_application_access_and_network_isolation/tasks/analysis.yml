---
- name: Precompute networking architecture summary inputs
  vars:
    graph: "{{ analysis_graph | default({}) }}"
    route_items: "{{ (graph.routes | default({})).get('items', []) }}"
    ingress_items: "{{ (graph.ingresses | default({})).get('items', []) }}"
    service_items: "{{ (graph.services | default({})).get('items', []) }}"
    proxy_spec: "{{ graph.proxy_config.spec | default({}) }}"
  ansible.builtin.set_fact:
    networking_route_namespaces: "{{ route_items | map(attribute='metadata.namespace') | select('defined') | list | unique }}"
    networking_ingress_namespaces: "{{ ingress_items | map(attribute='metadata.namespace') | select('defined') | list | unique }}"
    networking_service_exposure_namespaces: >-
      {{
        service_items
        | selectattr('metadata.namespace', 'defined')
        | selectattr('spec.type', 'defined')
        | selectattr('spec.type', 'in', ['LoadBalancer', 'NodePort'])
        | map(attribute='metadata.namespace')
        | list
        | unique
      }}
    networking_external_ip_service_namespaces: >-
      {{
        service_items
        | selectattr('metadata.namespace', 'defined')
        | selectattr('spec.externalIPs', 'defined')
        | map(attribute='metadata.namespace')
        | list
        | unique
      }}
    networking_proxy_status: "{{ graph.proxy_config.status | default({}) }}"
    networking_proxy_http: "{{ proxy_spec.httpProxy | default('') }}"
    networking_proxy_https: "{{ proxy_spec.httpsProxy | default('') }}"
    networking_proxy_trusted_ca: "{{ proxy_spec.trustedCA.name | default('') }}"
    networking_proxy_no_proxy_entries: "{{ ((proxy_spec.noProxy | default('')).split(',') | map('trim') | reject('equalto', '') | list) if ((proxy_spec.noProxy | default('') | length) > 0) else [] }}"
    networking_cluster_proxy_configured: "{{ ((proxy_spec.httpProxy | default('')) | length > 0) or ((proxy_spec.httpsProxy | default('')) | length > 0) }}"
    networking_default_ingresscontroller_issue_count: "{{ ingresscontroller_issues | default([]) | selectattr('component', 'equalto', 'ingresscontroller/default') | list | length }}"
    networking_nondefault_ingresscontroller_issue_count: "{{ (ingresscontroller_issues | default([]) | length) - (ingresscontroller_issues | default([]) | selectattr('component', 'equalto', 'ingresscontroller/default') | list | length) }}"

- name: Build networking architecture summary
  vars:
    exposed_user_namespaces: "{{ ((networking_route_namespaces | default([])) + (networking_ingress_namespaces | default([])) + (networking_service_exposure_namespaces | default([])) + (networking_external_ip_service_namespaces | default([]))) | unique | reject('match', user_namespaces_exclude_regex | default('^$')) | list }}"
    exposed_namespaces_without_networkpolicy: "{{ exposed_user_namespaces | intersect(namespaces_without_networkpolicy | default([])) }}"
    exposed_namespaces_missing_ingress_policies: "{{ exposed_user_namespaces | intersect(namespaces_missing_ingress_policies | default([])) }}"
    exposed_namespaces_missing_egress_policies: "{{ exposed_user_namespaces | intersect(namespaces_missing_egress_policies | default([])) }}"
    network_route_ingress_objects_absent: "{{ (route_items | default([]) | length == 0) and (ingress_items | default([]) | length == 0) }}"
    proxy_required_internal_no_proxy_entries:
      - ".svc"
      - ".cluster.local"
    proxy_missing_internal_no_proxy_entries: "{{ proxy_required_internal_no_proxy_entries | difference(networking_proxy_no_proxy_entries | default([])) if (networking_cluster_proxy_configured | default(false) | bool) else [] }}"
    networking_service_endpoint_gap_count: "{{ services_without_endpoints | default([]) | length }}"
    network_architecture_status: >-
      {{
        'CRITICAL'
        if (
          (route_host_conflicts | default([]) | length) > 0
          or (ingress_host_conflicts | default([]) | length) > 0
          or (route_ingress_host_conflicts | default([]) | length) > 0
          or (networking_default_ingresscontroller_issue_count | int) > 0
        )
        else (
          'WARNING'
          if (
            (route_issues | default([]) | length) > 0
            or (ingress_issues | default([]) | length) > 0
            or (networking_nondefault_ingresscontroller_issue_count | int) > 0
            or (networking_service_endpoint_gap_count | int) > 0
            or (proxy_missing_internal_no_proxy_entries | length) > 0
          )
          else 'HEALTHY'
        )
      }}
    network_architecture_reason_summary: >-
      {{
        (
          []
          + (['route issues=' ~ ((route_issues | default([]) | length) | string)] if (route_issues | default([]) | length) > 0 else [])
          + (['ingress issues=' ~ ((ingress_issues | default([]) | length) | string)] if (ingress_issues | default([]) | length) > 0 else [])
          + (['route host conflicts=' ~ ((route_host_conflicts | default([]) | length) | string)] if (route_host_conflicts | default([]) | length) > 0 else [])
          + (['ingress host conflicts=' ~ ((ingress_host_conflicts | default([]) | length) | string)] if (ingress_host_conflicts | default([]) | length) > 0 else [])
          + (['cross route/ingress host conflicts=' ~ ((route_ingress_host_conflicts | default([]) | length) | string)] if (route_ingress_host_conflicts | default([]) | length) > 0 else [])
          + (['default ingress controller issues=' ~ ((networking_default_ingresscontroller_issue_count | int) | string)] if (networking_default_ingresscontroller_issue_count | int) > 0 else [])
          + (['non-default ingress controller issues=' ~ ((networking_nondefault_ingresscontroller_issue_count | int) | string)] if (networking_nondefault_ingresscontroller_issue_count | int) > 0 else [])
          + (['service endpoint gaps=' ~ ((networking_service_endpoint_gap_count | int) | string)] if (networking_service_endpoint_gap_count | int) > 0 else [])
          + (['exposed namespace policy context=' ~ ((exposed_namespaces_without_networkpolicy | length) | string) ~ ' without NetworkPolicy'] if (exposed_namespaces_without_networkpolicy | length) > 0 else [])
          + (['proxy noProxy gaps=' ~ (proxy_missing_internal_no_proxy_entries | join(', '))] if (proxy_missing_internal_no_proxy_entries | length) > 0 else [])
          + (
              ['no Route or Ingress objects were available, so traffic-entry object health was not assessed']
              if (
                network_route_ingress_objects_absent
                and (route_issues | default([]) | length) == 0
                and (ingress_issues | default([]) | length) == 0
                and (route_host_conflicts | default([]) | length) == 0
                and (ingress_host_conflicts | default([]) | length) == 0
                and (route_ingress_host_conflicts | default([]) | length) == 0
                and (networking_default_ingresscontroller_issue_count | int) == 0
                and (networking_nondefault_ingresscontroller_issue_count | int) == 0
                and (networking_service_endpoint_gap_count | int) == 0
                and (exposed_namespaces_without_networkpolicy | length) == 0
                and (exposed_namespaces_missing_ingress_policies | length) == 0
                and (exposed_namespaces_missing_egress_policies | length) == 0
                and (proxy_missing_internal_no_proxy_entries | length) == 0
              )
              else []
            )
        ) | join('; ')
      }}
    network_architecture_recommendation: >-
      {{
        (
          'Stabilize networking architecture first: resolve default ingress controller problems and duplicate host claims across Route and Ingress objects before treating application access paths as reliable.'
          if network_architecture_status == 'CRITICAL'
          else (
            'Reduce networking architecture risk next: fix route or ingress admission problems, repair Services with no ready endpoints, review non-default ingress controller issues, and correct proxy `noProxy` gaps for required internal cluster destinations before treating application access as production-ready.'
            if network_architecture_status == 'WARNING'
            else (
              'No Route or Ingress objects were in scope for this run, so traffic-entry object health was not assessed. Confirm that absence is expected for this cluster, then maintain namespace isolation and proxy or egress settings as designed.'
              if network_route_ingress_objects_absent
              else 'Networking architecture looks acceptable for this run. Keep route and ingress ownership clean, review namespace isolation requirements for exposed workloads, and maintain proxy or egress settings as designed.'
            )
          )
        )
      }}
  ansible.builtin.set_fact:
    network_architecture_summary:
      status: "{{ network_architecture_status }}"
      reason_summary: "{{ network_architecture_reason_summary }}"
      recommendation: "{{ network_architecture_recommendation }}"
      route_issue_count: "{{ route_issues | default([]) | length }}"
      ingress_issue_count: "{{ ingress_issues | default([]) | length }}"
      route_host_conflict_count: "{{ route_host_conflicts | default([]) | length }}"
      ingress_host_conflict_count: "{{ ingress_host_conflicts | default([]) | length }}"
      cross_host_conflict_count: "{{ route_ingress_host_conflicts | default([]) | length }}"
      ingresscontroller_issue_count: "{{ ingresscontroller_issues | default([]) | length }}"
      default_ingresscontroller_issue_count: "{{ networking_default_ingresscontroller_issue_count }}"
      nondefault_ingresscontroller_issue_count: "{{ networking_nondefault_ingresscontroller_issue_count }}"
      service_endpoint_gap_count: "{{ networking_service_endpoint_gap_count }}"
      service_endpoint_gap_samples: "{{ top_services_without_endpoints | default([]) }}"
      exposed_namespace_count: "{{ exposed_user_namespaces | length }}"
      service_exposure_namespace_count: "{{ (((networking_service_exposure_namespaces | default([])) + (networking_external_ip_service_namespaces | default([]))) | unique | reject('match', user_namespaces_exclude_regex | default('^$')) | list | length) }}"
      exposed_namespaces_without_networkpolicy: "{{ exposed_namespaces_without_networkpolicy }}"
      exposed_namespaces_missing_ingress_policies: "{{ exposed_namespaces_missing_ingress_policies }}"
      exposed_namespaces_missing_egress_policies: "{{ exposed_namespaces_missing_egress_policies }}"
      cluster_proxy_configured: "{{ networking_cluster_proxy_configured }}"
      http_proxy_configured: "{{ networking_proxy_http | length > 0 }}"
      https_proxy_configured: "{{ networking_proxy_https | length > 0 }}"
      trusted_ca_configured: "{{ networking_proxy_trusted_ca | length > 0 }}"
      no_proxy_entry_count: "{{ networking_proxy_no_proxy_entries | length }}"
      no_proxy_entries_sample: "{{ (networking_proxy_no_proxy_entries | default([]))[:10] }}"
      proxy_missing_internal_no_proxy_entries: "{{ proxy_missing_internal_no_proxy_entries }}"
      proxy_status: "{{ networking_proxy_status }}"
