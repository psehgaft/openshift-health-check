---
# ==============================================================================
# Section 3: OpenShift Manage Application (TC 32 to TC 38)
# ==============================================================================

# TC 32: Create Application using Labels
- name: "TC-32: Create Application using Labels"
  when: run_tc32_app_labels | default(true) | bool
  block:
    - name: "TC-32: Test nodeSelector application placement"
      ansible.builtin.command: oc get nodes -l APP=app
      register: tc32_cmd
      changed_when: false
      failed_when: false

    - name: "TC-32: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-32',
          'name': 'Create Application using Labels',
          'category': 'Manage Application',
          'expected': 'Application deployed with nodeSelector APP=app matching labeled nodes',
          'status': ('Pass' if tc32_cmd.rc == 0 else 'Fail'),
          'procedure': (tc32_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc32_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc32_cmd.stderr | default(''))) if (tc32_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc32_cmd.rc | string) if tc32_cmd.rc is defined else '')),
          'details': tc32_cmd.stdout | default(tc32_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc32', 'workloads']

# TC 33: Create application using Taint
- name: "TC-33: Create application using Taint"
  when: run_tc33_app_taints | default(true) | bool
  block:
    - name: "TC-33: Verify node taints and pod tolerations"
      ansible.builtin.command: >
        oc get nodes -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.spec.taints}{"\n"}{end}'
      register: tc33_cmd
      changed_when: false
      failed_when: false

    - name: "TC-33: Record Result"
      ansible.builtin.set_fact:
        atp_results: "{{ atp_results + [{
          'id': 'TC-33',
          'name': 'Create application using Taint',
          'category': 'Manage Application',
          'expected': 'Application pods with tolerations schedule on tainted nodes',
          'status': ('Pass' if tc33_cmd.rc == 0 else 'Fail'),
          'procedure': (tc33_cmd.cmd | default('See ATP task source; command metadata unavailable')),
          'evidence': ((tc33_cmd.stdout | default('')) ~ (('\nSTDERR:\n' ~ (tc33_cmd.stderr | default(''))) if (tc33_cmd.stderr | default('') | length > 0) else '') ~ ('\nExit code: ' ~ (tc33_cmd.rc | string) if tc33_cmd.rc is defined else '')),
          'details': tc33_cmd.stdout | default(tc33_cmd.stderr) | truncate(150)
        }] }}"
  tags: ['general', 'telco', 'tc33', 'workloads']

