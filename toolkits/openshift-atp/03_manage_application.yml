# TC 38: Validate that application pods don't create into infra nodes
- name: "TC-38: Validate that application pods don't create into infra nodes"
  when: run_tc38_infra_nodes_isolation | default(true) | bool
  block:
    - name: "TC-38: Check infra nodes taints and workload scheduling"
      ansible.builtin.shell: >
        oc get nodes -l node-role.kubernetes.io/infra -o jsonpath='{.items[*].metadata.name}'
      register: tc38_cmd
      changed_when: false
      failed_when: false

    - name: "TC-38: Record Result"
      ansible.builtin.set_fact:
