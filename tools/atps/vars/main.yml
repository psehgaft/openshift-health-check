---
# ==============================================================================
# Acceptance Test Plan (ATP) - Global Configuration & Feature Toggles
# ==============================================================================
# Cluster target version to validate in TC-01
expected_ocp_version: "4.20"

# Directory where generated reports will be stored
atp_report_dir: "{{ playbook_dir }}/../reports"
atp_report_file: "{{ atp_report_dir }}/ATP-Report-OCP418-{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}.md"

# Cluster parameters
cluster_name: "multicnfs"
cluster_domain: "openshift.com"
bastion_fqdn: "bastion.openshift.com"
custom_ingress_url: "apps.{{ cluster_name }}.{{ cluster_domain }}"

# SSH access parameters for node inspection
ssh_user: "core"
ssh_key_path: "~/.ssh/id_rsa"

# Master and Worker reference nodes (auto-discovered if not provided)
app_node_target: ""
master_node_target: ""

# ------------------------------------------------------------------------------
# Test Case Execution Toggles (Allows selective skipping of disruptive/manual tests)
# Set to 'false' to omit specific tasks or pass via extra-vars: -e "run_tc26: false"
# ------------------------------------------------------------------------------
run_tc01_cluster_version: true
run_tc02_cluster_nodes_status: true
run_tc03_dns_resolution: true
run_tc04_dns_operator: true
run_tc05_ntp_synchronization: true
run_tc06_operators_installed: true
run_tc07_web_console_status: true
run_tc08_storage_capacity: true
run_tc09_cpu_ram_capacity: true
run_tc10_etcd_status: true
run_tc11_node_labels: true
run_tc12_check_mcp: true
run_tc13_check_mc: true
run_tc14_check_ports: true
run_tc15_check_crio: true
run_tc16_check_internet_access: true
run_tc17_check_cluster_logs_api: true
run_tc18_check_internal_registry_api: true
run_tc19_check_internal_registry_status: true
run_tc20_check_internal_registry_storage: true
run_tc21_monitoring_stack_status: true
run_tc22_logging_stack_status: true

# Administration
run_tc23_create_namespace: true
run_tc24_create_limitrange: true
run_tc25_create_resourcequota: true
run_tc26_sanity_reboot: false         # Disruptive: Disabled by default
run_tc27_reboot_worker: false         # Disruptive: Disabled by default
run_tc28_install_operator: true
run_tc29_purge_namespace: true
run_tc30_delete_namespace: true
run_tc31_cleanup_worker: true

# Application Management
run_tc32_app_labels: true
run_tc33_app_taints: true
run_tc34_app_affinity: true
run_tc35_app_anti_affinity: true
run_tc36_scale_pods: true
run_tc37_pod_recreation: true
run_tc38_infra_nodes_isolation: true

# Logging Stack
run_tc39_loki_stack_indices: true
run_tc40_loki_stack_logs: true

# Storage Management
run_tc41_storage_class: true
run_tc42_add_pvc_app: true
run_tc43_pvc_persistence_on_deletion: true
run_tc44_remove_pvc_app: true
run_tc45_delete_pvc: true

# Network Management
run_tc46_cno_status: true
run_tc47_pod_communication_namespace: true
run_tc48_expose_tls_route: true

# User Management
run_tc49_create_htpasswd_user: true
run_tc50_assign_cluster_admin: true
run_tc51_disable_self_provisioner: true
run_tc52_ldap_access: true
run_tc53_create_serviceaccount: true
run_tc54_delete_user: true

# Security Management
run_tc55_api_certificate: true
run_tc56_ingress_default_certificate: true
run_tc57_custom_ingress_certificate: true
run_tc58_create_secret: true
run_tc59_assign_secret_to_pod: true
run_tc60_check_ssh_access: true

# Cluster Backup & Restore
run_tc61_etcd_backup: true
run_tc62_etcd_restore: false          # Highly Disruptive: Disabled by default

# General Support & Telco 5G
run_tc63_quay_registry: true
run_tc64_must_gather_sosreport: true
run_tc65_volume_snapshots: true
run_tc66_node_maintenance: true
run_tc67a_storage_iscsi_multipath: true
run_tc67b_network_nncp: true
run_tc68_base_services_ntp_dns: true
run_tc69_rh_registry_connectivity: true
run_tc70_physical_lacp_mtu: true
run_tc71_node_profiling_maxpods: true
run_tc72_performance_hugepages: true
run_tc73_network_acceleration_sriov: true
