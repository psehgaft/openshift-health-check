---
- name: Define report paths
  ansible.builtin.set_fact:
    report_cluster_type: >-
      {{
        report_render_cluster_type
        if (report_render_cluster_type is defined)
        else (
          ((cluster_profile | default({})).get('cluster_classification_label', ''))
          if (((cluster_profile | default({})).get('cluster_classification_label', '') | trim) not in ['', 'unknown'])
          else (
            ((cluster_profile | default({})).get('deployment_type', ''))
            if (((cluster_profile | default({})).get('deployment_type', '') | trim) not in ['', 'unknown'])
            else (
              provider_family
              if (provider_family | default('generic')) != 'generic'
              else (platform_family | default('openshift'))
            )
          )
        )
      }}
    report_cluster_name_source: >-
      {{
        report_render_cluster_name_source
        if (report_render_cluster_name_source is defined)
        else (
          ((cluster_profile | default({})).get('infrastructure_name', ''))
          if (((cluster_profile | default({})).get('infrastructure_name', '') | trim) not in ['', 'unknown'])
          else (oc_context_cmd.stdout | default('cluster') | trim)
        )
      }}
    report_cluster_name: >-
      {{
        report_render_cluster_name
        if (report_render_cluster_name is defined)
        else (
          (
            (
              ((cluster_profile | default({})).get('infrastructure_name', ''))
              if (((cluster_profile | default({})).get('infrastructure_name', '') | trim) not in ['', 'unknown'])
              else (oc_context_cmd.stdout | default('cluster') | trim)
            )
            | lower
            | regex_replace('[^a-z0-9._-]+', '-')
            | regex_replace('^-+', '')
            | regex_replace('-+$', '')
          ) or 'cluster'
        )
      }}

- name: Define report file prefix
  ansible.builtin.set_fact:
    report_file_prefix: "{{ report_render_file_prefix if (report_render_file_prefix is defined) else (report_basename ~ '-' ~ report_cluster_type ~ '-' ~ report_cluster_name ~ '-' ~ report_timestamp) }}"

- name: Define report output files
  ansible.builtin.set_fact:
    report_path: "{{ report_output_dir }}/{{ report_file_prefix }}.md"
    report_json_path: "{{ report_output_dir }}/{{ report_file_prefix }}.json"
    report_html_path: "{{ report_output_dir }}/{{ report_file_prefix }}.html"
    report_pdf_path: "{{ report_output_dir }}/{{ report_file_prefix }}.pdf"
    report_css_path: "{{ playbook_dir }}/../templates/report.css"

- name: Build base live OpenShift execution stats
  ansible.builtin.include_role:
    name: report_common
    tasks_from: build_live_openshift_execution_stats.yml

- name: Build audit rubric
  ansible.builtin.set_fact:
    scored_workload_practice_findings_count: 0
    audit_checks:
      - id: resumed_report_summary
        title: Resumed Report Summary
        severity: "{{ 'critical' if (health_summary.status | default('UNKNOWN')) == 'CRITICAL' else ('warning' if (health_summary.status | default('UNKNOWN')) == 'WARNING' else 'pass') }}"
        score: "{{ 0 if (health_summary.status | default('UNKNOWN')) == 'CRITICAL' else (6 if (health_summary.status | default('UNKNOWN')) == 'WARNING' else 10) }}"
        max_score: 10
        findings_count: "{{ report_collection.failed_commands | default(0) }}"
      - id: collection_completeness
        title: Data Collection Completeness
        severity: "{{ 'critical' if (report_collection.core_failed_commands | default(0) | int > 0) else ('warning' if (report_collection.failed_commands | default(0) | int > 0) else 'pass') }}"
        score: "{{ 0 if (report_collection.core_failed_commands | default(0) | int > 0) else (4 if (report_collection.failed_commands | default(0) | int > 0) else 8) }}"
        max_score: 8
        findings_count: "{{ report_collection.failed_commands | default(0) }}"
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - not ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Build audit rubric
  vars:
    scored_workload_practice_findings_count_resolved: "{{ workload_practice_findings | default([]) | rejectattr('issue', 'equalto', 'missing-pod-disruption-budget') | list | length }}"
  ansible.builtin.set_fact:
    scored_workload_practice_findings_count: "{{ scored_workload_practice_findings_count_resolved }}"
    audit_checks:
      - id: cluster_version
        title: Cluster Version State
        severity: "{{ 'critical' if (cv_failing == 'True' or (cv_available == 'False' and cv_progressing != 'True')) else ('warning' if (cv_progressing == 'True' or cv_available == 'Unknown') else 'pass') }}"
        score: "{{ 0 if (cv_failing == 'True' or (cv_available == 'False' and cv_progressing != 'True')) else (6 if (cv_progressing == 'True' or cv_available == 'Unknown') else 10) }}"
        max_score: 10
        findings_count: "{{ (1 if (cv_failing == 'True' or (cv_available == 'False' and cv_progressing != 'True')) else 0) + (1 if (cv_progressing == 'True' or cv_available == 'Unknown') else 0) }}"
      - id: operators
        title: Cluster Operators
        severity: "{{ 'critical' if (degraded_operators | default([]) | length > 0 or unavailable_operators | default([]) | length > 0) else ('warning' if progressing_operators | default([]) | length > 0 else 'pass') }}"
        score: "{{ 0 if (degraded_operators | default([]) | length > 0 or unavailable_operators | default([]) | length > 0) else (8 if progressing_operators | default([]) | length > 0 else 12) }}"
        max_score: 12
        findings_count: "{{ (degraded_operators | default([]) | length) + (unavailable_operators | default([]) | length) + (progressing_operators | default([]) | length) }}"
      - id: nodes
        title: Node Health
        severity: "{{ 'critical' if not_ready_nodes | default([]) | length > 0 else ('warning' if pressure_nodes | default([]) | length > 0 else 'pass') }}"
        score: "{{ 0 if not_ready_nodes | default([]) | length > 0 else (7 if pressure_nodes | default([]) | length > 0 else 10) }}"
        max_score: 10
        findings_count: "{{ (not_ready_nodes | default([]) | length) + (pressure_nodes | default([]) | length) }}"
      - id: workloads
        title: Workload Health
        severity: "{{ 'critical' if (workload_health_issues | default([]) | length > 0 or unhealthy_user_pods | default([]) | length > 0) else ('warning' if (high_restart_pods | default([]) | length > 0 or high_replica_workloads | default([]) | length > 0 or orphan_pods | default([]) | length > 0 or workload_label_governance_findings | default([]) | length > 0 or workload_resource_findings | default([]) | length > 0 or workload_probe_findings | default([]) | length > 0) else 'pass') }}"
        score: "{{ 2 if (workload_health_issues | default([]) | length > 0 or unhealthy_user_pods | default([]) | length > 0) else (5 if (high_restart_pods | default([]) | length > 0 or high_replica_workloads | default([]) | length > 0 or orphan_pods | default([]) | length > 0 or workload_label_governance_findings | default([]) | length > 0 or workload_resource_findings | default([]) | length > 0 or workload_probe_findings | default([]) | length > 0) else 8) }}"
        max_score: 8
        findings_count: "{{ (workload_health_issues | default([]) | length) + (high_replica_workloads | default([]) | length) + (orphan_pods | default([]) | length) + (workload_label_governance_findings | default([]) | length) + (workload_resource_findings | default([]) | length) + (workload_probe_findings | default([]) | length) + (unhealthy_user_pods | default([]) | length) + (high_restart_pods | default([]) | length) }}"
      - id: routes_network
        title: Network And Routes
        severity: "{{ 'critical' if route_issues | default([]) | length > 0 or ingress_issues | default([]) | length > 0 or route_host_conflicts | default([]) | length > 0 or ingress_host_conflicts | default([]) | length > 0 else 'pass' }}"
        score: "{{ 0 if route_issues | default([]) | length > 0 or ingress_issues | default([]) | length > 0 or route_host_conflicts | default([]) | length > 0 or ingress_host_conflicts | default([]) | length > 0 else 8 }}"
        max_score: 8
        findings_count: "{{ (route_issues | default([]) | length) + (ingress_issues | default([]) | length) + (route_host_conflicts | default([]) | length) + (ingress_host_conflicts | default([]) | length) }}"
      - id: security_practices
        title: Security And Best Practices
        severity: "{{ 'warning' if (auth_findings | default([]) | length > 0 or security_findings | default([]) | length > 0 or privileged_serviceaccount_access | default([]) | length > 0 or privileged_user_access | default([]) | length > 0 or privileged_group_access | default([]) | length > 0 or scored_workload_practice_findings_count | default(0) | int > 0 or namespaces_without_networkpolicy | default([]) | length > 0 or namespaces_missing_ingress_policies | default([]) | length > 0 or namespaces_missing_egress_policies | default([]) | length > 0 or namespaces_without_resourcequota | default([]) | length > 0 or namespaces_without_limitrange | default([]) | length > 0 or image_registry_findings | default([]) | length > 0 or feature_findings | default([]) | length > 0) else 'pass' }}"
        score: "{{ 6 if (auth_findings | default([]) | length > 0 or security_findings | default([]) | length > 0 or privileged_serviceaccount_access | default([]) | length > 0 or privileged_user_access | default([]) | length > 0 or privileged_group_access | default([]) | length > 0 or scored_workload_practice_findings_count | default(0) | int > 0 or namespaces_without_networkpolicy | default([]) | length > 0 or namespaces_missing_ingress_policies | default([]) | length > 0 or namespaces_missing_egress_policies | default([]) | length > 0 or namespaces_without_resourcequota | default([]) | length > 0 or namespaces_without_limitrange | default([]) | length > 0 or image_registry_findings | default([]) | length > 0 or feature_findings | default([]) | length > 0) else 14 }}"
        max_score: 14
        findings_count: "{{ (auth_findings | default([]) | length) + (security_findings | default([]) | length) + (privileged_serviceaccount_access | default([]) | length) + (privileged_user_access | default([]) | length) + (privileged_group_access | default([]) | length) + (scored_workload_practice_findings_count | default(0) | int) + (namespaces_without_networkpolicy | default([]) | length) + (namespaces_missing_ingress_policies | default([]) | length) + (namespaces_missing_egress_policies | default([]) | length) + (namespaces_without_resourcequota | default([]) | length) + (namespaces_without_limitrange | default([]) | length) + (image_registry_findings | default([]) | length) + (feature_findings | default([]) | length) }}"
      - id: unused_resources
        title: Unused Resource Heuristics
        severity: "{{ 'warning' if (empty_user_namespaces | default([]) | length > 0 or services_without_endpoints | default([]) | length > 0 or likely_unused_serviceaccounts | default([]) | length > 0 or likely_unused_configmaps | default([]) | length > 0 or likely_unused_secrets | default([]) | length > 0 or likely_unused_crds | default([]) | length > 0) else 'pass' }}"
        score: "{{ 5 if (empty_user_namespaces | default([]) | length > 0 or services_without_endpoints | default([]) | length > 0 or likely_unused_serviceaccounts | default([]) | length > 0 or likely_unused_configmaps | default([]) | length > 0 or likely_unused_secrets | default([]) | length > 0 or likely_unused_crds | default([]) | length > 0) else 8 }}"
        max_score: 8
        findings_count: "{{ (empty_user_namespaces | default([]) | length) + (services_without_endpoints | default([]) | length) + (likely_unused_serviceaccounts | default([]) | length) + (likely_unused_configmaps | default([]) | length) + (likely_unused_secrets | default([]) | length) + (likely_unused_crds | default([]) | length) }}"
      - id: storage
        title: Storage Health
        severity: "{{ 'warning' if (pv_issues | default([]) | length > 0 or pvc_issues | default([]) | length > 0 or quota_pressure_findings | default([]) | length > 0) else 'pass' }}"
        score: "{{ 5 if (pv_issues | default([]) | length > 0 or pvc_issues | default([]) | length > 0 or quota_pressure_findings | default([]) | length > 0) else 8 }}"
        max_score: 8
        findings_count: "{{ (pv_issues | default([]) | length) + (pvc_issues | default([]) | length) + (quota_pressure_findings | default([]) | length) }}"
      - id: lifecycle
        title: Upgrade, API, And Certificate Lifecycle
        severity: "{{ 'critical' if (expiring_certificates_critical | default([]) | length > 0 or (live_cluster_compare_findings | default([]) | selectattr('severity', 'equalto', 'critical') | list | length > 0) or (live_managed_gate_findings | default([]) | selectattr('severity', 'equalto', 'critical') | list | length > 0)) else ('warning' if (conditional_updates | default([]) | length > 0 or deprecated_crd_findings | default([]) | length > 0 or deprecated_api_lines | default([]) | length > 0 or expiring_certificates_warning | default([]) | length > 0 or live_cluster_compare_findings | default([]) | length > 0 or live_managed_gate_findings | default([]) | length > 0) else 'pass') }}"
        score: "{{ 0 if (expiring_certificates_critical | default([]) | length > 0 or (live_cluster_compare_findings | default([]) | selectattr('severity', 'equalto', 'critical') | list | length > 0) or (live_managed_gate_findings | default([]) | selectattr('severity', 'equalto', 'critical') | list | length > 0)) else (6 if (conditional_updates | default([]) | length > 0 or deprecated_crd_findings | default([]) | length > 0 or deprecated_api_lines | default([]) | length > 0 or expiring_certificates_warning | default([]) | length > 0 or live_cluster_compare_findings | default([]) | length > 0 or live_managed_gate_findings | default([]) | length > 0) else 14) }}"
        max_score: 14
        findings_count: "{{ (conditional_updates | default([]) | length) + (deprecated_crd_findings | default([]) | length) + (deprecated_api_lines | default([]) | length) + (expiring_certificates_warning | default([]) | length) + (live_cluster_compare_findings | default([]) | length) + (live_managed_gate_findings | default([]) | length) }}"
      - id: performance_density
        title: Performance And Density
        severity: "{{ 'critical' if critical_pod_density_nodes | default([]) | length > 0 else ('warning' if (high_pod_density_nodes | default([]) | length > 0 or high_cpu_nodes | default([]) | length > 0 or high_memory_nodes | default([]) | length > 0) else 'pass') }}"
        score: "{{ 0 if critical_pod_density_nodes | default([]) | length > 0 else (6 if (high_pod_density_nodes | default([]) | length > 0 or high_cpu_nodes | default([]) | length > 0 or high_memory_nodes | default([]) | length > 0) else 10) }}"
        max_score: 10
        findings_count: "{{ (critical_pod_density_nodes | default([]) | length) + (high_pod_density_nodes | default([]) | length) + (high_cpu_nodes | default([]) | length) + (high_memory_nodes | default([]) | length) }}"
      - id: alerts_events
        title: Alerts And Warning Events
        severity: "{{ 'warning' if (firing_alerts | default([]) | length > 0 or recent_warning_events | default([]) | length > 0) else 'pass' }}"
        score: "{{ 4 if (firing_alerts | default([]) | length > 0 or recent_warning_events | default([]) | length > 0) else 6 }}"
        max_score: 6
        findings_count: "{{ (firing_alerts | default([]) | length) + (recent_warning_events | default([]) | length) }}"
      - id: observability_posture
        title: Observability And External Forwarding
        severity: "{{ 'warning' if (observability_findings | default([]) | length > 0) else 'pass' }}"
        score: "{{ 4 if (observability_findings | default([]) | length > 0) else 8 }}"
        max_score: 8
        findings_count: "{{ observability_findings | default([]) | length }}"
      - id: resilience_recovery
        title: Recovery And Machine Remediation
        severity: "{{ 'warning' if ((backup_posture_findings | default([]) | length) > 0 or (machine_healthcheck_findings | default([]) | length) > 0) else 'pass' }}"
        score: "{{ 4 if ((backup_posture_findings | default([]) | length) > 0 or (machine_healthcheck_findings | default([]) | length) > 0) else 8 }}"
        max_score: 8
        findings_count: "{{ (backup_posture_findings | default([]) | length) + (machine_healthcheck_findings | default([]) | length) }}"
      - id: day2_posture
        title: Production Day 2 Posture
        severity: "{{ 'critical' if ((scored_day2_posture_findings | default([]) | selectattr('severity', 'equalto', 'critical') | list | length > 0)) else ('warning' if ((scored_day2_posture_findings | default([]) | length > 0) or (live_advisor_findings | default([]) | length > 0) or (live_inspect_findings | default([]) | length > 0) or (live_sosreport_findings | default([]) | length > 0)) else 'pass') }}"
        score: "{{ 0 if ((scored_day2_posture_findings | default([]) | selectattr('severity', 'equalto', 'critical') | list | length > 0)) else (4 if ((scored_day2_posture_findings | default([]) | length > 0) or (live_advisor_findings | default([]) | length > 0) or (live_inspect_findings | default([]) | length > 0) or (live_sosreport_findings | default([]) | length > 0)) else 8) }}"
        max_score: 8
        findings_count: "{{ (scored_day2_posture_findings | default([]) | length) + (live_advisor_findings | default([]) | length) + (live_inspect_findings | default([]) | length) + (live_sosreport_findings | default([]) | length) }}"
      - id: collection_completeness
        title: Data Collection Completeness
        severity: "{{ 'critical' if (report_collection.core_failed_commands | default(0) | int > 0) else ('warning' if (report_collection.failed_commands | default(0) | int > 0) else 'pass') }}"
        score: "{{ 0 if (report_collection.core_failed_commands | default(0) | int > 0) else (4 if (report_collection.failed_commands | default(0) | int > 0) else 8) }}"
        max_score: 8
        findings_count: "{{ report_collection.failed_commands | default(0) }}"
  when: report_run_mode | default('fresh') != 'resume_last_failure'

- name: Build audit score summary
  ansible.builtin.set_fact:
    audit_score_total: "{{ audit_checks | map(attribute='score') | map('int') | list | sum }}"
    audit_score_max: "{{ audit_checks | map(attribute='max_score') | map('int') | list | sum }}"
    audit_critical_checks: "{{ audit_checks | selectattr('severity', 'equalto', 'critical') | map(attribute='id') | list }}"
    audit_warning_checks: "{{ audit_checks | selectattr('severity', 'equalto', 'warning') | map(attribute='id') | list }}"

- name: Build normalized cluster health score
  ansible.builtin.set_fact:
    cluster_health_score: "{{ (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) | round(1) }}"
    cluster_health_score_label: >-
      {{
        'Excellent'
        if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 95 )
        else (
          'Good'
          if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 85 )
          else (
            'Fair'
            if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 70 )
            else (
              'Poor'
              if ( (((audit_score_total | float) / ((audit_score_max | float) if (audit_score_max | float) > 0 else 1.0)) * 100) >= 50 )
              else 'Critical'
            )
          )
        )
      }}
    cluster_health_score_legend:
      - min: 95
        max: 100
        label: Excellent
        meaning: Stable cluster with no material health risks detected.
      - min: 85
        max: 94.9
        label: Good
        meaning: Healthy overall with only limited warnings or hygiene issues.
      - min: 70
        max: 84.9
        label: Fair
        meaning: Noticeable operational debt or warning signals that should be scheduled for remediation.
      - min: 50
        max: 69.9
        label: Poor
        meaning: Multiple risks or degraded areas that require active remediation.
      - min: 0
        max: 49.9
        label: Critical
        meaning: Serious cluster health problems or blocking risks are present.

- name: Build report confidence facts
  ansible.builtin.set_fact:
    report_collection_success_rate_pct: "{{ ((((report_collection.succeeded_commands | default(0) | float) / ((report_collection.applicable_command_count | default(report_collection.command_count | default(0)) | float) if (report_collection.applicable_command_count | default(report_collection.command_count | default(0)) | float) > 0 else 1.0)) * 100) | round(1)) }}"
    report_confidence: >-
      {{
        'low'
        if (
          (report_collection.core_failed_commands | default(0) | int) > 0
          or (cluster_current_state_build_error | default('') | trim | length > 0)
        )
        else (
          'medium'
          if (
            (report_collection.failed_commands | default(0) | int) > 0
            or (report_collection.timed_out_commands | default(0) | int) > 0
          )
          else 'high'
        )
      }}
    report_confidence_detail: >-
      {{
        'core collection commands failed or the detailed state summarizer fell back to direct fact counts'
        if (
          (report_collection.core_failed_commands | default(0) | int) > 0
          or (cluster_current_state_build_error | default('') | trim | length > 0)
        )
        else (
          'some non-core collection commands failed, timed out, or were denied by RBAC; rerun with cluster-admin for full report detail'
          if (
            (report_collection.failed_commands | default(0) | int) > 0
            or (report_collection.timed_out_commands | default(0) | int) > 0
            or ((report_collection_skipped_optional_commands | default([]) | selectattr('category', 'equalto', 'optional-access-denied') | list | length) > 0)
          )
          else 'all planned collection commands completed and the synthesized state data was built successfully'
        )
      }}

- name: Initialize suggested next steps
  ansible.builtin.set_fact:
    suggested_next_steps: []
  when: report_run_mode | default('fresh') != 'resume_last_failure'

- name: Build suggested next steps for resumed runs
  ansible.builtin.set_fact:
    suggested_next_steps:
      - priority: summary
        summary: Resume completed from the saved analysis checkpoint.
        detail: Resume mode reused the saved collection and analysis state to finish report generation. Use a fresh run if you need the full end-to-end collection and scoring path rebuilt from the cluster again.
      - priority: next
        summary: Review the report findings and rerun fresh after major remediation.
        detail: Use this resumed report for current triage, then rerun with `report_run_mode=fresh` after fixes so collection, analysis, and reporting are regenerated from live cluster state.
  when:
    - report_run_mode | default('fresh') == 'resume_last_failure'
    - not ((report_resume_artifact_plan | default({})).get('report', {}).get('bundle_reusable', false) | bool)

- name: Add suggested next step for collection failures
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'immediate',
      'summary': 'Fix collection failures and rerun the report.',
      'detail': 'Start with failed or timed out commands in Data Collection, confirm `oc` access and permissions, then rerun so later sections reflect complete data.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (report_collection.failed_commands | default(0) | int) > 0

- name: Add suggested next step for access-denied detail collection
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'planned',
      'summary': 'Rerun with cluster-admin to collect full report detail.',
      'detail': 'Some optional queries were denied by RBAC in this run. The report is still usable, but cluster-admin access is recommended if you want complete identity, SCC, monitoring, GitOps, and other platform-detail sections.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (report_collection_skipped_optional_commands | default([]) | selectattr('category', 'equalto', 'optional-access-denied') | list | length) > 0

- name: Add suggested next step for operator degradation
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'immediate',
      'summary': 'Stabilize degraded, unavailable, or progressing operators first.',
      'detail': 'Review Cluster Operators and related operand namespaces, clear degraded conditions, and wait for operators to return to `Available=True`, `Progressing=False`, and `Degraded=False` before lower-priority cleanup.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (degraded_operators | default([]) | length > 0) or (unavailable_operators | default([]) | length > 0)

- name: Add suggested next step for node readiness or pressure
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'immediate',
      'summary': 'Restore node readiness and remove node pressure.',
      'detail': 'Drain or repair NotReady nodes, investigate kubelet/runtime/storage causes, and clear sustained MemoryPressure, DiskPressure, or PIDPressure before workload changes.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (not_ready_nodes | default([]) | length > 0) or (pressure_nodes | default([]) | length > 0)

- name: Add suggested next step for traffic path issues
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'immediate',
      'summary': 'Repair traffic path issues in route, ingress, and service backends.',
      'detail': 'Resolve unadmitted routes, ingress misconfiguration, host conflicts, and missing backend services/endpoints, then verify application reachability from both cluster and external paths.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (route_issues | default([]) | length > 0) or (ingress_issues | default([]) | length > 0) or (route_host_conflicts | default([]) | length > 0) or (ingress_host_conflicts | default([]) | length > 0)

- name: Add suggested next step for APIService issues
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'immediate',
      'summary': 'Resolve unavailable APIService registrations.',
      'detail': 'Review aggregated API services that are not reporting `Available=True`, verify their backing services and CA bundles, and restore registration health before relying on dependent platform features.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - apiservice_issues | default([]) | length > 0

- name: Add suggested next step for certificate or upgrade risks
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'immediate',
      'summary': 'Resolve certificate expiry and upgrade-blocking risks.',
      'detail': 'Renew secrets nearing expiry, review conditional update risks, and confirm the cluster is upgrade-ready before scheduling version changes.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (expiring_certificates_critical | default([]) | length > 0) or (conditional_updates | default([]) | length > 0)

- name: Add suggested next step for topology resilience
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'next',
      'summary': 'Review worker topology resilience and correct confirmed zone or MachineSet spread gaps.',
      'detail': 'Validate worker node and MachineSet zone labels, single-zone worker pools, and uneven MachineSet replica counts. Rebalance capacity only when the collected topology evidence confirms that worker placement does not meet the customer failure-domain standard.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (topology_resilience.single_zone_worker_pool_count | default(0) | int) > 0 or (topology_resilience.worker_nodes_without_zone_label | default(0) | int) > 0 or (topology_resilience.worker_zone_spread_unbalanced | default(false) | bool) or (topology_resilience.machinesets_without_zone_label | default(0) | int) > 0 or (topology_resilience.machineset_replica_unbalanced | default(false) | bool)

- name: Add suggested next step for workload health and probes
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'next',
      'summary': 'Harden workload rollout health and probe coverage.',
      'detail': 'Fix rollout gaps, add missing liveness/readiness/startup probes, and investigate restart hotspots so workloads fail fast and recover predictably.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (workload_health_issues | default([]) | length > 0) or (high_replica_workloads | default([]) | length > 0) or (orphan_pods | default([]) | length > 0) or (workload_label_governance_findings | default([]) | length > 0) or (workload_resource_findings | default([]) | length > 0) or (workload_probe_findings | default([]) | length > 0) or (unhealthy_user_pods | default([]) | length > 0) or (high_restart_pods | default([]) | length > 0)

- name: Add suggested next step for storage or quota pressure
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'next',
      'summary': 'Review storage health and namespace quota pressure.',
      'detail': 'Resolve PV/PVC phase problems, confirm storage class behavior, and raise or rebalance quotas for namespaces approaching hard limits.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (pv_issues | default([]) | length > 0) or (pvc_issues | default([]) | length > 0) or (quota_pressure_findings | default([]) | length > 0)

- name: Add suggested next step for node growth headroom
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'next',
      'summary': 'Review node growth headroom before adding more nodes.',
      'detail': 'Check the estimated max nodes from pod-network allocation, remaining node slots, and node IP availability so cluster scaling does not exhaust network space.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (((cluster_current_state.node_growth_capacity.additional_nodes_by_pod_network | default('unknown')) != 'unknown') and ((cluster_current_state.node_growth_capacity.additional_nodes_by_pod_network | int) <= 3)) or (((cluster_current_state.node_growth_capacity.node_ips_available | default('unknown')) != 'unknown') and ((cluster_current_state.node_growth_capacity.node_ips_available | int) <= 3))

- name: Add suggested next step for external storage provider posture
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'next',
      'summary': 'Add or validate an external persistent storage provider.',
      'detail': 'The cluster did not show evidence of external persistent storage from StorageClasses or PV backends. Review whether workloads rely on local hostPath, local PVs, or ephemeral volumes only, and add a supported shared or external storage provider where persistence is required.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (not (storage_posture_summary.has_external_storage_provider | default(false) | bool)) or (storage_posture_summary.local_or_ephemeral_only_risk | default(false) | bool)

- name: Add suggested next step for backup posture
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'next',
      'summary': 'Validate backup freshness and restore evidence.',
      'detail': 'Confirm backup storage locations are available, schedules are active, recent backups are completing successfully, and at least one restore path has been exercised with evidence.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - backup_posture_findings | default([]) | length > 0

- name: Add suggested next step for MachineHealthCheck posture
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'next',
      'summary': 'Configure or repair MachineHealthCheck remediation.',
      'detail': 'Ensure Machine API-managed worker pools are covered by MachineHealthCheck resources, remove paused remediation where inappropriate, and confirm selectors target the intended worker pools.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - machine_healthcheck_findings | default([]) | length > 0

- name: Add suggested next step for production Day 2 posture
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'planned',
      'summary': 'Close production Day 2 platform gaps.',
      'detail': 'Review the Day 2 posture section for missing GitOps, external secrets integration, monitoring persistence, external telemetry forwarding, autoscaling, backup, compliance, identity, and Insights capabilities expected on a production OpenShift cluster.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - scored_day2_posture_findings | default([]) | length > 0
- name: Add suggested next step for hygiene and policy cleanup
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'planned',
      'summary': 'Use the report for hygiene, rightsizing, and policy cleanup.',
      'detail': 'After platform health is stable, review overprovisioned workloads, unused-resource heuristics, privileged RBAC grants, and other security/best-practice findings to reduce risk, waste, and operational drift.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (overprovisioned_pods | default([]) | length > 0) or (empty_user_namespaces | default([]) | length > 0) or (likely_unused_serviceaccounts | default([]) | length > 0) or (likely_unused_configmaps | default([]) | length > 0) or (likely_unused_secrets | default([]) | length > 0) or (likely_unused_crds | default([]) | length > 0) or (security_findings | default([]) | length > 0) or (privileged_serviceaccount_access | default([]) | length > 0) or (privileged_user_access | default([]) | length > 0) or (privileged_group_access | default([]) | length > 0) or (scored_workload_practice_findings_count | default(0) | int > 0)

- name: Add suggested next step for SCC and delivery posture
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'planned',
      'summary': 'Review SCC, image management, and pipeline posture.',
      'detail': 'Inspect high-risk SCC grants, image-registry posture, build configuration triggers, and failed pipeline runs so delivery workflows and admission posture align with platform policy.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (scc_grant_findings | default([]) | length > 0) or (image_registry_findings | default([]) | length > 0) or (failed_pipelineruns | default([]) | length > 0) or (buildconfigs_without_triggers | default([]) | length > 0)

- name: Add suggested next step for resilience and compliance tooling
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'planned',
      'summary': 'Validate resilience and compliance tooling coverage.',
      'detail': 'Review recovery signals such as snapshot class and data protection coverage, and inspect any non-compliant ComplianceSuite results or missing suite coverage before treating posture as complete.'
    }] }}"
  vars:
    graph: "{{ analysis_graph | default({}) }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - ((graph.compliancesuites | default({})).get('items', []) | length > 0) or ((graph.volumesnapshotclasses | default({})).get('items', []) | length > 0) or ((graph.dataprotectionapplications | default({})).get('items', []) | length > 0)

- name: Add suggested next step for observability posture
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'planned',
      'summary': 'Improve observability coverage and external forwarding posture.',
      'detail': 'Confirm monitoring health, log forwarding outputs, and remote-write targets so operational data is retained outside the cluster and available during incidents.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - observability_findings | default([]) | length > 0

- name: Add suggested next step for steady-state review
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'steady-state',
      'summary': 'Continue steady-state review and trend tracking.',
      'detail': 'No major health risks were detected in this run; keep periodic reviews, compare future reports, and investigate meaningful score or signal drift early.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - (report_collection.failed_commands | default(0) | int) == 0
    - health_summary.status == 'HEALTHY'
    - (cluster_health_score | float) >= 85

- name: Add suggested next step for critical-summary remediation
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'summary',
      'summary': 'Treat this run as critical and work top-down from platform health.',
      'detail': 'Use this order of operations: collection completeness, operators, nodes, traffic path, certificates and upgrade blockers, then workload and hygiene remediation.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - health_summary.status == 'CRITICAL'
    - (report_collection.failed_commands | default(0) | int) == 0
    - (degraded_operators | default([]) | length) == 0
    - (unavailable_operators | default([]) | length) == 0
    - (not_ready_nodes | default([]) | length) == 0
    - (pressure_nodes | default([]) | length) == 0
    - (route_issues | default([]) | length) == 0
    - (ingress_issues | default([]) | length) == 0
    - (route_host_conflicts | default([]) | length) == 0
    - (ingress_host_conflicts | default([]) | length) == 0
    - (expiring_certificates_critical | default([]) | length) == 0
    - (conditional_updates | default([]) | length) == 0

- name: Add suggested next step for warning-summary remediation
  ansible.builtin.set_fact:
    suggested_next_steps: "{{ suggested_next_steps + [{
      'priority': 'summary',
      'summary': 'Plan near-term remediation from the warning findings.',
      'detail': 'The cluster is currently usable, but warning items should be assigned, tracked to closure, and revisited in the next report run.'
    }] }}"
  when:
    - report_run_mode | default('fresh') != 'resume_last_failure'
    - health_summary.status == 'WARNING'
    - (report_collection.failed_commands | default(0) | int) == 0
    - (workload_health_issues | default([]) | length) == 0
    - (high_replica_workloads | default([]) | length) == 0
    - (orphan_pods | default([]) | length) == 0
    - (workload_label_governance_findings | default([]) | length) == 0
    - (workload_probe_findings | default([]) | length) == 0
    - (high_restart_pods | default([]) | length) == 0
    - (pv_issues | default([]) | length) == 0
    - (pvc_issues | default([]) | length) == 0
    - (quota_pressure_findings | default([]) | length) == 0
    - (overprovisioned_pods | default([]) | length) == 0
    - (empty_user_namespaces | default([]) | length) == 0
    - (likely_unused_serviceaccounts | default([]) | length) == 0
    - (likely_unused_configmaps | default([]) | length) == 0
    - (likely_unused_secrets | default([]) | length) == 0
    - (likely_unused_crds | default([]) | length) == 0
    - (security_findings | default([]) | length) == 0
    - (scored_workload_practice_findings_count | default(0) | int) == 0
    - (observability_findings | default([]) | length) == 0

- name: Build live evidence and supportability facts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: build_live_openshift_support_facts.yml

- name: Load OpenShift shared artifacts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: load_openshift_shared_artifacts.yml

- name: Load OpenShift posture artifacts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: load_openshift_posture_artifacts.yml

- name: Load OpenShift capability artifacts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: load_openshift_capability_artifacts.yml

- name: Build shared OpenShift domain payload
  ansible.builtin.include_role:
    name: report_common
    tasks_from: build_openshift_domain_payload.yml

- name: Build shared OpenShift report payload
  ansible.builtin.include_role:
    name: report_common
    tasks_from: build_openshift_report_payload.yml

- name: Build live OpenShift audit payload
  ansible.builtin.include_role:
    name: report_common
    tasks_from: build_live_openshift_audit_payload.yml

- name: Build shared report conversion capability facts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: build_report_conversion_capabilities.yml

- name: Finalize live OpenShift execution stats before rendering artifacts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: update_live_openshift_execution_stats_pre_render.yml

- name: Render live OpenShift report artifacts
  ansible.builtin.include_role:
    name: report_common
    tasks_from: render_report_artifacts.yml
  vars:
    report_markdown_template: "{{ playbook_dir }}/../templates/openshift_cluster_health_report.md.j2"

- name: Update live OpenShift generated format status
  ansible.builtin.include_role:
    name: report_common
    tasks_from: update_live_openshift_execution_stats_post_render.yml

- name: Set final checkpoint metadata for rendered report
  ansible.builtin.set_fact:
    report_resume_last_completed_stage: render
    report_resume_last_resume_next_stage: ""

- name: Show live OpenShift report locations
  ansible.builtin.include_role:
    name: report_common
    tasks_from: show_report_locations.yml
  vars:
    report_status_value: "{{ health_summary.status | default('UNKNOWN') }}"
    report_score_total: "{{ audit_score_total }}"
    report_score_max: "{{ audit_score_max }}"
    report_health_score: "{{ cluster_health_score }}"
    report_health_score_label: "{{ cluster_health_score_label }}"
